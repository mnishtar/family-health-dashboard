<style>
:root {
  --ground:#f4f6f5; --surface:#ffffff; --surface-2:#eef2f0;
  --ink:#16191b; --ink-2:#454d4a; --muted:#6b7370;
  --line:#e2e6e3; --line-strong:#cfd6d2;
  --accent:#075c48; --series:#0e8a6b; --soft:#d3ece4;
  --train:#c2600f; --train-soft:#f6e3d2;
  --swim:#1f6f9b;  --swim-soft:#d9e9f3;
  --warn:#8a4a12; --warn-soft:#f6ecdf;
  --sleep:#4f5bd5; --sleep-soft:#e4e6fb;
  --work:#a4640a;  --work-soft:#f7ead3;
  --shadow:0 1px 2px rgba(9,26,21,.05), 0 8px 24px -16px rgba(9,26,21,.25);
  --display:"Newsreader",Georgia,serif;
  --body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground:#101312; --surface:#191d1c; --surface-2:#212725;
    --ink:#f2f4f3; --ink-2:#c8d0cc; --muted:#97a19d;
    --line:#2a302e; --line-strong:#3a423f;
    --accent:#28a583; --series:#28a583; --soft:#1e3b34;
    --train:#cf7a33; --train-soft:#3a2a1a;
    --swim:#59a6cf;  --swim-soft:#16303e;
    --warn:#e0a86a; --warn-soft:#2a2318;
    --sleep:#8d97ec; --sleep-soft:#20244a;
    --work:#e2a64a;  --work-soft:#3a2c14;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}

* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; }
img { max-width:100%; }
[hidden] { display:none !important; }

.wrap { max-width:640px; margin:0 auto; padding:28px 18px 72px;
  display:flex; flex-direction:column; gap:26px; }
h1,h2 { margin:0; font-family:var(--display); font-weight:500;
  letter-spacing:-0.01em; text-wrap:balance; }
h1 { font-size:28px; line-height:1.15; }
h2 { font-size:18px; }
p { margin:0; }
a { color:var(--accent); text-underline-offset:3px; }

.eyebrow { font-size:11px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); }
.masthead { display:flex; flex-direction:column; gap:6px; }
.masthead .sub { color:var(--muted); font-size:14px; }

.card { background:var(--surface); border:1px solid var(--line);
  border-radius:14px; padding:18px; box-shadow:var(--shadow); }
.dashed { border:1px dashed var(--line-strong); border-radius:14px; padding:18px; }
.section-head { display:flex; align-items:baseline; justify-content:space-between;
  gap:12px; margin-bottom:10px; }

select, input, button { font-family:inherit; font-size:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

.field { width:100%; border:1px solid var(--line-strong); background:var(--surface);
  border-radius:11px; padding:13px 15px; font-size:16px; }
.btn { border:none; border-radius:11px; background:var(--accent); color:#fff;
  font-weight:600; padding:13px 20px; cursor:pointer; white-space:nowrap; font-size:15px; }
@media (prefers-color-scheme: dark) { .btn { color:#08120f; } }
.btn:disabled { opacity:.4; cursor:default; }
.btn-quiet { background:none; border:1px solid var(--line-strong); color:var(--ink);
  font-weight:500; padding:9px 15px; border-radius:999px; cursor:pointer; font-size:13px; }
.linkbtn { background:none; border:none; padding:0; color:var(--accent);
  font-size:13px; font-weight:500; text-decoration:underline;
  text-underline-offset:3px; cursor:pointer; }

.whoami { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 14px; border:1px solid var(--line); border-radius:999px;
  background:var(--surface); }
.whoami .label { font-size:14px; color:var(--muted); }
.whoami select { border:1px solid var(--line-strong); background:var(--surface);
  border-radius:999px; padding:6px 12px; font-weight:500; font-size:14px; }

.addrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap;

  background:var(--surface); box-shadow:var(--shadow); margin-top:-16px; }
.addrow input { flex:1; min-width:150px; }

input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
input[type=number] { -moz-appearance:textfield; }
.hint { margin-top:9px; font-size:13px; color:var(--muted); min-height:19px; }
.hint.ok { color:var(--accent); }
.hint.bad { color:var(--warn); }

.range { display:flex; gap:6px; }
.range button { border:1px solid var(--line); background:none; border-radius:999px;
  padding:5px 12px; font-size:12px; font-weight:500; color:var(--muted); cursor:pointer; }
.range button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent);
  background:var(--soft); }

.chart { position:relative; }
.chart svg { display:block; width:100%; height:96px; touch-action:none; }
.axis { display:flex; font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:4px; }
.axis span { text-align:center; overflow:hidden; }

.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
.stat { border-top:1px solid var(--line); padding-top:9px; }
.stat b { display:block; font-family:var(--mono); font-size:19px; font-weight:500;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.stat span { font-size:11px; color:var(--muted); }

.roster { border:1px solid var(--line); border-radius:14px; overflow:hidden;
  background:var(--surface); box-shadow:var(--shadow); }
.person { display:flex; align-items:center; gap:12px; padding:12px 14px;
  border-top:1px solid var(--line); }
.person:first-child { border-top:none; }
.dot { width:34px; height:34px; flex:none; border-radius:50%; display:grid;
  place-items:center; font-size:11px; font-weight:600; }
.person .who { flex:1; min-width:0; }
.person .name { display:flex; align-items:baseline; gap:7px; }
.person .name strong { font-weight:600; font-size:14px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.person .name em { font-style:normal; font-size:11px; color:var(--muted); }
.person .sub2 { display:flex; gap:6px; margin-top:4px; min-height:17px;
  overflow:hidden; }
.person.did .dot { box-shadow:0 0 0 2px var(--soft); }
.person .num { text-align:right; flex:none; }
.person .num b { display:block; font-family:var(--mono); font-weight:500;
  font-size:15px; font-variant-numeric:tabular-nums; }
.person .num span { font-size:11px; color:var(--muted); white-space:nowrap; }
.person .num span.met { color:var(--accent); font-weight:500; }


.note { font-size:13px; color:var(--muted); }
/* V1.6 — the lead domino. Steps is the ONE thing, so it is the only
   number on the screen rendered at a size you can read across a room. */
.domino { text-align:center; padding:4px 0 2px; }
.domino .big { font-family:var(--mono); font-size:56px; line-height:1;
  font-weight:500; letter-spacing:-.04em; color:var(--ink); display:block; }
.domino .of { display:inline-block; margin-top:7px; font-size:12px; color:var(--muted);
  letter-spacing:.02em; background:none; border:none; font-family:inherit;
  padding:2px 4px; cursor:pointer; text-decoration:underline dotted;
  text-underline-offset:3px; text-decoration-color:var(--line-strong); }
.domino .of b { color:var(--series); font-weight:600; }

/* The seven days shrink to a strip. Still the form, just no longer the
   loudest thing on the screen. */
.strip { margin-top:14px; }
.strip .chart svg { height:46px; }
.bigedit { display:block; width:100%; border:none; background:none; text-align:center;
  font-family:var(--mono); font-size:56px; line-height:1; font-weight:500;
  letter-spacing:-.04em; padding:2px 0 4px; border-radius:12px; caret-color:currentColor; }
.bigedit::placeholder { color:var(--line-strong); }
.bigedit:focus { outline:none; background:var(--surface-2); }
/* V3.5. Rest and Rise: a big time, four nudges, Now. */
.tclock { display:flex; flex-direction:column; align-items:center; }
.tbig { font-family:var(--mono); font-size:clamp(52px, 17vw, 72px); font-weight:500; letter-spacing:-.03em;
  line-height:1.05; }
.tbig small { font-size:.36em; margin-left:6px; letter-spacing:0; color:var(--muted); font-weight:600; }
.tbig.unset { opacity:.32; }
.tnudge { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; width:100%; margin-top:14px; }
.tnudge button { border:1px solid var(--line-strong); background:var(--surface); border-radius:12px;
  padding:12px 0; font-family:var(--mono); font-size:16px; font-weight:500; color:var(--ink); cursor:pointer;
  touch-action:manipulation; }
.tnudge button:active { background:var(--surface-2); transform:scale(.97); }
/* ---------- the pyramid ----------------------------------------------
   Four rows of one, two, three and four. Each row is a grid of N equal
   columns inset by (4-N) half-columns, so the rows centre on each other
   and every tile in a row is the same width — which is what the V2.5
   version got wrong: tiles of three different widths never line up, and
   the eye reads the mess before it reads the ranking.
   Each tile is a square. A square at any width is the one shape that
   scales down a phone without the text reflowing into a different
   number of lines per row. */
/* ---------- the popup ------------------------------------------------ */
.modal { position:fixed; inset:0; z-index:50; display:grid; place-items:center;

  padding:26px 20px 18px; text-align:center;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.5); animation:mrise .2s ease both; }
@keyframes mrise { from { transform:translateY(10px) scale(.98); } to { transform:none; } }

.mmark { font-size:30px; line-height:1; margin-bottom:10px; }

.mbtns { display:flex; flex-direction:column; gap:9px; margin-top:20px; }

  font-size:15px; font-weight:600; cursor:pointer; line-height:1.25; }

.mbtn.ok    { background:#4caf6e; color:#fff; }
.mbtns.row { flex-direction:row; }
.mbtns.row .mbtn { flex:1; }
@media (prefers-color-scheme: dark) { .mbtn.go { color:#08120f; } .mbtn.bad { color:#f09a82; } }

/* ---------- the work timer --------------------------------------------- */
.workcard { text-align:center; }
.ring { position:relative; width:min(236px, 70vw); aspect-ratio:1/1; margin:8px auto 0; }
.ring svg { width:100%; height:100%; transform:rotate(-90deg); display:block; }

.rin .rsub { font-size:12.5px; color:var(--muted); }
.workbtns { display:flex; justify-content:center; gap:10px; margin-top:16px; }

.workgo { background:var(--work) !important; }

.rclock { border:none; background:none; padding:0; cursor:pointer; color:inherit; font:inherit; }

  padding:4px 6px; cursor:pointer; }
.workline { border-color:var(--work) !important; color:var(--work) !important; }

/* V3.2. The day's total, typed or timed, as one quiet line. */

/* Shared by the Goals tactic lists. */

  cursor:pointer; padding:0 4px; }
.tadd { display:flex; gap:8px; margin-top:14px; }
.tadd .field { flex:1; }

/* ---------- Tasks: one list, four boxes ---------------------------------- */
.tseg { display:flex; width:100%; margin:0 0 14px; }
.tseg button { flex:1; font-size:13.5px; padding:8px 0; }
.tquick { position:sticky; top:0; z-index:5; background:var(--ground); padding:4px 0 10px; }
/* V3.4. One list, one colour. */
.stray, .sany, .sgrid, .ssheet, .tdone { --qc:var(--work); }
.trank { flex:none; width:20px; font-family:var(--mono); font-size:13px; font-weight:600; color:var(--qc);
  text-align:center; font-variant-numeric:tabular-nums; }
.tr .tdrag { margin-left:2px; }
.tsubn { font-family:var(--mono); font-size:11px; color:var(--muted); margin-left:4px; }
.tpick select { position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; }
.tm .tx { flex:none; }
.tl .ts { margin-left:36px; }
.tl .tsubin { margin-left:70px; width:calc(100% - 70px); }
.tl .tebar { padding-left:36px; }
.tquick .field { width:100%; box-sizing:border-box; font-size:16px; padding:13px 14px; }
.tbuckets { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:8px; }
.tbk { border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:9px 0;
  font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink-2); cursor:pointer; }
.tbk.q1 { --qc:var(--work); } .tbk.q2 { --qc:var(--accent); }

.tqhint { margin:7px 2px 0; font-size:12px; color:var(--muted); }
.tgroup { margin-top:16px; }
.tgroup.q1 { --qc:var(--work); } .tgroup.q2 { --qc:var(--accent); }
.tgroup.q3 { --qc:var(--swim); } .tgroup.q4 { --qc:var(--muted); }
.tgh { display:flex; align-items:baseline; gap:8px; padding:0 2px 6px;
  border-bottom:2px solid var(--qc); }
.tgh b { font-family:var(--display); font-weight:500; font-size:20px; color:var(--ink); }
.tgh span { flex:1; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.tgh em { font-style:normal; font-family:var(--mono); font-size:13px; color:var(--qc); }
.tempty { margin:10px 2px 0; font-size:13px; color:var(--muted); }
.tl { list-style:none; margin:0; padding:0; }
.tm { border-bottom:1px solid var(--line); background:var(--ground); }
.tm.drag { background:var(--surface); box-shadow:var(--shadow); border-radius:10px; position:relative; z-index:3; }
.tr { display:flex; align-items:center; gap:10px; min-height:50px; }
.tdrag { flex:none; width:18px; height:34px; display:grid; place-items:center; cursor:grab;
  touch-action:none; color:var(--line-strong); }
.tdrag svg { width:10px; height:16px; fill:currentColor; }
.tck { flex:none; width:24px; height:24px; border-radius:50%; border:2px solid var(--qc, var(--line-strong));
  background:none; padding:0; cursor:pointer; position:relative; }
.tck[aria-pressed="true"] { background:var(--qc, var(--ink-2)); border-color:var(--qc, var(--ink-2)); }
.tck[aria-pressed="true"]::after { content:"\2713"; position:absolute; inset:0; display:grid;
  place-items:center; color:#fff; font-size:13px; font-weight:700; }

.tt { flex:1; min-width:0; border:none; background:none; padding:12px 0; text-align:left;

.tt.sm { font-size:15px; padding:7px 0; color:var(--ink-2); }
.tedit { flex:1; min-width:0; border:none; border-bottom:1.5px solid var(--qc, var(--work)); background:none;
  font-family:inherit; font-size:16.5px; color:var(--ink); padding:10px 0; border-radius:0; }
.tedit.sm { font-size:16px; padding:6px 0; }
.tedit:focus { outline:none; }
.tsch { flex:none; font-family:var(--mono); font-size:11.5px; color:var(--qc); background:color-mix(in oklab, var(--qc) 10%, transparent);

.ts { list-style:none; margin:-4px 0 6px 52px; padding:0; }
.tsx { display:flex; align-items:center; gap:9px; }

  border-bottom:1.5px dashed var(--line-strong); background:none; font-family:inherit; font-size:16px;
  color:var(--ink); padding:7px 0; border-radius:0; }

.tebar { padding:2px 0 12px 52px; }
.terow { display:flex; align-items:center; gap:14px; margin-top:10px; flex-wrap:wrap; }

.terow .tdel { color:#b3422a; }

.tdh { display:flex; align-items:center; justify-content:space-between; }

.tm.done .tt { text-decoration:line-through; color:var(--muted); cursor:default; }

.tq { font-style:normal; font-size:11px; color:var(--muted); }

/* ---------- the schedule ------------------------------------------------- */
.sday { padding-top:12px; padding-bottom:12px; }
.stray { margin:14px 0 6px; }
.schips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.schip { border:1.5px solid var(--line); background:var(--surface); border-radius:99px; padding:8px 13px;
  font-family:inherit; font-size:14px; color:var(--ink); cursor:pointer; max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.schip.q1 { --qc:var(--work); } .schip.q2 { --qc:var(--accent); }
.schip.q3 { --qc:var(--swim); } .schip.q4 { --qc:var(--muted); }
.schip { border-left:4px solid var(--qc); }
.schip.on { background:var(--qc); color:#fff; border-color:var(--qc); }
.schip small { margin-left:6px; font-size:11px; opacity:.75; }
.sarm { min-height:18px; margin:8px 2px 0; font-size:13px; color:var(--muted); }
.sgrid { position:relative; margin:8px 0 24px 46px; border-left:1px solid var(--line); cursor:default; }
.sgrid.armed { cursor:copy; background:repeating-linear-gradient(0deg, transparent 0 13px, color-mix(in oklab, var(--work) 5%, transparent) 13px 14px); }
.shr { position:absolute; left:0; right:0; border-top:1px solid var(--line); height:0; pointer-events:none; }
.shr span { position:absolute; left:-46px; top:-8px; width:40px; text-align:right; font-family:var(--mono);
  font-size:10.5px; color:var(--muted); }
.snow { position:absolute; left:-4px; right:0; border-top:2px solid #d0452f; pointer-events:none; z-index:2; }
.snow::before { content:""; position:absolute; left:-4px; top:-5px; width:8px; height:8px; border-radius:50%; background:#d0452f; }
/* A block is text from the top-left, never centred: a button centres its
   content, which on a half-hour block pushed the title out of sight. */
.sblk { position:absolute; left:6px; right:4px; border:none; border-radius:8px; padding:4px 8px; text-align:left;
  font-family:inherit; color:var(--ink); cursor:pointer; overflow:hidden; display:flex; align-items:flex-start;
  gap:7px; line-height:1.25; box-sizing:border-box;
  background:color-mix(in oklab, var(--qc) 16%, var(--surface)); border-left:4px solid var(--qc); z-index:1; }
.sblk.q1 { --qc:var(--work); } .sblk.q2 { --qc:var(--accent); }
.sblk.q3 { --qc:var(--swim); } .sblk.q4 { --qc:var(--muted); }
.sblk .tck { margin-top:1px; }
.sbt { flex:1; min-width:0; }
.sblk b { font-size:14px; font-weight:600; }
.sblk.done { opacity:.55; }
.sblk.done b { text-decoration:line-through; }
.sblk small { font-family:var(--mono); font-size:10.5px; color:var(--ink-2); margin-left:6px; white-space:nowrap; }
.sblk.sel { box-shadow:0 0 0 2px var(--qc); }
.ssheet { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface);
  border-top:1px solid var(--line); box-shadow:0 -8px 30px rgba(0,0,0,.12); padding:14px 16px 20px;
  border-radius:16px 16px 0 0; max-width:560px; margin:0 auto; }
.ssh { display:flex; flex-direction:column; gap:2px; }
.ssh b { font-size:16px; }
.ssh span { font-family:var(--mono); font-size:12px; color:var(--muted); }
.sadj { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:12px; }
.sadj button { border:1px solid var(--line); background:var(--ground); border-radius:10px; padding:10px 0;
  font-family:inherit; font-size:13px; color:var(--ink); cursor:pointer; }
.sact { display:flex; gap:8px; margin-top:10px; }
.sact .btn, .sact .btn-quiet { flex:1; padding:11px 6px; font-size:13.5px; }

/* ---------- Goals: the 12 Week Year ------------------------------------ */
.gbars { position:relative; display:grid; grid-template-columns:repeat(12, 1fr); gap:4px;
  margin-top:16px; }
.gbar { border:none; background:none; padding:0; font-family:inherit; cursor:pointer;
  display:flex; flex-direction:column; align-items:stretch; gap:3px; }
.gbar:disabled { cursor:default; }
.gbar .gt { height:56px; border-radius:5px; background:var(--surface-2);
  display:flex; align-items:flex-end; overflow:hidden; }
.gbar .gt i { display:block; width:100%; background:var(--line-strong); border-radius:4px 4px 0 0; }
.gbar.win .gt i { background:var(--work); }
.gbar.fut .gt { background:none; border:1px dashed var(--line); }
.gbar.sel .gt { box-shadow:0 0 0 2px var(--ink); }
.gbar span { font-family:var(--mono); font-size:10px; color:var(--muted); text-align:center; }
.gbar.sel span { color:var(--ink); font-weight:600; }
/* The 85% bar the week is judged against, drawn across all twelve. */
.gline { position:absolute; left:0; right:0; top:8.4px; border-top:1.5px dashed var(--work);
  pointer-events:none; opacity:.7; }
.gfoot { display:flex; justify-content:space-between; margin-top:10px; font-size:12px;
  color:var(--muted); }
.ghead { display:flex; align-items:center; gap:10px; }
.ghead h3 { flex:1; min-width:0; margin:0; font-family:var(--display); font-weight:500;
  font-size:19px; line-height:1.25; overflow-wrap:anywhere; }
.ghead .eyebrow { flex:1; margin:0; }
.gnum { flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  background:var(--work-soft); color:var(--work); font-family:var(--mono); font-size:13px;
  font-weight:600; }
.gvtext { margin:8px 0 0; font-family:var(--display); font-size:18px; line-height:1.4;
  color:var(--ink); white-space:pre-wrap; }
.gempty { margin-top:8px; width:100%; text-align:left; border:1px dashed var(--line-strong);
  background:none; border-radius:12px; padding:12px 14px; font-family:inherit; font-size:14px;
  color:var(--muted); cursor:pointer; }
.gvis { width:100%; margin-top:8px; resize:vertical; font-family:inherit; font-size:15px;
  line-height:1.4; box-sizing:border-box; }
.goal { border-top:3px solid var(--work); }
.gkpi { display:flex; justify-content:space-between; align-items:baseline; margin-top:12px;
  font-size:13px; color:var(--ink-2); }
.gkpi b { font-family:var(--mono); font-weight:500; color:var(--ink); }
.gkbar { height:6px; border-radius:3px; background:var(--surface-2); margin-top:5px; overflow:hidden; }
.gkbar i { display:block; height:100%; background:var(--work); border-radius:3px; }
.gtl { margin-top:14px; gap:9px; }
.gtl .ttl { font-size:15px; }
.gtl .tbox { width:20px; height:20px; }
.gtl .tbox:disabled { opacity:.4; cursor:default; }
.gtag { flex:none; font-style:normal; font-size:10.5px; color:var(--muted); font-family:var(--mono);
  padding-top:3px; }
.glab { display:block; margin:16px 0 6px; font-size:10.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); }
.gtitle { flex:1; min-width:0; font-size:16px; }
.gkpirow { display:flex; align-items:center; gap:6px; }
.gkpirow .field { min-width:0; }
.gkpirow .field:first-child { flex:1; }
.gkpirow .gnumin { width:64px; flex:none; text-align:right; font-family:var(--mono); }
.gtedit { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.gtedit li { display:flex; align-items:center; gap:8px; }
.gtedit .ttl { font-size:14px; }
.gdel { display:block; margin-top:16px; color:var(--muted) !important; font-size:12.5px; }
.gadd { width:100%; margin-top:12px; }
.goal .tadd { flex-wrap:wrap; }
.goal .tadd select { flex:1; }
.gnew { display:block; margin:18px auto 0; color:var(--muted) !important; font-size:12.5px; }
.gdays { display:grid; grid-template-columns:repeat(7, 1fr); gap:5px; margin:7px 0 2px; }
.gday { height:34px; border-radius:9px; border:1.5px solid var(--line-strong); background:var(--surface);
  font-family:var(--mono); font-size:11px; color:var(--muted); cursor:pointer; padding:0; }
.gday.on { background:var(--work); border-color:var(--work); color:#fff; }
.gday.today { box-shadow:0 0 0 2px var(--work-soft); border-color:var(--work); }
.gday:disabled { opacity:.35; cursor:default; }
.gdaily .trow { align-items:baseline; }
.ghow { margin:10px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:8px;
  font-size:14px; line-height:1.45; color:var(--ink-2); }
.ghow b { color:var(--ink); }
.ghowcard .foldbtn h2 { font-size:16px; }
/* ---------- V3.5: Do capped, Not-to-do folded ---------------------------- */
.tbk small { font-family:var(--mono); font-size:11px; font-weight:500; opacity:.8; }
.tbk.full { opacity:.45; }
.tqhint.warn { color:#b3422a; }
.tlim { margin-left:auto; border:1px solid var(--qc); background:none; color:var(--qc); border-radius:99px;
  font-family:var(--mono); font-size:12px; padding:2px 9px; cursor:pointer; }
.tdo .tgh span { flex:1; }
.tempties { list-style:none; margin:0; padding:0; }
.tslot { display:flex; align-items:center; gap:10px; min-height:46px; border-bottom:1px dashed var(--line); }
.tslot .trank { color:var(--line-strong); }
.tslotb { flex:1; height:40px; border:none; background:none; cursor:text; }
.tnot { margin-top:22px; }
.tnot .foldbtn h2 { font-size:16px; color:var(--muted); }
.tnoth { margin:6px 2px 4px; font-size:12.5px; color:var(--muted); }
.tnotx .tt { color:var(--ink-2); cursor:default; }
.tnotmark { flex:none; width:24px; text-align:center; font-size:12px; color:var(--muted); }
.tebar .tbuckets.sm { margin:0 0 10px; }

/* ---------- V3.4: Goals --------------------------------------------------- */
.casc .eyebrow { margin-bottom:4px; }
.crow { display:grid; grid-template-columns:76px 1fr; gap:10px; align-items:baseline; padding:9px 0;
  border-top:1px solid var(--line); }
.casc .eyebrow + .crow { border-top:none; }
.clab { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.cval { display:block; position:relative; min-width:0; width:100%; justify-self:stretch; text-align:left; background:none; border:none; padding:0; margin:0;
  font-family:var(--display); font-size:16.5px; font-weight:500; line-height:1.35; color:var(--ink); cursor:pointer; }
.cval.cnil { font-family:inherit; font-size:13.5px; font-weight:400; color:var(--muted);
  text-decoration:underline dashed var(--line-strong); text-underline-offset:4px; }
.ro .cval { cursor:default; }
.csel select { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:16px; }
.cin { width:100%; box-sizing:border-box; font-size:16px; resize:vertical; }
.crow.now { border-top:none; margin:4px -10px 0; padding:10px; border-radius:10px;
  background:color-mix(in oklab, var(--work) 9%, var(--surface)); }
.crow.now .clab { color:var(--work); }
.cstar { color:var(--work); margin-right:5px; }
.cq { margin:12px 0 0; font-size:12.5px; font-style:italic; line-height:1.45; color:var(--muted); }
.gnum.xs { width:18px; height:18px; font-size:10px; display:inline-grid; vertical-align:1px; margin-right:7px; }
.sc-ro { display:flex; justify-content:space-between; align-items:baseline; }
.sc-ro b { font-size:15px; } .sc-ro span { font-size:12px; color:var(--muted); }
.sc-top { display:flex; align-items:center; justify-content:center; gap:16px; padding-top:10px; flex-wrap:wrap; }
.sc-top .big { font-family:var(--mono); font-size:48px; font-weight:500; line-height:1; }
.sc-per { display:flex; flex-direction:column; gap:4px; }
.sc-per span { font-family:var(--mono); font-size:12px; padding:2px 9px; border-radius:99px;
  background:var(--surface-2); color:var(--ink-2); }
.sc-per span.win { background:color-mix(in oklab, var(--work) 14%, var(--surface)); color:var(--work); }
.sc-of { text-align:center; margin:8px 0 0; font-size:12px; color:var(--muted); }
.sc-of .linkbtn { font-size:12px; color:var(--muted); }
table.sc { width:100%; border-collapse:collapse; table-layout:fixed; margin-top:10px; }
.sc col.scs { width:40px; }
.sc thead th { font-size:10px; font-weight:700; color:var(--muted); text-align:center; padding:0 0 2px; }
.sc thead th.today { color:var(--work); }
.scgh th { text-align:left; padding:14px 0 4px; font-size:13.5px; font-weight:700; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.scgh td { text-align:right; padding:14px 0 4px; font-family:var(--mono); font-size:12px; color:var(--ink-2); }
.scgh td.win { color:var(--work); font-weight:600; }
.sct { text-align:left; font-weight:500; font-size:14px; color:var(--ink); padding:9px 4px 3px 0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sctr td.scn { padding-top:9px; }
.scdr td { padding:1px 0 4px; }
.sct small { font-family:var(--mono); font-size:10px; color:var(--muted); margin-left:5px; }
.sc td { text-align:center; padding:2px 0; }
.scc { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--surface);
  padding:0; cursor:pointer; vertical-align:middle; }
.scc.on { background:var(--work); border-color:var(--work); }
.scc.today { border-color:var(--work); box-shadow:0 0 0 2.5px color-mix(in oklab, var(--work) 22%, transparent); }
.scc:disabled { cursor:default; }
.scc:disabled:not(.on) { opacity:.35; }
.ro .scc:disabled:not(.on) { opacity:.6; }
.sc td.scn { font-family:var(--mono); font-size:11px; color:var(--muted); text-align:right; }
.sc td.scn.full { color:var(--work); }
.sc td.scnone { text-align:left; padding:4px 0 2px 0; font-size:12.5px; color:var(--muted); }
.rs-wrap { overflow-x:auto; margin:8px -2px 0; -webkit-overflow-scrolling:touch; }
table.rs { border-collapse:separate; border-spacing:0; font-variant-numeric:tabular-nums; }
.rs th, .rs td { white-space:nowrap; padding:7px 6px; font-size:12px; }
.rs thead th { font-size:10px; font-weight:700; letter-spacing:.04em; color:var(--muted); text-align:right; }
.rs thead th.cur { color:var(--ink); }
.rs tbody th { position:sticky; left:0; z-index:1; background:var(--surface); text-align:left; font-weight:600;
  color:var(--ink-2); max-width:112px; overflow:hidden; text-overflow:ellipsis; white-space:normal; line-height:1.25; border-top:1px solid var(--line);
  box-shadow:1px 0 0 var(--line); }
.rs tbody th small { display:block; font-weight:400; color:var(--muted); }
.rs tbody th { min-width:104px; }
.rs tr.rsg th, .rs tr.rss th { white-space:nowrap; }
.rs td { font-family:var(--mono); text-align:right; min-width:34px; color:var(--ink); border-top:1px solid var(--line); }
.rs tr.rss td, .rs tr.rss th { font-weight:700; color:var(--ink); }
.rs tr.rsg th { font-weight:500; color:var(--muted); }
.rs td.win { color:var(--work); }
.rs td.fut { color:var(--line-strong); }
.rs td.curc { background:color-mix(in oklab, var(--work) 7%, transparent); }
.rs .kb { font:inherit; color:inherit; background:none; border:none; padding:0; min-width:28px; text-align:right;
  cursor:pointer; text-decoration:underline dotted var(--line-strong); text-underline-offset:3px; }
.rs .kb.nil { color:var(--muted); text-decoration:none; }
.rs .kin { width:56px; box-sizing:border-box; font-family:var(--mono); font-size:16px; text-align:right;
  border:1.5px solid var(--work); border-radius:6px; padding:2px 4px; background:var(--surface); color:var(--ink); }
.prow { display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-top:1px solid var(--line); }
.plan .eyebrow + .prow, .plan .eyebrow + .pedit { border-top:none; }
.pmain { flex:1; min-width:0; }
.pt { font-size:15.5px; font-weight:600; color:var(--ink); }
.pk { display:flex; justify-content:space-between; gap:8px; margin-top:3px; font-size:12px; color:var(--muted); }
.pk b { font-family:var(--mono); font-weight:500; color:var(--ink); }
.pedit { padding:12px 0 6px; border-top:1px solid var(--line); }
.pedit .terow { margin-top:14px; }
.pedit .gdel { margin:0; }
.gstar { flex:none; border:none; background:none; padding:0 2px; font-size:22px; line-height:1; cursor:pointer;
  color:var(--line-strong); }
.gstar.on { color:var(--work); }
.exwrap { margin-top:-4px; padding:12px 10px 2px; border-radius:16px; background:var(--surface-2); }
.exwrap .card { box-shadow:none; }
.gstart { display:flex; flex-direction:column; gap:8px; margin-top:16px; }
.gstart .btn { background:var(--work); }
.gstart .btn, .gstart .btn-quiet { width:100%; padding:13px; font-size:14px; }


/* ---------- V3.5: Goals as four steps ------------------------------------ */
.gstep { padding-top:16px; }
.gsh { display:flex; align-items:center; gap:10px; }
.gsh h2 { flex:1; margin:0; font-family:var(--display); font-weight:500; font-size:20px; }
.gsn { flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--work);
  color:#fff; font-family:var(--mono); font-size:12.5px; font-weight:600; }
.gsr { font-size:12px; color:var(--muted); font-family:var(--mono); }
.gask { margin:8px 0 10px; font-size:13.5px; color:var(--muted); font-style:italic; line-height:1.4; }
.gguide { display:inline-flex; align-items:center; gap:5px; margin-top:12px; border:none; background:none; padding:4px 0;
  font-family:inherit; font-size:12.5px; color:var(--accent); cursor:pointer; }
.gguide i { font-style:normal; font-size:10px; }
.gguideb { margin-top:6px; padding:12px 14px; border-radius:12px; background:var(--surface-2); font-size:13.5px;
  line-height:1.5; color:var(--ink-2); }
.gguideb p { margin:0 0 8px; }
.gguideb p:last-child { margin-bottom:0; }
.gex b { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  margin-right:6px; padding:1px 6px; border-radius:5px; }
.gex.good b { background:color-mix(in oklab, #3f9b5f 16%, transparent); color:#2e7a49; }
.gex.bad b { background:color-mix(in oklab, #c4513a 14%, transparent); color:#b3422a; }
.gline2 { padding:10px 0 12px; border-top:1px solid var(--line); }
.gline2:first-of-type { border-top:none; padding-top:2px; }
.gline2.one h3 { font-size:20px; }
.gline2 .gstar { cursor:default; font-size:20px; width:26px; text-align:center; }
.gline2:not(.one) h3 { font-size:16px; color:var(--ink-2); }
.galso { margin:10px 0 0; font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.gadd2 { display:block; margin-top:8px; font-size:13.5px; }
.gedit { padding:4px 0 10px; }
.gscore { display:flex; align-items:baseline; justify-content:center; gap:10px; margin-top:8px; }
.gscore b { font-family:var(--mono); font-size:40px; font-weight:500; letter-spacing:-.02em; }
.gscore span { font-size:12.5px; color:var(--muted); }
.gfor { margin:14px 0 2px; font-size:12px; font-weight:600; color:var(--ink-2); }
.gfoot2 { margin:12px 0 0; font-size:12px; color:var(--muted); text-align:center; }
.gone { display:flex; align-items:center; gap:10px; }
.gone .field { flex:1; min-width:0; font-size:16px; }
.gone .dplay { margin-top:0; width:46px; height:46px; flex:none; }
.gfour { margin:14px 0 4px; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:14px;
  line-height:1.45; color:var(--ink-2); }
.gfour b { color:var(--ink); }
.gdone2 { display:block; margin-top:8px; }

.gsub2 { margin-top:12px; }
.gsub2 .clab { display:block; margin-bottom:4px; }
.gstep .gvtext { margin-top:4px; }
.gvtext.cnil { font-family:inherit; font-size:13.5px; color:var(--muted); }
.gtap { font-size:17px; padding:2px 0; }
.gstep .cin { margin-top:2px; }
.gklog { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:6px; font-size:12px; color:var(--muted); }
.gklog .kb { font-family:var(--mono); font-size:13px; color:var(--ink); background:none; border:none; padding:2px 0;
  cursor:pointer; text-decoration:underline dotted var(--line-strong); text-underline-offset:3px; }
.gklog .kb.nil { color:var(--accent); text-decoration:none; }
.gklog .kin { width:72px; box-sizing:border-box; font-family:var(--mono); font-size:16px; text-align:right;
  border:1.5px solid var(--work); border-radius:6px; padding:2px 6px; background:var(--surface); color:var(--ink); }
.gnokpi { display:block; margin-top:6px; font-size:12.5px; }
.gstep .daynav { margin-top:4px; }
.gstep .rs-wrap { margin-top:10px; }
.gstep .sc-ro { margin-top:4px; }

/* ---------- V3.3: the opening screen ------------------------------------ */
.hbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 0 6px; }
.hbar b { font-family:var(--display); font-weight:500; font-size:17px; color:var(--ink-2); }
.hwho { position:relative; display:inline-flex; align-items:center; }
.hwho select { appearance:none; -webkit-appearance:none; border:none; background:none; font-family:inherit;
  font-size:14px; font-weight:600; color:var(--ink); padding:6px 18px 6px 6px; cursor:pointer; }
.hwho i { position:absolute; right:4px; font-style:normal; font-size:10px; color:var(--muted); pointer-events:none; }
.hfirst { margin-top:20px; }
.hfirst h2 { margin:0; font-family:var(--display); font-weight:500; font-size:24px; }
.dials { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;
  margin:0 -16px; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; }
.dials::-webkit-scrollbar { display:none; }
.slide { flex:0 0 100%; scroll-snap-align:center; display:flex; flex-direction:column; align-items:center;
  padding:10px 16px 0; box-sizing:border-box; }
.slab { margin:6px 0 10px; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); }
.dial { position:relative; width:min(300px, 80vw); aspect-ratio:1/1; display:block; border:none;
  background:none; padding:0; font:inherit; color:inherit; }
.dtap { cursor:pointer; }
.dring { width:100%; height:100%; transform:rotate(-90deg); display:block; }
.dtrack { fill:none; stroke:var(--surface-2); stroke-width:7; }
.dfill { fill:none; stroke-width:7; stroke-linecap:round; transition:stroke-dashoffset .5s ease, stroke .5s ease; }
.dcore { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.dnum { width:78%; border:none; background:none; text-align:center; font-family:var(--mono);
  font-size:clamp(44px, 15vw, 64px); font-weight:500; letter-spacing:-.03em; color:var(--ink); padding:0;
  caret-color:var(--accent); }
.dnum:focus { outline:none; }
.dnum::placeholder { color:var(--line-strong); }
.dof { border:none; background:none; font-family:inherit; font-size:14px; color:var(--muted); cursor:pointer; padding:2px 6px; }
.dval { font-family:var(--mono); font-size:clamp(38px, 12vw, 52px); font-weight:500; letter-spacing:-.03em; }
.dsub { font-size:14px; color:var(--muted); max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dplay { margin-top:10px; width:52px; height:52px; border-radius:50%; border:none; background:var(--work);
  color:#fff; display:grid; place-items:center; cursor:pointer; padding:0; box-shadow:0 4px 14px rgba(0,0,0,.12); }
.dplay svg { width:22px; height:22px; fill:currentColor; }
.dplay.on { background:var(--surface); color:var(--work); border:2px solid var(--work); box-shadow:none; }
.dfill.paused { opacity:.45; }
.dmsg { min-height:18px; margin:8px 0 0; font-size:13px; color:var(--accent); }
.ddots { display:flex; justify-content:center; gap:10px; margin:6px 0 4px; }
.ddot { width:8px; height:8px; border-radius:50%; border:none; padding:0; background:var(--line-strong);
  cursor:pointer; transition:width .2s, background .2s; }
.ddot.on { width:22px; border-radius:4px; background:var(--ink-2); }
.hfam { margin-top:22px; }
.hfamline { display:flex; align-items:baseline; gap:10px; width:100%; border:none; border-top:1px solid var(--line);
  background:none; padding:14px 2px; font-family:inherit; color:var(--ink); cursor:pointer; text-align:left; }
.hfamline span { font-family:var(--display); font-size:17px; }
.hfamline em { flex:1; font-style:normal; font-size:12.5px; color:var(--muted); }
.hfamline i { font-style:normal; color:var(--muted); font-size:16px; }
.hadd { margin-top:14px; }

/* ---------- V3.5: your dashboard, as three labelled lines of links ----- */
.drows { margin-top:8px; }
.drow { display:flex; flex-direction:column; gap:2px; padding:9px 0 8px; border-top:1px solid color-mix(in oklab, var(--hc) 14%, var(--line)); }
.dname { flex:none; font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); }
.dlinks { min-width:0; display:flex; flex-wrap:wrap; gap:2px clamp(12px, 4.4vw, 18px); }
.dlink { border:none; background:none; padding:4px 0; font-family:inherit; font-size:clamp(13.5px, 3.9vw, 14.5px); color:var(--ink-2);
  cursor:pointer; white-space:nowrap; text-decoration:underline; text-decoration-color:var(--line-strong);
  text-underline-offset:4px; }
.dlink b { font-family:var(--mono); font-weight:500; font-size:13.5px; color:var(--muted); margin-left:3px; }
.dlink.on b { color:var(--hc, var(--accent)); }
.dlink:active { opacity:.6; }
.dsoon { margin:6px 0 0; font-size:12px; color:var(--muted); }


/* ---------- V3.3: a day with no time, and the matrix view -------------- */
.twhen { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:10px; }
.twhen > span { font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  margin-right:2px; }
.tday { position:relative; border:1.5px solid var(--line); background:var(--surface); border-radius:99px;
  padding:6px 12px; font-family:inherit; font-size:13px; color:var(--ink-2); cursor:pointer; overflow:hidden; }
.tday.on { border-color:var(--qc, var(--work)); color:var(--qc, var(--work)); font-weight:600; }
.tpick input { position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; font-size:16px; }
.sany { margin:10px 0 4px; }
.sanyh { display:flex; align-items:baseline; gap:10px; width:100%; border:none; background:none; padding:6px 2px;
  font-family:inherit; text-align:left; cursor:default; }
.sanyh .eyebrow { margin:0; }
.sanyh em { font-style:normal; font-size:13px; color:var(--work); }
.sany.armed .sanyh { cursor:copy; border:1.5px dashed var(--work); border-radius:10px; padding:10px 12px; }
.sany .tm { --qc:var(--line-strong); }
.sany .tm.q1 { --qc:var(--work); } .sany .tm.q2 { --qc:var(--accent); }
.sany .tm.q3 { --qc:var(--swim); } .sany .tm.q4 { --qc:var(--muted); }
.sany .tr { min-height:44px; }
.sany .tt { cursor:default; padding:9px 0; }
.mx { display:grid; grid-template-columns:16px 1fr 1fr; grid-template-rows:auto auto auto; gap:6px; }
.mx .axis { font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  display:flex; align-items:center; justify-content:center; }
.mx .ax-u  { grid-column:2; grid-row:1; } .mx .ax-nu { grid-column:3; grid-row:1; }
.mx .ax-i, .mx .ax-ni { writing-mode:vertical-rl; transform:rotate(180deg); }
.mx .ax-i  { grid-column:1; grid-row:2; } .mx .ax-ni { grid-column:1; grid-row:3; }
.mcell { min-width:0; min-height:150px; background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:10px 10px 12px; border-top:3px solid var(--qc); }
.mcell.q1 { --qc:var(--work); grid-column:2; grid-row:2; } .mcell.q2 { --qc:var(--accent); grid-column:3; grid-row:2; }
.mcell.q3 { --qc:var(--swim); grid-column:2; grid-row:3; } .mcell.q4 { --qc:var(--muted); grid-column:3; grid-row:3; }
.mch { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
.mch b { font-family:var(--display); font-weight:500; font-size:17px; }
.mch em { font-style:normal; font-family:var(--mono); font-size:12px; color:var(--qc); }
.mlist { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.mlist li { display:flex; align-items:flex-start; gap:7px; }
.mlist .tck { margin-top:1px; }
.mtt { flex:1; min-width:0; border:none; background:none; padding:0; text-align:left; font-family:inherit;
  font-size:14px; line-height:1.3; color:var(--ink); cursor:pointer; overflow-wrap:anywhere; }
.mempty { margin:0; font-size:12px; color:var(--muted); line-height:1.35; }

/* The epigraph. Set in the display face, indented from the rule, quiet
   enough that it introduces the page rather than competing with it. */
/* The roster's own day control, inset from the card edges so it reads as
   belonging to the list rather than to the page. */
.famnav { margin:4px 0 10px; }
.famnav span { font-size:13px; }
.epi { margin:12px 0 0; padding-left:13px; border-left:2px solid var(--sleep-soft);
  font-family:var(--display); font-size:16px; line-height:1.4; font-style:italic;
  color:var(--ink-2); text-wrap:balance; }
.epi cite { display:block; margin-top:5px; font-family:var(--body); font-size:11px;
  font-style:normal; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
  color:var(--muted); }
.pyramid { position:relative; margin-top:18px; }
.pyrow { display:grid; grid-template-columns:repeat(var(--n), 1fr); gap:9px;
  margin-top:9px; width:calc((var(--n) / 4) * 100% + ((var(--n) - 4) / 4) * 9px);
  margin-inline:auto; }
.pcell { position:relative; }
.ptile { position:relative; width:100%; aspect-ratio:1 / 1; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:2px;
  padding:8px 7px; border:1px solid var(--line); border-radius:16px;
  background:var(--surface); font-family:inherit; color:var(--ink);
  text-align:center; cursor:pointer; line-height:1.15;
  transition:background .16s ease, border-color .16s ease, transform .12s ease; }
.ptile:active { transform:scale(.97); }
.ptile b { font-size:13.5px; font-weight:600; overflow-wrap:normal; hyphens:none; }
.ptile em { font-style:normal; font-size:10px; color:var(--muted); line-height:1.2;
  padding:0 2px; }
/* V2.7. The weight is pips, not a numeral — four dots at the apex, one at
   the base. You see it rather than read it, which is the whole point of
   putting the ranking into a shape in the first place. */
.ptile .pips { position:absolute; top:8px; left:9px; display:flex; gap:2.5px; }
.ptile .pips i { width:4px; height:4px; border-radius:50%;
  background:var(--line-strong); }
.pyrow:nth-child(4) .ptile .pips { top:6px; left:6px; gap:2px; }
.pyrow:nth-child(4) .ptile .pips i { width:3.5px; height:3.5px; }
.pyrow:nth-child(1) .ptile b { font-size:18px; }
.pyrow:nth-child(2) .ptile b { font-size:14.5px; }
.pyrow:nth-child(4) .ptile { border-radius:13px; padding:7px 5px; }
.pyrow:nth-child(4) .ptile b { font-size:11.5px; overflow-wrap:break-word; }
.pyrow:nth-child(4) .ptile em { font-size:9.5px; }
.pyrow:nth-child(4) .ptile .pts { top:5px; left:6px; font-size:9.5px; }
.ptile.on { border-color:var(--sleep); background:var(--sleep-soft); }
.ptile.on b { color:var(--sleep); }
.ptile.on .pips i { background:var(--sleep); }
/* Held and not-held differ by shape as well as colour — this gets tapped
   in the dark, and by base rate one of ten men here is colour-blind. */
.ptile.on::after { content:"\2713"; position:absolute; top:6px; right:8px;
  font-size:12px; font-weight:700; color:var(--sleep); }
/* A turned-up corner: it says "there is a back to this" in the one idiom
   everyone already knows, and it is its own tap target. */
.pinfo { position:absolute; right:0; bottom:0; width:34px; height:34px;
  border:none; background:none; padding:0; cursor:pointer;
  -webkit-tap-highlight-color:transparent; }
.pinfo::before { content:""; position:absolute; right:0; bottom:0;
  border-width:0 0 24px 24px; border-style:solid;
  border-color:transparent transparent
    color-mix(in oklab, var(--sleep) 14%, var(--surface-2)) transparent;
  border-bottom-right-radius:15px; transition:border-color .16s ease; }
.pinfo span { position:absolute; right:5px; bottom:2px; font-family:var(--display);
  font-size:13px; font-weight:500; font-style:italic; line-height:1; color:var(--ink-2); }
.ptile.on + .pinfo::before {
  border-color:transparent transparent
    color-mix(in oklab, var(--sleep) 30%, var(--surface)) transparent; }
.ptile.on + .pinfo span { color:var(--sleep); }
.pinfo:hover::before, .pinfo:active::before {
  border-color:transparent transparent var(--sleep) transparent; }
.pinfo:hover span, .pinfo:active span { color:#fff; }
.pyrow:nth-child(4) .pinfo::before { border-width:0 0 20px 20px;
  border-bottom-right-radius:12px; }
.pyrow:nth-child(4) .pinfo span { font-size:11px; right:4px; bottom:1px; }

/* The back of a tile, brought forward over the pyramid. */
.pback { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
  z-index:7; display:flex; flex-direction:column; gap:9px;
  padding:20px 22px; border-radius:20px;
  background:var(--surface); border:1px solid var(--sleep);
  box-shadow:0 22px 50px -18px rgba(10,14,40,.5);
  animation:flipin .22s ease both; }
/* The rest of the stack stays visible behind it, softened, so turning a
   tile over never feels like leaving the page. */
.pscrim { position:absolute; inset:-6px; z-index:6; border-radius:22px;
  background:var(--ground); opacity:.78; }
@keyframes flipin {
  from { opacity:0; transform:translateY(-50%) perspective(900px) rotateY(-88deg); }
  to   { opacity:1; transform:translateY(-50%) perspective(900px) rotateY(0); }
}
@media (prefers-reduced-motion: reduce) { .pback { animation:none; } }
.pback .pts { font-family:var(--mono); font-size:11px; font-weight:500;
  color:var(--sleep); letter-spacing:.04em; text-transform:uppercase; }
.pback b { font-family:var(--display); font-size:23px; font-weight:500;
  line-height:1.15; }
.pback p { margin:0; font-size:14px; line-height:1.5; color:var(--ink-2); }
.pbackrow { display:flex; gap:9px; margin-top:4px; }
.pbackrow .btn { flex:1; }
.sessdate { margin-top:9px; border:1px solid var(--line); border-radius:999px;
  background:var(--surface); font-family:inherit; font-size:12.5px; color:var(--ink-2);
  padding:5px 12px; cursor:pointer; }
.sessdate span { margin-left:7px; font-size:10px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); }
.weekrow { display:flex; align-items:center; justify-content:center; gap:14px;
  margin-top:8px; font-size:12px; color:var(--muted); }
.weekrow button { border:none; background:none; font-family:inherit; font-size:17px;
  line-height:1; color:var(--ink-2); padding:2px 8px; cursor:pointer; border-radius:8px; }
.weekrow button:disabled { color:var(--line-strong); cursor:default; }

/* V1.7b — the log box is its own card, and carries its own date. */
/* V2.8. Round, filled, 40px — a thumb target that looks like one. The
   disabled "next" on today stays visible but faint, so the pair always
   reads as a pair and you can see which way time runs. */
.daynav { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.dnav { width:40px; height:40px; flex:none; border-radius:50%; cursor:pointer;
  border:1px solid var(--line-strong); background:var(--ground); color:var(--ink);
  display:grid; place-items:center; padding:0; transition:transform .08s, background .15s; }
.dnav svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2.4;
  stroke-linecap:round; stroke-linejoin:round; }
.dnav:active:not(:disabled) { transform:scale(.92); background:var(--line); }
.dnav:disabled { opacity:.3; cursor:default; }
.dlabel { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;
  gap:2px; text-align:center; }
.dlabel > span { font-size:14px; font-weight:600; color:var(--ink); }
.dlabel small { font-size:11px; color:var(--muted); letter-spacing:.02em; line-height:18px; }
.dtoday { border:none; background:none; padding:0; font-family:inherit; font-size:11.5px;
  font-weight:600; color:var(--accent); cursor:pointer; line-height:18px; }
.logrow { display:flex; align-items:center; gap:9px; margin-top:14px; }
.logrow input { flex:1; min-width:0; border:1px solid var(--line-strong); background:var(--surface);
  border-radius:11px; padding:11px 14px; text-align:right;
  font-family:var(--mono); font-size:20px; font-weight:500; color:var(--ink); }
.logrow input:focus { outline:none; border-color:var(--series); }
.logrow > em { font-style:normal; font-size:11px; color:var(--muted); flex:none; }

/* the graph, restored to a size you can actually read */
.bigchart .chart svg { height:118px; }
.bigchart .axis { margin-top:6px; font-size:11px; }
.rangetog { display:flex; border:1px solid var(--line); border-radius:999px; padding:2px;
  background:var(--surface); }
.rangetog button { border:none; background:none; font-family:inherit; font-size:11px;
  font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  padding:4px 11px; border-radius:999px; cursor:pointer; }
.rangetog button[aria-pressed="true"] { background:var(--soft); color:var(--accent); }

/* thirty-five days as dots: the execution score, drawn */
.grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:9px;
  margin:6px auto 0; max-width:266px; }
.gcell { aspect-ratio:1; border-radius:50%; border:1.5px solid var(--line); background:none;
  padding:0; cursor:pointer; }
.grid + .dshint, .gdow + .grid + .dshint { text-align:center; }
.gcell.part { border-color:currentColor; }
.gcell.full { border-color:currentColor; background:currentColor; }
.gcell.none  { border-style:dashed; }
.gcell.sel  { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink-2); }
.gcell:disabled { opacity:.3; cursor:default; }
.gcell { display:grid; place-items:center; }
.gcell i { font-style:normal; font-size:10px; font-weight:600; color:var(--ink-2);
  font-family:var(--body); }
.gcell.full i { color:var(--surface); }
.gcell.none i { color:var(--muted); }
.gdow { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:9px;
  margin:4px auto 0; max-width:266px;
  font-size:9.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  color:var(--muted); text-align:center; }

/* editing what a workout is made of */
.tmpl { margin-top:12px; padding:13px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface-2); }
.tmpl h3 { margin:0 0 9px; font-family:var(--display); font-weight:500; font-size:15px; }
.tmplrow { display:flex; align-items:center; gap:8px; padding:7px 0;
  border-bottom:1px solid var(--line); }
.tmplrow:last-of-type { border-bottom:none; }
.tmplrow .nm { flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; }
.tmplrow .sx { font-size:11px; color:var(--muted); font-family:var(--mono); }
.tmplrow button { border:none; background:none; font-family:inherit; font-size:15px;
  color:var(--muted); padding:3px 7px; cursor:pointer; border-radius:7px; }
.tmplrow button:disabled { opacity:.25; cursor:default; }
.unitrow { display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-top:18px; }
.unitrow > span { font-size:11px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); }
.strip .axis { display:flex; margin-top:5px; font-size:9.5px; color:var(--muted); }
.strip .axis span { text-align:center; }

/* Two engines. Wide, flat, and they go somewhere. */
.engines { display:grid; gap:8px; margin-top:16px; }
.engine { display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px;
  border:1px solid var(--line); border-radius:13px; background:var(--surface);
  font-family:inherit; font-size:15px; color:var(--ink); text-align:left;
  cursor:pointer; }
.engine .tick { flex:none; width:8px; height:8px; border-radius:99px;
  background:var(--line-strong); }
.engine.on .tick { background:var(--train); }
.engine.on.cardio .tick { background:var(--swim); }
.engine b { font-weight:500; flex:none; }
.engine .said { flex:1; min-width:0; font-size:13px; color:var(--muted);
  text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.engine .go { flex:none; color:var(--muted); font-size:15px; }

/* V2.1 — the pillars as rows. One row per live pillar, chips inline. */
.prow { display:flex; align-items:center; gap:10px; padding:12px 0;
  border-top:1px solid var(--line); }
.mine .prow:first-of-type { border-top:none; padding-top:6px; }
.pdot { flex:none; width:20px; height:20px; border-radius:50%;
  border:1.5px solid var(--line-strong); display:grid; place-items:center;
  color:transparent; font-size:11px; line-height:1; }
.prow.done .pdot { background:var(--series); border-color:var(--series); color:#fff; }
:root[data-theme="dark"] .prow.done .pdot { color:#08120f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .prow.done .pdot { color:#08120f; }
}
.pname { flex:1; min-width:0; font-family:var(--display); font-size:17px;
  line-height:1.15; overflow-wrap:break-word; }
.chips { flex:none; display:flex; gap:6px; }
.chip { position:relative; width:58px; height:46px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1px; border:1px solid var(--line);
  border-radius:12px; background:var(--surface); font-family:inherit; color:inherit;
  cursor:pointer; padding:0; overflow:hidden; }
.chip b { font-family:var(--mono); font-size:13.5px; font-weight:500; line-height:1.1;
  letter-spacing:-.02em; color:var(--muted); }
.chip span { font-size:8.5px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); }
.chip.on { border-color:var(--series); background:var(--soft); }
.chip.on b { color:var(--ink); }
.chip.on span { color:var(--accent); }
.chip:active { transform:scale(.97); }
.netbar { display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin:0 0 12px; padding:9px 13px; border-radius:10px; background:var(--warn-soft);
  border:1px solid var(--line); font-size:12.5px; color:var(--ink-2); }
.netbar button { border:none; background:none; font-family:inherit; font-size:12.5px;
  font-weight:600; color:var(--warn); cursor:pointer; padding:2px 4px; }
.undobar { display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin:2px 0 6px; padding:8px 12px; border-radius:10px; background:var(--surface-2);
  font-size:12.5px; color:var(--ink-2); }
.undobar button { border:none; background:none; font-family:inherit; font-size:12.5px;
  font-weight:600; color:var(--accent); cursor:pointer; padding:2px 4px; }
.soon { margin-top:4px; padding-top:11px; border-top:1px solid var(--line);
  font-size:12px; color:var(--muted); letter-spacing:.01em; }
.soon em { font-style:normal; margin-left:8px; font-size:9px; font-weight:600;
  letter-spacing:.09em; text-transform:uppercase; padding:2px 6px; border-radius:99px;
  background:var(--surface-2); }
.sleepline { margin-top:3px; font-size:11.5px; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* the family block on a metric page: folded by default */
.fam .frow { display:flex; align-items:center; gap:11px; padding:9px 0;
  border-bottom:1px solid var(--line); }
.fam .frow:last-child { border-bottom:none; }
.fam .dot { flex:none; width:26px; height:26px; border-radius:99px; display:grid;
  place-items:center; font-size:10px; font-weight:600; }
.fam .fname { flex:1; min-width:0; font-size:14px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.fam .trend { flex:none; width:66px; height:20px; }
.fam .fval { flex:none; min-width:52px; text-align:right; font-family:var(--mono);
  font-size:13px; color:var(--muted); }
.fam .frow.did .fval { color:var(--series); }
.fam .loading { padding:12px 0; font-size:13px; color:var(--muted); }


/* V1.6 — the chart IS the form. One line, under the bar you tapped. */
.daysheet { display:flex; align-items:center; gap:9px; margin-top:12px;
  padding:10px 12px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface); }
.daysheet > span { font-size:13px; color:var(--ink); font-weight:500; flex:none;
  min-width:62px; }
.daysheet input { flex:1; min-width:0; border:none; background:none; text-align:right;
  font-family:var(--mono); font-size:22px; font-weight:500; color:var(--ink);
  padding:0; }
.daysheet input:focus { outline:none; }
.daysheet > em { font-style:normal; font-size:11px; color:var(--muted); flex:none; }
.dshint { margin-top:8px; }


/* the segment that drives both the chart and the log under it */
.segrow { display:flex; align-items:center; gap:10px; }
.seg { display:flex; flex:1; border:1px solid var(--line); border-radius:999px;
  padding:3px; background:var(--surface); }
.seg button { flex:1; border:none; background:none; border-radius:999px;
  padding:7px 4px; font-family:inherit; font-size:13px; font-weight:500;
  color:var(--muted); cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--surface-2); color:var(--ink);
  font-weight:600; }

/* the date under the group name is a control */

/* stacked mini charts */
.mini + .mini { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
.mini-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.mini-name { font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
.mini-total { font-family:var(--mono); font-size:11px; color:var(--muted); }
.mini .chart svg { height:96px; }
.mini-foot { margin-top:4px; }

.ver { text-align:center; font-family:var(--mono); font-size:11px;
  color:var(--line-strong); letter-spacing:.06em; }
/* Tap the thing you want to change. Underlined so it reads as editable
   without adding a button or an icon anywhere. */
.tapedit { background:none; border:none; padding:0; cursor:pointer;
  font-family:inherit; font-weight:600; font-size:14px; color:var(--ink);
  text-decoration:underline; text-decoration-style:dotted;
  text-decoration-color:var(--line-strong); text-underline-offset:3px; }
.tapedit.small { font-size:11px; font-weight:400; color:var(--muted); }
.tapedit.small.met { color:var(--accent); font-weight:500; }
.chart svg rect[data-day] { cursor:pointer; }
/* Which way is late. Set in HTML, not in the SVG: the chart is stretched
   horizontally (preserveAspectRatio none) and any text inside it would
   be stretched with it. */
.chart.dev { position:relative; }
.devax { position:absolute; left:1px; font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); opacity:.75; pointer-events:none; }
.devax.up { top:6px; }
.devax.dn { bottom:26px; }
.install { display:flex; align-items:flex-start; gap:10px; padding:12px 14px;
  border:1px solid var(--line); border-radius:12px; background:var(--soft);
  font-size:13px; color:var(--ink-2); }
.install p { flex:1; }
.install b { color:var(--accent); }
.install button { background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:18px; line-height:1; padding:0 2px; flex:none; }
.banner { border:1px solid var(--line-strong); background:var(--warn-soft);
  border-radius:12px; padding:13px 15px; font-size:13.5px; color:var(--ink-2); }
.center { display:grid; place-items:center; min-height:60vh; }
.spinner { font-size:13px; color:var(--muted); }

/* ---------------------------------------------------------------- */
/* V1.3 — Lift. Orange throughout, matching the Train series on the  */
/* chart, so "Train" and "Lift" read as one thing and not two.       */
/* ---------------------------------------------------------------- */
.topbar { display:flex; align-items:center; gap:8px; }
.backlink { background:none; border:none; padding:6px 10px 6px 0; cursor:pointer;
  color:var(--muted); font-size:14px; font-family:inherit; }
.sync { margin-left:auto; font-size:10.5px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); }
.sync.saving  { color:var(--train); }
.sync.saved   { color:var(--accent); }
.sync.offline { color:var(--warn); }

/* V2.8. The first workout. Three full-width rows, not tiles: each is a
   decision to read, not a shortcut to recognise. */
.firstcard { margin:0 0 16px; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; padding:18px 16px 14px; box-shadow:var(--shadow); }
.firstcard h2 { margin:2px 0 0; font-family:var(--display); font-weight:500; font-size:22px; }
.starters { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
.starter { text-align:left; background:var(--ground); border:1px solid var(--line);
  border-radius:12px; padding:12px 14px; font-family:inherit; color:inherit; cursor:pointer;
  display:flex; flex-direction:column; gap:3px; position:relative; }
.starter::after { content:"›"; position:absolute; right:14px; top:50%;
  transform:translateY(-50%); font-size:22px; color:var(--muted); }
.starter b { font-size:15px; font-weight:600; }
.starter span { font-size:12.5px; color:var(--muted); padding-right:22px; line-height:1.35; }
.starter:active { transform:scale(.99); }
/* One line, once: what just happened to the workout you finished. */
.flash { margin:0 0 14px; padding:10px 14px; border-radius:12px; font-size:13.5px;
  background:var(--train-soft); color:var(--ink); text-align:center; }
.firstempty { justify-content:center; padding:13px; font-size:14px; }
.tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile { text-align:left; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:13px; cursor:pointer; font-family:inherit; color:inherit;
  display:flex; flex-direction:column; gap:5px; min-height:100px; }
.tile b { font-size:15px; font-weight:600; }
.tile .ex { font-size:12px; color:var(--muted); line-height:1.35; display:-webkit-box;
  -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.tile .ago { margin-top:auto; font-size:11px; color:var(--muted); font-style:italic; }

.hcard { background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:15px; box-shadow:var(--shadow); cursor:pointer; width:100%; text-align:left;
  font-family:inherit; color:inherit; display:block; }
.hcard + .hcard { margin-top:10px; }
.hcard h3 { margin:0; font-size:16px; font-family:var(--display); font-weight:500; }
.hcard .when { font-size:13px; color:var(--muted); margin-top:1px; }
/* The day's note, beside the template's name. Same line, clearly second. */
.hnote { font-family:var(--body); font-size:13px; font-weight:400; color:var(--muted);
  margin-left:8px; }
.hnote::before { content:"\00b7"; margin-right:8px; }
.hmeta { display:flex; gap:16px; margin:10px 0 2px; font-size:13px; color:var(--ink-2); }
.hmeta b { font-family:var(--mono); font-weight:500; }
.htab { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
.htab th { text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); padding:6px 0 3px; }
.htab td { padding:3px 0; }
.htab td:last-child, .htab th:last-child { text-align:right; font-family:var(--mono); }
.htab td.nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:0; width:60%; }

.timer { display:flex; align-items:baseline; gap:14px; font-family:var(--mono);
  font-size:12.5px; color:var(--muted); margin-top:2px; }
.timer b { font-size:26px; color:var(--ink); font-weight:500; letter-spacing:-.02em; }
.exblock { background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:14px; box-shadow:var(--shadow); }
.exblock + .exblock { margin-top:10px; }
.exhead { display:flex; align-items:center; gap:8px; }
.exhead b { flex:1; font-size:15px; font-weight:600; color:var(--train);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.xbtn { background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:18px; line-height:1; padding:2px 5px; }
.setgrid { display:grid; grid-template-columns:20px minmax(52px,.85fr) 1fr 1fr 38px 22px;
  gap:6px; align-items:center; margin-top:9px; }
.setgrid .hd { font-size:10px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); text-align:center; }
.setgrid .hd.l { text-align:left; }
.setgrid .ix { font-family:var(--mono); font-size:13px; color:var(--muted); text-align:center; }
.setgrid input { width:100%; border:1px solid var(--line-strong); background:var(--surface);
  border-radius:9px; padding:9px 6px; font-family:var(--mono); font-size:17px;
  font-weight:500; text-align:center; }
.setgrid input:focus { border-color:var(--train); }
.setgrid input.on { border-color:transparent; background:var(--train-soft); }
.tick { border:1px solid var(--line-strong); background:none; border-radius:9px;
  height:39px; cursor:pointer; color:var(--muted); font-size:15px; }
.tick[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
@media (prefers-color-scheme: dark) { .tick[aria-pressed="true"] { color:#08120f; } }
.addset { width:100%; margin-top:9px; border:1px dashed var(--line-strong); background:none;
  border-radius:9px; padding:9px; color:var(--muted); font-family:inherit; font-size:13px;
  cursor:pointer; }
.exadd { display:flex; gap:8px; margin-top:12px; }
.exadd input { flex:1; min-width:0; }

.labelin { flex:1; min-width:0; background:none; border:none; padding:0 0 3px;
  font-family:var(--display); font-size:28px; font-weight:500; line-height:1.15;
  letter-spacing:-0.01em; color:var(--train);
  border-bottom:1px dotted var(--line-strong); }
.labelin::placeholder { color:var(--line-strong); }
.notein { display:block; width:100%; margin-top:2px; background:none; border:none;
  padding:1px 0; font-family:inherit; font-size:13.5px; color:var(--ink-2); }
.notein::placeholder { color:var(--muted); }
.notein:focus { outline:none; border-bottom:1px dotted var(--line-strong); }
.labelfix { display:block; font-family:var(--display); font-size:28px; font-weight:500;
  line-height:1.15; letter-spacing:-0.01em; color:var(--train);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.liftchip { background:none; border:1px solid var(--line); border-radius:999px;
  padding:1px 8px; font-family:var(--mono); font-size:10.5px; color:var(--train);
  cursor:pointer; white-space:nowrap; }
.liftchip.cardio { color:var(--series); }
.liftchip.work { color:var(--work); cursor:default; }

/* V1.4 */
.weeknav { display:flex; gap:6px; }
.weeknav button { border:1px solid var(--line); background:none; border-radius:999px;
  width:30px; height:26px; font-size:15px; line-height:1; color:var(--ink);
  cursor:pointer; padding:0; }
.weeknav button:disabled { opacity:.3; cursor:default; }

.foldbtn { display:flex; align-items:center; gap:6px; background:none; border:none;
  padding:0; cursor:pointer; font-family:inherit; color:inherit; }
.foldbtn .caret { font-size:11px; color:var(--muted); width:11px; }

.tilewrap { position:relative; }
.tilewrap .tile { width:100%; }
.tilemenu { position:absolute; top:6px; right:6px; background:none; border:none;
  color:var(--muted); font-size:17px; line-height:1; padding:2px 7px; cursor:pointer; }
.sheet { position:absolute; top:30px; right:6px; z-index:5; background:var(--surface);
  border:1px solid var(--line-strong); border-radius:11px; box-shadow:var(--shadow);
  overflow:hidden; min-width:132px; }
.sheet button { display:block; width:100%; text-align:left; background:none;
  border:none; border-top:1px solid var(--line); padding:10px 13px; font-size:13.5px;
  font-family:inherit; color:var(--ink); cursor:pointer; }
.sheet button:first-child { border-top:none; }

.setgrid.one { grid-template-columns:20px minmax(52px,.85fr) 1fr 38px 22px; }
/* What you did last time, greyed. It is a reference, not a field: you
   read it, you type over the number beside it, you move on. Strong puts
   it here and it is the single reason their logger feels like memory. */
.setgrid .prev { font-family:var(--mono); font-size:11.5px; color:var(--muted);
  text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kindmini { display:flex; gap:3px; flex:none; }
.kindmini button { border:1px solid var(--line); background:var(--surface);
  color:var(--muted); border-radius:99px; padding:3px 8px; font-family:inherit;
  font-size:10px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  cursor:pointer; white-space:nowrap; }
.kindmini button[aria-pressed="true"] { border-color:var(--train); color:var(--train);
  background:var(--train-soft); }
/* The unit, not a mode: set apart so it does not read as a third choice
   of what the exercise records. */
.unitchip { margin-left:4px; border-style:dashed !important; color:var(--series) !important;
  text-transform:lowercase !important; letter-spacing:0 !important;
  font-family:var(--mono) !important; }
.xset { border:none; background:none; color:var(--line-strong); font-size:17px;
  line-height:1; padding:0; cursor:pointer; }
.xset:hover, .xset:active { color:var(--warn); }
.exname { flex:1; min-width:0; border:none; background:none; font-family:inherit;
  font-size:15px; font-weight:600; color:var(--ink); padding:2px 0; }
.exname:focus { outline:none; border-bottom:1px solid var(--train); }
.durwrap { display:inline-flex; align-items:baseline; gap:4px; }
.durin { width:62px; border:1px solid var(--line-strong); background:var(--surface);
  border-radius:9px; padding:4px 8px; font-family:var(--mono); font-size:19px;
  font-weight:500; text-align:right; color:var(--ink); }
.durin:focus { outline:none; border-color:var(--train); }
.durwrap em { font-style:normal; font-size:11px; color:var(--muted); }
.hd.unit { border:none; background:none; padding:0; cursor:pointer; font:inherit;
  font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--train); text-decoration:underline; text-decoration-style:dotted;
  text-underline-offset:3px; }
.empty { text-align:center; padding:26px 16px; color:var(--muted); font-size:14px; }

/* ---------- V3.4: the dials, any three ---------------------------------- */
.slab { display:inline-flex; align-items:center; gap:5px; border:none; background:none; font-family:inherit;
  cursor:pointer; padding:4px 8px; border-radius:8px; }
.slab i { font-style:normal; font-size:15px; letter-spacing:0; color:var(--line-strong); transform:translateY(-1px); }
.dnum.dmin { font-size:clamp(38px, 12vw, 54px); }
.dgo { border:none; background:none; color:var(--ink); cursor:pointer; padding:0 6px; line-height:1.1; }
.dnone { color:var(--line-strong) !important; }
.dnow { border:none; background:none; cursor:pointer; padding:0 10px; color:var(--accent); line-height:1.1; }
.dedit { display:block; margin:2px auto 0; border:none; background:none; font-family:inherit; font-size:12px;
  color:var(--muted); cursor:pointer; padding:6px 10px; text-decoration:underline dotted;
  text-decoration-color:var(--line-strong); text-underline-offset:3px; }

/* ---------- V3.4: one sheet for standards and for choosing dials -------- */
.sheetbg { position:fixed; inset:0; z-index:44; background:rgba(10,14,12,.36); animation:mfade .14s ease both; }
.stdsheet { position:fixed; z-index:45; left:12px; right:12px; top:calc(env(safe-area-inset-top, 0px) + 56px);
  max-width:420px; margin:0 auto; max-height:calc(100vh - 120px); overflow:auto;
  background:var(--surface); border-radius:20px; padding:20px 18px 16px;

.stdsheet h3 { margin:2px 0 0; font-family:var(--display); font-weight:500; font-size:24px; }
.stdrow { display:flex; align-items:baseline; justify-content:center; gap:8px; margin-top:14px;

.stdin { flex:1; min-width:0; border:none; background:none; text-align:center; font-family:var(--mono);
  font-size:40px; font-weight:500; letter-spacing:-.02em; color:var(--ink); padding:0; }
.stdin:focus { outline:none; }
.stdu { flex:none; font-size:15px; color:var(--muted); }
.stdbtns { display:flex; gap:10px; margin-top:16px; }
.stdbtns .btn, .stdbtns .btn-quiet { flex:1; padding:13px 10px; font-size:15px; border-radius:12px; }
.dpg { margin:16px 0 6px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.dpgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.dpk { position:relative; height:64px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface);
  font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-2); cursor:pointer; padding:6px 4px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
.dpk i { font-style:normal; width:20px; height:20px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--mono); font-size:11px; border:1.5px solid var(--line-strong); color:transparent; }
.dpk.on { border-color:var(--accent); background:var(--soft); color:var(--ink); }
.dpk.on i { background:var(--accent); border-color:var(--accent); color:#fff; }

/* ---------- V3.4: the family, every number ------------------------------ */
.fcard { padding:13px 14px 12px; border-top:1px solid var(--line); }
.fcard:first-child { border-top:none; }
.fhead { display:flex; align-items:center; gap:10px; }
.fhead .tapedit { font-size:15px; }
.fhead .fstreak { margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--muted); }
.fhead .fyou { font-style:normal; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--hc); background:color-mix(in oklab, var(--hc) 12%, var(--surface)); padding:2px 7px; border-radius:99px; }
.fgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:9px 8px; margin:11px 0 0 44px; align-items:start; }
.fcell { display:flex; flex-direction:column; justify-content:flex-start; align-items:flex-start; gap:1px;
  min-width:0; text-align:left; border:none; background:none; padding:0; margin:0;
  font:inherit; line-height:1.5; color:inherit; }
.fcell b { font-family:var(--mono); font-size:14.5px; font-weight:500; color:var(--ink); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.fcell span { font-size:9.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.fcell.nil b { color:var(--muted); opacity:.55; }
button.fcell { cursor:pointer; }
button.fcell b { text-decoration:underline dotted; text-decoration-color:var(--line-strong); text-underline-offset:3px; }
/* You, among them: first, in your own colour, set a little larger. */
.fcard.me { position:relative; background:color-mix(in oklab, var(--hc) 7%, var(--surface));
  box-shadow:inset 3px 0 0 var(--hc); }
.fcard.me .tapedit { font-family:var(--display); font-weight:500; font-size:19px; color:var(--ink);
  text-decoration:none; }
.fcard.me + .fcard { border-top-color:color-mix(in oklab, var(--hc) 20%, var(--line)); }

/* Everyone else: one row each, nine small numbers, one header. */
.ftab { border-top:1px solid var(--line); padding:8px 8px 6px 10px; }
.ftbl { width:100%; border-collapse:collapse; table-layout:fixed; font-variant-numeric:tabular-nums; }
.ftbl th, .ftbl td { padding:0 1px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:clip; }
.ftbl thead th { font-size:8.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); padding:0 0 5px; }
.ftbl th.fn { width:21%; text-align:left; padding:0; }
.ftbl tbody td { font-family:var(--mono); font-size:clamp(8.5px, 2.6vw, 10.5px); letter-spacing:-.04em; color:var(--ink); height:30px;
  border-top:1px solid var(--line); }
.ftbl tbody th { border-top:1px solid var(--line); }
.ftbl tbody tr:first-child td, .ftbl tbody tr:first-child th { border-top:none; }
.ftbl td.nil { color:var(--muted); opacity:.5; }
.ftbl .g0 { box-shadow:inset 1px 0 0 color-mix(in oklab, var(--line) 60%, transparent); }
.ftbl td.see button { font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer;
  text-decoration:underline dotted; text-decoration-color:var(--line-strong); text-underline-offset:3px; }
.ftn { display:flex; align-items:center; gap:6px; max-width:100%; background:none; border:none; padding:0;
  font:inherit; font-size:12.5px; font-weight:600; color:var(--ink-2); cursor:pointer; overflow:hidden; }
.ftn i { flex:none; width:7px; height:7px; border-radius:50%; background:var(--hc); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------- V3.4: Train ----------------------------------------------------- */
/* A number carried over from last time and not touched yet: a suggestion,
   so it is grey, and it is not logged unless you tick it or type over it. */
.setgrid input.pre { color:var(--muted); }
.stdline { margin-top:4px; }

<script>

  "use strict";

  // Bump this when the file changes, so you can tell at a glance which
  // version a phone is actually running after a deploy.
  const APP_VERSION = "3.5";

  /* ---------- tiny helpers ---------------------------------------- */
  const app = document.getElementById("app");
  const pad = (n) => String(n).padStart(2, "0");
  const num = (n) => Number(n).toLocaleString();
  const esc = (s) => String(s).replace(/[&<>"']/g,
    (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  // The date on THIS phone, right now. Read fresh every time: a phone that
  // has been asleep in a pocket since yesterday must not keep answering
  // yesterday.
  const deviceISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  };

  // The zone this phone is in, e.g. "Europe/London". Sent with every log so
  // the server can compute this person's midnight without being told a date.
