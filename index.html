      <p class="hint" id="liftHint">${esc(state.lift.msg || "")}</p>

      <button class="linkbtn" id="scrap" style="color:var(--muted);text-align:left;
        align-self:flex-start;font-size:12px">Discard this ${
        state.mode === "cardio" ? "activity" : "workout"}</button>

      <p class="ver">v${APP_VERSION}</p>`;
  }

  // One row shape per kind. This is the whole reason Cardio needed no
  // second app: the exercise decides the columns, exactly as Strong does.
  const COLS = {
    weight_reps:   () => [units.w, "reps"],
    duration:      () => ["time"],
    distance_time: () => [units.d, "time"],
  };

  function exBlock(x, i) {
    const kind = x.kind || "weight_reps";
    const cols = COLS[kind]();
    const cls  = kind === "weight_reps" ? "" : cols.length === 1 ? " one" : "";

    const field = (s, j, f, ph, label) => {
      const val = f === "w" ? (s.w ? wShow(s.w) : "")
                : f === "r" ? (s.r || "")
                : f === "d" ? (s.d ? dShow(s.d) : "")
                : (s.t ? mmss(s.t) : "");
      const numeric = f === "r";
      return `<input type="${f === "t" ? "text" : "number"}"
             inputmode="${f === "t" ? "numeric" : numeric ? "numeric" : "decimal"}"
             data-ex="${i}" data-set="${j}" data-f="${f}"
             class="${s.on ? "on" : ""}" value="${val}" placeholder="${ph}"
             aria-label="Set ${j + 1} ${label}">`;
    };

    const rows = x.sets.map((s, j) => {
      const cells =
        kind === "weight_reps"   ? field(s,j,"w","0",units.w) + field(s,j,"r","0","reps")
      : kind === "duration"      ? field(s,j,"t","0:00","time")
      :                            field(s,j,"d","0",units.d) + field(s,j,"t","0:00","time");
      return `<span class="ix">${j + 1}</span>${cells}
      <button class="tick" data-tick="${i}:${j}" aria-pressed="${!!s.on}"
              aria-label="Mark ${j + 1} done">&#10003;</button>`;
    }).join("");

    return `
      <div class="exblock" id="ex-${i}">
        <div class="exhead">
          <b>${esc(x.name)}</b>
          <button class="xbtn" data-delex="${i}" aria-label="Remove ${esc(x.name)}">&times;</button>
        </div>
        <div class="setgrid${cls}">
          <span class="hd">#</span>${cols.map((c) =>
            (c === units.w || c === units.d)
              ? `<button class="hd unit" data-cycle="${c === units.w ? "w" : "d"}"
                   aria-label="Change unit">${esc(c)}</button>`
              : `<span class="hd">${esc(c)}</span>`).join("")}
          <span class="hd"></span>
          ${rows}
        </div>
        <button class="addset" data-addset="${i}">+ Add ${
          kind === "weight_reps" ? "set" : "entry"}</button>
      </div>`;
  }

  function detailView() {
    const s = state.lift.detail;
    if (!s) { state.view = "exercise"; return metricView(); }
    const byPos = new Map();
    for (const r of (s.sets || [])) {
      if (!byPos.has(r.position)) byPos.set(r.position, { name: r.exercise, sets: [] });
      byPos.get(r.position).sets.push(r);
    }
    const cell = (r) =>
        r.kind === "duration"      ? mmss(r.seconds)
      : r.kind === "distance_time" ? `${distWords(r.distance)} \u00b7 ${mmss(r.seconds)}`
      :                              `${wShow(r.weight)} ${units.w} \u00d7 ${r.reps}`;
    const blocks = [...byPos.entries()].sort((a, b) => a[0] - b[0]).map(([, x]) => `
      <div class="exblock">
        <div class="exhead"><b>${esc(x.name)}</b></div>
        <table class="htab"><tbody>${x.sets.map((r, i) => `
          <tr><td class="nm">${x.sets.length > 1 ? "Set " + (i + 1) : "\u2014"}</td>
              <td>${cell(r)}</td></tr>`).join("")}</tbody></table>
      </div>`).join("");

    const mine = s.person_id === state.meId;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; Back</button>
      </div>

      <header class="masthead">
        <h1 style="color:var(--train)">${esc(s.label || "Workout")}</h1>
        <p class="sub">${esc(s.person)} &middot; ${esc(fullDate(s.entry_date))}</p>
        <div class="timer" style="margin-top:8px">
          <span><b>${s.duration_min}m</b></span>
          ${Number(s.distance) > 0 ? `<span><b>${distWords(s.distance)}</b></span>` : ""}
          ${s.pr_count > 0 ? `<span style="color:var(--train)">
            <b>${s.pr_count}</b> PR${s.pr_count === 1 ? "" : "s"}</span>` : ""}
        </div>
      </header>

      ${blocks}

      ${mine ? `<button class="linkbtn" id="delSession" style="color:var(--warn)">
        Delete this workout</button>` : ""}

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- lift painting ----------------------------------------
     Repaint the smallest thing that changed. V1.2 taught this the hard
     way: a full re-render while someone is typing throws the number away.
     ------------------------------------------------------------------ */

  let tick = null;
  function startTicking() {
    stopTicking();
    tick = setInterval(() => {
      const a = A(); const el = document.getElementById("elapsed");
      if (!a || !el) return stopTicking();
      el.textContent = clock(elapsedMs(a));
    }, 1000);
  }
  function stopTicking() { if (tick) { clearInterval(tick); tick = null; } }

  function paintTotals() {
    const a = A(); const el = document.getElementById("sessTotals");
    if (a && el) el.innerHTML = totalsWords(a);
  }

  function paintEx(i) {
    const a = A(); if (!a) return;
    const host = document.getElementById("ex-" + i);
    if (!host) return;
    const frag = document.createElement("div");
    frag.innerHTML = exBlock(a.ex[i], i);
    host.replaceWith(frag.firstElementChild);
    wireExBlock(i);
    paintTotals();
  }

  function wireExBlock(i) {
    const host = document.getElementById("ex-" + i);
    if (!host) return;
    const a = A();

    host.querySelectorAll("input[data-ex]").forEach((el) => {
      el.addEventListener("input", () => {
        const s = a.ex[+el.dataset.ex].sets[+el.dataset.set];
        const f = el.dataset.f, v = el.value;
        // Typed in whatever unit the phone is showing; stored in pounds
        // and metres. The conversion lives here and nowhere else.
        if (f === "t")      s.t = parseClock(v);
        else if (f === "d") s.d = v === "" ? 0 : dIn(Number(v));
        else if (f === "w") s.w = v === "" ? 0 : wIn(Number(v));
        else                s.r = v === "" ? 0 : Number(v);
        paintTotals();
        queueSync();
      });
    });

    host.querySelectorAll("[data-tick]").forEach((el) => {
      el.addEventListener("click", () => {
        const [xi, si] = el.dataset.tick.split(":").map(Number);
        const s = a.ex[xi].sets[si];
        s.on = !s.on;
        el.setAttribute("aria-pressed", String(s.on));
        host.querySelectorAll(`input[data-ex="${xi}"][data-set="${si}"]`)
            .forEach((f) => f.classList.toggle("on", s.on));
        paintTotals();
        queueSync();
      });
    });

    const add = host.querySelector("[data-addset]");
    if (add) add.addEventListener("click", () => {
      const sets = a.ex[i].sets;
      const last = sets[sets.length - 1] || {};
      sets.push({ w: last.w || 0, r: last.r || 0, d: last.d || 0, t: last.t || 0, on: false });
      queueSync();
      paintEx(i);
      const rows = document.querySelectorAll(`#ex-${i} .setgrid input`);
      const kindCols = (a.ex[i].kind === "weight_reps") ? 2 : (a.ex[i].kind === "duration" ? 1 : 2);
      const f = rows[rows.length - kindCols];
      if (f) { f.focus(); f.select(); }
    });

    const del = host.querySelector("[data-delex]");
    if (del) del.addEventListener("click", () => {
      a.ex.splice(i, 1);
      queueSync();
      render();
    });
  }

  function wireLift() {
    on("back", "click", () => {
      stopTicking();
      // A session opened from the board belongs to the board. Sending
      // someone who tapped a relative's volume chip into their own Lift
      // history is a small thing that feels like being lost.
      if (state.view === "detail") {
        state.lift.detail = null;
        state.view = state.lift.from === "board" ? "board" : "exercise";
      }
      else if (state.view === "session") state.view = "exercise";
      else state.view = "board";
      render();
    });

    if (state.view === "exercise") {
      on("startEmpty", "click", () => startSession(""));
      on("resume", "click", () => { state.view = "session"; render(); });
      document.querySelectorAll("[data-start]").forEach((el) =>
        el.addEventListener("click", () => startSession(el.dataset.start)));
      document.querySelectorAll("[data-open]").forEach((el) =>
        el.addEventListener("click", () => openSession(el.dataset.open)));

      document.querySelectorAll("[data-wunit]").forEach((el) =>
        el.addEventListener("click", () => { units.w = el.dataset.wunit; render(); }));
      document.querySelectorAll("[data-dunit]").forEach((el) =>
        el.addEventListener("click", () => { units.d = el.dataset.dunit; render(); }));

      document.querySelectorAll("[data-menu]").forEach((el) =>
        el.addEventListener("click", () => {
          state.lift.menu = state.lift.menu === el.dataset.menu ? null : el.dataset.menu;
          state.lift.rename = null;
          render();
        }));
      document.querySelectorAll("[data-rename]").forEach((el) =>
        el.addEventListener("click", () => {
          state.lift.rename = el.dataset.rename;
          state.lift.renameFrom = el.dataset.rename;
          state.lift.menu = null;
          render();
          const f = document.getElementById("renameVal");
          if (f) { f.focus(); f.select(); }
        }));
      on("renameNo", "click", () => { state.lift.rename = null; render(); });
      on("renameGo", "click", () => saveLabel(
        (document.getElementById("renameVal").value || "").trim()));
      on("renameVal", "keydown", (e) => {
        if (e.key === "Enter") document.getElementById("renameGo").click();
        if (e.key === "Escape") { state.lift.rename = null; render(); }
      });
      document.querySelectorAll("[data-drop]").forEach((el) =>
        el.addEventListener("click", async () => {
          if (!confirm(`Remove the "${el.dataset.drop}" tile? The workouts you logged
under it stay in your history, they just stop being a tile.`)) return;
          state.lift.renameFrom = el.dataset.drop;
          await saveLabel("");
        }));
    }

    if (state.view === "session") {
      const a = A();
      a.ex.forEach((_, i) => wireExBlock(i));
      startTicking();

      // One tap steps the session back a day; it wraps round to today
      // after a fortnight, because anything older than that is a bar on
      // the chart, not a button you should press fourteen times.
      on("sessDate", "click", () => {
        const back = Math.round((new Date(todayISO() + "T00:00:00Z") -
                                 new Date(a.date + "T00:00:00Z")) / 86400000);
        a.date = back >= 13 ? todayISO() : shiftISO(a.date, -1);
        saveLocal();
        queueSync();
        render();
      });

      // Tapping the unit in a column header cycles it. Putting the switch
      // on the header means you can go metric mid-swim without leaving
      // the session to find a setting.
      document.querySelectorAll("[data-cycle]").forEach((el) =>
        el.addEventListener("click", () => {
          if (el.dataset.cycle === "w") units.w = units.w === "lb" ? "kg" : "lb";
          else units.d = units.d === "mi" ? "km" : units.d === "km" ? "m" : "mi";
          render();
        }));

      document.querySelectorAll("[data-kind]").forEach((el) =>
        el.addEventListener("click", () => {
          state.newKind = el.dataset.kind;
          document.querySelectorAll("[data-kind]").forEach((b) =>
            b.setAttribute("aria-pressed", String(b.dataset.kind === state.newKind)));
        }));

      on("exAdd", "click", () => {
        const f = document.getElementById("exName");
        const nm = (f.value || "").trim();
        if (!nm) { f.focus(); return; }
        // A name you have used before keeps its own kind; a new one takes
        // whatever the toggle says, and remembers it from then on.
        const known = kindFor(nm, null);
        addExercise(nm, known || state.newKind ||
          (state.mode === "cardio" ? "distance_time" : "weight_reps"));
        f.value = "";
        render();
      });
      on("exName", "keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); document.getElementById("exAdd").click(); }
      });

      // The name is just a field. No prompt, no modal, no editor state —
      // a label you can only set at the start is a label you get wrong.
      on("labelIn", "input", (e) => { a.label = e.target.value.slice(0, 24); queueSync(); });

      on("finish", "click", async (e) => {
        if (doneSets(a) === 0) {
          state.lift.msg = "Tick at least one set before finishing.";
          const h = document.getElementById("liftHint");
          if (h) h.textContent = state.lift.msg;
          return;
        }
        e.target.disabled = true;
        stopTicking();
        const res = await syncLift(true);

        // A finish never fails. If the network is down, or the call errors
        // for any other reason, the workout is already on the phone and
        // marked finished — it goes up on the next load or reconnect. The
        // one thing that must never happen is a finished session held
        // hostage on a screen someone is trying to leave.
        if (res.offline || res.error) {
          state.lift.msg = "Saved on this phone. It will upload by itself.";
          state.view = "lift";
          state.lift.loaded = false;
          render();
          return;
        }
        const prs = Number(res.pr_count) || 0;
        state.lift.active = null;
        saveLocal();
        state.lift.msg = prs ? `Logged. ${prs} personal record${prs === 1 ? "" : "s"}.` : null;
        state.view = "lift";
        await loadLift();
        render();
        refresh();                       // the board now owes you Train minutes
      });

      on("scrap", "click", () => {
        if (!confirm(`Throw this ${state.mode === "cardio" ? "activity" : "workout"
          } away? It is not saved anywhere else.`)) return;
        stopTicking();
        state.lift.active = null;
        saveLocal();
        state.view = "lift";
        render();
      });
    }

    if (state.view === "detail") {
      on("delSession", "click", async () => {
        const s = state.lift.detail;
        if (!confirm("Delete this workout? Your Train minutes for that day go back down.")) return;
        const res = await call("app_lift_delete", {
          p_code: state.code, p_person: state.meId, p_session: s.id });
        if (res.error) { alert(res.error); return; }
        state.lift.detail = null;
        state.view = "lift";
        await loadLift();
        render();
        refresh();
      });
    }
  }

  // Exercise carries both halves: the steps entry and week charts that used
  // to be on the board, and the log that used to be its own screen.
  function wireExercise() {
    wireLift();
    if (state.range === "week") wireChart(state.seg);

    // A day at a time, from the log box itself. The graph can still jump
    // you to any day; this is for "yesterday", which is most of them.
    const stepDay = async (n) => {
      const next = shiftISO(entryDay(), n);
      if (next > todayISO()) return;
      state.entryDate = next === todayISO() ? null : next;
      state.msg = null;
      if (mondayOf(next) !== weekBounds().start) {
        state.weekAnchor = mondayOf(next) === thisMonday() ? null : mondayOf(next);
        await loadHistory();
        if (state.range === "month") { state.month[state.seg] = null; await loadMonth(); }
      }
      render();
    };
    on("dPrev", "click", () => stepDay(-1));
    on("dNext", "click", () => stepDay(1));

    // Week or month. The month is fetched once per metric, on first ask.
    document.querySelectorAll("[data-range]").forEach((el) =>
      el.addEventListener("click", async () => {
        const v = el.dataset.range;
        if (v === state.range) return;
        state.range = v;
        try { localStorage.setItem("fhd.range", v); } catch {}
        render();
        if (v === "month" && !state.month[state.seg]) { await loadMonth(); render(); }
      }));

    // Every dot is a day, and tapping one selects it exactly as a bar does.
    document.querySelectorAll(".gcell[data-day]").forEach((el) =>
      el.addEventListener("click", () => {
        const iso = el.dataset.day;
        state.entryDate = iso === todayISO() ? null : iso;
        state.msg = null;
        render();
        document.getElementById("steps")?.focus();
      }));

    // The workout history folds. It is the longest thing on the page and
    // the least often wanted.
    on("foldHist", "click", () => {
      state.histOpen = !state.histOpen;
      try { localStorage.setItem("fhd.hist", state.histOpen ? "open" : "shut"); } catch {}
      render();
    });

    wireTemplate();

    // The family block is fetched the first time it is opened, then kept.
    on("foldFam", "click", async () => {
      state.fam.open = !state.fam.open;
      try { localStorage.setItem("fhd.fam", state.fam.open ? "open" : "shut"); } catch {}
      render();
      if (state.fam.open) { await loadFamily(); render(); }
    });


    // Stepping weeks moves the selection with it. Otherwise the sheet under
    // the chart would still say "Today" while you are looking at a week that
    // does not contain today, and you would log into a bar you cannot see.
    const stepWeek = async (n) => {
      state.weekAnchor = shiftISO(weekBounds().start, n * 7);
      if (state.weekAnchor === thisMonday()) state.weekAnchor = null;
      state.entryDate = state.weekAnchor ? shiftISO(state.weekAnchor, 6) : null;
      state.msg = null;
      await loadHistory();
      render();
    };
    on("wPrev", "click", () => stepWeek(-1));
    on("wNext", "click", () => stepWeek(1));

    on("save", "click", saveNumber);
    on("steps", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("save").click(); });

    document.querySelectorAll('[data-edit="goal"]').forEach((el) =>
      el.addEventListener("click", () => {
        state.editMetric = el.dataset.metric || "steps";
        openEditor("goal");
      }));

    wireEditor();
  }

  // V1.7b. One save for all three metrics. Minutes used to be writable
  // only by the logger; now they can be typed, and a typed number wins.
  async function saveNumber(e) {
    const k = state.seg;
    const raw = (document.getElementById("steps").value || "").replace(/[^0-9]/g, "");
    if (raw === "") {
      state.msg = "Enter a number."; state.msgKind = "bad"; render(); return;
    }
    e.target.disabled = true;
    // p_date is null for today on purpose. The server decides what "today"
    // means for this person; the phone only says which zone it is in. A page
    // that has been open since yesterday therefore cannot write yesterday.
    const res = await call("app_log", { p_code:state.code, p_person:state.meId,
      p_value:Number(raw), p_metric:M[k].key,
      p_date:state.entryDate || null, p_tz:deviceTZ() });
    state.msg = res.error ? res.error : "Saved. Your family can see it.";
    state.msgKind = res.error ? "bad" : "ok";
    if (!res.error) state.entryDate = null;
    if (state.range === "month") { state.month[k] = null; await loadMonth(); }
    await refresh();
    setTimeout(() => { state.msg = null; state.msgKind = null; }, 100);
  }

  async function saveLabel(next) {
    const from = state.lift.renameFrom;
    if (!from) return;
    const res = await call("app_lift_label", {
      p_code: state.code, p_person: state.meId,
      p_old: from, p_new: next, p_mode: state.mode });
    if (res.error) { alert(res.error); return; }
    state.lift.rename = null; state.lift.menu = null; state.lift.renameFrom = null;
    await loadLift();
    render();
  }

  async function openSession(id) {
    const res = await call("app_lift_detail", { p_code: state.code, p_session: id });
    if (res.error || !res.session) return;
    state.lift.detail = res.session;
    state.lift.from = "exercise";
    state.view = "detail";
    render();
  }

  async function openExercise(seg) {
    if (!state.meId) return;
    stopTicking();
    state.seg  = seg || "steps";
    state.mode = state.seg === "cardio" ? "cardio" : "lift";
    state.lift.loaded = false;
    state.lift.labels = []; state.lift.sessions = [];
    state.lift.menu = null; state.lift.rename = null;
    loadLocal();
    state.view = "exercise";
    render();                 // paint immediately; the list can arrive after
    if (state.seg !== "steps") { await loadLift(); render(); }
    if (state.range === "month") { await loadMonth(); render(); }
    if (state.fam.open) { await loadFamily(); render(); }
  }

  /* ---------- the board: a glance, not a dashboard -------------------
     V1.5 moved the entry box, the charts, the stats and the week arrows
     into Exercise. What is left is who you are, what the five pillars say
     about your day, the family, and one button. Everything else is one
     tap in, which is the only shape that still reads when there are five
     pillars instead of one.
     ------------------------------------------------------------------ */

  // Did this person record ANYTHING today? Deliberately not `done`.
  //
  // `done` is the bar: the step goal met, or a workout, or cardio. It still
  // drives the roster's "moved" mark and the execution percentage, because
  // a rate that counts 400 steps as a win measures nothing.
  //
  // The green circle is the other question — did you show up — and it is
  // the one the board should answer, because logging is the habit being
  // built and punishing a 4,000-step day with a grey dot teaches people to
  // stop opening the app.
  const anyLog = (p) => val(p,"steps") > 0 || val(p,"train") > 0 || val(p,"cardio") > 0;

  function todayWords(p) {
    const bits = [];
    if (val(p,"steps")  > 0) bits.push(`${num(val(p,"steps"))} steps`);
    if (val(p,"train")  > 0) bits.push(`${num(val(p,"train"))}m train`);
    if (val(p,"cardio") > 0) bits.push(`${num(val(p,"cardio"))}m cardio`);
    return bits.length ? bits.join(" \u00b7 ") : "Tap to log today";
  }

  // V1.7. Exercise is a MASTER CATEGORY, not a destination.
  //
  // The header labels it and carries its state and its execution rate. The
  // three tiles under it are what you tap, and each is one tap from home
  // to the number it holds. That cost Train and Cardio a tap in V1.6,
  // where they sat behind an overview screen that has now been deleted.
  //
  // It also scales: Sleep arrives as a second header with its own tiles,
  // and nothing on this screen has to be redesigned to make room.
  function markRow(p, clickable) {
    const on = anyLog(p);
    const quiet = PILLARS.filter((pl) => !pl.live);
    const e = execOf(p);

    const tiles = [
      { k:"steps",  label:"Steps",  v: val(p,"steps"),
        unit: target(p,"steps") ? `of ${num(Math.round(target(p,"steps")))}` : "steps" },
      { k:"train",  label:"Train",  v: val(p,"train"),  unit:"minutes" },
      { k:"cardio", label:"Cardio", v: val(p,"cardio"), unit:"minutes" },
    ];

    return `
      <div class="cat${on ? " done" : ""}">
        <span class="box" aria-hidden="true">\u2713</span>
        <h2>${esc(PILLARS.find((x) => x.live).label)}</h2>
        ${e.day ? (clickable
          ? `<button type="button" class="score" id="kpi">${kpiWords(e)}</button>`
          : `<span class="score">${kpiWords(e)}</span>`) : ""}
      </div>
      <div class="cattiles">${tiles.map((t) => {
        const inner = `
          <span class="t3l">${t.label}</span>
          <span class="t3v">${t.v > 0 ? num(Math.round(t.v)) : "\u2013"}</span>
          <span class="t3u">${esc(t.unit)}</span>`;
        return clickable
          ? `<button type="button" class="tile3${t.v > 0 ? " on" : ""}"
               data-tile="${t.k}" aria-label="${t.label}, open">${inner}</button>`
          : `<div class="tile3${t.v > 0 ? " on" : ""}">${inner}</div>`;
      }).join("")}</div>
      <div class="marks">${quiet.map((pl) =>
        `<span class="mark" aria-hidden="true">
          <span class="pip off"></span><span class="mlabel">${esc(pl.label)}</span>
        </span>`).join("")}</div>`;
  }

  // One editor, two screens: names are edited on the board, goals on
  // Exercise. Rendering it in only one place is how tapping a goal used to
  // open nothing at all.
  function editRowHTML() {
    if (!state.editing) return "";
    return `
      <div class="addrow" id="editRow">
        <input class="field" id="editVal" maxlength="40" autocomplete="off"
               ${state.editing === "name" ? "" : 'type="number" inputmode="numeric"'}

               aria-label="${state.editing === "name" ? "Name" : "Daily goal"}">
        <button class="btn" id="editSave">Save</button>
        <button class="btn-quiet" id="editCancel">Cancel</button>
        <p class="hint" id="editHint" style="flex-basis:100%;margin-top:0">${editHintText()}</p>
      </div>`;
  }

  function boardView() {
    const m = me();
    const livePillars = PILLARS.filter((x) => x.live).length;
    const logged = state.people.filter(anyLog).length;
    const moved  = state.people.filter((p) => p.done).length;

    const whoOptions = state.people.length === 0
      ? `<option value="">nobody yet</option>`
      : (!state.meId ? `<option value="">choose your name</option>` : "") +

    const mine = m ? `

      </section>` : `
      <div class="dashed"><p class="note">Pick your name above, or add it,
        and your day appears here.</p></div>`;

    const roster = state.people.length === 0
      ? `<div class="dashed"><p class="note">Nobody has been added yet.
           Add the first name above.</p></div>`
      : `<div class="roster">${state.people.map((p) => {
          const v = val(p, "steps"), t = target(p, "steps");
          const initials = p.name.trim().split(/\s+/).slice(0,2)
            .map((w) => (w[0] || "").toUpperCase()).join("");
          const isMe = p.id === state.meId;
          return `<div class="person${p.done ? " did" : ""}">
            <span class="dot" aria-hidden="true"
              style="background:color-mix(in oklab, hsl(${p.hue} 62% 48%) 16%, var(--surface));
                     color:color-mix(in oklab, hsl(${p.hue} 62% 48%) 78%, var(--ink))"
              >${esc(initials)}</span>
            <div class="who">
              <div class="name">
                <button class="tapedit" data-edit="name" data-person="${p.id}"
                  >${esc(p.name)}</button>
                ${isMe ? "<em>you</em>" : ""}
                ${p.streak > 1 ? `<em>${p.streak}d</em>` : ""}
              </div>
              <div class="sub2">${[
                  p.lifted ? `<button class="liftchip" data-see="${p.id}" data-m="lift"
                     aria-label="See ${esc(p.name)}'s workout">${val(p,"train")}m train</button>` : "",
                  Number(p.cardio_distance) > 0 || val(p,"cardio") > 0
                    ? `<button class="liftchip cardio" data-see="${p.id}" data-m="cardio"
                     aria-label="See ${esc(p.name)}'s cardio">${val(p,"cardio")}m${
                       Number(p.cardio_distance) > 0 ? " \u00b7 " + esc(distWords(p.cardio_distance)) : ""
                     }</button>` : "",
                ].filter(Boolean).join(" ") || "&nbsp;"}</div>
            </div>
            <div class="num"><b>${v > 0 ? num(v) : "&mdash;"}</b>
              <span class="${p.done ? "met" : ""}">${
                p.done ? "\u2713 moved" : v > 0 ? "of " + num(t) : "nothing yet"}</span></div>
          </div>`;
        }).join("")}</div>`;

    return `
      <header class="masthead">
        <h1>${esc(state.group.name)}</h1>
        <p class="sub">${esc(new Date(todayISO() + "T00:00:00Z").toLocaleDateString(undefined,
          { timeZone:"UTC", weekday:"long", month:"long", day:"numeric" }))}</p>
      </header>

      <div class="whoami">
        <span class="label">I am</span>
        <select id="who" aria-label="Which family member are you"
          ${state.people.length === 0 ? "disabled" : ""}>${whoOptions}</select>
        <button class="linkbtn" id="addBtn">${state.adding ? "Never mind" : "Add someone"}</button>
      </div>

      ${editRowHTML()}

      <div class="addrow" id="addRow" ${state.adding ? "" : "hidden"}>
        <input class="field" id="addName" placeholder="Their name" maxlength="40"
               autocomplete="off" aria-label="Name of the person to add">
        <button class="btn" id="addSave">Add</button>
        <p class="hint" id="addHint" style="flex-basis:100%;margin-top:0"></p>
      </div>

      ${installHint()}
      ${mine}

      <section>
        <div class="section-head">
          <button class="foldbtn" id="foldBoard" aria-expanded="${boardOpen()}">
            <span class="caret">${boardOpen() ? "\u25be" : "\u25b8"}</span>
            <h2>The family today</h2></button>
          <span class="eyebrow">${state.people.length
            ? `${logged}/${state.people.length} logged \u00b7 ${moved} moved` : ""}</span>
        </div>
        ${boardOpen() ? roster : ""}
      </section>

      <button class="btn" id="waShare" style="width:100%">Post today to WhatsApp</button>

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- Exercise: one pillar, three numbers ---------------------
     This screen absorbed both logger homes. A single segment picks which
     number you are looking at AND which log sits underneath it, so
     starting a workout is still three taps and there is no tab bar to
     outgrow when the other four pillars arrive.
     ------------------------------------------------------------------ */

  // V1.6. The chart is the form. One line under the bar you tapped, showing
  // whichever day is selected — today when you land, so the common case is
  // still type-and-go and nothing had to be picked from a date field.
  function daySheet() {
    const iso = entryDay();
    const rec = dayRecord("steps");
    const label = iso === todayISO() ? "Today" : longLabel(iso);
    return `
      <div class="daysheet">
        <span>${esc(label)}</span>
        <input id="steps" type="number" inputmode="numeric" placeholder="0"
               aria-label="Steps on ${esc(label)}"
               value="${rec.logged ? rec.value : ""}">
        <em>steps</em>
        <button class="btn-quiet" id="save">${rec.logged ? "Update" : "Log"}</button>
      </div>
      ${state.msg
        ? `<p class="hint dshint ${state.msgKind || ""}" id="hint">${esc(state.msg)}</p>`
        : `<p class="hint dshint">Tap any bar to log that day.</p>`}`;
  }

  /* ---------- one page per metric --------------------------------------
     V1.7. Steps, Train and Cardio are three pages built from one template,
     each one tap from home. The V1.6 overview screen that used to sit in
     front of them is deleted: it held a number you can see on the tile, a
     score that moved to the category header, and two pills the tiles
     replaced.

     Top to bottom, every page is the same shape, so learning one teaches
     all three: today's number, the week as seven tappable bars, the thing
     that records it, then the family behind a fold.
     ------------------------------------------------------------------ */

  const PAGE = {
    steps:  { sub:"The keystone. One number a day.", verb:"steps" },
    train:  { sub:"Lifting and yoga.",               verb:"minutes" },
    cardio: { sub:"Walking, running, swimming, the machines.", verb:"minutes" },
  };

  /* ---------- the log box ---------------------------------------------
     V1.7b splits recording from reviewing. This box records: it carries
     its own date, its own number and nothing else. The graph below it is
     for looking at, and the two no longer share a card and confuse which
     of them you are touching.

     All three metrics are typed now. Train and Cardio still have the
     logger, and a workout still writes the minutes — but a number you
     type outranks it, permanently, for that day. One sentence, no marks
     to decode: what you typed is what the day says.
     ------------------------------------------------------------------ */
  function logCard(k) {
    const met = M[k];
    const m   = me() || {};
    const iso = entryDay();
    const rec = dayRecord(k);
    const isToday = iso === todayISO();
    const goal = target(m, k);
    const shown = isToday ? val(m, k) : rec.value;

    return `
      <section class="card">
        <div class="daynav">
          <button type="button" id="dPrev" aria-label="Previous day">&lsaquo;</button>
          <span>${isToday ? "Today" : esc(fullDate(iso))}</span>
          <button type="button" id="dNext" aria-label="Next day"
            ${isToday ? "disabled" : ""}>&rsaquo;</button>
        </div>

        <div class="domino" style="padding-top:10px">
          <b class="big" style="color:${met.color}">${num(Math.round(shown))}</b>
          <button type="button" class="of" data-edit="goal" data-metric="${k}">${goal
            ? `of <b>${num(Math.round(goal))}</b> ${met.unit}`
            : `set a ${esc(met.label.toLowerCase())} target`}</button>
        </div>

        <div class="logrow">
          <input id="steps" type="number" inputmode="numeric" placeholder="0"
                 aria-label="${esc(met.label)} on ${isToday ? "today" : esc(fullDate(iso))}"
                 value="${rec.logged ? rec.value : ""}">
          <em>${esc(met.unit)}</em>
          <button class="btn" id="save" style="background:${met.color};padding:11px 20px">${
            rec.logged ? "Update" : "Log"}</button>
        </div>

        ${k === "steps" ? "" : `
          <button class="btn-quiet" id="startEmpty" style="width:100%;margin-top:10px">
            ${k === "cardio" ? "Start an activity" : "Start a workout"} instead</button>`}

        <p class="hint dshint ${state.msgKind || ""}" id="hint">${state.msg ? esc(state.msg)
          : k === "steps"
            ? "Or tap a day on the graph below."
            : "A workout you log fills this in \u2014 a number you type wins."}</p>
      </section>`;
  }

  function graphCard(k) {
    const met = M[k];
    const month = state.range === "month";
    const total = points(k).reduce((t, p) => t + p.value, 0);

    return `
      <section>
        <div class="section-head">
          <h2>${month ? "Last 5 weeks" : "The week"}</h2>
          <div class="rangetog" role="group" aria-label="How much to show">
            ${[["week","Week"],["month","Month"]].map(([v, l]) =>
              `<button type="button" data-range="${v}"
                aria-pressed="${state.range === v}">${l}</button>`).join("")}
          </div>
        </div>
        <div class="card">
          ${month ? monthGrid(k) : `
            <div class="mini-head">
              <span class="mini-name" style="color:${met.color}">${met.label}</span>
              <span class="mini-total">${num(Math.round(total))} ${esc(met.unit)}</span>
            </div>
            ${miniChart(k)}
            <div class="weekrow">
              <button type="button" id="wPrev" aria-label="Previous week">&lsaquo;</button>
              <span class="wlab">${esc(weekWords())}</span>
              <button type="button" id="wNext" aria-label="Next week"
                ${weekBounds().start === thisMonday() ? "disabled" : ""}>&rsaquo;</button>
            </div>`}
        </div>
      </section>`;
  }

  function metricView() {
    const k = state.seg;
    const met = M[k];

    const unitRow = k === "steps" ? "" : `
      <div class="unitrow">
        <span>Show ${k === "cardio" ? "distance" : "weight"} in</span>
        <div class="range" role="group" aria-label="${
          k === "cardio" ? "Distance unit" : "Weight unit"}">${
          (k === "cardio" ? ["mi","km","m"] : ["lb","kg"]).map((u) =>
            `<button type="button" data-${k === "cardio" ? "d" : "w"}unit="${u}"
              aria-pressed="${(k === "cardio" ? units.d : units.w) === u}">${u}</button>`
          ).join("")}</div>
      </div>`;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <h1>${esc(met.label)}</h1>
        <p class="sub">${esc(PAGE[k].sub)}</p>
      </header>

      ${resumeBanner()}
      ${logCard(k)}
      ${editRowHTML()}
      ${graphCard(k)}

      ${k === "steps" ? "" : `
        ${unitRow}
        ${liftTiles()}
        ${liftHistory()}`}

      ${famBlock()}

      <p class="ver">v${APP_VERSION}</p>`;

  function notConfigured() {
    return `
      <header class="masthead">
        <p class="eyebrow">Setup incomplete</p>
        <h1>Two settings missing</h1>
      </header>
      <div class="banner">
        This page has not been given its database address yet. Open
        <code>index.html</code>, and near the top replace
        <code>__SUPABASE_URL__</code> and <code>__SUPABASE_ANON_KEY__</code> with the
        Project URL and the <b>anon</b> key from Supabase &rarr; Project Settings &rarr; API.
      </div>`;
  }

  /* ---------- render + events -------------------------------------- */
  function render() {
    if (!configured) { app.innerHTML = notConfigured(); return; }
    if (state.fatal) {
      app.innerHTML = `<div class="banner">${esc(state.fatal)}</div>
        <p style="margin-top:16px"><a href="${location.pathname}">Start over</a></p>`;
      return;
    }
    if (!(state.code && state.group)) { app.innerHTML = landing(); wire(); return; }

    if (state.view === "exercise") { app.innerHTML = metricView(); wireExercise(); return; }
    if (state.view === "session")  { app.innerHTML = sessionView();  wireLift();     return; }
    if (state.view === "detail")   { app.innerHTML = detailView();   wireLift();     return; }

    app.innerHTML = boardView();
    wire();
  }


  function wireChart(k) {
    const host = document.getElementById("chart-" + k);
    const svg = host && host.querySelector("svg");
    if (!svg) return;
    const n = points(k).length;

    // Two bars, two verbs. Tapping a Steps bar backlogs that day, which
    // is what you can still type. Tapping a Train bar opens the workout
    // behind it, because nobody types train minutes any more — and if
    // there is no workout, it offers to log one for that day.
    svg.addEventListener("click", async (e) => {
      const iso = e.target && e.target.dataset ? e.target.dataset.day : null;
      if (!iso) return;

      if (k !== "steps") {
        const got = await call("app_lift_detail", {
          p_code: state.code, p_person: state.meId, p_date: iso,
          p_mode: k === "cardio" ? "cardio" : "lift" });
        const sess = got && got.session;
        if (sess) {
          state.lift.detail = sess;
          state.lift.from = "exercise";
          state.view = "detail";
          render();
        } else {
          // V1.7. An empty bar is not a dead end any more. It is how you
          // record a workout you did but did not log — the same gesture
          // that backlogs a step count one page over.
          state.msg = null;
          state.mode = k === "cardio" ? "cardio" : "lift";
          await startSession("", iso);
        }
        return;
      }

      // A Steps bar is the only way left to log a past day, now that the
      // date picker is gone. The week is already loaded, so there is
      // nothing to fetch.
      state.entryDate = iso === todayISO() ? null : iso;
      state.msg = null;
      render();
      document.getElementById("steps")?.focus();
    });

  }

  function openEditor(kind, personId) {
    state.editing = kind;
    state.editPerson = personId || state.meId;
    state.adding = false;
    render();
    const f = document.getElementById("editVal");
    if (f) { f.focus(); f.select(); }
  }

  function on(id, ev, fn) {
    const el = document.getElementById(id);
    if (el) el.addEventListener(ev, fn);
  }

  function wire() {
    /* landing */
    on("open", "click", () => {
      const c = (document.getElementById("code").value || "").trim().toUpperCase();
      if (!c) { state.msg = "Enter the code your family sent you."; render(); return; }
      location.search = "?g=" + encodeURIComponent(c);
    });
    on("code", "keydown", (e) => { if (e.key === "Enter") document.getElementById("open").click(); });

    on("create", "click", async (e) => {
      const name = (document.getElementById("gname").value || "").trim();
      const tz = document.getElementById("gtz").value;
      if (!name) { state.msg = "Give the group a name."; render(); return; }
      e.target.disabled = true;
      const res = await call("app_create_group", { p_name: name, p_timezone: tz });
      if (res.error) { state.msg = res.error; e.target.disabled = false; render(); return; }
      location.search = "?g=" + res.code;
    });

    /* group */
    on("who", "change", async (e) => {
      saveMe(e.target.value);
      state.msg = null;
      await loadHistory();
      render();
    });

    on("addBtn", "click", () => { state.adding = !state.adding; state.editing = null; render();
      const el = document.getElementById("addName"); if (el) el.focus(); });

    on("addSave", "click", async (e) => {
      const name = (document.getElementById("addName").value || "").trim();
      const hint = document.getElementById("addHint");
      if (!name) { hint.textContent = "Type a name first."; return; }
      e.target.disabled = true;
      const res = await call("app_add_person", { p_code: state.code, p_name: name });
      if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      saveMe(res.id);
      state.adding = false;
      await refresh();
    });
    on("addName", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("addSave").click();
      if (e.key === "Escape") { state.adding = false; render(); }
    });



    on("foldBoard", "click", () => {
      try { localStorage.setItem("fhd.board", boardOpen() ? "shut" : "open"); } catch {}
      render();
    });


    on("installNo", "click", () => {
      try { localStorage.setItem("fhd.install", "no"); } catch {}
      const el = document.getElementById("installHint");
      if (el) el.remove();
    });




    document.querySelectorAll('[data-edit="name"]').forEach((el) => {
      el.addEventListener("click", () => openEditor("name", el.dataset.person));
    });

    wireEditor();
    wireBoardActions();
  }

  function wireEditor() {
    on("editCancel", "click", () => { state.editing = null; render(); });

    on("editSave", "click", async (e) => {
      const kind = state.editing;
      const raw = (document.getElementById("editVal").value || "").trim();
      const hint = document.getElementById("editHint");

      if (kind === "goal") {
        const t = Number(raw.replace(/[^0-9]/g, ""));
        if (!t) { hint.textContent = "Enter a target above zero."; return; }
        e.target.disabled = true;
        const res = await call("app_set_goal", {
          p_code: state.code, p_person: state.meId, p_target: t,
          p_metric: M[state.editMetric].key,
        });
        if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      } else {
        if (!raw) { hint.textContent = "A name cannot be blank."; return; }
        e.target.disabled = true;
        const res = await call("app_rename_person", {
          p_code: state.code, p_person: state.editPerson || state.meId, p_name: raw,
        });
        if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      }
      state.editing = null;
      await refresh();
    });

    on("editVal", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("editSave").click();
      if (e.key === "Escape") { state.editing = null; render(); }
    });
  }

  // Board-only: the pillar marks, the tap-through chips, the one button.
  function wireBoardActions() {
    // The marks ARE the navigation. Tapping a live pillar goes straight
    // into it, which is why there is no tab bar and no Log screen: pillars
    // two to five arrive as taps, not as furniture.
    // V1.7. Three tiles, three destinations, one tap each.
    document.querySelectorAll("[data-tile]").forEach((el) =>
      el.addEventListener("click", () => openExercise(el.dataset.tile)));

    on("kpi", "click", () => {
      state.kpi = state.kpi === "week" ? "cycle" : "week";
      try { localStorage.setItem("fhd.kpi", state.kpi); } catch {}
      render();
    });

    // Tap someone's volume chip to read the session behind it. The board
    // stays a scoreboard; the detail is one tap away for whoever wants it.
    document.querySelectorAll("[data-see]").forEach((el) => {
      el.addEventListener("click", async () => {
        const m = el.dataset.m;
        const res = await call("app_lift_detail", {
          p_code: state.code, p_person: el.dataset.see, p_mode: m });
        if (res.error || !res.session) return;
        state.mode = m;
        state.lift.detail = res.session;
        state.lift.from = "board";
        state.view = "detail";
        render();
      });
    });

    on("waShare", "click", () => {
      // WhatsApp's official click-to-chat link. No API, no cost, no bot:
      // it opens WhatsApp with the message written, and you pick the group.
      window.open("https://wa.me/?text=" + encodeURIComponent(dailyMessage()), "_blank");
    });
  }

  /* ---------- boot -------------------------------------------------- */
  (async () => {
    if (!configured) { render(); return; }
    if (!sb) {
      state.fatal = "Could not load the database library. Check your connection and reload.";
      render(); return;
    }
    if (state.code) {
      state.meId = loadMe();
      state.fam.open = famOpen();
      try {
        state.kpi = localStorage.getItem("fhd.kpi") === "cycle" ? "cycle" : "week";
        state.range = localStorage.getItem("fhd.range") === "month" ? "month" : "week";
        state.histOpen = localStorage.getItem("fhd.hist") === "open";
      } catch {}
      await refresh();
      watchClock();
      // A workout finished with no signal uploads itself the moment there
      // is one — on this load, and again whenever the phone reconnects.
      loadLocal();
      flushPending().then(() => { if (state.view === "board") render(); });
      window.addEventListener("online", () => {
        flushPending().then(() => { if (state.view !== "session") render(); });
      });
    } else {
      render();
    }
  })();
})();
</script>
</body>
</html>
