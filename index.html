  function wireTrainAdd() {
    on("taOpen", "click", () => { state.trainAdd = { label: "", min: "" }; render(); document.getElementById("taMin")?.focus(); });
    on("taCancel", "click", () => { state.trainAdd = null; render(); });
    on("taLabel", "input", (e) => { state.trainAdd.label = e.target.value; });
    on("taMin", "input", (e) => { state.trainAdd.min = e.target.value; });
    const save = async () => {
      const A0 = state.trainAdd; if (!A0) return;
      const m = parseMinutes(A0.min || "");
      if (!m || m < 1) { A0.err = "Type the minutes, like 30 or 1:15."; render(); return; }
      const res = await call("app_train_add", { p_code: state.code, p_person: state.meId, p_date: entryDay() === todayISO() ? null : entryDay(), p_min: m, p_label: (A0.label || "").trim() || null });
      if (res.error) { A0.err = res.offline ? "No signal. Not saved yet." : res.error; render(); return; }
      state.trainAdd = null; state.trSheet = false; state.lift.msg = `Added ${hm(m)}${A0.label ? " of " + A0.label.trim() : ""}.`;
      await loadLift(); await refresh();
    };
    on("taSave", "click", save);
    on("taMin", "keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); save(); } });
  }
  function liftHistory() {
    if (!state.lift.sessions.length)
      return `<div class="dashed"><p class="empty">Nothing logged yet.<br>
        ${state.mode === "cardio"
          ? "Log a swim, row or ride and it appears here."

    return `<section>
        <div class="section-head">

        ${state.histOpen
          ? state.lift.sessions.map((s) => sessionCard(s, true)).join("") : ""}
      </section>`;
  }

  function sessionView() {
    const a = A();
    if (!a) { state.view = "exercise"; return metricView(); }

    const blocks = a.ex.map((x, i) => exBlock(x, i)).join("") ||

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; Exercise</button>

      <header class="masthead">
        <div style="display:flex;align-items:center;gap:10px">
          <h1 style="flex:1;min-width:0">${a.fromTile
            // V2.4. You already said which workout this is, by tapping its
            // tile. Leaving the name editable here meant a stray keystroke
            // minted a second tile that looked like a duplicate of the
            // first — and there was no way to tell "today is C2" apart
            // from "C is now called C2". So a workout started from a tile
            // carries that tile's name as a heading. Renaming lives on the
            // tile, where it means one thing.
            ? `<span class="labelfix">${esc(a.label)}</span>`
            : `<input id="labelIn" class="labelin" value="${esc(a.label)}" maxlength="24"
                   placeholder="Name this day" autocomplete="off"
                   aria-label="What to call this workout">`}</h1>
          <button class="btn" id="finish" style="padding:10px 18px">Finish</button>
        </div>
        ${a.fromTile ? `
          <!-- V2.5. Which workout this is, and what today's was, are two
               different facts. The tile above is the first; this is the
               second. It goes in History and never makes a tile, which
               is what the old editable title could not promise. -->
          <input id="noteIn" class="notein" value="${esc(a.note || "")}" maxlength="40"

        <div class="timer">
          ${(a.mode || state.mode) === "cardio" || a.durOverride !== null
            ? `<span class="durwrap"><input id="durIn" class="durin" type="number"

            : `<b id="elapsed">${clock(elapsedMs(a))}</b>

          <span id="sessTotals">${totalsWords(a)}</span>
        </div>
        <!-- V4.2. The "Today · change" line is deleted, as asked. A workout
             files under the day it was started; to log a past day, tap
             that day's bar on the chart, which starts one there. -->
        ${a.edit ? `<label class="sessdate">Date <input type="date" id="sessDate" class="field" value="${esc(a.date)}" max="${todayISO()}" aria-label="The day of this workout"></label>`
          : a.date === todayISO() ? "" : `<p class="sessday">${esc(fullDate(a.date))}</p>`}
      </header>

      <div id="blocks">${blocks}</div>

      <div class="exadd">
        <input class="field" id="exName" list="exlist" placeholder="Add ${
          state.mode === "cardio" ? "an activity" : "an exercise"}"

        align-self:flex-start;font-size:12px">Discard this ${
        state.mode === "cardio" ? "activity" : "workout"}</button>

      <p class="ver">v${APP_VERSION}</p>`;
  }

  // One row shape per kind. This is the whole reason Cardio needed no
  // second app: the exercise decides the columns, exactly as Strong does.
  const COLS = {
    weight_reps:   () => [units.w, "reps"],
    duration:      () => ["time"],
    distance_time: () => [units.d, "time"],
  };

  // V2.3. What you lifted last time, beside the box you are about to type
  // in. The numbers were already being PREFILLED from the last session,
  // which sounds like the same thing and is not: once you overwrite the
  // box, the thing you were trying to beat is gone off the screen.
  function prevWords(s, kind) {
    if (!s) return "";
    if (kind === "duration")      return s.pt ? mmss(s.pt) : "";
    if (kind === "distance_time") return (s.pd || s.pt)
      ? `${s.pd ? dShow(s.pd) : "0"}\u00b7${mmss(s.pt || 0)}` : "";
    return s.pw ? `${wShow(s.pw)}\u00d7${s.pr || 0}` : "";
  }

  function exBlock(x, i) {
    const kind = x.kind || "weight_reps";
    const cols = COLS[kind]();
    const cls  = kind === "weight_reps" ? "" : cols.length === 1 ? " one" : "";
    // The unit choice used to be one row at the FOOT of the workout, two
    // buttons reading "weights time", which is a sentence nobody wrote and
    // applied to whatever you typed next. It belongs to the exercise, so
    // it lives on the exercise — and only until the exercise has a history
    // or a ticked set, after which it is settled and the control is noise.
    // V2.6. Always there, on every exercise, whatever it has recorded
    // before. V2.3 hid it once an exercise had a history or a ticked set,
    // on the theory that the question was then settled — which is exactly
    // backwards for Yoga or a farmer's carry, the movements most likely to
    // be logged one way this week and the other way next. A carry is reps
    // on Monday and a stopwatch on Thursday, and neither is a mistake.
    // V2.7. Reps are gone from Cardio: nobody counts reps of a swim, and
    // offering it only invited the wrong choice.
    const KINDS = state.mode === "cardio"
      ? [["distance_time", "distance"], ["duration", "time"]]
      : [["weight_reps", "reps"], ["duration", "time"]];
    // One chip, tapped to cycle mi -> km -> m, rather than three units
    // sitting there all the time. It shows on a distance exercise only,
    // because it has nothing to say about anything else.
    const unitChip = kind === "distance_time"
      ? `<button type="button" class="unitchip" data-cycle="d"
           aria-label="Distance unit, now ${esc(units.d)}">${esc(units.d)}</button>`
      : "";
    // V4.2. The reps/time switch is the column header itself: tap "reps"
    // and the exercise records time; tap "time" and it is reps again.
    const other = (KINDS.find(([kk]) => kk !== kind) || KINDS[0])[0];
    const otherWord = (KINDS.find(([kk]) => kk === other) || [, ""])[1];
    const picker = unitChip ? `<div class="kindmini">${unitChip}</div>` : "";

    const field = (s, j, f, ph, label) => {
      const val = f === "w" ? (s.w ? wShow(s.w) : "")
                : f === "r" ? (s.r || "")
                : f === "d" ? (s.d ? dShow(s.d) : "")
                : (s.t ? mmss(s.t) : "");
      const numeric = f === "r";
      return `<input type="${f === "t" ? "text" : "number"}"
             inputmode="${f === "t" ? "numeric" : numeric ? "numeric" : "decimal"}"
             data-ex="${i}" data-set="${j}" data-f="${f}"
             class="${s.on ? "on" : !counts(s, kind) && hasNumsSet(s, kind) ? "pre" : ""}" value="${val}" placeholder="${ph}"
             aria-label="Set ${j + 1} ${label}">`;
    };

    const rows = x.sets.map((s, j) => {
      const cells =
        kind === "weight_reps"   ? field(s,j,"w","0",units.w) + field(s,j,"r","0","reps")
      : kind === "duration"      ? field(s,j,"t","0:00","time")
      :                            field(s,j,"d","0",units.d) + field(s,j,"t","0:00","time");
      const pw = prevWords(s, kind);
      return `<span class="ix">${j + 1}</span>
      <span class="prev">${pw || "\u2013"}</span>${cells}
      <button class="tick" data-tick="${i}:${j}" aria-pressed="${!!s.on}"
              aria-label="Mark ${j + 1} done">&#10003;</button>
      <button class="xset" data-delset="${i}:${j}"
              aria-label="Delete set ${j + 1}">&times;</button>`;
    }).join("");

    return `
      <div class="exblock" id="ex-${i}">
        <div class="exhead">
          <input class="exname" data-exname="${i}" value="${esc(x.name)}" maxlength="60"
                 aria-label="Exercise name">
          ${picker}
          <button class="xbtn" data-delex="${i}" aria-label="Remove ${esc(x.name)}">&times;</button>
        </div>
        <div class="setgrid${cls}">
          <span class="hd">#</span><span class="hd">Prev</span>${cols.map((c, ci) =>
            (c === units.w || c === units.d)
              ? `<button class="hd unit" data-cycle="${c === units.w ? "w" : "d"}"
                   aria-label="Change unit">${esc(c)}</button>`
              : ci === cols.length - 1
                ? `<button type="button" class="hd kindtog" data-exkind="${i}:${other}"
                     aria-label="${esc(x.name)} records ${esc(c)}. Tap to record ${esc(otherWord)}">${esc(c)}<i aria-hidden="true">&#8644;</i></button>`
                : `<span class="hd">${esc(c)}</span>`).join("")}
          <span class="hd"></span><span class="hd"></span>
          ${rows}
        </div>
        <button class="addset" data-addset="${i}">+ Add ${
          kind === "weight_reps" ? "set" : "entry"}</button>
      </div>`;
  }

  function detailView() {
    const s = state.lift.detail;
    if (!s) { state.view = "exercise"; return metricView(); }
    const byPos = new Map();
    for (const r of (s.sets || [])) {
      if (!byPos.has(r.position)) byPos.set(r.position, { name: r.exercise, sets: [] });
      byPos.get(r.position).sets.push(r);
    }
    const cell = (r) =>
        r.kind === "duration"      ? mmss(r.seconds)
      : r.kind === "distance_time" ? `${distWords(r.distance)} \u00b7 ${mmss(r.seconds)}`
      :                              `${wShow(r.weight)} ${units.w} \u00d7 ${r.reps}`;
    const blocks = [...byPos.entries()].sort((a, b) => a[0] - b[0]).map(([, x]) => `
      <div class="exblock">
        <div class="exhead"><b>${esc(x.name)}</b></div>
        <table class="htab"><tbody>${x.sets.map((r, i) => `
          <tr><td class="nm">${x.sets.length > 1 ? "Set " + (i + 1) : "—"}</td>
              <td>${cell(r)}</td></tr>`).join("")}</tbody></table>
      </div>`).join("");

    const mine = s.person_id === state.meId;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; Back</button>
      </div>

      <header class="masthead">
        <h1 style="color:var(--train)">${esc(s.label || "Workout")}${s.note
          ? `<span class="hnote">${esc(s.note)}</span>` : ""}</h1>
        <p class="sub">${esc(s.person)} &middot; ${esc(fullDate(s.entry_date))}</p>
        <div class="timer" style="margin-top:8px">
          <span><b>${s.duration_min}m</b></span>
          ${Number(s.distance) > 0 ? `<span><b>${distWords(s.distance)}</b></span>` : ""}
          ${s.pr_count > 0 ? `<span style="color:var(--train)">
            <b>${s.pr_count}</b> PR${s.pr_count === 1 ? "" : "s"}</span>` : ""}
        </div>
      </header>

      ${blocks}

      ${mine ? `<div class="addrow" style="margin-top:6px">
        <button class="btn" id="editSession">Edit</button>
        <button class="linkbtn" id="delSession" style="color:var(--warn)">
          Delete this workout</button>
      </div>` : ""}

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- lift painting ----------------------------------------
     Repaint the smallest thing that changed. V1.2 taught this the hard
     way: a full re-render while someone is typing throws the number away.
     ------------------------------------------------------------------ */

  let tick = null;
  function startTicking() {
    stopTicking();
    tick = setInterval(() => {
      const a = A(); const el = document.getElementById("elapsed");
      if (!a || !el) return stopTicking();
      el.textContent = clock(elapsedMs(a));
    }, 1000);
  }
  function stopTicking() { if (tick) { clearInterval(tick); tick = null; } }

  function paintTotals() {
    const a = A(); const el = document.getElementById("sessTotals");
    if (a && el) el.innerHTML = totalsWords(a);
  }

  function paintEx(i) {
    const a = A(); if (!a) return;
    const host = document.getElementById("ex-" + i);
    if (!host) return;
    const frag = document.createElement("div");
    frag.innerHTML = exBlock(a.ex[i], i);
    host.replaceWith(frag.firstElementChild);
    wireExBlock(i);
    paintTotals();
  }

  function wireExBlock(i) {
    const host = document.getElementById("ex-" + i);
    if (!host) return;
    const a = A();

    host.querySelectorAll("input[data-ex]").forEach((el) => {
      el.addEventListener("input", () => {
        const s = a.ex[+el.dataset.ex].sets[+el.dataset.set];
        const f = el.dataset.f, v = el.value;
        // Typed in whatever unit the phone is showing; stored in pounds
        // and metres. The conversion lives here and nowhere else.
        if (f === "t")      s.t = parseClock(v);
        else if (f === "d") s.d = v === "" ? 0 : dIn(Number(v));
        else if (f === "w") s.w = v === "" ? 0 : wIn(Number(v));
        else                s.r = v === "" ? 0 : Number(v);
        s.typed = true;
        host.querySelectorAll(`input[data-ex="${el.dataset.ex}"][data-set="${el.dataset.set}"]`)
          .forEach((f) => f.classList.remove("pre"));
        paintTotals();
        queueSync();
      });
    });

    host.querySelectorAll("[data-tick]").forEach((el) => {
      el.addEventListener("click", () => {
        const [xi, si] = el.dataset.tick.split(":").map(Number);
        const s = a.ex[xi].sets[si];
        s.on = !s.on;
        el.setAttribute("aria-pressed", String(s.on));
        host.querySelectorAll(`input[data-ex="${xi}"][data-set="${si}"]`)
            .forEach((f) => { f.classList.toggle("on", s.on);
              f.classList.toggle("pre", !counts(s, a.ex[xi].kind) && hasNumsSet(s, a.ex[xi].kind)); });
        paintTotals();
        queueSync();
      });
    });

    const add = host.querySelector("[data-addset]");
    if (add) add.addEventListener("click", () => {
      const sets = a.ex[i].sets;
      const last = sets[sets.length - 1] || {};
      sets.push({ w: last.w || 0, r: last.r || 0, d: last.d || 0, t: last.t || 0, on: false,
                  pw: last.pw || 0, pr: last.pr || 0, pd: last.pd || 0, pt: last.pt || 0 });
      queueSync();
      paintEx(i);
      const rows = document.querySelectorAll(`#ex-${i} .setgrid input`);
      const kindCols = (a.ex[i].kind === "weight_reps") ? 2 : (a.ex[i].kind === "duration" ? 1 : 2);
      const f = rows[rows.length - kindCols];
      if (f) { f.focus(); f.select(); }
    });

    // The weights/time switch, now on the exercise it describes. Changing
    // it keeps the rows and clears the columns that no longer apply, so a
    // plank typed as 3 reps does not silently become 3 seconds.
    host.querySelectorAll("[data-exkind]").forEach((el) =>
      el.addEventListener("click", () => {
        const [xi, kk] = el.dataset.exkind.split(":");
        const x = a.ex[+xi];
        if (!x || x.kind === kk) return;
        x.kind = kk;
        // Clear the columns that no longer apply, so 3 reps never becomes
        // 3 seconds. What is kept for each kind is what that kind means.
        for (const t of x.sets) {
          if (kk === "duration")           { t.w = 0; t.r = 0; t.d = 0; }
          else if (kk === "weight_reps")   { t.t = 0; t.d = 0; }
          else                             { t.w = 0; t.r = 0; }
        }
        queueSync();
        paintEx(+xi);
      }));

    const del = host.querySelector("[data-delex]");
    if (del) del.addEventListener("click", () => {
      a.ex.splice(i, 1);
      queueSync();
      render();
    });

    // V2.1b. Rename an exercise in place, and delete one set rather than
    // the whole exercise. Removing the last set removes the exercise,
    // because an exercise with no sets is not a thing that happened.
    const nm = host.querySelector("[data-exname]");
    if (nm) nm.addEventListener("change", () => {
      const v = (nm.value || "").trim();
      if (!v) { nm.value = a.ex[i].name; return; }
      a.ex[i].name = v;
      a.ex[i].kind = kindFor(v, a.ex[i].kind);
      queueSync();
      render();
    });

    host.querySelectorAll("[data-delset]").forEach((el) =>
      el.addEventListener("click", () => {
        const j = Number(el.dataset.delset.split(":")[1]);
        a.ex[i].sets.splice(j, 1);
        if (!a.ex[i].sets.length) a.ex.splice(i, 1);
        queueSync();
        render();
      }));
  }

  function wireLift() {
    on("back", "click", () => {
      stopTicking();
      // A session opened from the board belongs to the board. Sending
      // someone who tapped a relative's volume chip into their own Lift
      // history is a small thing that feels like being lost.
      if (state.view === "detail") {
        state.lift.detail = null;
        state.view = state.lift.from === "board" ? "board" : "exercise";
      }
      else if (state.view === "session") state.view = "exercise";
      else state.view = "board";
      if (state.view === "board") { state.seg = "steps"; state.entryDate = null; }
      render();
    });

    if (state.view === "exercise") {
      // V6.4. One button opens everything Train can start.
      on("trPlus", "click", () => { state.trSheet = true; render(); });
      const trClose = () => { state.trSheet = false; state.trainAdd = null; state.lift.menu = null; state.lift.rename = null; render(); };
      on("trX", "click", trClose); on("trBg", "click", trClose);
      on("startEmpty", "click", () => startSession(""));
      document.querySelectorAll("[data-starter]").forEach((el) =>
        el.addEventListener("click", () => startStarter(el.dataset.starter)));
      on("resume", "click", () => { state.view = "session"; render(); });
      document.querySelectorAll("[data-start]").forEach((el) =>
        el.addEventListener("click", () => startSession(el.dataset.start)));
      document.querySelectorAll("[data-open]").forEach((el) =>
        el.addEventListener("click", () => openSession(el.dataset.open)));

      document.querySelectorAll("[data-wunit]").forEach((el) =>
        el.addEventListener("click", () => { units.w = el.dataset.wunit; render(); }));
      document.querySelectorAll("[data-dunit]").forEach((el) =>
        el.addEventListener("click", () => { units.d = el.dataset.dunit; render(); }));

      document.querySelectorAll("[data-menu]").forEach((el) =>
        el.addEventListener("click", () => {
          state.lift.menu = state.lift.menu === el.dataset.menu ? null : el.dataset.menu;
          state.lift.rename = null;
          render();
        }));
      document.querySelectorAll("[data-rename]").forEach((el) =>
        el.addEventListener("click", () => {
          state.lift.rename = el.dataset.rename;
          state.lift.renameFrom = el.dataset.rename;
          state.lift.menu = null;
          render();
          const f = document.getElementById("renameVal");
          if (f) { f.focus(); f.select(); }
        }));
      on("renameNo", "click", () => { state.lift.rename = null; render(); });
      on("renameGo", "click", () => saveLabel(
        (document.getElementById("renameVal").value || "").trim()));
      on("renameVal", "keydown", (e) => {
        if (e.key === "Enter") document.getElementById("renameGo").click();
        if (e.key === "Escape") { state.lift.rename = null; render(); }
      });
      document.querySelectorAll("[data-drop]").forEach((el) =>
        el.addEventListener("click", () => openModal({
          title: `Remove the “${el.dataset.drop}” tile?`,
          body: "The workouts you logged under it stay in your history.",
          buttons: [
            { label: "Remove tile", kind: "bad", run: async () => {
                state.lift.renameFrom = el.dataset.drop;
                await saveLabel("");
              } },
            { label: "Keep it", kind: "quiet" },
          ],
        })));
    }

    if (state.view === "session") {
      const a = A();
      a.ex.forEach((_, i) => wireExBlock(i));
      if ((a.mode || state.mode) !== "cardio" &&
          (a.durOverride === null || a.durOverride === undefined)) startTicking();

      // Typing a duration takes the day: the chart moves to match.
      on("durEdit", "click", () => {
        A().durOverride = durationMin(A());
        stopTicking();
        render();
        const f = document.getElementById("durIn");
        if (f) { f.focus(); f.select(); }
      });
      // V4.7. A workout from History can move to another day.
      on("sessDate", "change", (e) => {
        const v = e.target.value, a0 = A();
        if (!a0 || !v || v > todayISO()) return;
        a0.date = v; saveLocal(); queueSync();
      });
      on("durIn", "change", () => {
        const f = document.getElementById("durIn");
        const v = Math.max(0, Math.min(600, Math.round(Number(f.value) || 0)));
        A().durOverride = v;
        saveLocal();
        queueSync();
        paintTotals();
      });

      // Tapping the unit in a column header cycles it. Putting the switch
      // on the header means you can go metric mid-swim without leaving
      // the session to find a setting.
      document.querySelectorAll("[data-cycle]").forEach((el) =>
        el.addEventListener("click", () => {
          if (el.dataset.cycle === "w") units.w = units.w === "lb" ? "kg" : "lb";
          else units.d = units.d === "mi" ? "km" : units.d === "km" ? "m" : "mi";
          render();
        }));

      on("exAdd", "click", () => {
        const f = document.getElementById("exName");
        const nm = (f.value || "").trim();
        if (!nm) { f.focus(); return; }
        // A name you have used before keeps its own kind. A new one comes
        // in as weights (a swim as distance) and carries its own little
        // weights/time switch until you tick a set, which is where V2.3
        // moved that choice from the foot of the page.
        const known = kindFor(nm, null);
        addExercise(nm, known ||
          (state.mode === "cardio" ? "distance_time" : "weight_reps"));
        f.value = "";
        render();
      });
      on("exName", "keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); document.getElementById("exAdd").click(); }
      });

      // The name is just a field. No prompt, no modal, no editor state —
      // a label you can only set at the start is a label you get wrong.
      on("labelIn", "input", (e) => { a.label = e.target.value.slice(0, 24); queueSync(); });
      on("noteIn", "input", (e) => { a.note = e.target.value.slice(0, 40); queueSync(); });

      on("finish", "click", () => finishFlow(a));

      on("scrap", "click", () => openModal({
        title: `Discard this ${state.mode === "cardio" ? "activity" : "workout"}?`,
        body: a.edit ? "Changes made so far are already saved." : "It is deleted, here and on the server.",
        buttons: [
          { label: "Discard", kind: "bad", run: () => {
              stopTicking();
              dropServerCopy(a);
              state.lift.active = null;
              saveLocal(a.mode);
              state.view = "exercise";
              render();
            } },
          { label: "Keep going", kind: "quiet" },
        ],
      }));
    }

    if (state.view === "detail") {
      // V2.1b. Editing a past workout reopens it in the same editor that
      // recorded it, rather than a second read-only one that would drift.
      on("editSession", "click", () => guardActive(() => {
        const d = state.lift.detail;
        if (!d) return;
        const byPos = new Map();
        for (const r of (d.sets || [])) {
          if (!byPos.has(r.position))
            byPos.set(r.position, { name: r.exercise, kind: r.kind || "weight_reps", sets: [] });
          byPos.get(r.position).sets.push({
            w: Number(r.weight) || 0, r: Number(r.reps) || 0,
            d: Number(r.distance) || 0, t: Number(r.seconds) || 0, on: true });
        }
        state.mode = d.mode === "cardio" ? "cardio" : "lift";
        state.seg  = state.mode === "cardio" ? "cardio" : "train";
        state.lift.active = {
          id: d.id, label: d.label || "", date: d.entry_date, note: d.note || "",
          // V5.3. Editing keeps the workout's name as it is: no "Name this
          // day" box that could make a new tile.
          fromTile: !!d.label,
          startedAt: Date.now(), endedAt: Date.now(), pendingFinish: false, edit: true,
          mode: state.mode, durOverride: Number(d.duration_min) || 0,
          ex: [...byPos.entries()].sort((x, y) => x[0] - y[0]).map(([, v]) => v),
        };
        state.lift.detail = null;
        saveLocal();
        state.view = "session";
        render();
      }, "editing this one"));

      // V2.8: confirm() does nothing in some in-app browsers, so this was a
      // button that silently did nothing there. Same modal as everywhere.
      on("delSession", "click", () => openModal({
        title: "Delete this workout?",
        body: "Its minutes come off that day.",
        buttons: [
          { label: "Delete", kind: "bad", run: async () => {
              const s = state.lift.detail;
              const res = await call("app_lift_delete", {
                p_code: state.code, p_person: state.meId, p_session: s.id });
              if (res.error) { say(res.error); return; }
              state.lift.detail = null;
              state.view = "exercise";
              await loadLift();
              render();
              refresh();
            } },
          { label: "Keep it", kind: "quiet" },
        ],
      }));
    }
  }

  // Exercise carries both halves: the steps entry and week charts that used
  // to be on the board, and the log that used to be its own screen.
  // V5.4. One tap logs the last cardio entry again.
  async function cqRepeatNow() {
    const L = cqLast(); if (!L || !L.act || !L.min) return;
    const rt = routineOf(L.act), reps = rt && rt.kind === "reps" ? Number(L.reps) || 0 : 0, dist = rt ? 0 : Number(L.dist) || 0;
    const day = state.view === "exercise" ? entryDay() : todayISO();
    const res = await call("app_lift_save", {
      p_code: state.code, p_person: state.meId, p_session: uuid(), p_label: L.act, p_note: null,
      p_date: day, p_duration: L.min,
      p_sets: [{ position: 0, set_index: 0, exercise: L.act, kind: !rt && dist ? "distance_time" : "duration",
                 weight: 0, reps, distance: dist, seconds: L.min * 60 }],
      p_finished: true, p_mode: "cardio", p_tz: deviceTZ(), p_claim: true });
    state.lift.msg = res.error ? (res.offline ? "No signal. Try again in a moment." : res.error) : `${L.act} · ${hm(L.min)} logged.`;
    render();
    if (!res.error) { await loadLift(); await loadHistory(); await refresh(); if (rt) await loadExTargets(); render(); }
  }
  function wireExercise() {
    wireExTargets();
    // V6.4. Tap a tile to log it; hold it (or right-click) to change or remove it.
    document.querySelectorAll("[data-cqgo]").forEach((el) => {
      let t = null, held = false;
      const edit = () => { held = true; try { navigator.vibrate && navigator.vibrate(15); } catch {}
        state.homeSheet = "cardio"; state.cq = { editing: el.dataset.cqgo, err: "" }; render(); };
      el.addEventListener("pointerdown", () => { held = false; clearTimeout(t); t = setTimeout(edit, 550); });
      for (const ev of ["pointerup", "pointerleave", "pointercancel"]) el.addEventListener(ev, () => clearTimeout(t));
      el.addEventListener("contextmenu", (e) => { e.preventDefault(); clearTimeout(t); if (!held) edit(); });
      el.addEventListener("click", (e) => { if (held) { e.preventDefault(); held = false; return; } openCardio(el.dataset.cqgo); });
    });
    // V5.5. Remove a tile: it leaves the grid; a daily target on it goes too.
    document.querySelectorAll("[data-cqdel]").forEach((el) => el.addEventListener("click", async () => {
      const n = el.dataset.cqdel;
      const hide = cqHidden().filter((x) => x.toLowerCase() !== n.toLowerCase()).concat([n]);
      try { localStorage.setItem(cqHideKey(), JSON.stringify(hide)); } catch {}
      const T = (state.ext && state.ext.targets) || [];
      if (T.some((x) => x.n.toLowerCase() === n.toLowerCase())) {
        state.ext.targets = T.filter((x) => x.n.toLowerCase() !== n.toLowerCase());
        await call("app_set_ex_targets", { p_code: state.code, p_person: state.meId, p_targets: state.ext.targets.map((x) => ({ n: x.n, kind: x.kind, t: x.t })) });
      }
      render();
    }));
    on("cqNew", "click", () => { state.homeSheet = "cardio"; state.cq = { adding: true, err: "", kind: "reps" }; render(); document.getElementById("cqNewName")?.focus(); });
    on("cqRepeat", "click", (e) => { e.currentTarget.disabled = true; cqRepeatNow(); });
    wireLift();
    document.querySelectorAll("[data-cdel]").forEach((el) =>
      el.addEventListener("click", async () => {
        el.disabled = true;
        const res = await call("app_lift_delete", { p_code: state.code, p_person: state.meId, p_session: el.dataset.cdel });
        if (res.error) { el.disabled = false; state.lift.msg = res.offline ? "No signal. Not deleted yet." : res.error; render(); return; }
        state.lift.sessions = (state.lift.sessions || []).filter((x) => x.id !== el.dataset.cdel);
        render(); await loadHistory(); await refresh(); await loadLift(); render();
      }));
    on("cardioUntyped", "click", async () => {
      await call("app_unlog", { p_code: state.code, p_person: state.meId, p_metric: "cardio_min", p_date: entryDay() });
      await loadHistory(); await refresh(); render();
    });

    // A day at a time, from the log box itself. The graph can still jump
    // you to any day; this is for "yesterday", which is most of them.
    const stepDay = async (n) => {
      // V2.1b BUG FIX. The week was compared AFTER entryDate had already
      // moved, and weekBounds() falls back to mondayOf(entryDay()) — so the
      // test was always false, loadHistory never re-ran, and the chart kept
      // last week's bars under this week's label. Compare the two days
      // against each other, before anything is mutated.
      const from = entryDay();
      const next = shiftISO(from, n);
      if (next > todayISO()) return;
      state.entryDate = next === todayISO() ? null : next;
      state.msg = null;
      if (mondayOf(next) !== mondayOf(from)) {
        state.weekAnchor = mondayOf(next) === thisMonday() ? null : mondayOf(next);
        await loadHistory();
      }
      // Walking the day off the edge of the month on show moves the month.
      if (state.range === "month" && monthOf(next) !== monthOf(from)) {
        state.monthAnchor = monthOf(next) === monthOf(todayISO()) ? null : monthOf(next);
        await loadMonth();
      }
      render();
      // V4.2. Focus lists that day's sessions; Cardio that day's activities.
      if (state.seg === "work") { await loadWorkSessions(); render(); }
    };
    // V4.6. The calendar at the foot jumps to any day it shows.
    state.goDay = (iso) => stepDay(Math.round((new Date(iso + "T00:00:00Z") - new Date(entryDay() + "T00:00:00Z")) / 86400000));
    on("dPrev", "click", () => stepDay(-1));
    on("dNext", "click", () => stepDay(1));
    on("dToday", "click", () => stepDay(Math.round(
      (new Date(todayISO() + "T00:00:00Z") - new Date(entryDay() + "T00:00:00Z")) / 86400000)));

    // The workout history folds. It is the longest thing on the page and
    // the least often wanted.
    if (state.seg === "train") wireTrainAdd();
    on("foldHist", "click", () => {
      state.histOpen = !state.histOpen;
      try { localStorage.setItem("fhd.hist", state.histOpen ? "open" : "shut"); } catch {}
      render();
    });

    wireTemplate();
    wireWork();

    // Rest and Rise. V3.6: the time is a native time input; a change
    // saves it, for the day the page is showing.
    wireTimePicks((k) => nightDay(k), async () => { await loadHistory(); await refresh(); });

    on("clearDay", "click", async () => {
      const k = state.seg;
      state.tLocal = null;
      const res = await call("app_unlog", { p_code: state.code, p_person: state.meId,
        p_metric: M[k].key, p_date: nightDay(k) });
      if (res.error) { state.msg = res.error; state.msgKind = "bad"; render(); return; }
      state.msg = `${M[k].label} cleared.`;
      state.msgKind = "ok";
      await loadHistory();
      await refresh();
      setTimeout(() => { state.msg = null; state.msgKind = null; render(); }, 1600);
    });

    on("stampNow", "click", async (e) => {
      e.target.disabled = true;
      state.tLocal = null;
      const k = state.seg;
      const res = await call("app_stamp", {
        p_code: state.code, p_person: state.meId, p_metric: M[k].key, p_tz: deviceTZ() });
      if (res.error) { e.target.disabled = false; state.msg = res.error;
                       state.msgKind = "bad"; render(); return; }
      armUndo({ key: M[k].key, date: res.date,
                words: `${M[k].label} ${clockWords(res.value)} saved` });
      await loadHistory();
      await refresh();
    });

    // The habits: one integer, one bit each, written on every tap.
    const heldNow = () => {
      const m = me() || {};
      return Number(entryDay() === todayISO()
        ? (m.items || 0) : (dayRecord("sleep").value || 0)) || 0;
    };
    const holdBit = async (bit, el) => {
      const next = heldNow() ^ (1 << bit);
      // Paint immediately: a checklist that waits for the network before
      // ticking feels broken even when it is working.
      if (el) {
        el.classList.toggle("on");
        el.setAttribute("aria-pressed", String(!!((next >> bit) & 1)));
      }
      await call("app_log", { p_code: state.code, p_person: state.meId,
        p_value: next, p_metric: "sleep_items", p_date: nightDay("sleep"),
        p_tz: deviceTZ() });
      await loadHistory();
      await refresh();
    };
    document.querySelectorAll("[data-habit]").forEach((el) =>
      el.addEventListener("click", () => holdBit(Number(el.dataset.habit), el)));
    on("sameNight", "click", async (e) => {
      e.target.disabled = true;
      const iso = nightDay("sleep");
      const r = await copyLastNight(iso);
      if (r.err) { state.msg = r.err; state.msgKind = "bad"; e.target.disabled = false; render(); return; }
      const m = me(); if (m && iso === ((m.rest_day) || todayISO()) && entryDay() === todayISO()) m.items = r.mask;
      state.msg = null; state.msgKind = null;
      await loadHistory(); await refresh();
    });

    // Turning a tile over. The back closes on the next tap anywhere, the
    // way a card you have finished reading goes back down.
    document.querySelectorAll("[data-flip]").forEach((el) =>
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const b = Number(el.dataset.flip);
        state.flip = state.flip === b ? null : b;
        render();
      }));
    on("flipShut", "click", () => { state.flip = null; render(); });
    document.querySelectorAll("[data-shut]").forEach((el) =>
      el.addEventListener("click", () => { state.flip = null; render(); }));
    on("flipHold", "click", async () => {
      const b = state.flip; state.flip = null;
      await holdBit(b, null);
    });

    // The family block is fetched the first time it is opened, then kept.
    on("foldFam", "click", async () => {
      state.fam.open = !state.fam.open;
      try { localStorage.setItem("fhd.fam", state.fam.open ? "open" : "shut"); } catch {}
      render();
      if (state.fam.open) { await loadFamily(); render(); }
    });


    wireGraph();

    // V2.1. The big number is the input. Show it formatted; edit it raw.
    const big = document.getElementById("steps");
    if (big && big.classList.contains("bigedit")) {
      big.addEventListener("focus", () => {
        big.value = big.dataset.raw || "";
        requestAnimationFrame(() => big.select());
      });
      big.addEventListener("keydown", (e) => { if (e.key === "Enter") big.blur(); });
      big.addEventListener("blur", async () => {
        const raw = (big.value || "").replace(/[^0-9]/g, "");
        if (raw === "" || raw === (big.dataset.raw || "")) {
          // Nothing changed: put the formatted number back and do nothing.
          big.value = big.dataset.raw ? num(Number(big.dataset.raw)) : "";
          return;
        }
        big.value = num(Number(raw));
        await saveNumber(raw);
      });
    }



    wireEditor();
  }

  // V1.7b. One save for all three metrics. Minutes used to be writable
  // only by the logger; now they can be typed, and a typed number wins.
  async function saveNumber(raw) {
    const k = state.seg;
    if (raw === "" || raw === undefined) return;
    // p_date is null for today on purpose. The server decides what "today"
    // means for this person; the phone only says which zone it is in. A page
    // that has been open since yesterday therefore cannot write yesterday.
    const res = await call("app_log", { p_code:state.code, p_person:state.meId,
      p_value:Number(raw), p_metric:M[k].key,
      p_date:state.entryDate || null, p_tz:deviceTZ() });
    state.msg = res.error ? res.error : "Saved. Your tribe can see it.";
    state.msgKind = res.error ? "bad" : "ok";
    if (!res.error) state.entryDate = null;
    if (state.range === "month") await loadMonth(true);
    await refresh();
    setTimeout(() => { state.msg = null; state.msgKind = null; }, 100);
  }

  async function saveLabel(next) {
    const from = state.lift.renameFrom;
    if (!from) return;
    const res = await call("app_lift_label", {
      p_code: state.code, p_person: state.meId,
      p_old: from, p_new: next, p_mode: state.mode });
    if (res.error) { say(res.error); return; }
    state.lift.rename = null; state.lift.menu = null; state.lift.renameFrom = null;
    await loadLift();
    render();
  }

  async function openSession(id) {
    const res = await call("app_lift_detail", { p_code: state.code, p_session: id });
    if (res.error || !res.session) return;
    state.lift.detail = res.session;
    state.lift.from = "exercise";
    state.view = "detail";
    render();
  }

  async function openExercise(seg) {
    if (!state.meId) return;
    stopTicking();
    // V4.1. Longevity, Protein and Calories share one page.
    if (seg === "dd" || seg === "macros" || seg === "weight") return openDiet(seg);
    // V5.1. Attention, Reflection and Silence.
    if (MED_KEYS.includes(seg)) return openMed(seg);
    // V6.1. Your own habits.
    if (isCustom(seg)) return openCustom(seg);
    state.seg  = seg || "steps";
    state.mode = state.seg === "cardio" ? "cardio" : "lift";
    state.entryDate = null;
    state.lift.loaded = false;
    state.lift.labels = []; state.lift.sessions = [];
    state.lift.menu = null; state.lift.rename = null; state.flip = null;
    state.lift.msg = null;
    loadLocal();
    state.view = state.seg === "sleep" ? "sleep"
               : state.seg === "tasks" ? "tasks"
               : state.seg === "goals" ? "goals" : "exercise";
    render();                 // paint immediately; the list can arrive after
    window.scrollTo(0, 0);    // V4.6. Every page opens at its top.
    if (state.seg === "tasks") { await openTasks(); return; }
    if (state.seg === "goals") { await openGoals(); return; }
    if (state.seg === "work")  {
      loadWorkLocal();
      if (await checkWork()) render();
      await loadWorkSessions(); render();
    }
    await loadHistory(); render();
    if (state.seg === "train" || state.seg === "cardio") { await loadLift(); render(); }
    if (state.range === "month") { await loadMonth(); render(); }
    if (state.fam.open) { await loadFamily(); render(); }
  }

  /* ---------- V4.3: the tribe's goal ------------------------------------ */
  // Days from the tribe's today to the goal date. Null without a date.
  function goalDays() {
    const g = state.group || {};
    if (!g.goal_by) return null;
    const a = new Date(familyISO() + "T00:00:00Z"), b = new Date(g.goal_by + "T00:00:00Z");
    return Math.round((b - a) / 86400000);
  }
  const daysWords = (n) => n === null ? "" : n > 1 ? `${num(n)} days` : n === 1 ? "1 day" : n === 0 ? "today" : "date passed";
  const byWords = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString(undefined,
    { timeZone: "UTC", month: "long", day: "numeric", year: "numeric" });
  function goalLine() {
    const g = state.group || {}, n = goalDays();
    return g.goal
      ? `<button type="button" class="tgoal" id="tribeGoal" aria-label="Our goal: ${esc(g.goal)}. Open">
           <span>${esc(g.goal)}</span>${n !== null ? `<em>${daysWords(n)}</em>` : ""}</button>`
      : `<button type="button" class="tgoal none" id="tribeGoal">+ Set your tribe&rsquo;s goal</button>`;
  }
  function tribeSheet() {
    if (!state.tribeSheet) return "";
    const g = state.group || {}, T = state.tribeSheet, n = goalDays();
    const sentence = g.goal ? `<div class="tsent">
        <p class="eyebrow">Our goal${n !== null ? ` &middot; ${daysWords(n)}` : ""}</p>
        <h3>${esc(g.goal)}</h3>
        ${g.goal_by ? `<p>by ${esc(byWords(g.goal_by))}</p>` : ""}
        ${g.goal_when || g.goal_then ? `<p>When ${esc(g.goal_when || "…")}, we will ${esc(g.goal_then || "…")}.</p>` : ""}
        <p class="tset">${g.goal_set_by ? `Set by ${esc(g.goal_set_by)}` : "Set when the tribe began"}${
          g.goal_set_at ? ` &middot; ${esc(shortDay(String(g.goal_set_at).slice(0, 10)))}` : ""}</p>
      </div>` : "";
    return `
      <div class="sheetbg" id="tsBg"></div>
      <div class="stdsheet tsheet" role="dialog" aria-label="Your tribe">
        ${T.edit ? `
          <p class="eyebrow">Your tribe</p>
          <label class="tlab" for="tsName">Tribe name</label>
          <input class="field" id="tsName" maxlength="60" value="${esc(T.name)}">
          <label class="tlab" for="tsGoal">We will</label>
          <input class="field" id="tsGoal" maxlength="120" placeholder="climb a mountain in Europe" value="${esc(T.goal)}">
          <label class="tlab" for="tsBy">By</label>
          <input class="field" id="tsBy" type="date" value="${esc(T.by)}">
          <label class="tlab" for="tsWhen">When</label>
          <input class="field" id="tsWhen" maxlength="120" placeholder="we wake up each day" value="${esc(T.when)}">
          <label class="tlab" for="tsThen">we will</label>

          <p class="hint ${T.err ? "bad" : ""}" id="tsHint">${esc(T.err || "Everyone in the tribe sees this, and your name goes beside it.")}</p>
          <div class="stdbtns">
            <button type="button" class="btn-quiet" id="tsCancel">Cancel</button>
            <button type="button" class="btn" id="tsSave">Save</button>

        : `${sentence || `<p class="eyebrow">Your tribe</p><h3>No goal yet</h3>
             <p class="hint">One goal you all work toward, with a date and an if-then plan.</p>`}
          <div class="stdbtns">
            <button type="button" class="btn-quiet" id="tsCancel">Close</button>
            <button type="button" class="btn" id="tsEdit">${g.goal ? "Edit" : "Set the goal"}</button>
          </div>`}

  function wireTribeSheet() {
    on("tribeGoal", "click", () => { state.tribeSheet = { edit: !(state.group || {}).goal }; seedTribe(); render();
      if (state.tribeSheet.edit) document.getElementById("tsGoal")?.focus(); });
    if (!state.tribeSheet) return;
    const close = () => { state.tribeSheet = null; render(); };
    on("tsBg", "click", close); on("tsCancel", "click", close);
    on("tsEdit", "click", () => { state.tribeSheet.edit = true; seedTribe(); render(); document.getElementById("tsGoal")?.focus(); });
    const T = state.tribeSheet;
    [["tsName", "name"], ["tsGoal", "goal"], ["tsBy", "by"], ["tsWhen", "when"], ["tsThen", "then"]].forEach(([id, k]) =>
      on(id, "input", (e) => { T[k] = e.target.value; }));
    on("tsSave", "click", async (e) => {
      e.target.disabled = true;
      const res = await call("app_set_tribe", { p_code: state.code, p_person: state.meId || null,
        p_name: (T.name || "").trim(), p_goal: (T.goal || "").trim(), p_by: T.by || null,
        p_when: (T.when || "").trim(), p_then: (T.then || "").trim() });
      if (res.error) { T.err = res.offline ? "No signal. Try again in a moment." : res.error; e.target.disabled = false; render(); return; }
      state.tribeSheet = null;
      await refresh(); render();
    });
  }
  function seedTribe() {
    const g = state.group || {}, T = state.tribeSheet;
    if (!T || T.seeded) return;
    Object.assign(T, { name: g.name || "", goal: g.goal || "", by: g.goal_by || "", when: g.goal_when || "",
                       then: g.goal_then || "", seeded: true });
  }

  /* ---------- the board: a glance, not a dashboard -------------------
     V1.5 moved the entry box, the charts, the stats and the week arrows
     into Exercise. What is left is who you are, what the five pillars say
     about your day, the family, and one button. Everything else is one
     tap in, which is the only shape that still reads when there are five
     pillars instead of one.
     ------------------------------------------------------------------ */

  // Did this person record ANYTHING today? Deliberately not `done`.
  //
  // `done` is the bar: the step goal met, or a workout, or cardio. It still
  // drives the roster's "moved" mark and the execution percentage, because
  // a rate that counts 400 steps as a win measures nothing.
  //
  // The green circle is the other question — did you show up — and it is
  // the one the board should answer, because logging is the habit being
  // built and punishing a 4,000-step day with a grey dot teaches people to
  // stop opening the app.
  const anyLog = (p) => val(p,"steps") > 0 || val(p,"train") > 0 || val(p,"cardio") > 0;

  // Undo lives for six seconds after a stamp: long enough to notice a
  // mis-tap, short enough not to sit on the screen as clutter.
  let undoTimer = null;
  function armUndo(u) {
    state.undo = u;
    if (undoTimer) clearTimeout(undoTimer);
    undoTimer = setTimeout(() => { state.undo = null; if (state.view === "board") render(); }, 6000);
  }
  function disarmUndo() {
    state.undo = null;
    if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
  }


  /* ---------- the pillars, as rows ------------------------------------
     V2.1. Each live pillar is ONE ROW: a status circle, its name, and its
     chips on the same line. A row is the unit that scales — Sleep arrived
     as a second row without touching the first, and Meditate, Diet and
     Great Work will each arrive the same way. Until then they share one
     quiet line, so the five-pillar shape stays on screen without three
     rows of nothing.

     A chip is value on top, tiny label below. Outline when empty, filled
     when logged. Small enough for three beside a name on a phone, large
     enough (44px) to hit with a thumb.
     ------------------------------------------------------------------ */
  const shortNum = (v) => v >= 10000 ? (v / 1000).toFixed(1).replace(/\.0$/, "") + "k"
                        : v >= 1000  ? (v / 1000).toFixed(1).replace(/\.0$/, "") + "k"
                        : String(Math.round(v));

  // Minutes after midnight -> "10:40p". Values past 1440 are after-midnight
  // bedtimes stored on the evening's date, so they wrap.
  function clockWords(min) {
    if (min === null || min === undefined || min === "") return "";
    const m = ((Math.round(Number(min)) % 1440) + 1440) % 1440;
    const h = Math.floor(m / 60), mm = m % 60;
    const h12 = ((h + 11) % 12) + 1;
    return `${h12}:${pad(mm)}${h < 12 ? "a" : "p"}`;
  }
  const clockInput = (min) => {
    const m = ((Math.round(Number(min)) % 1440) + 1440) % 1440;
    return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  };


  // Which date a sleep entry belongs to. Rest and the habits are filed
  // against the NIGHT, which the server works out under the 5am rule and
  // hands back as rest_day; Rise is filed against the clock date.
  function nightDay(k) {
    if (state.entryDate) return state.entryDate;
    const m = me() || {};
    return (M[k] && M[k].night) ? (m.rest_day || todayISO()) : (m.their_date || todayISO());
  }

  const sleepAny = (p) => ["sleep","rise","rest"].some((k) => hasVal(p, k));

  // One editor, two screens: names are edited on the board, goals on
  // Exercise. Rendering it in only one place is how tapping a goal used to
  // open nothing at all.
  function editRowHTML() {
    // V3.4. Only names are edited here. Standards have a sheet of their own.
    if (state.editing !== "name") return "";
    return `
      <div class="addrow" id="editRow">
        <input class="field" id="editVal" maxlength="40" autocomplete="off"
               value="${esc(state.editDraft !== null && state.editDraft !== undefined ? state.editDraft : editTarget() ? editTarget().name : "")}"
               aria-label="Name">
        <button class="btn" id="editSave">Save</button>
        <button class="btn-quiet" id="editCancel">Cancel</button>
        <p class="hint" id="editHint" style="flex-basis:100%;margin-top:0">${editHintText()}</p>
      </div>`;
  }

  function boardView() {
    const m = me();
    // The family's day, not anyone's own: see board() above.
    const logged = state.people.filter(banyLog).length;
    const moved  = state.people.filter(bdone).length;

    const whoOptions = state.people.length === 0
      ? `<option value="">nobody yet</option>`
      : (!state.meId ? `<option value="">choose your name</option>` : "") +
        state.people.map((p) =>
          `<option value="${p.id}"${p.id === state.meId ? " selected" : ""}>${esc(p.name)}</option>`).join("");

    // V3.4. The family list is a dashboard: every activity, as a raw
    // number, for everyone, in the same nine places, so a glance down the
    // column compares like with like. No standards and no percentages
    // here; those are each person's own business. You come first, in your
    // own colour, so your row is the one the eye lands on.
    const famCells = (p) => {
      const bd = board(p);
      const n = (x) => x === null || x === undefined || x === "" ? null : Number(x);
      const pos = (x) => Number(x) > 0 ? Number(x) : null;
      return {
        steps: pos(bd.steps), train: pos(bd.train_min), cardio: pos(bd.cardio_min),
        sleep: bd.items_pts === null || bd.items_pts === undefined ? null
          : Math.round(Number(bd.items_pts) / Math.max(1, scoreMax()) * 100),
        rise: n(bd.rise), rest: n(bd.rest),

  /* ---------- the dials -----------------------------------------------

  const DIAL_C = 326.73;                       // 2πr, r = 52

      <circle cx="60" cy="60" r="52" class="dtrack"></circle>
      <circle cx="60" cy="60" r="52" class="dfill" style="stroke:${dialColor(pct)}"

  // middle IS the input, as the step count always was.
  function homeDials(m) {

    const order = n > 1 ? [keys[n - 1], ...keys, keys[0]] : keys;

  /* ---------- V4.5: Atoms ---------------------------------------------

  const MILES = [1, 3, 5, 10, 21, 30, 50, 75, 100, 150, 200, 250, 300, 400, 500, 600, 750, 1000, 1500, 2000];

  const myAtoms = () => { const a = (me() || {}).atoms; return a && typeof a === "object" ? a : {}; };
  const votesOf = (k) => state.votes && state.votes.votes ? state.votes.votes[k] || { total: 0, streak: 0, best: 0, days: [] } : null;
  const nextMile = (n) => MILES.find((x) => x > n) || null;

  function forgivingRuns(days, today) {
    const keys = Object.keys(days).filter((d) => d <= today).sort();

    // gap uses the week's one rest day, or ends the run.
    let best = 0, run = 0, used = {};
    for (let d = keys[0]; d <= today; d = shiftISO(d, 1)) {

      if (d === today) break;
