  /* ---------- Tasks: today's few, then the rest ----------------------
     V3.6. Three of Eisenhower's boxes, as plain lists:
       Do         today, numbered, capped at your "do today" number
       Decide     important, not urgent: it waits for a day
       Delegate   someone else's to do
     Not-to-do is gone (its few lines stay hidden, never shown as work).

     The page opens with the cursor in the line. Tap a task and the cursor
     is already in a new step under it. Swipe right for Do, Decide, Delegate (V3.7); left for Today,
     Tomorrow, Delete and Schedule. Tomorrow takes it out of today and
     brings it back to the top of Do in the morning: a task dated after
     today waits, dimmed, and does not take a place in Do.
     ------------------------------------------------------------------ */
  const QUADS = [
    { q:1, name:"Do",       tag:"today",          hint:"Urgent and important. Today, and only this many." },
    { q:2, name:"Decide",   tag:"",               hint:"Important, not urgent." },
    { q:3, name:"Delegate", tag:"",               hint:"Someone else's to do." },
  ];
  // V4.7. Each list folds; the phone remembers which.
  const qFolds = () => { try { return JSON.parse(localStorage.getItem("fhd.tqfold") || "{}") || {}; } catch { return {}; } };
  const qShut = (q) => !!qFolds()[q];
  const qFold = (Q) => `<button type="button" class="tqf" data-tqf="${Q.q}" aria-expanded="${!qShut(Q.q)}"><i aria-hidden="true">${qShut(Q.q) ? "\u25b8" : "\u25be"}</i><b>${Q.name}</b></button>`;
  const waiting = (x) => !!x.sched_date && x.sched_date > todayISO();
  // V6.4. Do has no limit and Tasks no standard: one task done meets the day.
  const doLimit = () => Infinity;
  const doCount = () => activeIn(1).length;
  const doFull = () => false;
  const taskCacheKey = () => "fhd.tasks." + (state.meId || "anon");
  const SCH_FROM = 6, SCH_TO = 24, SCH_H = 56;          // 6am to midnight, 56px an hour
  const clockOf = (m) => {
    const h = Math.floor(m / 60) % 24, mm = m % 60, ap = h < 12 ? "am" : "pm";
    return `${h % 12 || 12}${mm ? ":" + pad(mm) : ""}${ap}`;
  };
  const TLENS = [15, 30, 45, 60, 90, 120, 180];

  // V5.5. The tap that ends a drag must not open the task it dropped.
  let tJustDragged = false;
  // V5.5. A phone only lets a page stop its own scrolling if a blocking
  // touchmove listener is already there when the finger lands. Added after
  // the hold, it is too late: the page scrolls and the drag is cancelled.
  // So every draggable list carries one from the start, idle until a drag.
  let dragLock = false;
  const lockTouch = (el) => el && el.addEventListener("touchmove", (e) => { if (dragLock) e.preventDefault(); }, { passive: false });
  document.addEventListener("click", (e) => { if (tJustDragged) { e.preventDefault(); e.stopPropagation(); } }, true);
  let pointerDown = false;
  window.addEventListener("pointerdown", () => { pointerDown = true; }, true);
  window.addEventListener("pointerup", () => { pointerDown = false; }, true);
  window.addEventListener("pointercancel", () => { pointerDown = false; }, true);
  async function openTasks() {
    // V2.8 kept each person's PIN in plain text on the phone. The PIN is
    // gone, so its digits should not outlive it there.
    try { Object.keys(localStorage).filter((k) => k.startsWith("fhd.pin."))
            .forEach((k) => localStorage.removeItem(k)); } catch {}
    // V3.5. The page is drawn at once from the copy kept on the phone,
    // before anything waits on the network. V4.1: no line waits at the top
    // any more; a + on each section opens one.
    let cached = [];
    try { cached = JSON.parse(localStorage.getItem(taskCacheKey()) || "[]"); } catch {}
    const keep = state.tasks || {};
    state.tasks = { list: Array.isArray(cached) ? cached : [], loaded: true, err: null,
                    tab: keep.tab === "sched" ? "sched" : "list",
                    adding: null, draft: "", addMsg: null, edit: null, swiped: null, schFor: null, doneOpen: false,
                    day: todayISO(), arm: null, sel: null, added: new Set() };
    render();
    const res = await call("app_tasks", { p_code: state.code, p_person: state.meId });
    const t = state.tasks;
    if (!t || state.view !== "tasks") return;
    if (res.error) { t.err = res.error; render(); return; }
    // Whatever was typed while this was in flight is kept: the server's list
    // plus anything added here it has not seen yet.
    const fresh = res.tasks || [];
    const seen = new Set(fresh.map((x) => x.id));
    t.list = fresh.concat(t.list.filter((x) => t.added.has(x.id) && !seen.has(x.id)));
    t.inbox = res.inbox || [];
    try { localStorage.setItem(taskCacheKey(), JSON.stringify(t.list)); } catch {}
    // Never pull the line out from under someone typing in it.
    const f = document.getElementById("tAddIn");
    // V3.6: nor out from under a finger: leaving the line by starting a
    // swipe or a drag repaints only once the finger lifts.
    if (f && document.activeElement === f) {
      t.stale = true;
      const go = () => { if (t.stale && state.tasks === t) { t.stale = false; render(); } };
      f.addEventListener("blur", () => {
        if (pointerDown) window.addEventListener("pointerup", () => setTimeout(go, 0), { once: true });
        else go();
      }, { once: true });
    } else render();
  }
  const taskCall = async (fn, args) => {
    const res = await call(fn, Object.assign({ p_code: state.code, p_person: state.meId }, args));
    if (res.error) state.tasks.err = res.error;
    return res;
  };
  const kids = (id) => state.tasks.list.filter((x) => x.parent_id === id)
    .sort((a, b) => a.position - b.position);
  const mains = (q) => state.tasks.list.filter((x) => !x.parent_id && (x.quadrant || 1) === q)
    .sort((a, b) => a.position - b.position);
  const openIn = (q) => mains(q).filter((x) => !x.done);
  // Open and for today: not waiting on a later day.
  const activeIn = (q) => openIn(q).filter((x) => !waiting(x));
  // Everything there is to act on, in box order. A hidden Not-to-do is not.
  const actionable = () => [1, 2, 3].flatMap((q) => openIn(q));
  const taskPayload = (x) => ({ id: x.id, parent_id: x.parent_id || null, quadrant: x.quadrant || 1,
    title: x.title, done: !!x.done, position: x.position,
    sched_date: x.sched_date || null, sched_start: x.sched_start ?? null, sched_min: x.sched_min ?? null });
  const hhmm = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;

  const SW_ICON = {
    tomorrow: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="13" height="14" rx="3"/><path d="M9 12h11M16.5 8.5 20 12l-3.5 3.5"/></svg>`,
    delete:   `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l1 12.5h9l1-12.5M10.5 10.5v6M13.5 10.5v6"/></svg>`,
    schedule: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4M8 13.5h2M11 13.5h2M14 13.5h2M8 16.5h2M11 16.5h2"/></svg>`,
  };
  const dayWord = (d) => d === todayISO() ? "Today" : d === shiftISO(todayISO(), 1) ? "Tomorrow"
    : shortDay(d).replace(/,.*$/, "");
  function whenWords(x) {
    if (!x.sched_date) return "";
    const timed = x.sched_start !== null && x.sched_start !== undefined;
    if (!timed) return dayWord(x.sched_date);
    return x.sched_date === todayISO() ? clockOf(x.sched_start) : `${dayWord(x.sched_date)} ${clockOf(x.sched_start)}`;
  }
  // The day and time a task is given, opened from Schedule on the swipe.
  function schedPanel(x) {
    const timed = x.sched_start !== null && x.sched_start !== undefined;
    const later = x.sched_date && x.sched_date > shiftISO(todayISO(), 1);
    return `
      <div class="tebar tschp">
        <div class="twhen" role="group" aria-label="Which day">
          <span>Day</span>
          <button type="button" class="tday${x.sched_date === todayISO() ? " on" : ""}" data-tday="${x.id}:${todayISO()}">Today</button>
          <button type="button" class="tday${x.sched_date === shiftISO(todayISO(), 1) ? " on" : ""}" data-tday="${x.id}:${shiftISO(todayISO(), 1)}">Tomorrow</button>
          <label class="tday tpick${later ? " on" : ""}">${later ? esc(shortDay(x.sched_date)) : "Pick…"}
            <input type="date" data-tdate="${x.id}" min="${todayISO()}" value="${x.sched_date || ""}" aria-label="Pick a day"></label>
          ${x.sched_date ? `<button type="button" class="tday" data-tday="${x.id}:" aria-label="No day">&times;</button>` : ""}
        </div>
        <div class="twhen" role="group" aria-label="What time">
          <span>Time</span>
          <label class="tday tpick${timed ? " on" : ""}">${timed ? clockOf(x.sched_start) : "Set…"}
            <input type="time" step="900" data-ttime="${x.id}" value="${timed ? hhmm(x.sched_start) : ""}" aria-label="Start time"></label>
          ${timed ? `<label class="tday tpick on">${hm(x.sched_min || 30)}
              <select data-tlen="${x.id}" aria-label="How long">${TLENS.map((n) =>
                `<option value="${n}" ${(x.sched_min || 30) === n ? "selected" : ""}>${hm(n)}</option>`).join("")}</select></label>
            <button type="button" class="tday" data-tnotime="${x.id}" aria-label="No time">&times;</button>` : ""}
        </div>
        <div class="terow"><button type="button" class="btn tok" data-tschdone="${x.id}">Done</button></div>
      </div>`;
  }

  function taskRow(x, rank) {
    const t = state.tasks, subs = kids(x.id), ed = t.edit === x.id;
    const when = whenWords(x), wait = waiting(x);
    const inDo = (x.quadrant || 1) === 1 && !wait;
    const sw = t.swiped === x.id && !ed, dir = sw ? (t.swipeDir || "l") : "";
    const q = x.quadrant || 1;
    return `
      <li class="tm${ed ? " editing" : ""}${wait ? " wait" : ""}${dir === "l" ? " swiped" : dir === "r" ? " swipedr" : ""}" data-id="${x.id}"
        style="--sww:${inDo ? 156 : 212}px">
        ${ed ? "" : `<div class="tswl" role="group" aria-label="Move ${esc(x.title)} to">${QUADS.map((Q) => `
          <button type="button" class="tswq q${Q.q}${q === Q.q ? " on" : ""}" data-tswq="${x.id}:${Q.q}"
            ${q === Q.q ? 'aria-current="true"' : ""}>${Q.name}</button>`).join("")}</div>
        <div class="tsw" role="group" aria-label="Actions for ${esc(x.title)}">
          ${inDo ? "" : `<button type="button" class="tswt" data-tsw="today:${x.id}">Today</button>`}
          <button type="button" class="tswc b" data-tsw="tomorrow:${x.id}" aria-label="Tomorrow">${SW_ICON.tomorrow}</button>
          <button type="button" class="tswc r" data-tsw="delete:${x.id}" aria-label="Delete">${SW_ICON.delete}</button>
          <button type="button" class="tswc o" data-tsw="schedule:${x.id}" aria-label="Schedule">${SW_ICON.schedule}</button>
        </div>`}
        <div class="tr" data-swipe="${ed ? "" : x.id}">
          ${rank ? `<span class="trank" aria-hidden="true">${rank}</span>` : ""}
          <button type="button" class="tck" data-tdone="${x.id}" aria-pressed="false"
            aria-label="Done: ${esc(x.title)}"></button>
          ${ed ? `<input class="tedit" data-tetitle="${x.id}" maxlength="200" value="${esc(x.title)}"
                     enterkeyhint="done" aria-label="Task name">`
               : `<button type="button" class="tt" data-tedit="${x.id}">${esc(x.title)}${
                   subs.length ? ` <small class="tsubn">${subs.filter((c) => c.done).length}/${subs.length}</small>` : ""}</button>`}
          ${when && !ed ? `<span class="tsch">${esc(when)}</span>` : ""}
          ${ed ? "" : `<button type="button" class="tmore${t.more === x.id ? " on" : ""}" data-tmore="${x.id}"
            aria-expanded="${t.more === x.id}" aria-label="Move or schedule ${esc(x.title)}">&#8943;</button>`}
          ${wait ? "" : `<span class="tdrag" data-drag="${x.id}" aria-label="Drag to reorder ${esc(x.title)}">
            <svg viewBox="0 0 10 16" aria-hidden="true"><circle cx="3" cy="3" r="1.3"/><circle cx="7" cy="3" r="1.3"/><circle cx="3" cy="8" r="1.3"/><circle cx="7" cy="8" r="1.3"/><circle cx="3" cy="13" r="1.3"/><circle cx="7" cy="13" r="1.3"/></svg></span>`}
        </div>
        ${subs.length && ed ? `<ul class="ts">${subs.map((c) => `
          <li class="tsx${c.done ? " done" : ""}">
            <button type="button" class="tck sm" data-tdone="${c.id}" aria-pressed="${!!c.done}"
              aria-label="${c.done ? "Not done" : "Done"}: ${esc(c.title)}"></button>
            <input class="tedit sm tsedit" data-tsedit="${c.id}" maxlength="200" value="${esc(c.title)}" enterkeyhint="done" autocomplete="off" aria-label="Step: ${esc(c.title)}">
            <button type="button" class="tx" data-tdel="${c.id}" aria-label="Delete ${esc(c.title)}">&times;</button>
          </li>`).join("")}</ul>` : ""}
        ${subs.length && !ed ? (() => {
          // V6.1. Steps show under their task, ticked in place: first three
          // still to do (then the done ones), and "+ n more" opens the task.
          const show = subs.filter((c) => !c.done).concat(subs.filter((c) => c.done)), top = show.slice(0, 3), more = show.length - top.length;
          return `<ul class="ts tsv">${top.map((c) => `
            <li class="tsx${c.done ? " done" : ""}">
              <button type="button" class="tck sm" data-tdone="${c.id}" aria-pressed="${!!c.done}"
                aria-label="${c.done ? "Not done" : "Done"}: ${esc(c.title)}"></button>
              <button type="button" class="tt sm" data-tedit="${x.id}" aria-label="Edit steps of ${esc(x.title)}">${esc(c.title)}</button></li>`).join("")}${more > 0 ? `
            <li class="tsmore"><button type="button" class="linkbtn" data-tedit="${x.id}">+ ${more} more</button></li>` : ""}</ul>`; })() : ""}
        ${ed ? `
          <input class="tsubin" data-tsubnew="${x.id}" maxlength="200" enterkeyhint="done"
            autocomplete="off" placeholder="Add a step" aria-label="New step under ${esc(x.title)}">
          <div class="tebar">
            <div class="terow"><button type="button" class="btn tok" data-tok="${x.id}">Done</button></div>
          </div>` : ""}
        ${t.more === x.id && !ed ? `
          <div class="tmorep" role="group" aria-label="Move or schedule ${esc(x.title)}">
            ${QUADS.map((Q) => `<button type="button" class="tswq q${Q.q}${q === Q.q ? " on" : ""}" data-tswq="${x.id}:${Q.q}"
              ${q === Q.q ? 'aria-current="true"' : ""}>${Q.name}</button>`).join("")}
            <span class="tmsep" aria-hidden="true"></span>
            ${inDo ? "" : `<button type="button" class="tmb" data-tsw="today:${x.id}">Today</button>`}
            <button type="button" class="tmb" data-tsw="tomorrow:${x.id}">Tomorrow</button>
            <button type="button" class="tmb" data-tsw="schedule:${x.id}">Schedule</button>
            <button type="button" class="tmb bad" data-tsw="delete:${x.id}">Delete</button>
          </div>` : ""}
        ${t.schFor === x.id && !ed ? schedPanel(x) : ""}
        ${ed ? "" : delegLine(x)}
      </li>`;
  }
  // V5.5. Delegate: send a task to someone in the tribe and see where it
  // stands; a task someone sent you says who from.
  const DSTAT = { sent: "waiting", accepted: "accepted", declined: "declined", done: "done \u2713" };
  function delegLine(x) {
    if (x.parent_id) return "";
    if (x.from_name) return `<p class="tdl"><span class="tfrom">from ${esc(x.from_name)}</span></p>`;
    if (x.deleg_to) return `<p class="tdl"><button type="button" class="tdel st-${esc(x.deleg_status || "sent")}" data-tdeleg="${x.id}">\u2192 ${esc(x.deleg_name || "someone")} \u00b7 ${DSTAT[x.deleg_status] || "waiting"}</button></p>`;
    if ((x.quadrant || 1) === 3 && state.people.length > 1) return `<p class="tdl"><button type="button" class="tdel" data-tdeleg="${x.id}">Send to\u2026</button></p>`;
    return "";
  }

  function listView() {
    const t = state.tasks;
    const full = false;
    const done = t.list.filter((x) => !x.parent_id && x.done && (x.quadrant || 1) !== 4)
      .sort((a, b) => (a.quadrant || 1) - (b.quadrant || 1) || a.position - b.position);
    const doList = activeIn(1), doWait = openIn(1).filter(waiting);
    // V4.1. The way in is a + on each section. Tap it, type, Return: the
    // line stays open for the next one, and closes when you leave it empty.
    const plus = (Q) => `<button type="button" class="tplus${t.adding === Q.q ? " on" : ""}" data-tplus="${Q.q}"
        aria-label="Add a task to ${Q.name}" aria-expanded="${t.adding === Q.q}"
        ${Q.q === 1 && full ? 'aria-disabled="true"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>`;
    const adder = (Q) => t.adding !== Q.q ? "" : `
        <div class="tnew"><input class="field" id="tAddIn" data-tq="${Q.q}" maxlength="200" enterkeyhint="done"
          autocomplete="off" placeholder="New task in ${Q.name}" aria-label="New task in ${Q.name}"
          value="${esc(t.draft || "")}"><button type="button" class="tadd" id="tAddOk" aria-label="Add this task"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>
        ${t.addMsg ? `<p class="tqhint warn" id="tqHint">${t.addMsg}</p>` : ""}`;
    const group = (Q) => {
      const open = openIn(Q.q);
      const order = open.filter((x) => !waiting(x)).concat(open.filter(waiting));
      return `
        <section class="tgroup q${Q.q}${qShut(Q.q) ? " shut" : ""}">
          <header class="tgh">${qFold(Q)}<span></span><em>${open.length || ""}</em>${qShut(Q.q) ? "" : plus(Q)}</header>
          ${qShut(Q.q) ? "" : `${adder(Q)}
          <ul class="tl${order.length ? "" : " tempty"}" data-tgroup="${Q.q}">${order.map((x) => taskRow(x)).join("")}</ul>`}
        </section>`;
    };
    const anyOpen = actionable().length > 0;
    const inbox = (t.inbox || []);
    return `
      ${inbox.length ? `<section class="tinbox" aria-label="Sent to you">
        <p class="eyebrow">For you</p>
        <ul>${inbox.map((x) => `<li><span><b>${esc(x.title)}</b><small>from ${esc(x.from_name)}</small></span>
          <button type="button" class="btn-quiet tno" data-tans="${x.id}:0">Decline</button>
          <button type="button" class="btn tyes" data-tans="${x.id}:1">Accept</button></li>`).join("")}</ul>
      </section>` : ""}
      <section class="tgroup q1 tdo${qShut(1) ? " shut" : ""}">
        <header class="tgh">${qFold(QUADS[0])}<span></span><em>${doList.length || ""}</em>
          ${qShut(1) ? "" : plus(QUADS[0])}</header>
        ${qShut(1) ? "" : `${adder(QUADS[0])}
        ${t.addMsg && t.adding !== 1 && t.msgQ === 1 ? `<p class="tqhint warn" id="tqHint">${t.addMsg}</p>` : ""}
        <ul class="tl" data-tgroup="1">${doList.map((x, n) => taskRow(x, n + 1)).join("")}</ul>
        ${!doList.length && t.adding !== 1 ? `<button type="button" class="tdoempty" data-tslot="1">Nothing for today yet. Tap to add, or hold a task below and drag it here.</button>` : ""}
        ${doWait.length ? `<ul class="tl twaitl">${doWait.map((x) => taskRow(x)).join("")}</ul>` : ""}`}
      </section>
      ${group(QUADS[1])}
      ${group(QUADS[2])}


      ${done.length ? `
        <section class="tdone">
          <div class="tdh">
            <button type="button" class="foldbtn" id="tDoneFold" aria-expanded="${t.doneOpen}">
              <span class="caret">${t.doneOpen ? "▾" : "▸"}</span>
              <h2>Done · ${done.length}</h2></button>
            <button type="button" class="linkbtn" id="tClear">Clear</button>
          </div>
          ${t.doneOpen ? `<ul class="tl">${done.map((x) => `
            <li class="tm done"><div class="tr">
              <button type="button" class="tck" data-tdone="${x.id}" aria-pressed="true"
                aria-label="Not done: ${esc(x.title)}"></button>
              <span class="tt">${esc(x.title)}</span></div></li>`).join("")}</ul>` : ""}
        </section>` : ""}`;
  }

  function schedView() {
    const t = state.tasks, day = t.day, isToday = day === todayISO();
    const rankOf = new Map(actionable().map((x, i) => [x.id, i]));
    const onDay = state.tasks.list.filter((x) => !x.parent_id && x.sched_date === day && (x.quadrant || 1) !== 4);
    const placed = onDay.filter((x) => x.sched_start !== null && x.sched_start !== undefined)
      .sort((a, b) => a.sched_start - b.sched_start);
    const anytime = onDay.filter((x) => x.sched_start === null || x.sched_start === undefined)
      .sort((a, b) => (a.done - b.done) || ((rankOf.get(a.id) ?? 1e9) - (rankOf.get(b.id) ?? 1e9)));
    // V3.3. The tray is only what has no day yet. A task given to Thursday
    // waits on Thursday, not on every day in between.
    const tray = actionable().filter((x) => !x.sched_date);
    const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
    const y = (m) => (m - SCH_FROM * 60) / 60 * SCH_H;
    const armed = t.arm && state.tasks.list.find((x) => x.id === t.arm);
    const sel = t.sel && state.tasks.list.find((x) => x.id === t.sel);
    return `
      <section class="card sday">
        ${dayNav({ ids: ["sPrev", "sNext", "sToday"], unit: "day", openNext: true,
                   atToday: isToday, label: isToday ? "Today" : esc(fullDate(day)) })}
      </section>
      ${tray.length || armed ? `
      <section class="stray">
        <p class="eyebrow">To place</p>
        <div class="schips">${tray.map((x) => `
          <button type="button" class="schip${t.arm === x.id ? " on" : ""}" data-sarm="${x.id}">
            ${esc(x.title)}</button>`).join("")}</div>
        <p class="sarm">${armed ? `Tap a time for <b>${esc(armed.title)}</b>, or Anytime.
            <button type="button" class="linkbtn" id="sDisarm">Cancel</button>`
          : "Tap a task, then a time, or Anytime."}</p>
      </section>` : ""}
      <section class="sany${armed ? " armed" : ""}">
        <button type="button" class="sanyh" id="sAny" ${armed ? "" : "tabindex=\"-1\""}>
          <span class="eyebrow">Anytime</span>${armed ? `<em>Tap to put it here</em>` : ""}</button>
        ${anytime.length ? `<ul class="tl">${anytime.map((x) => `
          <li class="tm${x.done ? " done" : ""}"><div class="tr">
            <button type="button" class="tck" data-tdone="${x.id}" aria-pressed="${!!x.done}"
              aria-label="${x.done ? "Not done" : "Done"}: ${esc(x.title)}"></button>
            <span class="tt">${esc(x.title)}</span>
            <button type="button" class="tx" data-sunplace="${x.id}" aria-label="Take ${esc(x.title)} off this day">&times;</button>
          </div></li>`).join("")}</ul>`
          : `<p class="tempty">${armed ? "" : "Nothing for anytime this day."}</p>`}
      </section>
      <div class="sgrid${armed ? " armed" : ""}" id="sGrid" style="height:${(SCH_TO - SCH_FROM) * SCH_H}px">
        ${Array.from({ length: SCH_TO - SCH_FROM }, (_, k) => SCH_FROM + k).map((h) => `
          <div class="shr" style="top:${(h - SCH_FROM) * SCH_H}px"><span>${clockOf(h * 60)}</span></div>`).join("")}
        ${isToday && nowMin >= SCH_FROM * 60 ? `<div class="snow" style="top:${y(nowMin)}px"></div>` : ""}
        ${placed.map((x) => `
          <div class="sblk${t.sel === x.id ? " sel" : ""}${x.done ? " done" : ""}" data-sblk="${x.id}"
            role="button" tabindex="0" aria-label="${esc(x.title)}, ${clockOf(x.sched_start)}"
            style="top:${Math.max(0, y(x.sched_start))}px;height:${Math.max(26, x.sched_min / 60 * SCH_H - 2)}px">
            <button type="button" class="tck sm" data-tdone="${x.id}" aria-pressed="${!!x.done}"
              aria-label="${x.done ? "Not done" : "Done"}: ${esc(x.title)}"></button>
            <span class="sbt"><b>${esc(x.title)}</b><small>${clockOf(x.sched_start)}–${clockOf(x.sched_start + x.sched_min)}</small></span>
          </div>`).join("")}
      </div>
      ${sel ? `
        <div class="ssheet" role="dialog" aria-label="${esc(sel.title)}">
          <div class="ssh"><b>${esc(sel.title)}</b>
            <span>${clockOf(sel.sched_start)}–${clockOf(sel.sched_start + sel.sched_min)} · ${hm(sel.sched_min)}</span></div>
          <div class="sadj">
            <button type="button" data-sadj="start:-15">&larr; Earlier</button>
            <button type="button" data-sadj="start:15">Later &rarr;</button>
            <button type="button" data-sadj="len:-15">&minus; 15m</button>
            <button type="button" data-sadj="len:15">+ 15m</button>
          </div>
          <div class="sact">
            <button type="button" class="btn-quiet" data-sanytime="${sel.id}">Anytime</button>
            <button type="button" class="btn-quiet" data-sunplace="${sel.id}">Off the day</button>
            <button type="button" class="btn-quiet" id="sClose" aria-label="Close">&times;</button>
          </div>
        </div>` : ""}`;
  }

  function tasksView() {
    const t = state.tasks || {};
    const head = `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
      </div>
      <header class="masthead">
        <h1 class="th1">Tasks <button type="button" class="spi tinfo${state.taskInfo ? " on" : ""}" id="tInfo" aria-expanded="${!!state.taskInfo}" aria-label="How Tasks works">i</button></h1>
        <p class="sub stdline"><b style="color:var(--ink)">${Number((me() || {}).tasks_done) || 0}</b> done today</p>
      </header>
      ${state.taskInfo ? `<section class="card tinfop">
        <p><span class="tdot" style="--qc:var(--tq1)"></span><span><b>Do</b> Urgent and important: today's list.</span></p>
        <p><span class="tdot" style="--qc:var(--tq2)"></span><span><b>Decide</b> Important, not urgent: plan when you will do it.</span></p>
        <p><span class="tdot" style="--qc:var(--tq3)"></span><span><b>Delegate</b> Someone else's to do: <i>Send to\u2026</i> hands it to someone in your tribe.</span></p>
        <p class="tinfog"><b>Tap</b> a task to edit it and add steps. <b>Hold</b> to drag it, into another list too. <b>Swipe right</b> to move it, <b>left</b> for Today, Tomorrow, Schedule or Delete. A tick in green is done.</p>
      </section>` : ""}`;
    if (!t.loaded) return head + `<p class="loading">Opening…</p>`;
    return head + `
      <div class="range tseg" role="group" aria-label="View">
        <button type="button" data-ttab="list" aria-pressed="${t.tab === "list"}">List</button>
        <button type="button" data-ttab="sched" aria-pressed="${t.tab === "sched"}">Schedule</button>
      </div>
      ${t.tab === "sched" ? schedView() : listView()}
      ${t.err ? `<p class="terr">${esc(t.err)}</p>` : ""}
      <p class="ver">v${APP_VERSION}</p>`;
  }

  function wireTasks() {
    on("back", "click", () => { state.view = "board"; state.tasks = null; render(); refresh(); });
    const t = state.tasks;
    if (!t || !t.loaded) return;
    on("tInfo", "click", () => { state.taskInfo = !state.taskInfo; render(); });
    document.querySelectorAll("[data-tqf]").forEach((el) =>
      el.addEventListener("click", () => {
        const f = qFolds(), q = el.dataset.tqf; f[q] = !f[q];

      li.addEventListener("contextmenu", (e) => { if (dragging) e.preventDefault(); });
    });

    // ---- V5.5. Delegate ----
    document.querySelectorAll("[data-tdeleg]").forEach((el) => el.addEventListener("click", () => {
      const x = find(el.dataset.tdeleg); if (!x) return;
      const others = state.people.filter((p) => p.id !== state.meId);
      const send = async (to) => {
        const res = await taskCall("app_task_delegate", { p_id: x.id, p_to: to });
        if (res && res.error) { t.err = res.offline ? "No signal. Not sent yet." : res.error; render(); return; }
        const fresh = await call("app_tasks", { p_code: state.code, p_person: state.meId });
        if (fresh && !fresh.error) { t.list = fresh.tasks || t.list; t.inbox = fresh.inbox || []; cacheTasks(); }
        render();
      };
      openModal({ title: x.deleg_to ? `${x.title}` : `Send “${x.title}” to`,
        body: x.deleg_to ? `With ${x.deleg_name || "someone"} · ${DSTAT[x.deleg_status] || "waiting"}.` : "They can accept it or decline it.",
        buttons: [
          ...others.filter((p) => p.id !== x.deleg_to).map((p) => ({ label: x.deleg_to ? `Send to ${p.name} instead` : p.name, kind: "go", run: () => send(p.id) })),
          ...(x.deleg_to ? [{ label: "Take it back", kind: "bad", run: () => send(null) }] : []),
          { label: "Cancel", kind: "quiet" },
        ] });
    }));
    document.querySelectorAll("[data-tans]").forEach((el) => el.addEventListener("click", async () => {
      const [id, yes] = el.dataset.tans.split(":");
      t.inbox = (t.inbox || []).filter((x) => x.id !== id); render();
      const res = await taskCall("app_task_answer", { p_id: id, p_accept: yes === "1" });
      if (res && res.error) { t.err = res.offline ? "No signal. Try again." : res.error; }
      const fresh = await call("app_tasks", { p_code: state.code, p_person: state.meId });
      if (fresh && !fresh.error) { t.list = fresh.tasks || t.list; t.inbox = fresh.inbox || []; cacheTasks(); }
      render();
    }));

    // ---- done: fold and clear ----
    on("tDoneFold", "click", () => { t.doneOpen = !t.doneOpen; render(); });
    on("tClear", "click", () => {
      const n = t.list.filter((x) => !x.parent_id && x.done).length;
      openModal({
        title: `Clear ${n} done task${n === 1 ? "" : "s"}?`,
        body: "They are deleted for good.",
        buttons: [
          { label: "Clear", kind: "bad", run: async () => {
              const doneIds = new Set(t.list.filter((x) => x.done).map((x) => x.id));
              t.list = t.list.filter((x) => !doneIds.has(x.id) && !doneIds.has(x.parent_id));
              t.doneOpen = false; render(); cacheTasks();
              await taskCall("app_tasks_clear", {});
            } },
          { label: "Cancel", kind: "quiet" },
        ],
      });
    });

    // ---- schedule ----
    if (t.tab !== "sched") return;
    on("sPrev", "click", () => { t.day = shiftISO(t.day, -1); t.sel = null; render(); });
    on("sNext", "click", () => { t.day = shiftISO(t.day, 1); t.sel = null; render(); });
    on("sToday", "click", () => { t.day = todayISO(); t.sel = null; render(); });
    document.querySelectorAll("[data-sarm]").forEach((el) =>
      el.addEventListener("click", () => {
        t.arm = t.arm === el.dataset.sarm ? null : el.dataset.sarm; t.sel = null; render(); }));
    on("sDisarm", "click", () => { t.arm = null; render(); });
    const grid = document.getElementById("sGrid");
    on("sAny", "click", () => {
      const x = t.arm && find(t.arm);
      if (!x) return;
      x.sched_date = t.day; x.sched_start = null; x.sched_min = null;
      t.arm = null; render(); save(x);
    });
    document.querySelectorAll("[data-sanytime]").forEach((el) =>
      el.addEventListener("click", () => {
        const x = find(el.dataset.sanytime);
        if (!x) return;
        x.sched_start = null; x.sched_min = null; t.sel = null; render(); save(x);
      }));
    if (grid) grid.addEventListener("click", (e) => {
      if (e.target.closest("[data-tdone]")) return;           // a tick is not a tap on the block
      const blk = e.target.closest("[data-sblk]");
      if (!t.arm) {
        t.sel = blk ? (t.sel === blk.dataset.sblk ? null : blk.dataset.sblk) : null;
        render(); return;
      }
      const x = find(t.arm);
      if (!x) return;
      const yy = e.clientY - grid.getBoundingClientRect().top;
      const m = Math.max(SCH_FROM * 60, Math.min(SCH_TO * 60 - 15,
        SCH_FROM * 60 + Math.floor(yy / SCH_H * 4) * 15));
      x.sched_date = t.day; x.sched_start = m; x.sched_min = x.sched_min || 30;
      t.arm = null; t.sel = x.id;
      render(); save(x);
    });
    let adjTimer = null;
    document.querySelectorAll("[data-sadj]").forEach((el) =>
      el.addEventListener("click", () => {
        const x = find(t.sel);
        if (!x) return;
        const [k, d] = el.dataset.sadj.split(":");
        if (k === "start") x.sched_start = Math.max(0, Math.min(1439 - 5, x.sched_start + Number(d)));
        else x.sched_min = Math.max(15, Math.min(720, x.sched_min + Number(d)));
        render();
        clearTimeout(adjTimer); adjTimer = setTimeout(() => save(x), 500);
      }));
    document.querySelectorAll("[data-sunplace]").forEach((el) =>
      el.addEventListener("click", () => {
        const x = find(el.dataset.sunplace);
        if (!x) return;
        x.sched_date = null; x.sched_start = null; x.sched_min = null;
        if (t.sel === x.id) t.sel = null;
        render(); save(x);
      }));
    on("sClose", "click", () => { t.sel = null; render(); });
  }

  /* ---------- finishing a workout --------------------------------------
     V3.4. Finish asks nothing. A set you ticked or typed in is logged; a
     set still showing last time's grey numbers is one you skipped. If the
     shape of the workout changed, one quiet line offers to update the
     template, because almost nobody wants to, and nobody should have to
     answer a question to say so.
     ------------------------------------------------------------------ */

  async function finishFlow(a) {
    // What you ticked or typed is logged; the grey carried-over numbers you
    // never touched are the sets you did not do, and drop away with the
    // empty rows.
    if (!doneSets(a)) {
      state.lift.msg = "Type or tick the sets you did, then Finish.";
      const h = document.getElementById("liftHint");
      if (h) h.textContent = state.lift.msg;
      return;
    }
    let skip = 0;
    a.ex.forEach((x) => x.sets.forEach((st) => { if (!counts(st, x.kind) && hasNumsSet(st, x.kind)) skip++; }));
    // V3.5. Every finish is confirmed first, as Strong does: one stray tap
    // on Finish must not end a workout.
    openModal({
      mark: "\u{1F389}",
      title: a.mode === "cardio" ? "Finish activity?" : "Finish workout?",
      body: skip ? `${skip === 1 ? "One set" : `${skip} sets`} you did not tick or change ${skip === 1 ? "is" : "are"} left out.` : "",
      row: true,
      buttons: [
        { label: "Cancel", kind: "quiet" },
        { label: "Finish", kind: "ok", run: async () => {
            a.ex.forEach((x) => {
              x.sets = x.sets.filter((st) => {
                if (!counts(st, x.kind)) return false;
                st.on = true;
                return true;
              });
            });
            a.ex = a.ex.filter((x) => x.sets.length);
            saveLocal();
            await commitFinish(a);
          } },
      ],
    });
  }

  // What changed between the template and what was done, in words.
  function shapeChange(a) {
    if (!a.fromTile || !Array.isArray(a.tmpl)) return null;
    const was = new Map(a.tmpl.map((x) => [x.name.toLowerCase(), x]));
    const now = new Map(a.ex.map((x) => [x.name.toLowerCase(), x]));
    const added = a.ex.filter((x) => !was.has(x.name.toLowerCase())).map((x) => x.name);
    const dropped = a.tmpl.filter((x) => !now.has(x.name.toLowerCase())).map((x) => x.name);
    const more = [], fewer = [];
    a.ex.forEach((x) => {
      const w = was.get(x.name.toLowerCase());
      if (!w) return;
      if (x.sets.length > w.sets) more.push(x.name);
      if (x.sets.length < w.sets) fewer.push(x.name);
    });
    const order = a.tmpl.map((x) => x.name.toLowerCase()).filter((k) => now.has(k)).join("|")
              !== a.ex.map((x) => x.name.toLowerCase()).filter((k) => was.has(k)).join("|");
    if (!added.length && !dropped.length && !more.length && !fewer.length && !order) return null;
    const list = (xs) => xs.length <= 2 ? xs.join(" and ")
      : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
    const bits = [];
    if (added.length)   bits.push(`added ${list(added)}`);
    if (dropped.length) bits.push(`dropped ${list(dropped)}`);
    if (more.length)    bits.push(`did more sets of ${list(more)}`);
    if (fewer.length)   bits.push(`did fewer sets of ${list(fewer)}`);
    if (!bits.length && order) bits.push("changed the order");
    const s = bits.join(", ");
    return "You " + s + ".";
  }

  // V3.5. What changed against the template, in the two ways Strong asks
  // about: the numbers in sets it already had, and its shape (sets or
  // exercises added, removed or reordered).
  const pickVals = (st) => ({ w: Number(st.w) || 0, r: Number(st.r) || 0, d: Number(st.d) || 0, t: Number(st.t) || 0 });
  const sameVals = (x, y, kind) => kind === "duration" ? x.t === y.t
    : kind === "distance_time" ? x.d === y.d && x.t === y.t : x.w === y.w && x.r === y.r;
  function templateDiff(a) {
    if (!a.fromTile || !Array.isArray(a.tmpl)) return null;
    const byName = new Map(a.ex.map((x) => [x.name.toLowerCase(), x]));
    let valSets = 0, setDelta = 0;
    for (const t of a.tmpl) {
      const x = byName.get(t.name.toLowerCase());
      if (!x) continue;
      setDelta += x.sets.length - t.sets;
      x.sets.slice(0, t.sets).forEach((st, i) => {
        const old = t.vals && t.vals[i] ? pickVals(t.vals[i]) : null;
        if (!old || !sameVals(pickVals(st), old, x.kind)) valSets++;
      });
    }
    const was = new Set(a.tmpl.map((t) => t.name.toLowerCase()));
    const added = a.ex.filter((x) => !was.has(x.name.toLowerCase())).map((x) => x.name);
    const dropped = a.tmpl.filter((t) => !byName.has(t.name.toLowerCase())).map((t) => t.name);
    const shape = shapeChange(a) !== null;
    const list = (xs) => xs.length <= 2 ? xs.join(" and ") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
    const bits = [];
    if (added.length) bits.push(`Adds ${list(added)}`);
    if (dropped.length) bits.push(`Removes ${list(dropped)}`);
    if (setDelta > 0) bits.push(`Adds ${setDelta} set${setDelta === 1 ? "" : "s"}`);
    if (setDelta < 0) bits.push(`Removes ${-setDelta} set${setDelta === -1 ? "" : "s"}`);
    if (shape && !bits.length) bits.push("Changes the order");
    return { valSets, shape, shapeWords: bits.join(", ") + "." };
  }


  async function commitFinish(a) {
    stopTicking();
    const diff = templateDiff(a);
    const label = a.label;
    const mode = a.mode || state.mode;
    const res = await syncLift(true);

    // A finish never fails. If the network is down, or the call errors
    // for any other reason, the workout is already on the phone and
    // marked finished — it goes up on the next load or reconnect. The
    // one thing that must never happen is a finished session held
    // hostage on a screen someone is trying to leave.
    if (res.offline || res.error) {
      state.lift.msg = "Saved on this phone. It will upload by itself.";
      state.view = "exercise";
      state.lift.loaded = false;
      render();
      return;
    }
    const prs = Number(res.pr_count) || 0;
    // Two ways to write the template back. "Values only" keeps its shape and
    // takes today's numbers for the sets it has; "template and values"
    // becomes exactly what was done.
    const valuesOnly = (a.tmpl || []).map((t) => {
      const x = a.ex.find((y) => y.name.toLowerCase() === t.name.toLowerCase());
      return { exercise: t.name, kind: t.kind, sets: t.sets,
               vals: Array.from({ length: t.sets }, (_, i) =>
                 x && x.sets[i] ? pickVals(x.sets[i]) : (t.vals && t.vals[i] ? pickVals(t.vals[i]) : pickVals({}))) };
    });
    const asDone = a.ex.map((x) => ({ exercise: x.name, kind: x.kind, sets: x.sets.length,
                                      vals: x.sets.map(pickVals) }));
    state.lift.active = null;
    saveLocal(mode);
    state.lift.msg = prs ? `Logged. ${prs} personal record${prs === 1 ? "" : "s"}.` : "Logged.";
    // Back to the page the workout belongs to. It used to set a view name
    // nothing rendered, which dropped you on the home screen instead.
    state.view = "exercise";
    await loadLift();
    render();
    refresh();                       // the board now owes you Train minutes

    // V3.5. Then, only if something changed, the template question, as
    // Strong asks it. Same sets: new numbers or keep. Different sets: the
    // numbers alone, everything, or keep.
    if (diff && label && (diff.valSets || diff.shape)) {
      const saveT = (items, done) => async () => {
        const r = await call("app_template_save", { p_code: state.code, p_person: state.meId,
          p_label: label, p_mode: mode, p_items: items });
        state.lift.msg = r.error ? r.error : done;
        await loadLift(); render();
      };
      const n = diff.valSets;
      // With no numbers changed, "values only" would do nothing Keep does
      // not, so it is not offered.
      const buttons = n ? [
        { label: "Update Values Only", kind: "go",
          sub: `Updates values for ${n} set${n === 1 ? "" : "s"}.`,
          run: saveT(valuesOnly, `\u201c${label}\u201d values updated.`) },
      ] : [];
      if (diff.shape) buttons.push({ label: "Update Template and Values", kind: "bad", sub: diff.shapeWords,
          run: saveT(asDone, `\u201c${label}\u201d updated.`) });
      buttons.push({ label: "Keep Original Template", kind: "quiet" });
      openModal({
        title: "Update Template",
        body: "You\u2019ve made changes from your original template. Would you like to update it?",
        buttons,
      });
    }
  }

  /* ---------- Goals: The ONE Thing over the 12 Week Year -------------
     V3.4. Two books, one page.

     Gary Keller's The ONE Thing sits on top: goal setting to the now.
     Someday, then three years, then the ONE goal of these twelve weeks,
     then this week's ONE Thing, then today's. Each line answers the
     focusing question for a shorter stretch of time, so today is never
     cut off from Someday.

     Brian Moran's 12 Week Year is the engine underneath. Up to three
     goals, each with one KPI (the result, logged weekly) and its tactics
     (the actions you control, N times a week). The week is a scorecard,
     like the paper one: tactics down the side, Monday to Sunday across,
     tick the day you did it. The score is tactics done over tactics due;
     your standard (85% unless you set one) wins the week.

     The page holds the plan as one document and saves it whole, a moment
     after each change. There is no Save button to forget.
     ------------------------------------------------------------------ */
  const goalWin = () => stdOf(me(), "goals");
  const timesOf = (t) => Math.max(1, Math.min(7, Number(t.times) || (t.daily ? 7 : 1)));
  const dueIn = (t, w) => t.week === null || t.week === undefined || Number(t.week) === w;
  const hasMark = (t, w, d) => (t.marks || []).some((m) => m[0] === w && m[1] === d);
  function toggleMark(t, w, d) {
    t.marks = hasMark(t, w, d) ? t.marks.filter((m) => !(m[0] === w && m[1] === d))
                               : (t.marks || []).concat([[w, d]]);
  }
  const ticksIn = (t, w) => [1, 2, 3, 4, 5, 6, 7].filter((d) => hasMark(t, w, d)).length;
  // A tactic due N times counts at most N: a fourth gym day is not 4/3.
  function goalTally(g, w) {
    let due = 0, done = 0;
    for (const t of g.tactics) {
      if (!dueIn(t, w)) continue;
      const n = timesOf(t);
      due += n; done += Math.min(n, ticksIn(t, w));
    }
    return { due, done, pct: due ? Math.round(done / due * 100) : null };
  }
  function weekTally(doc, w) {
    let due = 0, done = 0;
    for (const g of doc.goals) { const x = goalTally(g, w); due += x.due; done += x.done; }
    return { due, done, pct: due ? Math.round(done / due * 100) : null };
  }
  const dowOf = (iso) => ((new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7) + 1;   // Mon 1 … Sun 7
  const weekOf = (doc, today) => Math.floor((new Date(today + "T00:00:00Z") -
                                  new Date(doc.start_date + "T00:00:00Z")) / 604800000) + 1;
  const curWeek = () => { const G = state.goals; return G && G.cycle ? weekOf(G.cycle, G.today) : null; };
  // The last week that can be ticked: this one, or 12 once the run is over.
  const lastOpen = () => Math.min(12, Math.max(1, curWeek() || 1));
  function weekSpan(start, w) {
    const a = shiftISO(start, (w - 1) * 7), b = shiftISO(a, 6);
    const f = (iso, m) => new Date(iso + "T00:00:00Z").toLocaleDateString(undefined,
      m ? { timeZone: "UTC", month: "short", day: "numeric" } : { timeZone: "UTC", day: "numeric" });
    return `${f(a, true)} – ${a.slice(0, 7) === b.slice(0, 7) ? f(b, false) : f(b, true)}`;
  }
  const numOrNull = (v) => { const x = parseFloat(String(v).replace(/,/g, ""));
                             return Number.isFinite(x) ? x : null; };
  const fmtNum = (v) => v === null || v === undefined ? "–"
    : Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
  // The KPI as it stands: the latest week logged, or where it started.
  const kpiLatest = (g, upto) => {
    const log = g.kpi_log || {};
    for (let w = upto; w >= 1; w--) if (log[w] !== undefined && log[w] !== null) return Number(log[w]);
    return g.kpi_now === null || g.kpi_now === undefined ? null : Number(g.kpi_now);
  };
  const freqWord = (t) => t.week ? `wk ${t.week}` : timesOf(t) === 7 ? "daily" : `${timesOf(t)}×`;
  const freqOf = (t) => t.week ? "w" + t.week : String(timesOf(t));
  const FREQ_OPTS = [["7", "Every day"], ["6", "6× a week"], ["5", "5× a week"], ["4", "4× a week"],
    ["3", "3× a week"], ["2", "2× a week"], ["1", "1× a week"]]
    .concat(Array.from({ length: 12 }, (_, k) => ["w" + (k + 1), `Week ${k + 1} only`]));
  const freqSelect = (sel, attrs) => `<select class="tmove" ${attrs} aria-label="How often">${FREQ_OPTS.map(([v, l]) =>
    `<option value="${v}" ${sel === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  function setFreq(t, v) {
    if (String(v).startsWith("w")) { t.week = Number(String(v).slice(1)); t.times = 1; }
    else { t.week = null; t.times = Math.max(1, Math.min(7, Number(v) || 1)); }
    t.daily = t.times === 7;
    if (t.week) t.marks = (t.marks || []).filter((m) => m[0] === t.week);
  }
  const newGoal = () => ({ id: uuid(), title: "", kpi: "", kpi_now: null, kpi_target: null, kpi_log: {}, tactics: [] });

  // The worked example: a whole plan four weeks in, on a Thursday. It is
  // drawn by the same code as your own plan, read-only.
  const EXAMPLE = (() => {
    const tac = (title, times, weeks) => ({ id: "ex-" + title, title, times, daily: times === 7, week: null,
      marks: weeks.flatMap((ds, i) => [...ds].map((d) => [i + 1, Number(d)])) });
    const g = (id, title, kpi, start, target, log, tactics) =>
      ({ id, title, kpi, kpi_now: start, kpi_target: target,
         kpi_log: Object.fromEntries(log.map((v, i) => [i + 1, v])), tactics });
    return {
      id: "example", start_date: "2026-01-05",
      vision: "Healthy and strong into my eighties, with a family that is too.",
      three_year: "Lean and strong, running a 10K every spring, sleeping seven hours a night.",
      one_year: "Down 15 lb and running my first 10K by October.",
      one_goal: "ex-g1",
      focus: { w4: "Lift Monday, Wednesday and Friday at 6 am." },
      goals: [
        g("ex-g1", "Lose 8 lb", "Weight, lb", 184, 176, [183, 182, 181.5, 181], [
          tac("Lift 45 min", 3, ["135", "13", "135", "13"]),
          tac("Walk 8,000 steps", 7, ["123457", "1234567", "12456", "123"]),
          tac("Protein at every meal", 7, ["1234", "123456", "1234567", "124"]) ]),
        g("ex-g2", "Sleep 7 hours a night", "Average sleep, h", 6.2, 7, [6.3, 6.6, 6.8, 6.7], [
          tac("Screens off by 9:30 pm", 7, ["125", "1234", "123457", "123"]),
          tac("In bed by 10 pm", 5, ["123", "1234", "12345", "123"]) ]),
        g("ex-g3", "Read 4 books", "Books finished", 0, 4, [0, 1, 1, 2], [
          tac("Read 20 min", 7, ["12367", "12345", "23456", "1234"]),
          tac("Weekly review, Sunday", 1, ["7", "7", "7", ""]) ]),
      ],
    };
  })();

  function normCycle(c) {
    if (!c) return null;
    c.focus = c.focus || {};
    c.three_year = c.three_year || "";
    c.one_year = c.one_year || "";
    c.quarter = c.quarter || "";
    c.milestones = Array.isArray(c.milestones) ? c.milestones : [];
    c.goals.forEach((g) => {
      g.kpi_log = g.kpi_log || {};
      g.plan = g.plan || {};
      g.tactics.forEach((t) => {
        t.times = timesOf(t); t.daily = t.times === 7;
        t.marks = (t.marks || []).map((m) => [Number(m[0]), Number(m[1])]); });
    });
    return c;
  }
  // V4.5. Home's Goals slide needs the plan too: fetched once, quietly, and
  // handed back fresh by the Goals page when you leave it.
  async function loadHomeCycle() {
    state.homeCycleLoading = true;
    const res = await call("app_cycle", { p_code: state.code, p_person: state.meId });
    state.homeCycleLoading = false;
    state.homeCycle = res.error ? { err: true } : { cycle: normCycle(res.cycle), today: res.today || todayISO() };
    if (state.view === "board") render();
  }
  async function openGoals() {
    window.scrollTo(0, 0);
    state.goals = { loaded: false, today: todayISO(), cycle: null, sel: 1, edit: null, err: null,
                    ex: false, guide: {}, twelve: false };
    const res = await call("app_cycle", { p_code: state.code, p_person: state.meId });
    const G = state.goals;
    if (res.error) G.err = res.error;
    G.today = res.today || todayISO();
    G.cycle = normCycle(res.cycle);
    G.sel = lastOpen();
    G.loaded = true;
    render();
  }

  let goalTimer = null;
  async function pushGoals() {
    goalTimer = null;
    const G = state.goals;

  /* V3.6. Goals as three steps, top to bottom, each answering Keller's

  const GUIDE = {

      great: "<b>Someday</b> “At 75 I hike, lift and play on the floor with my grandchildren.” <b>3 years</b> “Lean and strong, running a 10K every spring, sleeping 7 hours.” <b>This year</b> “Down 15 lb and running my first 10K by October.”",

    },
    goals: {

      how: "Up to three goals. One is ideal, so star the one that matters most: it gets your best hours. Each goal is a finished result with a number, and it is measured two ways. <b>Lag</b> is the result itself, which you can’t directly control: your weight, chapters written, money saved. Log it once a week, on the same day. <b>Lead</b> is the actions that produce it, which you do control: your tactics, in This week. The app works the lead out from your ticks, so there is nothing extra to type.",
      great: "★ “Lose 8 lb.” Lag: Weight, 184 → 176, logged Monday mornings. Lead: Lift 3× a week, walk 8,000 steps daily. · “Read 4 books.” Lag: Books finished, 0 → 4. Lead: Read 20 minutes daily.",
      notgreat: "“Get healthier.” (No finish line, so no lag to log.) · Lag: “Go to the gym.” (That’s an action, so it’s lead, a tactic. The lag is what the gym changes.) · Five goals at once. (Twelve weeks holds three at most.)",
    },
    year: {
      ask: "What is already fixed this year, before work fills it?",
      how: "Dan Martell’s Preloaded Year: before the year fills up, block what matters most. Vacations, family days, big events, rest weeks. Then plan each 12 weeks around them instead of into them. Pick a kind, then tap or drag across days to mark them. Marks are for planning: no score reads them.",
      great: "Two weeks of vacation in summer, a long weekend each quarter, family birthdays, the move, a rest week after each 12-week cycle.",
      notgreat: "Leaving the year empty and hoping time turns up. It won’t: someone else’s plan will fill it.",

  // V4.2. Every step folds, and the phone remembers which. Folded, a step

  // V5.4. The Preloaded Year. The whole year at a glance, one row a month;
  // tap a month to mark its days. Pick a kind, then tap or drag across days.
  // Your 12 weeks are underlined. Planning only: no score reads a mark.
  const YK = { v: ["Vacation", "#c9a45c"], f: ["Family", "#7cc89a"], e: ["Event", "#7aa2c8"], r: ["Rest", "#a594d6"] };

  function yearCard(C) {

    const yr = G.yyear || Number((G.today || todayISO()).slice(0, 4));
    const d = C.doc, cs = d && d.start_date, ce = cs ? shiftISO(cs, 83) : null;
    const iso = (m, dd) => `${yr}-${pad(m + 1)}-${pad(dd)}`;
    const dim = (m) => new Date(Date.UTC(yr, m + 1, 0)).getUTCDate();
    const inC = (x) => cs && x >= cs && x <= ce;
    const today = G.today || todayISO();

    // V5.6. Like the printed Preloaded Year: every month starts under its
    // own weekday, so Saturdays and Sundays line up as two shaded columns

    const DOW = ["M", "T", "W", "T", "F", "S", "S"];
    const head = `<div class="yrow yhead" aria-hidden="true"><span></span><i class="ycells">${Array.from({ length: 37 }, (_, c) =>
      `<span class="${c % 7 >= 5 ? "we" : ""}">${DOW[c % 7]}</span>`).join("")}</i></div>`;
    const glance = head + MONTHS.map((name, m) => {
      const off = (new Date(Date.UTC(yr, m, 1)).getUTCDay() + 6) % 7, n = dim(m);
      return `<button type="button" class="yrow${G.ymonth === m ? " on" : ""}" data-ymonth="${m}" aria-label="${name}, mark its days">
        <span>${name.slice(0, 3)}</span><i class="ycells">${Array.from({ length: 37 }, (_, c) => {
          const we = c % 7 >= 5 ? "we" : "", d = c - off + 1;
          if (d < 1 || d > n) return `<b class="e ${we}"></b>`;
          const x = iso(m, d), k = marks[x];
          return `<b class="${we}${inC(x) ? " cy" : ""}${x === today ? " td" : ""}"${k ? ` style="background:${YK[k][1]};color:#1b160c"` : ""}><em>${d}</em></b>`; }).join("")}</i></button>`; }).join("") + head;
    const month = G.ymonth === undefined || G.ymonth === null ? "" : (() => {
      const m = G.ymonth, first = (new Date(Date.UTC(yr, m, 1)).getUTCDay() + 6) % 7;
      const cells = Array.from({ length: first }, () => `<span></span>`).concat(Array.from({ length: dim(m) }, (_, i) => {
        const x = iso(m, i + 1), k = marks[x];
        const we = (first + i) % 7 >= 5;
        return `<button type="button" class="yday${we ? " we" : ""}${inC(x) ? " cy" : ""}${x === today ? " td" : ""}" data-yd="${x}"${k ? ` style="background:${YK[k][1]};color:#1b160c"` : ""} aria-label="${MONTHS[m]} ${i + 1}${k ? ", " + YK[k][0] : ""}">${i + 1}</button>`; }));
      return `<div class="ymonth"><p class="ymh">${MONTHS[m]} ${yr}</p>
        <div class="ydow">${["M", "T", "W", "T", "F", "S", "S"].map((x, j) => `<span class="${j >= 5 ? "we" : ""}">${x}</span>`).join("")}</div>
        <div class="ygrid" id="yGrid">${cells.join("")}</div></div>`; })();
    const paint = G.ypaint || "v";
    return gStep(C, null, "Your year", "", "year", `
      <div class="ynav"><button type="button" class="ynb" id="yPrev" aria-label="Previous year">\u2039</button><b>${yr}</b><button type="button" class="ynb" id="yNext" aria-label="Next year">\u203a</button></div>
      <div class="yglance">${glance}</div>
      <div class="ykinds" role="group" aria-label="Mark days as">${Object.entries(YK).map(([k, [lab, col]]) =>
        `<button type="button" class="ykind${paint === k ? " on" : ""}" data-ypaint="${k}" aria-pressed="${paint === k}"><i style="background:${col}"></i>${lab}</button>`).join("")}
        <button type="button" class="ykind${paint === "x" ? " on" : ""}" data-ypaint="x" aria-pressed="${paint === "x"}">Clear</button></div>
      ${month || `<p class="hint" style="text-align:center">Tap a month to mark its days.${cs ? " Your 12 weeks are underlined." : ""}</p>`}`,
      n ? `${n} day${n > 1 ? "s" : ""} marked in ${yr}` : "Block your vacations, family and big days first", true);
  }
  let yTimer = null;
  function wireYear() {
    const G = state.goals; if (!G) return;
    if (!G.year && !G.yearLoading) {
      G.yearLoading = true;
      call("app_year", { p_code: state.code, p_person: state.meId }).then((r) => { G.yearLoading = false; G.year = { marks: (r && !r.error && r.marks) || {} }; if (state.view === "goals") render(); });
    }
    const Y = G.year = G.year || { marks: {} };
    const yr = G.yyear || Number((G.today || todayISO()).slice(0, 4));
    on("yPrev", "click", () => { G.yyear = yr - 1; G.ymonth = null; render(); });
    on("yNext", "click", () => { G.yyear = yr + 1; G.ymonth = null; render(); });
    document.querySelectorAll("[data-ymonth]").forEach((el) => el.addEventListener("click", () => {
      const m = Number(el.dataset.ymonth); G.ymonth = G.ymonth === m ? null : m; render(); }));
    document.querySelectorAll("[data-ypaint]").forEach((el) => el.addEventListener("click", () => { G.ypaint = el.dataset.ypaint; render(); }));
    const grid = document.getElementById("yGrid");
    if (!grid) return;
    const pending = {};
    const flush = () => { clearTimeout(yTimer); yTimer = setTimeout(async () => {
      const ch = Object.assign({}, pending); for (const k in pending) delete pending[k];
      if (!Object.keys(ch).length) return;
      const res = await call("app_set_year", { p_code: state.code, p_person: state.meId, p_changes: ch });
      if (res.error) { G.err = res.offline ? "No signal. Marks not saved yet." : res.error; render(); }
    }, 500); };
    let act = null;   // what this drag does: a kind, or clear
    const apply = (el) => {
      const x = el.dataset.yd, k = act === "x" ? null : act;
      if ((Y.marks[x] || null) === k) return;
      if (k) Y.marks[x] = k; else delete Y.marks[x];
      pending[x] = k;

    };

      if (!act) return;

      if (el && grid.contains(el)) apply(el);

  }

  // 1 · Someday, 3 years, this year: a ladder, each rung serving the one above.

  // 2 · This 12 weeks

  // V4.5. The Goals page, condensed the other way: nothing hidden behind a

  // The twelve weeks of one goal: Lead % (worked out from the ticks) and
  // Lag (the number you log), each cell tinted against your standard.
  function gGrid(C, g) {

      const p = goalTally(g, i).pct;
      return `<td class="${p !== null && p >= win ? "win" : ""}${tint(p)}${i === C.cur ? " curc" : ""}">${p === null ? "–" : p}</td>`; };
    const lag = (i) => {
      if (i > open) return `<td class="fut">·</td>`;
      const v = (g.kpi_log || {})[i], has = v !== undefined && v !== null, cc = i === C.cur ? "curc" : "";

      if (G.kedit === `${g.id}:${i}:t`) return `<td class="curc"><input class="kin" data-kin="${g.id}:${i}:t" id="gkint"
          inputmode="decimal" enterkeyhint="done" value="${has ? v : ""}" aria-label="${esc(g.kpi || "Lag")}, week ${i}"></td>`;

  // V4.5. Scott Young's Ultralearning, as a game plan for one goal: first
  // the map (Why, What, How), then a line for each of the other eight

  const PLAN_MAP = [

    ["retrieval", "Retrieval", "Test to learn", "How will you test yourself instead of rereading?"],
    ["feedback", "Feedback", "Don’t dodge the punches", "Where will fast, honest feedback come from?"],
    ["retention", "Retention", "Don’t fill a leaky bucket", "How will you keep it: spacing, repetition, overlearning?"],
    ["intuition", "Intuition", "Dig deep before building up", "How will you understand why it works, not only how?"],
    ["experimentation", "Experimentation", "Explore outside your comfort zone", "What will you try that you have not tried before?"],

  function gPlan(C, g) {
    const G = state.goals || {}, P = g.plan || {}, open = G.plan === g.id;
    const n = PLAN_MAP.concat(PLAN_RULES).filter(([k]) => (P[k] || "").trim()).length;
    const line = (k, label, q, tag) => {
      const v = P[k] || "", ed = !C.ro && G.edit === `p:${g.id}:${k}`;

      </div>` : ""}`;

  // One goal, in full: its title and Edit, lead, lag with this week's log.
  // V4.4: shared by the Goals card (open row) and the example.
  function goalLineHTML(C, g) {
    const d = C.doc, G = state.goals || {}, open = Math.min(12, Math.max(1, C.cur));
    {
      const n = d.goals.indexOf(g) + 1;
      if (!C.ro && G.edit === "g:" + g.id) return goalEditHTML(d, g, n);
      const isOne = g.id === d.one_goal;
      const now = kpiLatest(g, open), tgt = g.kpi_target, start = g.kpi_now;
      const span = tgt !== null && tgt !== undefined && start !== null && start !== undefined && now !== null
        && Number(tgt) !== Number(start)
        ? Math.max(0, Math.min(100, (Number(now) - Number(start)) / (Number(tgt) - Number(start)) * 100)) : null;
      // V4.5: the week's lag is typed in the grid below, not here.
      // V3.7. Moran's two measures, named. Lead: the actions, this goal's
      // tactics done ÷ due this week, worked out from the ticks. Lag: the
      // result, the KPI you log once a week.
      const lead = C.cur >= 1 ? goalTally(g, open).pct : null, win = goalWin();
      return `
        <div class="gline2${isOne ? " one" : ""}" id="gl-${g.id}">
          <div class="ghead">${isOne ? `<span class="gstar on" aria-label="Your ONE goal">★</span>` : `<span class="gnum">${n}</span>`}
            <h3>${g.title ? esc(g.title) : `<span style="color:var(--muted)">${isOne ? "Your ONE goal" : "Untitled goal"}</span>`}</h3>
            ${C.ro ? "" : `<button type="button" class="linkbtn" data-gedit="${g.id}">Edit</button>`}</div>
          <div class="gll"><span class="gtag lead">Lead</span><span class="gln">Tactics done this week</span>
            <b class="${lead !== null && lead >= win ? "win" : ""}">${g.tactics.length ? (lead === null ? "–" : lead + "%") : "–"}</b></div>
          ${g.kpi ? `<div class="gll"><span class="gtag lag">Lag</span><span class="gln">${esc(g.kpi)}</span><b>${fmtNum(now)} <small>→ ${fmtNum(tgt)}</small></b></div>
            ${span !== null ? `<div class="gkbar"><i style="width:${span}%"></i></div>` : ""}
`
          : C.ro ? "" : `<div class="gll"><span class="gtag lag">Lag</span><button type="button" class="linkbtn gnokpi" data-gedit="${g.id}">+ The result you will log weekly</button></div>`}
        </div>`;
    }
  }
  /* V6.4. Goals, today first. The page's jobs, by how often:
       daily    tick today's actions            -> the day card, on top

       rarely   change goals, the vision        -> your goals, then the folds

     edited: its ONE Thing, its ticks, the goals and their actions. */
  const DNAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  const wcolor = (p) => p === null ? "var(--muted)" : dialColor(stdPct("goals", p, goalWin()));
  function gTop(C) {
    const d = C.doc, w = C.w, win = goalWin(), T = weekTally(d, w), open = lastOpen();
    if (C.cur < 1) return `<section class="gtop"><p class="gtw"><b>Starts ${esc(shortDay(d.start_date))}</b></p>
        <p class="hint">Write your goals and their actions now; ticking begins on day 1.</p></section>`;
    const pct = T.pct;
    return `<section class="gtop" aria-label="Week ${w} score">
        <div class="gtw"><b>Week ${w} <small>of 12</small></b><span>${esc(weekSpan(d.start_date, w))}</span>
          <em style="color:${wcolor(pct)}">${pct === null ? "–" : pct + "%"}</em></div>
        <div class="gtbar"><i style="width:${Math.min(100, pct || 0)}%;background:${wcolor(pct)}"></i><b style="left:${win}%" aria-hidden="true"></b></div>
        <p class="gtwin"><button type="button" class="dof" data-edit="goal" data-metric="goals">${win}% wins the week</button>${T.due ? ` · ${T.done} of ${T.due} done` : ""}</p>
        ${open > 1 ? `<div class="gwtabs" role="tablist" aria-label="Weeks">${Array.from({ length: open }, (_, i) => i + 1).map((n) => {
          const p = weekTally(d, n).pct;
          return `<button type="button" role="tab" class="gwt${n === w ? " on" : ""}${p !== null && p >= win ? " won" : ""}" data-gweek="${n}" aria-selected="${n === w}">W${n}<small>${p === null ? "–" : p + "%"}</small></button>`; }).join("")}</div>` : ""}
      </section>`;
  }
  function gDay(C) {
    const d = C.doc, G = state.goals || {}, w = C.w, F = d.focus || {};
    if (C.cur < 1) return "";
    const last = w === C.cur ? C.dow : 7, day = Math.min(last, G.dsel || last);
    const isToday = w === C.cur && day === C.dow;
    const date = shiftISO(d.start_date, (w - 1) * 7 + day - 1);
    const any = (dd) => d.goals.some((g) => g.tactics.some((t) => dueIn(t, w) && hasMark(t, w, dd)));
    const groups = goalOrder(d).map((g) => {
      const due = g.tactics.filter((t) => dueIn(t, w)), gi = d.goals.indexOf(g), gp = goalTally(g, w).pct;
      if (!due.length) return "";
      return `<div class="gdg"><p class="gdgt">${g.id === d.one_goal ? `<span class="cstar">★</span>` : `<span class="gnum xs">${gi + 1}</span>`}<span>${g.title ? esc(g.title) : "Untitled goal"}</span><em style="color:${wcolor(gp)}">${gp === null ? "" : gp + "%"}</em></p>
          <ul class="gchks">${due.map((t) => { const on = hasMark(t, w, day), n = timesOf(t), k = Math.min(n, ticksIn(t, w));
            return `<li><button type="button" class="gchk${on ? " on" : ""}" data-gday="${t.id}:${day}" aria-pressed="${on}" aria-label="${esc(t.title)}, ${DNAMES[day - 1]}">
                <i aria-hidden="true"></i><span>${esc(t.title)}</span><small class="${k >= n ? "full" : ""}">${k}/${n} this week</small></button></li>`; }).join("")}</ul></div>`;
    }).join("");
    const t1 = F["w" + w] || "", done1 = !!F["w" + w + "x"];
    return `<section class="card gtoday">
        <div class="gdh"><h2>${isToday ? "Today" : esc(DNAMES[day - 1])}</h2><span>${isToday ? esc(shortDay(date)) : esc(shortDay(date))}</span></div>
        <div class="gtdays" role="group" aria-label="Day of week ${w}">${DNAMES.map((nm, j) => { const dd = j + 1;
          return `<button type="button" class="gtds${dd === day ? " on" : ""}${any(dd) ? " has" : ""}" data-gdsel="${dd}" ${dd > last ? "disabled" : ""} aria-label="${nm}" aria-pressed="${dd === day}">${nm[0]}</button>`; }).join("")}</div>
        <div class="g1one${done1 ? " done" : ""}">
          ${t1 ? `<button type="button" class="gmsc" data-g1d="${w}" aria-pressed="${done1}" aria-label="${done1 ? "Not done" : "Done"}: week ${w}'s ONE Thing"></button>` : `<span class="gmsc ghost"></span>`}
          <span class="g1lab">ONE Thing</span><span class="g1t">${gText(C, "fw", t1, `Week ${w}'s ONE Thing`, false)}</span></div>
        ${groups || `<p class="hint gdnone">${d.goals.some((g) => g.tactics.length) ? `Nothing due in week ${w}.` : "Add actions to a goal below and they appear here to tick."}</p>`}
      </section>`;
  }
  function gGoals(C) {
    const d = C.doc, G = state.goals || {}, w = C.w, gl = d.goals.length, open = lastOpen();
    const rows = goalOrder(d).map((g) => {
      const gi = d.goals.indexOf(g), isOpen = G.gopen === g.id || G.edit === "g:" + g.id, gp = C.cur >= 1 ? goalTally(g, w).pct : null;
      const lag = g.kpi ? `${esc(g.kpi)} ${fmtNum(kpiLatest(g, Math.min(12, Math.max(1, C.cur))))} → ${fmtNum(g.kpi_target)}` : "";
      return `<li class="ggi${isOpen ? " open" : ""}">
          <button type="button" class="ggh" data-gopen="${g.id}" aria-expanded="${isOpen}">
            ${g.id === d.one_goal ? `<span class="cstar">★</span>` : `<span class="gnum xs">${gi + 1}</span>`}
            <span class="ggt"><b>${g.title ? esc(g.title) : "Untitled goal"}</b>${lag ? `<small>${lag}</small>` : ""}</span>
            <em style="color:${wcolor(gp)}">${gp === null ? "" : gp + "%"}</em><i aria-hidden="true">${isOpen ? "▾" : "▸"}</i></button>
          ${isOpen ? `<div class="gdet">${goalLineHTML(C, g)}${G.edit === "g:" + g.id ? "" : gGrid(C, g) + gPlan(C, g)}</div>` : ""}
        </li>`; }).join("");
    return `<section class="card ggoals">
        <div class="gdh"><h2>Your goals</h2><span>${gl ? `${gl} of 3` : ""}</span></div>
        ${gl ? `<ul class="ggl">${rows}</ul>` : ""}
        ${gl && !d.one_goal ? `<p class="hint gonehint">Open a goal, tap Edit, then ★ to mark your ONE goal.</p>` : ""}
        ${gl < 3 ? `<button type="button" class="linkbtn gadd2 gaddc" id="gAdd">${gl ? "+ Add a goal" : "+ Write your ONE goal"}</button>` : ""}
        ${!gl || (G.edit || "").startsWith("g:") ? `<div class="gguidew">${guide("goals")}</div>` : ""}
      </section>`;

  function gStart(C) {
    const d = C.doc, G = state.goals || {};
    return `<p class="gstart2">${G.restart ? `Week 1 starts on <input type="date" class="field gsdate" id="gStartIn" value="${esc(d.start_date)}" aria-label="The Monday week 1 starts">
          <button type="button" class="linkbtn" id="gStartDone">Done</button>`
        : `${esc(shortDay(d.start_date))} – ${esc(shortDay(shiftISO(d.start_date, 83)))} · <button type="button" class="linkbtn" id="gStartEdit">change start</button>`}</p>
      ${G.restart ? `<p class="hint" style="text-align:center">Any day picks its week; it starts on the Monday. Ticks stay on their week number.</p>` : ""}`;
  }

  // V3.6. The example, made for reading rather than drawn as a copy of
  // the page: three goals side by side, each with the KPI logged week by
  // week and the tactics ticked in week 3, then how that week scored.
  const exampleParts = () => {
    const d = EXAMPLE, w = 3, win = goalWin(), T = weekTally(d, w);
    const freq = (t) => t.times === 7 ? "every day" : `${t.times}× a week`;
    const goal = (g) => {
      const wk = [1, 2, 3];
      const gp = goalTally(g, w).pct;
      return `
        <div class="xgoal${g.id === d.one_goal ? " one" : ""}">
          <div class="xgh">${g.id === d.one_goal ? `<span class="cstar">★</span>` : ""}<b>${esc(g.title)}</b>
            <em class="${gp >= win ? "win" : ""}">lead ${gp}%</em></div>
          <div class="xgrid">
            <span></span>${wk.map((i) => `<small>W${i}</small>`).join("")}
            <span class="xlab"><i class="gtag lead">Lead</i> tactics done</span>${wk.map((i) => {
              const p = goalTally(g, i).pct; return `<b class="${p >= win ? "win" : ""}">${p}%</b>`; }).join("")}
            <span class="xlab"><i class="gtag lag">Lag</i> ${esc(g.kpi)} <small>${fmtNum(g.kpi_now)} → ${fmtNum(g.kpi_target)}</small></span>${wk.map((i) =>

      <section class="card xcard">
        <p class="eyebrow">An example · week 3 of 12</p>
