  }

  function wireGoals() {
    on("back", "click", async () => {
      await flushGoals();
      const G0 = state.goals;
      if (G0 && G0.loaded && !G0.err) state.homeCycle = { cycle: G0.cycle, today: G0.today };
      state.view = "board"; state.goals = null; render(); refresh();
    });
    const G = state.goals;
    if (!G) return;
    const doc = G.cycle;
    document.querySelectorAll("[data-guide]").forEach((el) =>
      el.addEventListener("click", () => {
        G.guide = Object.assign({}, G.guide, { [el.dataset.guide]: !(G.guide || {})[el.dataset.guide] });
        render();
      }));
    on("gInfo", "click", () => { G.info = !G.info; render(); });
    on("gEx", "click", () => { G.ex = !G.ex; render();
      if (G.ex) document.querySelector(".exwrap")?.scrollIntoView({ block: "start", behavior: "smooth" }); });
    document.querySelectorAll("[data-gfold]").forEach((el) =>
      el.addEventListener("click", () => {
        const f = gFolds(), k = el.dataset.gfold;
        f[k] = el.getAttribute("aria-expanded") === "true";
        try { localStorage.setItem(gFoldKey, JSON.stringify(f)); } catch {}
        render();
      }));
    document.querySelectorAll("[data-gstart]").forEach((el) =>
      el.addEventListener("click", () => startCycle(el.dataset.gstart)));
    // V4.4. Any week: the day picked snaps to its Monday.
    on("gStartPick", "change", (e) => { if (e.target.value) startCycle(mondayOf(e.target.value)); });
    on("gStartEdit", "click", () => { G.restart = true; render(); });
    on("gStartDone", "click", () => { G.restart = false; render(); });
    on("gStartIn", "change", (e) => {
      if (!e.target.value || !G.cycle) return;
      G.cycle.start_date = mondayOf(e.target.value);
      G.sel = lastOpen(); G.restart = false;
      render(); saveGoals();
    });
    // V4.5. A ring takes you to its goal; each goal's twelve weeks open on
    // this week; the game plan folds out, one line at a time.
    document.querySelectorAll("[data-gjump]").forEach((el) =>
      el.addEventListener("click", () =>
        document.getElementById("gl-" + el.dataset.gjump)?.closest(".card")?.scrollIntoView({ block: "start", behavior: "smooth" })));
    document.querySelectorAll(".gcard3 .rs-wrap").forEach((w) => {
      const c = w.querySelector("th.cur");
      if (c) w.scrollLeft = Math.max(0, c.offsetLeft - w.clientWidth + c.offsetWidth * 2.5);
    });
    document.querySelectorAll("[data-gplan]").forEach((el) =>
      el.addEventListener("click", () => { G.plan = G.plan === el.dataset.gplan ? null : el.dataset.gplan; G.edit = null; render(); }));
    document.querySelectorAll("[data-gpe]").forEach((el) =>
      el.addEventListener("click", () => {
        G.edit = "p:" + el.dataset.gpe; render();
        const f = document.querySelector(`[data-gpf="${el.dataset.gpe}"]`);
        if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
      }));
    document.querySelectorAll("[data-gpf]").forEach((el) => {
      const [gid, k] = el.dataset.gpf.split(":");
      el.addEventListener("input", () => {
        const g = doc.goals.find((x) => x.id === gid);
        if (!g) return;
        g.plan = Object.assign({}, g.plan);
        const v = el.value.slice(0, 1000);
        if (v.trim()) g.plan[k] = v; else delete g.plan[k];
        saveGoals();
      });
      const done = () => { if (G.edit === "p:" + el.dataset.gpf) { G.edit = null; render(); } };
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); done(); }
        if (e.key === "Escape") done();
      });
      el.addEventListener("blur", () => setTimeout(() => { if (el.isConnected) done(); }, 0));
    });
    document.querySelectorAll("[data-gexample]").forEach((el) =>
      el.addEventListener("click", () => startCycle(el.dataset.gexample, true)));
    const askNew = () => {
      const mon = mondayOf(G.today), next = shiftISO(mon, 7);
      openModal({
        title: "Start a new 12 weeks?",
        body: "This plan is kept. Someday, 3 years and this year carry over; the goals start fresh.",
        buttons: [
          { label: `Start this week · ${shortDay(mon)}`, kind: "go", run: () => startCycle(mon) },
          { label: `Start next Monday · ${shortDay(next)}`, kind: "quiet", run: () => startCycle(next) },
          { label: "Cancel", kind: "quiet" },
        ],
      });
    };
    on("gNew", "click", askNew);
    on("gNew2", "click", askNew);
    if (!doc) return;
    const open = lastOpen(), cur = curWeek();
    const findT = (id) => { for (const g of doc.goals) { const t = g.tactics.find((x) => x.id === id);
                                                        if (t) return { g, t }; } return {}; };

    // ---- the week ----
    document.querySelectorAll("[data-gweek]").forEach((el) => el.addEventListener("click", () => { G.sel = Number(el.dataset.gweek); G.dsel = null; G.edit = null; render(); }));
    document.querySelectorAll("[data-gdsel]").forEach((el) => el.addEventListener("click", () => { G.dsel = Number(el.dataset.gdsel); render(); }));
    { const t = document.querySelector(".gwt.on"); if (t && t.parentElement) t.parentElement.scrollLeft = Math.max(0, t.offsetLeft - t.parentElement.clientWidth / 2); }
    on("gPrev", "click", () => { G.sel = Math.max(1, G.sel - 1); render(); });
    on("gNext", "click", () => { G.sel = Math.min(open, G.sel + 1); render(); });
    on("gToday", "click", () => { G.sel = open; render(); });
    document.querySelectorAll("[data-gday]").forEach((el) =>
      el.addEventListener("click", () => {
        const [id, d] = el.dataset.gday.split(":");
        const { t } = findT(id);
        if (!t || G.sel > open || cur < 1) return;
        toggleMark(t, G.sel, Number(d));
        render(); saveGoals();
      }));

    // ---- V5.7. Someday's milestones: add, cross off, remove ----
    const msList = () => (doc.milestones = Array.isArray(doc.milestones) ? doc.milestones : []);
    document.querySelectorAll("[data-g1d]").forEach((el) => el.addEventListener("click", () => {
      const k = "w" + el.dataset.g1d + "x"; doc.focus = doc.focus || {};
      if (doc.focus[k]) delete doc.focus[k]; else doc.focus[k] = "1";
      saveGoals(); render(); }));
    document.querySelectorAll("[data-gmsd]").forEach((el) => el.addEventListener("click", () => {
      const m = msList().find((x) => x.id === el.dataset.gmsd); if (m) { m.d = !m.d; saveGoals(); render(); } }));
    document.querySelectorAll("[data-gmsx]").forEach((el) => el.addEventListener("click", () => {
      doc.milestones = msList().filter((x) => x.id !== el.dataset.gmsx); saveGoals(); render(); }));

    // ---- goal setting to the now ----
    // V6.4. The ONE Thing written is the selected week's, past weeks too.
    const wk = Math.min(12, Math.max(1, G.sel || cur));
    const focusKey = (k) => k === "fw" ? "w" + wk : `w${wk}d${dowOf(G.today)}`;
    document.querySelectorAll("[data-cedit]").forEach((el) =>
      el.addEventListener("click", () => {
        G.edit = "c:" + el.dataset.cedit; render();
        const f = document.querySelector(`[data-cf="${el.dataset.cedit}"]`);
        if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
      }));
    document.querySelectorAll("[data-cf]").forEach((el) => {
      const k = el.dataset.cf;
      el.addEventListener("input", () => {
        if (k === "vision" || k === "three_year" || k === "one_year" || k === "quarter") doc[k] = el.value.slice(0, k === "vision" ? 2000 : 1000);
        else {
          const v = el.value.slice(0, 200);
          doc.focus = doc.focus || {};
          if (v.trim()) doc.focus[focusKey(k)] = v; else delete doc.focus[focusKey(k)];
        }
        saveGoals();
      });
      const done = () => { if (G.edit === "c:" + k) { G.edit = null; render(); } };
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && (el.tagName === "INPUT" || !e.shiftKey)) { e.preventDefault(); done(); }
        if (e.key === "Escape") done();
      });
      el.addEventListener("blur", () => setTimeout(() => { if (el.isConnected) done(); }, 0));
    });

    // ---- KPI, week by week ----
    document.querySelectorAll("[data-kw]").forEach((el) =>
      el.addEventListener("click", () => {
        G.kedit = el.dataset.kw; render();
        const f = document.querySelector(`[data-kin="${G.kedit}"]`);
        if (f) { f.focus(); f.select(); }
      }));
    document.querySelectorAll("[data-kin]").forEach((el) => {
      const [gid, w] = el.dataset.kin.split(":");
      const commit = () => {
        if (G.kedit !== el.dataset.kin) return;
        G.kedit = null;
        const g = doc.goals.find((x) => x.id === gid);
        if (g) {
          g.kpi_log = g.kpi_log || {};
          const v = numOrNull(el.value);
          if (v === null) delete g.kpi_log[w]; else g.kpi_log[w] = v;
          saveGoals();
        }
        render();
      };
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); commit(); }
        if (e.key === "Escape") { G.kedit = null; render(); }
      });
      el.addEventListener("blur", () => setTimeout(() => { if (el.isConnected) commit(); }, 0));
    });

    // ---- the plan ----
    document.querySelectorAll("[data-gopen]").forEach((el) =>
      el.addEventListener("click", () => { const id = el.dataset.gopen;
        if (G.edit === "g:" + id) return;
        G.gopen = G.gopen === id ? null : id; render(); }));
    wireYear();
    document.querySelectorAll("[data-gedit]").forEach((el) =>
      el.addEventListener("click", () => { G.edit = "g:" + el.dataset.gedit; render(); }));
    document.querySelectorAll("[data-gdone]").forEach((el) =>
      el.addEventListener("click", () => { G.edit = null; render(); }));
    document.querySelectorAll("[data-gf]").forEach((el) =>
      el.addEventListener("input", () => {
        const g = doc.goals.find((x) => x.id === el.dataset.g);
        if (!g) return;
        const f = el.dataset.gf;
        g[f] = f === "kpi_now" || f === "kpi_target" ? numOrNull(el.value) : el.value;
        saveGoals();
      }));
    document.querySelectorAll("[data-gstar]").forEach((el) =>
      el.addEventListener("click", () => {
        doc.one_goal = doc.one_goal === el.dataset.gstar ? null : el.dataset.gstar;
        render(); saveGoals();
      }));
    document.querySelectorAll("[data-gtweek]").forEach((el) =>
      el.addEventListener("change", () => {
        const { t } = findT(el.dataset.gtweek);
        if (!t) return;
        setFreq(t, el.value);
        saveGoals();
      }));
    // V5.1. A tactic's words can be changed in place, and its place in
    // the list dragged by the grip.
    document.querySelectorAll("[data-gttitle]").forEach((el) =>
      el.addEventListener("input", () => {
        const { t } = findT(el.dataset.gttitle);
        if (!t) return;
        const v = el.value.slice(0, 200);
        if (v.trim()) { t.title = v; saveGoals(); }
      }));
    document.querySelectorAll("[data-gtdrag]").forEach((grip) =>
      grip.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const li = grip.closest("li"), ul = li.parentElement;
        const g = doc.goals.find((x) => x.id === ul.dataset.gtlist);
        if (!g) return;
        li.classList.add("drag");
        const move = (ev) => {
          const yy = ev.clientY;
          const others = [...ul.children].filter((c) => c !== li);
          const before = others.find((c) => { const r = c.getBoundingClientRect(); return yy < r.top + r.height / 2; });
          if (before) { if (li.nextElementSibling !== before) ul.insertBefore(li, before); }
          else if (ul.lastElementChild !== li) ul.appendChild(li);
        };
        const up = () => {
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", up);
          window.removeEventListener("pointercancel", up);
          li.classList.remove("drag");
          const ids = [...ul.children].map((c) => c.dataset.id);
          g.tactics.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
          render(); saveGoals();
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
        window.addEventListener("pointercancel", up);
      }));
    document.querySelectorAll("[data-gtdel]").forEach((el) =>
      el.addEventListener("click", () => {
        const { g } = findT(el.dataset.gtdel);
        if (!g) return;
        g.tactics = g.tactics.filter((x) => x.id !== el.dataset.gtdel);
        render(); saveGoals();
      }));
    document.querySelectorAll("[data-gtadd]").forEach((form) =>
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const g = doc.goals.find((x) => x.id === form.dataset.gtadd);
        const inp = form.querySelector("input"), sel = form.querySelector("select");
        const title = (inp.value || "").trim();
        if (!g || !title) return;
        if (g.tactics.length >= 30) { G.err = "Thirty tactics per goal at most."; render(); return; }
        const t = { id: uuid(), title: title.slice(0, 200), week: null, times: 7, daily: true, marks: [] };
        setFreq(t, sel.value);
        g.tactics.push(t);
        render(); saveGoals();
        document.querySelector(`[data-gtadd="${g.id}"] input`)?.focus();
      }));
    document.querySelectorAll("[data-gdel]").forEach((el) =>
      el.addEventListener("click", () => openModal({
        title: "Remove this goal?",
        body: "Its tactics, ticks and KPI log go with it.",
        buttons: [
          { label: "Remove goal", kind: "bad", run: () => {
              doc.goals = doc.goals.filter((x) => x.id !== el.dataset.gdel);
              if (doc.one_goal === el.dataset.gdel) doc.one_goal = null;
              G.edit = null; render(); saveGoals();
            } },
          { label: "Keep it", kind: "quiet" },
        ],
      })));
    on("gAdd", "click", () => {
      if (doc.goals.length >= 3) return;
      const g = newGoal(); doc.goals.push(g);
      if (doc.goals.length === 1) doc.one_goal = g.id;
      G.edit = "g:" + g.id; render(); saveGoals();
      document.querySelector(`[data-g="${g.id}"][data-gf="title"]`)?.focus();
    });
  }

  /* ---------- one popup, used everywhere a choice has to be made -------
     V2.8. Built on the page, not with confirm(): a browser dialog cannot be
     styled, cannot offer three answers, and inside some app views is not
     shown at all. It sits outside the rendered page so a re-render behind
     it cannot close it. Stacked, full-width buttons in the order of how
     often each is the right answer — the Strong pattern, because it works.
     ------------------------------------------------------------------ */
  function openModal({ title, body, mark, buttons, row }) {
    closeModal();
    const wrap = document.createElement("div");
    wrap.className = "modal";
    wrap.id = "modal";
    wrap.setAttribute("role", "dialog");
    wrap.setAttribute("aria-modal", "true");
    wrap.innerHTML = `
      <div class="mcard">
        ${mark ? `<div class="mmark" aria-hidden="true">${mark}</div>` : ""}
        <h3>${esc(title)}</h3>
        ${body ? `<p>${esc(body)}</p>` : ""}
        <div class="mbtns${row ? " row" : ""}">${buttons.map((b, i) => `
          <button type="button" class="mbtn ${b.kind || "quiet"}" data-mb="${i}">
            ${esc(b.label)}${b.sub ? `<small>${esc(b.sub)}</small>` : ""}</button>`).join("")}
        </div>
      </div>`;
    document.body.appendChild(wrap);
    wrap.querySelectorAll("[data-mb]").forEach((el) =>
      el.addEventListener("click", async () => {
        const b = buttons[Number(el.dataset.mb)];
        closeModal();
        if (b && b.run) await b.run();
      }));
    wrap.querySelector("[data-mb]")?.focus();
  }
  function closeModal() { document.getElementById("modal")?.remove(); }
  // alert() has the same problem confirm() had: some app views never show it.
  const say = (msg) => openModal({ title: msg, buttons: [{ label: "OK", kind: "quiet" }] });

  /* ---------- Work: a focus timer that logs itself --------------------
     V2.8. One circle, one button. Idle, the ring shows how far today is
     toward your standard and the centre shows the session length, so the
     screen answers "how much is left today" before you touch anything.
     Running, the ring drains with the session.

     The timer is WALL-CLOCK, not a counter. A phone suspends a page it is
     not looking at, so a counter would stop the moment you lock the
     screen. The start time is kept on the phone instead, and "how long is
     left" is worked out from the clock every time the page looks — so a
     session finishes on time whether or not you were watching, and is
     logged the next time the app wakes.
     ------------------------------------------------------------------ */
  // V3.1. Any length from 5 to 180 minutes, in steps of 5; 20 to start.
  const WORK_MIN = 5, WORK_MAX = 180, WORK_STEP = 5, WORK_DEFAULT = 20;
  const workKey = () => "fhd.work." + (state.meId || "anon");
  function loadWorkLocal() {
    try {
      const w = JSON.parse(localStorage.getItem(workKey()) || "{}");
      const len = Number(w.len);
      state.work = { len: len >= WORK_MIN && len <= WORK_MAX ? len : WORK_DEFAULT, run: w.run || null,
                     focus: w.focus && w.focus.label ? w.focus : null,
                     adjust: state.work ? state.work.adjust : false, pick: false,
                     pending: Array.isArray(w.pending) ? w.pending : [],
                     sessions: state.work && state.work.sessions || null };
    } catch { state.work = { len: WORK_DEFAULT, run: null, focus: null, pending: [], sessions: null }; }
  }
  function saveWorkLocal() {
    try { localStorage.setItem(workKey(),
      JSON.stringify({ len: state.work.len, run: state.work.run, focus: state.work.focus || null,
                       pending: state.work.pending || [] })); } catch {}
  }
  const workElapsed = (r) => !r ? 0
    : (r.pausedAt || Date.now()) - r.startedAt - (r.pausedMs || 0);
  const workLeft = (r) => !r ? 0 : Math.max(0, r.len * 60000 - workElapsed(r));
  // V6.4. Past its length a session keeps counting up (+m:ss); the chime
  // rings once at the length, and you choose at the end what to log.
  const workClk = (r) => { const over = workElapsed(r) - r.len * 60000; return over >= 0 ? "+" + mmssMs(over) : mmssMs(workLeft(r)); };
  function workOverCheck(r) {
    if (!r || r.pausedAt || r.over || workLeft(r) > 0) return;
    r.over = true; saveWorkLocal(); chime();
    document.querySelectorAll("#workClock, #homeWorkClock, #wfClock").forEach((el) => el.classList.add("over"));
  }
  const hm = (min) => {
    const m = Math.round(Number(min) || 0), h = Math.floor(m / 60), r = m % 60;
    return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`;
  };
  const mmssMs = (ms) => {
    const t = Math.ceil(ms / 1000), m = Math.floor(t / 60), sec = t % 60;
    return `${m}:${pad(sec)}`;
  };

  // "9:38 PM – 10:18 PM": when this session started (or would start) and
  // when it will end, so changing the length shows what it costs.
  function workRange() {
    const w = state.work, r = w.run;
    const t = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const start = r ? r.startedAt : Date.now();
    const end = r ? Date.now() + workLeft(r) : Date.now() + w.len * 60000;
    return `${t(start)} – ${t(end)}`;
  }

  /* What the session is for: what you type, or a recent one. */
  const recentKey = () => "fhd.focusRecent." + (state.meId || "anon");
  const getRecent = () => { try { return JSON.parse(localStorage.getItem(recentKey()) || "[]"); } catch { return []; } };
  function pushRecent(f) {
    if (!f || !f.label) return;
    const list = [f].concat(getRecent().filter((x) => x.label !== f.label)).slice(0, 5);
    try { localStorage.setItem(recentKey(), JSON.stringify(list)); } catch {}
  }
  function dropRecent(label) {
    try { localStorage.setItem(recentKey(), JSON.stringify(getRecent().filter((x) => x.label !== label))); } catch {}
  }
  // V4.6. What you are focusing on, as one tap: your recent activities as
  // chips, alphabetical so they never move under your thumb. Tap one to
  // focus on it (tap again to clear); + adds a new one and lets you
  // remove old ones. Start never stops to ask.
  function focusChips() {
    const w = state.work, r = w.run, cur = r ? r.label : w.focus ? w.focus.label : null;
    const list = getRecent().filter((x) => x && x.label).map((x) => x.label);
    if (cur && !list.includes(cur)) list.push(cur);
    list.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
    if (r) return `<p class="fon">${cur ? `On \u00b7 <b>${esc(cur)}</b>` : "Focusing"}</p>`;
    return `<div class="fchips" role="group" aria-label="What are you focusing on?">
        ${list.map((l) => `<span class="fchip${l === cur ? " on" : ""}"><button type="button" data-fchip="${esc(l)}" aria-pressed="${l === cur}">${esc(l)}</button>${
          w.chipEdit ? `<button type="button" class="fx" data-fchipdel="${esc(l)}" aria-label="Remove ${esc(l)}">&times;</button>` : ""}</span>`).join("")}
        <button type="button" class="fchip fadd${w.chipEdit ? " on" : ""}" id="fChipAdd" aria-expanded="${!!w.chipEdit}" aria-label="Add or remove activities">${w.chipEdit ? "Done" : list.length ? "+" : "+ What are you focusing on?"}</button>
      </div>
      ${w.chipEdit ? `<form class="fnewf" id="fChipForm"><input class="field" id="fChipIn" maxlength="120" autocomplete="off" enterkeyhint="done" placeholder="New activity, e.g. Grant draft" aria-label="New activity">
        <button type="submit" class="btn">Add</button></form>` : ""}`;
  }
  // V4.1. A recent focus opens in place when tapped: Start it, give it
  // minutes you already did (typed, like "45" or "1:20"), or delete it.
  // Nothing is hidden behind a gesture.
  function focusItems() {
    const w = state.work, q = (w.pickQ || "").trim().toLowerCase();
    const hit = (x) => !q || x.label.toLowerCase().includes(q);
    const item = (x) => {
      const open = w.fopen === x.label;
      return `<div class="frow${open ? " open" : ""}">
        <button type="button" class="fitem${w.focus && w.focus.label === x.label ? " on" : ""}"
          data-flabel="${esc(x.label)}" data-ftask="" aria-expanded="${open}">${esc(x.label)}<i aria-hidden="true">${open ? "&#8963;" : "&rsaquo;"}</i></button>
        ${open ? `<div class="fopen">
          <button type="button" class="fstart" data-fstart="${esc(x.label)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>Start</button>
          <span class="fmins"><input class="fminin" id="fMinIn" data-fmin="${esc(x.label)}" inputmode="text" enterkeyhint="done"
            autocomplete="off" placeholder="0" aria-label="Minutes already done on ${esc(x.label)}"><em>min</em>
            <button type="button" class="flog" data-flog="${esc(x.label)}">Add</button></span>
          <button type="button" class="fdel" data-fdel="${esc(x.label)}" aria-label="Delete ${esc(x.label)} from Recent">${SW_ICON.delete}</button>
        </div>${w.fmsg ? `<p class="fmsg${w.fmsgBad ? " bad" : ""}" role="status">${esc(w.fmsg)}</p>` : ""}` : ""}
      </div>`;
    };
    const recent = getRecent().filter((x) => x && x.label).filter(hit);
    const typed = (w.pickQ || "").trim();
    return (typed && !recent.some((x) => x.label.toLowerCase() === typed.toLowerCase())

  // One set of handlers for both pickers (the home sheet and the Focus
  // page): `listId` is where the list lives, `start` begins a session.
  function wireFocusList(listId, start, pickNew) {
    const w = state.work, box = document.getElementById(listId);
    if (!box) return;
    const redraw = () => { box.innerHTML = focusItems(); wireFocusList(listId, start, pickNew); };
    box.querySelectorAll(".frow [data-flabel]").forEach((el) =>
      el.addEventListener("click", () => {
        w.fopen = w.fopen === el.dataset.flabel ? null : el.dataset.flabel; w.fmsg = null;
        redraw();
      }));
    box.querySelectorAll(".fnew[data-flabel]").forEach((el) =>
      el.addEventListener("click", () => (pickNew || start)(el.dataset.flabel)));
    box.querySelectorAll("[data-fstart]").forEach((el) =>
      el.addEventListener("click", () => { w.fopen = null; start(el.dataset.fstart); }));
    box.querySelectorAll("[data-fdel]").forEach((el) =>
      el.addEventListener("click", () => {

      }
      pushRecent({ label, task_id: null });
      w.fmsg = `${hm(mins)} added to ${label}.`; w.fmsgBad = false;
      const m = me();
      if (m) m.work_min = (Number(m.work_min) || 0) + mins;
      redraw();

      if (res && res.error && !OFFLINE_RX.test(res.error)) {

  function focusPicker() {

      <div class="fpick">

  // V3.7. What a focus session is for: what you type, or one you used
  // recently. Nothing is linked: not tasks (V3.6), not goals (V3.7).
  // "80", "1:20", "1h 20m", "1h" and "90m" all mean what they say.
  function parseMinutes(v) {
    const t = String(v || "").trim().toLowerCase();
    if (!t) return null;
    let m = t.match(/^(\d+):(\d{1,2})$/);
    if (m) return Number(m[1]) * 60 + Number(m[2]);
    m = t.match(/^(?:(\d+(?:\.\d+)?)\s*h)?\s*(?:(\d+)\s*m?)?$/);
    if (m && (m[1] || m[2])) return Math.round(Number(m[1] || 0) * 60 + Number(m[2] || 0));
    return null;
  }

  // One set of verbs for the timer, used by the Work page and by the
  // play button on the home dial, so the two can never disagree.
  function workGo() {
    if (!state.work) loadWorkLocal();
    const w = state.work;
    primeAudio();
    w.adjust = false;
    w.run = { id: uuid(), startedAt: Date.now(), pausedAt: null, pausedMs: 0,
              len: w.len, date: todayISO(),

  function workHold() { const r = state.work.run; if (r && !r.pausedAt) { r.pausedAt = Date.now(); saveWorkLocal(); } }
  function workResume() {
    const r = state.work.run;

    primeAudio();

    saveWorkLocal();
  }

  // V5.4. Ending a session early asks, from the page or the full screen.
  function workEndAsk() {
    {
      const w = state.work, r = w.run;
      if (!r) return;
      const mins = Math.floor(workElapsed(r) / 60000);
      if (!r.pausedAt) { r.pausedAt = Date.now(); saveWorkLocal(); stopWorkTick(); }
      const fin = async (m) => {
        w.run = null; saveWorkLocal(); state.workFull = false;
        const res = await logWork(r.id, m, r.startedAt, r.date, r.label, r.task);
        state.msg = res.error ? "Session saved on this phone. It will upload by itself." : `Session logged \u00b7 ${hm(m)}.`;
        state.msgKind = "ok"; render(); };
      const resume = () => { r.pausedMs += Date.now() - r.pausedAt; r.pausedAt = null; saveWorkLocal(); render(); };
      // V6.4. Past the planned length: count the extra minutes, or not.
      if (mins > r.len) return openModal({ title: `You focused ${hm(mins)}`, body: `${hm(mins - r.len)} past your ${hm(r.len)}. Count all of it?`,
        buttons: [
          { label: `Log ${hm(mins)}`, kind: "go", run: () => fin(mins) },
          { label: `Log ${hm(r.len)}, as planned`, kind: "quiet", run: () => fin(r.len) },
          { label: "Keep going", kind: "quiet", run: resume },
        ] });
      // Stopping early is a real decision — half a session is still work —
      // so it asks rather than guessing either way.
      openModal({
        title: "End this session?",
        body: mins >= 1
          ? `You focused for ${hm(mins)} of ${hm(r.len)}.`
          : "Less than a minute in — nothing to log yet.",
        buttons: [
          ...(mins >= 1 ? [{ label: `Log ${hm(mins)}`, kind: "go", run: async () => {
              w.run = null; saveWorkLocal(); state.workFull = false;
              const res = await logWork(r.id, mins, r.startedAt, r.date, r.label, r.task);
              state.msg = res.error ? "Session saved on this phone. It will upload by itself."
                                    : `Session logged · ${hm(mins)}.`;
              state.msgKind = "ok"; render();

          { label: "Discard", kind: "bad", run: () => { w.run = null; saveWorkLocal(); state.workFull = false; render(); } },
          { label: "Keep going", kind: "quiet", run: () => {

  const wfEnd = (r) => new Date(Date.now() + workLeft(r)).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

  // V4.4. The Focus page is the dial: the same one as home, bigger, with

  // V4.7. Focus History folds, and stays as you left it.
  // V5.4. Folded unless you open it: the page is the dial.
  const histShut = () => { try { return localStorage.getItem("fhd.whist") !== "open"; } catch { return true; } };
  function workCard() {
    if (!state.work) loadWorkLocal();
    const w = state.work, r = w.run;
    const m = me() || {};
    const today = entryDay() === todayISO();

    const sessions = w.sessDay === entryDay() ? w.sessions || [] : [];
    const sum = sessions.reduce((a, x) => a + Number(x.minutes || 0), 0);

              <button type="button" class="linkbtn wend" id="workEnd">End</button></span>`}`

      <section class="wpage">
        ${dayNav({ label: today ? "Today" : esc(fullDate(entryDay())), atToday: today, unit: "day", cls: "wnav" })}

          <li><span>${x.label ? esc(x.label) : "Focus"}${x.started_at ? `<small>${(() => { const t = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
              const st = new Date(x.started_at).getTime(); return `${t(st)} \u2013 ${t(st + Number(x.minutes || 0) * 60000)}`; })()}</small>` : `<small>added</small>`}</span>
            <b>${hm(x.minutes)}</b>
            <button type="button" data-wdel="${x.id}" aria-label="Delete this session">&times;</button></li>`).join("")}${extra ? `
          <li><span>Typed earlier<small>older version</small></span><b>${hm(extra)}</b>
            <button type="button" id="workUntyped" aria-label="Delete the typed minutes">&times;</button></li>` : ""}</ul>`
          : ""}
        ${w.adding ? `
          <div class="wadd">
            <input class="field" id="waLabel" maxlength="120" autocomplete="off" list="waRecent" placeholder="What it was for" value="${esc(w.addLabel || "")}" aria-label="What the session was for">

            <span class="wamin"><input class="field" id="waMin" inputmode="text" autocomplete="off" enterkeyhint="done" placeholder="45" value="${esc(w.addMin || "")}" aria-label="Minutes"><em>min</em></span>

  // Finish (or check for a finished) session. Called on a tick, on load,
  // and on every resume, so a session that ran out while the phone was in
  // a pocket is still logged the moment the app is opened again.
  let workTick = null;
  async function checkWork() {
    if (!state.work) loadWorkLocal();
    await flushWork();
    const r = state.work.run;
    // V6.4. Only a session left running three hours past its length ends
    // by itself, logged as planned.
    if (!r || r.pausedAt || workElapsed(r) < r.len * 60000 + 3 * 3600000) return false;
    state.work.run = null; saveWorkLocal();
    const res = await logWork(r.id, r.len, r.startedAt, r.date, r.label, r.task);
    state.msg = res.error ? "Session saved on this phone. It will upload by itself."
                          : `Session logged · ${hm(r.len)}.`;
    state.msgKind = "ok";
    return true;
  }
  // A session is never lost to a dead signal. If the log call fails it is
  // kept on the phone and sent again on the next look; the server treats
  // a repeated id as the same session, so a retry can never count twice.
  const workArgs = (x) => ({ p_code: state.code, p_person: state.meId,
    p_id: x.id, p_minutes: Math.max(1, Math.round(x.minutes)),
    p_date: x.date || null, p_tz: deviceTZ(),
    p_started: x.startedAt ? new Date(x.startedAt).toISOString() : null,
    p_label: x.label || null, p_task: x.task || null });

    const q = (state.work && state.work.pending) || [];
    if (!q.length || !navigator.onLine) return;
    const left = [];
    for (const x of q) {
      const res = await call("app_work_log", workArgs(x));
      if (res.error && OFFLINE_RX.test(res.error)) left.push(x);
    }
    state.work.pending = left; saveWorkLocal();
    // Something landed: the board and the day's list owe you minutes.
    if (left.length < q.length) {
      await loadWorkSessions();
      setTimeout(() => refresh().then(() => render()), 0);
    }
  }
  async function logWork(id, minutes, startedAt, date, label, task) {
    const x = { id, minutes, startedAt, date, label: label || null, task: task || null };
    const res = await call("app_work_log", workArgs(x));
    if (res.error && OFFLINE_RX.test(res.error)) {
      state.work.pending = (state.work.pending || []).filter((y) => y.id !== id).concat([x]);
      saveWorkLocal();
      return res;
    }
    await loadWorkSessions();
    await loadHistory();
    await refresh();
    return res;
  }
  async function loadWorkSessions() {
    if (!state.work) loadWorkLocal();
    const day = state.view === "exercise" && state.seg === "work" ? entryDay() : todayISO();
    const res = await call("app_work_day", { p_code: state.code, p_person: state.meId, p_date: day });
    state.work.sessions = (res && res.sessions) || [];
    state.work.sessDay = day;
  }
  function startWorkTick() {
    stopWorkTick();
    workTick = setInterval(async () => {
      const r = state.work && state.work.run;
      const el = document.getElementById("workClock");
      if (!r || !el || state.seg !== "work") return stopWorkTick();
      el.textContent = workClk(r);
      { const rg = document.getElementById("workRange"); if (rg && !r.pausedAt) rg.textContent = r.over ? `${durWords(r.len)} done \u00b7 still going` : `ends ${workRange().split(" – ")[1] || ""}`; }
      const fill = document.getElementById("workRing");
      if (fill) fill.setAttribute("stroke-dashoffset", (DIAL_C * (1 - workLeft(r) / (r.len * 60000))).toFixed(2));
      workOverCheck(r); if (await checkWork()) { stopWorkTick(); render(); }
    }, 1000);
  }
  function stopWorkTick() { if (workTick) { clearInterval(workTick); workTick = null; } }

  // A short two-note chime. The audio context is made on the Start tap,
  // because a phone only lets a page make sound after a touch.
  let audioCtx = null;
  function primeAudio() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); }
    catch { audioCtx = null; }
    silUnlock(["chimes"]);
  }
  function chime() {
    try {
      if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
      if (bellEls.chimes && bellEls.chimes.dataset.ok) { bell("chimes"); return; }
      if (!audioCtx) return;
      [880, 1318].forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
        const t = audioCtx.currentTime + i * 0.18;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.start(t); o.stop(t + 0.55);
      });
    } catch {}
  }

  function wireWork() {
    if (state.seg !== "work") return;
    if (!state.work) loadWorkLocal();
    const w = state.work;
    if (w.run && !w.run.pausedAt) startWorkTick();

    // Tap the time to change it; tap again to put it away. − and + step
    // by five minutes. Mid-session they move the end, never before now.
    const step = (d) => {
      if (w.run) {
        const floor = Math.ceil(workElapsed(w.run) / 60000) + 1;
        w.run.len = Math.max(floor, Math.min(WORK_MAX, w.run.len + d)); if (workLeft(w.run) > 0) w.run.over = false;
      } else w.len = Math.max(WORK_MIN, Math.min(WORK_MAX, w.len + d));
      saveWorkLocal(); render();
    };
    on("workMinus", "click", () => step(-WORK_STEP));
    on("workPlus", "click", () => step(WORK_STEP));

    // V4.6. The chips.
    document.querySelectorAll("[data-fchip]").forEach((el) =>
      el.addEventListener("click", () => {
        const l = el.dataset.fchip;
        w.focus = w.focus && w.focus.label === l ? null : { label: l, task_id: null };
        saveWorkLocal(); render();
      }));
    document.querySelectorAll("[data-fchipdel]").forEach((el) =>
      el.addEventListener("click", () => {
        dropRecent(el.dataset.fchipdel);
        if (w.focus && w.focus.label === el.dataset.fchipdel) { w.focus = null; saveWorkLocal(); }
        render();
      }));
    on("fChipAdd", "click", () => { w.chipEdit = !w.chipEdit; render(); if (w.chipEdit) document.getElementById("fChipIn")?.focus(); });
    on("fChipForm", "submit", (e) => {
      e.preventDefault();
      const v = (document.getElementById("fChipIn")?.value || "").trim().slice(0, 120);
      if (!v) return;
      w.focus = { label: v, task_id: null }; pushRecent(w.focus); w.chipEdit = false;
      saveWorkLocal(); render();
    });
    // V4.2. Start asks what the session is for first; picking starts it.
    const choose = (f) => { w.focus = f; w.pick = false; w.fopen = null; w.fmsg = null; saveWorkLocal();
      if (w.startAfter && !w.run) { w.startAfter = false; workGo(); }
      render(); };
    // V4.1. Start from the list starts the session, as it does on the dial.
    const startWith = (label) => {
      w.focus = { label: label.slice(0, 120), task_id: null }; w.pick = false; w.fopen = null; w.fmsg = null;
      saveWorkLocal();
      if (!w.run) workGo();
      render();
    };
    const pickNew = (label) => choose({ label: label.slice(0, 120), task_id: null });
    wireFocusList("fList", startWith, pickNew);
    on("fSearch", "input", (e) => {
      w.pickQ = e.target.value; w.fopen = null;
      const l = document.getElementById("fList");
      if (l) { l.innerHTML = focusItems(); wireFocusList("fList", startWith, pickNew); }
    });
    on("fSearch", "keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const first = document.querySelector("#fList [data-flabel]");
      const typed = (w.pickQ || "").trim();
      if (typed) choose({ label: typed.slice(0, 120), task_id: null });
      else if (first) choose({ label: first.dataset.flabel, task_id: null });
    });
    on("fNone", "click", () => choose(null));
    on("fClose", "click", () => { w.pick = false; w.startAfter = false; render(); });

    // V5.7. Every session says what it is for: Start asks first.
    on("workStart", "click", () => { w.chipEdit = false; w.pickQ = ""; state.homeSheet = "focus"; render(); document.getElementById("hfIn")?.focus(); });
    on("workMax", "click", () => { state.workFull = true; render(); });
    on("whFold", "click", () => { try { localStorage.setItem("fhd.whist", histShut() ? "open" : "shut"); } catch {} render(); });
    on("workPause", "click", () => { workHold(); stopWorkTick(); render(); });
    on("workContinue", "click", () => { workResume(); render(); });
    on("workEnd", "click", () => workEndAsk());
    // A session done without the timer: what it was for, and minutes.
    on("waOpen", "click", () => { w.adding = true; w.addErr = null; render(); document.getElementById("waLabel")?.focus(); });
    on("waCancel", "click", () => { w.adding = false; w.addLabel = ""; w.addMin = ""; w.addErr = null; render(); });
    on("waLabel", "input", (e) => { w.addLabel = e.target.value; });
    on("waMin", "input", (e) => { w.addMin = e.target.value; });
    const addSession = async () => {
      const mins = parseMinutes(w.addMin || "");
      if (!mins || mins < 1 || mins > 600) { w.addErr = "Type the minutes, like 45 or 1:20."; render(); document.getElementById("waMin")?.focus(); return; }
      const label = (w.addLabel || "").trim().slice(0, 120);
      if (label) pushRecent({ label, task_id: null });
      w.adding = false; w.addLabel = ""; w.addMin = ""; w.addErr = null;
      const res = await logWork(uuid(), mins, null, entryDay(), label || null, null);
      const bad = res && res.error && !OFFLINE_RX.test(res.error);
      state.msg = bad ? res.error : `Added ${hm(mins)}${label ? ` · ${label}` : ""}.`;
      state.msgKind = bad ? "bad" : "ok";
      render();
    };
    on("waSave", "click", addSession);
    on("waMin", "keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addSession(); } });
    on("waLabel", "keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("waMin")?.focus(); } });
    on("workUntyped", "click", async () => {
      await call("app_unlog", { p_code: state.code, p_person: state.meId, p_metric: "work_min", p_date: entryDay() });
      await loadWorkSessions(); await loadHistory(); await refresh();
    });
    document.querySelectorAll("[data-wdel]").forEach((el) =>
      el.addEventListener("click", async () => {
        await call("app_work_delete", { p_code: state.code, p_person: state.meId,
          p_id: el.dataset.wdel });
        await loadWorkSessions(); await loadHistory(); await refresh();
      }));
  }

  /* ---------- render + events -------------------------------------- */
  /* ---------- V5.1: Meditation ------------------------------------------
     The first row on the dashboard, three habits:
       Attention   your ideal day, as points (V5.2): 4 a block (done,
                   in full, on time, the + for quality) and 2 a day
                   read from Sleep (Rise, Rest).
       Reflection  good things and why, lessons, one change; each person
                   keeps as many lines as they like. Private: the tribe
                   sees only that you wrote.
       Silence     a calm timer with bells; sessions you name (Prayer…)
                   count too.
     The day's detail lives in med_days; its four numbers are written to
     entries by the server, so dials, the board and votes read them like
     any other habit.
     ------------------------------------------------------------------ */
  const MED_KEYS = ["attn", "refl", "silence"];
  const MED_INFO = {
    attn:    { h: "Attention",  sub: "Your ideal day, kept on time." },
    refl:    { h: "Reflection", sub: "Gratitude, one lesson, one change. Two minutes." },
    silence: { h: "Silence",    sub: "Sit in stillness. The bells keep the time." },
  };
  const I_LOCK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7.5a5 5 0 0 1 10 0V10h1.2c.7 0 1.3.6 1.3 1.3v8.4c0 .7-.6 1.3-1.3 1.3H5.8c-.7 0-1.3-.6-1.3-1.3v-8.4c0-.7.6-1.3 1.3-1.3zm2.2 0h5.6V7.5a2.8 2.8 0 0 0-5.6 0z"/></svg>`;
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

  async function openMed(seg) {
    if (!state.meId) return;
    stopTicking();
    state.seg = MED_KEYS.includes(seg) ? seg : "attn";
    state.view = "med";
    state.entryDate = null;
    state.medEdit = null; state.medMsg = null; state.medAdd = null; state.medSaved = null; state.medAmt = null;
    state.silSub = null; state.silPick = null; state.silNew = false; state.silSettings = false;
    render();
    window.scrollTo(0, 0);
    await flushSilPending();
    await loadMed(); render();
  }
  async function loadMed() {
    const iso = entryDay();
    const res = await callRetry("app_med", { p_code: state.code, p_person: state.meId,
      p_date: iso === todayISO() ? null : iso });
    if (!res || res.error) {
      state.medMsg = res && res.offline ? "No signal. Showing what was last loaded." : (res && res.error) || null;
      return;
    }
    state.med = { date: res.date, today: res.today, schedule: res.schedule || [], day: res.day || {},
                  sleep: res.sleep || {}, rows: Object.assign({ g: 1, l: 1, c: 1 }, res.refl_rows || {}),
                  order: res.attn_order || {} };
  }
  const medReady = () => !!state.med && state.med.date === (entryDay() === todayISO() ? state.med.today : entryDay());

  // One save path for the day: marks, journal, prayers. Quick taps and
  // typing are gathered, then sent once.
  let medTimer = null;
  function medSave(patch, delay = 0) {
    state.medPending = Object.assign(state.medPending || {}, patch);
    clearTimeout(medTimer);
    medTimer = setTimeout(medFlush, delay);
  }
  async function medFlush() {
    const p = state.medPending; state.medPending = null;
    if (!p || !state.med) return;
    const res = await call("app_med_save", { p_code: state.code, p_person: state.meId,
      p_date: state.med.date, p_marks: p.marks || null, p_journal: p.journal || null,
      p_prayers: p.prayers === undefined ? null : p.prayers });
    const s = document.getElementById("mSaved");
    if (res.error) {
      state.medMsg = res.offline ? "No signal. Not saved yet." : res.error;
      if (s) { s.textContent = state.medMsg; s.className = "msaved bad"; }
      return;
    }
    state.medMsg = null;
    if (p.journal) state.medSaved = "Saved";
    if (s && p.journal) { s.textContent = "Saved"; s.className = "msaved ok"; }
    await refresh();
    if (state.view === "med" && !document.activeElement?.closest?.(".mjournal")) render();
  }

  function attnScore() {
    const sched = (state.med && state.med.schedule) || [];
    const day = (state.med && state.med.day) || {};
    const n = day.n || sched.length, marks = day.marks || {};
    // V5.2. Four points a block: done, in full, on time, with quality.
    // Two for the day, from Sleep: up by Rise, in bed by Rest.
    let d = 0, l = 0, h = 0, pts = 0;
    for (const k in marks) {
      const x = marks[k]; if (x.s !== "d" && x.s !== "l") continue;
      if (x.s === "d") d++; else l++;
      if (x.h) h++;
      pts += blockPts(x);
    }
    const sl = attnSleep(), sp = (sl.rise.ok ? 1 : 0) + (sl.rest.ok ? 1 : 0);
    const max = 4 * n + 2;
    return { n, d, l, h, sl, pts: pts + sp, max,
             pct: n && (d + l || sp) ? Math.min(100, Math.round(100 * (pts + sp) / max)) : null };
  }
  const bySched = (a, b) => (a.t ?? 9999) - (b.t ?? 9999);
  // V5.5. Attention's two columns, top down, each its own list. Your saved
  // arrangement first; anything new joins the shorter column; Rise starts
  // on the left and Rest ends on the right until you move them.
  function attnCols(sched) {
    const O = (state.med && state.med.order) || {}, ids = ["rise"].concat(sched.map((b) => b.id), ["rest"]);
    const have = new Set(ids), used = new Set();
    const take = (a) => (Array.isArray(a) ? a : []).filter((id) => have.has(id) && !used.has(id) && used.add(id));
    let L = take(O.L), R = take(O.R);
    if (!L.length && !R.length) {
      const blocks = sched.map((b) => b.id), half = Math.ceil((blocks.length + 2) / 2);
      const all = ["rise"].concat(blocks, ["rest"]);
      return { L: all.slice(0, half), R: all.slice(half) };
    }
    for (const id of ids) if (!used.has(id)) { (L.length <= R.length ? L : R).push(id); used.add(id); }
    return { L, R };
  }
  const blockPts = (x) => !x || (x.s !== "d" && x.s !== "l") ? 0
    : 1 + (x.h ? 0 : 1) + (x.s === "d" ? 1 : 0) + (x.p ? 1 : 0);
  // Rise and Rest for the Attention day, read from Sleep.
  function attnSleep() {
    const z = (state.med && state.med.sleep) || {};
    const one = (v, t) => { const has = v !== null && v !== undefined;
      return { v: has ? Number(v) : null, t: Number(t), ok: has && Number(v) <= Number(t) }; };
    return { rise: one(z.rise, z.rise_t ?? 360), rest: one(z.rest, z.rest_t ?? 1350) };
  }

  function medHead(k) {
    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
      </div>
      <header class="masthead">
        <p class="eyebrow mgroup">Meditation</p>
        <h1>${MED_INFO[k].h}</h1>
        <p class="sub">${MED_INFO[k].sub}</p>

  }
  function medNav(unit) {
    const iso = entryDay(), isToday = iso === todayISO();
    return dayNav({ ids: ["mPrev", "mNext", "mToday"], label: isToday ? "Today" : esc(fullDate(iso)),
                    atToday: isToday, unit });

  function medView() {
    const k = state.seg;
    if (k === "silence" && silRun() && medReady()) return silView();
    const body = !medReady() && !state.medMsg ? `<section class="card"><p class="hint" style="text-align:center">Loading…</p></section>`
      : k === "attn" ? attnView() : k === "refl" ? reflView() : silView();

  /* ---- Attention ---- */
  const MED_EXAMPLE = [
    { a: "Meditate and pray", d: 20, t: 5 * 60 },
    { a: "Exercise", d: 45, t: 6 * 60 + 30 },
    { a: "Deep work: the ONE thing", d: 90, t: 9 * 60 },
    { a: "Walk outside", d: 20, t: 13 * 60 },
    { a: "Family time, phone away", d: 60, t: 19 * 60 + 30 },
    { a: "Read", d: 20, t: 21 * 60 + 30 },
  ];
  // A block's length. Not done: plain text. Done: a button; tap to type
  // what you actually did. Short shows "1h of 2h" in gold.
  function amtHtml(b, mk) {
    if (!mk) return hm(b.d);
    if (state.medAmt === b.id) return `<input class="field mamtin" id="mAmtIn" data-mamtin="${esc(b.id)}" inputmode="text"
      autocomplete="off" enterkeyhint="done" maxlength="8" placeholder="${hm(b.d)}" value="${mk.h ? hm(mk.m) : ""}"
      aria-label="How long you did ${esc(b.a)}, planned ${hm(b.d)}">`;
    return mk.h
      ? `<button type="button" class="mamt short" data-mamt="${esc(b.id)}" aria-label="Did ${hm(mk.m)} of ${hm(b.d)}. Tap to change">${hm(mk.m)} of ${hm(b.d)}</button>`
      : `<button type="button" class="mamt" data-mamt="${esc(b.id)}" aria-label="Planned ${hm(b.d)}. Tap if you did less">${hm(b.d)}</button>`;
  }
  function attnView() {
    const m = me() || {};
    // V5.4. Your order, not the clock's: blocks sit where you put them.
    const sched = (state.med.schedule || []).slice();
    if (state.medEdit) return schedEditor();
    if (!sched.length) return `
      <section class="card mempty">
        ${medNav("day")}
        <h2>Plan your ideal day</h2>
        <p>List the blocks of a great day: what you will do, for how long, and the time it should be done by.
          Your Attention score is the share of it you keep, on time.</p>
        <div class="mbtnrow">
          <button type="button" class="btn" id="mPlan">Plan my day</button>
          <button type="button" class="btn-quiet" id="mExample">Start from an example</button>
        </div>
      </section>`;
    const S = attnScore(), std = stdOf(m, "attn"), marks = (state.med.day || {}).marks || {};
    const isToday = entryDay() === todayISO(), now = nowMin();
    // V5.3. Two columns split at noon. Each block is a compact tile with
    // three toggles that light up: done, on time, done well. Rise opens
    // the morning and Rest closes the evening; both come from Sleep.
    const I_CLK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm-1 2v5.4l4.2 2.5 1-1.7-3.2-1.9V7z"/></svg>`;
    const sleepTile = (k) => { const x = S.sl[k], lab = k === "rise" ? "Rise" : "Rest";
      return `<li class="mtile msleep${x.ok ? " is-d" : ""}" data-bid="${k}">
          <div class="mth"><b>${lab}</b><span class="mpts">${x.ok ? 1 : 0}/1</span>
            <span class="mgrip" data-mgrip="1" aria-hidden="true" title="Drag to move">\u2807</span></div>
          <small>${k === "rise" ? "up" : "in bed"} by ${clockWords(x.t % 1440)}</small>
          <div class="mtg"><button type="button" class="mtog${x.ok ? " on" : ""}" data-go="${k}" aria-label="${lab}${x.v === null ? ", not logged. Log it in Recovery" : x.ok ? ", on time" : ", late"}">${x.v === null ? "Log" : x.ok ? "✓ " + clockWords(x.v % 1440) : clockWords(x.v % 1440)}</button></div>
        </li>`; };
    const tile = (b) => {
      const mk = marks[b.id], over = isToday && !mk && b.t !== null && b.t !== undefined && now > b.t;
      const on = mk && mk.s === "d";
      return `<li class="mtile${mk ? " is-done" : ""}${over ? " over" : ""}" data-bid="${esc(b.id)}">
          <div class="mth"><b>${esc(b.a)}</b><span class="mpts">${blockPts(mk)}/4</span>
            <span class="mgrip" data-mgrip="1" aria-hidden="true" title="Drag to move">⠇</span></div>
          <small>${b.t !== null && b.t !== undefined ? `by ${clockWords(b.t)}` : "any time"}${b.d ? ` · ${amtHtml(b, mk)}` : ""}</small>
          <div class="mtg">
            <button type="button" class="mtog${mk ? " on" : ""}" data-mchk="${esc(b.id)}" aria-pressed="${!!mk}" aria-label="${esc(b.a)}: ${mk ? "done. Tap to undo" : "mark done"}">✓</button>
            <button type="button" class="mtog${on ? " on" : ""}" data-mst="${esc(b.id)}" aria-pressed="${!!on}" aria-label="${esc(b.a)}: ${on ? "on time. Tap for late" : "mark on time"}">${I_CLK}</button>
            <button type="button" class="mtog${mk && mk.p ? " on" : ""}" data-mplus="${esc(b.id)}" aria-pressed="${!!(mk && mk.p)}" aria-label="${esc(b.a)}: done well">+</button>
          </div>
        </li>`;
    };
    return `
      <section class="card mattn">
        ${medNav("day")}
        <div class="dial mdial">${dialRing(stdPct("attn", S.pct, std))}
          <div class="dcore"><b class="dval">${S.pct === null ? "–" : S.pct + "%"}</b>
            <button type="button" class="dof" data-edit="goal" data-metric="attn">of ${Math.round(std)}%</button>
            <span class="dsub">${S.pts} of ${S.max} points</span>
            ${state.attnUndo === state.med.date ? `<span class="dsub">Copied \u00b7 <button type="button" class="linkbtn" id="mSameUndo">Undo</button></span>`
              : sched.some((b) => !marks[b.id]) ? `<button type="button" class="dsame msame" id="mSame">${Object.keys(marks).length ? "Rest like yesterday" : "Same as yesterday"}</button>` : ""}</div></div>
      </section>
      <section class="card">
        ${(() => { const C = attnCols(sched), byId = new Map(sched.map((b) => [b.id, b]));
          const one = (id) => id === "rise" || id === "rest" ? sleepTile(id) : byId.has(id) ? tile(byId.get(id)) : "";
          return `<div class="mgrid" id="mGrid"><ul class="mcol" data-col="L">${C.L.map(one).join("")}</ul><ul class="mcol" data-col="R">${C.R.map(one).join("")}</ul></div>`; })()}
        <p class="hint mhint">✓ done · <span class="mhclk">${I_CLK}</span> on time · <b>+</b> done well · in full: 1 point each. Did less? Tap the length. Hold a block to move it.</p>
        <button type="button" class="linkbtn" id="mEditDay">Edit my ideal day</button>
      </section>`;
  }
  function schedEditor() {
    const D = state.medEdit;
    const row = (b, i) => `
      <li class="medrow">
        <input class="field mea" data-mea="${i}" id="mea-${i}" maxlength="80" value="${esc(b.a)}" placeholder="Activity" aria-label="Activity">

            ${b.t === null || b.t === undefined ? "" : `<button type="button" class="linkbtn metx" data-metx="${i}" aria-label="No deadline">clear</button>`}</span>
          <button type="button" class="tx" data-mex="${i}" aria-label="Remove ${esc(b.a || "this block")}">&times;</button>
        </span>

    return `

        ${D.err ? `<p class="hint bad">${esc(D.err)}</p>` : ""}
        <div class="stdbtns">
          <button type="button" class="btn-quiet" id="mEdCancel">Cancel</button>
          <button type="button" class="btn" id="mEdSave">Save</button>

  /* ---- Reflection ----
     V5.2. Three kinds of line, each person keeping as many as they like:

  /* ---- Silence: the timer and the bells ---- */
  // V6.4. Three bells, all tuned: a deep bowl, a temple bell, a rising chime.
  const BELLS = { none: "None", bowl: "Singing bowl", temple: "Temple bell", chimes: "Soft chimes" };
  // Bells named before V6.4 map to the nearest new one.
  const bellKey = (k) => ({ wood: "temple", bells: "chimes", chime: "chimes" }[k] || (BELLS[k] ? k : "bowl"));

  // A bell for a sitting: silent when that sitting is muted.
  const rbell = (r, kind) => { if (!r || !r.muted) bell(kind); };
  const WARM = { 0: "None", 10: "10 seconds", 30: "30 seconds", 60: "1 minute" };
  const silKey = () => "fhd.sil." + (state.meId || "anon");
  const silRunKey = () => "fhd.silrun." + (state.meId || "anon");
  const silPendKey = () => "fhd.silpend." + (state.meId || "anon");
  // V5.2. Session types: Silence, plus any you name (Prayer, Breathwork…).
  // Each keeps its own length, bells and warm-up, on this phone.
  const SIL_DEF = { dur: 20, start: "temple", end: "bowl", int: "chimes", every: 5, warm: 0 };
  function silStore() {
    let x = null;
    try { x = JSON.parse(localStorage.getItem(silKey()) || "null"); } catch {}
    if (x && x.dur !== undefined && !x.cfgs) x = { cur: "silence", types: [], cfgs: { silence: x } };  // V5.1 shape
    x = Object.assign({ cur: "silence", types: [], cfgs: {} }, x || {});
    x.types = (Array.isArray(x.types) ? x.types : []).filter((t) => t && t.id && t.name).slice(0, 5);
    if (x.cur !== "silence" && !x.types.some((t) => t.id === x.cur)) x.cur = "silence";
    return x;
  }
  const silPut = (x) => { try { localStorage.setItem(silKey(), JSON.stringify(x)); } catch {} };
  const silTypes = () => [{ id: "silence", name: "Silence" }].concat(silStore().types);
  // V5.5. One kind of sitting: Silence. (Kinds named in V5.2–5.4 stay in old sittings' labels.)
  const silCur = () => silTypes()[0];
  function silCfg() {
    const x = silStore();
    const c = Object.assign({}, SIL_DEF, x.cfgs.silence || {});
    for (const k of ["start", "end", "int"]) c[k] = c[k] === "none" ? "none" : bellKey(c[k]);

  /* V6.4. Bells that ring with the screen locked.
     A phone stops a web page's timers and its sound engine when the screen
     locks, which is why bells came and went. Music players keep going
     because they play through an audio element, so the bells do too:
       * each bell is made once, as a short sound file, in the phone itself;
       * Begin (a tap) plays a silent track on a loop, which keeps the page

  const SR = 44100;

    bowl:   { strikes: [[0, 196]], parts: [[1, 0.55, 9], [1.004, 0.25, 9], [2.76, 0.22, 6], [5.4, 0.1, 4], [8.93, 0.04, 2.6]], attack: 0.03 },
    temple: { strikes: [[0, 392]], parts: [[0.5, 0.28, 6.5], [1, 0.5, 5], [1.19, 0.16, 4], [1.5, 0.14, 3.6], [2, 0.16, 3], [2.74, 0.07, 2]], attack: 0.004 },
    chimes: { strikes: [[0, 1046.5], [0.32, 1318.5], [0.64, 1568]], parts: [[1, 0.3, 2.8], [2, 0.07, 1.4], [3, 0.03, 0.8]], attack: 0.003 },

  const I_HOUR = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v2h-1v3.2a4 4 0 0 1-1.6 3.2L13.2 12l2.2 1.6A4 4 0 0 1 17 16.8V20h1v2H6v-2h1v-3.2a4 4 0 0 1 1.6-3.2l2.2-1.6-2.2-1.6A4 4 0 0 1 7 7.2V4H6zm3 2v3.2c0 .6.3 1.2.8 1.6L12 10.6l2.2-1.8c.5-.4.8-1 .8-1.6V4zm3 9.4-2.2 1.8c-.5.4-.8 1-.8 1.6V20h6v-3.2c0-.6-.3-1.2-.8-1.6z"/></svg>`;

  // V5.2. The running sitting fills the screen: its name, a thin ring, a

  /* ---------- V6.4: the way home ---------------------------------------

  const HOME_VIEWS = new Set(["sleep", "tasks", "goals", "diet", "med", "custom", "exercise"]);

  function homeBar(v) {

  /* ---------- V3.4: choosing the home dials ---------------------------

  // V4.2. Only what the dashboard shows can be a dial (not Calories, which

  const DIAL_KEYS = STD_GROUPS.flatMap(([, ks]) => ks);

  // V5.5. As few or as many as you want; one, Steps, to start.
  const DIAL_MAX = DIAL_KEYS.length;
  const okDials = (d) => Array.isArray(d) && d.length >= 1 && d.length <= DIAL_MAX + 30 &&
    new Set(d).size === d.length && d.every(knownKey);
  // A habit that was removed drops out; the rest stay.
  const fixDials = (d) => Array.isArray(d)
    ? d.map((k) => (k === "protein" || k === "kcal" ? "macros" : k)).filter((k, i, a) => a.indexOf(k) === i && knownKey(k)) : d;
  function myDials() {
    const m = me();
    if (m && okDials(fixDials(m.dials))) return fixDials(m.dials);
    try {
      const d = fixDials(JSON.parse(localStorage.getItem("fhd.dials." + state.meId) || "null"));
      if (okDials(d)) return d;
    } catch {}
    return DIAL_DEFAULT.slice();
  }
  // V5.7. Your habits, and which of them are dials. Pins live beside the
  // habits; no pins saved yet means every habit is a dial (how V5.6 worked).
  function pinsRaw() {
    const m = me();
    if (m && Array.isArray(m.pins)) return m.pins;
    try { const p = JSON.parse(localStorage.getItem("fhd.pins." + state.meId) || "null"); if (Array.isArray(p)) return p; } catch {}
    return null;
  }
  function myPins() {
    const h = myDials(), p = pinsRaw();
    if (!p) return h;
    const q = p.filter((k) => h.includes(k));
    return q.length ? q : [h[0]];
  }
  const I_PIN = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 9V4h1a1 1 0 0 0 0-2H7a1 1 0 0 0 0 2h1v5a3 3 0 0 1-3 3v2h6v7l1 1 1-1v-7h6v-2a3 3 0 0 1-3-3z"/></svg>`;
  // V6.1. Make (or change) a habit of your own: a name, one of three
  // shapes, a unit and daily standard where they apply, and who it is for.
  function habitForm() {
    const E = state.habEdit;
    const seg = (f, opts) => `<div class="range hseg" role="group">${opts.map(([v, t]) =>
      `<button type="button" data-hf="${f}:${v}" aria-pressed="${String(E[f]) === String(v)}">${t}</button>`).join("")}</div>`;
    return `
      <div class="sheetbg" id="habBg"></div>
      <div class="stdsheet dpick hform" role="dialog" aria-label="${E.id ? "Change habit" : "New habit"}">
        <p class="eyebrow">${E.id ? "Change habit" : "New habit"}</p>
        <input class="field" id="hfName" maxlength="40" autocomplete="off" enterkeyhint="done" placeholder="e.g. Family dinner, Read, Water" value="${esc(E.name || "")}" aria-label="Name">
        <p class="tlab">Measured as</p>
        ${seg("kind", [["done", "Done \u2713"], ["number", "A number"], ["min", "Minutes"]])}
        ${E.kind === "done" ? "" : `<div class="hfrow">
          <label><span class="tlab">Daily standard</span><input class="field" id="hfStd" inputmode="decimal" autocomplete="off" placeholder="${E.kind === "min" ? "20" : "8"}" value="${esc(E.std == null ? "" : String(E.std))}" aria-label="Daily standard"></label>
          ${E.kind === "number" ? `<label><span class="tlab">Unit</span><input class="field" id="hfUnit" maxlength="16" autocomplete="off" placeholder="glasses" value="${esc(E.unit || "")}" aria-label="Unit"></label>` : `<span class="hfmin">minutes</span>`}</div>`}
        <p class="tlab">For</p>
        ${seg("tribe", [["false", "Just me"], ["true", "The whole tribe"]])}
        <p class="hint">${E.tribe ? "Everyone in the tribe can turn it on, and it gets a column in your tribe table." : "Private: only you see it."}</p>
        ${E.err ? `<p class="hint bad">${esc(E.err)}</p>` : ""}
        <div class="stdbtns">${E.id ? `<button type="button" class="btn-quiet bad" id="hfDel">Remove</button>` : `<button type="button" class="btn-quiet" id="hfCancel">Cancel</button>`}
          <button type="button" class="btn" id="hfSave">${E.id ? "Save" : "Add"}</button></div>
      </div>`;
  }
  function dialSheet() {
    if (state.habEdit) return habitForm();
    if (!state.dialPick) return "";
    const h = myDials(), p = myPins();
    return `
      <div class="sheetbg" id="dialBg"></div>
      <div class="stdsheet dpick" role="dialog" aria-label="Your habits">
        <p class="eyebrow">Your habits</p>
        <h3>What you are working on</h3>
        <p class="hint" style="margin-top:4px">Tap a habit to turn it on or off. <b>Pin</b> it to make it a dial on home. Turning one off only hides it: everything you logged stays.</p>
        ${habitGroups().map(([g, ks]) => `
          <p class="dpg">${esc(g)}</p>
          <div class="dpgrid">${ks.map((k) => {
            const on = h.includes(k), pin = on && p.includes(k);
            return `<div class="dpk${on ? " on" : ""}${pin ? " pin" : ""}">
              <button type="button" class="dpkb${on ? " on" : ""}" data-dpk="${k}" aria-pressed="${on}">${esc(STD[k].label)}${STD[k].custom && STD[k].tribe ? `<small class="dptr">tribe</small>` : ""}</button>
              <button type="button" class="dpin" data-dpin="${k}" aria-pressed="${pin}" aria-label="${pin ? "Unpin" : "Pin"} ${esc(STD[k].label)} as a dial on home">${I_PIN}</button></div>`;
          }).join("")}</div>`).join("")}
        <button type="button" class="habnew" id="habNew">+ New habit</button>
        ${state.dialMsg ? `<p class="hint bad" id="dialMsg">${esc(state.dialMsg)}</p>` : ""}
        <div class="stdbtns"><button type="button" class="btn" id="dialDone">Done</button></div>
      </div>`;
  }
  // Every tap saves: habits in the order you turned them on, pins in that order too.
  async function saveHabits(h, p) {
    const m = me();
    p = p.filter((k, i) => h.includes(k) && p.indexOf(k) === i);   // V6.2. In the order you pinned them.
    if (m) { m.dials = h.slice(); m.pins = p.slice(); }
    try { localStorage.setItem("fhd.dials." + state.meId, JSON.stringify(h)); localStorage.setItem("fhd.pins." + state.meId, JSON.stringify(p)); } catch {}
    state.dialMsg = null;
    render();
    await call("app_set_habits", { p_code: state.code, p_person: state.meId, p_habits: h, p_pins: p });
  }
  function tapHabit(k) {
    const h = myDials().slice(), p = myPins().slice();
    if (h.includes(k)) {
      if (h.length === 1) { state.dialMsg = "Keep at least one habit."; render(); return; }
      h.splice(h.indexOf(k), 1);
      if (p.includes(k)) p.splice(p.indexOf(k), 1);
      if (!p.length) p.push(h[0]);
    } else h.push(k);
    saveHabits(h, p);
  }
  function tapPin(k) {
    const h = myDials().slice(), p = myPins().slice();
    if (!h.includes(k)) { h.push(k); p.push(k); }
    else if (p.includes(k)) {
      if (p.length === 1) { state.dialMsg = "Keep at least one dial on home."; render(); return; }
      p.splice(p.indexOf(k), 1);
    } else p.push(k);
    saveHabits(h, p);
  }

  // Every "of …" and every standard line, on every page, opens the sheet.
  function wireStd() {
    document.querySelectorAll('[data-edit="goal"]').forEach((el) =>
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const k = el.dataset.metric || "steps";
        if (!STD[k]) return;
        state.editMetric = k;
        openEditor("goal");
      }));
    on("stdCancel", "click", () => { state.editing = null; state.editDraft = null; render(); });
    on("stdBg", "click", () => { state.editing = null; state.editDraft = null; render(); });
    on("stdSave", "click", saveStd);
    on("stdVal", "input", (e) => { state.editDraft = e.target.value; });
    // V5.4. A time standard opens the same wheel as Rest and Rise.
    on("stdVal", "click", (e) => {
      const f = e.target; if (!f.dataset.stdwheel) return;
      const [hh, mm] = String(f.value || "").split(":").map(Number);
      timeWheel(STD[state.editMetric].label + " standard", (hh || 0) * 60 + (mm || 0), (v) => {
        f.value = `${pad(Math.floor(v / 60))}:${pad(v % 60)}`; state.editDraft = f.value; });
    });
    on("stdVal", "keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); saveStd(); }
      if (e.key === "Escape") { state.editing = null; state.editDraft = null; render(); }
    });

    on("dialEdit", "click", () => { state.dialPick = true; state.dialMsg = null; render(); });
    const close = () => { state.dialPick = null; state.dialMsg = null; render(); };
    on("dialDone", "click", close);
    on("dialBg", "click", close);
    document.querySelectorAll("[data-dpk]").forEach((el) => el.addEventListener("click", () => tapHabit(el.dataset.dpk)));
    // V6.1. A habit of your own.
    on("habNew", "click", () => { state.habEdit = { name: "", kind: "done", unit: "", std: null, tribe: false }; render(); document.getElementById("hfName")?.focus(); });
    const grab = () => { const E = state.habEdit; if (!E) return;
      const n = document.getElementById("hfName"), st = document.getElementById("hfStd"), u = document.getElementById("hfUnit");
      if (n) E.name = n.value; if (st) E.std = st.value; if (u) E.unit = u.value; };
    document.querySelectorAll("[data-hf]").forEach((el) => el.addEventListener("click", () => {
      grab(); const [f, v] = el.dataset.hf.split(":"); state.habEdit[f] = f === "tribe" ? v === "true" : v; render(); }));
    const shut = () => { const back = state.habEdit && state.habEdit.back; state.habEdit = null; if (back) state.dialPick = null; render(); };
    on("hfCancel", "click", shut);
    on("habBg", "click", shut);
    on("hfSave", "click", async () => {
      grab(); const E = state.habEdit;
      const std = E.kind === "done" ? 1 : E.kind === "min" ? parseMinutes(String(E.std || "")) : parseFloat(String(E.std || "").replace(",", "."));
      if (!String(E.name || "").trim()) { E.err = "Give it a name."; render(); return; }
      if (E.kind !== "done" && !(std > 0)) { E.err = "Set a daily standard above 0."; render(); return; }
      const res = await call("app_habit_save", { p_code: state.code, p_person: state.meId,
        p_habit: { id: E.id || null, name: E.name.trim(), kind: E.kind, unit: E.unit || "", std, tribe: !!E.tribe } });
      if (res.error) { E.err = res.offline ? "No signal. Not saved yet." : res.error; render(); return; }
      const fresh = !E.id, back = E.back;
      state.habEdit = null; if (back) state.dialPick = null;
      await loadHabits();
      // A new habit is turned on for you (not pinned: pin it if you want a dial).
      if (fresh && res.id) { const h = myDials().slice(); h.push("c:" + res.id); await saveHabits(h, myPins()); }
      else render();
    });
    on("hfDel", "click", () => {
      const E = state.habEdit;
      openModal({ title: `Remove ${E.name}?`, body: "It leaves everyone's lists. What was logged is kept.",
        buttons: [{ label: "Remove", kind: "bad", run: async () => {
          await call("app_habit_delete", { p_code: state.code, p_person: state.meId, p_id: E.id });
          state.habEdit = null; state.dialPick = null;
          if (state.view === "custom") { state.view = "board"; }
          await loadHabits(); await saveHabits(myDials().filter((k) => k !== "c:" + E.id), myPins().filter((k) => k !== "c:" + E.id));
          refresh(); } }, { label: "Cancel", kind: "quiet" }] });
    });
    document.querySelectorAll("[data-dpin]").forEach((el) => el.addEventListener("click", () => tapPin(el.dataset.dpin)));
  }

  function wireNet() {
    on("netRetry", "click", () => { retryIn = 0; setNet("ok"); render(); refresh(); });
    on("undoStamp", "click", async () => {
      const u = state.undo;
      if (!u) return;
      disarmUndo();
      await call("app_unlog", { p_code: state.code, p_person: state.meId,
                                p_metric: u.key, p_date: u.date });
      if (state.view === "diet") { await refresh(); await loadDietDay(); render(); return; }
      await loadHistory();
      await refresh();
    });
  }

  function on(id, ev, fn) {
    const el = document.getElementById(id);
    if (el) el.addEventListener(ev, fn);
  }

  function wire() {
    /* landing */
    on("open", "click", () => {
      const c = (document.getElementById("code").value || "").trim().toUpperCase();
      if (!c) { state.msg = "Enter the code your tribe sent you."; render(); return; }
      location.search = "?g=" + encodeURIComponent(c);
    });
    on("code", "keydown", (e) => { if (e.key === "Enter") document.getElementById("open").click(); });

    // What is typed survives a repaint (a message, a failed create).
    state.land = state.land || {};
    [["gname", "name"], ["ggoal", "goal"], ["gby", "by"], ["gwhen", "when"], ["gthen", "then"]].forEach(([id, k]) =>
      on(id, "input", (e) => { state.land[k] = e.target.value; }));
    on("create", "click", async (e) => {
      const L = state.land, name = (L.name || "").trim();
      const tz = document.getElementById("gtz").value;
      if (!name) { state.msg = "Give your tribe a name."; render(); document.getElementById("gname")?.focus(); return; }
      e.target.disabled = true;
      const res = await call("app_create_group", { p_name: name, p_timezone: tz });
      if (res.error) { state.msg = res.error; e.target.disabled = false; render(); return; }
      if ((L.goal || "").trim() || L.by || (L.when || "").trim() || (L.then || "").trim()) {
        await call("app_set_tribe", { p_code: res.code, p_person: null, p_name: name, p_goal: (L.goal || "").trim(),
          p_by: L.by || null, p_when: (L.when || "").trim(), p_then: (L.then || "").trim() });
      }
      location.search = "?g=" + res.code;
    });

    /* group */
    on("who", "change", async (e) => {
      saveMe(e.target.value);
      state.msg = null;
      await loadHistory();
      render();
    });

    on("addBtn", "click", () => { state.adding = !state.adding; state.editing = null; render();
      const el = document.getElementById("addName"); if (el) el.focus(); });

    on("addSave", "click", async (e) => {
      const name = (document.getElementById("addName").value || "").trim();
      const hint = document.getElementById("addHint");
      if (!name) { hint.textContent = "Type a name first."; return; }
      e.target.disabled = true;
      const res = await call("app_add_person", { p_code: state.code, p_name: name });
      if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      saveMe(res.id);
      state.adding = false;
      await refresh();
    });
    on("addName", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("addSave").click();
      if (e.key === "Escape") { state.adding = false; render(); }
    });



    // Walking the roster back a day. Today needs no call — app_state
    // already carries it — so only a past day costs a round trip.
    const stepBoard = async (n) => {
      const next = shiftISO(famDayISO(), n);
      if (next > familyISO()) return;
      if (next === familyISO()) {
        state.boardDay = null; state.boardCards = null; render(); return;
      }
      state.boardDay = next; state.boardBusy = true; render();
      const res = await call("app_board", { p_code: state.code, p_day: next });
      state.boardBusy = false;
      if (res.error || !res.people) {
        state.boardDay = null; state.boardCards = null;
        if (res.error) { state.msg = res.error; state.msgKind = "bad"; }
        render(); return;
      }
      state.boardCards = Object.fromEntries(res.people.map((r) => [r.id, r.board || {}]));
      render();
    };
    on("bPrev", "click", () => stepBoard(-1));
    on("bNext", "click", () => stepBoard(1));
    on("bToday", "click", () => { state.boardDay = null; state.boardCards = null; render(); });

    on("foldBoard", "click", () => {
      try { localStorage.setItem("fhd.board", boardOpen() ? "shut" : "open"); } catch {}
      render();
    });


    on("installGo", "click", async () => {
      if (!installEvt) return; const e = installEvt; installEvt = null;
      try { e.prompt(); await e.userChoice; } catch {}
      render();
    });
    on("installNo", "click", () => {
      try { localStorage.setItem("fhd.install", "no"); } catch {}
      const el = document.getElementById("installHint");
      if (el) el.remove();
    });




    document.querySelectorAll('[data-edit="name"]').forEach((el) => {
      el.addEventListener("click", () => openEditor("name", el.dataset.person));
    });

    wireEditor();
    wireBoardActions();
  }

  function wireEditor() {
    on("editCancel", "click", () => { state.editing = null; state.editDraft = null; render(); });

    on("editSave", "click", async (e) => {
      const kind = state.editing;
      const raw = (document.getElementById("editVal").value || "").trim();
      const hint = document.getElementById("editHint");

      {
        if (!raw) { hint.textContent = "A name cannot be blank."; return; }
        e.target.disabled = true;
        const res = await call("app_rename_person", {
          p_code: state.code, p_person: state.editPerson || state.meId, p_name: raw,
        });
        if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      }
      state.editing = null; state.editDraft = null;
      await refresh();
    });
    on("editVal", "input", (e) => { state.editDraft = e.target.value; });

    on("editVal", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("editSave").click();
      if (e.key === "Escape") { state.editing = null; render(); }
    });
  }

  // Board-only: the pillar marks, the tap-through chips, the one button.
  function wireBoardActions() {
    // The chips ARE the navigation: one tap from a pillar row to the page
    // that records it. No tab bar, and no Log screen to outgrow.
    document.querySelectorAll("[data-tile]").forEach((el) =>
      el.addEventListener("click", () => openExercise(el.dataset.tile)));

    // Tap someone's volume chip to read the session behind it. The board
    // stays a scoreboard; the detail is one tap away for whoever wants it.
    document.querySelectorAll("[data-see]").forEach((el) => {
      el.addEventListener("click", async () => {
        const m = el.dataset.m;
        const res = await call("app_lift_detail", {
          p_code: state.code, p_person: el.dataset.see, p_mode: m });
        if (res.error || !res.session) return;
        state.mode = m;
        state.lift.detail = res.session;
        state.lift.from = "board";
        state.view = "detail";
        render();
      });
    });

    on("waShare", "click", () => {
      // WhatsApp's official click-to-chat link. No API, no cost, no bot:
      // it opens WhatsApp with the message written, and you pick the group.
      window.open("https://wa.me/?text=" + encodeURIComponent(dailyMessage()), "_blank");
    });
  }

  /* ---------- boot -------------------------------------------------- */
  (async () => {
    if (!configured) { render(); return; }
    if (!sb) {
      state.fatal = "Could not load the database library. Check your connection and reload.";
      render(); return;
    }
    if (state.code) {
      state.meId = loadMe();
      state.fam.open = famOpen();
      try {
        state.range = localStorage.getItem("fhd.range") === "month" ? "month" : "week";
        state.histOpen = localStorage.getItem("fhd.hist") === "open";
      } catch {}
      await refresh();
      watchClock();
      // A workout finished with no signal uploads itself the moment there
      // is one — on this load, and again whenever the phone reconnects.
      loadLocal();
      flushPending().then(() => { if (state.view === "board") render(); });
      window.addEventListener("online", () => {
        retryIn = 0;
        flushPending().then(() => { if (state.net === "offline") refresh();
                                    else if (state.view !== "session") render(); });
      });
    } else {
      render();
    }
  })();
})();
</script>
</body>
</html>
