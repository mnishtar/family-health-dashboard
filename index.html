  const deviceTZ = () => {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || null; }
    catch { return null; }
  };

  // V1.6. "Today" is no longer whatever this device believes. The server
  // computes it per person from their own stored zone and hands it back on
  // the board, so Karachi and Connecticut each see their own day even when
  // they are looking at the same screen at the same instant. The device
  // date is only the fallback before the first load answers.
  const todayISO = () => {
    const m = me();
    return (m && m.their_date) || deviceISO();
  };
  const shiftISO = (iso, n) => {
    const d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  const dayLabel = (iso) => String(Number(iso.slice(8)));
  const longLabel = (iso) => new Date(iso + "T00:00:00Z")
    .toLocaleDateString(undefined, { timeZone:"UTC", month:"short", day:"numeric" });

  /* ---------- client ---------------------------------------------- */
  let sb = null;
  const configured =
    SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.length > 20;

  if (configured && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  /* ---------- talking to the database --------------------------------
     V2.1b. A lost packet must not be able to kill the app.

     Every request here can fail two ways, and they are nothing alike. The
     database saying "no group with that code" is final: no amount of
     retrying changes it. A fetch that never reached the database is
     weather — the phone came back from the background, the lift had no
     signal, the wifi handed over. Safari reports the second as
     "TypeError: Load failed", and until now the app took that literally
     and painted a dead screen whose only button threw away the join code.

     So a failure is classified at the only place it can be, and network
     failures never become state.fatal.
     ------------------------------------------------------------------ */
  const OFFLINE_RX = /load failed|failed to fetch|networkerror|network request failed|timeout|aborted/i;
  const isNetwork = (m) => !m || OFFLINE_RX.test(m);

  async function call(fn, args) {
    try {
      const { data, error } = await sb.rpc(fn, args);
      if (error) {
        return isNetwork(error.message)
          ? { error: error.message, offline: true }
          : { error: error.message };
      }
      return data || {};
    } catch (e) {
      // supabase-js normally hands errors back rather than throwing, but a
      // throw here is by definition not the database's answer.
      return { error: (e && e.message) || "Network error", offline: true };
    }
  }

  // The same call, retried while the failure is only weather. Three goes
  // over about seven seconds, then it gives up quietly and the caller
  // keeps whatever was on screen.
  async function callRetry(fn, args, tries = 3) {
    let last = null;
    for (let i = 0; i < tries; i++) {
      if (i && !navigator.onLine) break;
      const res = await call(fn, args);
      if (!res.offline) return res;
      last = res;
      if (i < tries - 1) await new Promise((r) => setTimeout(r, 1000 * Math.pow(2, i)));
    }
    return last;
  }

  // Exercise is ONE pillar with three numbers in it. Train is lifting and
  // yoga; Cardio is walking, running, swimming, the machines. V1.4 summed
  // them and that was wrong — they are different things, and keeping them
  // apart is what lets each have its own target and its own chart.
  const M = {
    steps:  { key:"steps",      label:"Steps",  unit:"steps",   color:"var(--series)", soft:"var(--soft)" },
    train:  { key:"train_min",  label:"Train",  unit:"minutes", color:"var(--train)",  soft:"var(--train-soft)" },
    cardio: { key:"cardio_min", label:"Cardio", unit:"minutes", color:"var(--swim)",   soft:"var(--swim-soft)" },
    // V2.1b. Two of these are TIMES: the number is a clock reading, and
    // lower is better for both — going to bed later and getting up later
    // are the same kind of miss.
    rest:   { key:"rest_time",  label:"Rest",   unit:"time", color:"var(--sleep)", soft:"var(--sleep-soft)", time:true, night:true, lower:true },
    rise:   { key:"rise_time",  label:"Rise",   unit:"time", color:"var(--sleep)", soft:"var(--sleep-soft)", time:true, lower:true },
    sleep:  { key:"sleep_items",label:"Sleep Score", unit:"%", color:"var(--sleep)", soft:"var(--sleep-soft)", bits:true, night:true },
    // V2.8. Deep work, in minutes, filled by pomodoros. Shaped like Train
    // on purpose: a number you can type, a target, a week and a month.
    work:   { key:"work_min",   label:"Work Score", unit:"minutes", color:"var(--work)", soft:"var(--work-soft)" },
  };

  /* ---------- the twelve habits --------------------------------------
     Stored as one integer per night, one bit each, in this order. The
     order is the evening in sequence — what you do hours before bed, then
     the room, then the clock — so the list reads like a night rather than
     a checklist someone sorted alphabetically.
     ------------------------------------------------------------------ */
  /* ---------- the sleep pyramid ---------------------------------------
     V2.4. Ten habits, not twelve, ranked by how good the evidence for
     each one actually is, and laid out as a pyramid: the apex is the one
     worth fixing first and the base is the fine tuning. The shape IS the
     scoring — row 1 is worth 4, row 2 is worth 3, row 3 is 2, row 4 is 1,
     twenty points a night — so nobody has to read a key to know what
     matters. Sorting by weight inside a row would be false precision;
     within a row they are genuinely comparable.

     Three items were dropped and two added, on the evidence:
       out  no hard exercise before bed — an evening-exercise network
            meta-analysis finds no disruption at ANY timing window, and
            the rule discourages the best-evidenced behaviour in the app
       out  wind-down routine — the 226-trial component analysis puts
            relaxation at iOR 0.81, i.e. plausibly counterproductive,
            probably by cultivating sleep effort
       out  sleep tracked — not a sleep behaviour; one mixed RCT for,
            case reports of tracking anxiety against
       in   same wake time — sleep regularity beat sleep DURATION for
            mortality in 61k people, and nothing here measured it
       in   no alcohol within 3h — REM suppression from about two drinks

     THE ORDER OF THIS ARRAY IS THE BIT ORDER AND IS FROZEN FOREVER. It
     is no longer the ranking: from V2.5 the family arranges the pyramid
     and `state.group.sleep_order` says who sits where. A tick records
     WHICH habit, so re-ranking rewrites nothing. Adding a habit means
     appending to the end, never inserting.

     `t` is what the tile says; `full` is the plain-English version under
     it, because "stimulus control" is not a phrase anyone taps at 11pm.
     ------------------------------------------------------------------ */
  const HABITS = [
    { bit:10, t:"Bedtime",      sub:"alarm, by target", long:"Bedtime alarm",
      full:"Set an alarm to be in bed at or before your target time. This is " +
           "the most important appointment of the day, and the rest of your " +
           "schedule should revolve around it. The bed is for sleeping only — " +
           "do anything else in it and your brain learns to associate it with " +
           "being awake. Same time, same place, weekends included." },
    { bit:6,  t:"Light",        sub:"on waking",        long:"Morning light",
      full:"View bright light within 15 to 30 minutes of waking, at about the " +
           "same time each day. Aim for 10 minutes of sunlight, and wake at the " +
           "same hour on weekends too. A light therapy device works if you are " +
           "up before the sun." },
    { bit:7,  t:"Wind-down",    sub:"the last hour",    long:"The wind-down hour",
      full:"Warm, dim lighting for the hour before bed — a red light is better " +
           "still — and screens down for at least that hour. Unwinding is " +
           "gradual, so give it the whole hour: journal the open loops and " +
           "worries, stretch lightly, read, take a warm bath, talk or walk, " +
           "listen to something soothing, meditate." },
    { bit:5,  t:"Cool",         sub:"60\u201367\u00b0F",         long:"A cool room",
      full:"Sleep between 60 and 67\u00b0F (15\u201319\u00b0C), with breathable bedding and " +
           "light sleepwear. Layer blankets you can throw off rather than " +
           "fighting the thermostat. A fan or cooling device helps, and so " +
           "does a warm bath before bed." },
    { bit:8,  t:"Quiet",        sub:"or white noise",   long:"A quiet room",
      full:"Keep the bedroom quiet. A white noise machine covers environmental " +
           "sound and earplugs work if you need them — but remove the " +
           "interruptions as well, phone alerts above all." },
    { bit:4,  t:"Dark",         sub:"no light",         long:"A dark room",
      full:"Blackout curtains or an eye mask. As dark as you can make it, with " +
           "no artificial light. Candlelight and moonlight are fine." },
    { bit:2,  t:"Caffeine",     sub:"none 8\u201310h",       long:"No caffeine for 8\u201310h",
      full:"Avoid caffeine within 8 to 10 hours of bed. Caffeine blocks " +
           "adenosine receptors, so your brain stops sensing its own declining " +
           "energy — and that sense is what switches it into sleep mode. " +
           "Caffeine still in your system near bedtime also disrupts your sleep " +
           "phases and the quality of the later night. Swap to herbal tea or " +
           "another relaxing drink, ideally two hours before bed." },
    { bit:9,  t:"Last meal",    sub:"4h before",        long:"Last meal 4h before bed",
      full:"Finish eating at least four hours before bed, and avoid fluids in " +
           "the last two. A body still digesting sleeps worse: eating close to " +
           "bed makes a large metabolic demand, swings blood glucose, reduces " +
           "melatonin, and works against the fall in core body temperature that " +
           "sleep depends on." },
    { bit:11, t:"Exercise early", sub:"not within 3h",  long:"Exercise early",
      full:"Keep strenuous exercise out of the last three hours before bed. It " +
           "makes it harder for the brain to wind down. Train earlier in the " +
           "day instead — the exercise itself is one of the best things you can " +
           "do for your sleep." },
    { bit:12, t:"Track it",     sub:"journal or app",   long:"Track your sleep",
      full:"Keep a journal or use a sleep tracker. Use the data to make " +
           "informed adjustments, and monitor and tweak your habits to improve " +
           "the quality of your sleep." },
  ];

  /* ---------- how a night is stored, and why it survives this list ------
     V2.6. `bit` is an explicit, PERMANENT number, not the position in this
     array. That is the whole point: the list has now changed three times
     (twelve, then ten, then these ten), and the first two changes each
     needed a one-off migration to rewrite every stored night, because the
     position in the array WAS the bit.

     From here the array is append-only. Reorder it freely; drop an item
     and its bit is simply retired and stops scoring; add one and it takes
     the next free number. Nothing stored is ever rewritten again.

     Retired so far: 0 bed-only-for-sleep, 1 same-wake-time, 3 no-alcohol.
     Next free bit: 13.
     ------------------------------------------------------------------ */
  const BITS = HABITS.map((h) => h.bit);
  const BYBIT = Object.fromEntries(HABITS.map((h) => [h.bit, h]));
  const MAXBIT = Math.max(...BITS);
  // One tile, then two, then three, then four.
  const ROWS = [1, 2, 3, 4];
  const bitsOn = (v) => { let n = 0, x = Number(v) || 0; while (x) { n += x & 1; x >>= 1; } return n; };

  // V2.3. The twelve are not worth the same. A dark room and a journal
  // entry both took one tap and both moved the old score by a twelfth,
  // which is the kind of number that stops meaning anything by week two.
  //
  // The weights come from the SERVER, on app_state, and this is the only
  // copy the page keeps. The schema and this file are two separate pastes
  // into two separate places, so somebody will eventually upgrade one and
  // not the other — and when they do, the score on the Sleep page and the
  // score on the family board still have to be the same number.
  // The pyramid ladder: what a POSITION is worth, apex first. The family
  // decides which habit sits where; the shape never moves.
  const LADDER = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
  // The order the list is written in IS the default ranking.
  const IDENT  = BITS.slice();
  const okOrder = (o) => Array.isArray(o) && o.length === BITS.length &&
    new Set(o).size === BITS.length && o.every((b) => BYBIT[b] !== undefined);
  const order  = () => {
    const o = state.group && state.group.sleep_order;
    return okOrder(o) ? o : IDENT;
  };
  // Indexed by BIT, so a retired bit sits at zero and an old night that
  // held it simply stops earning anything for it.
  const wtFrom = (ord) => {
    const w = new Array(MAXBIT + 1).fill(0);
    ord.forEach((bit, pos) => { if (pos < LADDER.length) w[bit] = LADDER[pos]; });
    return w;
  };
  const FALLBACK_W = wtFrom(IDENT);
  const weights  = () => {
    const w = state.group && state.group.sleep_weights;
    return Array.isArray(w) && w.length > MAXBIT ? w : FALLBACK_W;
  };
  const scoreMax = () => Number(state.group && state.group.sleep_max) ||
                         weights().reduce((a, b) => a + b, 0);
  const scorePts = (v) => {
    const x = Number(v) || 0, w = weights();
    let n = 0;
    for (let i = 0; i < w.length; i++) if ((x >> i) & 1) n += w[i];
    return n;
  };
  const scorePct = (v) => Math.round(scorePts(v) / Math.max(1, scoreMax()) * 100);

  /* ---------- V3.4: a standard for every activity ----------------------
     Nine activities, one shape. Each has a kind that decides how it is
     typed, shown and scored against its standard:
       count  a whole number        Steps, Tasks done
       min    minutes               Train, Cardio, Work
       pct    a percent             Sleep Score, Goals
       time   a clock, lower wins   Rise, Rest
     `key` is the metric the standard is stored under on the server.
     ------------------------------------------------------------------ */
  const STD = {
    steps:  { label:"Step Score",  kind:"count", def:8000, key:"steps",      unit:"steps", short:"Steps" },
    train:  { label:"Train",       kind:"min",   def:40,   key:"train_min" },
    cardio: { label:"Cardio",      kind:"min",   def:30,   key:"cardio_min" },
    sleep:  { label:"Sleep Score", kind:"pct",   def:80,   key:"sleep_pct", short:"Sleep" },
    rise:   { label:"Rise",        kind:"time",  def:360,  key:"rise_time" },
    rest:   { label:"Rest",        kind:"time",  def:1350, key:"rest_time" },
    work:   { label:"Work Score",  kind:"min",   def:180,  key:"work_min",  short:"Work" },
    goals:  { label:"Goals",       kind:"pct",   def:85,   key:"goal_pct" },
    tasks:  { label:"Tasks",       kind:"count", def:5,    key:"tasks_done", unit:"done" },
  };
  const STD_GROUPS = [
    ["Exercise",   ["steps", "train", "cardio"]],
    ["Sleep",      ["sleep", "rise", "rest"]],
    ["Great Work", ["work", "goals", "tasks"]],
  ];
  const DIAL_DEFAULT = ["steps", "work", "sleep"];
  const STD_FIELD = { steps:"steps_target", train:"train_target", cardio:"cardio_target",
    sleep:"sleep_target", rise:"rise_target", rest:"rest_target", work:"work_target",
    goals:"goal_target", tasks:"tasks_target" };
  // This person's standard, or the default when none was ever set.
  function stdOf(p, k) {
    const v = p ? p[STD_FIELD[k]] : null;
    return v === null || v === undefined || v === "" ? STD[k].def : Number(v);
  }
  // Today's value on this person's own day. Null means nothing recorded.
  function todayOf(p, k) {
    if (!p) return null;
    const n = (v) => v === null || v === undefined ? null : Number(v);
    switch (k) {
      case "steps":  return p.steps_logged || Number(p.steps) > 0 ? Number(p.steps) : null;
      case "train":  return Number(p.train_min) > 0 ? Number(p.train_min) : null;
      case "cardio": return Number(p.cardio_min) > 0 ? Number(p.cardio_min) : null;
      case "work":   return Number(p.work_min) > 0 ? Number(p.work_min) : null;
      case "sleep":  return p.items === null || p.items === undefined ? null : scorePct(p.items);
      case "rise":   return n(p.rise);
      case "rest":   return n(p.rest);
      case "goals":  return n(p.goal_pct);
      case "tasks":  return Number(p.tasks_done) || 0;
    }
    return null;
  }
  // How far toward the standard, 0 to 100. A time is the other way round:
  // on or before the standard is 100, and an hour late is 0.
  function stdPct(k, v, std) {
    if (v === null || v === undefined) return null;
    if (STD[k].kind === "time") return Math.max(0, Math.min(100, 100 - (Number(v) - std) / 60 * 100));
    return std > 0 ? Math.max(0, Math.round(Number(v) / std * 100)) : (Number(v) > 0 ? 100 : 0);
  }
  // A value written the way the activity is spoken about.
  function stdWords(k, v) {
    if (v === null || v === undefined) return "\u2013";
    const kind = STD[k].kind;
    if (kind === "time") return clockWords(v);
    if (kind === "pct")  return Math.round(Number(v)) + "%";
    if (kind === "min")  return hm(v);
    return num(Math.round(Number(v)));
  }

  // The five pillars, in the order they will always appear. Four are dark
  // and unclickable until they are measured; showing them anyway is the
  // honest version of a roadmap, and it stops the board from being
  // redesigned when each one arrives.
  const PILLARS = [
    { key:"exercise",   label:"Exercise",   live:true  },
    { key:"sleep",      label:"Sleep",      live:true  },
    { key:"meditation", label:"Meditate",   live:false },
    { key:"diet",       label:"Diet",       live:false },
    { key:"focus",      label:"Great Work", live:true  },
  ];

  const mondayOf = (iso) => {
    const d = new Date(iso + "T00:00:00Z");
    return shiftISO(iso, -((d.getUTCDay() + 6) % 7));
  };

  /* ---------- state ------------------------------------------------ */
  const state = {
    code: new URLSearchParams(location.search).get("g"),
    group: null,
    metric: { key:"steps", unit:"steps", default_target:8000 },
    people: [],
    meId: null,
    history: {},          // one week of the metric on screen, by short key
    adding: false,
    editing: null,        // null | 'name' | 'goal'
    editPerson: null,
    editMetric: "steps",
    entryDate: null,      // null means today
    msg: null,

    // V1.3. The board is still the whole app for nine people out of ten;
    // Lift is a place you go, not a thing on the board.
    view: "board",        // board | exercise | session | detail
    seg:  "steps",        // steps | train | cardio — which metric page is open
    mode: "lift",         // lift | cardio — which log the segment is showing
    weekAnchor: null,     // Monday of the week on the charts; null means this week
    // The family block, per metric, fetched on first open and kept.
    fam: { open: false, data: {} },
    undo: null,           // { key, date, words } for a few seconds after a stamp
    net: "ok",            // ok | offline — whether the last call reached the database
    flip: null,           // which tile is showing its back
    boardDay: null,       // which family day the roster shows; null means today
    boardCards: null,     // that day's cards by person id
    boardBusy: false,
    range: "week",        // week | month — which graph the page is showing
    month: {},            // per metric per calendar month, fetched when Month is opened
    monthAnchor: null,    // first of the month on show; null means this month
    histOpen: false,      // the workout history fold
    tmpl: null,           // { label, mode, items:[...] } while being edited

    lift: {
      loaded: false,
      labels: [], sessions: [], exercises: [],
      detail: null,       // a session being read
      from: "lift",       // where the reader came from, so Back goes back
      active: null,       // the session being logged right now
      sync: "idle",       // idle | saving | saved | offline
      msg: null,
      menu: null,         // a tile's ... menu, by label
      rename: null,       // a tile being renamed
    },
  };

  if (state.code) state.code = state.code.toUpperCase();

  const meKey = () => `fhd.me.${state.code}`;
  const loadMe = () => { try { return localStorage.getItem(meKey()); } catch { return null; } };
  const saveMe = (id) => {
    state.meId = id;
    try { localStorage.setItem(meKey(), id); } catch {}
  };
  const me = () => state.people.find((p) => p.id === state.meId) || null;

  // The family board folds. Default open, because it is the reason the app
  // exists; remembered per phone, because on your own phone you may already
  // know what everyone did.
  function boardOpen() {
    try { return localStorage.getItem("fhd.board") === "open"; } catch { return false; }
  }

  /* ---------- data ------------------------------------------------- */
  async function refresh() {
    // p_me + p_tz teach the server where this phone is, on every load. A
    // family member who only ever reads the board would otherwise keep the
    // group's zone for ever and see somebody else's day.
    const res = await callRetry("app_state", { p_code: state.code,
      p_me: state.meId || null, p_tz: deviceTZ() });
    if (res.error) {
      // Weather: keep the screen exactly as it is and try again shortly.
      // Only an answer FROM the database can be fatal.
      if (res.offline) { setNet("offline"); scheduleRetry(); render(); return; }
      state.fatal = res.error; render(); return;
    }
    setNet("ok");
    state.group = res.group;
    // V2.8. A focus session that ended while the page was asleep.
    if (state.meId && !state.workChecking) {
      state.workChecking = true;
      setTimeout(async () => {
        try { if (await checkWork()) render(); } finally { state.workChecking = false; }
      }, 0);
    }
    // Alphabetical, so a name is findable without reading the whole list.
    state.people = (res.people || []).slice().sort((a, b) =>
      a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
    if (!state.people.some((p) => p.id === state.meId)) state.meId = loadMe();
    if (!state.people.some((p) => p.id === state.meId)) state.meId = null;
    await loadHistory();
    // If the family block is open on the page you are looking at, it is
    // showing numbers that just changed. Refetch it here rather than in
    // each caller, so no path can leave it stale.
    if (state.fam.open && state.view === "exercise") {
      state.fam.data[state.seg] = null;
      await loadFamily();
    }
    render();
  }

  /* ---------- the clock ---------------------------------------------
     V1.6. `refresh()` used to run exactly once, at boot. Added to the Home
     Screen, this app is resumed rather than reloaded, so "today" froze at
     whatever moment iOS last cold-started it — which is precisely the
     "it resets in the middle of the day" that started this release.

     Two cheap triggers fix it, and nothing polls the network on a timer:
       * coming back to the screen re-asks the server for the day;
       * a one-minute local tick notices the device date has rolled over
         and only then re-asks.
     ------------------------------------------------------------------ */
  let clockDay = null, clockTimer = null;

  /* ---------- the network chip ---------------------------------------
     One quiet line, not a screen. It says what is happening and gets out
     of the way the moment a call succeeds.
     ------------------------------------------------------------------ */
  let retryTimer = null, retryIn = 0;
  function setNet(s) {
    if (s === "ok" && retryTimer) { clearTimeout(retryTimer); retryTimer = null; retryIn = 0; }
    if (state.net === s) return;
    state.net = s;
  }
  function scheduleRetry() {
    if (retryTimer) return;
    retryIn = Math.min(retryIn ? retryIn * 2 : 5, 60);
    retryTimer = setTimeout(() => { retryTimer = null; refresh(); }, retryIn * 1000);
  }

  function watchClock() {
    clockDay = deviceISO();

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      refresh();
    });

    if (clockTimer) clearInterval(clockTimer);
    clockTimer = setInterval(() => {
      const d = deviceISO();
      if (d === clockDay) return;
      clockDay = d;
      // A new day: the week the charts are anchored to is last week now.
      if (state.weekAnchor === null) state.entryDate = null;
      if (!document.hidden) refresh();
    }, 60000);
  }

  // Today's numbers for one person, by short metric name.
  const val = (p, k) => Number(
    k === "steps" ? p.steps : k === "train" ? p.train_min : p.cardio_min) || 0;
  // V2.1 FIX. Cardio was hard-coded to 0 here, so the Cardio target V1.7
  // let you set was saved and then never shown or used anywhere.
  // V3.4. Every activity has a standard now, so an unset one is the
  // default rather than zero. Times stay null-able: see hasTarget.
  const target = (p, k) => k === "rest"  ? num0(p.rest_target)
                         : k === "rise"  ? num0(p.rise_target)
                         : STD[k] ? stdOf(p, k) : 0;
  // A time target can legitimately be 0 (midnight), so "unset" has to be
  // null rather than falsy.
  const num0 = (v) => (v === null || v === undefined ? 0 : Number(v));
  const hasTarget = (p, k) => M[k] && M[k].time
    ? (k === "rest" ? p.rest_target : p.rise_target) !== null &&
      (k === "rest" ? p.rest_target : p.rise_target) !== undefined
    : target(p, k) > 0;
  // The raw stored value, where null means "never recorded" — unlike
  // steps, a Rest of 0 is midnight, not nothing.
  const rawVal = (p, k) => k === "rest" ? p.rest : k === "rise" ? p.rise
                         : k === "sleep" ? p.items : val(p, k);
  const hasVal = (p, k) => { const v = rawVal(p, k);
    return M[k] && (M[k].time || M[k].bits) ? v !== null && v !== undefined : Number(v) > 0; };

  // V2.1. The family's day. Everything shown ABOUT other people — the
  // family list, its counts, the WhatsApp post — reads these, so a
  // relative whose own midnight has passed keeps their numbers on the
  // board until the family's day ends.
  // V2.7. The roster can look back. Day 0 is the family's own date and
  // comes free on app_state; any earlier day is fetched once and kept.
  const famDayISO = () => state.boardDay || familyISO();
  const board = (p) => {
    if (state.boardDay && state.boardCards) return state.boardCards[p.id] || {};
    return p.board || {};
  };
  const bval = (p, k) => Number(
    k === "steps" ? board(p).steps : k === "train" ? board(p).train_min : board(p).cardio_min) || 0;
  const banyLog = (p) => bval(p,"steps") > 0 || bval(p,"train") > 0 || bval(p,"cardio") > 0;
  const bdone = (p) => !!board(p).done;
  const familyISO = () => (state.group && state.group.family_date) || todayISO();

  // One window, both metrics. The week view is a real Monday-to-Sunday
  // calendar week, so everyone is looking at the same seven columns.
  function weekBounds() {
    const start = state.weekAnchor || mondayOf(entryDay());
    return { start, end: shiftISO(start, 6) };
  }
  const thisMonday = () => mondayOf(todayISO());
  function weekWords() {
    const { start, end } = weekBounds();
    if (start === thisMonday()) return "This week";
    if (start === shiftISO(thisMonday(), -7)) return "Last week";
    return longLabel(start) + " \u2013 " + longLabel(end);
  }

  // V2.1b. One metric, not three. Only the page you are looking at needs
  // its week, and three calls per open were two more round trips than the
  // screen could use.
  async function loadHistory() {
    const k = state.seg;
    if (!state.meId || !M[k]) { state.history[k] = []; return; }
    const res = await call("app_history", {
      p_code:state.code, p_person:state.meId,
      p_days:7, p_metric:M[k].key, p_today:weekBounds().end });
    state.history[k] = res.error ? [] : (res.days || []);
  }

  /* ---------- which day is being logged ----------------------------- */
  const entryDay = () => state.entryDate || todayISO();


  // What is already recorded for the day on screen. The week is already
  // loaded for the chart, so there is nothing to fetch — which is what let
  // `app_value`, `ensureDay` and the whole byDate cache be deleted.
  function dayRecord(k) {
    const iso = entryDay();
    const m = me();
    if (iso === todayISO() && m)
      return { value: val(m, k), logged: k === "steps" ? !!m.steps_logged : val(m, k) > 0 };
    // fall through to the loaded week/month below
    const d = (state.history[k] || []).find((x) => x.date === iso)
           || (monthData(k)     || []).find((x) => x.date === iso);
    return { value: d ? Number(d.value) : 0, logged: d ? d.logged : false };
  }

  /* ---------- chart ------------------------------------------------ */
  const DOW = ["M","T","W","T","F","S","S"];

  function points(k) {
    const met = M[k] || {};
    return (state.history[k] || []).map((d, i) => ({
      key:d.date, label:DOW[i] || dayLabel(d.date),
      value: met.bits ? scorePct(d.value) : Number(d.value),
      logged:d.logged, full:longLabel(d.date),
    }));
  }

  // One mini chart per metric, stacked, sharing the same columns. Steps and
  // minutes cannot honestly share a y-axis, so they each keep their own.
  function miniChart(k, strip) {
    const met = M[k];
    const pts = points(k);
    if (!pts.length) return "";

    const goal = target(me() || {}, k);

    // The strip is the same chart at a third of the height, with its head
    // and its totals removed. It is still the form: every bar is a tap
    // target, and the selected column is still drawn behind the bar.
    const H = strip ? 46 : 118, PT = strip ? 5 : 10, PB = 4, plot = H - PT - PB;
    const n = pts.length, slot = 100 / n, bw = slot * 0.52;

    // V2.1b. A clock reading is not a quantity. Drawn from zero, every
    // bedtime between ten and eleven is the same bar; what you want to see
    // is whether tonight was later than last night. So times get their own
    // scale, fitted to the week, and are drawn as points rather than bars —
    // a bar starting anywhere but zero would be a lie.
    const vals = pts.filter((p) => p.logged || p.value > 0).map((p) => p.value);
    const timed = !!(met.time && vals.length);
    // V2.6. For a clock with a target, the number that means something is
    // the MISS, not the reading. "22 minutes late" lands; "10:52p" has to
    // be subtracted from 10:30p first, every time you look at it. So Rest
    // and Rise are drawn as deviation from target: a centre line that IS
    // your target, bars up for late and down for early. Without a target
    // there is nothing to deviate from, and the fitted line from V2.1b
    // stays.
    const dev = !!(timed && (goal || goal === 0));
    const peak = Math.max(...pts.map((p) => p.value), goal || 0, 1);
    const max = peak * 1.15;
    let y, mid, devSpan;
    if (dev) {
      // A symmetric scale, so ten minutes late and ten minutes early are
      // the same distance from the line. Floored at half an hour each way
      // so a good week does not magnify two-minute wobbles into mountains.
      devSpan = Math.max(30, ...vals.map((v) => Math.abs(v - goal))) * 1.15;
      mid = PT + plot / 2;
      y = (v) => mid - ((v - goal) / devSpan) * (plot / 2);
    } else if (timed) {
      const lo = Math.min(...vals, goal || Infinity) - 25;
      const hi = Math.max(...vals, goal || -Infinity) + 25;
      const span = Math.max(hi - lo, 60);
      y = (v) => PT + plot - ((v - lo) / span) * plot;
    } else {
      y = (v) => PT + plot - (v / max) * plot;
    }

    let bars = "";
    // V2.1b. Every metric highlights the selected day, not just Steps —
    // Train and Cardio have a number you type now, so which day is being
    // typed into has to be visible on their charts too.
    const sel = entryDay();
    if (timed) {
      // Every day keeps a full-height invisible target, so tapping still
      // selects a day with no point to aim at.
      const seen = pts.map((p, i) => ({ p, i })).filter((o) => o.p.logged || o.p.value > 0);
      const cx = (i) => i * slot + slot / 2;
      bars = pts.map((p, i) =>
        `<rect x="${i * slot}" y="${PT}" width="${slot}" height="${plot}"
           fill="${p.key === sel ? met.soft : "transparent"}"
           ${p.key === sel ? 'opacity="0.55"' : ""}
           data-day="${p.key}" data-metric="${k}"></rect>`).join("");

      if (dev) {
        // One bar per night, hanging off the target line. Rounded at the
        // free end only, so the bar reads as growing away from the line
        // rather than floating beside it.
        const dw = slot * 0.4;
        bars += seen.map((o) => {
          const yv = y(o.p.value), h = Math.abs(yv - mid);
          const top = Math.min(yv, mid);
          const x = cx(o.i) - dw / 2;
          if (h < 0.9) {
            // Dead on target: a dash, not a sliver of a bar.
            return `<rect x="${x.toFixed(2)}" y="${(mid - 0.9).toFixed(2)}"
              width="${dw.toFixed(2)}" height="1.8" rx="0.9" fill="${met.color}"
              pointer-events="none"></rect>`;
          }
          return `<rect x="${x.toFixed(2)}" y="${top.toFixed(2)}"
            width="${dw.toFixed(2)}" height="${h.toFixed(2)}" rx="${(dw / 2).toFixed(2)}"
            fill="${met.color}" opacity="${o.p.value > goal ? 0.9 : 0.45}"
            pointer-events="none"></rect>`;
        }).join("");
      } else {
        bars += (seen.length > 1
          ? `<polyline points="${seen.map((o) =>
               `${cx(o.i).toFixed(2)},${y(o.p.value).toFixed(2)}`).join(" ")}"
               fill="none" stroke="${met.color}" stroke-width="1.5" stroke-linecap="round"
               stroke-linejoin="round" vector-effect="non-scaling-stroke"
               pointer-events="none"></polyline>` : "")
        // A <circle> would come out an oval: the chart is stretched
        // horizontally (viewBox 100 wide, preserveAspectRatio none). A
        // zero-length round-capped stroke with non-scaling-stroke is a
        // true circle at any width.
        + seen.map((o) =>
          `<line x1="${cx(o.i).toFixed(2)}" y1="${y(o.p.value).toFixed(2)}"
             x2="${cx(o.i).toFixed(2)}" y2="${y(o.p.value).toFixed(2)}"
             stroke="${met.color}" stroke-width="5.5" stroke-linecap="round"
             vector-effect="non-scaling-stroke" pointer-events="none"></line>`).join("");
      }
    }
    if (!timed) pts.forEach((p, i) => {
      const x = i * slot + (slot - bw) / 2;
      // V1.6. The selected column is the form's title bar. Nothing else on
      // the screen says which day you are typing into, so this has to.
      if (p.key === sel) {
        bars += `<rect x="${x - bw*0.3}" y="${PT-6}" width="${bw*1.6}" height="${plot+8}"
                  rx="2" fill="${met.soft}" opacity="0.55" pointer-events="none"></rect>`;
      }
      if (p.value <= 0) {
        bars += `<rect x="${x}" y="${PT}" width="${bw}" height="${plot}" fill="transparent"
                  data-day="${p.key}" data-metric="${k}"></rect>` +
                `<rect x="${x}" y="${y(0)-2}" width="${bw}" height="2" fill="${met.soft}"
                  pointer-events="none"></rect>`;
        return;
      }
      bars += `<rect x="${x}" y="${y(p.value)}" width="${bw}" height="${Math.max(y(0)-y(p.value),2)}"
                rx="${Math.min(bw/2,1.4)}" fill="${met.color}" data-day="${p.key}"
                data-metric="${k}"></rect>`;
    });

    // On a deviation chart the target is the axis, so it is a solid hairline
    // rather than a dashed guide: it is the thing everything is measured from.
    const goalLine = dev
      ? `<line x1="0" x2="100" y1="${mid}" y2="${mid}" stroke="${met.color}"
           stroke-width="1" opacity="0.55" vector-effect="non-scaling-stroke"></line>`
      : (timed ? (goal || goal === 0) : (goal && goal <= max))
      ? `<line x1="0" x2="100" y1="${y(goal)}" y2="${y(goal)}" stroke="${met.color}"
           stroke-width="1" stroke-dasharray="3 3" opacity="0.8" vector-effect="non-scaling-stroke"></line>` : "";

    const every = n <= 14 ? 1 : Math.ceil(n / 8);
    const axis = pts.map((p, i) =>
      `<span style="width:${slot}%">${i % every === 0 ? p.label : ""}</span>`).join("");


    const svg = `
        <div class="chart${dev ? " dev" : ""}" id="chart-${k}" data-chart="${k}">
          ${dev ? `<span class="devax up">later</span>
                   <span class="devax dn">earlier</span>` : ""}
          <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" role="img"
               aria-label="${met.label} for the period shown">
            ${timed ? "" : `<line x1="0" x2="100" y1="${y(0)}" y2="${y(0)}"
                  stroke="var(--line-strong)" stroke-width="1"
                  vector-effect="non-scaling-stroke"></line>`}
            ${bars}${goalLine}
          </svg>
          <div class="axis">${axis}</div>
        </div>`;

    if (strip) return `<div class="strip">${svg}</div>`;
    return `<div class="bigchart">${svg}</div>`;
  }

  /* ---------- a month, as dots -----------------------------------------
     A month cannot be bars on a phone: thirty bars get 11px slots, which is
     6px of bar, too thin to read and far too thin to tap — and tapping a
     day is how you log it. So the month changes the MARK, not the range:
     filled when the day cleared the target, ringed when something was
     logged but fell short, dashed when nothing was. At a month's distance
     the only question worth asking is whether this is a habit yet, and
     that is a shape, not a number.
     ------------------------------------------------------------------ */
  const DOWS = ["M","T","W","T","F","S","S"];

  /* ---------- the calendar month -----------------------------------------
     V2.1. "Month" means the month on the calendar, not the last 35 days.
     September is September: it starts on its 1st, in the right weekday
     column, and ‹ › walks back through August and July. A rolling window
     was a number nobody talks in.
     ------------------------------------------------------------------ */
  const monthOf = (iso) => iso.slice(0, 7) + "-01";
  function monthBounds() {
    const first = state.monthAnchor || monthOf(todayISO());
    const d = new Date(first + "T00:00:00Z");
    const next = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1));
    const last = shiftISO(next.toISOString().slice(0, 10), -1);
    return { first, last, days: Number(last.slice(8)) };
  }
  const monthWords = (first) => new Date(first + "T00:00:00Z")
    .toLocaleDateString(undefined, { timeZone:"UTC", month:"long", year:"numeric" });
  const monthKey = (k) => `${k}:${monthBounds().first}`;
  const monthData = (k) => state.month[monthKey(k)];

  // V2.3. Whether a day cleared its target depends on which way the metric
  // runs. Steps and minutes want MORE; a bedtime and a wake time want
  // LESS, so 10:00p against a 10:30p target is a hit, not a near miss.
  // One rule, so the circles and the count under them cannot disagree.
  function cleared(k, v, goal) {
    if (!(Number(v) > 0)) return false;
    if (!goal) return true;
    return M[k] && M[k].lower ? Number(v) <= goal : Number(v) >= goal;
  }

  function monthGrid(k) {
    const met = M[k];
    const days = monthData(k);
    if (!days) return `<p class="loading" style="text-align:center">Loading…</p>`;
    const goal = target(me() || {}, k);
    const today = todayISO();
    const sel = entryDay();
    const { first } = monthBounds();
    // Monday-first: how many empty cells before the 1st.
    const lead = (new Date(first + "T00:00:00Z").getUTCDay() + 6) % 7;
    const past = days.filter((d) => d.date <= today);
    const hit = past.filter((d) => cleared(k, d.value, goal)).length;

    return `
      <div class="gdow">${DOWS.map((d) => `<span>${d}</span>`).join("")}</div>
      <div class="grid" style="color:${met.color}">
        ${"<span></span>".repeat(lead)}
        ${days.map((d) => {
          const v = Number(d.value) || 0;
          const future = d.date > today;
          // full = logged and on target (or better). part = the hollow
          // ring: you logged it, it missed. none = nothing logged at all,
          // which has to stay distinguishable from a miss.
          const cls = future || v <= 0 ? "none" : cleared(k, v, goal) ? "full" : "part";
          return `<button type="button" class="gcell ${cls}${d.date === sel ? " sel" : ""}"
            data-day="${d.date}" ${future ? "disabled" : ""}
            aria-label="${esc(longLabel(d.date))}: ${v > 0 ? num(Math.round(v)) : "nothing"}"
            ><i>${Number(d.date.slice(8))}</i></button>`;
        }).join("")}
      </div>
      <p class="hint dshint" style="text-align:center">${hit} of ${past.length} days
        ${goal ? "cleared your target" : "logged"}.</p>`;
  }

  async function loadMonth(force) {
    const k = state.seg;
    const key = monthKey(k);
    if (state.month[key] && !force) return;
    if (!state.meId) { state.month[key] = []; return; }
    const { last, days } = monthBounds();
    const res = await call("app_history", {
      p_code:state.code, p_person:state.meId,
      p_days:days, p_metric:M[k].key, p_today:last });
    state.month[key] = res.error ? [] : (res.days || []);
  }

  // Seven points, each a day's steps as a fraction of that person's own
  // goal. A fraction rather than a raw count is what lets two people with
  // different targets sit in the same column and mean the same thing.
  function sparkline(spark, hue, goalLine) {
    const pts = (spark || []).map(Number).filter((n) => !Number.isNaN(n));
    if (pts.length < 2) return `<svg class="trend" viewBox="0 0 64 20"></svg>`;
    const max = Math.max(1, ...pts);
    const x = (i) => (i / (pts.length - 1)) * 62 + 1;
    const y = (v) => 18 - (v / max) * 16;
    const d = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
    const col = `hsl(${hue} 55% 42%)`;
    const last = pts[pts.length - 1];
    return `<svg class="trend" viewBox="0 0 64 20" role="img" aria-hidden="true">
      ${goalLine === false ? "" : `<line x1="0" x2="64" y1="${y(1)}" y2="${y(1)}"
            stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="2 3"
            vector-effect="non-scaling-stroke"></line>`}
      <path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"
            vector-effect="non-scaling-stroke"></path>
      <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="1.8"
              fill="${col}"></circle>
    </svg>`;
  }

  function editTarget() {
    return state.people.find((x) => x.id === (state.editPerson || state.meId)) || null;
  }
  function editSeed() {
    if (state.editing === "name") return esc(editTarget() ? editTarget().name : "");
    const k = state.editMetric;
    if (M[k] && M[k].time)
      return clockInput(hasTarget(me() || {}, k) ? target(me() || {}, k)
                        : (k === "rest" ? 1350 : 360));
    return Math.round(target(me() || {}, k)) || (k === "steps" ? 8000 : 40);
  }
  function editHintText() {
    if (state.editing === "name") {
      const t = editTarget();
      return t && t.id !== state.meId
        ? `Renaming ${esc(t.name)}. Everyone sees the change.`
        : "Changes how you appear to everyone.";
    }
    return state.editMetric === "steps"
      ? "Your own daily target, in steps."
      : "Your own daily target, in minutes.";
  }

  // Train first. It is the one he acts on, and the first thing on a screen
  // is the thing the screen is about.
  // One chart. Which one is the segment's business, not the chart's.
  // DELETED in V1.6: statsHTML (daily average, best day, goal hit) and the
  // chartsHTML wrapper. Averages and best days are outcomes. The execution
  // rate is the thing you actually control, so one number replaces three.
  //
  // The score is computed server-side over the person's own 12-week cycle,
  // because the denominator is days ELAPSED — which only the server knows,
  // and which a phone left shut for a week would get wrong in exactly the
  // flattering direction.
  // DELETED in V2.1: execOf and kpiWords, along with the execution score.

  // DELETED in V1.7: scoreChip (the rate now lives on the category header,
  // which is where a pillar-level number belongs), engines (the three home
  // tiles replaced them) and commandCentre (steps-only, always rendered;
  // replaced by famBlock, which is per metric and behind a fold).

  // The family block on a metric page. Folded by default and fetched only
  // when it is opened, so the common case — land, type a number, leave —
  // costs one round trip rather than four.
  function famOpen() {
    try { return localStorage.getItem("fhd.fam") === "open"; } catch { return false; }
  }

  const fmtFam = (k, v) => {
    const met = M[k] || {};
    if (v === null || v === undefined) return "\u2013";
    if (met.time) return clockWords(v);
    if (met.bits) return scorePct(v) + "%";
    return Number(v) > 0 ? num(Math.round(v)) : "\u2013";
  };

  function famBlock() {
    const k = state.seg;
    const open = state.fam.open;
    const rows = state.fam.data[k];
    const mine = state.meId;

    let body = "";
    if (!open) body = "";
    else if (!rows) body = `<p class="loading">Loading\u2026</p>`;
    else {
      const others = rows.filter((r) => r.id !== mine);
      body = others.length
        ? others.map((r) => {
            const days = (r.days || []).map(Number);
            // V1.7b: Cardio has a minimum standard now, like the other two.
            const goal = Number(r.goal) || 0;
            const base = goal || Math.max(1, ...days);
            const initials = r.name.trim().split(/\s+/).slice(0,2)
              .map((w) => (w[0] || "").toUpperCase()).join("");
            const today = Number(r.today) || 0;
            return `<div class="frow${today !== null && today !== undefined
                      && (M[k].time || M[k].bits || today > 0) ? " did" : ""}">
              <span class="dot" aria-hidden="true"
                style="background:color-mix(in oklab, hsl(${r.hue} 62% 48%) 16%, var(--surface));
                       color:color-mix(in oklab, hsl(${r.hue} 62% 48%) 78%, var(--ink))"
                >${esc(initials)}</span>
              <span class="fname">${esc(r.name)}</span>
              ${sparkline(days.map((v) => v / base), r.hue, !!goal)}
              <span class="fval">${fmtFam(k, today)}</span>
            </div>`;
          }).join("")
        : `<p class="loading">Nobody else has been added yet.</p>`;
    }

    const logged = rows ? rows.filter((r) => Number(r.today) > 0).length : null;
    return `
      <section class="fam">
        <div class="section-head">
          <button class="foldbtn" id="foldFam" aria-expanded="${open}">
            <span class="caret">${open ? "\u25be" : "\u25b8"}</span>
            <h2>The family</h2></button>
          <span class="eyebrow">${logged === null ? "7-day trend"
            : `${logged}/${rows.length} logged`}</span>
        </div>
        ${body}
      </section>`;
  }

  async function loadFamily(force) {
    const k = state.seg;
    if (state.fam.data[k] && !force) return;
    const res = await call("app_family", {
      p_code: state.code, p_metric: M[k].key, p_days: 7 });
    state.fam.data[k] = res.error ? [] : (res.people || []);
  }

  /* ---------- home-screen hint --------------------------------------- */
  // Tomorrow's logging should be one tap on an icon, not a hunt through
  // WhatsApp for the link. Shown once per person, then never again.
  function standalone() {
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
  }
  function hintDismissed() {
    try { return localStorage.getItem("fhd.install") === "no"; } catch { return false; }
  }
  function installHint() {
    if (standalone() || hintDismissed() || !me()) return "";
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const how = ios
      ? "tap Share, then <b>Add to Home Screen</b>"
      : "open the browser menu, then <b>Add to Home screen</b>";
    return `<div class="install" id="installHint">
      <p>Make tomorrow one tap: ${how}. The icon opens straight here.</p>
      <button id="installNo" aria-label="Dismiss">&times;</button>
    </div>`;
  }

  /* ---------- the daily WhatsApp message ---------------------------- */
  // Written to be read in a chat, not on a dashboard: the standings first,
  // who is missing second, the link last. Asterisks are WhatsApp bold.
  function dailyMessage() {
    // V3.4. Four things per person and nothing else: Step Score, Train
    // and Cardio minutes, and the streak. Everyone who has any of the four
    // gets one line, best Step Score first. The family's name and the
    // date head it; the link closes it, because the link is how anyone
    // reading gets into the app.
    //
    // The day is the FAMILY's, whatever day the roster is showing, so a
    // post sent the morning after is yesterday complete in every zone.
    const past = !!state.boardDay;
    const day = new Date(famDayISO() + "T00:00:00Z").toLocaleDateString(undefined,
      { timeZone:"UTC", weekday:"short", month:"short", day:"numeric" });
    // Percent of each person's own standard, so ten different bodies are
    // compared on effort, not on one number some of them can never reach.
    const pctOf = (p) => {
      const t = target(p, "steps");
      return t > 0 && bval(p, "steps") > 0 ? Math.round(bval(p, "steps") / t * 100) : null;
    };
    // A streak is a today fact: yesterday's post cannot know it.
    const streakOf = (p) => !past && p.streak > 1 ? p.streak : 0;
    const rows = state.people.filter((p) => pctOf(p) !== null || bval(p, "train") > 0
      || bval(p, "cardio") > 0 || streakOf(p));
    rows.sort((a, b) => (pctOf(b) ?? -1) - (pctOf(a) ?? -1));

    const lines = [`*${state.group.name}* · ${day}`, ""];
    for (const p of rows) {
      const bits = [];
      if (pctOf(p) !== null)     bits.push(`Step Score ${pctOf(p)}%`);
      if (bval(p, "train") > 0)  bits.push(`Train ${hm(bval(p, "train"))}`);
      if (bval(p, "cardio") > 0) bits.push(`Cardio ${hm(bval(p, "cardio"))}`);
      if (streakOf(p))           bits.push(`${streakOf(p)}-day streak`);
      lines.push(`*${p.name}* — ${bits.join(" · ")}`);
    }
    if (!rows.length) lines.push("Nothing logged yet.");
    lines.push("", `${location.origin}${location.pathname}?g=${state.code}`);
    return lines.join("\n");
  }


  /* =================================================================
     V1.3 — LIFT

     The session being lifted lives in localStorage, not in the database.
     A gym is a concrete box with no signal, and a set that fails to save
     is the thing that sends someone back to the app that never loses one.
     So: every tap writes locally and synchronously, and the network is a
     background reconciliation that is allowed to fail. `app_lift_save`
     takes the whole session and is idempotent, so a retry is free.
     ================================================================= */

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
    : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
        const r = Math.random() * 16 | 0;
        return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16); }));

  /* ---------- units -------------------------------------------------
     The database stores pounds and metres, always. What a phone shows is
     a setting on that phone, so someone in Karachi enters kilos and metres
     while you enter pounds and miles, and the stored numbers stay
     comparable. Convert at the edges, never in the middle.
     ------------------------------------------------------------------ */
  const LB_PER_KG = 2.2046226218;
  const M_PER_MI  = 1609.344;

  const units = {
    get w() { try { return localStorage.getItem("fhd.unit.w") || "lb"; } catch { return "lb"; } },
    get d() { try { return localStorage.getItem("fhd.unit.d") || "mi"; } catch { return "mi"; } },
    set w(v) { try { localStorage.setItem("fhd.unit.w", v); } catch {} },
    set d(v) { try { localStorage.setItem("fhd.unit.d", v); } catch {} },
  };

  // stored (lb) -> shown ;  shown -> stored
  const wOut = (lb) => units.w === "kg" ? Number(lb) / LB_PER_KG : Number(lb);
  const wIn  = (v)  => units.w === "kg" ? Number(v) * LB_PER_KG  : Number(v);
  const dOut = (m) => units.d === "km" ? Number(m) / 1000
                    : units.d === "m"  ? Number(m)
                    : Number(m) / M_PER_MI;
  const dIn  = (v) => units.d === "km" ? Number(v) * 1000
                    : units.d === "m"  ? Number(v)
                    : Number(v) * M_PER_MI;

  const wShow = (lb) => { const v = wOut(lb);
    return units.w === "kg" ? (Math.round(v * 10) / 10) : Math.round(v); };
  const dShow = (m) => { const v = dOut(m); return Math.round(v * 100) / 100; };

  // Metres read better than 0.31 mi for a pool. Under 1000 m stays metric
  // whatever the setting, because that is how swimmers actually talk.
  function distWords(m) {
    m = Number(m) || 0;
    if (m <= 0) return "";
    if (m < 1000) return Math.round(m) + " m";
    return dShow(m) + " " + units.d;
  }
  const mmss = (sec) => {
    sec = Math.max(0, Math.round(Number(sec) || 0));
    const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, x = sec % 60;
    return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`;
  };
  const parseClock = (t) => {
    const parts = String(t || "").split(":").map((n) => Number(n) || 0);
    if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
    if (parts.length === 2) return parts[0]*60 + parts[1];
    return parts[0] * 60;                       // a bare number means minutes
  };

  // Lift and Cardio each keep their own in-progress draft, so starting a
  // swim does not throw away a half-logged leg day.
  const liftKey = () => `fhd.lift.${state.code}.${state.meId}.${state.mode}`;
  const exKey   = () => `fhd.ex.${state.code}.${state.meId}.${state.mode}`;

  // V3.4 BUG FIX. A draft is filed under its OWN mode. It used to be filed
  // under whichever page was open, so a Train workout could be saved into
  // the Cardio slot, or a finish could clear the wrong slot and leave a
  // finished workout lying around as a draft.
  const liftKeyFor = (mode) => `fhd.lift.${state.code}.${state.meId}.${mode === "cardio" ? "cardio" : "lift"}`;
  function saveLocal(mode) {
    const a = state.lift.active;
    try {
      if (a) localStorage.setItem(liftKeyFor(a.mode || state.mode), JSON.stringify(a));
      else localStorage.removeItem(liftKeyFor(mode || state.mode));
    } catch {}
  }
  function loadLocal() {
    try {
      const raw = localStorage.getItem(liftKey());
      state.lift.active = raw ? JSON.parse(raw) : null;
    } catch { state.lift.active = null; }
  }
  function cacheExercises(list) {
    state.lift.exercises = list || [];
    try { localStorage.setItem(exKey(), JSON.stringify(state.lift.exercises)); } catch {}
  }
  function cachedExercises() {
    try { return JSON.parse(localStorage.getItem(exKey()) || "[]"); } catch { return []; }
  }

  const A = () => state.lift.active;

  function elapsedMs(a) { return Math.max(0, (a.endedAt || Date.now()) - a.startedAt); }
  function clock(ms) {
    const s = Math.floor(ms / 1000);
    return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  }
  const setSeconds = (a) => (a.ex || []).reduce((t, x) =>
    t + x.sets.reduce((u, s) => u + (Number(s.t) || 0), 0), 0);

  // V2.1b. Three sources, in order of how much they know.
  //   * a number you typed always wins;
  //   * Cardio adds up the times you logged per activity — it has no
  //     running clock, because the clock was measuring the same thing
  //     twice and the logged times are the honest version;
  //   * Train keeps the stopwatch, which is genuinely useful between sets.
  function durationMin(a) {
    if (a.durOverride !== null && a.durOverride !== undefined)
      return Math.max(0, Math.round(Number(a.durOverride) || 0));
    if ((a.mode || state.mode) === "cardio")
      return Math.max(1, Math.ceil(setSeconds(a) / 60));
    return Math.max(1, Math.round(elapsedMs(a) / 60000));
  }

  // V1.4 deleted volume. What a session is worth is what you did in it,
  // not a number that rewards doing light things many times.
  function distanceOf(a) {
    let m = 0;
    for (const x of a.ex) for (const s of x.sets) if (counts(s, x.kind)) m += Number(s.d) || 0;
    return m;
  }
  function totalsWords(a) {
    const n = doneSets(a);
    const d = distanceOf(a);
    const bits = [];
    if (d > 0) bits.push(distWords(d));
    bits.push(n + (state.mode === "cardio" ? (n === 1 ? " entry" : " entries")
                                           : (n === 1 ? " set"   : " sets")));
    return bits.join(" \u00b7 ");
  }
  // V3.4. A set counts if you ticked it OR typed in it. The numbers a
  // template carries over from last time are a suggestion, drawn grey,
  // and count only once you tick or change them. So: update the numbers
  // you did, leave the sets you skipped, press Finish. No question asked.
  const hasNumsSet = (st, kind) => kind === "duration" ? st.t > 0
    : kind === "distance_time" ? (st.d > 0 || st.t > 0) : (st.w > 0 || st.r > 0);
  // What the boxes were filled with: the template's numbers (V3.5), or
  // last time's for a draft saved before them.
  const seedOf = (s) => s.s0 || (s.pw !== undefined ? { w: s.pw, r: s.pr, d: s.pd, t: s.pt } : null);
  const untouched = (s) => { const z = seedOf(s); return !s.typed && !!z &&
    (Number(s.w) || 0) === (Number(z.w) || 0) && (Number(s.r) || 0) === (Number(z.r) || 0) &&
    (Number(s.d) || 0) === (Number(z.d) || 0) && (Number(s.t) || 0) === (Number(z.t) || 0); };
  const counts = (s, kind) => !!s.on || (hasNumsSet(s, kind) && !untouched(s));
  function doneSets(a) {
    let n = 0;
    for (const x of a.ex) for (const s of x.sets) if (counts(s, x.kind)) n++;
    return n;
  }

  // Only confirmed sets cross the wire. A half-filled row you never ticked
  // is a thought, not a lift, and it should not end up in anyone's volume.
  function setsPayload(a) {
    const out = [];
    a.ex.forEach((x, pos) => x.sets.forEach((s, i) => {
      if (!counts(s, x.kind) || !String(x.name || "").trim()) return;
      out.push({ position: pos, set_index: i, exercise: x.name.trim(),
                 kind: x.kind || "weight_reps",
                 weight: Number(s.w) || 0, reps: Number(s.r) || 0,
                 distance: Number(s.d) || 0, seconds: Number(s.t) || 0 });
    }));
    return out;
  }

  let syncTimer = null;
  function queueSync() {
    saveLocal();
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncLift(false), 2500);
  }

  async function syncLift(finish) {
    const a = A();
    if (!a || !state.meId) return {};
    if (finish) { a.endedAt = a.endedAt || Date.now(); a.pendingFinish = true; }
    saveLocal();

    if (!navigator.onLine) { setSync("offline"); return { offline: true }; }
    setSync("saving");

    const res = await call("app_lift_save", {
      p_code: state.code, p_person: state.meId, p_session: a.id,
      p_label: a.label || "", p_note: a.note || null, p_date: a.date,
      p_duration: durationMin(a), p_sets: setsPayload(a),
      // V3.4. A past workout being edited is already finished. Autosaving
      // it as unfinished hid it from History until Finish was pressed, and
      // for ever if it never was.
      p_finished: !!(finish || a.pendingFinish || a.edit), p_mode: a.mode || state.mode,
      p_tz: deviceTZ(),
      // Somebody typed this duration, or edited the session from History.
      // Either way it is a deliberate statement about that day.
      p_claim: a.durOverride !== null && a.durOverride !== undefined,
    });

    if (res.error) { setSync("offline"); return res; }
    setSync("saved");
    return res;
  }

  function setSync(s) {
    state.lift.sync = s;
    const el = document.getElementById("syncChip");
    if (el) { el.className = "sync " + s; el.textContent = syncWords(s); }
  }
  function syncWords(s) {
    return s === "saving" ? "Saving" : s === "saved" ? "Saved"
         : s === "offline" ? "Offline · will sync" : "";
  }

  // A finish that happened with no signal is still a finished workout. It
  // sits in localStorage until the phone is back, then goes up by itself.
  async function flushPending() {
    loadLocal();
    const a = A();
    if (!a || !a.pendingFinish || !navigator.onLine || !state.meId) return;
    const res = await syncLift(true);
    if (!res.error && !res.offline) {
      state.lift.active = null;
      saveLocal();
      state.lift.loaded = false;
    }
  }

  async function loadLift() {
    if (!state.meId) return;
    state.lift.exercises = cachedExercises();
    const res = await call("app_lift_home", {
      p_code: state.code, p_person: state.meId, p_limit: 20, p_mode: state.mode });
    if (res.error) { state.lift.msg = res.error; return; }
    state.lift.labels   = res.labels   || [];
    state.lift.sessions = res.sessions || [];
    if ((res.exercises || []).length) cacheExercises(res.exercises);
    state.lift.loaded = true;
    await recoverLift();
  }

  // V3.4. The draft lives on the phone, and a phone can lose it: Safari
  // and the home-screen icon keep separate storage, and a cleared browser
  // clears it. Every few seconds a workout in progress is also on the
  // server, so if this phone has nothing, the server's copy from the last
  // twelve hours comes back as the workout in progress.
  async function recoverLift() {
    if (A() || !state.meId || !navigator.onLine) return;
    const mode = state.mode;
    const res = await call("app_lift_open", { p_code: state.code, p_person: state.meId, p_mode: mode });
    const s = res && res.session;
    if (!s || A() || state.mode !== mode) return;
    const byPos = new Map();
    for (const r of (s.sets || [])) {
      if (!byPos.has(r.position)) byPos.set(r.position, { name: r.exercise, kind: r.kind || "weight_reps", sets: [] });
      byPos.get(r.position).sets.push({ w: Number(r.weight) || 0, r: Number(r.reps) || 0,
        d: Number(r.distance) || 0, t: Number(r.seconds) || 0, on: true });
    }
    state.lift.active = { id: s.id, label: s.label || "", note: s.note || "", date: s.entry_date,
      startedAt: Date.parse(s.created_at) || Date.now(), endedAt: null, pendingFinish: false,
      mode: s.mode || mode, durOverride: null, fromTile: !!s.label, recovered: true,
      ex: [...byPos.entries()].sort((x, y) => x[0] - y[0]).map(([, v]) => v) };
    saveLocal();
  }

  // Starting a labelled day pulls the last one and lays it out ready to
  // tick off, weights and all. That is the whole reason there is no
  // template table: the last session already is the template.
  // V1.7. `iso` is which day the session belongs to. Until now it was
  // always today with no way to say otherwise, which meant a Cardio
  // session missed on Tuesday could never be recorded at all.
  // V3.4 BUG FIX: "my workout was closed and wiped out." Tapping a
  // template tile, Start an Empty Workout, an empty bar on the chart, or
  // Edit on a past workout each started a NEW session on top of the one
  // in progress, silently, and the old one was gone. Now a workout with
  // anything in it is never replaced without a choice.
  const hasContent = (a) => !!a && (a.ex || []).some((x) => (x.sets || []).some((s) =>
    s.on || hasNumsSet(s, x.kind || "weight_reps")));
  function guardActive(then, what) {
    const cur = A();
    if (!cur || cur.pendingFinish || !hasContent(cur)) {
      if (cur && !cur.pendingFinish) dropServerCopy(cur);
      return then();
    }
    const name = cur.label || (cur.mode === "cardio" ? "An activity" : "A workout");
    openModal({
      title: `${name} is still in progress`,
      body: `${totalsWords(cur)} so far. Starting ${what} would replace it.`,
      buttons: [
        { label: `Resume ${cur.label || "it"}`, kind: "go",
          run: () => { state.mode = cur.mode || state.mode; state.view = "session"; render(); } },
        { label: `Discard it and start ${what}`, kind: "bad",
          run: () => { dropServerCopy(cur); state.lift.active = null; saveLocal(cur.mode); return then(); } },
        { label: "Cancel", kind: "quiet" },
      ],
    });
  }
  // A discarded workout must not come back from the server later.
  function dropServerCopy(a) {
    if (!a || !a.id || a.pendingFinish || a.edit) return;
    call("app_lift_delete", { p_code: state.code, p_person: state.meId, p_session: a.id });
  }

  function startSession(label, iso) {
    return guardActive(() => startSessionNow(label, iso), label ? `“${label}”` : "a new one");
  }
  async function startSessionNow(label, iso) {
    state.lift.msg = null;
    const a = { id: uuid(), label: label || "", date: iso || todayISO(),
                startedAt: Date.now(), endedAt: null, ex: [], pendingFinish: false,
                mode: state.mode, durOverride: null, note: "",
                // Started from a tile, so the name is settled.
                fromTile: !!label };

    // V1.7b. One call answers "what is this workout made of, and what did
    // I last lift for each part of it" — the explicit template if there is
    // one, the last session under that label if not. The LIST can now be
    // edited without doing the workout; the NUMBERS still come from what
    // was actually lifted, so they can never go stale.
    if (label && navigator.onLine) {
      const res = await call("app_template", {
        p_code: state.code, p_person: state.meId, p_label: label, p_mode: state.mode });
      const items = (res && res.items) || [];
      if (items.length) {
        a.ex = items.map((it) => {
          const last = Array.isArray(it.last) ? it.last : [];
          // V3.5. A template that holds numbers starts from them, as
          // Strong's do; one that does not follows last time. Either way
          // pw/pr/pd/pt stay what you actually did last time, and s0 is
          // what was put in the boxes, so a set counts only once you tick
          // it or change it.
          const vals = Array.isArray(it.vals) && it.vals.length ? it.vals : null;
          const n = Math.max(1, Number(it.sets) || last.length || 1);
          const sets = [];
          for (let i = 0; i < n; i++) {
            const prev = last[i] || last[last.length - 1] || {};
            const src = vals ? (vals[i] || vals[vals.length - 1] || {}) : prev;
            const w = Number(src.w) || 0, r = Number(src.r) || 0;
            const d = Number(src.d) || 0, t = Number(src.t) || 0;
            sets.push({ w, r, d, t, on: false, s0: { w, r, d, t },
                        pw: Number(prev.w) || 0, pr: Number(prev.r) || 0,
                        pd: Number(prev.d) || 0, pt: Number(prev.t) || 0 });
          }
          return { name: it.exercise, kind: it.kind || "weight_reps", sets };
        });
      }
    }

    // V2.8. Remember the shape this workout started from, so Finish can
    // tell whether you changed it — an exercise added or dropped, a set
    // more or fewer — and only then ask about the template.
    a.tmpl = a.ex.map((x) => ({ name: x.name, kind: x.kind, sets: x.sets.length,
      vals: x.sets.map((st) => ({ w: st.w, r: st.r, d: st.d, t: st.t })) }));

    state.lift.active = a;
    saveLocal();
    state.view = "session";
    render();
  }

  // A movement remembers what it is. "Pool Swim" comes back as metres and
  // a clock, "Yoga" as a clock, "Leg Press" as weight and reps — because
  // that is how you logged it last time, not because anything was set up.
  function kindFor(name, fallback) {
    const key = String(name).toLowerCase();
    const known = (state.lift.exercises || []).find(
      (e) => String(e.name || e).toLowerCase() === key);
    if (known && known.kind) return known.kind;
    for (const s of state.lift.sessions) {
      const hit = (s.exercises || []).find((e) => String(e.exercise).toLowerCase() === key);
      if (hit && hit.kind) return hit.kind;
    }
    // An explicit null means "only tell me if you already know", so a
    // brand-new name can take whatever the toggle says instead of
    // silently defaulting to weights.
    if (fallback === null) return null;
    return fallback || (state.mode === "cardio" ? "distance_time" : "weight_reps");
  }

  function addExercise(name, kind) {
    const a = A(); if (!a) return;
    const nm = String(name || "").trim();
    if (!nm) return;
    const k = kind || kindFor(nm);
    const prev = lastSetsFor(nm, k);
    a.ex.push({ name: nm, kind: k,
                sets: prev.length ? prev : [{ w:0, r:0, d:0, t:0, on:false }] });
    queueSync();
  }

  function lastSetsFor(name, kind) {
    const key = name.toLowerCase();
    for (const s of state.lift.sessions) {
      const hit = (s.exercises || []).find((e) => String(e.exercise).toLowerCase() === key);
      if (hit) {
        const n = Math.max(1, kind === "weight_reps" ? hit.sets : 1);
        const w = Number(hit.top_weight) || 0, r = Number(hit.top_reps) || 0;
        const d = Number(hit.distance) || 0;
        const t = Math.round((Number(hit.seconds) || 0) / Math.max(1, hit.sets));
        return Array.from({ length: n }, () => ({
          w, r, d, t, on: false, pw: w, pr: r, pd: d, pt: t }));
      }
    }
    return [];
  }

  /* ---------- lift views ------------------------------------------- */

  function agoWords(iso) {
    const d = Math.round((new Date(todayISO() + "T00:00:00Z") -
                          new Date(iso + "T00:00:00Z")) / 86400000);
    if (d <= 0) return "today";
    if (d === 1) return "yesterday";
    if (d < 7)  return d + " days ago";
    if (d < 14) return "last week";
    return Math.floor(d / 7) + " weeks ago";
  }
  const shortDay = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString(undefined,
    { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" });
  const fullDate = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString(undefined,
    { timeZone: "UTC", weekday: "long", month: "short", day: "numeric" });

  /* ---------- walking between days ------------------------------------
     V2.8. Someone could not find how to log yesterday's steps. The arrows
     were bare 19px glyphs in grey: they read as punctuation, not buttons.
     Now they are round, filled, thumb-sized buttons with a drawn chevron,
     and the label under the date says what to do next — "‹ earlier days"
     on today, a "Back to today" button on any other day. Same two-line
     block either way, so nothing on the page jumps when you step.
     ------------------------------------------------------------------ */
  const CHEV = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${
    d < 0 ? "M14.5 5.5 8 12l6.5 6.5" : "M9.5 5.5 16 12l-6.5 6.5"}"/></svg>`;
  function dayNav({ ids = ["dPrev", "dNext", "dToday"], label, atToday, unit = "day",
                    todayWord = "today", cls = "", openNext = false }) {
    return `
      <div class="daynav ${cls}">
        <button type="button" class="dnav" id="${ids[0]}" aria-label="Previous ${unit}">${CHEV(-1)}</button>
        <div class="dlabel">
          <span>${label}</span>
          ${atToday
            ? `<small>${openNext ? `&lsaquo; earlier · later &rsaquo;` : `&lsaquo; earlier ${unit}s`}</small>`
            : `<button type="button" class="dtoday" id="${ids[2]}">Back to ${todayWord} &rsaquo;</button>`}
        </div>
        <button type="button" class="dnav" id="${ids[1]}" aria-label="Next ${unit}"
          ${atToday && !openNext ? "disabled" : ""}>${CHEV(1)}</button>
      </div>`;
  }

  function bestSetWords(e) {
    if (e.kind === "duration")      return mmss(e.seconds);
    if (e.kind === "distance_time") return `${distWords(e.distance)} \u00b7 ${mmss(e.seconds)}`;
    return `${wShow(e.top_weight)} ${units.w} \u00d7 ${e.top_reps}`;
  }

  function sessionCard(s, clickable) {
    const rows = (s.exercises || []).map((e) => `
      <tr><td class="nm">${e.kind === "weight_reps" ? e.sets + " &times; " : ""}${
            esc(e.exercise)}</td>
          <td>${bestSetWords(e)}</td></tr>`).join("");
    const meta = [`<span><b>${s.duration_min}m</b></span>`];
    if (Number(s.distance) > 0) meta.push(`<span><b>${distWords(s.distance)}</b></span>`);
    if (s.pr_count > 0)
      meta.push(`<span style="color:var(--train)"><b>${s.pr_count}</b> PR${
        s.pr_count === 1 ? "" : "s"}</span>`);
    return `
      <${clickable ? "button" : "div"} class="hcard" ${clickable ? `data-open="${s.id}"` : ""}>
        <h3>${esc(s.label || "Workout")}${s.note
          ? `<span class="hnote">${esc(s.note)}</span>` : ""}</h3>
        <p class="when">${esc(fullDate(s.entry_date))}</p>
        <div class="hmeta">${meta.join("")}</div>
        ${rows ? `<table class="htab"><thead><tr><th>${
                    state.mode === "cardio" ? "Activity" : "Exercise"}</th>
                  <th>${state.mode === "cardio" ? "Result" : "Best set"}</th></tr></thead>
                  <tbody>${rows}</tbody></table>` : ""}
      </${clickable ? "button" : "div"}>`;
  }

  function resumeBanner() {
    const a = A();
    if (!a || a.pendingFinish) return "";
    return `
      <div class="install" style="background:var(--train-soft)">
        <p><b style="color:var(--train)">${esc(a.label || "Workout")} in progress</b> &mdash;
           ${totalsWords(a)} logged.</p>
        <button class="btn-quiet" id="resume" style="flex:none">Resume</button>
      </div>`;
  }

  /* ---------- the first workout -------------------------------------
     V2.8. A new person opened Train, saw one button and an empty page, and
     logged nothing. A blank page asks you to already know the app. So until
     you have a single workout of your own, the page offers three real
     ones: tap one and it is laid out, ready to tick, and saved as your
     first tile. Every part of it can be changed as you go. Once you have
     any workout of your own this card is gone — it is scaffolding, not a
     feature.
     ------------------------------------------------------------------ */
  const STARTERS = {
    lift: [
      { label: "Full body", items: [
        ["Squat", "weight_reps", 3], ["Bench Press", "weight_reps", 3],
        ["Bent-over Row", "weight_reps", 3], ["Overhead Press", "weight_reps", 3],
        ["Plank", "duration", 2]] },
      { label: "Upper body", items: [
        ["Bench Press", "weight_reps", 3], ["Pull-up", "weight_reps", 3],
        ["Overhead Press", "weight_reps", 3], ["Bicep Curl", "weight_reps", 3],
        ["Tricep Pushdown", "weight_reps", 3]] },
      { label: "Lower body", items: [
        ["Squat", "weight_reps", 3], ["Romanian Deadlift", "weight_reps", 3],
        ["Lunge", "weight_reps", 3], ["Calf Raise", "weight_reps", 3]] },
    ],
    cardio: [
      { label: "Walk", items: [["Walk", "distance_time", 1]] },
      { label: "Run",  items: [["Run", "distance_time", 1]] },
      { label: "Swim", items: [["Pool Swim", "distance_time", 1]] },
    ],
  };
  const isFirst = () => state.lift.loaded && !state.lift.active &&
    !state.lift.labels.length && !state.lift.sessions.length;
  function firstCard(k) {
    if (!isFirst()) return "";
    const mode = k === "cardio" ? "cardio" : "lift";
    return `
      <section class="firstcard">
        <p class="eyebrow">Your first ${mode === "cardio" ? "activity" : "workout"}</p>
        <h2>Pick one to begin.</h2>
        <p class="hint" style="margin-top:4px">It opens ready to fill in. Add, drop or
          rename anything as you go.</p>
        <div class="starters">${STARTERS[mode].map((t) => `
          <button class="starter" data-starter="${esc(t.label)}">
            <b>${esc(t.label)}</b>
            <span>${t.items.map((x) => esc(x[0])).join(" · ")}</span>
          </button>`).join("")}</div>
      </section>`;
  }
  async function startStarter(label) {
    const t = (STARTERS[state.mode === "cardio" ? "cardio" : "lift"] || [])
      .find((x) => x.label === label);
    if (!t) return;
    const items = t.items.map(([exercise, kind, sets]) => ({ exercise, kind, sets }));
    const res = await call("app_template_save", { p_code: state.code, p_person: state.meId,
      p_label: t.label, p_mode: state.mode, p_items: items });
    if (res.error) { state.lift.msg = res.error; render(); return; }
    await loadLift();
    await startSession(t.label);
  }

  function liftTiles() {
    if (!state.lift.labels.length) return "";
    return `
      <section>
        <div class="section-head"><h2>My Templates</h2>
          <span class="eyebrow">tap to start</span></div>
        <div class="tiles">${state.lift.labels.map((l) => `
          <div class="tilewrap">
            <button class="tile" data-start="${esc(l.label)}">
              <b>${esc(l.label)}</b>
              <span class="ex">${esc(l.preview || "")}</span>
              <span class="ago">${esc(agoWords(l.last_date))}</span>
            </button>
            <button class="tilemenu" data-menu="${esc(l.label)}"
              aria-label="Options for ${esc(l.label)}">&hellip;</button>
            ${state.lift.menu === l.label ? `
              <div class="sheet">
                <button data-tmpl="${esc(l.label)}">Edit exercises</button>
                <button data-rename="${esc(l.label)}">Rename</button>
                <button data-drop="${esc(l.label)}">Remove tile</button>
              </div>` : ""}
          </div>`).join("")}</div>
        ${state.lift.rename !== null ? `
          <div class="addrow" style="margin-top:12px">
            <input class="field" id="renameVal" maxlength="24" autocomplete="off"
                   value="${esc(state.lift.rename)}" aria-label="New name">
            <button class="btn" id="renameGo" style="background:var(--train)">Save</button>
            <button class="btn-quiet" id="renameNo">Cancel</button>
            <p class="hint" style="flex-basis:100%;margin-top:0">Renames it on every
              session you logged under that name. The workouts themselves are untouched.</p>
          </div>` : ""}
        ${templateEditor()}
      </section>`;
  }

  /* ---------- editing what a workout is made of -----------------------
     V1.3 deliberately shipped without templates: the last session under a
     label WAS the template, so it could never drift from reality and
     there was nothing to maintain. That rule has one hole, and it is the
     one being closed here — you could not change a workout without doing
     it. Dropping an exercise from your Push day meant doing Push once
     without it.

     So the rule is layered rather than replaced. Save a list and it wins;
     clear the list and that label goes back to following your last
     session. Weights and reps are not stored: the list is yours, the
     numbers come from what you actually last lifted.
