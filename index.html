<body>

<div class="wrap" id="app">
  <div class="center"><p class="spinner">Loading&hellip;</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
(() => {
  "use strict";

  // Bump this when the file changes, so you can tell at a glance which
  // version a phone is actually running after a deploy.
  const APP_VERSION = "1.5";

  /* ---------- tiny helpers ---------------------------------------- */
  const app = document.getElementById("app");
  const pad = (n) => String(n).padStart(2, "0");
  const num = (n) => Number(n).toLocaleString();
  const esc = (s) => String(s).replace(/[&<>"']/g,
    (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  const todayISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  };
  const shiftISO = (iso, n) => {
    const d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  const dayLabel = (iso) => String(Number(iso.slice(8)));
  const longLabel = (iso) => new Date(iso + "T00:00:00Z")
    .toLocaleDateString(undefined, { timeZone:"UTC", month:"short", day:"numeric" });

  /* ---------- client ---------------------------------------------- */
  let sb = null;
  const configured =
    SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.length > 20;

  if (configured && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  async function call(fn, args) {
    const { data, error } = await sb.rpc(fn, args);
    if (error) return { error: error.message };
    return data || {};
  }

  // Exercise is ONE pillar with three numbers in it. Train is lifting and
  // yoga; Cardio is walking, running, swimming, the machines. V1.4 summed
  // them and that was wrong — they are different things, and keeping them
  // apart is what lets each have its own target and its own chart.
  const M = {
    steps:  { key:"steps",      label:"Steps",  unit:"steps",   color:"var(--series)", soft:"var(--soft)" },
    train:  { key:"train_min",  label:"Train",  unit:"minutes", color:"var(--train)",  soft:"var(--train-soft)" },
    cardio: { key:"cardio_min", label:"Cardio", unit:"minutes", color:"var(--swim)",   soft:"var(--swim-soft)" },
  };

  // The five pillars, in the order they will always appear. Four are dark
  // and unclickable until they are measured; showing them anyway is the
  // honest version of a roadmap, and it stops the board from being
  // redesigned when each one arrives.
  const PILLARS = [
    { key:"exercise",   label:"Exercise",   live:true  },
    { key:"sleep",      label:"Sleep",      live:false },
    { key:"meditation", label:"Meditate",   live:false },
    { key:"diet",       label:"Diet",       live:false },
    { key:"focus",      label:"Great Work", live:false },
  ];

  const mondayOf = (iso) => {
    const d = new Date(iso + "T00:00:00Z");
    return shiftISO(iso, -((d.getUTCDay() + 6) % 7));
  };

  /* ---------- state ------------------------------------------------ */
  const state = {
    code: new URLSearchParams(location.search).get("g"),
    group: null,
    metric: { key:"steps", unit:"steps", default_target:8000 },
    people: [],
    meId: null,
    history: { steps: [], train: [], cardio: [] },
    adding: false,
    editing: null,        // null | 'name' | 'goal'
    editPerson: null,
    editMetric: "steps",
    entryDate: null,      // null means today
    msg: null,

    // V1.3. The board is still the whole app for nine people out of ten;
    // Lift is a place you go, not a thing on the board.
    view: "board",        // board | exercise | session | detail
    seg:  "steps",        // steps | train | cardio — the Exercise segment
    mode: "lift",         // lift | cardio — which log the segment is showing
    weekAnchor: null,     // Monday of the week on the charts; null means this week
    lift: {
      loaded: false,
      labels: [], sessions: [], exercises: [],
      detail: null,       // a session being read
      from: "lift",       // where the reader came from, so Back goes back
      active: null,       // the session being logged right now
      sync: "idle",       // idle | saving | saved | offline
      msg: null,
      menu: null,         // a tile's ... menu, by label
      rename: null,       // a tile being renamed
    },
  };

  if (state.code) state.code = state.code.toUpperCase();

  const meKey = () => `fhd.me.${state.code}`;
  const loadMe = () => { try { return localStorage.getItem(meKey()); } catch { return null; } };
  const saveMe = (id) => {
    state.meId = id;
    try { localStorage.setItem(meKey(), id); } catch {}
  };
  const me = () => state.people.find((p) => p.id === state.meId) || null;

  // The family board folds. Default open, because it is the reason the app
  // exists; remembered per phone, because on your own phone you may already
  // know what everyone did.
  function boardOpen() {
    try { return localStorage.getItem("fhd.board") !== "shut"; } catch { return true; }
  }

  /* ---------- data ------------------------------------------------- */
  async function refresh() {
    const res = await call("app_state", { p_code: state.code, p_today: todayISO() });
    if (res.error) { state.fatal = res.error; render(); return; }
    state.group = res.group;
    // Alphabetical, so a name is findable without reading the whole list.
    state.people = (res.people || []).slice().sort((a, b) =>
      a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
    if (!state.people.some((p) => p.id === state.meId)) state.meId = loadMe();
    if (!state.people.some((p) => p.id === state.meId)) state.meId = null;
    await loadHistory();
    render();
  }

  // Today's numbers for one person, by short metric name.
  const val = (p, k) => Number(
    k === "steps" ? p.steps : k === "train" ? p.train_min : p.cardio_min) || 0;
  const target = (p, k) => k === "steps" ? Number(p.steps_target) || 0
                         : k === "train" ? Number(p.train_target) || 0 : 0;

  // One window, both metrics. The week view is a real Monday-to-Sunday
  // calendar week, so everyone is looking at the same seven columns.
  function weekBounds() {
    const start = state.weekAnchor || mondayOf(entryDay());
    return { start, end: shiftISO(start, 6) };
  }
  const thisMonday = () => mondayOf(todayISO());
  function weekWords() {
    const { start, end } = weekBounds();
    if (start === thisMonday()) return "This week";
    if (start === shiftISO(thisMonday(), -7)) return "Last week";
    return longLabel(start) + " \u2013 " + longLabel(end);
  }

  async function loadHistory() {
    if (!state.meId) { state.history = { steps: [], train: [], cardio: [] }; return; }
    const anchor = weekBounds().end;
    const keys = ["steps","train","cardio"];
    const got = await Promise.all(keys.map((k) => call("app_history", {
      p_code:state.code, p_person:state.meId,
      p_days:7, p_metric:M[k].key, p_today:anchor })));
    keys.forEach((k, i) => { state.history[k] = got[i].error ? [] : (got[i].days || []); });
  }

  /* ---------- which day is being logged ----------------------------- */
  const entryDay = () => state.entryDate || todayISO();


  // What is already recorded for the day on screen. The week is already
  // loaded for the chart, so there is nothing to fetch — which is what let
  // `app_value`, `ensureDay` and the whole byDate cache be deleted.
  function dayRecord(k) {
    const iso = entryDay();
    const m = me();
    if (iso === todayISO() && m)
      return { value: val(m, k), logged: k === "steps" ? !!m.steps_logged : val(m, k) > 0 };
    const d = (state.history[k] || []).find((x) => x.date === iso);
    return { value: d ? Number(d.value) : 0, logged: d ? d.logged : false };
  }

  /* ---------- chart ------------------------------------------------ */
  const DOW = ["M","T","W","T","F","S","S"];

  function points(k) {
    return (state.history[k] || []).map((d, i) => ({
      key:d.date, label:DOW[i] || dayLabel(d.date), value:Number(d.value),
      logged:d.logged, full:longLabel(d.date),
    }));
  }

  // One mini chart per metric, stacked, sharing the same columns. Steps and
  // minutes cannot honestly share a y-axis, so they each keep their own.
  function miniChart(k) {
    const met = M[k];
    const pts = points(k);
    if (!pts.length) return "";

    const goal = target(me() || {}, k);

    const H = 96, PT = 10, PB = 4, plot = H - PT - PB;
    const peak = Math.max(...pts.map((p) => p.value), goal || 0, 1);
    const max = peak * 1.15;
    const y = (v) => PT + plot - (v / max) * plot;
    const n = pts.length, slot = 100 / n, bw = slot * 0.52;

    let bars = "";
    pts.forEach((p, i) => {
      const x = i * slot + (slot - bw) / 2;
      if (p.value <= 0) {
        bars += `<rect x="${x}" y="${PT}" width="${bw}" height="${plot}" fill="transparent"
                  data-day="${p.key}" data-metric="${k}"></rect>` +
                `<rect x="${x}" y="${y(0)-2}" width="${bw}" height="2" fill="${met.soft}"
                  pointer-events="none"></rect>`;
        return;
      }
      bars += `<rect x="${x}" y="${y(p.value)}" width="${bw}" height="${Math.max(y(0)-y(p.value),2)}"
                rx="${Math.min(bw/2,1.4)}" fill="${met.color}" data-day="${p.key}"
                data-metric="${k}"></rect>`;
    });

    const goalLine = goal && goal <= max
      ? `<line x1="0" x2="100" y1="${y(goal)}" y2="${y(goal)}" stroke="${met.color}"
           stroke-width="1" stroke-dasharray="3 3" opacity="0.8" vector-effect="non-scaling-stroke"></line>` : "";

    const every = n <= 14 ? 1 : Math.ceil(n / 8);
    const axis = pts.map((p, i) =>
      `<span style="width:${slot}%">${i % every === 0 ? p.label : ""}</span>`).join("");

    const total = pts.reduce((t, p) => t + p.value, 0);
    const totalWords = k === "steps"
      ? `${num(Math.round(total))} steps` : `${num(Math.round(total))} minutes`;

    // The goal is edited by tapping the line it controls.
    const goalTap = k === "cardio" ? ""
      : `<button class="tapedit small" data-edit="goal" data-metric="${k}">${
           goal ? "goal " + num(goal) + (k === "steps" ? "" : " min") : "set a goal"}</button>`;

    return `
      <div class="mini">
        <div class="mini-head">
          <span class="mini-name" style="color:${met.color}">${met.label}</span>
          <span class="mini-total">${totalWords}</span>
        </div>
        <div class="chart" id="chart-${k}" data-chart="${k}">
          <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" role="img"
               aria-label="${met.label} for the period shown">
            <line x1="0" x2="100" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-strong)"
                  stroke-width="1" vector-effect="non-scaling-stroke"></line>
            ${bars}${goalLine}
          </svg>
          <div class="axis">${axis}</div>
        </div>
        <div class="mini-foot">${goalTap}</div>
      </div>`;
  }

  function editTarget() {
    return state.people.find((x) => x.id === (state.editPerson || state.meId)) || null;
  }
  function editSeed() {
    if (state.editing === "name") return esc(editTarget() ? editTarget().name : "");
    return Math.round(target(me() || {}, state.editMetric)) ||
           (state.editMetric === "steps" ? 8000 : 40);
  }
  function editHintText() {
    if (state.editing === "name") {
      const t = editTarget();
      return t && t.id !== state.meId
        ? `Renaming ${esc(t.name)}. Everyone sees the change.`
        : "Changes how you appear to everyone.";
    }
    return state.editMetric === "steps"
      ? "Your own daily target, in steps."
      : "Your own daily target, in minutes.";
  }

  // Train first. It is the one he acts on, and the first thing on a screen
  // is the thing the screen is about.
  // One chart. Which one is the segment's business, not the chart's.
  function chartsHTML() { return miniChart(state.seg); }

  function statsHTML() {
    const k = state.seg;
    const pts = points(k);
    const logged = pts.filter((p) => p.logged);
    const avg = logged.length
      ? Math.round(logged.reduce((s, p) => s + p.value, 0) / logged.length) : 0;
    const best = pts.reduce((m, p) => Math.max(m, p.value), 0);
    const goal = target(me() || {}, k);
    const hit = (!pts.length || !goal)
      ? null : Math.round((pts.filter((p) => p.value >= goal).length / pts.length) * 100);
    const days = pts.filter((p) => p.value > 0).length;
    const cells = [
      [num(avg), "Daily average"],
      [num(best), "Best day"],
      hit === null ? [String(days), "Days logged"] : [hit + "%", "Goal hit"],
    ];
    return `<div class="stats">${cells.map(([v, l]) =>
      `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("")}</div>`;
  }

  /* ---------- home-screen hint --------------------------------------- */
  // Tomorrow's logging should be one tap on an icon, not a hunt through
  // WhatsApp for the link. Shown once per person, then never again.
  function standalone() {
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
  }
  function hintDismissed() {
    try { return localStorage.getItem("fhd.install") === "no"; } catch { return false; }
  }
  function installHint() {
    if (standalone() || hintDismissed() || !me()) return "";
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const how = ios
      ? "tap Share, then <b>Add to Home Screen</b>"
      : "open the browser menu, then <b>Add to Home screen</b>";
    return `<div class="install" id="installHint">
      <p>Make tomorrow one tap: ${how}. The icon opens straight here.</p>
      <button id="installNo" aria-label="Dismiss">&times;</button>
    </div>`;
  }

  /* ---------- the daily WhatsApp message ---------------------------- */
  // Written to be read in a chat, not on a dashboard: the standings first,
  // who is missing second, the link last. Asterisks are WhatsApp bold.
  function dailyMessage() {
    const anyLog = (p) => val(p,"steps") > 0 || val(p,"train") > 0 || val(p,"cardio") > 0;
    const done = state.people.filter(anyLog);
    const missing = state.people.filter((p) => !anyLog(p));
    const hit = state.people.filter((p) => p.done);
    const day = new Date().toLocaleDateString(undefined,
      { weekday:"short", month:"short", day:"numeric" });

    const lines = [
      `*${state.group.name}* \u00b7 ${day}`,
      `${done.length}/${state.people.length} logged \u00b7 ${hit.length} moved`,
      "",
    ];

    // Ranked here, unlike the app: a chat message is skimmed once and the
    // order is what makes it worth reading. Train is appended only for the
    // people who did some, so ten relatives is not a wall of text.
    const sorted = [...done].sort((a, b) => val(b,"steps") - val(a,"steps"));
    for (const p of sorted) {
      const met = !!p.done;
      // Steps and minutes only \u2014 no pounds, no kilometres, nothing a
      // relative has to convert in their head before the line means
      // something. Train and Cardio are named because they are different
      // things and the family should see which one you did.
      const bits = [];
      if (val(p, "steps") > 0)  bits.push(num(val(p, "steps")));
      if (val(p, "train") > 0)  bits.push(num(val(p, "train")) + "m train");
      if (val(p, "cardio") > 0) bits.push(num(val(p, "cardio")) + "m cardio");
      const streak = p.streak > 1 ? `  (${p.streak}-day streak)` : "";
      lines.push(`${met ? "\u2705" : "\u25ab\ufe0f"} ${p.name} \u2014 ${bits.join(" \u00b7 ")}${streak}`);
    }

    if (missing.length) {
      lines.push("", `Still to log: ${missing.map((p) => p.name).join(", ")}`);
    }
    lines.push("", `${location.origin}${location.pathname}?g=${state.code}`);
    return lines.join("\n");
  }



  /* =================================================================
     V1.3 — LIFT

     The session being lifted lives in localStorage, not in the database.
     A gym is a concrete box with no signal, and a set that fails to save
     is the thing that sends someone back to the app that never loses one.
     So: every tap writes locally and synchronously, and the network is a
     background reconciliation that is allowed to fail. `app_lift_save`
     takes the whole session and is idempotent, so a retry is free.
     ================================================================= */

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
    : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
        const r = Math.random() * 16 | 0;
        return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16); }));

  /* ---------- units -------------------------------------------------
     The database stores pounds and metres, always. What a phone shows is
     a setting on that phone, so someone in Karachi enters kilos and metres
     while you enter pounds and miles, and the stored numbers stay
     comparable. Convert at the edges, never in the middle.
     ------------------------------------------------------------------ */
  const LB_PER_KG = 2.2046226218;
  const M_PER_MI  = 1609.344;

  const units = {
    get w() { try { return localStorage.getItem("fhd.unit.w") || "lb"; } catch { return "lb"; } },
    get d() { try { return localStorage.getItem("fhd.unit.d") || "mi"; } catch { return "mi"; } },
    set w(v) { try { localStorage.setItem("fhd.unit.w", v); } catch {} },
    set d(v) { try { localStorage.setItem("fhd.unit.d", v); } catch {} },
  };

  // stored (lb) -> shown ;  shown -> stored
  const wOut = (lb) => units.w === "kg" ? Number(lb) / LB_PER_KG : Number(lb);
  const wIn  = (v)  => units.w === "kg" ? Number(v) * LB_PER_KG  : Number(v);
  const dOut = (m) => units.d === "km" ? Number(m) / 1000
                    : units.d === "m"  ? Number(m)
                    : Number(m) / M_PER_MI;
  const dIn  = (v) => units.d === "km" ? Number(v) * 1000
                    : units.d === "m"  ? Number(v)
                    : Number(v) * M_PER_MI;

  const wShow = (lb) => { const v = wOut(lb);
    return units.w === "kg" ? (Math.round(v * 10) / 10) : Math.round(v); };
  const dShow = (m) => { const v = dOut(m); return Math.round(v * 100) / 100; };

  // Metres read better than 0.31 mi for a pool. Under 1000 m stays metric
  // whatever the setting, because that is how swimmers actually talk.
  function distWords(m) {
    m = Number(m) || 0;
    if (m <= 0) return "";
    if (m < 1000) return Math.round(m) + " m";
    return dShow(m) + " " + units.d;
  }
  const mmss = (sec) => {
    sec = Math.max(0, Math.round(Number(sec) || 0));
    const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, x = sec % 60;
    return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`;
  };
  const parseClock = (t) => {
    const parts = String(t || "").split(":").map((n) => Number(n) || 0);
    if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
    if (parts.length === 2) return parts[0]*60 + parts[1];
    return parts[0] * 60;                       // a bare number means minutes
  };

  // Lift and Cardio each keep their own in-progress draft, so starting a
  // swim does not throw away a half-logged leg day.
  const liftKey = () => `fhd.lift.${state.code}.${state.meId}.${state.mode}`;
  const exKey   = () => `fhd.ex.${state.code}.${state.meId}.${state.mode}`;
  const MODE = () => (state.mode === "cardio"
    ? { key:"cardio", title:"Cardio", verb:"activity", start:"Start an activity" }
    : { key:"lift",   title:"Lift",   verb:"exercise", start:"Start an empty workout" });

  function saveLocal() {
    try {
      if (state.lift.active) localStorage.setItem(liftKey(), JSON.stringify(state.lift.active));
      else localStorage.removeItem(liftKey());
    } catch {}
  }
  function loadLocal() {
    try {
      const raw = localStorage.getItem(liftKey());
      state.lift.active = raw ? JSON.parse(raw) : null;
    } catch { state.lift.active = null; }
  }
  function cacheExercises(list) {
    state.lift.exercises = list || [];
    try { localStorage.setItem(exKey(), JSON.stringify(state.lift.exercises)); } catch {}
  }
  function cachedExercises() {
    try { return JSON.parse(localStorage.getItem(exKey()) || "[]"); } catch { return []; }
  }

  const A = () => state.lift.active;

  function elapsedMs(a) { return Math.max(0, (a.endedAt || Date.now()) - a.startedAt); }
  function clock(ms) {
    const s = Math.floor(ms / 1000);
    return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  }
  const durationMin = (a) => Math.max(1, Math.round(elapsedMs(a) / 60000));

  // V1.4 deleted volume. What a session is worth is what you did in it,
  // not a number that rewards doing light things many times.
  function distanceOf(a) {
    let m = 0;
    for (const x of a.ex) for (const s of x.sets) if (s.on) m += Number(s.d) || 0;
    return m;
  }
  function totalsWords(a) {
    const n = doneSets(a);
    const d = distanceOf(a);
    const bits = [];
    if (d > 0) bits.push(distWords(d));
    bits.push(n + (state.mode === "cardio" ? (n === 1 ? " entry" : " entries")
                                           : (n === 1 ? " set"   : " sets")));
    return bits.join(" \u00b7 ");
  }
  function doneSets(a) {
    let n = 0;
    for (const x of a.ex) for (const s of x.sets) if (s.on) n++;
    return n;
  }

  // Only confirmed sets cross the wire. A half-filled row you never ticked
  // is a thought, not a lift, and it should not end up in anyone's volume.
  function setsPayload(a) {
    const out = [];
    a.ex.forEach((x, pos) => x.sets.forEach((s, i) => {
      if (!s.on || !String(x.name || "").trim()) return;
      out.push({ position: pos, set_index: i, exercise: x.name.trim(),
                 kind: x.kind || "weight_reps",
                 weight: Number(s.w) || 0, reps: Number(s.r) || 0,
                 distance: Number(s.d) || 0, seconds: Number(s.t) || 0 });
    }));
    return out;
  }

  let syncTimer = null;
  function queueSync() {
    saveLocal();
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncLift(false), 2500);
  }

  async function syncLift(finish) {
    const a = A();
    if (!a || !state.meId) return {};
    if (finish) { a.endedAt = a.endedAt || Date.now(); a.pendingFinish = true; }
    saveLocal();

    if (!navigator.onLine) { setSync("offline"); return { offline: true }; }
    setSync("saving");

    const res = await call("app_lift_save", {
      p_code: state.code, p_person: state.meId, p_session: a.id,
      p_label: a.label || "", p_date: a.date,
      p_duration: durationMin(a), p_sets: setsPayload(a),
      p_finished: !!(finish || a.pendingFinish), p_mode: state.mode,
    });

    if (res.error) { setSync("offline"); return res; }
    setSync("saved");
    return res;
  }

  function setSync(s) {
    state.lift.sync = s;
    const el = document.getElementById("syncChip");
    if (el) { el.className = "sync " + s; el.textContent = syncWords(s); }
  }
  function syncWords(s) {
    return s === "saving" ? "Saving" : s === "saved" ? "Saved"
         : s === "offline" ? "Offline · will sync" : "";
  }

  // A finish that happened with no signal is still a finished workout. It
  // sits in localStorage until the phone is back, then goes up by itself.
  async function flushPending() {
    loadLocal();
    const a = A();
    if (!a || !a.pendingFinish || !navigator.onLine || !state.meId) return;
    const res = await syncLift(true);
    if (!res.error && !res.offline) {
      state.lift.active = null;
      saveLocal();
      state.lift.loaded = false;
    }
  }

  async function loadLift() {
    if (!state.meId) return;
    state.lift.exercises = cachedExercises();
    const res = await call("app_lift_home", {
      p_code: state.code, p_person: state.meId, p_limit: 20, p_mode: state.mode });
    if (res.error) { state.lift.msg = res.error; return; }
    state.lift.labels   = res.labels   || [];
    state.lift.sessions = res.sessions || [];
    if ((res.exercises || []).length) cacheExercises(res.exercises);
    state.lift.loaded = true;
  }

  // Starting a labelled day pulls the last one and lays it out ready to
  // tick off, weights and all. That is the whole reason there is no
  // template table: the last session already is the template.
  async function startSession(label) {
    const a = { id: uuid(), label: label || "", date: todayISO(),
                startedAt: Date.now(), endedAt: null, ex: [], pendingFinish: false };

    if (label && navigator.onLine) {
      const res = await call("app_lift_detail", {
        p_code: state.code, p_person: state.meId, p_label: label, p_mode: state.mode });
      const prev = res && res.session;
      if (prev && prev.sets && prev.sets.length) {
        const byPos = new Map();
        for (const s of prev.sets) {
          if (!byPos.has(s.position))
            byPos.set(s.position, { name: s.exercise, kind: s.kind || "weight_reps", sets: [] });
          byPos.get(s.position).sets.push({
            w: Number(s.weight) || 0, r: Number(s.reps) || 0,
            d: Number(s.distance) || 0, t: Number(s.seconds) || 0, on: false });
        }
        a.ex = [...byPos.entries()].sort((x, y) => x[0] - y[0]).map(([, v]) => v);
      }
    }

    state.lift.active = a;
    saveLocal();
    state.view = "session";
    render();
  }

  // A movement remembers what it is. "Pool Swim" comes back as metres and
  // a clock, "Yoga" as a clock, "Leg Press" as weight and reps — because
  // that is how you logged it last time, not because anything was set up.
  function kindFor(name, fallback) {
    const key = String(name).toLowerCase();
    const known = (state.lift.exercises || []).find(
      (e) => String(e.name || e).toLowerCase() === key);
    if (known && known.kind) return known.kind;
    for (const s of state.lift.sessions) {
      const hit = (s.exercises || []).find((e) => String(e.exercise).toLowerCase() === key);
      if (hit && hit.kind) return hit.kind;
    }
    // An explicit null means "only tell me if you already know", so a
    // brand-new name can take whatever the toggle says instead of
    // silently defaulting to weights.
    if (fallback === null) return null;
    return fallback || (state.mode === "cardio" ? "distance_time" : "weight_reps");
  }

  function addExercise(name, kind) {
    const a = A(); if (!a) return;
    const nm = String(name || "").trim();
    if (!nm) return;
    const k = kind || kindFor(nm);
    const prev = lastSetsFor(nm, k);
    a.ex.push({ name: nm, kind: k,
                sets: prev.length ? prev : [{ w:0, r:0, d:0, t:0, on:false }] });
    queueSync();
  }

  function lastSetsFor(name, kind) {
    const key = name.toLowerCase();
    for (const s of state.lift.sessions) {
      const hit = (s.exercises || []).find((e) => String(e.exercise).toLowerCase() === key);
      if (hit) {
        const n = Math.max(1, kind === "weight_reps" ? hit.sets : 1);
        return Array.from({ length: n }, () => ({
          w: Number(hit.top_weight) || 0, r: Number(hit.top_reps) || 0,
          d: Number(hit.distance) || 0,
          t: Math.round((Number(hit.seconds) || 0) / Math.max(1, hit.sets)),
          on: false }));
      }
    }
    return [];
  }

  /* ---------- lift views ------------------------------------------- */

  function agoWords(iso) {
    const d = Math.round((new Date(todayISO() + "T00:00:00Z") -
                          new Date(iso + "T00:00:00Z")) / 86400000);
    if (d <= 0) return "today";
    if (d === 1) return "yesterday";
    if (d < 7)  return d + " days ago";
    if (d < 14) return "last week";
    return Math.floor(d / 7) + " weeks ago";
  }
  const fullDate = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString(undefined,
    { timeZone: "UTC", weekday: "long", month: "short", day: "numeric" });

  function bestSetWords(e) {
    if (e.kind === "duration")      return mmss(e.seconds);
    if (e.kind === "distance_time") return `${distWords(e.distance)} \u00b7 ${mmss(e.seconds)}`;
    return `${wShow(e.top_weight)} ${units.w} \u00d7 ${e.top_reps}`;
  }

  function sessionCard(s, clickable) {
    const rows = (s.exercises || []).map((e) => `
      <tr><td class="nm">${e.kind === "weight_reps" ? e.sets + " &times; " : ""}${
            esc(e.exercise)}</td>
          <td>${bestSetWords(e)}</td></tr>`).join("");
    const meta = [`<span><b>${s.duration_min}m</b></span>`];
    if (Number(s.distance) > 0) meta.push(`<span><b>${distWords(s.distance)}</b></span>`);
    if (s.pr_count > 0)
      meta.push(`<span style="color:var(--train)"><b>${s.pr_count}</b> PR${
        s.pr_count === 1 ? "" : "s"}</span>`);
    return `
      <${clickable ? "button" : "div"} class="hcard" ${clickable ? `data-open="${s.id}"` : ""}>
        <h3>${esc(s.label || "Workout")}</h3>
        <p class="when">${esc(fullDate(s.entry_date))}</p>
        <div class="hmeta">${meta.join("")}</div>
        ${rows ? `<table class="htab"><thead><tr><th>${
                    state.mode === "cardio" ? "Activity" : "Exercise"}</th>
                  <th>${state.mode === "cardio" ? "Result" : "Best set"}</th></tr></thead>
                  <tbody>${rows}</tbody></table>` : ""}
      </${clickable ? "button" : "div"}>`;
  }

  function resumeBanner() {
    const a = A();
    if (!a || a.pendingFinish) return "";
    return `
      <div class="install" style="background:var(--train-soft)">
        <p><b style="color:var(--train)">${esc(a.label || "Workout")} in progress</b> &mdash;
           ${totalsWords(a)} logged.</p>
        <button class="btn-quiet" id="resume" style="flex:none">Resume</button>
      </div>`;
  }

  function liftTiles() {
    if (!state.lift.labels.length) return "";
    return `
      <section>
        <div class="section-head"><h2>${state.mode === "cardio"
            ? "Your activities" : "Your workouts"}</h2>
          <span class="eyebrow">tap to start</span></div>
        <div class="tiles">${state.lift.labels.map((l) => `
          <div class="tilewrap">
            <button class="tile" data-start="${esc(l.label)}">
              <b>${esc(l.label)}</b>
              <span class="ex">${esc(l.preview || "")}</span>
              <span class="ago">${esc(agoWords(l.last_date))}</span>
            </button>
            <button class="tilemenu" data-menu="${esc(l.label)}"
              aria-label="Options for ${esc(l.label)}">&hellip;</button>
            ${state.lift.menu === l.label ? `
              <div class="sheet">
                <button data-rename="${esc(l.label)}">Rename</button>
                <button data-drop="${esc(l.label)}">Remove tile</button>
              </div>` : ""}
          </div>`).join("")}</div>
        ${state.lift.rename !== null ? `
          <div class="addrow" style="margin-top:12px">
            <input class="field" id="renameVal" maxlength="24" autocomplete="off"
                   value="${esc(state.lift.rename)}" aria-label="New name">
            <button class="btn" id="renameGo" style="background:var(--train)">Save</button>
            <button class="btn-quiet" id="renameNo">Cancel</button>
            <p class="hint" style="flex-basis:100%;margin-top:0">Renames it on every
              session you logged under that name. The workouts themselves are untouched.</p>
          </div>` : ""}
      </section>`;
  }

  function liftHistory() {
    if (!state.lift.sessions.length)
      return `<div class="dashed"><p class="empty">Nothing logged yet.<br>
        ${state.mode === "cardio"
          ? "Log a swim, row or ride and it appears here."
          : "Start a workout and it appears here, with your best set for every exercise."}
        </p></div>`;
    return `<section>
        <div class="section-head"><h2>History</h2>
          <span class="eyebrow">${state.lift.sessions.length} logged</span></div>
        ${state.lift.sessions.map((s) => sessionCard(s, true)).join("")}
      </section>`;
  }

  function sessionView() {
    const a = A();
    if (!a) { state.view = "exercise"; return exerciseView(); }

    const blocks = a.ex.map((x, i) => exBlock(x, i)).join("") ||
      `<div class="dashed"><p class="empty">No exercises yet.<br>
         Add the first one below.</p></div>`;

    const datalist = `<datalist id="exlist">${
      state.lift.exercises.map((e) =>
        `<option value="${esc(e.name || e)}"></option>`).join("")}</datalist>`;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; Exercise</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <div style="display:flex;align-items:center;gap:10px">
          <h1 style="flex:1;min-width:0">
            <input id="labelIn" class="labelin" value="${esc(a.label)}" maxlength="24"
                   placeholder="Name this day" autocomplete="off"
                   aria-label="What to call this workout"></h1>
          <button class="btn" id="finish" style="padding:10px 18px">Finish</button>
        </div>
        <div class="timer">
          <b id="elapsed">${clock(elapsedMs(a))}</b>
          <span id="sessTotals">${totalsWords(a)}</span>
        </div>
      </header>

      <div id="blocks">${blocks}</div>

      <div class="exadd">
        <input class="field" id="exName" list="exlist" placeholder="Add ${
          state.mode === "cardio" ? "an activity" : "an exercise"}"
               autocomplete="off" maxlength="60" aria-label="${
          state.mode === "cardio" ? "Activity" : "Exercise"} name">
        <button class="btn" id="exAdd" style="background:var(--train)">Add</button>
      </div>
      ${state.mode === "cardio" ? "" : `
      <div class="kindpick" role="group" aria-label="What this exercise records">
        ${[["weight_reps","weights"],["duration","time"]].map(([k, lbl]) =>
          `<button type="button" data-kind="${k}" aria-pressed="${
            (state.newKind || "weight_reps") === k}">${lbl}</button>`).join("")}
        <span>&mdash; remembered next time</span>
      </div>`}
      ${datalist}

      <p class="hint" id="liftHint">${esc(state.lift.msg || "")}</p>

      <button class="linkbtn" id="scrap" style="color:var(--muted);text-align:left;
        align-self:flex-start;font-size:12px">Discard this ${
        state.mode === "cardio" ? "activity" : "workout"}</button>

      <p class="ver">v${APP_VERSION}</p>`;
  }

  // One row shape per kind. This is the whole reason Cardio needed no
  // second app: the exercise decides the columns, exactly as Strong does.
  const COLS = {
    weight_reps:   () => [units.w, "reps"],
    duration:      () => ["time"],
    distance_time: () => [units.d, "time"],
  };

  function exBlock(x, i) {
    const kind = x.kind || "weight_reps";
    const cols = COLS[kind]();
    const cls  = kind === "weight_reps" ? "" : cols.length === 1 ? " one" : "";

    const field = (s, j, f, ph, label) => {
      const val = f === "w" ? (s.w ? wShow(s.w) : "")
                : f === "r" ? (s.r || "")
                : f === "d" ? (s.d ? dShow(s.d) : "")
                : (s.t ? mmss(s.t) : "");
      const numeric = f === "r";
      return `<input type="${f === "t" ? "text" : "number"}"
             inputmode="${f === "t" ? "numeric" : numeric ? "numeric" : "decimal"}"
             data-ex="${i}" data-set="${j}" data-f="${f}"
             class="${s.on ? "on" : ""}" value="${val}" placeholder="${ph}"
             aria-label="Set ${j + 1} ${label}">`;
    };

    const rows = x.sets.map((s, j) => {
      const cells =
        kind === "weight_reps"   ? field(s,j,"w","0",units.w) + field(s,j,"r","0","reps")
      : kind === "duration"      ? field(s,j,"t","0:00","time")
      :                            field(s,j,"d","0",units.d) + field(s,j,"t","0:00","time");
      return `<span class="ix">${j + 1}</span>${cells}
      <button class="tick" data-tick="${i}:${j}" aria-pressed="${!!s.on}"
              aria-label="Mark ${j + 1} done">&#10003;</button>`;
    }).join("");

    return `
      <div class="exblock" id="ex-${i}">
        <div class="exhead">
          <b>${esc(x.name)}</b>
          <button class="xbtn" data-delex="${i}" aria-label="Remove ${esc(x.name)}">&times;</button>
        </div>
        <div class="setgrid${cls}">
          <span class="hd">#</span>${cols.map((c) =>
            (c === units.w || c === units.d)
              ? `<button class="hd unit" data-cycle="${c === units.w ? "w" : "d"}"
                   aria-label="Change unit">${esc(c)}</button>`
              : `<span class="hd">${esc(c)}</span>`).join("")}
          <span class="hd"></span>
          ${rows}
        </div>
        <button class="addset" data-addset="${i}">+ Add ${
          kind === "weight_reps" ? "set" : "entry"}</button>
      </div>`;
  }

  function detailView() {
    const s = state.lift.detail;
    if (!s) { state.view = "exercise"; return exerciseView(); }
    const byPos = new Map();
    for (const r of (s.sets || [])) {
      if (!byPos.has(r.position)) byPos.set(r.position, { name: r.exercise, sets: [] });
      byPos.get(r.position).sets.push(r);
    }
    const cell = (r) =>
        r.kind === "duration"      ? mmss(r.seconds)
      : r.kind === "distance_time" ? `${distWords(r.distance)} \u00b7 ${mmss(r.seconds)}`
      :                              `${wShow(r.weight)} ${units.w} \u00d7 ${r.reps}`;
    const blocks = [...byPos.entries()].sort((a, b) => a[0] - b[0]).map(([, x]) => `
      <div class="exblock">
        <div class="exhead"><b>${esc(x.name)}</b></div>
        <table class="htab"><tbody>${x.sets.map((r, i) => `
          <tr><td class="nm">${x.sets.length > 1 ? "Set " + (i + 1) : "\u2014"}</td>
              <td>${cell(r)}</td></tr>`).join("")}</tbody></table>
      </div>`).join("");

    const mine = s.person_id === state.meId;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; Back</button>
      </div>

      <header class="masthead">
        <h1 style="color:var(--train)">${esc(s.label || "Workout")}</h1>
        <p class="sub">${esc(s.person)} &middot; ${esc(fullDate(s.entry_date))}</p>
        <div class="timer" style="margin-top:8px">
          <span><b>${s.duration_min}m</b></span>
          ${Number(s.distance) > 0 ? `<span><b>${distWords(s.distance)}</b></span>` : ""}
          ${s.pr_count > 0 ? `<span style="color:var(--train)">
            <b>${s.pr_count}</b> PR${s.pr_count === 1 ? "" : "s"}</span>` : ""}
        </div>
      </header>

      ${blocks}

      ${mine ? `<button class="linkbtn" id="delSession" style="color:var(--warn)">
        Delete this workout</button>` : ""}

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- lift painting ----------------------------------------
     Repaint the smallest thing that changed. V1.2 taught this the hard
     way: a full re-render while someone is typing throws the number away.
     ------------------------------------------------------------------ */

  let tick = null;
  function startTicking() {
    stopTicking();
    tick = setInterval(() => {
      const a = A(); const el = document.getElementById("elapsed");
      if (!a || !el) return stopTicking();
      el.textContent = clock(elapsedMs(a));
    }, 1000);
  }
  function stopTicking() { if (tick) { clearInterval(tick); tick = null; } }

  function paintTotals() {
    const a = A(); const el = document.getElementById("sessTotals");
    if (a && el) el.innerHTML = totalsWords(a);
  }

  function paintEx(i) {
    const a = A(); if (!a) return;
    const host = document.getElementById("ex-" + i);
    if (!host) return;
    const frag = document.createElement("div");
    frag.innerHTML = exBlock(a.ex[i], i);
    host.replaceWith(frag.firstElementChild);
    wireExBlock(i);
    paintTotals();
  }

  function wireExBlock(i) {
    const host = document.getElementById("ex-" + i);
    if (!host) return;
    const a = A();

    host.querySelectorAll("input[data-ex]").forEach((el) => {
      el.addEventListener("input", () => {
        const s = a.ex[+el.dataset.ex].sets[+el.dataset.set];
        const f = el.dataset.f, v = el.value;
        // Typed in whatever unit the phone is showing; stored in pounds
        // and metres. The conversion lives here and nowhere else.
        if (f === "t")      s.t = parseClock(v);
        else if (f === "d") s.d = v === "" ? 0 : dIn(Number(v));
        else if (f === "w") s.w = v === "" ? 0 : wIn(Number(v));
        else                s.r = v === "" ? 0 : Number(v);
        paintTotals();
        queueSync();
      });
    });

    host.querySelectorAll("[data-tick]").forEach((el) => {
      el.addEventListener("click", () => {
        const [xi, si] = el.dataset.tick.split(":").map(Number);
        const s = a.ex[xi].sets[si];
        s.on = !s.on;
        el.setAttribute("aria-pressed", String(s.on));
        host.querySelectorAll(`input[data-ex="${xi}"][data-set="${si}"]`)
            .forEach((f) => f.classList.toggle("on", s.on));
        paintTotals();
        queueSync();
      });
    });

    const add = host.querySelector("[data-addset]");
    if (add) add.addEventListener("click", () => {
      const sets = a.ex[i].sets;
      const last = sets[sets.length - 1] || {};
      sets.push({ w: last.w || 0, r: last.r || 0, d: last.d || 0, t: last.t || 0, on: false });
      queueSync();
      paintEx(i);
      const rows = document.querySelectorAll(`#ex-${i} .setgrid input`);
      const kindCols = (a.ex[i].kind === "weight_reps") ? 2 : (a.ex[i].kind === "duration" ? 1 : 2);
      const f = rows[rows.length - kindCols];
      if (f) { f.focus(); f.select(); }
    });

    const del = host.querySelector("[data-delex]");
    if (del) del.addEventListener("click", () => {
      a.ex.splice(i, 1);
      queueSync();
      render();
    });
  }

  function wireLift() {
    on("back", "click", () => {
      stopTicking();
      // A session opened from the board belongs to the board. Sending
      // someone who tapped a relative's volume chip into their own Lift
      // history is a small thing that feels like being lost.
      if (state.view === "detail") {
        state.lift.detail = null;
        state.view = state.lift.from === "board" ? "board" : "exercise";
      }
      else if (state.view === "session") state.view = "exercise";
      else state.view = "board";
      render();
    });

    if (state.view === "exercise") {
      on("startEmpty", "click", () => startSession(""));
      on("resume", "click", () => { state.view = "session"; render(); });
      document.querySelectorAll("[data-start]").forEach((el) =>
        el.addEventListener("click", () => startSession(el.dataset.start)));
      document.querySelectorAll("[data-open]").forEach((el) =>
        el.addEventListener("click", () => openSession(el.dataset.open)));

      document.querySelectorAll("[data-wunit]").forEach((el) =>
        el.addEventListener("click", () => { units.w = el.dataset.wunit; render(); }));
      document.querySelectorAll("[data-dunit]").forEach((el) =>
        el.addEventListener("click", () => { units.d = el.dataset.dunit; render(); }));

      document.querySelectorAll("[data-menu]").forEach((el) =>
        el.addEventListener("click", () => {
          state.lift.menu = state.lift.menu === el.dataset.menu ? null : el.dataset.menu;
          state.lift.rename = null;
          render();
        }));
      document.querySelectorAll("[data-rename]").forEach((el) =>
        el.addEventListener("click", () => {
          state.lift.rename = el.dataset.rename;
          state.lift.renameFrom = el.dataset.rename;
          state.lift.menu = null;
          render();
          const f = document.getElementById("renameVal");
          if (f) { f.focus(); f.select(); }
        }));
      on("renameNo", "click", () => { state.lift.rename = null; render(); });
      on("renameGo", "click", () => saveLabel(
        (document.getElementById("renameVal").value || "").trim()));
      on("renameVal", "keydown", (e) => {
        if (e.key === "Enter") document.getElementById("renameGo").click();
        if (e.key === "Escape") { state.lift.rename = null; render(); }
      });
      document.querySelectorAll("[data-drop]").forEach((el) =>
        el.addEventListener("click", async () => {
          if (!confirm(`Remove the "${el.dataset.drop}" tile? The workouts you logged
under it stay in your history, they just stop being a tile.`)) return;
          state.lift.renameFrom = el.dataset.drop;
          await saveLabel("");
        }));
    }

    if (state.view === "session") {
      const a = A();
      a.ex.forEach((_, i) => wireExBlock(i));
      startTicking();

      // Tapping the unit in a column header cycles it. Putting the switch
      // on the header means you can go metric mid-swim without leaving
      // the session to find a setting.
      document.querySelectorAll("[data-cycle]").forEach((el) =>
        el.addEventListener("click", () => {
          if (el.dataset.cycle === "w") units.w = units.w === "lb" ? "kg" : "lb";
          else units.d = units.d === "mi" ? "km" : units.d === "km" ? "m" : "mi";
          render();
        }));

      document.querySelectorAll("[data-kind]").forEach((el) =>
        el.addEventListener("click", () => {
          state.newKind = el.dataset.kind;
          document.querySelectorAll("[data-kind]").forEach((b) =>
            b.setAttribute("aria-pressed", String(b.dataset.kind === state.newKind)));
        }));

      on("exAdd", "click", () => {
        const f = document.getElementById("exName");
        const nm = (f.value || "").trim();
        if (!nm) { f.focus(); return; }
        // A name you have used before keeps its own kind; a new one takes
        // whatever the toggle says, and remembers it from then on.
        const known = kindFor(nm, null);
        addExercise(nm, known || state.newKind ||
          (state.mode === "cardio" ? "distance_time" : "weight_reps"));
        f.value = "";
        render();
      });
      on("exName", "keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); document.getElementById("exAdd").click(); }
      });

      // The name is just a field. No prompt, no modal, no editor state —
      // a label you can only set at the start is a label you get wrong.
      on("labelIn", "input", (e) => { a.label = e.target.value.slice(0, 24); queueSync(); });

      on("finish", "click", async (e) => {
        if (doneSets(a) === 0) {
          state.lift.msg = "Tick at least one set before finishing.";
          const h = document.getElementById("liftHint");
          if (h) h.textContent = state.lift.msg;
          return;
        }
        e.target.disabled = true;
        stopTicking();
        const res = await syncLift(true);

        // A finish never fails. If the network is down, or the call errors
        // for any other reason, the workout is already on the phone and
        // marked finished — it goes up on the next load or reconnect. The
        // one thing that must never happen is a finished session held
        // hostage on a screen someone is trying to leave.
        if (res.offline || res.error) {
          state.lift.msg = "Saved on this phone. It will upload by itself.";
          state.view = "lift";
          state.lift.loaded = false;
          render();
          return;
        }
        const prs = Number(res.pr_count) || 0;
        state.lift.active = null;
        saveLocal();
        state.lift.msg = prs ? `Logged. ${prs} personal record${prs === 1 ? "" : "s"}.` : null;
        state.view = "lift";
        await loadLift();
        render();
        refresh();                       // the board now owes you Train minutes
      });

      on("scrap", "click", () => {
        if (!confirm(`Throw this ${state.mode === "cardio" ? "activity" : "workout"
          } away? It is not saved anywhere else.`)) return;
        stopTicking();
        state.lift.active = null;
        saveLocal();
        state.view = "lift";
        render();
      });
    }

    if (state.view === "detail") {
      on("delSession", "click", async () => {
        const s = state.lift.detail;
        if (!confirm("Delete this workout? Your Train minutes for that day go back down.")) return;
        const res = await call("app_lift_delete", {
          p_code: state.code, p_person: state.meId, p_session: s.id });
        if (res.error) { alert(res.error); return; }
        state.lift.detail = null;
        state.view = "lift";
        await loadLift();
        render();
        refresh();
      });
    }
  }

  // Exercise carries both halves: the steps entry and week charts that used
  // to be on the board, and the log that used to be its own screen.
  function wireExercise() {
    wireLift();
    wireChart(state.seg);

    document.querySelectorAll("[data-seg]").forEach((el) =>
      el.addEventListener("click", async () => {
        const k = el.dataset.seg;
        if (k === state.seg) return;
        state.seg  = k;
        state.mode = k === "cardio" ? "cardio" : "lift";
        state.lift.menu = null; state.lift.rename = null;
        render();
        if (k !== "steps") { await loadLift(); render(); }
      }));


    const stepWeek = async (n) => {
      state.weekAnchor = shiftISO(weekBounds().start, n * 7);
      if (state.weekAnchor === thisMonday()) state.weekAnchor = null;
      await loadHistory();
      render();
    };
    on("wPrev", "click", () => stepWeek(-1));
    on("wNext", "click", () => stepWeek(1));

    on("save", "click", saveSteps);
    on("steps", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("save").click(); });

    document.querySelectorAll('[data-edit="goal"]').forEach((el) =>
      el.addEventListener("click", () => {
        state.editMetric = el.dataset.metric || "steps";
        openEditor("goal");
      }));

    wireEditor();
  }

  async function saveSteps(e) {
    const raw = (document.getElementById("steps").value || "").replace(/[^0-9]/g, "");
    if (raw === "") {
      state.msg = "Enter a number."; state.msgKind = "bad"; render(); return;
    }
    e.target.disabled = true;
    const res = await call("app_log", { p_code:state.code, p_person:state.meId,
      p_value:Number(raw), p_metric:M.steps.key, p_date:entryDay() });
    state.msg = res.error ? res.error : "Saved. Your family can see it.";
    state.msgKind = res.error ? "bad" : "ok";
    if (!res.error) state.entryDate = null;
    await refresh();
    setTimeout(() => { state.msg = null; state.msgKind = null; }, 100);
  }

  async function saveLabel(next) {
    const from = state.lift.renameFrom;
    if (!from) return;
    const res = await call("app_lift_label", {
      p_code: state.code, p_person: state.meId,
      p_old: from, p_new: next, p_mode: state.mode });
    if (res.error) { alert(res.error); return; }
    state.lift.rename = null; state.lift.menu = null; state.lift.renameFrom = null;
    await loadLift();
    render();
  }

  async function openSession(id) {
    const res = await call("app_lift_detail", { p_code: state.code, p_session: id });
    if (res.error || !res.session) return;
    state.lift.detail = res.session;
    state.lift.from = "exercise";
    state.view = "detail";
    render();
  }

  async function openExercise(seg) {
    if (!state.meId) return;
    stopTicking();
    state.seg  = seg || "steps";
    state.mode = state.seg === "cardio" ? "cardio" : "lift";
    state.lift.loaded = false;
    state.lift.labels = []; state.lift.sessions = [];
    state.lift.menu = null; state.lift.rename = null;
    loadLocal();
    state.view = "exercise";
    render();                 // paint immediately; the list can arrive after
    if (state.seg !== "steps") { await loadLift(); render(); }
  }

  /* ---------- views ------------------------------------------------ */
  function landing() {
    return `
      <header class="masthead">
        <h1>Family Health Dashboard</h1>
        <p class="sub">One number a day. Everyone sees how everyone is doing.
          No accounts, no passwords &mdash; a family shares one link.</p>
      </header>

      <section class="card">
        <h2>I have a code</h2>
        <input class="field" id="code" placeholder="ABC123" autocapitalize="characters"
               autocomplete="off" style="margin-top:12px;text-align:center;
               font-family:var(--mono);font-size:20px;letter-spacing:.25em">
        <button class="btn" id="open" style="width:100%;margin-top:10px">Open my family</button>
      </section>

      <section class="card">
        <h2>Start a new group</h2>
        <input class="field" id="gname" placeholder="The Nishtars" style="margin-top:12px">
        <select class="field" id="gtz" style="margin-top:10px">
          <option value="America/New_York">Eastern (US)</option>
          <option value="America/Chicago">Central (US)</option>
          <option value="America/Denver">Mountain (US)</option>
          <option value="America/Los_Angeles">Pacific (US)</option>
          <option value="Europe/London">London</option>
          <option value="Asia/Karachi">Karachi</option>
          <option value="Asia/Dubai">Dubai</option>
          <option value="Asia/Kolkata">India</option>
        </select>
        <button class="btn-quiet" id="create" style="width:100%;margin-top:10px;padding:13px">
          Create the group</button>
      </section>

      <p class="hint ${state.msg ? "bad" : ""}" id="msg">${esc(state.msg || "")}</p>

      <p class="note">Anyone holding a group&rsquo;s link can see and log for that
        group. Share it the way you would share a house key.</p>

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- the board: a glance, not a dashboard -------------------
     V1.5 moved the entry box, the charts, the stats and the week arrows
     into Exercise. What is left is who you are, what the five pillars say
     about your day, the family, and one button. Everything else is one
     tap in, which is the only shape that still reads when there are five
     pillars instead of one.
     ------------------------------------------------------------------ */

  function markRow(p, clickable) {
    return `<div class="marks">${PILLARS.map((pl) => {
      const lit  = pl.live && !!p.done;
      const cls  = !pl.live ? "pip off" : lit ? "pip on" : "pip";
      const tag  = clickable && pl.live ? "button" : "span";
      const attr = clickable && pl.live ? ` data-pillar="${pl.key}"` : "";
      return `<${tag} class="mark"${attr}${pl.live ? "" : ' aria-hidden="true"'}>
        <span class="${cls}"></span><span class="mlabel">${esc(pl.label)}</span>
      </${tag}>`;
    }).join("")}</div>`;
  }

  // One editor, two screens: names are edited on the board, goals on
  // Exercise. Rendering it in only one place is how tapping a goal used to
  // open nothing at all.
  function editRowHTML() {
    if (!state.editing) return "";
    return `
      <div class="addrow" id="editRow">
        <input class="field" id="editVal" maxlength="40" autocomplete="off"
               ${state.editing === "name" ? "" : 'type="number" inputmode="numeric"'}
               value="${editSeed()}"
               aria-label="${state.editing === "name" ? "Name" : "Daily goal"}">
        <button class="btn" id="editSave">Save</button>
        <button class="btn-quiet" id="editCancel">Cancel</button>
        <p class="hint" id="editHint" style="flex-basis:100%;margin-top:0">${editHintText()}</p>
      </div>`;
  }

  function boardView() {
    const m = me();
    const livePillars = PILLARS.filter((x) => x.live).length;
    const logged = state.people.filter((p) =>
      val(p,"steps") > 0 || val(p,"train") > 0 || val(p,"cardio") > 0).length;
    const moved  = state.people.filter((p) => p.done).length;

    const whoOptions = state.people.length === 0
      ? `<option value="">nobody yet</option>`
      : (!state.meId ? `<option value="">choose your name</option>` : "") +
        state.people.map((p) =>
          `<option value="${p.id}"${p.id === state.meId ? " selected" : ""}>${esc(p.name)}</option>`).join("");

    const mine = m ? `
      <section class="card mine">
        <div class="section-head">
          <h2>${esc(m.name)}</h2>
          <span class="eyebrow">${m.streak > 0 ? m.streak + "-day streak" : "today"}</span>
        </div>
        ${markRow(m, true)}
        <p class="note mcap">${livePillars} of ${PILLARS.length} pillars measured</p>
      </section>` : `
      <div class="dashed"><p class="note">Pick your name above, or add it,
        and your day appears here.</p></div>`;

    const roster = state.people.length === 0
      ? `<div class="dashed"><p class="note">Nobody has been added yet.
           Add the first name above.</p></div>`
      : `<div class="roster">${state.people.map((p) => {
          const v = val(p, "steps"), t = target(p, "steps");
          const initials = p.name.trim().split(/\s+/).slice(0,2)
            .map((w) => (w[0] || "").toUpperCase()).join("");
          const isMe = p.id === state.meId;
          return `<div class="person${p.done ? " did" : ""}">
            <span class="dot" aria-hidden="true"
              style="background:color-mix(in oklab, hsl(${p.hue} 62% 48%) 16%, var(--surface));
                     color:color-mix(in oklab, hsl(${p.hue} 62% 48%) 78%, var(--ink))"
              >${esc(initials)}</span>
            <div class="who">
              <div class="name">
                <button class="tapedit" data-edit="name" data-person="${p.id}"
                  >${esc(p.name)}</button>
                ${isMe ? "<em>you</em>" : ""}
                ${p.streak > 1 ? `<em>${p.streak}d</em>` : ""}
              </div>
              <div class="sub2">${[
                  p.lifted ? `<button class="liftchip" data-see="${p.id}" data-m="lift"
                     aria-label="See ${esc(p.name)}'s workout">${val(p,"train")}m train</button>` : "",
                  Number(p.cardio_distance) > 0 || val(p,"cardio") > 0
                    ? `<button class="liftchip cardio" data-see="${p.id}" data-m="cardio"
                     aria-label="See ${esc(p.name)}'s cardio">${val(p,"cardio")}m${
                       Number(p.cardio_distance) > 0 ? " \u00b7 " + esc(distWords(p.cardio_distance)) : ""
                     }</button>` : "",
                ].filter(Boolean).join(" ") || "&nbsp;"}</div>
            </div>
            <div class="num"><b>${v > 0 ? num(v) : "&mdash;"}</b>
              <span class="${p.done ? "met" : ""}">${
                p.done ? "\u2713 moved" : v > 0 ? "of " + num(t) : "nothing yet"}</span></div>
          </div>`;
        }).join("")}</div>`;

    return `
      <header class="masthead">
        <h1>${esc(state.group.name)}</h1>
        <p class="sub">${esc(new Date().toLocaleDateString(undefined,
          { weekday:"long", month:"long", day:"numeric" }))}</p>
      </header>

      <div class="whoami">
        <span class="label">I am</span>
        <select id="who" aria-label="Which family member are you"
          ${state.people.length === 0 ? "disabled" : ""}>${whoOptions}</select>
        <button class="linkbtn" id="addBtn">${state.adding ? "Never mind" : "Add someone"}</button>
      </div>

      ${editRowHTML()}

      <div class="addrow" id="addRow" ${state.adding ? "" : "hidden"}>
        <input class="field" id="addName" placeholder="Their name" maxlength="40"
               autocomplete="off" aria-label="Name of the person to add">
        <button class="btn" id="addSave">Add</button>
        <p class="hint" id="addHint" style="flex-basis:100%;margin-top:0"></p>
      </div>

      ${installHint()}
      ${mine}

      <section>
        <div class="section-head">
          <button class="foldbtn" id="foldBoard" aria-expanded="${boardOpen()}">
            <span class="caret">${boardOpen() ? "\u25be" : "\u25b8"}</span>
            <h2>The family today</h2></button>
          <span class="eyebrow">${state.people.length
            ? `${logged}/${state.people.length} logged \u00b7 ${moved} moved` : ""}</span>
        </div>
        ${boardOpen() ? roster : ""}
      </section>

      <button class="btn" id="waShare" style="width:100%">Post today to WhatsApp</button>

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- Exercise: one pillar, three numbers ---------------------
     This screen absorbed both logger homes. A single segment picks which
     number you are looking at AND which log sits underneath it, so
     starting a workout is still three taps and there is no tab bar to
     outgrow when the other four pillars arrive.
     ------------------------------------------------------------------ */

  function exerciseView() {
    const m = me();
    const iso = entryDay();
    const isToday = iso === todayISO();
    const rec = dayRecord("steps");
    const dayTitle = isToday ? "Today"
      : new Date(iso + "T00:00:00Z").toLocaleDateString(undefined,
          { timeZone:"UTC", weekday:"long", month:"short", day:"numeric" });

    const segs = [["steps","Steps"],["train","Train"],["cardio","Cardio"]];

    const logSection = state.seg === "steps" ? "" : `
      <button class="btn" id="startEmpty" style="width:100%;background:var(--train)">
        ${state.mode === "cardio" ? "Start an activity" : "Start an empty workout"}</button>
      ${liftTiles()}
      ${liftHistory()}`;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <h1>Exercise</h1>
        <p class="sub">Steps, training, cardio. One pillar of five.</p>
      </header>

      ${resumeBanner()}

      ${state.seg === "steps" ? `
      <section class="card">
        <div class="section-head">
          <h2>${esc(dayTitle)}</h2>
          <span class="eyebrow">steps</span>
        </div>
        <input class="bignum" id="steps" type="number" inputmode="numeric" placeholder="0"
               aria-label="Steps on ${esc(dayTitle)}"
               value="${rec.logged ? rec.value : ""}">
        <button class="btn" id="save" style="width:100%;margin-top:10px">${
          rec.logged ? "Update" : "Log"}</button>
        <p class="hint ${state.msgKind || ""}" id="hint">${esc(state.msg ||
          (rec.logged ? "Already recorded. You can correct it."
                      : "Train and cardio minutes are written by what you log below."))}</p>
      </section>` : `
      <!-- Steps is the keystone, so it stays reachable from every segment.
           It just stops shouting when you came here to look at something
           else: one line instead of a card. -->
      <div class="stepline">
        <span>${esc(dayTitle)}</span>
        <input id="steps" type="number" inputmode="numeric" placeholder="0"
               aria-label="Steps on ${esc(dayTitle)}"
               value="${rec.logged ? rec.value : ""}">
        <em>steps</em>
        <button class="btn-quiet" id="save">${rec.logged ? "Update" : "Log"}</button>
      </div>
      ${state.msg ? `<p class="hint ${state.msgKind || ""}" id="hint"
        style="margin-top:-18px">${esc(state.msg)}</p>` : ""}`}

      <div class="segrow">
        <div class="seg" role="group" aria-label="Which number">
          ${segs.map(([k, lbl]) =>
            `<button type="button" data-seg="${k}" aria-pressed="${state.seg === k}">${lbl}</button>`
          ).join("")}
        </div>
        ${state.seg === "train" ? `<div class="range" role="group" aria-label="Weight unit">${
            ["lb","kg"].map((u) =>
              `<button type="button" data-wunit="${u}" aria-pressed="${units.w === u}">${u}</button>`
            ).join("")}</div>`
        : state.seg === "cardio" ? `<div class="range" role="group" aria-label="Distance unit">${
            ["mi","km","m"].map((u) =>
              `<button type="button" data-dunit="${u}" aria-pressed="${units.d === u}">${u}</button>`
            ).join("")}</div>` : ""}
      </div>

      ${editRowHTML()}

      <section>
        <div class="section-head">
          <h2>${esc(weekWords())}</h2>
          <div class="weeknav" role="group" aria-label="Which week">
            <button type="button" id="wPrev" aria-label="Previous week">&lsaquo;</button>
            <button type="button" id="wNext" aria-label="Next week"
              ${weekBounds().start === thisMonday() ? "disabled" : ""}>&rsaquo;</button>
          </div>
        </div>
        <div class="card">
          ${chartsHTML()}
          ${statsHTML()}
        </div>
      </section>

      ${logSection}

      <p class="ver">v${APP_VERSION}</p>`;
  }

  function notConfigured() {
    return `
      <header class="masthead">
        <p class="eyebrow">Setup incomplete</p>
        <h1>Two settings missing</h1>
      </header>
      <div class="banner">
        This page has not been given its database address yet. Open
        <code>index.html</code>, and near the top replace
        <code>__SUPABASE_URL__</code> and <code>__SUPABASE_ANON_KEY__</code> with the
        Project URL and the <b>anon</b> key from Supabase &rarr; Project Settings &rarr; API.
      </div>`;
  }

  /* ---------- render + events -------------------------------------- */
  function render() {
    if (!configured) { app.innerHTML = notConfigured(); return; }
    if (state.fatal) {
      app.innerHTML = `<div class="banner">${esc(state.fatal)}</div>
        <p style="margin-top:16px"><a href="${location.pathname}">Start over</a></p>`;
      return;
    }
    if (!(state.code && state.group)) { app.innerHTML = landing(); wire(); return; }

    if (state.view === "exercise") { app.innerHTML = exerciseView(); wireExercise(); return; }
    if (state.view === "session")  { app.innerHTML = sessionView();  wireLift();     return; }
    if (state.view === "detail")   { app.innerHTML = detailView();   wireLift();     return; }

    app.innerHTML = boardView();
    wire();
  }


  function wireChart(k) {
    const host = document.getElementById("chart-" + k);
    const svg = host && host.querySelector("svg");
    if (!svg) return;
    const n = points(k).length;

    // Two bars, two verbs. Tapping a Steps bar backlogs that day, which
    // is what you can still type. Tapping a Train bar opens the workout
    // behind it, because nobody types train minutes any more — and if
    // there is no workout, it offers to log one for that day.
    svg.addEventListener("click", async (e) => {
      const iso = e.target && e.target.dataset ? e.target.dataset.day : null;
      if (!iso) return;

      if (k !== "steps") {
        const got = await call("app_lift_detail", {
          p_code: state.code, p_person: state.meId, p_date: iso,
          p_mode: k === "cardio" ? "cardio" : "lift" });
        const sess = got && got.session;
        if (sess) {
          state.lift.detail = sess;
          state.lift.from = "exercise";
          state.view = "detail";
          render();
        } else {
          state.msg = "Nothing logged that day.";
          state.msgKind = null;
          render();
        }
        return;
      }

      // A Steps bar is the only way left to log a past day, now that the
      // date picker is gone. The week is already loaded, so there is
      // nothing to fetch.
      state.entryDate = iso === todayISO() ? null : iso;
      state.msg = null;
      render();
      document.getElementById("steps")?.focus();
    });

    const g = host.parentElement.querySelector("[data-edit]");
    if (g) g.addEventListener("click", () => openEditor(g.dataset.edit));
  }

  function openEditor(kind, personId) {
    state.editing = kind;
    state.editPerson = personId || state.meId;
    state.adding = false;
    render();
    const f = document.getElementById("editVal");
    if (f) { f.focus(); f.select(); }
  }

  function on(id, ev, fn) {
    const el = document.getElementById(id);
    if (el) el.addEventListener(ev, fn);
  }

  function wire() {
    /* landing */
    on("open", "click", () => {
      const c = (document.getElementById("code").value || "").trim().toUpperCase();
      if (!c) { state.msg = "Enter the code your family sent you."; render(); return; }
      location.search = "?g=" + encodeURIComponent(c);
    });
    on("code", "keydown", (e) => { if (e.key === "Enter") document.getElementById("open").click(); });

    on("create", "click", async (e) => {
      const name = (document.getElementById("gname").value || "").trim();
      const tz = document.getElementById("gtz").value;
      if (!name) { state.msg = "Give the group a name."; render(); return; }
      e.target.disabled = true;
      const res = await call("app_create_group", { p_name: name, p_timezone: tz });
      if (res.error) { state.msg = res.error; e.target.disabled = false; render(); return; }
      location.search = "?g=" + res.code;
    });

    /* group */
    on("who", "change", async (e) => {
      saveMe(e.target.value);
      state.msg = null;
      await loadHistory();
      render();
    });

    on("addBtn", "click", () => { state.adding = !state.adding; state.editing = null; render();
      const el = document.getElementById("addName"); if (el) el.focus(); });

    on("addSave", "click", async (e) => {
      const name = (document.getElementById("addName").value || "").trim();
      const hint = document.getElementById("addHint");
      if (!name) { hint.textContent = "Type a name first."; return; }
      e.target.disabled = true;
      const res = await call("app_add_person", { p_code: state.code, p_name: name });
      if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      saveMe(res.id);
      state.adding = false;
      await refresh();
    });
    on("addName", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("addSave").click();
      if (e.key === "Escape") { state.adding = false; render(); }
    });



    on("foldBoard", "click", () => {
      try { localStorage.setItem("fhd.board", boardOpen() ? "shut" : "open"); } catch {}
      render();
    });


    on("installNo", "click", () => {
      try { localStorage.setItem("fhd.install", "no"); } catch {}
      const el = document.getElementById("installHint");
      if (el) el.remove();
    });




    document.querySelectorAll('[data-edit="name"]').forEach((el) => {
      el.addEventListener("click", () => openEditor("name", el.dataset.person));
    });

    wireEditor();
    wireBoardActions();
  }

  function wireEditor() {
    on("editCancel", "click", () => { state.editing = null; render(); });

    on("editSave", "click", async (e) => {
      const kind = state.editing;
      const raw = (document.getElementById("editVal").value || "").trim();
      const hint = document.getElementById("editHint");

      if (kind === "goal") {
        const t = Number(raw.replace(/[^0-9]/g, ""));
        if (!t) { hint.textContent = "Enter a target above zero."; return; }
        e.target.disabled = true;
        const res = await call("app_set_goal", {
          p_code: state.code, p_person: state.meId, p_target: t,
          p_metric: M[state.editMetric].key,
        });
        if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      } else {
        if (!raw) { hint.textContent = "A name cannot be blank."; return; }
        e.target.disabled = true;
        const res = await call("app_rename_person", {
          p_code: state.code, p_person: state.editPerson || state.meId, p_name: raw,
        });
        if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      }
      state.editing = null;
      await refresh();
    });

    on("editVal", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("editSave").click();
      if (e.key === "Escape") { state.editing = null; render(); }
    });
  }

  // Board-only: the pillar marks, the tap-through chips, the one button.
  function wireBoardActions() {
    // The marks ARE the navigation. Tapping a live pillar goes straight
    // into it, which is why there is no tab bar and no Log screen: pillars
    // two to five arrive as taps, not as furniture.
    document.querySelectorAll("[data-pillar]").forEach((el) =>
      el.addEventListener("click", () => {
        if (el.dataset.pillar === "exercise") openExercise("steps");
      }));

    // Tap someone's volume chip to read the session behind it. The board
    // stays a scoreboard; the detail is one tap away for whoever wants it.
    document.querySelectorAll("[data-see]").forEach((el) => {
      el.addEventListener("click", async () => {
        const m = el.dataset.m;
        const res = await call("app_lift_detail", {
          p_code: state.code, p_person: el.dataset.see, p_mode: m });
        if (res.error || !res.session) return;
        state.mode = m;
        state.lift.detail = res.session;
        state.lift.from = "board";
        state.view = "detail";
        render();
      });
    });

    on("waShare", "click", () => {
      // WhatsApp's official click-to-chat link. No API, no cost, no bot:
      // it opens WhatsApp with the message written, and you pick the group.
      window.open("https://wa.me/?text=" + encodeURIComponent(dailyMessage()), "_blank");
    });
  }

  /* ---------- boot -------------------------------------------------- */
  (async () => {
    if (!configured) { render(); return; }
    if (!sb) {
      state.fatal = "Could not load the database library. Check your connection and reload.";
      render(); return;
    }
    if (state.code) {
      state.meId = loadMe();
      await refresh();
      // A workout finished with no signal uploads itself the moment there
      // is one — on this load, and again whenever the phone reconnects.
      loadLocal();
      flushPending().then(() => { if (state.view === "board") render(); });
      window.addEventListener("online", () => {
        flushPending().then(() => { if (state.view !== "session") render(); });
      });
    } else {
      render();
    }
  })();
})();
</script>
</body>
</html>
