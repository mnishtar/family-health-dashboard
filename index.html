    const month = state.range === "month";
    const mb = monthBounds();

    // V2.1. The period control sits at the TOP of the graph, mirroring the
    // day control at the top of the log box: two cards, the same shape,
    // each saying first which slice of time it is showing.
    // V3.3. Folded by default, so the page opens on the thing you came to
    // log. Once opened it stays open, until you fold it again.
    if (!trendOpen()) return `
      <section>
        <div class="section-head">
          <button class="foldbtn" id="trendFold" aria-expanded="false">
            <span class="caret">\u25b8</span><h2>Trend</h2></button>
        </div>
      </section>`;
    return `
      <section>
        <div class="section-head">
          <button class="foldbtn" id="trendFold" aria-expanded="true">
            <span class="caret">\u25be</span><h2>Trend</h2></button>
          <div class="rangetog" role="group" aria-label="How much to show">
            ${[["week","Week"],["month","Month"]].map(([v, l]) =>
              `<button type="button" data-range="${v}"
                aria-pressed="${state.range === v}">${l}</button>`).join("")}
          </div>
        </div>
        <div class="card">
          ${month ? `
            <div class="daynav">
              <button type="button" id="mPrev" aria-label="Previous month">&lsaquo;</button>
              <span class="wlab">${esc(monthWords(mb.first))}</span>
              <button type="button" id="mNext" aria-label="Next month"
                ${mb.first === monthOf(todayISO()) ? "disabled" : ""}>&rsaquo;</button>
            </div>
            ${monthGrid(k)}` : `
            <div class="daynav">
              <button type="button" id="wPrev" aria-label="Previous week">&lsaquo;</button>
              <span class="wlab">${esc(weekWords())}</span>
              <button type="button" id="wNext" aria-label="Next week"
                ${weekBounds().start === thisMonday() ? "disabled" : ""}>&rsaquo;</button>
            </div>
            ${miniChart(k)}
            <p class="hint dshint" style="text-align:center">${esc(weekWords2(k))}</p>`}
        </div>
      </section>`;
  }

  /* ---------- the twelve habits ---------------------------------------
     One integer a night. The score is how many are on, which is the only
     weighting I would trust myself to defend: every item here is something
     a sleep clinic would tell you to do, and inventing a ranking between
     them would be inventing precision.
     ------------------------------------------------------------------ */
  function sleepView() {
    const m = me() || {};
    const iso = entryDay();
    const isToday = iso === todayISO();
    const mask = Number(isToday ? (m.items || 0) : (dayRecord("sleep").value || 0)) || 0;
    const pct = scorePct(mask);
    // Cut the flat list into the pyramid's rows: one, then two, then
    // three, then four. Anything the list grows past that falls into a
    // final row of its own rather than silently disappearing.
    // V2.5. HABITS is the permanent bit order and never moves; `order`
    // is the family's ranking and decides who sits where. Keeping those
    // apart is what lets the pyramid be rearranged without rewriting a
    // single stored night.
    const ranked = order().map((bit) => ({ ...BYBIT[bit], i: bit }));
    const rows = []; let at = 0;
    for (const n of ROWS) { if (at >= ranked.length) break;
      rows.push(ranked.slice(at, at + n)); at += n; }
    if (at < ranked.length) rows.push(ranked.slice(at));

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <h1>Sleep Score</h1>
        <blockquote class="epi">Sleep is probably the single most effective
          thing you can do to reset your body and health.
          <cite>Dr. Matthew Walker</cite></blockquote>
      </header>

      <section class="card">
        ${dayNav({ label: isToday ? "Tonight" : esc(fullDate(iso)), atToday: isToday, unit: "night", todayWord: "tonight" })}
        <div class="domino" style="padding-top:10px">
          <b class="big" style="color:var(--sleep)">${pct}%</b>
          <span class="of" style="text-decoration:none">${scorePts(mask)} of
            ${scoreMax()} points \u00b7 ${bitsOn(mask)}/${HABITS.length} held</span>
          <button type="button" class="of" data-edit="goal" data-metric="sleep"
            style="display:block;margin:4px auto 0">standard <b>${stdOf(m, "sleep")}%</b></button>
        </div>
      </section>

      <section class="pyramid" id="pyr">
        ${rows.map((row) => `
          <div class="pyrow" style="--n:${row.length}">${row.map((h) => {
            const on = !!((mask >> h.i) & 1);
            const w  = weights()[h.i];
            return `<div class="pcell">
              <button type="button" class="ptile${on ? " on" : ""}"
                      data-habit="${h.i}" aria-pressed="${on}"
                      aria-label="${esc(h.t)}, worth ${w} of ${scoreMax()}">
                <span class="pips" aria-hidden="true">${
                  "<i></i>".repeat(w)}</span>
                <b>${esc(h.t)}</b>
                <em>${esc(h.sub || "")}</em>
              </button>
              <button type="button" class="pinfo" data-flip="${h.i}"
                aria-label="What ${esc(h.t)} means"><span>i</span></button>
            </div>`; }).join("")}</div>`).join("")}

        <!-- The back of a tile. At 85px square a description is unreadable,
             so flipping brings the card forward over the whole pyramid
             instead of turning in place. Same gesture, legible result. -->
        ${state.flip !== null && state.flip !== undefined && BYBIT[state.flip] ? `
          <div class="pscrim" data-shut="1" aria-hidden="true"></div>
          <div class="pback" id="pback" role="dialog" aria-modal="false"
               aria-label="${esc(BYBIT[state.flip].long || BYBIT[state.flip].t)}">
            <span class="pts">${weights()[state.flip]} ${
              weights()[state.flip] === 1 ? "point" : "points"}</span>
            <b>${esc(BYBIT[state.flip].long || BYBIT[state.flip].t)}</b>
            <p>${esc(BYBIT[state.flip].full)}</p>
            <div class="pbackrow">
              <button type="button" class="btn" id="flipHold"
                style="background:var(--sleep)">${
                ((mask >> state.flip) & 1) ? "Held tonight \u2713" : "Hold it tonight"}</button>
              <button type="button" class="btn-quiet" id="flipShut">Close</button>
            </div>
          </div>` : ""}

        <p class="hint" style="text-align:center;margin-top:12px">Tap a tile to
          hold it. Tap the corner to read what it means.</p>
      </section>

      ${graphCard("sleep")}
      ${famBlock()}

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- Tasks: today's few, then the rest ----------------------
     V3.5. Eisenhower's four boxes, named for what you do with them:
       Do         urgent and important. Today. Capped at your Tasks
                  standard, so a standard of 3 means three, numbered.
       Decide     important, not urgent. Give it a day.
       Delegate   urgent, not important. Hand it off.
       Not-to-do  what you have decided not to do. Folded away, no boxes.
     The page opens with the cursor in the line, so a task can be typed
     the moment Tasks is tapped. Return adds it to the box you used last.

     Tap a task to rename it, move it, give it a day, a time and a length,
     add steps, start a focus session on it, or delete it. Tick it and it
     drops to Done, which Clear empties for good. Drag the grip to order
     a box. Schedule is a day as an hour grid: tap a task, then a time.
     ------------------------------------------------------------------ */
  const QUADS = [
    { q:1, name:"Do",        tag:"today",         hint:"Urgent and important. Today, and only this many." },
    { q:2, name:"Decide",    tag:"give it a day", hint:"Important, not urgent. Give it a day." },
    { q:3, name:"Delegate",  tag:"hand it off",   hint:"Urgent, not important. Hand it to someone." },
    { q:4, name:"Not-to-do", tag:"",              hint:"Things you have decided not to do. Nothing to tick." },
  ];
  // Do holds as many as your Tasks standard: one number, set in one place.
  const doLimit = () => Math.max(1, Math.min(20, Math.round(stdOf(me(), "tasks")) || 5));
  const doCount = () => openIn(1).length;
  const doFull = () => doCount() >= doLimit();
  const taskCacheKey = () => "fhd.tasks." + (state.meId || "anon");
  const SCH_FROM = 6, SCH_TO = 24, SCH_H = 56;          // 6am to midnight, 56px an hour
  const clockOf = (m) => {
    const h = Math.floor(m / 60) % 24, mm = m % 60, ap = h < 12 ? "am" : "pm";
    return `${h % 12 || 12}${mm ? ":" + pad(mm) : ""}${ap}`;
  };
  const TLENS = [15, 30, 45, 60, 90, 120, 180];

  async function openTasks() {
    // V2.8 kept each person's PIN in plain text on the phone. The PIN is
    // gone, so its digits should not outlive it there.
    try { Object.keys(localStorage).filter((k) => k.startsWith("fhd.pin."))
            .forEach((k) => localStorage.removeItem(k)); } catch {}
    // V3.5. The page opens ready to write: drawn at once from the copy kept
    // on the phone, with the cursor already in the line. A phone raises its
    // keyboard only for a focus made inside the tap itself, which is why
    // this happens before anything waits on the network.
    let cached = [];
    try { cached = JSON.parse(localStorage.getItem(taskCacheKey()) || "[]"); } catch {}
    const keep = state.tasks || {};
    state.tasks = { list: Array.isArray(cached) ? cached : [], loaded: true, err: null,
                    tab: keep.tab === "sched" ? "sched" : "list",
                    bucket: keep.bucket || 1, edit: null, subFor: null, doneOpen: false, notOpen: false,
                    day: todayISO(), arm: null, sel: null, added: new Set() };
    render();
    if (state.tasks.tab === "list") document.getElementById("tQuickIn")?.focus();
    const res = await call("app_tasks", { p_code: state.code, p_person: state.meId });
    const t = state.tasks;
    if (!t || state.view !== "tasks") return;
    if (res.error) { t.err = res.error; render(); return; }
    // Whatever was typed while this was in flight is kept: the server's list
    // plus anything added here it has not seen yet.
    const fresh = res.tasks || [];
    const seen = new Set(fresh.map((x) => x.id));
    t.list = fresh.concat(t.list.filter((x) => t.added.has(x.id) && !seen.has(x.id)));
    try { localStorage.setItem(taskCacheKey(), JSON.stringify(t.list)); } catch {}
    // Never pull the line out from under someone typing in it.
    const f = document.getElementById("tQuickIn");
    if (f && document.activeElement === f) {
      t.stale = true;
      f.addEventListener("blur", () => { if (t.stale && state.tasks === t) { t.stale = false; render(); } }, { once: true });
    } else render();
  }
  const taskCall = async (fn, args) => {
    const res = await call(fn, Object.assign({ p_code: state.code, p_person: state.meId }, args));
    if (res.error) state.tasks.err = res.error;
    return res;
  };
  const kids = (id) => state.tasks.list.filter((x) => x.parent_id === id)
    .sort((a, b) => a.position - b.position);
  const mains = (q) => state.tasks.list.filter((x) => !x.parent_id && (x.quadrant || 1) === q)
    .sort((a, b) => a.position - b.position);
  const openIn = (q) => mains(q).filter((x) => !x.done);
  // Everything there is to act on, in box order. Not-to-do is not that.
  const actionable = () => [1, 2, 3].flatMap((q) => openIn(q));
  const taskPayload = (x) => ({ id: x.id, parent_id: x.parent_id || null, quadrant: x.quadrant || 1,
    title: x.title, done: !!x.done, position: x.position,
    sched_date: x.sched_date || null, sched_start: x.sched_start ?? null, sched_min: x.sched_min ?? null });
  const hhmm = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;

  function taskRow(x, rank) {
    const t = state.tasks, subs = kids(x.id), ed = t.edit === x.id;
    // V3.3. A day with no time reads as the day alone: "Today", "Tue".
    const dayWord = (d) => d === todayISO() ? "Today" : d === shiftISO(todayISO(), 1) ? "Tomorrow"
      : shortDay(d).replace(/,.*$/, "");
    const when = !x.sched_date ? ""
      : x.sched_start === null || x.sched_start === undefined ? dayWord(x.sched_date)

        </div>
        ${subs.length && (ed || t.subFor === x.id) ? `<ul class="ts">${subs.map((c) => `
          <li class="tsx${c.done ? " done" : ""}">

          </li>`).join("")}</ul>` : ""}
        ${t.subFor === x.id ? `
          <input class="tsubin" data-tsubnew="${x.id}" maxlength="200" enterkeyhint="done"
            autocomplete="off" placeholder="Add a step" aria-label="New step under ${esc(x.title)}">` : ""}
        ${ed ? `
          <div class="tebar">
            <div class="tbuckets sm" role="group" aria-label="Move to">${QUADS.map((Q) => `
              <button type="button" class="tbk q${Q.q}${(x.quadrant || 1) === Q.q ? " on" : ""}${

            <div class="twhen" role="group" aria-label="Which day">

              <label class="tday tpick${later ? " on" : ""}">${later ? esc(shortDay(x.sched_date)) : "Pick…"}
                <input type="date" data-tdate="${x.id}" min="${todayISO()}" value="${x.sched_date || ""}" aria-label="Pick a day"></label>
              ${x.sched_date ? `<button type="button" class="tday" data-tday="${x.id}:" aria-label="No day">&times;</button>` : ""}
            </div>
            <div class="twhen" role="group" aria-label="What time">
              <span>Time</span>
              <label class="tday tpick${timed ? " on" : ""}">${timed ? clockOf(x.sched_start) : "Set…"}
                <input type="time" step="900" data-ttime="${x.id}" value="${timed ? hhmm(x.sched_start) : ""}" aria-label="Start time"></label>
              ${timed ? `<label class="tday tpick on">${hm(x.sched_min || 30)}
                  <select data-tlen="${x.id}" aria-label="How long">${TLENS.map((n) =>
                    `<option value="${n}" ${(x.sched_min || 30) === n ? "selected" : ""}>${hm(n)}</option>`).join("")}</select></label>
                <button type="button" class="tday" data-tnotime="${x.id}" aria-label="No time">&times;</button>` : ""}

            </div>
          </div>` : ""}
      </li>`;
  }

  function listView() {
    const t = state.tasks;
    const lim = doLimit(), full = doFull();

    const B = QUADS.find((Q) => Q.q === t.bucket) || QUADS[1];
    const done = t.list.filter((x) => !x.parent_id && x.done && (x.quadrant || 1) !== 4)

      <section class="tgroup q1 tdo">

            aria-label="Do holds ${lim}, your Tasks standard. Change it">${doList.length}/${lim}</button></header>
        <ul class="tl" data-tgroup="1">${doList.map((x, n) => taskRow(x, n + 1)).join("")}</ul>
        ${doList.length < lim ? `<ul class="tl tempties">${Array.from({ length: lim - doList.length }, (_, k) => `
          <li class="tslot"><span class="trank">${doList.length + k + 1}</span>
            <button type="button" class="tslotb" data-tslot="1" aria-label="Add to Do"></button></li>`).join("")}</ul>` : ""}
      </section>
      ${group(QUADS[1])}
      ${group(QUADS[2])}

      ${not.length ? `
        <section class="tnot">
          <button type="button" class="foldbtn" id="tNotFold" aria-expanded="${!!t.notOpen}">
            <span class="caret">${t.notOpen ? "▾" : "▸"}</span><h2>Not-to-do · ${not.length}</h2></button>
          ${t.notOpen ? `<p class="tnoth">${QUADS[3].hint}</p>
            <ul class="tl">${not.map((x) => `
            <li class="tm tnotx"><div class="tr">
              <span class="tnotmark" aria-hidden="true">✕</span>
              <span class="tt">${esc(x.title)}</span>
              <button type="button" class="tx" data-tdel="${x.id}" aria-label="Remove ${esc(x.title)}">&times;</button>
            </div></li>`).join("")}</ul>` : ""}
        </section>` : ""}

      ${done.length ? `
        <section class="tdone">
          <div class="tdh">
            <button type="button" class="foldbtn" id="tDoneFold" aria-expanded="${t.doneOpen}">
              <span class="caret">${t.doneOpen ? "▾" : "▸"}</span>
              <h2>Done · ${done.length}</h2></button>
            <button type="button" class="linkbtn" id="tClear">Clear</button>
          </div>
          ${t.doneOpen ? `<ul class="tl">${done.map((x) => `
            <li class="tm done"><div class="tr">
              <button type="button" class="tck" data-tdone="${x.id}" aria-pressed="true"
                aria-label="Not done: ${esc(x.title)}"></button>
              <span class="tt">${esc(x.title)}</span></div></li>`).join("")}</ul>` : ""}
        </section>` : ""}`;
  }

  function schedView() {
    const t = state.tasks, day = t.day, isToday = day === todayISO();
    const rankOf = new Map(actionable().map((x, i) => [x.id, i]));
    const onDay = state.tasks.list.filter((x) => !x.parent_id && x.sched_date === day);
    const placed = onDay.filter((x) => x.sched_start !== null && x.sched_start !== undefined)
      .sort((a, b) => a.sched_start - b.sched_start);
    const anytime = onDay.filter((x) => x.sched_start === null || x.sched_start === undefined)
      .sort((a, b) => (a.done - b.done) || ((rankOf.get(a.id) ?? 1e9) - (rankOf.get(b.id) ?? 1e9)));
    // V3.3. The tray is only what has no day yet. A task given to Thursday
    // waits on Thursday, not on every day in between.
    const tray = actionable().filter((x) => !x.sched_date);
    const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
    const y = (m) => (m - SCH_FROM * 60) / 60 * SCH_H;
    const armed = t.arm && state.tasks.list.find((x) => x.id === t.arm);
    const sel = t.sel && state.tasks.list.find((x) => x.id === t.sel);
    return `
      <section class="card sday">
        ${dayNav({ ids: ["sPrev", "sNext", "sToday"], unit: "day", openNext: true,
                   atToday: isToday, label: isToday ? "Today" : esc(fullDate(day)) })}
      </section>
      ${tray.length || armed ? `
      <section class="stray">
        <p class="eyebrow">To place</p>
        <div class="schips">${tray.map((x) => `
          <button type="button" class="schip${t.arm === x.id ? " on" : ""}" data-sarm="${x.id}">
            ${esc(x.title)}</button>`).join("")}</div>
        <p class="sarm">${armed ? `Tap a time for <b>${esc(armed.title)}</b>, or Anytime.
            <button type="button" class="linkbtn" id="sDisarm">Cancel</button>`
          : "Tap a task, then a time, or Anytime."}</p>
      </section>` : ""}
      <section class="sany${armed ? " armed" : ""}">
        <button type="button" class="sanyh" id="sAny" ${armed ? "" : "tabindex=\"-1\""}>
          <span class="eyebrow">Anytime</span>${armed ? `<em>Tap to put it here</em>` : ""}</button>
        ${anytime.length ? `<ul class="tl">${anytime.map((x) => `
          <li class="tm${x.done ? " done" : ""}"><div class="tr">
            <button type="button" class="tck" data-tdone="${x.id}" aria-pressed="${!!x.done}"
              aria-label="${x.done ? "Not done" : "Done"}: ${esc(x.title)}"></button>
            <span class="tt">${esc(x.title)}</span>
            <button type="button" class="tx" data-sunplace="${x.id}" aria-label="Take ${esc(x.title)} off this day">&times;</button>
          </div></li>`).join("")}</ul>`
          : `<p class="tempty">${armed ? "" : "Nothing for anytime this day."}</p>`}
      </section>
      <div class="sgrid${armed ? " armed" : ""}" id="sGrid" style="height:${(SCH_TO - SCH_FROM) * SCH_H}px">
        ${Array.from({ length: SCH_TO - SCH_FROM }, (_, k) => SCH_FROM + k).map((h) => `
          <div class="shr" style="top:${(h - SCH_FROM) * SCH_H}px"><span>${clockOf(h * 60)}</span></div>`).join("")}
        ${isToday && nowMin >= SCH_FROM * 60 ? `<div class="snow" style="top:${y(nowMin)}px"></div>` : ""}
        ${placed.map((x) => `
          <div class="sblk${t.sel === x.id ? " sel" : ""}${x.done ? " done" : ""}" data-sblk="${x.id}"
            role="button" tabindex="0" aria-label="${esc(x.title)}, ${clockOf(x.sched_start)}"
            style="top:${Math.max(0, y(x.sched_start))}px;height:${Math.max(26, x.sched_min / 60 * SCH_H - 2)}px">
            <button type="button" class="tck sm" data-tdone="${x.id}" aria-pressed="${!!x.done}"
              aria-label="${x.done ? "Not done" : "Done"}: ${esc(x.title)}"></button>
            <span class="sbt"><b>${esc(x.title)}</b><small>${clockOf(x.sched_start)}–${clockOf(x.sched_start + x.sched_min)}</small></span>
          </div>`).join("")}
      </div>
      ${sel ? `
        <div class="ssheet" role="dialog" aria-label="${esc(sel.title)}">
          <div class="ssh"><b>${esc(sel.title)}</b>
            <span>${clockOf(sel.sched_start)}–${clockOf(sel.sched_start + sel.sched_min)} · ${hm(sel.sched_min)}</span></div>
          <div class="sadj">
            <button type="button" data-sadj="start:-15">&larr; Earlier</button>
            <button type="button" data-sadj="start:15">Later &rarr;</button>
            <button type="button" data-sadj="len:-15">&minus; 15m</button>
            <button type="button" data-sadj="len:15">+ 15m</button>
          </div>
          <div class="sact">
            <button type="button" class="btn workgo" data-tfocus="${sel.id}">Focus on this</button>
            <button type="button" class="btn-quiet" data-sanytime="${sel.id}">Anytime</button>
            <button type="button" class="btn-quiet" data-sunplace="${sel.id}">Off the day</button>
            <button type="button" class="btn-quiet" id="sClose" aria-label="Close">&times;</button>
          </div>
        </div>` : ""}`;
  }

  function tasksView() {
    const t = state.tasks || {};
    const head = `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
      </div>
      <header class="masthead">
        <h1>Tasks</h1>
        <p class="sub stdline"><b style="color:var(--ink)">${Number((me() || {}).tasks_done) || 0}</b> done today ·
          <button type="button" class="linkbtn" data-edit="goal" data-metric="tasks">standard ${stdOf(me(), "tasks")}</button></p>
      </header>`;
    if (!t.loaded) return head + `<p class="loading">Opening…</p>`;
    return head + `
      <div class="range tseg" role="group" aria-label="View">
        <button type="button" data-ttab="list" aria-pressed="${t.tab === "list"}">List</button>
        <button type="button" data-ttab="sched" aria-pressed="${t.tab === "sched"}">Schedule</button>
      </div>
      ${t.tab === "sched" ? schedView() : listView()}
      ${t.err ? `<p class="terr">${esc(t.err)}</p>` : ""}
      <p class="ver">v${APP_VERSION}</p>`;
  }

  function wireTasks() {
    on("back", "click", () => { state.view = "board"; state.tasks = null; render(); refresh(); });
    const t = state.tasks;
    if (!t || !t.loaded) return;
    const find = (id) => t.list.find((x) => x.id === id);
    const cacheTasks = () => { try { localStorage.setItem(taskCacheKey(), JSON.stringify(t.list)); } catch {} };
    // Every save also refreshes the copy kept on the phone, so the next
    // open draws what is true now.
    const save = (x) => { cacheTasks(); return taskCall("app_task_save", { p_task: taskPayload(x) }); };
    const nextPos = (pred) => Math.max(-1, ...t.list.filter(pred).map((x) => x.position)) + 1;
    const lastIn = (q, not) => nextPos((y) => !y.parent_id && (y.quadrant || 1) === q && !y.done && y.id !== not);
    // Order inside a box: write 0, 1, 2… down it and send it.
    const reorder = (ids) => {
      const changed = ids.some((id, k) => find(id) && find(id).position !== k);
      ids.forEach((id, k) => { const x = find(id); if (x) x.position = k; });
      render(); cacheTasks();
      if (changed) taskCall("app_task_order", { p_ids: ids });
    };

    document.querySelectorAll("[data-ttab]").forEach((el) =>
      el.addEventListener("click", () => {
        t.tab = el.dataset.ttab; t.edit = null; t.subFor = null; t.sel = null; t.arm = null;
        render();
        if (t.tab === "sched" && t.day === todayISO())
          document.querySelector(".snow")?.scrollIntoView({ block: "center" });
      }));

    // ---- adding: one line, one tap ----
    const quick = document.getElementById("tQuickIn");
    const addMain = (q, title) => {
      const x = { id: uuid(), parent_id: null, quadrant: q, title: title.slice(0, 200), done: false,
                  position: lastIn(q), sched_date: null, sched_start: null, sched_min: null };
      t.list.push(x);
      t.added.add(x.id);
      save(x).then((res) => { if (res.error) { t.list = t.list.filter((y) => y.id !== x.id); cacheTasks(); render(); } });
    };
    const quickAdd = (q) => {
      const title = (quick.value || "").trim();
      if (q === 1 && doFull()) {
        // Full means full. Say so where the eye already is; keep the words.
        const h = document.getElementById("tqHint");
        if (h) { h.innerHTML = `Do holds ${doLimit()}. Finish or move one, or tap Decide.`; h.classList.add("warn"); }
        quick.focus();
        return;
      }
      // A Not-to-do is a one-off decision; the next line goes back to work.
      t.bucket = q === 4 ? (doFull() ? 2 : 1) : q;
      if (title) { addMain(q, title); quick.value = ""; t.draft = ""; }
      t.stale = false;
      render();
      document.getElementById("tQuickIn")?.focus();
    };
    // What is typed survives a re-render (a tick elsewhere, a refresh).
    if (quick) quick.addEventListener("input", () => { t.draft = quick.value; });
    if (quick) quick.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); quickAdd(t.bucket); }
    });
    document.querySelectorAll("[data-tbk]").forEach((el) => {
      // Keep the keyboard up: the tap must not take focus from the line.
      el.addEventListener("pointerdown", (e) => e.preventDefault());
      el.addEventListener("click", () => quickAdd(Number(el.dataset.tbk)));
    });
    document.querySelectorAll("[data-tslot]").forEach((el) =>
      el.addEventListener("click", () => {
        t.bucket = 1; render();
        const f = document.getElementById("tQuickIn"); if (f) { f.focus(); f.scrollIntoView({ block: "center" }); }
      }));

    // ---- ticking ----
    document.querySelectorAll("[data-tdone]").forEach((el) =>
      el.addEventListener("click", async () => {
        const x = find(el.dataset.tdone);
        if (!x) return;
        const before = JSON.parse(JSON.stringify(t.list));
        x.done = !x.done;
        if (!x.parent_id && x.done) kids(x.id).forEach((c) => { c.done = true; });
        if (x.parent_id) {
          const p = find(x.parent_id), sibs = kids(x.parent_id);
          if (p) p.done = sibs.length > 0 && sibs.every((c) => c.done);
        }
        // A task brought back from Done goes to the bottom of its box, or
        // to Decide when Do is already full.
        if (!x.parent_id && !x.done) {
          if ((x.quadrant || 1) === 1 && openIn(1).filter((y) => y.id !== x.id).length >= doLimit()) {
            x.quadrant = 2; kids(x.id).forEach((c) => { c.quadrant = 2; });
          }
          x.position = lastIn(x.quadrant || 1, x.id);
        }
        if (t.edit === x.id) t.edit = null;
        // V3.4. Done today counts main tasks, so a step that finishes its
        // task counts the task. Shown at once; the server keeps the log.
        const mid = x.parent_id || x.id;
        const was = (before.find((y) => y.id === mid) || {}).done, now = (find(mid) || {}).done;
        const m = me();
        if (m && !!was !== !!now) m.tasks_done = Math.max(0, (Number(m.tasks_done) || 0) + (now ? 1 : -1));
        render();
        const res = await save(x);
        if (res.error) {
          t.list = before;
          if (m && !!was !== !!now) m.tasks_done = Math.max(0, (Number(m.tasks_done) || 0) - (now ? 1 : -1));
          render();
        }
      }));

    // ---- editing in place ----
    document.querySelectorAll("[data-tedit]").forEach((el) =>
      el.addEventListener("click", () => {
        t.edit = el.dataset.tedit; t.subFor = null; render();
        const f = document.querySelector(`[data-tetitle="${t.edit}"]`);
        if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
      }));
    const keepTitle = (id) => {
      const x = find(id), f = document.querySelector(`[data-tetitle="${id}"]`);
      if (x && f) {
        const v = f.value.trim().slice(0, 200);
        if (v && v !== x.title) { x.title = v; return true; }
      }
      return false;
    };
    const finishEdit = (id) => { if (keepTitle(id)) save(find(id)); t.edit = null; render(); };
    document.querySelectorAll("[data-tetitle]").forEach((el) => {
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); finishEdit(el.dataset.tetitle); }
        if (e.key === "Escape") { t.edit = null; render(); }
      });
      if (el.classList.contains("sm")) el.addEventListener("change", () => finishEdit(el.dataset.tetitle));
    });
    document.querySelectorAll("[data-tok]").forEach((el) =>
      el.addEventListener("click", () => finishEdit(el.dataset.tok)));
    // ---- moving to another box; Do takes only what fits ----
    document.querySelectorAll("[data-tmove]").forEach((el) => {
      el.addEventListener("pointerdown", (e) => e.preventDefault());
      el.addEventListener("click", () => {
        const [id, qs] = el.dataset.tmove.split(":"), q = Number(qs);
        const x = find(id);
        if (!x || (x.quadrant || 1) === q) return;
        if (q === 1 && doFull()) {
          t.err = `Do holds ${doLimit()}. Finish or move one first.`; render(); return;
        }
        keepTitle(id);
        x.quadrant = q;
        kids(x.id).forEach((c) => { c.quadrant = q; });
        x.position = lastIn(q, x.id);
        if (q === 4) { x.sched_date = null; x.sched_start = null; x.sched_min = null; }
        t.err = null; t.edit = null; render(); save(x);
      });
    });
    document.querySelectorAll("[data-tdel]").forEach((el) =>
      el.addEventListener("click", async () => {
        const id = el.dataset.tdel, x = find(id);
        t.list = t.list.filter((y) => y.id !== id && y.parent_id !== id);
        if (x && x.parent_id) {
          const p = find(x.parent_id), sibs = kids(x.parent_id);
          if (p && sibs.length) p.done = sibs.every((c) => c.done);
        }
        if (x && !x.parent_id) t.edit = null;
        render(); cacheTasks();
        await taskCall("app_task_delete", { p_id: id });
      }));
    // A day, a time, a length. Each change saves the name being typed too.
    const change = (id, fn) => {
      const x = find(id);
      if (!x) return;
      keepTitle(id);
      fn(x);
      render(); save(x);
    };
    document.querySelectorAll("[data-tday]").forEach((el) => {
      el.addEventListener("pointerdown", (e) => e.preventDefault());
      el.addEventListener("click", () => {
        const [id, d] = el.dataset.tday.split(":");
        change(id, (x) => {
          x.sched_date = x.sched_date === d || !d ? null : d;
          if (!x.sched_date) { x.sched_start = null; x.sched_min = null; }
        });
      });
    });
    document.querySelectorAll("[data-tdate]").forEach((el) =>
      el.addEventListener("change", () => { if (el.value) change(el.dataset.tdate, (x) => { x.sched_date = el.value; }); }));
    // V3.4. A time straight from the list: a task with no day is today's.
    document.querySelectorAll("[data-ttime]").forEach((el) =>
      el.addEventListener("change", () => {
        const m = /^(\d{1,2}):(\d{2})/.exec(el.value || "");
        if (!m) return;
        change(el.dataset.ttime, (x) => {
          x.sched_date = x.sched_date || todayISO();
          x.sched_start = Math.min(1439, Number(m[1]) * 60 + Number(m[2]));
          x.sched_min = x.sched_min || 30;
        });
      }));
    document.querySelectorAll("[data-tlen]").forEach((el) =>
      el.addEventListener("change", () => change(el.dataset.tlen, (x) => { x.sched_min = Number(el.value) || 30; })));
    document.querySelectorAll("[data-tnotime]").forEach((el) =>
      el.addEventListener("click", () => change(el.dataset.tnotime, (x) => { x.sched_start = null; x.sched_min = null; })));
    document.querySelectorAll("[data-tfocus]").forEach((el) =>
      el.addEventListener("click", () => {
        const x = find(el.dataset.tfocus);
        if (!x) return;
        keepTitle(x.id);
        loadWorkLocal();
        state.work.focus = { label: x.title, task_id: x.id };
        if (!state.work.run && x.sched_min) state.work.len = Math.max(5, Math.min(180, x.sched_min));
        saveWorkLocal();
        state.tasks = null;
        openExercise("work");
      }));

    // ---- steps: one tap opens a line, return keeps it open ----
    document.querySelectorAll("[data-tsubopen]").forEach((el) =>
      el.addEventListener("click", () => {
        keepTitle(el.dataset.tsubopen);
        t.subFor = el.dataset.tsubopen; t.edit = null; render();
        document.querySelector(`[data-tsubnew="${t.subFor}"]`)?.focus();
      }));
    document.querySelectorAll("[data-tsubnew]").forEach((el) => {
      const pid = el.dataset.tsubnew;
      const commit = (again) => {
        const title = (el.value || "").trim();
        el.value = "";
        if (title) {
          const parent = find(pid);
          if (parent) {
            const x = { id: uuid(), parent_id: pid, quadrant: 1, title: title.slice(0, 200),
                        done: false, position: nextPos((y) => y.parent_id === pid) };
            t.list.push(x);
            if (parent.done) parent.done = false;
            save(x).then((res) => { if (res.error) { t.list = t.list.filter((y) => y.id !== x.id); render(); } });
          }
        }
        if (!again) t.subFor = null;
        render();
        if (again) document.querySelector(`[data-tsubnew="${pid}"]`)?.focus();
      };
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); commit(true); }
        if (e.key === "Escape") { t.subFor = null; render(); }
      });
      el.addEventListener("blur", () => setTimeout(() => {
        if (el.isConnected && document.activeElement !== el && t.subFor === pid) commit(false); }, 0));
    });

    // ---- order inside a box: drag the grip ----
    document.querySelectorAll("[data-drag]").forEach((grip) =>
      grip.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const li = grip.closest("li.tm"), ul = li.parentElement;
        li.classList.add("drag");
        const move = (ev) => {
          const yy = ev.clientY;
          const others = [...ul.children].filter((c) => c !== li);
          const before = others.find((c) => { const r = c.getBoundingClientRect(); return yy < r.top + r.height / 2; });
          if (before) { if (li.nextElementSibling !== before) ul.insertBefore(li, before); }
          else if (ul.lastElementChild !== li) ul.appendChild(li);
          if (ul.dataset.tgroup === "1")
            [...ul.children].forEach((c, k) => { const r = c.querySelector(".trank"); if (r) r.textContent = k + 1; });
        };
        const up = () => {
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", up);
          window.removeEventListener("pointercancel", up);
          li.classList.remove("drag");
          reorder([...ul.children].map((c) => c.dataset.id));
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
        window.addEventListener("pointercancel", up);
      }));

    on("tNotFold", "click", () => { t.notOpen = !t.notOpen; render(); });

    // ---- done: fold and clear ----
    on("tDoneFold", "click", () => { t.doneOpen = !t.doneOpen; render(); });
    on("tClear", "click", () => {
      const n = t.list.filter((x) => !x.parent_id && x.done).length;
      openModal({
        title: `Clear ${n} done task${n === 1 ? "" : "s"}?`,
        body: "They are deleted for good.",
        buttons: [
          { label: "Clear", kind: "bad", run: async () => {
              const doneIds = new Set(t.list.filter((x) => x.done).map((x) => x.id));
              t.list = t.list.filter((x) => !doneIds.has(x.id) && !doneIds.has(x.parent_id));
              t.doneOpen = false; render(); cacheTasks();
              await taskCall("app_tasks_clear", {});
            } },
          { label: "Cancel", kind: "quiet" },
        ],
      });
    });

    // ---- schedule ----
    if (t.tab !== "sched") return;
    on("sPrev", "click", () => { t.day = shiftISO(t.day, -1); t.sel = null; render(); });
    on("sNext", "click", () => { t.day = shiftISO(t.day, 1); t.sel = null; render(); });
    on("sToday", "click", () => { t.day = todayISO(); t.sel = null; render(); });
    document.querySelectorAll("[data-sarm]").forEach((el) =>
      el.addEventListener("click", () => {
        t.arm = t.arm === el.dataset.sarm ? null : el.dataset.sarm; t.sel = null; render(); }));
    on("sDisarm", "click", () => { t.arm = null; render(); });
    const grid = document.getElementById("sGrid");
    on("sAny", "click", () => {
      const x = t.arm && find(t.arm);
      if (!x) return;
      x.sched_date = t.day; x.sched_start = null; x.sched_min = null;
      t.arm = null; render(); save(x);
    });
    document.querySelectorAll("[data-sanytime]").forEach((el) =>
      el.addEventListener("click", () => {
        const x = find(el.dataset.sanytime);
        if (!x) return;
        x.sched_start = null; x.sched_min = null; t.sel = null; render(); save(x);
      }));
    if (grid) grid.addEventListener("click", (e) => {
      if (e.target.closest("[data-tdone]")) return;           // a tick is not a tap on the block
      const blk = e.target.closest("[data-sblk]");
      if (!t.arm) {
        t.sel = blk ? (t.sel === blk.dataset.sblk ? null : blk.dataset.sblk) : null;
        render(); return;
      }
      const x = find(t.arm);
      if (!x) return;
      const yy = e.clientY - grid.getBoundingClientRect().top;
      const m = Math.max(SCH_FROM * 60, Math.min(SCH_TO * 60 - 15,
        SCH_FROM * 60 + Math.floor(yy / SCH_H * 4) * 15));
      x.sched_date = t.day; x.sched_start = m; x.sched_min = x.sched_min || 30;
      t.arm = null; t.sel = x.id;
      render(); save(x);
    });
    let adjTimer = null;
    document.querySelectorAll("[data-sadj]").forEach((el) =>
      el.addEventListener("click", () => {
        const x = find(t.sel);
        if (!x) return;
        const [k, d] = el.dataset.sadj.split(":");
        if (k === "start") x.sched_start = Math.max(0, Math.min(1439 - 5, x.sched_start + Number(d)));
        else x.sched_min = Math.max(15, Math.min(720, x.sched_min + Number(d)));
        render();
        clearTimeout(adjTimer); adjTimer = setTimeout(() => save(x), 500);
      }));
    document.querySelectorAll("[data-sunplace]").forEach((el) =>
      el.addEventListener("click", () => {
        const x = find(el.dataset.sunplace);
        if (!x) return;
        x.sched_date = null; x.sched_start = null; x.sched_min = null;
        if (t.sel === x.id) t.sel = null;
        render(); save(x);
      }));
    on("sClose", "click", () => { t.sel = null; render(); });
  }

  /* ---------- finishing a workout --------------------------------------
     V3.4. Finish asks nothing. A set you ticked or typed in is logged; a
     set still showing last time's grey numbers is one you skipped. If the
     shape of the workout changed, one quiet line offers to update the
     template, because almost nobody wants to, and nobody should have to
     answer a question to say so.
     ------------------------------------------------------------------ */

  async function finishFlow(a) {
    // What you ticked or typed is logged; the grey carried-over numbers you
    // never touched are the sets you did not do, and drop away with the
    // empty rows.
    if (!doneSets(a)) {
      state.lift.msg = "Type or tick the sets you did, then Finish.";
      const h = document.getElementById("liftHint");
      if (h) h.textContent = state.lift.msg;
      return;
    }
    let skip = 0;
    a.ex.forEach((x) => x.sets.forEach((st) => { if (!counts(st, x.kind) && hasNumsSet(st, x.kind)) skip++; }));
    // V3.5. Every finish is confirmed first, as Strong does: one stray tap
    // on Finish must not end a workout.
    openModal({
      mark: "\u{1F389}",
      title: a.mode === "cardio" ? "Finish activity?" : "Finish workout?",
      body: skip ? `${skip === 1 ? "One set" : `${skip} sets`} you did not tick or change ${skip === 1 ? "is" : "are"} left out.` : "",
      row: true,
      buttons: [
        { label: "Cancel", kind: "quiet" },
        { label: "Finish", kind: "ok", run: async () => {
            a.ex.forEach((x) => {
              x.sets = x.sets.filter((st) => {
                if (!counts(st, x.kind)) return false;
                st.on = true;
                return true;
              });
            });
            a.ex = a.ex.filter((x) => x.sets.length);
            saveLocal();
            await commitFinish(a);
          } },
      ],
    });
  }

  // What changed between the template and what was done, in words.
  function shapeChange(a) {
    if (!a.fromTile || !Array.isArray(a.tmpl)) return null;
    const was = new Map(a.tmpl.map((x) => [x.name.toLowerCase(), x]));
    const now = new Map(a.ex.map((x) => [x.name.toLowerCase(), x]));
    const added = a.ex.filter((x) => !was.has(x.name.toLowerCase())).map((x) => x.name);
    const dropped = a.tmpl.filter((x) => !now.has(x.name.toLowerCase())).map((x) => x.name);
    const more = [], fewer = [];
    a.ex.forEach((x) => {
      const w = was.get(x.name.toLowerCase());
      if (!w) return;
      if (x.sets.length > w.sets) more.push(x.name);
      if (x.sets.length < w.sets) fewer.push(x.name);
    });
    const order = a.tmpl.map((x) => x.name.toLowerCase()).filter((k) => now.has(k)).join("|")
              !== a.ex.map((x) => x.name.toLowerCase()).filter((k) => was.has(k)).join("|");
    if (!added.length && !dropped.length && !more.length && !fewer.length && !order) return null;
    const list = (xs) => xs.length <= 2 ? xs.join(" and ")
      : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
    const bits = [];
    if (added.length)   bits.push(`added ${list(added)}`);
    if (dropped.length) bits.push(`dropped ${list(dropped)}`);
    if (more.length)    bits.push(`did more sets of ${list(more)}`);
    if (fewer.length)   bits.push(`did fewer sets of ${list(fewer)}`);
    if (!bits.length && order) bits.push("changed the order");
    const s = bits.join(", ");
    return "You " + s + ".";
  }

  // V3.5. What changed against the template, in the two ways Strong asks
  // about: the numbers in sets it already had, and its shape (sets or
  // exercises added, removed or reordered).
  const pickVals = (st) => ({ w: Number(st.w) || 0, r: Number(st.r) || 0, d: Number(st.d) || 0, t: Number(st.t) || 0 });
  const sameVals = (x, y, kind) => kind === "duration" ? x.t === y.t
    : kind === "distance_time" ? x.d === y.d && x.t === y.t : x.w === y.w && x.r === y.r;
  function templateDiff(a) {
    if (!a.fromTile || !Array.isArray(a.tmpl)) return null;
    const byName = new Map(a.ex.map((x) => [x.name.toLowerCase(), x]));
    let valSets = 0, setDelta = 0;
    for (const t of a.tmpl) {
      const x = byName.get(t.name.toLowerCase());
      if (!x) continue;
      setDelta += x.sets.length - t.sets;
      x.sets.slice(0, t.sets).forEach((st, i) => {
        const old = t.vals && t.vals[i] ? pickVals(t.vals[i]) : null;
        if (!old || !sameVals(pickVals(st), old, x.kind)) valSets++;
      });
    }
    const was = new Set(a.tmpl.map((t) => t.name.toLowerCase()));
    const added = a.ex.filter((x) => !was.has(x.name.toLowerCase())).map((x) => x.name);
    const dropped = a.tmpl.filter((t) => !byName.has(t.name.toLowerCase())).map((t) => t.name);
    const shape = shapeChange(a) !== null;
    const list = (xs) => xs.length <= 2 ? xs.join(" and ") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
    const bits = [];
    if (added.length) bits.push(`Adds ${list(added)}`);
    if (dropped.length) bits.push(`Removes ${list(dropped)}`);
    if (setDelta > 0) bits.push(`Adds ${setDelta} set${setDelta === 1 ? "" : "s"}`);
    if (setDelta < 0) bits.push(`Removes ${-setDelta} set${setDelta === -1 ? "" : "s"}`);
    if (shape && !bits.length) bits.push("Changes the order");
    return { valSets, shape, shapeWords: bits.join(", ") + "." };
  }


  async function commitFinish(a) {
    stopTicking();
    const diff = templateDiff(a);
    const label = a.label;
    const mode = a.mode || state.mode;
    const res = await syncLift(true);

    // A finish never fails. If the network is down, or the call errors
    // for any other reason, the workout is already on the phone and
    // marked finished — it goes up on the next load or reconnect. The
    // one thing that must never happen is a finished session held
    // hostage on a screen someone is trying to leave.
    if (res.offline || res.error) {
      state.lift.msg = "Saved on this phone. It will upload by itself.";
      state.view = "exercise";
      state.lift.loaded = false;
      render();
      return;
    }
    const prs = Number(res.pr_count) || 0;
    // Two ways to write the template back. "Values only" keeps its shape and
    // takes today's numbers for the sets it has; "template and values"
    // becomes exactly what was done.
    const valuesOnly = (a.tmpl || []).map((t) => {
      const x = a.ex.find((y) => y.name.toLowerCase() === t.name.toLowerCase());
      return { exercise: t.name, kind: t.kind, sets: t.sets,
               vals: Array.from({ length: t.sets }, (_, i) =>
                 x && x.sets[i] ? pickVals(x.sets[i]) : (t.vals && t.vals[i] ? pickVals(t.vals[i]) : pickVals({}))) };
    });
    const asDone = a.ex.map((x) => ({ exercise: x.name, kind: x.kind, sets: x.sets.length,
                                      vals: x.sets.map(pickVals) }));
    state.lift.active = null;
    saveLocal(mode);
    state.lift.msg = prs ? `Logged. ${prs} personal record${prs === 1 ? "" : "s"}.` : "Logged.";
    // Back to the page the workout belongs to. It used to set a view name
    // nothing rendered, which dropped you on the home screen instead.
    state.view = "exercise";
    await loadLift();
    render();
    refresh();                       // the board now owes you Train minutes

    // V3.5. Then, only if something changed, the template question, as
    // Strong asks it. Same sets: new numbers or keep. Different sets: the
    // numbers alone, everything, or keep.
    if (diff && label && (diff.valSets || diff.shape)) {
      const saveT = (items, done) => async () => {
        const r = await call("app_template_save", { p_code: state.code, p_person: state.meId,
          p_label: label, p_mode: mode, p_items: items });
        state.lift.msg = r.error ? r.error : done;
        await loadLift(); render();
      };
      const n = diff.valSets;
      // With no numbers changed, "values only" would do nothing Keep does
      // not, so it is not offered.
      const buttons = n ? [
        { label: "Update Values Only", kind: "go",
          sub: `Updates values for ${n} set${n === 1 ? "" : "s"}.`,
          run: saveT(valuesOnly, `\u201c${label}\u201d values updated.`) },
      ] : [];
      if (diff.shape) buttons.push({ label: "Update Template and Values", kind: "bad", sub: diff.shapeWords,
          run: saveT(asDone, `\u201c${label}\u201d updated.`) });
      buttons.push({ label: "Keep Original Template", kind: "quiet" });
      openModal({
        title: "Update Template",
        body: "You\u2019ve made changes from your original template. Would you like to update it?",
        buttons,
      });
    }
  }

  /* ---------- Goals: The ONE Thing over the 12 Week Year -------------
     V3.4. Two books, one page.

     Gary Keller's The ONE Thing sits on top: goal setting to the now.
     Someday, then three years, then the ONE goal of these twelve weeks,
     then this week's ONE Thing, then today's. Each line answers the
     focusing question for a shorter stretch of time, so today is never
     cut off from Someday.

     Brian Moran's 12 Week Year is the engine underneath. Up to three
     goals, each with one KPI (the result, logged weekly) and its tactics
     (the actions you control, N times a week). The week is a scorecard,
     like the paper one: tactics down the side, Monday to Sunday across,
     tick the day you did it. The score is tactics done over tactics due;
     your standard (85% unless you set one) wins the week.

     The page holds the plan as one document and saves it whole, a moment
     after each change. There is no Save button to forget.
     ------------------------------------------------------------------ */
  const goalWin = () => stdOf(me(), "goals");
  const timesOf = (t) => Math.max(1, Math.min(7, Number(t.times) || (t.daily ? 7 : 1)));
  const dueIn = (t, w) => t.week === null || t.week === undefined || Number(t.week) === w;
  const hasMark = (t, w, d) => (t.marks || []).some((m) => m[0] === w && m[1] === d);
  function toggleMark(t, w, d) {
    t.marks = hasMark(t, w, d) ? t.marks.filter((m) => !(m[0] === w && m[1] === d))
                               : (t.marks || []).concat([[w, d]]);
  }
  const ticksIn = (t, w) => [1, 2, 3, 4, 5, 6, 7].filter((d) => hasMark(t, w, d)).length;
  // A tactic due N times counts at most N: a fourth gym day is not 4/3.
  function goalTally(g, w) {
    let due = 0, done = 0;
    for (const t of g.tactics) {
      if (!dueIn(t, w)) continue;
      const n = timesOf(t);
      due += n; done += Math.min(n, ticksIn(t, w));
    }
    return { due, done, pct: due ? Math.round(done / due * 100) : null };
  }
  function weekTally(doc, w) {
    let due = 0, done = 0;
    for (const g of doc.goals) { const x = goalTally(g, w); due += x.due; done += x.done; }
    return { due, done, pct: due ? Math.round(done / due * 100) : null };
  }
  const dowOf = (iso) => ((new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7) + 1;   // Mon 1 … Sun 7
  const weekOf = (doc, today) => Math.floor((new Date(today + "T00:00:00Z") -
                                  new Date(doc.start_date + "T00:00:00Z")) / 604800000) + 1;
  const curWeek = () => { const G = state.goals; return G && G.cycle ? weekOf(G.cycle, G.today) : null; };
  // The last week that can be ticked: this one, or 12 once the run is over.
  const lastOpen = () => Math.min(12, Math.max(1, curWeek() || 1));
  function weekSpan(start, w) {
    const a = shiftISO(start, (w - 1) * 7), b = shiftISO(a, 6);
    const f = (iso, m) => new Date(iso + "T00:00:00Z").toLocaleDateString(undefined,
      m ? { timeZone: "UTC", month: "short", day: "numeric" } : { timeZone: "UTC", day: "numeric" });
    return `${f(a, true)} – ${a.slice(0, 7) === b.slice(0, 7) ? f(b, false) : f(b, true)}`;
  }
  const numOrNull = (v) => { const x = parseFloat(String(v).replace(/,/g, ""));
                             return Number.isFinite(x) ? x : null; };
  const fmtNum = (v) => v === null || v === undefined ? "–"
    : Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
  // The KPI as it stands: the latest week logged, or where it started.
  const kpiLatest = (g, upto) => {
    const log = g.kpi_log || {};
    for (let w = upto; w >= 1; w--) if (log[w] !== undefined && log[w] !== null) return Number(log[w]);
    return g.kpi_now === null || g.kpi_now === undefined ? null : Number(g.kpi_now);
  };
  const freqWord = (t) => t.week ? `wk ${t.week}` : timesOf(t) === 7 ? "daily" : `${timesOf(t)}×`;
  const freqOf = (t) => t.week ? "w" + t.week : String(timesOf(t));
  const FREQ_OPTS = [["7", "Every day"], ["6", "6× a week"], ["5", "5× a week"], ["4", "4× a week"],
    ["3", "3× a week"], ["2", "2× a week"], ["1", "1× a week"]]
    .concat(Array.from({ length: 12 }, (_, k) => ["w" + (k + 1), `Week ${k + 1} only`]));
  const freqSelect = (sel, attrs) => `<select class="tmove" ${attrs} aria-label="How often">${FREQ_OPTS.map(([v, l]) =>
    `<option value="${v}" ${sel === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  function setFreq(t, v) {
    if (String(v).startsWith("w")) { t.week = Number(String(v).slice(1)); t.times = 1; }
    else { t.week = null; t.times = Math.max(1, Math.min(7, Number(v) || 1)); }
    t.daily = t.times === 7;
    if (t.week) t.marks = (t.marks || []).filter((m) => m[0] === t.week);
  }
  const newGoal = () => ({ id: uuid(), title: "", kpi: "", kpi_now: null, kpi_target: null, kpi_log: {}, tactics: [] });

  // The worked example: a whole plan four weeks in, on a Thursday. It is
  // drawn by the same code as your own plan, read-only.
  const EXAMPLE = (() => {
    const tac = (title, times, weeks) => ({ id: "ex-" + title, title, times, daily: times === 7, week: null,
      marks: weeks.flatMap((ds, i) => [...ds].map((d) => [i + 1, Number(d)])) });
    const g = (id, title, kpi, start, target, log, tactics) =>
      ({ id, title, kpi, kpi_now: start, kpi_target: target,
         kpi_log: Object.fromEntries(log.map((v, i) => [i + 1, v])), tactics });
    return {
      id: "example", start_date: "2026-01-05",
      vision: "Healthy and strong into my eighties, with a family that is too.",
      three_year: "Lean and fit, running a 10K every spring, sleeping seven hours.",
      one_goal: "ex-g1",
      focus: { w4: "Lift Monday, Wednesday and Friday at 6 am.", w4d4: "Pack the gym bag tonight for a 6 am lift." },
      goals: [
        g("ex-g1", "Lose 8 lb", "Weight, lb", 184, 176, [183, 182, 181.5, 181], [
          tac("Lift 45 min", 3, ["135", "13", "135", "13"]),
          tac("Walk 8,000 steps", 7, ["123457", "1234567", "12456", "123"]),
          tac("Protein at every meal", 7, ["1234", "123456", "1234567", "124"]) ]),
        g("ex-g2", "Sleep 7 hours a night", "Average sleep, h", 6.2, 7, [6.3, 6.6, 6.8, 6.7], [
          tac("Screens off by 9:30 pm", 7, ["125", "1234", "123457", "123"]),
          tac("In bed by 10 pm", 5, ["123", "1234", "12345", "123"]) ]),
        g("ex-g3", "Read 4 books", "Books finished", 0, 4, [0, 1, 1, 2], [
          tac("Read 20 min", 7, ["12367", "12345", "23456", "1234"]),
          tac("Weekly review, Sunday", 1, ["7", "7", "7", ""]) ]),
      ],
    };
  })();

  async function openGoals() {
    state.goals = { loaded: false, today: todayISO(), cycle: null, sel: 1, edit: null, err: null,
                    ex: false, guide: {}, twelve: false };
    const res = await call("app_cycle", { p_code: state.code, p_person: state.meId });
    const G = state.goals;
    if (res.error) G.err = res.error;
    G.today = res.today || todayISO();
    G.cycle = res.cycle || null;
    if (G.cycle) {
      G.cycle.focus = G.cycle.focus || {};
      G.cycle.three_year = G.cycle.three_year || "";
      G.cycle.goals.forEach((g) => {
        g.kpi_log = g.kpi_log || {};
        g.tactics.forEach((t) => {
          t.times = timesOf(t); t.daily = t.times === 7;
          t.marks = (t.marks || []).map((m) => [Number(m[0]), Number(m[1])]); });
      });
    }
    G.sel = lastOpen();
    G.loaded = true;
    render();
  }

  let goalTimer = null;
  async function pushGoals() {
    goalTimer = null;
    const G = state.goals;
    if (!G || !G.cycle) return;
    const res = await call("app_cycle_save", { p_code: state.code, p_person: state.meId, p_doc: G.cycle });
    if (res.error) { G.err = res.error; render(); }
    else {
      if (res.start_date) G.cycle.start_date = res.start_date;
      if (G.err) { G.err = null; render(); }
    }
  }
  function saveGoals() { clearTimeout(goalTimer); goalTimer = setTimeout(pushGoals, 600); }
  async function flushGoals() { if (goalTimer) { clearTimeout(goalTimer); await pushGoals(); } }

  // A new twelve weeks keeps Someday and three years: those outlive it.
  // From the example, it takes the example's plan, with no ticks or logs.
  function startCycle(monday, fromExample) {
    const G = state.goals, prev = G.cycle;
    let goals = [newGoal()], one = null;
    if (fromExample) {
      goals = EXAMPLE.goals.map((x) => ({ id: uuid(), title: x.title, kpi: x.kpi, kpi_now: x.kpi_now,
        kpi_target: x.kpi_target, kpi_log: {}, tactics: x.tactics.map((t) => ({ id: uuid(), title: t.title,
          times: t.times, daily: t.times === 7, week: null, marks: [] })) }));
    }
    one = goals[0].id;              // V3.5. The first goal is the ONE until you star another.
    G.cycle = { id: uuid(), start_date: monday,
                vision: fromExample ? EXAMPLE.vision : prev ? prev.vision : "",
                three_year: fromExample ? EXAMPLE.three_year : prev ? prev.three_year || "" : "",
                one_goal: one, focus: {}, goals };
    G.sel = lastOpen();
    G.edit = fromExample ? null : "g:" + goals[0].id;
    render();
    pushGoals();
  }

  /* V3.5. Goals as four steps, top to bottom, each answering Keller's
     focusing question for a shorter stretch of time:

       1  Someday         where your life is going
       2  This 12 weeks   your ONE goal (starred), and at most two more,
                          each with the number that proves it (KPI)
       3  This week       the week's ONE Thing, and Moran's scorecard:
                          tactics down the side, the days across
       4  Today           the ONE Thing, with a button that starts on it

     Each step carries its question, and folded under it, how to answer
     it with an example of great beside one of not great. Keller's 5-year,
     1-year and month levels are deleted: four steps is what a phone holds.
     A "3 years" line written in V3.4 is still shown under Someday until
     it is cleared, so nothing typed is lost. */
  const GUIDE = {
    someday: {
      ask: "What’s the ONE Thing I want to do someday?",
      how: "Write it as if it is already true, in a few sentences: your health, your work, the people you love. Big enough to pull you, and yours, not anyone else’s. Everything below should serve it. Read it every Monday.",
      great: "“At 70 I hike, lift and play on the floor with my grandchildren. I write every morning, have published two books, and am home for dinner most nights.”",
      notgreat: "“Be successful.” (No picture, nothing to aim at.) · “Lose 10 pounds by Friday.” (A task, not a someday.)",
    },
    goals: {
      ask: "Based on my someday, what’s the ONE result I can finish in the next 12 weeks?",
      how: "One finished result with a number, so on week 12 you will know whether it happened. Star it: that is your ONE goal. Give it a KPI, the number that proves it is moving, and log it once a week. Add up to two more goals only if they truly serve the first; fewer is stronger.",
      great: "★ “Lose 8 lb.” KPI: Weight, 184 → 176, logged every Monday. · “Finish the book draft.” KPI: Chapters, 3 → 12.",
      notgreat: "“Get healthier.” (No finish line.) · “Get fit, grow the business and read more.” (Three goals in one; none will get done.)",
    },
    week: {
      ask: "What will I do this week, and how often, to move the goal?",
      how: "Tactics are actions you control, each with a rhythm: every day, 1–6 times a week, or one week only. Tap the day you did one. The score is done ÷ due, and your standard (85% to start) wins the week: score the actions, not the result. Write the week’s ONE Thing on Monday, and at the end of the week ask what got in the way, then fix it or cut a tactic.",
      great: "“Lift 45 min” 3× a week. · “In bed by 10 pm” every day. · “Book the physio” in week 2 only.",
      notgreat: "“Exercise more.” (No rhythm; it can never be ticked.) · “Be disciplined.” (A wish, not an action.)",
    },
    today: {
      ask: "What’s the ONE Thing I can do today such that by doing it everything else will be easier or unnecessary?",
      how: "Usually one of this week’s tactics, made concrete. Do it first, before messages. Keller’s advice is to block time for it early, up to four hours, and guard the block. Tap ▶ to start a focus session on it.",
      great: "“Lift at 6 am: squat, bench, row, 45 minutes.” · “Draft the opening of chapter 6, 800 words, before 9.”",
      notgreat: "“Clear my inbox.” (Busy, not the ONE Thing.) · “Health stuff.” (Too vague to start.)",
    },
  };
  function guide(key) {
    const g = GUIDE[key], open = ((state.goals || {}).guide || {})[key];
    return `
      <button type="button" class="gguide" data-guide="${key}" aria-expanded="${!!open}">
        ${open ? "Hide how &amp; example" : "How &amp; example"} <i aria-hidden="true">${open ? "▴" : "▾"}</i></button>
      ${open ? `<div class="gguideb">
        <p>${g.how}</p>
        <p class="gex good"><b>Great</b> ${g.great}</p>
        <p class="gex bad"><b>Not great</b> ${g.notgreat}</p>
      </div>` : ""}`;
  }
  const gStep = (C, n, title, right, key, body) => `
    <section class="card gstep${C.ro ? " ro" : ""}">
      <div class="gsh"><span class="gsn">${n}</span><h2>${title}</h2>${right || ""}</div>
      <p class="gask">${GUIDE[key].ask}</p>
      ${body}
      ${C.ro ? "" : guide(key)}
    </section>`;
  // One line of the plan: tap it to write, tap away to keep it.
  function gText(C, k, v, ph, big) {
    const G = state.goals || {};
    if (C.ro) return `<p class="gvtext${v ? "" : " cnil"}">${v ? esc(v) : ph}</p>`;
    if (G.edit === "c:" + k) return big
      ? `<textarea class="field cin" data-cf="${k}" id="gcf-${k}" rows="3" maxlength="${k === "vision" ? 2000 : 1000}"
           placeholder="${ph}">${esc(v || "")}</textarea>`
      : `<input class="field cin" data-cf="${k}" id="gcf-${k}" maxlength="200" enterkeyhint="done"
           placeholder="${ph}" value="${esc(v || "")}">`;
    return `<button type="button" class="cval gtap${v ? "" : " cnil"}" data-cedit="${k}">${v ? esc(v) : ph}</button>`;
  }

  // 1 · Someday
  function gStepSomeday(C) {
    const d = C.doc, G = state.goals || {};
    const three = (d.three_year || "").trim() || G.edit === "c:three_year";
    return gStep(C, 1, "Someday", "", "someday", `
      ${gText(C, "vision", d.vision, "Write your someday", true)}
      ${three ? `<div class="gsub2"><span class="clab">In 3 years</span>
        ${gText(C, "three_year", d.three_year, "What must be true in 3 years", true)}</div>` : ""}`);
  }

  // 2 · This 12 weeks
  function goalEditHTML(d, g, n) {
    const isOne = g.id === d.one_goal;
    return `
        <div class="pedit">
          <div class="ghead"><span class="gnum">${n}</span>
            <input class="field gtitle" data-gf="title" data-g="${g.id}" id="gt-${g.id}" maxlength="200"
              value="${esc(g.title)}" placeholder="${isOne ? "Your ONE result, e.g. Lose 8 lb" : "The result, e.g. Read 4 books"}" aria-label="Goal">
            <button type="button" class="gstar${isOne ? " on" : ""}" data-gstar="${g.id}" aria-pressed="${isOne}"
              aria-label="${isOne ? "Your ONE goal" : "Make this your ONE goal"}">★</button></div>
          <label class="glab">KPI · the number that proves it</label>
          <div class="gkpirow">
            <input class="field" data-gf="kpi" data-g="${g.id}" maxlength="80" value="${esc(g.kpi)}"
              placeholder="e.g. Weight, lb" aria-label="KPI name">
            <input class="field gnumin" data-gf="kpi_now" data-g="${g.id}" inputmode="decimal"
              value="${g.kpi_now ?? ""}" placeholder="start" aria-label="KPI at the start">
            <span>→</span>
            <input class="field gnumin" data-gf="kpi_target" data-g="${g.id}" inputmode="decimal"
              value="${g.kpi_target ?? ""}" placeholder="goal" aria-label="KPI goal"></div>
          <label class="glab">Tactics · what you will do, and how often</label>
          <ul class="gtedit">${g.tactics.map((t) => `
            <li><span class="ttl">${esc(t.title)}</span>
              ${freqSelect(freqOf(t), `data-gtweek="${t.id}"`)}
              <button type="button" class="tx" data-gtdel="${t.id}" aria-label="Remove ${esc(t.title)}">&times;</button>
            </li>`).join("")}</ul>
          <form class="tadd" data-gtadd="${g.id}">
            <input class="field" maxlength="200" placeholder="Add a tactic, e.g. Lift 45 min" aria-label="New tactic" style="flex-basis:100%">
            ${freqSelect("7", "")}
            <button class="btn" type="submit" style="background:var(--work)">Add</button>
          </form>
          <div class="terow">
            <button type="button" class="linkbtn gdel" data-gdel="${g.id}">Remove goal</button>
            <button type="button" class="btn tok" data-gdone="${g.id}" style="background:var(--work)">Done</button>
          </div>
        </div>`;
  }
  function gStepGoals(C) {
    const d = C.doc, G = state.goals || {}, open = Math.min(12, Math.max(1, C.cur));
    const line = (g) => {
      const n = d.goals.indexOf(g) + 1;
      if (!C.ro && G.edit === "g:" + g.id) return goalEditHTML(d, g, n);
      const isOne = g.id === d.one_goal;
      const now = kpiLatest(g, open), tgt = g.kpi_target, start = g.kpi_now;
      const span = tgt !== null && tgt !== undefined && start !== null && start !== undefined && now !== null
        && Number(tgt) !== Number(start)
        ? Math.max(0, Math.min(100, (Number(now) - Number(start)) / (Number(tgt) - Number(start)) * 100)) : null;
      const lv = (g.kpi_log || {})[open], has = lv !== undefined && lv !== null;
      const klog = C.ro || C.cur < 1 || C.cur > 12 ? ""
        : G.kedit === `${g.id}:${open}`
          ? `<input class="kin" data-kin="${g.id}:${open}" id="gkin" inputmode="decimal" enterkeyhint="done"
               value="${has ? lv : ""}" aria-label="${esc(g.kpi)}, week ${open}">`
          : `<button type="button" class="kb${has ? "" : " nil"}" data-kw="${g.id}:${open}"
               aria-label="${esc(g.kpi)}, week ${open}${has ? ": " + lv : ""}">${has ? fmtNum(lv) : "+ log it"}</button>`;
      return `
        <div class="gline2${isOne ? " one" : ""}">
          <div class="ghead">${isOne ? `<span class="gstar on" aria-label="Your ONE goal">★</span>` : `<span class="gnum">${n}</span>`}
            <h3>${g.title ? esc(g.title) : `<span style="color:var(--muted)">${isOne ? "Your ONE goal" : "Untitled goal"}</span>`}</h3>
            ${C.ro ? "" : `<button type="button" class="linkbtn" data-gedit="${g.id}">Edit</button>`}</div>
          ${g.kpi ? `<div class="gkpi"><span>${esc(g.kpi)}</span><b>${fmtNum(now)} / ${fmtNum(tgt)}</b></div>
            ${span !== null ? `<div class="gkbar"><i style="width:${span}%"></i></div>` : ""}
            ${klog ? `<div class="gklog"><span>Week ${open}</span>${klog}</div>` : ""}`
          : C.ro ? "" : `<button type="button" class="linkbtn gnokpi" data-gedit="${g.id}">+ The number that proves it</button>`}
        </div>`;
    };
    const ones = d.goals.filter((g) => g.id === d.one_goal), rest = d.goals.filter((g) => g.id !== d.one_goal);
    const right = `<span class="gsr">${C.cur < 1 ? "starts " + esc(shortDay(d.start_date))
      : C.cur > 12 ? "complete" : `week ${C.cur} of 12`}</span>`;
    return gStep(C, 2, "This 12 weeks", right, "goals",
      ones.map(line).join("")
      + (rest.length ? (ones.length ? `<p class="galso">Also, only if it serves the ONE</p>` : "") + rest.map(line).join("") : "")
      + (!C.ro && d.goals.length && !d.one_goal && !(G.edit || "").startsWith("g:")
          ? `<p class="hint" style="margin-top:8px">Tap Edit, then ★, to mark your ONE goal.</p>` : "")
      + (!C.ro && d.goals.length < 3 ? `<button type="button" class="linkbtn gadd2" id="gAdd">${d.goals.length
          ? "+ Add another goal (optional)" : "+ Write your ONE goal"}</button>` : ""));
  }

  // 3 · This week: the week's ONE Thing, the score, and the scorecard.
  function scTable(C) {
    const d = C.doc, w = C.w, pre = C.cur < 1, open = Math.min(12, Math.max(1, C.cur)), win = goalWin();
    const DAYS = ["M", "T", "W", "T", "F", "S", "S"];
    const DNAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const locked = C.ro || pre || w > open;
    if (!d.goals.some((g) => g.tactics.length)) return `<p class="hint" style="margin-top:12px">${C.ro ? ""
      : "No tactics yet. Tap Edit on a goal in step 2 and add the actions that move it."}</p>`;
    const rows = d.goals.map((g, gi) => {
      const due = g.tactics.filter((t) => dueIn(t, w)), gp = goalTally(g, w).pct;
      return `
        <tbody>
          <tr class="scgh"><th colspan="7">${g.id === d.one_goal ? `<span class="cstar">★</span>`
            : `<span class="gnum xs">${gi + 1}</span>`}${
            g.title ? esc(g.title) : `<span style="color:var(--muted)">Untitled goal</span>`}</th>
            <td class="${gp !== null && gp >= win ? "win" : ""}">${gp === null ? "–" : gp + "%"}</td></tr>
          ${due.length ? due.map((t) => {
            const n = timesOf(t), k = ticksIn(t, w);
            return `<tr class="sctr"><th class="sct" colspan="7" scope="row">${esc(t.title)}<small>${freqWord(t)}</small></th>
              <td class="scn${Math.min(n, k) >= n ? " full" : ""}">${Math.min(n, k)}/${n}</td></tr>
              <tr class="scdr">${DAYS.map((L, j) => {
                const dd = j + 1, on = hasMark(t, w, dd);
                const future = locked || (w === C.cur && dd > C.dow);
                return `<td><button type="button" class="scc${on ? " on" : ""}${!C.ro && w === C.cur && dd === C.dow ? " today" : ""}"
                  ${C.ro ? "" : `data-gday="${t.id}:${dd}"`} aria-pressed="${on}" ${future ? "disabled" : ""}
                  aria-label="${esc(t.title)}, ${DNAMES[j]}"></button></td>`;
              }).join("")}<td></td></tr>`;
          }).join("") : `<tr><td colspan="8" class="scnone">${g.tactics.length
              ? `Nothing due in week ${w}.` : "No tactics yet."}</td></tr>`}
        </tbody>`;
    }).join("");
    return `
      <table class="sc">
        <colgroup><col span="7"><col class="scs"></colgroup>
        <thead><tr>${DAYS.map((L, j) =>
          `<th class="${!C.ro && w === C.cur && j + 1 === C.dow ? "today" : ""}">${L}</th>`).join("")}<th></th></tr></thead>
        ${rows}
      </table>`;
  }
  function rsTable(C) {
    const d = C.doc, G = state.goals || {}, win = goalWin();
    const pre = C.cur < 1, open = pre ? 0 : Math.min(12, C.cur);
    const W = Array.from({ length: 12 }, (_, k) => k + 1);
    const pctCell = (p, i) => i > open ? `<td class="fut">·</td>`
      : `<td class="${p !== null && p >= win ? "win" : ""}${i === C.w ? " curc" : ""}">${p === null ? "–" : p}</td>`;
    const kCell = (g, i) => {
      if (i > open) return `<td class="fut">·</td>`;
      const v = (g.kpi_log || {})[i], has = v !== undefined && v !== null;
      if (C.ro) return `<td class="${i === C.w ? "curc" : ""}">${has ? fmtNum(v) : "–"}</td>`;
      // ":t" keeps the table's cell apart from the same week's line in step 2.
      if (G.kedit === `${g.id}:${i}:t`) return `<td class="curc"><input class="kin" data-kin="${g.id}:${i}:t" id="gkint"
          inputmode="decimal" enterkeyhint="done" value="${has ? v : ""}" aria-label="${esc(g.kpi || "KPI")}, week ${i}"></td>`;
      return `<td class="${i === C.w ? "curc" : ""}"><button type="button" class="kb${has ? "" : " nil"}" data-kw="${g.id}:${i}:t"
          aria-label="${esc(g.kpi || "KPI")}, week ${i}${has ? ": " + v : ""}">${has ? fmtNum(v) : "+"}</button></td>`;
    };
    return `
        <div class="rs-wrap"><table class="rs">
          <thead><tr><th></th>${W.map((i) => `<th class="${i === C.w ? "cur" : ""}">W${i}</th>`).join("")}</tr></thead>
          <tbody>
            <tr class="rss"><th scope="row">Score %</th>${W.map((i) => pctCell(weekTally(d, i).pct, i)).join("")}</tr>
            ${d.goals.map((g, gi) => `
              <tr class="rsg"><th scope="row">${g.id === d.one_goal ? "★ " : `${gi + 1} · `}score</th>${W.map((i) =>
                pctCell(goalTally(g, i).pct, i)).join("")}</tr>
              ${g.kpi ? `<tr class="rsk"><th scope="row">${esc(g.kpi)}${g.kpi_target !== null && g.kpi_target !== undefined
                ? ` <small>→ ${fmtNum(g.kpi_target)}</small>` : ""}</th>${W.map((i) => kCell(g, i)).join("")}</tr>` : ""}`).join("")}
          </tbody></table></div>`;
  }
  function gStepWeek(C) {
    const d = C.doc, G = state.goals || {}, w = C.w, pre = C.cur < 1;
    const open = Math.min(12, Math.max(1, C.cur)), win = goalWin(), T = weekTally(d, w);
    const head = C.ro
      ? `<div class="sc-ro"><b>Week ${w} of 12</b><span>${esc(weekSpan(d.start_date, w))}</span></div>`
      : dayNav({ ids: ["gPrev", "gNext", "gToday"], unit: "week", todayWord: "this week",
                 atToday: pre || w >= open,
                 label: pre ? `Starts ${esc(shortDay(d.start_date))}` : `Week ${w} · ${esc(weekSpan(d.start_date, w))}` });
    const fw = (d.focus || {})["w" + w] || "";
    const canFw = !C.ro && w === open && C.cur <= 12;
    const twelve = C.ro || !!G.twelve;
    return gStep(C, 3, "This week", "", "week", `
      ${head}
      <div class="gsub2"><span class="clab">This week’s ONE Thing</span>
        ${canFw || C.ro ? gText(C, "fw", fw, "The ONE Thing for this week", false)
          : `<p class="gvtext${fw ? "" : " cnil"}">${fw ? esc(fw) : "–"}</p>`}</div>
      <div class="gscore">
        <b style="color:${T.pct !== null && T.pct >= win ? "var(--work)" : "var(--ink)"}">${T.pct === null ? "–" : T.pct + "%"}</b>
        <span>${T.due ? `${T.done} of ${T.due} done` : "Nothing planned"} · ${C.ro ? `${win}% wins the week`
          : `<button type="button" class="linkbtn" data-edit="goal" data-metric="goals">${win}% wins the week</button>`}</span>
      </div>
      ${scTable(C)}
      ${C.ro ? "" : `<button type="button" class="gguide" id="gTwelve" aria-expanded="${twelve}">
        ${twelve ? "Hide the twelve weeks" : "The twelve weeks, and your KPI"} <i aria-hidden="true">${twelve ? "▴" : "▾"}</i></button>`}
      ${twelve ? rsTable(C) : ""}`);
  }

  // 4 · Today's ONE Thing
  function gStepToday(C) {
    const d = C.doc, run = C.cur >= 1 && C.cur <= 12;
    const v = (d.focus || {})[`w${Math.min(12, Math.max(1, C.cur))}d${C.dow}`] || "";
    const body = !run
      ? `<p class="hint">${C.cur < 1 ? `Your twelve weeks start ${esc(shortDay(d.start_date))}.` : "These twelve weeks are done."}</p>`
      : C.ro ? `<p class="gvtext">${esc(v)}</p>`
      : `<div class="gone">
          <input class="field" id="gOneIn" maxlength="200" autocomplete="off" enterkeyhint="done"
            value="${esc(v)}" placeholder="The ONE Thing, today" aria-label="Today's ONE Thing">
          <button type="button" class="dplay" id="gOneGo" aria-label="Start a focus session on it">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
        </div>`;
    return gStep(C, 4, "Today’s ONE Thing", "", "today", body);
  }

  // The example, drawn by the same four steps, read-only: a plan four
  // weeks in, on a Thursday.
  const exampleParts = () => {
    const C = { doc: EXAMPLE, cur: 4, w: 4, dow: 4, ro: true };
    return gStepSomeday(C) + gStepGoals(C) + gStepWeek(C) + gStepToday(C);
  };

  function goalsView() {
    const G = state.goals || {};
    const head = `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
      </div>
      <header class="masthead">
        <h1>Goals</h1>
        <p class="sub">From someday to right now, in four steps.</p>
      </header>`;
    const foot = `<p class="ver">v${APP_VERSION}</p>`;
    if (!G.loaded) return head + `<p class="loading">Opening…</p>` + foot;
    const mon = mondayOf(G.today), next = shiftISO(mon, 7);
    const exCard = `
      <section class="card ghowcard">
        <button type="button" class="foldbtn" id="gEx" aria-expanded="${!!G.ex}">
          <span class="caret">${G.ex ? "▾" : "▸"}</span>
          <h2>See a whole plan, filled in</h2></button>
        ${G.ex ? `<p class="hint" style="margin-top:8px">Four weeks in, on a Thursday. Read only.</p>` : ""}
      </section>
      ${G.ex ? `<div class="exwrap">${exampleParts()}</div>` : ""}`;

    if (!G.cycle) return head + `
      <section class="card">
        <p class="eyebrow">The ONE Thing · The 12 Week Year</p>
        <h2 style="margin:4px 0 0;font-family:var(--display);font-weight:500;font-size:22px">
          One direction, twelve weeks, one thing today.</h2>
        <ol class="gfour">
          <li><b>Someday.</b> The life you are building, in a few sentences.</li>
          <li><b>This 12 weeks.</b> Your ONE goal, and the number that proves it.</li>
          <li><b>This week.</b> The actions that move it. <button type="button" class="linkbtn" data-edit="goal"
            data-metric="goals" style="font-size:inherit">${goalWin()}%</button> done wins the week.</li>
          <li><b>Today.</b> The ONE Thing that makes the rest easier. Do it first.</li>
        </ol>
        <div class="gstart">
          <button class="btn" data-gstart="${mon}">Start this week · ${esc(shortDay(mon))}</button>
          <button class="btn-quiet" data-gstart="${next}">Start next Monday · ${esc(shortDay(next))}</button>
          <button class="btn-quiet" data-gexample="${mon}">Start from the example</button>
        </div>
        ${G.err ? `<p class="terr">${esc(G.err)}</p>` : ""}
      </section>
      ${exCard}` + foot;

    const doc = G.cycle, cur = curWeek(), over = cur > 12;
    const C = { doc, cur, w: G.sel, dow: dowOf(G.today), ro: false };
    const played = [];
    for (let i = 1; i <= lastOpen() && cur >= 1; i++) { const p = weekTally(doc, i).pct; if (p !== null) played.push(p); }
    const avg = played.length ? Math.round(played.reduce((a, b) => a + b, 0) / played.length) : null;
    const overCard = !over ? "" : `
      <section class="card" style="background:var(--work-soft)">
        <p class="eyebrow">Week ${cur > 13 ? "13 and beyond" : "13"}</p>
        <h2 style="margin:4px 0 0;font-family:var(--display);font-weight:500;font-size:20px">
          Twelve weeks done${avg === null ? "." : ` at ${avg}% on average.`}</h2>
        <p class="hint" style="margin-top:6px">Week 13 is for review: what worked, what to
          carry forward, what to drop. Then start the next twelve.</p>
        <button class="btn" id="gNew2" style="width:100%;margin-top:12px;background:var(--work)">
          Start the next 12 weeks</button>
      </section>`;
    return head + overCard + gStepSomeday(C) + gStepGoals(C) + gStepWeek(C) + gStepToday(C) +
      (G.err ? `<p class="terr">${esc(G.err)}</p>` : "") + exCard +
      `<button type="button" class="linkbtn gnew" id="gNew">Start a new 12 weeks</button>` + foot;
  }

  function wireGoals() {
    on("back", "click", async () => {
      await flushGoals();
      state.view = "board"; state.goals = null; render(); refresh();
    });
    const G = state.goals;
    if (!G) return;
    const doc = G.cycle;
    document.querySelectorAll("[data-guide]").forEach((el) =>
      el.addEventListener("click", () => {
        G.guide = Object.assign({}, G.guide, { [el.dataset.guide]: !(G.guide || {})[el.dataset.guide] });
        render();
      }));
    on("gEx", "click", () => { G.ex = !G.ex; render();
      if (G.ex) document.querySelector(".exwrap")?.scrollIntoView({ block: "start", behavior: "smooth" }); });
    on("gTwelve", "click", () => { G.twelve = !G.twelve; render(); });
    document.querySelectorAll("[data-gstart]").forEach((el) =>
      el.addEventListener("click", () => startCycle(el.dataset.gstart)));
    document.querySelectorAll("[data-gexample]").forEach((el) =>
