.hadd { margin-top:14px; }

/* ---------- V4.1: Diet ------------------------------------------------ */
.dsec h2 { font-size:22px; }
.dsh { display:flex; align-items:baseline; gap:10px; }
.dss { font-size:12px; color:var(--muted); }
.dofx { margin-left:auto; border:none; background:none; font:inherit; font-size:13px; color:var(--muted); cursor:pointer;
  text-decoration:underline; text-decoration-color:var(--line-strong); text-underline-offset:3px; padding:2px 0; }
.dofx b { color:var(--dc); font-weight:600; }
.dsec .domino .of b { color:var(--dc); }
.domino .big small { font-size:24px; color:var(--muted); margin-left:2px; }
.ddlist { margin-top:14px; }
.spi.ddi { display:inline-grid; place-items:center; width:18px; height:18px; padding:0; margin-left:6px; vertical-align:1px; font-size:10.5px; }
.ddex { margin:-4px 0 8px 26px; padding:8px 12px; border-radius:10px; background:var(--surface-2); font-size:13px;
  line-height:1.5; color:var(--ink-2); }
.ddex small { display:block; margin-top:4px; font-size:11.5px; color:var(--muted); }
.ddrow { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
.ddsw { flex:none; width:12px; height:34px; border-radius:6px; }
.ddt { flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25; }
.ddt b { font-weight:600; font-size:15px; }
.ddt small { font-size:12px; color:var(--muted); }
.ddbx { flex:none; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:5px; max-width:62%; }
.ddb { width:32px; height:32px; border-radius:9px; border:2px solid var(--line-strong); background:var(--surface);
  cursor:pointer; padding:0; position:relative; }
.ddb.on { background:var(--dc); border-color:var(--dc); }
.ddb.on::after { content:""; position:absolute; left:10px; top:4px; width:8px; height:15px; border:solid #fff;
  border-width:0 3px 3px 0; transform:rotate(45deg); }
.ddsup { margin:16px 0 2px; }
.dbig { display:flex; align-items:baseline; justify-content:center; gap:6px; margin:10px auto 4px; }
.dbigb { border:none; background:none; cursor:pointer; padding:0; font:inherit; color:inherit; width:100%; }
.dbig b, .dbigin { font-family:var(--mono); font-size:52px; line-height:1.05; font-weight:500; font-variant-numeric:tabular-nums; }
.dbigin { width:5.4ch; text-align:center; border:none; border-bottom:2px solid var(--dc); background:none; color:var(--ink); padding:0; }
.dbigin:focus { outline:none; }
.dunit { font-size:15px; color:var(--muted); }
.dchips { display:flex; justify-content:center; gap:8px; margin-top:6px; }
.dchip { border:1.5px solid var(--dc); color:var(--dc); background:color-mix(in oklab, var(--dc) 8%, var(--surface));
  border-radius:999px; padding:8px 16px; font:600 14px/1 var(--body); cursor:pointer; font-variant-numeric:tabular-nums; }
.dcalc { display:block; margin:14px auto 0; color:var(--dc); }
.dmsgx { text-align:center; }
.calc { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
.cbrow { display:flex; gap:10px; margin-bottom:10px; align-items:flex-end; }
.cbf { display:flex; flex-direction:column; gap:4px; min-width:0; flex:1; }
.cbf > span { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.cbf .field { width:100%; min-width:0; box-sizing:border-box; font-size:16px; padding:10px; }
.cbsex { flex:1; }
.cbsex .range { display:flex; width:100%; }
.cbsex .range button { flex:1; padding:9px 0; font-size:14px; }
.copts { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
.copt { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:1.5px solid var(--line-strong);
  background:var(--surface); border-radius:12px; padding:11px 14px; cursor:pointer; font:inherit; color:inherit; }
.copt span { flex:1; display:flex; flex-direction:column; line-height:1.3; }
.copt b { font-weight:600; }
.copt small { font-size:12px; color:var(--muted); }
.copt em { font-style:normal; font-family:var(--mono); font-size:19px; font-weight:500; color:var(--dc); white-space:nowrap; }
.copt em small { font-family:var(--body); font-size:12px; color:var(--muted); margin-left:3px; }
.copt.on { border-color:var(--dc); background:color-mix(in oklab, var(--dc) 9%, var(--surface)); }
.cnote { margin:10px 2px 0; font-size:12px; color:var(--muted); line-height:1.45; }

/* ---------- V4.4: the Focus page is the dial ------------------------------ */
.wpage { display:flex; flex-direction:column; align-items:center; }
.wpage .wnav { width:100%; }
.wpage .focusbtn { margin-top:2px; }
.wdial { margin:6px auto 0; }
.wpaused { display:flex; align-items:center; gap:14px; }
.wpaused .dplay { margin-top:10px; }
.wend { margin-top:10px; color:var(--muted); }
.wlines { list-style:none; margin:14px 0 0; padding:0; width:100%; }
.wlines li { display:flex; align-items:center; gap:10px; min-height:44px; border-top:1px solid var(--line); }
.wlines li:last-child { border-bottom:1px solid var(--line); }
.wlines span { flex:1; min-width:0; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wlines small { margin-left:8px; font-size:12px; color:var(--muted); }
.wlines b { font-family:var(--mono); font-weight:500; font-size:14px; color:var(--work); }
.wlines button { border:none; background:none; color:var(--muted); font-size:20px; line-height:1; padding:6px 4px; cursor:pointer; }
.wpage .wadd { width:100%; }
/* ---------- V4.2: Focus, two cards ------------------------------------- */
.dtimer { display:flex; align-items:center; gap:10px; }
.dpm { width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--surface);
  color:var(--ink-2); font:500 20px/1 var(--body); cursor:pointer; padding:0; display:grid; place-items:center; }
.worklog .wday { display:flex; align-items:baseline; justify-content:center; gap:8px; margin:10px 0 6px; }
.worklog .wday b { font-family:var(--mono); font-size:34px; font-weight:500; color:var(--work); }
.worklog .wday span { color:var(--muted); font-size:14px; }
.worklog .sesslist { margin-top:8px; }
.wplus { display:block; margin:12px auto 2px; color:var(--work); }
.wadd { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:12px; }
.wadd #waLabel { flex:1 1 100%; font-size:16px; }
.wamin { display:inline-flex; align-items:center; gap:4px; }
.wamin .field { width:80px; font-size:16px; text-align:center; }
.wamin em { font-style:normal; color:var(--muted); font-size:13px; }
.wadd .btn { background:var(--work); padding:9px 16px; }

/* ---------- V4.2: supplements, weight -------------------------------- */
.ddsuprow { border-top:1px solid var(--line); }
.sups { margin:2px 0 0 24px; }
.supsh { display:flex; align-items:baseline; justify-content:space-between; margin:6px 0 2px; }
.spls { list-style:none; margin:0; padding:0; }
.spl { display:flex; align-items:center; gap:10px; min-height:40px; border-bottom:1px solid var(--line); }
.spn { flex:1; min-width:0; font-size:14.5px; }
.spn small { margin-left:8px; font-size:12.5px; color:var(--muted); }
.spi { flex:none; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--surface);
  color:var(--ink-2); font:italic 600 14px/1 var(--display); cursor:pointer; padding:0; }
.spi.on { border-color:var(--dc); color:var(--dc); }
.spcard { list-style:none; background:var(--surface-2); border-radius:10px; padding:10px 12px; margin:6px 0 8px; font-size:13px; line-height:1.45; }
.spcard p { margin:0 0 6px; }
.spcard p:last-child { margin:0; }
.spsrc { color:var(--muted); font-size:12px; }
.spsrc a { color:var(--dc); }
.spadd { flex:1; text-align:left; border:none; background:none; padding:8px 0; font:inherit; font-size:14.5px; color:var(--dc); cursor:pointer; }
.sadd { display:flex; gap:8px; margin:10px 0 4px; }
.sadd .field { min-width:0; flex:1; font-size:16px; padding:9px 10px; }
.sadd .btn { flex:none; padding:9px 14px; }
.sugh { margin:14px 0 2px; }
.wsub { text-align:center; font-size:13px; color:var(--muted); margin:2px 0 10px; }
.wsub b { color:var(--ink-2); font-weight:600; }
.wchart { width:100%; height:auto; display:block; margin-top:6px; }
.wline { fill:none; stroke:var(--diet); stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round; }
.wdot { fill:var(--surface); stroke:var(--diet); stroke-width:2; }
.wgoal { stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; }
.wax { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:2px; }
.wgl { color:var(--ink-2); }
/* ---------- V3.3: a day with no time, and the matrix view -------------- */
.twhen { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:10px; }
.twhen > span { font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  margin-right:2px; }
.tday { position:relative; border:1.5px solid var(--line); background:var(--surface); border-radius:99px;
  padding:6px 12px; font-family:inherit; font-size:13px; color:var(--ink-2); cursor:pointer; overflow:hidden; }
.tday.on { border-color:var(--qc, var(--work)); color:var(--qc, var(--work)); font-weight:600; }
.tpick input { position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; font-size:16px; }
.sany { margin:10px 0 4px; }
.sanyh { display:flex; align-items:baseline; gap:10px; width:100%; border:none; background:none; padding:6px 2px;
  font-family:inherit; text-align:left; cursor:default; }
.sanyh .eyebrow { margin:0; }
.sanyh em { font-style:normal; font-size:13px; color:var(--work); }
.sany.armed .sanyh { cursor:copy; border:1.5px dashed var(--work); border-radius:10px; padding:10px 12px; }
.sany .tm { --qc:var(--line-strong); }
.sany .tm.q1 { --qc:var(--tq1); } .sany .tm.q2 { --qc:var(--tq2); }
.sany .tm.q3 { --qc:var(--tq3); } .sany .tm.q4 { --qc:var(--muted); }
.sany .tr { min-height:44px; }
.sany .tt { cursor:default; padding:9px 0; }

/* The epigraph. Set in the display face, indented from the rule, quiet
   enough that it introduces the page rather than competing with it. */
/* The roster's own day control, inset from the card edges so it reads as
   belonging to the list rather than to the page. */
.famnav { margin:4px 0 10px; }
.famnav span { font-size:13px; }
.epi { margin:12px 0 0; padding-left:13px; border-left:2px solid var(--sleep-soft);
  font-family:var(--display); font-size:16px; line-height:1.4; font-style:italic;
  color:var(--ink-2); text-wrap:balance; }
.epi cite { display:block; margin-top:5px; font-family:var(--body); font-size:11px;
  font-style:normal; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
  color:var(--muted); }
.pyramid { position:relative; margin-top:18px; }
.pyrow { display:grid; grid-template-columns:repeat(var(--n), 1fr); gap:9px;
  margin-top:9px; width:calc((var(--n) / 4) * 100% + ((var(--n) - 4) / 4) * 9px);
  margin-inline:auto; }
.pcell { position:relative; }
.ptile { position:relative; width:100%; aspect-ratio:1 / 1; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:2px;
  padding:8px 7px; border:1px solid var(--line); border-radius:16px;
  background:var(--surface); font-family:inherit; color:var(--ink);
  text-align:center; cursor:pointer; line-height:1.15;
  transition:background .16s ease, border-color .16s ease, transform .12s ease; }
.ptile:active { transform:scale(.97); }
.ptile b { font-size:13.5px; font-weight:600; overflow-wrap:normal; hyphens:none; }
.ptile em { font-style:normal; font-size:10px; color:var(--muted); line-height:1.2;
  padding:0 2px; }
/* V2.7. The weight is pips, not a numeral — four dots at the apex, one at
   the base. You see it rather than read it, which is the whole point of
   putting the ranking into a shape in the first place. */
.ptile .pips { position:absolute; top:8px; left:9px; display:flex; gap:2.5px; }
.ptile .pips i { width:4px; height:4px; border-radius:50%;
  background:var(--line-strong); }
.pyrow:nth-child(4) .ptile .pips { top:6px; left:6px; gap:2px; }
.pyrow:nth-child(4) .ptile .pips i { width:3.5px; height:3.5px; }
.pyrow:nth-child(1) .ptile b { font-size:18px; }
.pyrow:nth-child(2) .ptile b { font-size:14.5px; }
.pyrow:nth-child(4) .ptile { border-radius:13px; padding:7px 5px; }
.pyrow:nth-child(4) .ptile b { font-size:11.5px; overflow-wrap:break-word; }
.pyrow:nth-child(4) .ptile em { font-size:9.5px; }
.pyrow:nth-child(4) .ptile .pts { top:5px; left:6px; font-size:9.5px; }
.ptile.on { border-color:var(--sleep); background:var(--sleep-soft); }
.ptile.on b { color:var(--sleep); }
.ptile.on .pips i { background:var(--sleep); }
/* Held and not-held differ by shape as well as colour — this gets tapped
   in the dark, and by base rate one of ten men here is colour-blind. */
.ptile.on::after { content:"\2713"; position:absolute; top:6px; right:8px;
  font-size:12px; font-weight:700; color:var(--sleep); }
/* A turned-up corner: it says "there is a back to this" in the one idiom
   everyone already knows, and it is its own tap target. */
.pinfo { position:absolute; right:0; bottom:0; width:34px; height:34px;
  border:none; background:none; padding:0; cursor:pointer;
  -webkit-tap-highlight-color:transparent; }
.pinfo::before { content:""; position:absolute; right:0; bottom:0;
  border-width:0 0 24px 24px; border-style:solid;
  border-color:transparent transparent
    color-mix(in oklab, var(--sleep) 14%, var(--surface-2)) transparent;
  border-bottom-right-radius:15px; transition:border-color .16s ease; }
.pinfo span { position:absolute; right:5px; bottom:2px; font-family:var(--display);
  font-size:13px; font-weight:500; font-style:italic; line-height:1; color:var(--ink-2); }
.ptile.on + .pinfo::before {
  border-color:transparent transparent
    color-mix(in oklab, var(--sleep) 30%, var(--surface)) transparent; }
.ptile.on + .pinfo span { color:var(--sleep); }
.pinfo:hover::before, .pinfo:active::before {
  border-color:transparent transparent var(--sleep) transparent; }
.pinfo:hover span, .pinfo:active span { color:#fff; }
.pyrow:nth-child(4) .pinfo::before { border-width:0 0 20px 20px;
  border-bottom-right-radius:12px; }
.pyrow:nth-child(4) .pinfo span { font-size:11px; right:4px; bottom:1px; }

/* The back of a tile, brought forward over the pyramid. */
.pback { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
  z-index:7; display:flex; flex-direction:column; gap:9px;
  padding:20px 22px; border-radius:20px;
  background:var(--surface); border:1px solid var(--sleep);
  box-shadow:0 22px 50px -18px rgba(10,14,40,.5);
  animation:flipin .22s ease both; }
/* The rest of the stack stays visible behind it, softened, so turning a
   tile over never feels like leaving the page. */
.pscrim { position:absolute; inset:-6px; z-index:6; border-radius:22px;
  background:var(--ground); opacity:.78; }
@keyframes flipin {
  from { opacity:0; transform:translateY(-50%) perspective(900px) rotateY(-88deg); }
  to   { opacity:1; transform:translateY(-50%) perspective(900px) rotateY(0); }
}
@media (prefers-reduced-motion: reduce) { .pback { animation:none; } }
.pback .pts { font-family:var(--mono); font-size:11px; font-weight:500;
  color:var(--sleep); letter-spacing:.04em; text-transform:uppercase; }
.pback b { font-family:var(--display); font-size:23px; font-weight:500;
  line-height:1.15; }
.pback p { margin:0; font-size:14px; line-height:1.5; color:var(--ink-2); }
.pbackrow { display:flex; gap:9px; margin-top:4px; }
.pbackrow .btn { flex:1; }
.devrow { margin-top:2px; font-family:var(--mono); font-size:11px; font-variant-numeric:tabular-nums; }
.devrow .late { color:var(--sleep); font-weight:600; }
.devrow .early, .devrow .on { color:var(--muted); }
.sessdate { display:inline-flex; align-items:center; gap:8px; margin-top:8px; font-size:13px; color:var(--muted); }
.sessdate .field { width:auto; padding:6px 8px; font-size:16px; }
.sessday { margin:6px 0 0; font-size:13px; color:var(--muted); }
.hd.kindtog { border:none; background:none; font:inherit; color:var(--accent); cursor:pointer; padding:0;
  text-decoration:underline dotted; text-underline-offset:3px; }
.hd.kindtog i { font-style:normal; margin-left:3px; font-size:10px; }
.bigtap { border:none; background:none; cursor:pointer; padding:0; font:inherit; color:inherit; display:block; margin:0 auto; }
.bigplus { display:block; font-size:12.5px; font-weight:600; margin-top:4px; }
.sessdate { margin-top:9px; border:1px solid var(--line); border-radius:999px;
  background:var(--surface); font-family:inherit; font-size:12.5px; color:var(--ink-2);
  padding:5px 12px; cursor:pointer; }
.sessdate span { margin-left:7px; font-size:10px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); }
.weekrow { display:flex; align-items:center; justify-content:center; gap:14px;
  margin-top:8px; font-size:12px; color:var(--muted); }
.weekrow button { border:none; background:none; font-family:inherit; font-size:17px;
  line-height:1; color:var(--ink-2); padding:2px 8px; cursor:pointer; border-radius:8px; }
.weekrow button:disabled { color:var(--line-strong); cursor:default; }

/* V1.7b — the log box is its own card, and carries its own date. */
/* V2.8. Round, filled, 40px — a thumb target that looks like one. The
   disabled "next" on today stays visible but faint, so the pair always
   reads as a pair and you can see which way time runs. */
.daynav { display:flex; align-items:center; justify-content:space-between; gap:10px; }
/* V5.7. The date strip under a habit page's title. */
.dstrip { margin:-4px 0 14px; }
.dsh2 { display:flex; align-items:center; justify-content:center; gap:4px; position:relative; min-height:34px; }
.dsm { border:none; background:none; color:var(--ink); font:inherit; font-size:15px; font-weight:600; padding:6px 10px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.dsm i { font-style:normal; font-size:10px; color:var(--muted); }
.dsn { width:32px; height:32px; border:none; background:none; color:var(--muted); border-radius:50%; cursor:pointer; padding:0; display:grid; place-items:center; }
.dsn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.dsn:disabled { opacity:.25; cursor:default; }
.dstoday { position:absolute; right:0; border:1px solid var(--line-strong); background:none; color:var(--accent); border-radius:99px; font:inherit; font-size:12.5px; padding:5px 11px; cursor:pointer; }
.dsw, .dsg { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); }
.dsw span { text-align:center; font-size:11px; color:var(--muted); padding:6px 0 2px; }
.dsg { row-gap:2px; touch-action:pan-y; }
.sd { position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; border:none; background:none; color:var(--ink); font:inherit; padding:5px 0 6px; cursor:pointer; }
.sd b { width:36px; height:36px; display:grid; place-items:center; border-radius:50%; font-size:15px; font-weight:500; font-variant-numeric:tabular-nums; }
.sd i { width:5px; height:5px; border-radius:50%; background:transparent; }
.sd.slog i { background:var(--ink-2); opacity:.6; }
.sd.smet i { background:var(--green); }
.sd.now b { color:var(--accent); font-weight:700; }
.sd.sel b { background:var(--accent); color:#17130c; font-weight:700; }
.sd.dim b { color:var(--muted); opacity:.55; }
.sd:disabled { cursor:default; }
.sd:disabled b { color:var(--muted); opacity:.35; }
.dnav { width:40px; height:40px; flex:none; border-radius:50%; cursor:pointer;
  border:1px solid var(--line-strong); background:var(--ground); color:var(--ink);
  display:grid; place-items:center; padding:0; transition:transform .08s, background .15s; }
.dnav svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2.4;
  stroke-linecap:round; stroke-linejoin:round; }
.dnav:active:not(:disabled) { transform:scale(.92); background:var(--line); }
.dnav:disabled { opacity:.3; cursor:default; }
.dlabel { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;
  gap:2px; text-align:center; }
.dlabel > span { font-size:14px; font-weight:600; color:var(--ink); }
.dlabel small { font-size:11px; color:var(--muted); letter-spacing:.02em; line-height:18px; }
.dtoday { border:none; background:none; padding:0; font-family:inherit; font-size:11.5px;
  font-weight:600; color:var(--accent); cursor:pointer; line-height:18px; }
.logrow { display:flex; align-items:center; gap:9px; margin-top:14px; }
.logrow input { flex:1; min-width:0; border:1px solid var(--line-strong); background:var(--surface);
  border-radius:11px; padding:11px 14px; text-align:right;
  font-family:var(--mono); font-size:20px; font-weight:500; color:var(--ink); }
.logrow input:focus { outline:none; border-color:var(--series); }
.logrow > em { font-style:normal; font-size:11px; color:var(--muted); flex:none; }

/* the graph, restored to a size you can actually read */
.bigchart .chart svg { height:118px; }
.bigchart .axis { margin-top:6px; font-size:11px; }
.rangetog { display:flex; border:1px solid var(--line); border-radius:999px; padding:2px;
  background:var(--surface); }
.rangetog button { border:none; background:none; font-family:inherit; font-size:11px;
  font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  padding:4px 11px; border-radius:999px; cursor:pointer; }
.rangetog button[aria-pressed="true"] { background:var(--soft); color:var(--accent); }

/* thirty-five days as dots: the execution score, drawn */
.grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:9px;
  margin:6px auto 0; max-width:266px; }
.gcell { aspect-ratio:1; border-radius:50%; border:1.5px solid var(--line); background:none;
  padding:0; cursor:pointer; }
.grid + .dshint, .gdow + .grid + .dshint { text-align:center; }
.gcell.part { border-color:currentColor; }
.gcell.full { border-color:currentColor; background:currentColor; }
.gcell.none  { border-style:dashed; }
.gcell.sel  { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink-2); }
.gcell:disabled { opacity:.3; cursor:default; }
.gcell { display:grid; place-items:center; }
.gcell i { font-style:normal; font-size:10px; font-weight:600; color:var(--ink-2);
  font-family:var(--body); }
.gcell.full i { color:var(--surface); }
.gcell.none i { color:var(--muted); }
.gdow { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:9px;
  margin:4px auto 0; max-width:266px;
  font-size:9.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  color:var(--muted); text-align:center; }

/* editing what a workout is made of */
.tmpl { margin-top:12px; padding:13px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface-2); }
.tmpl h3 { margin:0 0 9px; font-family:var(--display); font-weight:500; font-size:15px; }
.tmplrow { display:flex; align-items:center; gap:8px; padding:7px 0;
  border-bottom:1px solid var(--line); }
.tmplrow:last-of-type { border-bottom:none; }
.tmplrow .nm { flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; }
.tmplrow .sx { font-size:11px; color:var(--muted); font-family:var(--mono); }
.tmplrow button { border:none; background:none; font-family:inherit; font-size:15px;
  color:var(--muted); padding:3px 7px; cursor:pointer; border-radius:7px; }
.tmplrow button:disabled { opacity:.25; cursor:default; }
.unitrow { display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-top:18px; }
.unitrow > span { font-size:11px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); }
.strip .axis { display:flex; margin-top:5px; font-size:9.5px; color:var(--muted); }
.strip .axis span { text-align:center; }

/* Two engines. Wide, flat, and they go somewhere. */
.engines { display:grid; gap:8px; margin-top:16px; }
.engine { display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px;
  border:1px solid var(--line); border-radius:13px; background:var(--surface);
  font-family:inherit; font-size:15px; color:var(--ink); text-align:left;
  cursor:pointer; }
.engine .tick { flex:none; width:8px; height:8px; border-radius:99px;
  background:var(--line-strong); }
.engine.on .tick { background:var(--train); }
.engine.on.cardio .tick { background:var(--swim); }
.engine b { font-weight:500; flex:none; }
.engine .said { flex:1; min-width:0; font-size:13px; color:var(--muted);
  text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.engine .go { flex:none; color:var(--muted); font-size:15px; }

/* V2.1 — the pillars as rows. One row per live pillar, chips inline. */
.prow { display:flex; align-items:center; gap:10px; padding:12px 0;
  border-top:1px solid var(--line); }
.mine .prow:first-of-type { border-top:none; padding-top:6px; }
.pdot { flex:none; width:20px; height:20px; border-radius:50%;
  border:1.5px solid var(--line-strong); display:grid; place-items:center;
  color:transparent; font-size:11px; line-height:1; }
.prow.done .pdot { background:var(--series); border-color:var(--series); color:#17130c; }
:root[data-theme="dark"] .prow.done .pdot { color:#08120f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .prow.done .pdot { color:#08120f; }
}
.pname { flex:1; min-width:0; font-family:var(--display); font-size:17px;
  line-height:1.15; overflow-wrap:break-word; }
.chips { flex:none; display:flex; gap:6px; }
.chip { position:relative; width:58px; height:46px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1px; border:1px solid var(--line);
  border-radius:12px; background:var(--surface); font-family:inherit; color:inherit;
  cursor:pointer; padding:0; overflow:hidden; }
.chip b { font-family:var(--mono); font-size:13.5px; font-weight:500; line-height:1.1;
  letter-spacing:-.02em; color:var(--muted); }
.chip span { font-size:8.5px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); }
.chip.on { border-color:var(--series); background:var(--soft); }
.chip.on b { color:var(--ink); }
.chip.on span { color:var(--accent); }
.chip:active { transform:scale(.97); }
.netbar { display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin:0 0 12px; padding:9px 13px; border-radius:10px; background:var(--warn-soft);
  border:1px solid var(--line); font-size:12.5px; color:var(--ink-2); }
.netbar button { border:none; background:none; font-family:inherit; font-size:12.5px;
  font-weight:600; color:var(--warn); cursor:pointer; padding:2px 4px; }
.undobar { display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin:2px 0 6px; padding:8px 12px; border-radius:10px; background:var(--surface-2);
  font-size:12.5px; color:var(--ink-2); }
.undobar button { border:none; background:none; font-family:inherit; font-size:12.5px;
  font-weight:600; color:var(--accent); cursor:pointer; padding:2px 4px; }
.soon { margin-top:4px; padding-top:11px; border-top:1px solid var(--line);
  font-size:12px; color:var(--muted); letter-spacing:.01em; }
.soon em { font-style:normal; margin-left:8px; font-size:9px; font-weight:600;
  letter-spacing:.09em; text-transform:uppercase; padding:2px 6px; border-radius:99px;
  background:var(--surface-2); }
.sleepline { margin-top:3px; font-size:11.5px; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* the family block on a metric page: folded by default */
.fam .frow { display:flex; align-items:center; gap:11px; padding:9px 0;
  border-bottom:1px solid var(--line); }
.fam .frow:last-child { border-bottom:none; }
.fam .dot { flex:none; width:26px; height:26px; border-radius:99px; display:grid;
  place-items:center; font-size:10px; font-weight:600; }
.fam .fname { flex:1; min-width:0; font-size:14px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.fam .trend { flex:none; width:66px; height:20px; }
.fam .fval { flex:none; min-width:52px; text-align:right; font-family:var(--mono);
  font-size:13px; color:var(--muted); }
.fam .frow.did .fval { color:var(--series); }
.fam .loading { padding:12px 0; font-size:13px; color:var(--muted); }


/* V1.6 — the chart IS the form. One line, under the bar you tapped. */
.daysheet { display:flex; align-items:center; gap:9px; margin-top:12px;
  padding:10px 12px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface); }
.daysheet > span { font-size:13px; color:var(--ink); font-weight:500; flex:none;
  min-width:62px; }
.daysheet input { flex:1; min-width:0; border:none; background:none; text-align:right;
  font-family:var(--mono); font-size:22px; font-weight:500; color:var(--ink);
  padding:0; }
.daysheet input:focus { outline:none; }
.daysheet > em { font-style:normal; font-size:11px; color:var(--muted); flex:none; }
.dshint { margin-top:8px; }


/* the segment that drives both the chart and the log under it */
.segrow { display:flex; align-items:center; gap:10px; }
.seg { display:flex; flex:1; border:1px solid var(--line); border-radius:999px;
  padding:3px; background:var(--surface); }
.seg button { flex:1; border:none; background:none; border-radius:999px;
  padding:7px 4px; font-family:inherit; font-size:13px; font-weight:500;
  color:var(--muted); cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--surface-2); color:var(--ink);
  font-weight:600; }

/* the date under the group name is a control */

/* stacked mini charts */
.mini + .mini { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
.mini-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.mini-name { font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
.mini-total { font-family:var(--mono); font-size:11px; color:var(--muted); }
.mini .chart svg { height:96px; }
.mini-foot { margin-top:4px; }

.ver { text-align:center; font-family:var(--mono); font-size:11px;
  color:var(--line-strong); letter-spacing:.06em; }
/* Tap the thing you want to change. Underlined so it reads as editable
   without adding a button or an icon anywhere. */
.tapedit { background:none; border:none; padding:0; cursor:pointer;
  font-family:inherit; font-weight:600; font-size:14px; color:var(--ink);
  text-decoration:underline; text-decoration-style:dotted;
  text-decoration-color:var(--line-strong); text-underline-offset:3px; }
.tapedit.small { font-size:11px; font-weight:400; color:var(--muted); }
.tapedit.small.met { color:var(--accent); font-weight:500; }
.chart svg rect[data-day] { cursor:pointer; }
/* Which way is late. Set in HTML, not in the SVG: the chart is stretched
   horizontally (preserveAspectRatio none) and any text inside it would
   be stretched with it. */
.chart.dev { position:relative; }
.devax { position:absolute; left:1px; font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); opacity:.75; pointer-events:none; }
.devax.up { top:6px; }
.devax.dn { bottom:26px; }
.chart.dev:has(.devrow) .devax.dn { bottom:46px; }
.install { display:flex; align-items:flex-start; gap:10px; padding:12px 14px;
  border:1px solid var(--line); border-radius:12px; background:var(--soft);
  font-size:13px; color:var(--ink-2); }
.install .ibody { flex:1; min-width:0; }
.install .ih { margin:0 0 2px; font-weight:700; color:var(--ink); font-size:16px; }
.install .ilead { margin:0 0 10px; font-size:13.5px; color:var(--muted); }
.install ol.isteps { list-style:none; counter-reset:is; margin:0; padding:0; display:grid; gap:10px; font-size:15px; color:var(--ink); }
.install ol.isteps li { counter-increment:is; display:flex; gap:10px; align-items:flex-start; line-height:1.45; }
.install ol.isteps li > span { flex:1; min-width:0; }
.install ol.isteps li::before { content:counter(is); flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center;
  background:var(--accent); color:var(--ground); font-weight:700; font-size:13px; }
.install .ithen { margin:10px 0 0; font-size:13.5px; color:var(--muted); }
.install .ibtn { margin-top:2px; background:var(--accent); color:#17130c; font-size:15px; padding:12px 20px; width:100%; }
.install .iico { width:19px; height:19px; vertical-align:-4px; }
.install small { color:var(--muted); font-size:11.5px; }
.install b { color:var(--ink); }
.iico { width:17px; height:17px; vertical-align:-3px; fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.iico circle { fill:var(--accent); stroke:none; }
.install button { background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:18px; line-height:1; padding:0 2px; flex:none; }
.banner { border:1px solid var(--line-strong); background:var(--warn-soft);
  border-radius:12px; padding:13px 15px; font-size:13.5px; color:var(--ink-2); }
.center { display:grid; place-items:center; min-height:60vh; }
.spinner { font-size:13px; color:var(--muted); }

/* ---------------------------------------------------------------- */
/* V1.3 — Lift. Orange throughout, matching the Train series on the  */
/* chart, so "Train" and "Lift" read as one thing and not two.       */
/* ---------------------------------------------------------------- */
.topbar { display:flex; align-items:center; gap:8px; }
.backlink { background:none; border:none; padding:6px 10px 6px 0; cursor:pointer;
  color:var(--muted); font-size:14px; font-family:inherit; }
.topbar.hbar { position:sticky; top:0; z-index:40; margin:-28px -18px -14px; padding:calc(env(safe-area-inset-top, 0px) + 8px) 18px 8px;
  background:color-mix(in oklab, var(--ground) 90%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-bottom:1px solid transparent; transition:border-color .2s; }
.hbscrolled .topbar.hbar { border-bottom-color:var(--line); }
.topbar.hbar .backlink { display:inline-flex; align-items:center; gap:2px; min-height:44px; padding:6px 14px 6px 0; color:var(--accent); font-size:17px; font-weight:600; }
.topbar.hbar .backlink svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; margin-left:-6px; }
.hbt { position:absolute; left:50%; transform:translateX(-50%); max-width:46%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-weight:600; font-size:16px; opacity:0; transition:opacity .2s; pointer-events:none; }
.hbscrolled .hbt { opacity:1; }
.sync { margin-left:auto; font-size:10.5px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); }
.sync.saving  { color:var(--train); }
.sync.saved   { color:var(--accent); }
.sync.offline { color:var(--warn); }

/* V2.8. The first workout. Three full-width rows, not tiles: each is a
   decision to read, not a shortcut to recognise. */
.firstcard { margin:0 0 16px; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; padding:18px 16px 14px; box-shadow:var(--shadow); }
.firstcard h2 { margin:2px 0 0; font-family:var(--display); font-weight:500; font-size:22px; }
.starters { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
.starter { text-align:left; background:var(--ground); border:1px solid var(--line);
  border-radius:12px; padding:12px 14px; font-family:inherit; color:inherit; cursor:pointer;
  display:flex; flex-direction:column; gap:3px; position:relative; }
.starter::after { content:"›"; position:absolute; right:14px; top:50%;
  transform:translateY(-50%); font-size:22px; color:var(--muted); }
.starter b { font-size:15px; font-weight:600; }
.starter span { font-size:12.5px; color:var(--muted); padding-right:22px; line-height:1.35; }
.starter:active { transform:scale(.99); }
/* One line, once: what just happened to the workout you finished. */
.flash { margin:0 0 14px; padding:10px 14px; border-radius:12px; font-size:13.5px;
  background:var(--train-soft); color:var(--ink); text-align:center; }
.firstempty { justify-content:center; padding:13px; font-size:14px; }
.tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile { text-align:left; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:13px; cursor:pointer; font-family:inherit; color:inherit;
  display:flex; flex-direction:column; gap:5px; min-height:100px; }
.tile b { font-size:15px; font-weight:600; }
.tile .ex { font-size:12px; color:var(--muted); line-height:1.35; display:-webkit-box;
  -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.tile .ago { margin-top:auto; font-size:11px; color:var(--muted); font-style:italic; }

.hcard { background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:15px; box-shadow:var(--shadow); cursor:pointer; width:100%; text-align:left;
  font-family:inherit; color:inherit; display:block; }
.hcard + .hcard { margin-top:10px; }
.hcard h3 { margin:0; font-size:16px; font-family:var(--display); font-weight:500; }
.hcard .when { font-size:13px; color:var(--muted); margin-top:1px; }
/* The day's note, beside the template's name. Same line, clearly second. */
.hnote { font-family:var(--body); font-size:13px; font-weight:400; color:var(--muted);
  margin-left:8px; }
.hnote::before { content:"\00b7"; margin-right:8px; }
.hmeta { display:flex; gap:16px; margin:10px 0 2px; font-size:13px; color:var(--ink-2); }
.hmeta b { font-family:var(--mono); font-weight:500; }
.htab { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
.htab th { text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); padding:6px 0 3px; }
.htab td { padding:3px 0; }
.htab td:last-child, .htab th:last-child { text-align:right; font-family:var(--mono); }
.htab td.nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:0; width:60%; }

.timer { display:flex; align-items:baseline; gap:14px; font-family:var(--mono);
  font-size:12.5px; color:var(--muted); margin-top:2px; }
.timer b { font-size:26px; color:var(--ink); font-weight:500; letter-spacing:-.02em; }
.exblock { background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:14px; box-shadow:var(--shadow); }
.exblock + .exblock { margin-top:10px; }
.exhead { display:flex; align-items:center; gap:8px; }
.exhead b { flex:1; font-size:15px; font-weight:600; color:var(--train);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.xbtn { background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:18px; line-height:1; padding:2px 5px; }
.setgrid { display:grid; grid-template-columns:20px minmax(52px,.85fr) 1fr 1fr 38px 22px;
  gap:6px; align-items:center; margin-top:9px; }
.setgrid .hd { font-size:10px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); text-align:center; }
.setgrid .hd.l { text-align:left; }
.setgrid .ix { font-family:var(--mono); font-size:13px; color:var(--muted); text-align:center; }
.setgrid input { width:100%; border:1px solid var(--line-strong); background:var(--surface);
  border-radius:9px; padding:9px 6px; font-family:var(--mono); font-size:17px;
  font-weight:500; text-align:center; }
.setgrid input:focus { border-color:var(--train); }
.setgrid input.on { border-color:transparent; background:var(--train-soft); }
.tick { border:1px solid var(--line-strong); background:none; border-radius:9px;
  height:39px; cursor:pointer; color:var(--muted); font-size:15px; }
.tick[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#17130c; }
@media (prefers-color-scheme: dark) { .tick[aria-pressed="true"] { color:#08120f; } }
.addset { width:100%; margin-top:9px; border:1px dashed var(--line-strong); background:none;
  border-radius:9px; padding:9px; color:var(--muted); font-family:inherit; font-size:13px;
  cursor:pointer; }
.exadd { display:flex; gap:8px; margin-top:12px; }
.exadd input { flex:1; min-width:0; }

.labelin { flex:1; min-width:0; background:none; border:none; padding:0 0 3px;
  font-family:var(--display); font-size:28px; font-weight:500; line-height:1.15;
  letter-spacing:-0.01em; color:var(--train);
  border-bottom:1px dotted var(--line-strong); }
.labelin::placeholder { color:var(--line-strong); }
.notein { display:block; width:100%; margin-top:2px; background:none; border:none;
  padding:1px 0; font-family:inherit; font-size:13.5px; color:var(--ink-2); }
.notein::placeholder { color:var(--muted); }
.notein:focus { outline:none; border-bottom:1px dotted var(--line-strong); }
.labelfix { display:block; font-family:var(--display); font-size:28px; font-weight:500;
  line-height:1.15; letter-spacing:-0.01em; color:var(--train);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.liftchip { background:none; border:1px solid var(--line); border-radius:999px;
  padding:1px 8px; font-family:var(--mono); font-size:10.5px; color:var(--train);
  cursor:pointer; white-space:nowrap; }
.liftchip.cardio { color:var(--series); }
.liftchip.work { color:var(--work); cursor:default; }

/* V1.4 */
.weeknav { display:flex; gap:6px; }
.weeknav button { border:1px solid var(--line); background:none; border-radius:999px;
  width:30px; height:26px; font-size:15px; line-height:1; color:var(--ink);
  cursor:pointer; padding:0; }
.weeknav button:disabled { opacity:.3; cursor:default; }

.foldbtn { display:flex; align-items:center; gap:6px; background:none; border:none;
  padding:0; cursor:pointer; font-family:inherit; color:inherit; }
.foldbtn .caret { font-size:11px; color:var(--muted); width:11px; }

.tilewrap { position:relative; }
.tilewrap .tile { width:100%; }
.tilemenu { position:absolute; top:6px; right:6px; background:none; border:none;
  color:var(--muted); font-size:17px; line-height:1; padding:2px 7px; cursor:pointer; }
.sheet { position:absolute; top:30px; right:6px; z-index:5; background:var(--surface);
  border:1px solid var(--line-strong); border-radius:11px; box-shadow:var(--shadow);
  overflow:hidden; min-width:132px; }
.sheet button { display:block; width:100%; text-align:left; background:none;
  border:none; border-top:1px solid var(--line); padding:10px 13px; font-size:13.5px;
  font-family:inherit; color:var(--ink); cursor:pointer; }
.sheet button:first-child { border-top:none; }

.setgrid.one { grid-template-columns:20px minmax(52px,.85fr) 1fr 38px 22px; }
/* What you did last time, greyed. It is a reference, not a field: you
   read it, you type over the number beside it, you move on. Strong puts
   it here and it is the single reason their logger feels like memory. */
.setgrid .prev { font-family:var(--mono); font-size:11.5px; color:var(--muted);
  text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kindmini { display:flex; gap:3px; flex:none; }
.kindmini button { border:1px solid var(--line); background:var(--surface);
  color:var(--muted); border-radius:99px; padding:3px 8px; font-family:inherit;
  font-size:10px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  cursor:pointer; white-space:nowrap; }
.kindmini button[aria-pressed="true"] { border-color:var(--train); color:var(--train);
  background:var(--train-soft); }
/* The unit, not a mode: set apart so it does not read as a third choice
   of what the exercise records. */
.unitchip { margin-left:4px; border-style:dashed !important; color:var(--series) !important;
  text-transform:lowercase !important; letter-spacing:0 !important;
  font-family:var(--mono) !important; }
.xset { border:none; background:none; color:var(--line-strong); font-size:17px;
  line-height:1; padding:0; cursor:pointer; }
.xset:hover, .xset:active { color:var(--warn); }
.exname { flex:1; min-width:0; border:none; background:none; font-family:inherit;
  font-size:15px; font-weight:600; color:var(--ink); padding:2px 0; }
.exname:focus { outline:none; border-bottom:1px solid var(--train); }
.durwrap { display:inline-flex; align-items:baseline; gap:4px; }
.durin { width:62px; border:1px solid var(--line-strong); background:var(--surface);
  border-radius:9px; padding:4px 8px; font-family:var(--mono); font-size:19px;
  font-weight:500; text-align:right; color:var(--ink); }
.durin:focus { outline:none; border-color:var(--train); }
.durwrap em { font-style:normal; font-size:11px; color:var(--muted); }
.hd.unit { border:none; background:none; padding:0; cursor:pointer; font:inherit;
  font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--train); text-decoration:underline; text-decoration-style:dotted;
  text-underline-offset:3px; }
.empty { text-align:center; padding:26px 16px; color:var(--muted); font-size:14px; }

/* ---------- V3.4: the dials, any three ---------------------------------- */
.slab { display:inline-flex; align-items:center; gap:5px; border:none; background:none; font-family:inherit;
  cursor:pointer; padding:4px 8px; border-radius:8px; }
.slab i { font-style:normal; font-size:15px; letter-spacing:0; color:var(--line-strong); transform:translateY(-1px); }
.dnum.dmin { font-size:clamp(38px, 12vw, 54px); }
.dgo { border:none; background:none; color:var(--ink); cursor:pointer; padding:0 6px; line-height:1.1; }
.dnone { color:var(--line-strong) !important; }
.dnow { border:none; background:none; cursor:pointer; padding:0 10px; color:var(--accent); line-height:1.1; }
.dedit { display:block; margin:2px auto 0; border:none; background:none; font-family:inherit; font-size:12px;
  color:var(--muted); cursor:pointer; padding:6px 10px; text-decoration:underline dotted;
  text-decoration-color:var(--line-strong); text-underline-offset:3px; }

/* ---------- V3.6: quick actions on the dials ---------------------------- */
.dsame { margin-top:10px; border:none; border-radius:99px; padding:9px 16px; background:var(--sleep-soft); color:var(--sleep);
  font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; }
.dsame:active { transform:scale(.97); }
/* V6.4. Goals, today first. */
.gtop { display:flex; flex-direction:column; gap:6px; }
.gtw { display:grid; grid-template-columns:1fr auto; align-items:center; column-gap:10px; }
.gtw b { font-family:var(--display); font-weight:500; font-size:24px; white-space:nowrap; }
.gtw span { grid-column:1; }
.gtw em { grid-column:2; grid-row:1 / span 2; }
.gtw b small { font-family:var(--body); font-size:14px; color:var(--muted); }
.gtw span { font-size:13px; color:var(--muted); }
.gtw em { font-style:normal; font-weight:700; font-size:28px; font-variant-numeric:tabular-nums; }
.gtbar { position:relative; height:10px; border-radius:5px; background:var(--line); }
.gtbar i { display:block; height:100%; border-radius:5px; transition:width .3s; }
.gtbar b { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); opacity:.55; border-radius:1px; }
.gtwin { font-size:13px; color:var(--muted); }
.gtwin .dof { font-size:13px; }
.gwtabs { display:flex; gap:6px; overflow-x:auto; padding:4px 0 2px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.gwtabs::-webkit-scrollbar { display:none; }
.gwt { flex:none; display:flex; flex-direction:column; align-items:center; min-width:48px; padding:6px 8px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2); font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
.gwt small { font-size:11px; font-weight:500; color:var(--muted); }
.gwt.won small { color:var(--green-ink, #4f9a6c); }
.gwt.on { border-color:var(--work); background:color-mix(in oklab, var(--work) 14%, var(--surface)); color:var(--ink); }
.gdh { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.gdh h2 { font-size:22px; }
.gdh span { font-size:13px; color:var(--muted); }
.gtdays { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:6px; margin:12px 0 4px; }
.gtds { position:relative; height:36px; border-radius:50%; border:1px solid var(--line); background:none; color:var(--ink-2); font:inherit; font-weight:600; font-size:13px; cursor:pointer; max-width:40px; justify-self:center; width:100%; }
.gtds.on { background:var(--work); border-color:var(--work); color:#fff; }
.gtds.has::after { content:""; position:absolute; left:50%; bottom:3px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--work); }
.gtds.on.has::after { background:#fff; }
.gtds:disabled { opacity:.35; cursor:default; }
.g1one { display:flex; align-items:center; gap:10px; margin:12px 0 4px; padding:10px 12px; border-radius:12px; background:var(--soft, var(--surface-2)); }
.g1one .g1lab { flex:none; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.g1one .g1t { flex:1; min-width:0; }
.g1one.done .g1t { text-decoration:line-through; color:var(--muted); }
.gdg { margin-top:14px; }
.gdgt { display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; }
.gdgt span:nth-child(2) { flex:1; min-width:0; overflow-wrap:anywhere; }
.gdgt em { font-style:normal; font-size:13px; font-variant-numeric:tabular-nums; }
.gchks { list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }
.gchk { display:flex; align-items:center; gap:12px; width:100%; min-height:52px; padding:8px 12px; border-radius:14px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
.gchk i { flex:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--line-strong); display:grid; place-items:center; transition:background .15s, border-color .15s; }
.gchk.on i { background:var(--work); border-color:var(--work); }
.gchk.on i::after { content:""; width:11px; height:6px; border-left:2.5px solid #fff; border-bottom:2.5px solid #fff; transform:translateY(-1px) rotate(-45deg); }
.gchk span { flex:1; min-width:0; font-size:16px; overflow-wrap:anywhere; }
.gchk.on span { color:var(--ink-2); }
.gchk small { flex:none; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.gchk small.full { color:var(--green-ink, #4f9a6c); font-weight:600; }
.gchk:active { transform:scale(.99); }
.gdnone { margin-top:12px; }
.ggl { list-style:none; margin:8px 0 0; padding:0; }
.ggi { border-top:1px solid var(--line); }
.ggi:first-child { border-top:none; }
.ggh { display:flex; align-items:center; gap:10px; width:100%; padding:12px 0; border:none; background:none; color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
.ggt { flex:1; min-width:0; display:flex; flex-direction:column; }
.ggt b { font-size:16px; overflow-wrap:anywhere; }
.ggt small { font-size:12.5px; color:var(--muted); }
.ggh em { font-style:normal; font-weight:700; font-variant-numeric:tabular-nums; }
.ggh i { font-style:normal; color:var(--muted); font-size:12px; }
.ggi .gdet { padding:0 0 12px; }
.pgmini { padding:14px 16px 10px; }
.pgtwo { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.pgtwo > div { display:flex; flex-direction:column; min-width:0; }
.pgtwo b { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
.pgtwo b.pgok { color:var(--green-ink, #4f9a6c); }
.pgtwo small { font-size:12.5px; color:var(--muted); }
.pgmore { display:block; margin:8px 0 0 auto; font-size:13px; }
/* V6.5. The steps game (STEP UP). */
.brow em.bpts { min-width:34px; font-size:18px; font-weight:800; color:var(--ink); }
.brow em.bpts.dn { color:#e0904a; }
.bset { display:flex; flex-direction:column; width:100%; margin:10px 0 4px; padding:12px 14px; border-radius:14px; border:1.5px solid var(--accent);
  background:color-mix(in oklab, var(--accent) 12%, var(--surface)); color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
.bset b { font-size:15px; } .bset small { font-size:12.5px; color:var(--muted); }
.ggbase { font-size:15px; margin:6px 0 10px; } .ggbase small { color:var(--muted); }
.ggopts { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
.ggopt { display:flex; flex-direction:column; align-items:center; padding:12px 4px; border-radius:14px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); font:inherit; cursor:pointer; }
.ggopt b { font-size:18px; font-variant-numeric:tabular-nums; } .ggopt small { color:var(--muted); font-size:12px; }
.ggopt.on { border-color:var(--accent); background:color-mix(in oklab, var(--accent) 16%, var(--surface)); }
.gglab { display:block; margin:14px 0 6px; font-size:13px; color:var(--ink-2); font-weight:600; }
.ggsheet .field { width:100%; font-size:16px; }
.ggpledge { margin:14px 0 4px; font-family:var(--display); font-size:17px; color:var(--ink); text-align:center; }
.glevels { display:flex; justify-content:space-between; align-items:flex-end; margin:6px 0 4px; }
.glv { display:flex; flex-direction:column; align-items:center; opacity:.5; }
.glv.on { opacity:1; } .glv small { font-size:11.5px; color:var(--muted); } .glv.on small { color:var(--ink); font-weight:700; }
.gnow { font-size:14.5px; margin:4px 0 2px; text-align:center; } .gnow b { font-size:18px; }
.gsrc { margin-top:10px; font-size:12px; color:var(--muted); }

.bcard { cursor:default; }
.bcard:active { transform:none; }
.bhead { display:block; width:100%; border:none; background:none; padding:0; color:inherit; font:inherit; text-align:left; cursor:pointer; }
.bhead .gd1 small { color:var(--ink-2); font-weight:600; }
.blist { list-style:none; margin:8px 0 2px; padding:0; }
.brow { display:flex; align-items:center; gap:8px; min-height:38px; padding:2px 0; }
.brow + .brow { border-top:1px solid var(--line); }
.brk { flex:none; width:14px; font-size:12px; font-weight:700; color:var(--muted); text-align:center; }
.bpl { flex:none; display:grid; place-items:center; width:30px; }
.bpl.dry svg { filter:saturate(.45); opacity:.7; }
.bmid { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; padding:3px 0; }
.bnm { min-width:0; font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bsub { display:flex; flex-wrap:wrap; align-items:center; gap:2px 8px; }
.bsub small { font-size:11.5px; color:var(--muted); white-space:nowrap; }
.bsub small.brisk { color:#e0904a; font-weight:700; }
.brow.me .bnm::after { content:" (you)"; font-weight:400; color:var(--muted); font-size:12px; }
.bdots { flex:none; display:flex; gap:3px; }
.bdots i { width:8px; height:8px; border-radius:50%; border:1.5px solid var(--line); box-sizing:border-box; }
.bdots i.on { background:var(--green); border-color:var(--green); }
.bdots i.miss { border-color:#e0904a; background:color-mix(in oklab, #e0904a 25%, transparent); }
.bdots i.now { border-color:var(--ink-2); }
.brow em { flex:none; min-width:44px; text-align:right; font-style:normal; font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.brow em.bok { color:var(--green-ink, #4f9a6c); font-weight:700; }
.brow em.brisk { color:#e0904a; font-weight:700; }
.brow em.blost { color:var(--muted); }
.brow.lost .bnm { color:var(--muted); }
.bnudge { flex:none; padding:4px 10px; border-radius:99px; border:1px solid #e0904a; color:#e0904a; font-size:12.5px; font-weight:700; cursor:pointer; }
.gdwk.bline { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.btot { flex:none; font-variant-numeric:tabular-nums; }
.bnew { margin:6px 0 0; font-size:12.5px; color:var(--muted); }
.bcard.slip { border-color:var(--line-strong); }
.bstreak { display:flex; align-items:baseline; gap:10px; margin:2px 0 4px; }
.bstreak b { font-family:var(--display); font-weight:500; font-size:44px; line-height:1; }
.bstreak span { font-size:14px; color:var(--muted); }
@media (max-width:360px) { .bdots i { width:7px; height:7px; } .brow em { min-width:50px; } }
/* V6.4. The family garden: one card under the dials, one sheet behind it. */
.gcard { display:block; width:100%; margin:6px 0 4px; padding:12px 14px 11px; border:1px solid var(--line); border-radius:18px; background:var(--surface); color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
.gcard:active { transform:scale(.99); }
.gd1 { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.gd1 b { font-size:16px; font-weight:700; }
.gd1 small { font-size:12.5px; color:var(--muted); }
.gdrow { display:flex; flex-wrap:wrap; gap:2px 4px; margin:6px 0 2px; }
.gdp { display:flex; flex-direction:column; align-items:center; width:54px; min-width:0; }
.gdp small { font-size:11px; color:var(--muted); max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gdp.wet small { color:var(--ink); font-weight:600; }
.gdp.dry svg, .gdpl.dry svg { filter:saturate(.45); opacity:.7; }
.gdbar { display:block; height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin:6px 0 4px; }
.gdbar i { display:block; height:100%; background:linear-gradient(90deg, var(--green), #8fd3a5); border-radius:4px; transition:width .4s ease; }
.gdbar.won i { background:linear-gradient(90deg, #f4b6c8, #e88aa6); }
.gdbar.big { height:12px; border-radius:6px; }
.gdwk { display:block; font-size:12.5px; color:var(--muted); }
.gdcard.bloom { border-color:#e88aa6; }
.gdcard.bloom .gdwk { color:var(--ink); font-weight:600; }
.gdbig { list-style:none; margin:4px 0 6px; padding:0; }
.gdbig li { display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line); }
.gdbig li:first-child { border-top:none; }
.gdpl { flex:none; display:grid; place-items:center; }
.gdn { flex:1; min-width:0; display:flex; flex-direction:column; }
.gdn b { font-size:16px; display:flex; align-items:center; gap:7px; }
.gdn b i { width:8px; height:8px; border-radius:50%; flex:none; }
.gdn small, .gdst small { font-size:12.5px; color:var(--muted); }
.gdst { flex:none; text-align:right; display:flex; flex-direction:column; font-size:13px; color:var(--ink-2); }
.tkweek { padding:10px 0 4px; }
.tkw1 { display:flex; justify-content:space-between; align-items:baseline; }
.tkw1 span { font-variant-numeric:tabular-nums; color:var(--ink-2); }
.gdpast { display:flex; align-items:center; gap:6px; margin:8px 0 0; font-size:16px; color:var(--muted); }
.gdpast small { margin-left:4px; font-size:12px; }
.gdhow { list-style:none; margin:0; padding:0; }
.gdhow li { font-size:14.5px; color:var(--ink-2); padding:5px 0; line-height:1.45; }
.gdhow li b:first-child { display:inline-block; min-width:28px; }
.gconf { font-size:48px; }
.gbloomer { display:inline-block; animation:gbloom 1.2s ease-out; }
@keyframes gbloom { 0% { transform:scale(.2) rotate(-40deg); opacity:0; } 60% { transform:scale(1.25) rotate(8deg); opacity:1; } 100% { transform:none; } }
.gplantbig { display:grid; place-items:center; }
@media (prefers-reduced-motion: reduce) { .gbloomer { animation:none; } }
.trplus { display:block; width:100%; margin-top:18px; font-size:17px; padding:15px 20px; border-radius:14px; }
.trsheet .section-head { margin-top:10px; }
.trsheet .trempty { display:block; width:100%; margin-top:14px; }
.trsheet .tadd2 { display:block; margin:14px auto 6px; }
.trsheet .unitrow, .trsheet .range { margin-top:10px; }
.cqtl { margin:14px 0 6px; font-size:13px; font-weight:600; color:var(--ink-2); }
.cqtl small { font-weight:400; color:var(--muted); }
.cqtgt { display:flex; gap:8px; }
.cqtgt .field { flex:1; min-width:0; font-size:16px; }
.cqtgt select.field { flex:0 0 96px; }
.chold { text-align:center; margin-top:10px; font-size:12.5px; }
.btn-quiet.bad { color:var(--warn); margin-right:auto; }
.ctile { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
.dval.over, .wfclock.over { color:var(--work); }
.tsedit { flex:1; min-width:0; font-size:15px; padding:4px 0; border:none; border-bottom:1px dashed var(--line-strong); background:none; color:var(--ink); border-radius:0; }
.tsx.done .tsedit { color:var(--muted); text-decoration:line-through; }
.tsv .tt.sm { border:none; background:none; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer; }
.tadd2 { display:block; margin:12px auto 4px; }
.tadd3 { margin-top:12px; }
.dsame.msame { margin-top:10px; padding:9px 16px; border:1px solid var(--accent); border-radius:99px; color:var(--accent); background:color-mix(in oklab, var(--accent) 10%, transparent); font-weight:600; }
.dtaskrow { display:flex; align-items:center; gap:6px; width:72%; margin-top:8px; }
.dtaskrow .dtaskin { flex:1; min-width:0; width:auto !important; margin-top:0 !important; }
.dtaskok { --qc:var(--tq2); width:32px; height:32px; }
.dtaskok svg { width:18px; height:18px; }
.dtaskin { margin-top:8px; width:64%; border:none; border-bottom:1.5px dashed var(--line-strong); background:none;
  text-align:center; font-family:inherit; font-size:16px; color:var(--ink); padding:6px 0; border-radius:0; }
.dtaskin:focus { outline:none; border-bottom:1.5px solid var(--work); }
.dtaskin::placeholder { color:var(--muted); }
.hflist { max-height:min(46vh, 340px); }
.cqchips { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.cqc { border:1.5px solid var(--line); background:var(--surface); border-radius:99px; padding:8px 14px;
  font-family:inherit; font-size:14px; font-weight:600; color:var(--ink-2); cursor:pointer; }
.cqc.on { border-color:var(--swim); color:var(--swim); background:var(--swim-soft); }
.cqother { width:100%; box-sizing:border-box; margin-top:10px; font-size:16px; }
.cqrow { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
.cqf { display:flex; flex-direction:column; gap:4px; }
.cqf > span:first-child { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.cqin { display:flex; align-items:baseline; gap:6px; border-bottom:2px solid var(--swim); padding-bottom:2px; }
.cqin input { flex:1; min-width:0; width:100%; border:none; background:none; font-family:var(--mono); font-size:28px;
  font-weight:500; color:var(--ink); padding:0; }
.cqin input:focus { outline:none; }
.cqin em { font-style:normal; font-size:13px; color:var(--muted); }
.cqin .unitchip { border:1px solid var(--line-strong); background:none; border-radius:8px; padding:2px 7px; font-size:12px; cursor:pointer; }

/* ---------- V3.4: one sheet for standards and for choosing dials -------- */
.sheetbg { position:fixed; inset:0; z-index:44; background:rgba(10,14,12,.36); animation:mfade .14s ease both; }
.stdsheet { position:fixed; z-index:45; left:12px; right:12px; top:calc(env(safe-area-inset-top, 0px) + 56px);
  max-width:420px; margin:0 auto; max-height:calc(100vh - 120px); overflow:auto;
  background:var(--surface); border-radius:20px; padding:20px 18px 16px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.45); animation:mrise .18s ease both; }
.stdsheet h3 { margin:2px 0 0; font-family:var(--display); font-weight:500; font-size:24px; }
.stdrow { display:flex; align-items:baseline; justify-content:center; gap:8px; margin-top:14px;
  border-bottom:2px solid var(--accent); padding-bottom:4px; }
.stdin { flex:1; min-width:0; border:none; background:none; text-align:center; font-family:var(--mono);
  font-size:40px; font-weight:500; letter-spacing:-.02em; color:var(--ink); padding:0; }
.stdin:focus { outline:none; }
.stdu { flex:none; font-size:15px; color:var(--muted); }
.stdbtns { display:flex; gap:10px; margin-top:16px; }
.stdbtns .btn, .stdbtns .btn-quiet { flex:1; padding:13px 10px; font-size:15px; border-radius:12px; }
.dpg { margin:16px 0 6px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.dpgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.dpk { position:relative; height:64px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface); }
.dpkb { width:100%; height:100%; border:none; background:none; border-radius:13px; font-family:inherit; font-size:13px; font-weight:600;
  color:var(--ink-2); cursor:pointer; padding:6px 22px 6px 6px; }
.dpk.on { border-color:var(--accent); background:var(--soft); }
.dpk.on .dpkb { color:var(--ink); }
/* V5.7. The pin, in the corner of a habit that is on: filled when it is a dial. */
.dpin { position:absolute; top:4px; right:4px; width:30px; height:30px; display:none; place-items:center; border:none; background:none;
  border-radius:50%; color:var(--muted); cursor:pointer; padding:0; }
.dpk.on .dpin { display:grid; }
.dpin svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linejoin:round; transform:rotate(30deg); }
.dpk.pin .dpin { color:var(--accent); }
.dpk.pin .dpin svg { fill:currentColor; transform:none; }
.cbig { border:none; background:none; color:var(--ink); font-family:var(--body); font-weight:600; font-size:clamp(44px, 14vw, 64px); cursor:pointer; padding:0; font-variant-numeric:tabular-nums; }
.cbigin { width:70%; border:none; border-bottom:2px solid var(--accent); background:none; color:var(--ink); text-align:center; font-family:var(--body); font-weight:600; font-size:clamp(40px, 12vw, 56px); padding:0; }
.cbigin:focus { outline:none; }
.ddone { border:2px solid var(--line-strong); border-radius:999px; padding:10px 22px !important; font-size:22px !important; color:var(--ink-2); background:none; cursor:pointer; }
.ddone.on { border-color:var(--green); background:var(--green); color:#0f1a12; font-size:30px !important; }
.cfoot { justify-content:flex-end; }
/* V6.1. Your own habits. */
.dptr { display:block; font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-top:2px; }
.habnew { display:block; width:100%; margin-top:14px; padding:12px; border:1.5px dashed var(--line-strong); border-radius:14px; background:none; color:var(--accent); font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
.hform .field { width:100%; font-size:16px; }
.hform .tlab { margin-top:14px; }
.hseg { display:flex; gap:6px; flex-wrap:wrap; }
.hseg button { flex:1; padding:9px 6px; }
.hfrow { display:flex; gap:10px; align-items:flex-end; }
.hfrow label { flex:1; min-width:0; }
.hfmin { padding-bottom:12px; color:var(--muted); font-size:14px; }
.btn-quiet.bad { color:var(--warn); }

/* ---------- V3.4: the family, every number ------------------------------ */
.fcard { padding:13px 14px 12px; border-top:1px solid var(--line); }
.fcard:first-child { border-top:none; }
.fhead { display:flex; align-items:center; gap:10px; }
.fhead .tapedit { font-size:15px; }
.fhead .fstreak { margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--muted); }
.fhead .fyou { font-style:normal; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--hc); background:color-mix(in oklab, var(--hc) 12%, var(--surface)); padding:2px 7px; border-radius:99px; }
.fgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:9px 8px; margin:11px 0 0 44px; align-items:start; }
.fcell { display:flex; flex-direction:column; justify-content:flex-start; align-items:flex-start; gap:1px;
  min-width:0; text-align:left; border:none; background:none; padding:0; margin:0;
  font:inherit; line-height:1.5; color:inherit; }
.fcell b { font-family:var(--mono); font-size:14.5px; font-weight:500; color:var(--ink); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.fcell span { font-size:9.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.fcell.nil b { color:var(--muted); opacity:.55; }
button.fcell { cursor:pointer; }
button.fcell b { text-decoration:underline dotted; text-decoration-color:var(--line-strong); text-underline-offset:3px; }
/* You, among them: first, in your own colour, set a little larger. */
.fcard.me { position:relative; background:color-mix(in oklab, var(--hc) 7%, var(--surface));
  box-shadow:inset 3px 0 0 var(--hc); }
.fcard.me .tapedit { font-family:var(--display); font-weight:500; font-size:19px; color:var(--ink);
  text-decoration:none; }
.fcard.me + .fcard { border-top-color:color-mix(in oklab, var(--hc) 20%, var(--line)); }

/* Everyone else: one row each, nine small numbers, one header. */
.ftab { border-top:1px solid var(--line); padding:8px 8px 6px 10px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
/* V4.1. Twelve columns no longer fit a phone at a readable size: the
   table keeps a floor per column and slides sideways, names pinned. */
.ftbl { width:100%; border-collapse:collapse; table-layout:fixed; font-variant-numeric:tabular-nums; }
.ftbl th, .ftbl td { padding:0 1px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:clip; }
.ftbl thead th { font-size:8.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); padding:0 0 5px; }
.ftbl th.fn { width:78px; text-align:left; padding:0; position:sticky; left:0; z-index:1; background:var(--surface); }
.ftbl thead th:not(.fn) { overflow:visible; }  /* V5.2. "ATT" lost its A when clipped. */
.ftbl tbody td { font-family:var(--mono); font-size:clamp(8.5px, 2.6vw, 10.5px); letter-spacing:-.04em; color:var(--ink); height:30px;
  border-top:1px solid var(--line); }
.ftbl tbody th { border-top:1px solid var(--line); }
.ftbl tbody tr:first-child td, .ftbl tbody tr:first-child th { border-top:none; }
.ftbl td.nil { color:var(--muted); opacity:.5; }
/* V5.3. Categories in shades, darkest first; your row first and bold. */
.b0 { --band:color-mix(in oklab, var(--ink) 2%, var(--surface)); }
.b1 { --band:color-mix(in oklab, var(--ink) 5%, var(--surface)); }
.b2 { --band:color-mix(in oklab, var(--ink) 8%, var(--surface)); }
.b3 { --band:color-mix(in oklab, var(--ink) 11%, var(--surface)); }
.b4 { --band:color-mix(in oklab, var(--ink) 14%, var(--surface)); }
.ftbl td, .ftbl thead th:not(.fn) { background:var(--band, transparent); }
.ftbl tr.fgrp th { font-size:8px; letter-spacing:.1em; color:var(--ink-2); padding:4px 0 3px; border-radius:6px 6px 0 0; }
.ftbl tr.me .ftn { font-weight:700; color:var(--ink); }
.ftbl tr.me td { color:var(--ink); font-weight:600; }
/* Your dashboard: five rows, the category on the left, three numbers. */
.pdash { margin:4px 0 14px; border-radius:14px; overflow:hidden; border:1px solid var(--line); }
.prw { display:grid; grid-template-columns:clamp(70px, 22vw, 92px) minmax(0, 1fr); align-items:center; background:var(--band); }
.prw + .prw { border-top:1px solid color-mix(in oklab, var(--line) 60%, transparent); }
.pcat { padding-left:12px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); line-height:1.2; }
.pcells { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); }
/* V5.6. Progress over time: a dot plot under each habit's dial. */
.pgcard { padding:14px 14px 10px; }
.pghead { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.pgsum { margin:0; font-size:13.5px; color:var(--ink-2); }
.pgsum b { color:var(--ink); font-size:16px; font-variant-numeric:tabular-nums; }
.pgr button { min-width:38px; }
.pgsvg { display:block; width:100%; height:auto; margin-top:8px; overflow:visible; }
.pgsvg rect[data-pg] { cursor:pointer; }
.pgh { fill:var(--green); stroke:var(--surface); stroke-width:1; }
.pgm { fill:none; stroke:var(--ink-2); stroke-width:1.4; opacity:.75; }
.pgstd { stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3; }
.pgbase { stroke:var(--line); stroke-width:1; }
.pgsel { stroke:var(--line-strong); stroke-width:1; }
.pgt { fill:var(--muted); font:10.5px var(--body); }
.pgax { opacity:.7; }
.pgcap { margin:6px 0 0; min-height:18px; font-size:12.5px; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:4px 14px; }
.pgk { display:inline-flex; align-items:center; gap:5px; color:var(--muted); }
.pgk i { width:8px; height:8px; border-radius:50%; border:1.4px solid var(--ink-2); }
.pgk i.h { background:var(--green); border-color:var(--green); }
.pgavg { font-size:12.5px; color:var(--muted); }
.pgd { font-size:12.5px; color:var(--muted); }
.pgd.up { color:var(--green-ink, #7cc89a); }
.pgd.dn { color:var(--warn); }
.pgavg b { font-size:13.5px !important; }
.pgnone { margin:10px 0 4px; }
.xspark { display:block !important; padding:0 0 8px !important; border-top:none !important; }
.xspark svg { display:block; width:100%; height:auto; overflow:visible; }
.xsl { fill:none; stroke:var(--line-strong); stroke-width:1.2; }
.xsd { fill:var(--diet); stroke:var(--surface); stroke-width:1; }
.xsx { display:flex; justify-content:space-between; padding-right:46px; font-size:10.5px; color:var(--muted); }
/* V5.6. The way to add or remove habits, at the foot of your dashboard. */

.pcell { display:flex; flex-direction:column; align-items:flex-start; gap:1px; min-width:0; border:none; background:none;
  padding:8px 6px; font:inherit; color:var(--ink); text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.pcell b { font-family:var(--mono); font-weight:500; font-size:clamp(14px, 4.3vw, 17px); letter-spacing:-.03em; white-space:nowrap; }
.pcell span { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.pcell.nil b { color:var(--line-strong); }
.pcell:active { background:color-mix(in oklab, var(--ink) 6%, transparent); }
.ftbl .g0 { box-shadow:inset 1px 0 0 color-mix(in oklab, var(--line) 60%, transparent); }
.ftbl td.see button { font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer;
  text-decoration:underline dotted; text-decoration-color:var(--line-strong); text-underline-offset:3px; }
.ftn { display:flex; align-items:center; gap:6px; max-width:100%; background:none; border:none; padding:0;
  font:inherit; font-size:12.5px; font-weight:600; color:var(--ink-2); cursor:pointer; overflow:hidden; }
.ftn i { flex:none; width:7px; height:7px; border-radius:50%; background:var(--hc); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------- V3.4: Train ----------------------------------------------------- */
/* A number carried over from last time and not touched yet: a suggestion,
   so it is grey, and it is not logged unless you tick it or type over it. */
.setgrid input.pre { color:var(--muted); }
.stdline { margin-top:4px; }

/* ---------- V5.1 ------------------------------------------------------
   Charcoal and dark green. The ground loses its brown and becomes a
   neutral charcoal with the faintest green in it; dark green is the
   colour of progress (a dial at its standard, a day in the calendar, a
   block kept); gold stays for names, titles and the main buttons. */
:root {
  --ground:#141615; --surface:#1c1f1d; --surface-2:#252926;
  --line:#2c312e; --line-strong:#414844;
  --ink:#eef0eb; --ink-2:#cfd4cd; --muted:#959c96;
  --green:#3f9a64; --green-ink:#7cc89a; --green-soft:#1d2f24;
  --med:#7cc89a; --med-soft:#1d2f24;
  --win:var(--green-ink);
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -18px rgba(0,0,0,.8);
}
/* Progress is green everywhere it means "met". */
.hcol i.full, .hkey i.full, .xtwk i.full { background:var(--green); }
.gbar.win .gt i { background:var(--green); }

/* The habit calendar, a month at a time. */
.hcal { margin:14px auto 0; max-width:420px; }
.hkey i { background:color-mix(in oklab, var(--green) 40%, var(--surface-2)); }
.hcalh { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
.hcalh b { font-family:var(--display); font-weight:500; font-size:17px; }
.hcalh .dnav { width:34px; height:34px; }
.hcaldow, .hcalg { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:5px; }
.hcaldow span { text-align:center; font-size:10.5px; letter-spacing:.06em; color:var(--muted); font-weight:600; }
.hcalg { margin-top:5px; }
.hcalg i { position:relative; aspect-ratio:1; border-radius:8px; background:var(--surface-2); display:grid; place-items:center;
  font-style:normal; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.hcalg i.pad { background:none; }
.hcalg i.fut { background:none; border:1px dashed var(--line); color:var(--line-strong); }
.hcalg i.part { color:var(--ink); }
.hcalg i.full { background:var(--green); color:#f2fbf5; font-weight:600; }
.hcalg i.now { box-shadow:inset 0 0 0 2px var(--gold); }
.hcalg i.sel { box-shadow:inset 0 0 0 2px var(--ink); }
.hcalg.tap i[data-hday] { cursor:pointer; }
.hcalg.tap i[data-hday]:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

/* The habit sentence, now at the foot of the page. */
.astrip.foot { margin-top:18px; }

@media (hover:hover) and (pointer:fine) { .tpk:hover .tpkv { opacity:.85; } }
/* V5.3. The wheel sheet sits above everything. */
#wsheet .sheetbg { z-index:84; }
#wsheet .wsheet { z-index:85; }
.wsheet .stdbtns { margin-top:12px; }
.wheel:focus-visible { outline:2px solid var(--gold); outline-offset:2px; border-radius:8px; }


/* Goals: tactics edited in place and dragged into order. */
.gtedit li { gap:6px; }
.gtedit li.drag { opacity:.75; background:var(--surface-2); border-radius:10px; }
.gtedit .ttlin { flex:1; min-width:0; padding:8px 10px; font-size:14px; }
.gtedit .tdrag { cursor:grab; }

/* Meditation. */
.mgroup { color:var(--med); }
.mdial { margin:6px auto 0; }
.mdial .dval { font-size:44px; }
.mempty h2 { margin-top:14px; }
.mempty p { color:var(--ink-2); margin:8px 0 0; }
.mbtnrow { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
.mbtnrow > * { flex:1 1 140px; }
.mblks { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.mblk { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.mblk:last-child { border-bottom:none; }
.mchk { flex:none; width:30px; height:30px; border-radius:50%; border:2px solid var(--line-strong); background:none;
  color:#f2fbf5; font-size:15px; font-weight:700; display:grid; place-items:center; cursor:pointer; padding:0; }
.mblk.is-d .mchk { background:var(--green); border-color:var(--green); }
.mblk.is-l .mchk { background:color-mix(in oklab, var(--green) 45%, var(--surface-2)); border-color:var(--green); }
.mbody { flex:1; min-width:0; display:flex; flex-direction:column; }
.mbody b { font-weight:600; overflow-wrap:anywhere; }
.mbody small { color:var(--muted); font-size:12.5px; }
.mbody em { font-style:normal; color:var(--warn); }
.mblk.is-d .mbody b, .mblk.is-l .mbody b { color:var(--ink-2); }
.mst { flex:none; border:1px solid var(--line-strong); background:none; color:var(--ink-2); border-radius:99px;
  padding:4px 10px; font-size:12px; font-weight:600; cursor:pointer; }
.mblk.is-l .mst { color:var(--warn); border-color:color-mix(in oklab, var(--warn) 50%, var(--line)); }
.mplus { flex:none; width:30px; height:30px; border-radius:50%; border:1px solid var(--line-strong); background:none;
  color:var(--muted); font-size:18px; font-weight:600; cursor:pointer; padding:0; line-height:1; }
.mplus.on { background:var(--gold); border-color:var(--gold); color:#1b160c; }
.mhint { margin-top:12px; }
/* V5.3. Attention in two columns: AM | PM tiles with three switches. */
.mgrid { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:8px; align-items:start; }
/* V5.5. Two lists, top down; while moving, both columns stretch to take a drop. */
.mcol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; min-height:40px; border-radius:12px; }
.mgrid.on .mcol { outline:1.5px dashed var(--line-strong); outline-offset:3px; }
.mgrid.on { user-select:none; -webkit-user-select:none; }
.mgrip { flex:none; color:var(--muted); cursor:grab; font-size:15px; line-height:1; padding:0 2px; touch-action:none; user-select:none; -webkit-user-select:none; }
.mtile.dragging { border-color:var(--gold); box-shadow:0 14px 30px -12px rgba(0,0,0,.7); background:var(--surface-2); }

<script>

  // Bump this when the file changes, so you can tell at a glance which

  /* ---------- tiny helpers ---------------------------------------- */
