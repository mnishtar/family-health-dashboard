     ------------------------------------------------------------------ */
  function templateEditor() {
    const t = state.tmpl;
    if (!t) return "";
    return `
      <div class="tmpl" id="tmplBox">
        <h3>${esc(t.label)}</h3>
        ${t.items.length
          ? t.items.map((it, i) => `
            <div class="tmplrow">
              <span class="nm">${esc(it.exercise)}</span>
              <span class="sx">${it.sets} \u00d7</span>
              <button type="button" data-tup="${i}" ${i === 0 ? "disabled" : ""}
                aria-label="Move up">\u2191</button>
              <button type="button" data-tdown="${i}"
                ${i === t.items.length - 1 ? "disabled" : ""}
                aria-label="Move down">\u2193</button>
              <button type="button" data-tdel="${i}" aria-label="Remove">\u00d7</button>
            </div>`).join("")
          : `<p class="hint" style="margin:0 0 4px">Empty. Saving now puts this
              workout back to following whatever you last did under it.</p>`}
        <div class="exadd" style="margin-top:11px">
          <input class="field" id="tmplName" list="exlist" placeholder="Add ${
            state.mode === "cardio" ? "an activity" : "an exercise"}"
            autocomplete="off" maxlength="60" aria-label="Exercise to add">
          <button class="btn" id="tmplAdd" style="background:var(--train)">Add</button>
        </div>
        <datalist id="exlist">${state.lift.exercises.map((e) =>
          `<option value="${esc(e.name || e)}"></option>`).join("")}</datalist>
        <div class="addrow" style="margin-top:11px">
          <button class="btn" id="tmplSave">Save</button>
          <button class="btn-quiet" id="tmplCancel">Cancel</button>
        </div>
      </div>`;
  }

  async function openTemplate(label) {
    state.lift.menu = null;
    state.tmpl = { label, mode: state.mode, items: [], loading: true };
    render();
    const res = await call("app_template", {
      p_code: state.code, p_person: state.meId, p_label: label, p_mode: state.mode });
    state.tmpl = { label, mode: state.mode,
      items: (res.items || []).map((i) => ({
        exercise: i.exercise, kind: i.kind || "weight_reps", sets: Number(i.sets) || 1 })) };
    render();
  }

  function wireTemplate() {
    document.querySelectorAll("[data-tmpl]").forEach((el) =>
      el.addEventListener("click", () => openTemplate(el.dataset.tmpl)));

    const t = state.tmpl;
    if (!t) return;
    const swap = (i, j) => {
      [t.items[i], t.items[j]] = [t.items[j], t.items[i]];
      render();
    };
    document.querySelectorAll("[data-tup]").forEach((el) =>
      el.addEventListener("click", () => swap(+el.dataset.tup, +el.dataset.tup - 1)));
    document.querySelectorAll("[data-tdown]").forEach((el) =>
      el.addEventListener("click", () => swap(+el.dataset.tdown, +el.dataset.tdown + 1)));
    document.querySelectorAll("[data-tdel]").forEach((el) =>
      el.addEventListener("click", () => { t.items.splice(+el.dataset.tdel, 1); render(); }));

    const add = () => {
      const f = document.getElementById("tmplName");
      const name = (f.value || "").trim();
      if (!name) return;
      t.items.push({ exercise: name, kind: kindFor(name, "weight_reps"), sets: 1 });
      render();
      document.getElementById("tmplName")?.focus();
    };
    on("tmplAdd", "click", add);
    on("tmplName", "keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } });

    on("tmplCancel", "click", () => { state.tmpl = null; render(); });
    on("tmplSave", "click", async () => {
      const res = await call("app_template_save", {
        p_code: state.code, p_person: state.meId,
        p_label: t.label, p_mode: t.mode, p_items: t.items });
      if (res.error) { say(res.error); return; }
      state.tmpl = null;
      await loadLift();
      render();
    });
  }

  function liftHistory() {
    if (!state.lift.sessions.length)
      return `<div class="dashed"><p class="empty">Nothing logged yet.<br>
        ${state.mode === "cardio"
          ? "Log a swim, row or ride and it appears here."
          : "Start a workout and it appears here, with your best set for every exercise."}
        </p></div>`;
    return `<section>
        <div class="section-head">
          <button class="foldbtn" id="foldHist" aria-expanded="${state.histOpen}">
            <span class="caret">${state.histOpen ? "\u25be" : "\u25b8"}</span>
            <h2>History</h2></button>
          <span class="eyebrow">${state.lift.sessions.length} logged</span></div>
        ${state.histOpen
          ? state.lift.sessions.map((s) => sessionCard(s, true)).join("") : ""}
      </section>`;
  }

  function sessionView() {
    const a = A();
    if (!a) { state.view = "exercise"; return metricView(); }

    const blocks = a.ex.map((x, i) => exBlock(x, i)).join("") ||
      `<div class="dashed"><p class="empty">No exercises yet.<br>
         Add the first one below.</p></div>`;

    const datalist = `<datalist id="exlist">${
      state.lift.exercises.map((e) =>
        `<option value="${esc(e.name || e)}"></option>`).join("")}</datalist>`;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; Exercise</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <div style="display:flex;align-items:center;gap:10px">
          <h1 style="flex:1;min-width:0">${a.fromTile
            // V2.4. You already said which workout this is, by tapping its
            // tile. Leaving the name editable here meant a stray keystroke
            // minted a second tile that looked like a duplicate of the
            // first — and there was no way to tell "today is C2" apart
            // from "C is now called C2". So a workout started from a tile
            // carries that tile's name as a heading. Renaming lives on the
            // tile, where it means one thing.
            ? `<span class="labelfix">${esc(a.label)}</span>`
            : `<input id="labelIn" class="labelin" value="${esc(a.label)}" maxlength="24"
                   placeholder="Name this day" autocomplete="off"
                   aria-label="What to call this workout">`}</h1>
          <button class="btn" id="finish" style="padding:10px 18px">Finish</button>
        </div>
        ${a.fromTile ? `
          <!-- V2.5. Which workout this is, and what today's was, are two
               different facts. The tile above is the first; this is the
               second. It goes in History and never makes a tile, which
               is what the old editable title could not promise. -->
          <input id="noteIn" class="notein" value="${esc(a.note || "")}" maxlength="40"
                 placeholder="+ name today — C2, heavy singles…"
                 autocomplete="off" aria-label="A note for today's workout">` : ""}
        <div class="timer">
          ${(a.mode || state.mode) === "cardio" || a.durOverride !== null
            ? `<span class="durwrap"><input id="durIn" class="durin" type="number"
                 inputmode="numeric" min="0" max="600" value="${durationMin(a)}"
                 aria-label="Minutes"><em>min</em></span>`
            : `<b id="elapsed">${clock(elapsedMs(a))}</b>
               <button type="button" class="linkbtn" id="durEdit"
                 style="font-size:11px;color:var(--muted)">edit</button>`}
          <span id="sessTotals">${totalsWords(a)}</span>
        </div>
        <!-- V1.7. The escape hatch. The bar you tapped chose the day; this
             corrects it — for a midnight session filed under tomorrow, or
             a mistapped bar. Without it the only fix is delete and redo. -->
        <button type="button" class="sessdate" id="sessDate">
          ${a.date === todayISO() ? "Today" : esc(fullDate(a.date))}
          <span>change</span></button>
      </header>

      <div id="blocks">${blocks}</div>

      <div class="exadd">
        <input class="field" id="exName" list="exlist" placeholder="Add ${
          state.mode === "cardio" ? "an activity" : "an exercise"}"
               autocomplete="off" maxlength="60" aria-label="${
          state.mode === "cardio" ? "Activity" : "Exercise"} name">
        <button class="btn" id="exAdd" style="background:var(--train)">Add</button>
      </div>
      ${datalist}

      <p class="hint" id="liftHint">${esc(state.lift.msg || "")}</p>

      <button class="linkbtn" id="scrap" style="color:var(--muted);text-align:left;
        align-self:flex-start;font-size:12px">Discard this ${
        state.mode === "cardio" ? "activity" : "workout"}</button>

      <p class="ver">v${APP_VERSION}</p>`;
  }

  // One row shape per kind. This is the whole reason Cardio needed no
  // second app: the exercise decides the columns, exactly as Strong does.
  const COLS = {
    weight_reps:   () => [units.w, "reps"],
    duration:      () => ["time"],
    distance_time: () => [units.d, "time"],
  };

  // V2.3. What you lifted last time, beside the box you are about to type
  // in. The numbers were already being PREFILLED from the last session,
  // which sounds like the same thing and is not: once you overwrite the
  // box, the thing you were trying to beat is gone off the screen.
  function prevWords(s, kind) {
    if (!s) return "";
    if (kind === "duration")      return s.pt ? mmss(s.pt) : "";
    if (kind === "distance_time") return (s.pd || s.pt)
      ? `${s.pd ? dShow(s.pd) : "0"}\u00b7${mmss(s.pt || 0)}` : "";
    return s.pw ? `${wShow(s.pw)}\u00d7${s.pr || 0}` : "";
  }

  function exBlock(x, i) {
    const kind = x.kind || "weight_reps";
    const cols = COLS[kind]();
    const cls  = kind === "weight_reps" ? "" : cols.length === 1 ? " one" : "";
    // The unit choice used to be one row at the FOOT of the workout, two
    // buttons reading "weights time", which is a sentence nobody wrote and
    // applied to whatever you typed next. It belongs to the exercise, so
    // it lives on the exercise — and only until the exercise has a history
    // or a ticked set, after which it is settled and the control is noise.
    // V2.6. Always there, on every exercise, whatever it has recorded
    // before. V2.3 hid it once an exercise had a history or a ticked set,
    // on the theory that the question was then settled — which is exactly
    // backwards for Yoga or a farmer's carry, the movements most likely to
    // be logged one way this week and the other way next. A carry is reps
    // on Monday and a stopwatch on Thursday, and neither is a mistake.
    // V2.7. Reps are gone from Cardio: nobody counts reps of a swim, and
    // offering it only invited the wrong choice.
    const KINDS = state.mode === "cardio"
      ? [["distance_time", "distance"], ["duration", "time"]]
      : [["weight_reps", "reps"], ["duration", "time"]];
    // One chip, tapped to cycle mi -> km -> m, rather than three units
    // sitting there all the time. It shows on a distance exercise only,
    // because it has nothing to say about anything else.
    const unitChip = kind === "distance_time"
      ? `<button type="button" class="unitchip" data-cycle="d"
           aria-label="Distance unit, now ${esc(units.d)}">${esc(units.d)}</button>`
      : "";
    const picker = `
      <div class="kindmini" role="group" aria-label="What ${esc(x.name)} records">
        ${KINDS.map(([kk, lbl]) =>
          `<button type="button" data-exkind="${i}:${kk}"
            aria-pressed="${kind === kk}">${lbl}</button>`).join("")}
        ${unitChip}
      </div>`;

    const field = (s, j, f, ph, label) => {
      const val = f === "w" ? (s.w ? wShow(s.w) : "")
                : f === "r" ? (s.r || "")
                : f === "d" ? (s.d ? dShow(s.d) : "")
                : (s.t ? mmss(s.t) : "");
      const numeric = f === "r";
      return `<input type="${f === "t" ? "text" : "number"}"
             inputmode="${f === "t" ? "numeric" : numeric ? "numeric" : "decimal"}"
             data-ex="${i}" data-set="${j}" data-f="${f}"
             class="${s.on ? "on" : !counts(s, kind) && hasNumsSet(s, kind) ? "pre" : ""}" value="${val}" placeholder="${ph}"
             aria-label="Set ${j + 1} ${label}">`;
    };

    const rows = x.sets.map((s, j) => {
      const cells =
        kind === "weight_reps"   ? field(s,j,"w","0",units.w) + field(s,j,"r","0","reps")
      : kind === "duration"      ? field(s,j,"t","0:00","time")
      :                            field(s,j,"d","0",units.d) + field(s,j,"t","0:00","time");
      const pw = prevWords(s, kind);
      return `<span class="ix">${j + 1}</span>
      <span class="prev">${pw || "\u2013"}</span>${cells}
      <button class="tick" data-tick="${i}:${j}" aria-pressed="${!!s.on}"
              aria-label="Mark ${j + 1} done">&#10003;</button>
      <button class="xset" data-delset="${i}:${j}"
              aria-label="Delete set ${j + 1}">&times;</button>`;
    }).join("");

    return `
      <div class="exblock" id="ex-${i}">
        <div class="exhead">
          <input class="exname" data-exname="${i}" value="${esc(x.name)}" maxlength="60"
                 aria-label="Exercise name">
          ${picker}
          <button class="xbtn" data-delex="${i}" aria-label="Remove ${esc(x.name)}">&times;</button>
        </div>
        <div class="setgrid${cls}">
          <span class="hd">#</span><span class="hd">Prev</span>${cols.map((c) =>
            (c === units.w || c === units.d)
              ? `<button class="hd unit" data-cycle="${c === units.w ? "w" : "d"}"
                   aria-label="Change unit">${esc(c)}</button>`
              : `<span class="hd">${esc(c)}</span>`).join("")}
          <span class="hd"></span><span class="hd"></span>
          ${rows}
        </div>
        <button class="addset" data-addset="${i}">+ Add ${
          kind === "weight_reps" ? "set" : "entry"}</button>
      </div>`;
  }

  function detailView() {
    const s = state.lift.detail;
    if (!s) { state.view = "exercise"; return metricView(); }
    const byPos = new Map();
    for (const r of (s.sets || [])) {
      if (!byPos.has(r.position)) byPos.set(r.position, { name: r.exercise, sets: [] });
      byPos.get(r.position).sets.push(r);
    }
    const cell = (r) =>
        r.kind === "duration"      ? mmss(r.seconds)
      : r.kind === "distance_time" ? `${distWords(r.distance)} \u00b7 ${mmss(r.seconds)}`
      :                              `${wShow(r.weight)} ${units.w} \u00d7 ${r.reps}`;
    const blocks = [...byPos.entries()].sort((a, b) => a[0] - b[0]).map(([, x]) => `
      <div class="exblock">
        <div class="exhead"><b>${esc(x.name)}</b></div>
        <table class="htab"><tbody>${x.sets.map((r, i) => `
          <tr><td class="nm">${x.sets.length > 1 ? "Set " + (i + 1) : "—"}</td>
              <td>${cell(r)}</td></tr>`).join("")}</tbody></table>
      </div>`).join("");

    const mine = s.person_id === state.meId;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; Back</button>
      </div>

      <header class="masthead">
        <h1 style="color:var(--train)">${esc(s.label || "Workout")}${s.note
          ? `<span class="hnote">${esc(s.note)}</span>` : ""}</h1>
        <p class="sub">${esc(s.person)} &middot; ${esc(fullDate(s.entry_date))}</p>
        <div class="timer" style="margin-top:8px">
          <span><b>${s.duration_min}m</b></span>
          ${Number(s.distance) > 0 ? `<span><b>${distWords(s.distance)}</b></span>` : ""}
          ${s.pr_count > 0 ? `<span style="color:var(--train)">
            <b>${s.pr_count}</b> PR${s.pr_count === 1 ? "" : "s"}</span>` : ""}
        </div>
      </header>

      ${blocks}

      ${mine ? `<div class="addrow" style="margin-top:6px">
        <button class="btn" id="editSession">Edit</button>
        <button class="linkbtn" id="delSession" style="color:var(--warn)">
          Delete this workout</button>
      </div>` : ""}

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- lift painting ----------------------------------------
     Repaint the smallest thing that changed. V1.2 taught this the hard
     way: a full re-render while someone is typing throws the number away.
     ------------------------------------------------------------------ */

  let tick = null;
  function startTicking() {
    stopTicking();
    tick = setInterval(() => {
      const a = A(); const el = document.getElementById("elapsed");
      if (!a || !el) return stopTicking();
      el.textContent = clock(elapsedMs(a));
    }, 1000);
  }
  function stopTicking() { if (tick) { clearInterval(tick); tick = null; } }

  function paintTotals() {
    const a = A(); const el = document.getElementById("sessTotals");
    if (a && el) el.innerHTML = totalsWords(a);
  }

  function paintEx(i) {
    const a = A(); if (!a) return;
    const host = document.getElementById("ex-" + i);
    if (!host) return;
    const frag = document.createElement("div");
    frag.innerHTML = exBlock(a.ex[i], i);
    host.replaceWith(frag.firstElementChild);
    wireExBlock(i);
    paintTotals();
  }

  function wireExBlock(i) {
    const host = document.getElementById("ex-" + i);
    if (!host) return;
    const a = A();

    host.querySelectorAll("input[data-ex]").forEach((el) => {
      el.addEventListener("input", () => {
        const s = a.ex[+el.dataset.ex].sets[+el.dataset.set];
        const f = el.dataset.f, v = el.value;
        // Typed in whatever unit the phone is showing; stored in pounds
        // and metres. The conversion lives here and nowhere else.
        if (f === "t")      s.t = parseClock(v);
        else if (f === "d") s.d = v === "" ? 0 : dIn(Number(v));
        else if (f === "w") s.w = v === "" ? 0 : wIn(Number(v));
        else                s.r = v === "" ? 0 : Number(v);
        s.typed = true;
        host.querySelectorAll(`input[data-ex="${el.dataset.ex}"][data-set="${el.dataset.set}"]`)
          .forEach((f) => f.classList.remove("pre"));
        paintTotals();
        queueSync();
      });
    });

    host.querySelectorAll("[data-tick]").forEach((el) => {
      el.addEventListener("click", () => {
        const [xi, si] = el.dataset.tick.split(":").map(Number);
        const s = a.ex[xi].sets[si];
        s.on = !s.on;
        el.setAttribute("aria-pressed", String(s.on));
        host.querySelectorAll(`input[data-ex="${xi}"][data-set="${si}"]`)
            .forEach((f) => { f.classList.toggle("on", s.on);
              f.classList.toggle("pre", !counts(s, a.ex[xi].kind) && hasNumsSet(s, a.ex[xi].kind)); });
        paintTotals();
        queueSync();
      });
    });

    const add = host.querySelector("[data-addset]");
    if (add) add.addEventListener("click", () => {
      const sets = a.ex[i].sets;
      const last = sets[sets.length - 1] || {};
      sets.push({ w: last.w || 0, r: last.r || 0, d: last.d || 0, t: last.t || 0, on: false,
                  pw: last.pw || 0, pr: last.pr || 0, pd: last.pd || 0, pt: last.pt || 0 });
      queueSync();
      paintEx(i);
      const rows = document.querySelectorAll(`#ex-${i} .setgrid input`);
      const kindCols = (a.ex[i].kind === "weight_reps") ? 2 : (a.ex[i].kind === "duration" ? 1 : 2);
      const f = rows[rows.length - kindCols];
      if (f) { f.focus(); f.select(); }
    });

    // The weights/time switch, now on the exercise it describes. Changing
    // it keeps the rows and clears the columns that no longer apply, so a
    // plank typed as 3 reps does not silently become 3 seconds.
    host.querySelectorAll("[data-exkind]").forEach((el) =>
      el.addEventListener("click", () => {
        const [xi, kk] = el.dataset.exkind.split(":");
        const x = a.ex[+xi];
        if (!x || x.kind === kk) return;
        x.kind = kk;
        // Clear the columns that no longer apply, so 3 reps never becomes
        // 3 seconds. What is kept for each kind is what that kind means.
        for (const t of x.sets) {
          if (kk === "duration")           { t.w = 0; t.r = 0; t.d = 0; }
          else if (kk === "weight_reps")   { t.t = 0; t.d = 0; }
          else                             { t.w = 0; t.r = 0; }
        }
        queueSync();
        paintEx(+xi);
      }));

    const del = host.querySelector("[data-delex]");
    if (del) del.addEventListener("click", () => {
      a.ex.splice(i, 1);
      queueSync();
      render();
    });

    // V2.1b. Rename an exercise in place, and delete one set rather than
    // the whole exercise. Removing the last set removes the exercise,
    // because an exercise with no sets is not a thing that happened.
    const nm = host.querySelector("[data-exname]");
    if (nm) nm.addEventListener("change", () => {
      const v = (nm.value || "").trim();
      if (!v) { nm.value = a.ex[i].name; return; }
      a.ex[i].name = v;
      a.ex[i].kind = kindFor(v, a.ex[i].kind);
      queueSync();
      render();
    });

    host.querySelectorAll("[data-delset]").forEach((el) =>
      el.addEventListener("click", () => {
        const j = Number(el.dataset.delset.split(":")[1]);
        a.ex[i].sets.splice(j, 1);
        if (!a.ex[i].sets.length) a.ex.splice(i, 1);
        queueSync();
        render();
      }));
  }

  function wireLift() {
    on("back", "click", () => {
      stopTicking();
      // A session opened from the board belongs to the board. Sending
      // someone who tapped a relative's volume chip into their own Lift
      // history is a small thing that feels like being lost.
      if (state.view === "detail") {
        state.lift.detail = null;
        state.view = state.lift.from === "board" ? "board" : "exercise";
      }
      else if (state.view === "session") state.view = "exercise";
      else state.view = "board";
      if (state.view === "board") { state.seg = "steps"; state.entryDate = null; }
      render();
    });

    if (state.view === "exercise") {
      on("startEmpty", "click", () => startSession(""));
      document.querySelectorAll("[data-starter]").forEach((el) =>
        el.addEventListener("click", () => startStarter(el.dataset.starter)));
      on("resume", "click", () => { state.view = "session"; render(); });
      document.querySelectorAll("[data-start]").forEach((el) =>
        el.addEventListener("click", () => startSession(el.dataset.start)));
      document.querySelectorAll("[data-open]").forEach((el) =>
        el.addEventListener("click", () => openSession(el.dataset.open)));

      document.querySelectorAll("[data-wunit]").forEach((el) =>
        el.addEventListener("click", () => { units.w = el.dataset.wunit; render(); }));
      document.querySelectorAll("[data-dunit]").forEach((el) =>
        el.addEventListener("click", () => { units.d = el.dataset.dunit; render(); }));

      document.querySelectorAll("[data-menu]").forEach((el) =>
        el.addEventListener("click", () => {
          state.lift.menu = state.lift.menu === el.dataset.menu ? null : el.dataset.menu;
          state.lift.rename = null;
          render();
        }));
      document.querySelectorAll("[data-rename]").forEach((el) =>
        el.addEventListener("click", () => {
          state.lift.rename = el.dataset.rename;
          state.lift.renameFrom = el.dataset.rename;
          state.lift.menu = null;
          render();
          const f = document.getElementById("renameVal");
          if (f) { f.focus(); f.select(); }
        }));
      on("renameNo", "click", () => { state.lift.rename = null; render(); });
      on("renameGo", "click", () => saveLabel(
        (document.getElementById("renameVal").value || "").trim()));
      on("renameVal", "keydown", (e) => {
        if (e.key === "Enter") document.getElementById("renameGo").click();
        if (e.key === "Escape") { state.lift.rename = null; render(); }
      });
      document.querySelectorAll("[data-drop]").forEach((el) =>
        el.addEventListener("click", () => openModal({
          title: `Remove the “${el.dataset.drop}” tile?`,
          body: "The workouts you logged under it stay in your history.",
          buttons: [
            { label: "Remove tile", kind: "bad", run: async () => {
                state.lift.renameFrom = el.dataset.drop;
                await saveLabel("");
              } },
            { label: "Keep it", kind: "quiet" },
          ],
        })));
    }

    if (state.view === "session") {
      const a = A();
      a.ex.forEach((_, i) => wireExBlock(i));
      if ((a.mode || state.mode) !== "cardio" &&
          (a.durOverride === null || a.durOverride === undefined)) startTicking();

      // Typing a duration takes the day: the chart moves to match.
      on("durEdit", "click", () => {
        A().durOverride = durationMin(A());
        stopTicking();
        render();
        const f = document.getElementById("durIn");
        if (f) { f.focus(); f.select(); }
      });
      on("durIn", "change", () => {
        const f = document.getElementById("durIn");
        const v = Math.max(0, Math.min(600, Math.round(Number(f.value) || 0)));
        A().durOverride = v;
        saveLocal();
        queueSync();
        paintTotals();
      });

      // One tap steps the session back a day; it wraps round to today
      // after a fortnight, because anything older than that is a bar on
      // the chart, not a button you should press fourteen times.
      on("sessDate", "click", () => {
        const back = Math.round((new Date(todayISO() + "T00:00:00Z") -
                                 new Date(a.date + "T00:00:00Z")) / 86400000);
        a.date = back >= 13 ? todayISO() : shiftISO(a.date, -1);
        saveLocal();
        queueSync();
        render();
      });

      // Tapping the unit in a column header cycles it. Putting the switch
      // on the header means you can go metric mid-swim without leaving
      // the session to find a setting.
      document.querySelectorAll("[data-cycle]").forEach((el) =>
        el.addEventListener("click", () => {
          if (el.dataset.cycle === "w") units.w = units.w === "lb" ? "kg" : "lb";
          else units.d = units.d === "mi" ? "km" : units.d === "km" ? "m" : "mi";
          render();
        }));

      on("exAdd", "click", () => {
        const f = document.getElementById("exName");
        const nm = (f.value || "").trim();
        if (!nm) { f.focus(); return; }
        // A name you have used before keeps its own kind. A new one comes
        // in as weights (a swim as distance) and carries its own little
        // weights/time switch until you tick a set, which is where V2.3
        // moved that choice from the foot of the page.
        const known = kindFor(nm, null);
        addExercise(nm, known ||
          (state.mode === "cardio" ? "distance_time" : "weight_reps"));
        f.value = "";
        render();
      });
      on("exName", "keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); document.getElementById("exAdd").click(); }
      });

      // The name is just a field. No prompt, no modal, no editor state —
      // a label you can only set at the start is a label you get wrong.
      on("labelIn", "input", (e) => { a.label = e.target.value.slice(0, 24); queueSync(); });
      on("noteIn", "input", (e) => { a.note = e.target.value.slice(0, 40); queueSync(); });

      on("finish", "click", () => finishFlow(a));

      on("scrap", "click", () => openModal({
        title: `Discard this ${state.mode === "cardio" ? "activity" : "workout"}?`,
        body: a.edit ? "Changes made so far are already saved." : "It is deleted, here and on the server.",
        buttons: [
          { label: "Discard", kind: "bad", run: () => {
              stopTicking();
              dropServerCopy(a);
              state.lift.active = null;
              saveLocal(a.mode);
              state.view = "exercise";
              render();
            } },
          { label: "Keep going", kind: "quiet" },
        ],
      }));
    }

    if (state.view === "detail") {
      // V2.1b. Editing a past workout reopens it in the same editor that
      // recorded it, rather than a second read-only one that would drift.
      on("editSession", "click", () => guardActive(() => {
        const d = state.lift.detail;
        if (!d) return;
        const byPos = new Map();
        for (const r of (d.sets || [])) {
          if (!byPos.has(r.position))
            byPos.set(r.position, { name: r.exercise, kind: r.kind || "weight_reps", sets: [] });
          byPos.get(r.position).sets.push({
            w: Number(r.weight) || 0, r: Number(r.reps) || 0,
            d: Number(r.distance) || 0, t: Number(r.seconds) || 0, on: true });
        }
        state.mode = d.mode === "cardio" ? "cardio" : "lift";
        state.seg  = state.mode === "cardio" ? "cardio" : "train";
        state.lift.active = {
          id: d.id, label: d.label || "", date: d.entry_date,
          startedAt: Date.now(), endedAt: Date.now(), pendingFinish: false, edit: true,
          mode: state.mode, durOverride: Number(d.duration_min) || 0,
          ex: [...byPos.entries()].sort((x, y) => x[0] - y[0]).map(([, v]) => v),
        };
        state.lift.detail = null;
        saveLocal();
        state.view = "session";
        render();
      }, "editing this one"));

      // V2.8: confirm() does nothing in some in-app browsers, so this was a
      // button that silently did nothing there. Same modal as everywhere.
      on("delSession", "click", () => openModal({
        title: "Delete this workout?",
        body: "Its minutes come off that day.",
        buttons: [
          { label: "Delete", kind: "bad", run: async () => {
              const s = state.lift.detail;
              const res = await call("app_lift_delete", {
                p_code: state.code, p_person: state.meId, p_session: s.id });
              if (res.error) { say(res.error); return; }
              state.lift.detail = null;
              state.view = "exercise";
              await loadLift();
              render();
              refresh();
            } },
          { label: "Keep it", kind: "quiet" },
        ],
      }));
    }
  }

  // Exercise carries both halves: the steps entry and week charts that used
  // to be on the board, and the log that used to be its own screen.
  function wireExercise() {
    wireLift();

    // A day at a time, from the log box itself. The graph can still jump
    // you to any day; this is for "yesterday", which is most of them.
    const stepDay = async (n) => {
      // V2.1b BUG FIX. The week was compared AFTER entryDate had already
      // moved, and weekBounds() falls back to mondayOf(entryDay()) — so the
      // test was always false, loadHistory never re-ran, and the chart kept
      // last week's bars under this week's label. Compare the two days
      // against each other, before anything is mutated.
      const from = entryDay();
      const next = shiftISO(from, n);
      if (next > todayISO()) return;
      state.entryDate = next === todayISO() ? null : next;
      state.msg = null;
      if (mondayOf(next) !== mondayOf(from)) {
        state.weekAnchor = mondayOf(next) === thisMonday() ? null : mondayOf(next);
        await loadHistory();
      }
      // Walking the day off the edge of the month on show moves the month.
      if (state.range === "month" && monthOf(next) !== monthOf(from)) {
        state.monthAnchor = monthOf(next) === monthOf(todayISO()) ? null : monthOf(next);
        await loadMonth();
      }
      render();
    };
    on("dPrev", "click", () => stepDay(-1));
    on("dNext", "click", () => stepDay(1));
    on("dToday", "click", () => stepDay(Math.round(
      (new Date(todayISO() + "T00:00:00Z") - new Date(entryDay() + "T00:00:00Z")) / 86400000)));

    // The workout history folds. It is the longest thing on the page and
    // the least often wanted.
    on("foldHist", "click", () => {
      state.histOpen = !state.histOpen;
      try { localStorage.setItem("fhd.hist", state.histOpen ? "open" : "shut"); } catch {}
      render();
    });

    wireTemplate();
    wireWork();

    // Rest and Rise: three scroll columns, the middle row wins.
    //
    // V3.5. The nudges. Each tap moves the time and shows it at once; the
    // save waits for a pause in tapping, so four quick taps are one write.
    {
      const btns = document.querySelectorAll("[data-nudge]");
      let timer = null, gen = 0;
      btns.forEach((el) => el.addEventListener("click", () => {
        const k = state.seg, iso = entryDay(), m = me() || {};
        const met = M[k];
        const cur = state.tLocal && state.tLocal.k === k && state.tLocal.iso === iso ? state.tLocal.v
          : (iso === todayISO() ? rawVal(m, k) : (dayRecord(k).logged ? dayRecord(k).value : null));
        const start = cur !== null && cur !== undefined ? cur
          : (hasTarget(m, k) ? target(m, k) : (met.night ? 22 * 60 : 7 * 60));
        let v = ((Math.round(start) + Number(el.dataset.nudge)) % 1440 + 1440) % 1440;
        // The 5am rule: a bedtime after midnight belongs to the evening.
        if (k === "rest" && v < 5 * 60) v += 1440;
        state.tLocal = { k, iso, v };
        const big = document.getElementById("tBig");
        if (big) { big.innerHTML = tParts(v); big.classList.remove("unset"); }
        const hint = document.getElementById("hint");
        if (hint) hint.textContent = "Saving\u2026";
        const mine = ++gen;
        clearTimeout(timer);
        timer = setTimeout(async () => {
          const res = await call("app_log", { p_code: state.code, p_person: state.meId,
            p_value: v, p_metric: met.key, p_date: nightDay(k), p_tz: deviceTZ() });
          if (mine !== gen) return;                 // still tapping: the next one saves
          if (res.error) { state.msg = res.error; state.msgKind = "bad"; }
          if (iso === todayISO() && !res.error) m[k] = v;
          state.tLocal = null;
          await loadHistory();
          await refresh();
        }, 650);
      }));
    }

    on("clearDay", "click", async () => {
      const k = state.seg;
      state.tLocal = null;
      const res = await call("app_unlog", { p_code: state.code, p_person: state.meId,
        p_metric: M[k].key, p_date: nightDay(k) });
      if (res.error) { state.msg = res.error; state.msgKind = "bad"; render(); return; }
      state.msg = `${M[k].label} cleared.`;
      state.msgKind = "ok";
      await loadHistory();
      await refresh();
      setTimeout(() => { state.msg = null; state.msgKind = null; render(); }, 1600);
    });

    on("stampNow", "click", async (e) => {
      e.target.disabled = true;
      state.tLocal = null;
      const k = state.seg;
      const res = await call("app_stamp", {
        p_code: state.code, p_person: state.meId, p_metric: M[k].key, p_tz: deviceTZ() });
      if (res.error) { e.target.disabled = false; state.msg = res.error;
                       state.msgKind = "bad"; render(); return; }
      armUndo({ key: M[k].key, date: res.date,
                words: `${M[k].label} ${clockWords(res.value)} saved` });
      await loadHistory();
      await refresh();
    });

    // The habits: one integer, one bit each, written on every tap.
    const heldNow = () => {
      const m = me() || {};
      return Number(entryDay() === todayISO()
        ? (m.items || 0) : (dayRecord("sleep").value || 0)) || 0;
    };
    const holdBit = async (bit, el) => {
      const next = heldNow() ^ (1 << bit);
      // Paint immediately: a checklist that waits for the network before
      // ticking feels broken even when it is working.
      if (el) {
        el.classList.toggle("on");
        el.setAttribute("aria-pressed", String(!!((next >> bit) & 1)));
      }
      await call("app_log", { p_code: state.code, p_person: state.meId,
        p_value: next, p_metric: "sleep_items", p_date: nightDay("sleep"),
        p_tz: deviceTZ() });
      await loadHistory();
      await refresh();
    };
    document.querySelectorAll("[data-habit]").forEach((el) =>
      el.addEventListener("click", () => holdBit(Number(el.dataset.habit), el)));

    // Turning a tile over. The back closes on the next tap anywhere, the
    // way a card you have finished reading goes back down.
    document.querySelectorAll("[data-flip]").forEach((el) =>
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const b = Number(el.dataset.flip);
        state.flip = state.flip === b ? null : b;
        render();
      }));
    on("flipShut", "click", () => { state.flip = null; render(); });
    document.querySelectorAll("[data-shut]").forEach((el) =>
      el.addEventListener("click", () => { state.flip = null; render(); }));
    on("flipHold", "click", async () => {
      const b = state.flip; state.flip = null;
      await holdBit(b, null);
    });

    // The family block is fetched the first time it is opened, then kept.
    on("foldFam", "click", async () => {
      state.fam.open = !state.fam.open;
      try { localStorage.setItem("fhd.fam", state.fam.open ? "open" : "shut"); } catch {}
      render();
      if (state.fam.open) { await loadFamily(); render(); }
    });


    wireGraph();

    // V2.1. The big number is the input. Show it formatted; edit it raw.
    const big = document.getElementById("steps");
    if (big && big.classList.contains("bigedit")) {
      big.addEventListener("focus", () => {
        big.value = big.dataset.raw || "";
        requestAnimationFrame(() => big.select());
      });
      big.addEventListener("keydown", (e) => { if (e.key === "Enter") big.blur(); });
      big.addEventListener("blur", async () => {
        const raw = (big.value || "").replace(/[^0-9]/g, "");
        if (raw === "" || raw === (big.dataset.raw || "")) {
          // Nothing changed: put the formatted number back and do nothing.
          big.value = big.dataset.raw ? num(Number(big.dataset.raw)) : "";
          return;
        }
        big.value = num(Number(raw));
        await saveNumber(raw);
      });
    }



    wireEditor();
  }

  // V1.7b. One save for all three metrics. Minutes used to be writable
  // only by the logger; now they can be typed, and a typed number wins.
  async function saveNumber(raw) {
    const k = state.seg;
    if (raw === "" || raw === undefined) return;
    // p_date is null for today on purpose. The server decides what "today"
    // means for this person; the phone only says which zone it is in. A page
    // that has been open since yesterday therefore cannot write yesterday.
    const res = await call("app_log", { p_code:state.code, p_person:state.meId,
      p_value:Number(raw), p_metric:M[k].key,
      p_date:state.entryDate || null, p_tz:deviceTZ() });
    state.msg = res.error ? res.error : "Saved. Your family can see it.";
    state.msgKind = res.error ? "bad" : "ok";
    if (!res.error) state.entryDate = null;
    if (state.range === "month") await loadMonth(true);
    await refresh();
    setTimeout(() => { state.msg = null; state.msgKind = null; }, 100);
  }

  async function saveLabel(next) {
    const from = state.lift.renameFrom;
    if (!from) return;
    const res = await call("app_lift_label", {
      p_code: state.code, p_person: state.meId,
      p_old: from, p_new: next, p_mode: state.mode });
    if (res.error) { say(res.error); return; }
    state.lift.rename = null; state.lift.menu = null; state.lift.renameFrom = null;
    await loadLift();
    render();
  }

  async function openSession(id) {
    const res = await call("app_lift_detail", { p_code: state.code, p_session: id });
    if (res.error || !res.session) return;
    state.lift.detail = res.session;
    state.lift.from = "exercise";
    state.view = "detail";
    render();
  }

  async function openExercise(seg) {
    if (!state.meId) return;
    stopTicking();
    state.seg  = seg || "steps";
    state.mode = state.seg === "cardio" ? "cardio" : "lift";
    state.entryDate = null;
    state.lift.loaded = false;
    state.lift.labels = []; state.lift.sessions = [];
    state.lift.menu = null; state.lift.rename = null; state.flip = null;
    state.lift.msg = null;
    loadLocal();
    state.view = state.seg === "sleep" ? "sleep"
               : state.seg === "tasks" ? "tasks"
               : state.seg === "goals" ? "goals" : "exercise";
    render();                 // paint immediately; the list can arrive after
    if (state.seg === "tasks") { await openTasks(); return; }
    if (state.seg === "goals") { await openGoals(); return; }
    if (state.seg === "work")  {
      loadWorkLocal();
      if (await checkWork()) render();
      await loadWorkSessions(); render();
    }
    await loadHistory(); render();
    if (state.seg === "train" || state.seg === "cardio") { await loadLift(); render(); }
    if (state.range === "month") { await loadMonth(); render(); }
    if (state.fam.open) { await loadFamily(); render(); }
  }

  /* ---------- views ------------------------------------------------ */
  function landing() {
    return `
      <header class="masthead">
        <h1>Family Health Dashboard</h1>
        <p class="sub">One number a day. Everyone sees how everyone is doing.
          No accounts, no passwords &mdash; a family shares one link.</p>
      </header>

      <section class="card">
        <h2>I have a code</h2>
        <input class="field" id="code" placeholder="ABC123" autocapitalize="characters"
               autocomplete="off" style="margin-top:12px;text-align:center;
               font-family:var(--mono);font-size:20px;letter-spacing:.25em">
        <button class="btn" id="open" style="width:100%;margin-top:10px">Open my family</button>
      </section>

      <section class="card">
        <h2>Start a new group</h2>
        <input class="field" id="gname" placeholder="The Nishtars" style="margin-top:12px">
        <select class="field" id="gtz" style="margin-top:10px">
          <option value="America/New_York">Eastern (US)</option>
          <option value="America/Chicago">Central (US)</option>
          <option value="America/Denver">Mountain (US)</option>
          <option value="America/Los_Angeles">Pacific (US)</option>
          <option value="Europe/London">London</option>
          <option value="Asia/Karachi">Karachi</option>
          <option value="Asia/Dubai">Dubai</option>
          <option value="Asia/Kolkata">India</option>
        </select>
        <button class="btn-quiet" id="create" style="width:100%;margin-top:10px;padding:13px">
          Create the group</button>
      </section>

      <p class="hint ${state.msg ? "bad" : ""}" id="msg">${esc(state.msg || "")}</p>

      <p class="note">Anyone holding a group&rsquo;s link can see and log for that
        group. Share it the way you would share a house key.</p>

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- the board: a glance, not a dashboard -------------------
     V1.5 moved the entry box, the charts, the stats and the week arrows
     into Exercise. What is left is who you are, what the five pillars say
     about your day, the family, and one button. Everything else is one
     tap in, which is the only shape that still reads when there are five
     pillars instead of one.
     ------------------------------------------------------------------ */

  // Did this person record ANYTHING today? Deliberately not `done`.
  //
  // `done` is the bar: the step goal met, or a workout, or cardio. It still
  // drives the roster's "moved" mark and the execution percentage, because
  // a rate that counts 400 steps as a win measures nothing.
  //
  // The green circle is the other question — did you show up — and it is
  // the one the board should answer, because logging is the habit being
  // built and punishing a 4,000-step day with a grey dot teaches people to
  // stop opening the app.
  const anyLog = (p) => val(p,"steps") > 0 || val(p,"train") > 0 || val(p,"cardio") > 0;

  // Undo lives for six seconds after a stamp: long enough to notice a
  // mis-tap, short enough not to sit on the screen as clutter.
  let undoTimer = null;
  function armUndo(u) {
    state.undo = u;
    if (undoTimer) clearTimeout(undoTimer);
    undoTimer = setTimeout(() => { state.undo = null; if (state.view === "board") render(); }, 6000);
  }
  function disarmUndo() {
    state.undo = null;
    if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
  }


  /* ---------- the pillars, as rows ------------------------------------
     V2.1. Each live pillar is ONE ROW: a status circle, its name, and its
     chips on the same line. A row is the unit that scales — Sleep arrived
     as a second row without touching the first, and Meditate, Diet and
     Great Work will each arrive the same way. Until then they share one
     quiet line, so the five-pillar shape stays on screen without three
     rows of nothing.

     A chip is value on top, tiny label below. Outline when empty, filled
     when logged. Small enough for three beside a name on a phone, large
     enough (44px) to hit with a thumb.
     ------------------------------------------------------------------ */
  const shortNum = (v) => v >= 10000 ? (v / 1000).toFixed(1).replace(/\.0$/, "") + "k"
                        : v >= 1000  ? (v / 1000).toFixed(1).replace(/\.0$/, "") + "k"
                        : String(Math.round(v));

  // Minutes after midnight -> "10:40p". Values past 1440 are after-midnight
  // bedtimes stored on the evening's date, so they wrap.
  function clockWords(min) {
    if (min === null || min === undefined || min === "") return "";
    const m = ((Math.round(Number(min)) % 1440) + 1440) % 1440;
    const h = Math.floor(m / 60), mm = m % 60;
    const h12 = ((h + 11) % 12) + 1;
    return `${h12}:${pad(mm)}${h < 12 ? "a" : "p"}`;
  }
  const clockInput = (min) => {
    const m = ((Math.round(Number(min)) % 1440) + 1440) % 1440;
    return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  };


  // Which date a sleep entry belongs to. Rest and the habits are filed
  // against the NIGHT, which the server works out under the 5am rule and
  // hands back as rest_day; Rise is filed against the clock date.
  function nightDay(k) {
    if (state.entryDate) return state.entryDate;
    const m = me() || {};
    return (M[k] && M[k].night) ? (m.rest_day || todayISO()) : (m.their_date || todayISO());
  }

  const sleepAny = (p) => ["sleep","rise","rest"].some((k) => hasVal(p, k));

  // One editor, two screens: names are edited on the board, goals on
  // Exercise. Rendering it in only one place is how tapping a goal used to
  // open nothing at all.
  function editRowHTML() {
    // V3.4. Only names are edited here. Standards have a sheet of their own.
    if (state.editing !== "name") return "";
    return `
      <div class="addrow" id="editRow">
        <input class="field" id="editVal" maxlength="40" autocomplete="off"
               value="${esc(state.editDraft !== null && state.editDraft !== undefined ? state.editDraft : editTarget() ? editTarget().name : "")}"
               aria-label="Name">
        <button class="btn" id="editSave">Save</button>
        <button class="btn-quiet" id="editCancel">Cancel</button>
        <p class="hint" id="editHint" style="flex-basis:100%;margin-top:0">${editHintText()}</p>
      </div>`;
  }

  function boardView() {
    const m = me();
    // The family's day, not anyone's own: see board() above.
    const logged = state.people.filter(banyLog).length;
    const moved  = state.people.filter(bdone).length;

    const whoOptions = state.people.length === 0
      ? `<option value="">nobody yet</option>`
      : (!state.meId ? `<option value="">choose your name</option>` : "") +
        state.people.map((p) =>
          `<option value="${p.id}"${p.id === state.meId ? " selected" : ""}>${esc(p.name)}</option>`).join("");

    // V3.4. The family list is a dashboard: every activity, as a raw
    // number, for everyone, in the same nine places, so a glance down the
    // column compares like with like. No standards and no percentages
    // here; those are each person's own business. You come first, in your
    // own colour, so your row is the one the eye lands on.
    const famCells = (p) => {
      const bd = board(p);
      const n = (x) => x === null || x === undefined || x === "" ? null : Number(x);
      const pos = (x) => Number(x) > 0 ? Number(x) : null;
      return {
        steps: pos(bd.steps), train: pos(bd.train_min), cardio: pos(bd.cardio_min),
        sleep: bd.items_pts === null || bd.items_pts === undefined ? null
          : Math.round(Number(bd.items_pts) / Math.max(1, scoreMax()) * 100),
        rise: n(bd.rise), rest: n(bd.rest),
        work: pos(bd.work_min), goals: n(bd.goal_pct), tasks: pos(bd.tasks_done),
      };
    };
    const ordered = state.people.slice().sort((a, b) =>
      (b.id === state.meId) - (a.id === state.meId));
    // V3.4. Everyone but you, folded to one row each under one header:
    // the same nine numbers in the same order, small, so the whole family
    // fits in the space one card used to take. Columns read down.
    const othersTable = ordered.some((p) => p.id === state.meId) && ordered.length > 1;
    const FAB = { steps:"Stp", train:"Trn", cardio:"Crd", sleep:"Slp", rise:"Rise", rest:"Rest",
                  work:"Wrk", goals:"Gls", tasks:"Tsk" };
    const tiny = (k, v) => {
      if (v === null || v === undefined) return "\u2013";
      const x = Number(v);
      switch (STD[k].kind) {
        case "count": return k === "steps"
          ? (x >= 10000 ? Math.round(x / 1000) + "k" : x >= 1000 ? (x / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(Math.round(x)))
          : String(Math.round(x));
        case "min": { const m = Math.round(x), h = Math.floor(m / 60), r = m % 60;
          return h ? (r ? `${h}h${pad(r)}` : `${h}h`) : `${r}m`; }
        case "pct": return Math.round(x) + "%";
        case "time": { const m = ((Math.round(x) % 1440) + 1440) % 1440, h = Math.floor(m / 60);
          return `${h % 12 || 12}:${pad(m % 60)}`; }
      }
      return String(x);
    };
    const famTable = (list) => {
      const ks = STD_GROUPS.flatMap(([, g]) => g);
      return `<div class="ftab"><table class="ftbl">
        <thead><tr><th class="fn"><span class="sr">Name</span></th>${ks.map((k, i) =>
          `<th class="${i % 3 === 0 ? "g0" : ""}" title="${STD[k].label}">${FAB[k]}</th>`).join("")}</tr></thead>
        <tbody>${list.map((p) => {
          const c = famCells(p);
          return `<tr><th class="fn" scope="row" style="--hc:hsl(${p.hue} 58% 42%)">
              <button type="button" class="ftn" data-edit="name" data-person="${p.id}"><i aria-hidden="true"></i>${esc(p.name)}</button></th>
            ${ks.map((k, i) => {
              const v = c[k], nil = v === null || v === undefined, g = i % 3 === 0 ? " g0" : "";
              return !nil && (k === "train" || k === "cardio")
                ? `<td class="see${g}"><button type="button" data-see="${p.id}" data-m="${k === "train" ? "lift" : "cardio"}"
                     aria-label="See ${esc(p.name)}'s ${k === "train" ? "workout" : "cardio"}">${tiny(k, v)}</button></td>`
                : `<td class="${nil ? "nil" : ""}${g}">${tiny(k, v)}</td>`;
            }).join("")}</tr>`;
        }).join("")}</tbody></table></div>`;
    };
    // V3.5. Your own card is your dashboard: one labelled line per pillar,
    // and every number on it is the link to its page. It stays in view
    // with the family folded, because it is how you get anywhere; the tab
    // bar that used to do that job is gone.
    const meDash = (p) => {
      const c = famCells(p);
      const initials = p.name.trim().split(/\s+/).slice(0, 2).map((w) => (w[0] || "").toUpperCase()).join("");
      const NAMES = { steps: "Steps", train: "Train", cardio: "Cardio", sleep: "Score", rise: "Rise", rest: "Rest",
                      work: "Work", goals: "Goals", tasks: "Tasks" };
      const link = (k) => {
        const v = c[k], nil = v === null || v === undefined;
        return `<button type="button" class="dlink${nil ? "" : " on"}" data-go="${k}"
          aria-label="${esc(STD[k].label)}${nil ? "" : ": " + stdWords(k, v)}">${NAMES[k]} <b>${nil ? "\u2013" : stdWords(k, v)}</b></button>`;
      };
      return `<div class="fcard me mydash" style="--hc:hsl(${p.hue} 58% 42%)">
        <div class="fhead">
          <span class="dot" aria-hidden="true"
            style="background:color-mix(in oklab, hsl(${p.hue} 62% 48%) 16%, var(--surface));
                   color:color-mix(in oklab, hsl(${p.hue} 62% 48%) 78%, var(--ink))">${esc(initials)}</span>
          <button class="tapedit" data-edit="name" data-person="${p.id}">${esc(p.name)}</button>
          <em class="fyou">you</em>
          ${p.streak > 1 && !state.boardDay ? `<span class="fstreak">${p.streak}-day streak</span>` : ""}
        </div>
        <div class="drows">${STD_GROUPS.map(([g, ks]) => `
          <div class="drow"><span class="dname">${esc(g)}</span><div class="dlinks">${ks.map(link).join("")}</div></div>`).join("")}
          <p class="dsoon">Meditation &middot; Diet &mdash; coming</p>
        </div>
      </div>`;
    };
    const roster = state.people.length === 0
      ? `<div class="dashed"><p class="note">Nobody has been added yet.
           Add the first name above.</p></div>`
      : `<div class="roster">${ordered.filter((p) => !othersTable || p.id === state.meId).map((p) => {
          if (p.id === state.meId) return meDash(p);
          const c = famCells(p);
          const initials = p.name.trim().split(/\s+/).slice(0,2)
            .map((w) => (w[0] || "").toUpperCase()).join("");
          const isMe = p.id === state.meId;
          const cell = (k) => {
            const v = c[k], nil = v === null;
            const label = STD[k].short || STD[k].label;
            const see = !nil && (k === "train" || k === "cardio");
            return see
              ? `<button type="button" class="fcell" data-see="${p.id}" data-m="${k === "train" ? "lift" : "cardio"}"
                   aria-label="See ${esc(p.name)}'s ${k === "train" ? "workout" : "cardio"}"><b>${stdWords(k, v)}</b><span>${label}</span></button>`
              : `<div class="fcell${nil ? " nil" : ""}"><b>${nil ? "–" : stdWords(k, v)}</b><span>${label}</span></div>`;
          };
          return `<div class="fcard${isMe ? " me" : ""}" style="--hc:hsl(${p.hue} 58% 42%)">
            <div class="fhead">
              <span class="dot" aria-hidden="true"
                style="background:color-mix(in oklab, hsl(${p.hue} 62% 48%) 16%, var(--surface));
                       color:color-mix(in oklab, hsl(${p.hue} 62% 48%) 78%, var(--ink))"
                >${esc(initials)}</span>
              <button class="tapedit" data-edit="name" data-person="${p.id}">${esc(p.name)}</button>
              ${isMe ? `<em class="fyou">you</em>` : ""}
              ${p.streak > 1 && !state.boardDay ? `<span class="fstreak">${p.streak}-day streak</span>` : ""}
            </div>
            <div class="fgrid">${STD_GROUPS.flatMap(([, ks]) => ks).map(cell).join("")}</div>
          </div>`;
        }).join("")}${othersTable && boardOpen() ? famTable(ordered.filter((p) => p.id !== state.meId)) : ""}</div>`;

    // V3.3. The opening screen is the Step Score, large, and nothing
    // else that asks for attention. Swipe for Work and Sleep. The family,
    // the post and adding people are one folded line underneath.
    return `
      <div class="hbar">
        <b>${esc(state.group.name)}</b>
        ${m ? `<label class="hwho"><select id="who" aria-label="Which family member are you">${whoOptions}</select>
          <i aria-hidden="true">&#9662;</i></label>` : ""}
      </div>

      ${editRowHTML()}

      ${m ? homeDials(m) : `
        <section class="card hfirst">
          <h2>Who are you?</h2>
          <p class="hint">Pick your name, or add it, and your Step Score appears here.</p>
          <div class="whoami" style="margin-top:12px">
            <select id="who" aria-label="Which family member are you"
              ${state.people.length === 0 ? "disabled" : ""}>${whoOptions}</select>
            <button class="linkbtn" id="addBtn">${state.adding ? "Never mind" : "Add someone"}</button>
          </div>
          <div class="addrow" id="addRow" ${state.adding ? "" : "hidden"}>
            <input class="field" id="addName" placeholder="Your name" maxlength="40"
                   autocomplete="off" aria-label="Name of the person to add">
            <button class="btn" id="addSave">Add</button>
            <p class="hint" id="addHint" style="flex-basis:100%;margin-top:0"></p>
          </div>
        </section>`}

      <section class="hfam">
        <button class="hfamline" id="foldBoard" aria-expanded="${boardOpen()}">
          <span>${state.boardDay ? "The family" : "The family today"}</span>
          <em>${state.people.length ? `${logged}/${state.people.length} logged` : ""}</em>
          <i aria-hidden="true">${boardOpen() ? "\u25b4" : "\u203a"}</i></button>
        ${boardOpen() ? dayNav({ ids: ["bPrev", "bNext", "bToday"], cls: "famnav",
                     atToday: famDayISO() >= familyISO(),
                     label: state.boardBusy ? "\u2026"
                       : famDayISO() === familyISO() ? "Today" : esc(fullDate(famDayISO())) }) : ""}
        ${boardOpen() || m ? roster : ""}
        ${boardOpen() ? `
          ${state.boardBusy ? "" : `
            <button class="btn" id="waShare" style="width:100%;margin-top:14px">${state.boardDay
              ? `Post ${esc(shortDay(famDayISO()))} to WhatsApp` : "Post today to WhatsApp"}</button>`}
          ${m ? `
          <div class="hadd">
            <button class="linkbtn" id="addBtn">${state.adding ? "Never mind" : "Add someone"}</button>
            <div class="addrow" id="addRow" ${state.adding ? "" : "hidden"}>
              <input class="field" id="addName" placeholder="Their name" maxlength="40"
                     autocomplete="off" aria-label="Name of the person to add">
              <button class="btn" id="addSave">Add</button>
              <p class="hint" id="addHint" style="flex-basis:100%;margin-top:0"></p>
            </div>
          </div>` : ""}` : ""}
      </section>

      ${installHint()}
      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- the dials -----------------------------------------------
     V3.3. One circle per score, coloured by how close you are: red at
     nothing, through amber, to green at your target. The Step dial IS the
     input, like the big number it replaces: tap the count, type, done.
     Work and Sleep are glances; tap one to open its page.
     ------------------------------------------------------------------ */
  const DIAL_C = 326.73;                       // 2πr, r = 52
  const dialColor = (pct) => pct === null || pct === undefined ? "var(--line-strong)"
    : `hsl(${Math.round(Math.max(0, Math.min(100, pct)) * 1.25)} 66% 43%)`;
  function dialRing(pct) {
    const f = pct === null || pct === undefined ? 0 : Math.max(0, Math.min(100, pct)) / 100;
    return `<svg class="dring" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="52" class="dtrack"></circle>
      <circle cx="60" cy="60" r="52" class="dfill" style="stroke:${dialColor(pct)}"
        stroke-dasharray="${DIAL_C}" stroke-dashoffset="${(DIAL_C * (1 - f)).toFixed(2)}"></circle></svg>`;
  }
  // V3.4. The three dials are each person's own choice, from all nine
  // activities. Every one is drawn the same way: the name on top (tap it
  // to open the page), a ring that fills toward the standard and shifts
  // from red to green, today's value in the middle, and the standard
  // under it (tap it to change it). Where a number can be typed, the
  // middle IS the input, as the step count always was.
  function homeDials(m) {
    const keys = myDials();
    const i = Math.min(state.dialIdx || 0, keys.length - 1);
    // A loop: a copy of the last dial sits before the first and a
    // copy of the first after the last. Land on a copy and the strip jumps,
    // unseen, to the real one, so a swipe never hits a wall.
    const order = [keys[2], keys[0], keys[1], keys[2], keys[0]];
    return `
      <div class="dials" id="dials" aria-roledescription="carousel">
        ${order.map((k, n) => dialSlide(m, k, n === 0 || n === 4)).join("")}
      </div>
      <div class="ddots" role="tablist" aria-label="Your dials">${keys.map((k, n) => `
        <button type="button" class="ddot${n === i ? " on" : ""}" data-dot="${n}" role="tab"
          aria-selected="${n === i}" aria-label="${esc(STD[k].label)}"></button>`).join("")}</div>
      <button type="button" class="dedit" id="dialEdit">Change dials</button>`;
  }
  const ofWords = (k, std) => STD[k].kind === "time" ? `by ${clockWords(std)}`
    : STD[k].kind === "min" ? `of ${hm(std)}` : STD[k].kind === "pct" ? `of ${Math.round(std)}%`
    : `of ${num(Math.round(std))}${k === "tasks" ? " done" : ""}`;
  function dialSlide(m, k, clone) {
    // A copy is drawn exactly like the real dial but is inert: no ids, no
    // handlers, hidden from screen readers. It is only ever seen mid-swipe.
    const S = STD[k];
    const std = k === "rise" || k === "rest" ? (hasTarget(m, k) ? target(m, k) : S.def) : stdOf(m, k);
    const v = todayOf(m, k);
    const pct = stdPct(k, v, std);
    const go = (page) => clone ? "" : `data-go="${page}"`;
    const page = k === "goals" ? "goals" : k === "tasks" ? "tasks" : k;
    let ring = dialRing(pct), centre = "", extra = "";

    if (k === "work") {
      if (!state.work) loadWorkLocal();
      const r = state.work.run;
      // Running, the ring is the session draining and the centre is the
      // clock; idle, it is the day against the standard.
      if (r) {
        const f = workLeft(r) / (r.len * 60000);
        ring = `<svg class="dring" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="52" class="dtrack"></circle>
          <circle cx="60" cy="60" r="52" class="dfill${r.pausedAt ? " paused" : ""}" ${clone ? "" : 'id="homeWorkRing"'}
            style="stroke:var(--work)" stroke-dasharray="${DIAL_C}" stroke-dashoffset="${(DIAL_C * (1 - f)).toFixed(2)}"></circle></svg>`;
        centre = `<b class="dval" ${clone ? "" : 'id="homeWorkClock"'}>${mmssMs(workLeft(r))}</b>
          <span class="dsub">${r.pausedAt ? "Paused" : r.label ? esc(r.label) : "Focus"}</span>`;
      }
      extra = `<button type="button" class="dplay${r && !r.pausedAt ? " on" : ""}" ${clone ? 'tabindex="-1"' : 'id="homeWorkGo"'}
          aria-label="${!r ? `Start a ${state.work.len}-minute session` : r.pausedAt ? "Continue" : "Pause"}">${
          r && !r.pausedAt
            ? `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg>`
            : `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>`}</button>`;
    }

    if (!centre) {
      if (S.kind === "count" && k !== "tasks" || S.kind === "min") {
        // Typed. Shown formatted, edited raw.
        const raw = v === null ? "" : String(Math.round(v));
        const shown = v === null ? "" : stdWords(k, v);
        centre = `<input class="dnum${S.kind === "min" ? " dmin" : ""}" ${clone ? 'tabindex="-1" readonly' : `data-dial="${k}" id="dial-${k}"`}
            type="text" inputmode="${S.kind === "min" ? "text" : "numeric"}" ${S.kind === "min" ? "" : 'pattern="[0-9]*"'}
            autocomplete="off" enterkeyhint="done" placeholder="0"
            value="${esc(shown)}" data-raw="${raw}" data-show="${esc(shown)}"
            aria-label="${esc(S.label)} today${S.kind === "min" ? ", in minutes" : ""}, tap to type">`;
      } else if (S.kind === "time") {
        // V3.5. A clock dial has no wheel. Not logged yet: one tap on Now
        // records this minute (with Undo). Logged: the time, which opens
        // the page, where four nudges move it.
        centre = v === null
          ? `<button type="button" class="dval dnow" ${clone ? 'tabindex="-1"' : `data-dialnow="${k}"`}
               aria-label="${esc(S.label)}: record now">Now</button>`
          : `<button type="button" class="dval dgo" ${go(page)} ${clone ? 'tabindex="-1"' : ""}
               aria-label="${esc(S.label)} ${clockWords(v)}. Open to adjust">${clockWords(v)}</button>`;
      } else {
        // Made on its own page (the pyramid, the week's tactics, the list):
        // the centre is the way in.
        centre = `<button type="button" class="dval dgo${v === null ? " dnone" : ""}" ${go(page)} ${clone ? 'tabindex="-1"' : ""}>${
          v === null ? "–" : stdWords(k, v)}</button>`;
      }
    }

    const msg = !clone && state.homeMsg && state.homeMsg.k === k ? esc(state.homeMsg.t) : "&nbsp;";
    return `
      <section class="slide${clone ? " clone" : ""}" ${clone ? 'aria-hidden="true" inert' : `aria-label="${esc(S.label)}"`}>
        <button type="button" class="slab" ${go(page)} ${clone ? 'tabindex="-1"' : ""}>${esc(S.label)}<i aria-hidden="true">&rsaquo;</i></button>
        <div class="dial">
          ${ring}
          <div class="dcore">
            ${centre}
            <button type="button" class="dof" ${clone ? 'tabindex="-1"' : `data-edit="goal" data-metric="${k}"`}>${ofWords(k, std)}</button>
            ${extra}
          </div>
        </div>
        <p class="dmsg" ${clone ? "" : `id="dmsg-${k}"`} role="status">${msg}</p>
      </section>`;
  }
  function dialSay(k, t) {
    state.homeMsg = { k, t };
    const el = document.getElementById("dmsg-" + k);
    if (el) el.textContent = t;
    clearTimeout(dialSay.t);
    dialSay.t = setTimeout(() => { state.homeMsg = null;
      const e2 = document.getElementById("dmsg-" + k); if (e2) e2.innerHTML = "&nbsp;"; }, 2200);
  }
  let homeTick = null;
  function wireHome() {
    const box = document.getElementById("dials");
    if (box) {
      // Strip positions: 0 copy of Sleep · 1 Steps · 2 Work · 3 Sleep ·
      // 4 copy of Steps. Put it back where it was before this render, then
      // follow the swipe; landing on a copy jumps to the real dial.
      const W = () => Math.max(1, box.clientWidth);
      const jump = (pos) => {
        box.style.scrollSnapType = "none";
        box.scrollLeft = pos * W();
        requestAnimationFrame(() => { box.style.scrollSnapType = ""; });
      };
      jump((state.dialIdx || 0) + 1);
      const mark = (n) => {
        state.dialIdx = n;
        document.querySelectorAll("[data-dot]").forEach((d, k) => {
          d.classList.toggle("on", k === n); d.setAttribute("aria-selected", String(k === n)); });
      };
      const settle = () => {
        let pos = Math.round(box.scrollLeft / W());
        if (pos === 0) { pos = 3; jump(3); }
        if (pos === 4) { pos = 1; jump(1); }
        mark(pos - 1);
      };
      let t = null;
      box.addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(settle, 120); }, { passive: true });
      document.querySelectorAll("[data-dot]").forEach((d) =>
        d.addEventListener("click", () => {
          mark(Number(d.dataset.dot));
          box.scrollTo({ left: (state.dialIdx + 1) * W(), behavior: "smooth" });
        }));
    }
    // A typed dial: tap the number, type, leave. Steps take a count; Train,
    // Cardio and Work take minutes, as 45, 1:30 or 1h 30m.
    document.querySelectorAll("[data-dial]").forEach((f) => {
      const k = f.dataset.dial, S = STD[k];
      f.addEventListener("focus", () => {
        if (restoring) return;
        f.value = f.dataset.raw || ""; requestAnimationFrame(() => f.select()); });
      f.addEventListener("keydown", (e) => { if (e.key === "Enter") f.blur(); });
      f.addEventListener("blur", async () => {
        const txt = (f.value || "").trim();
        const digits = txt.replace(/[^0-9]/g, "");
        const v = S.kind === "min" ? parseMinutes(txt) : digits === "" ? null : Number(digits);
        if (v === null || String(v) === (f.dataset.raw || "")) { f.value = f.dataset.show || ""; return; }
        if (S.kind === "min" && v > 1440) { f.value = f.dataset.show || ""; dialSay(k, "A day has 1,440 minutes."); return; }
        f.value = stdWords(k, v);
        f.dataset.raw = String(v);
        const res = await call("app_log", { p_code: state.code, p_person: state.meId,
          p_value: v, p_metric: S.key, p_date: null, p_tz: deviceTZ() });
        dialSay(k, res.error ? (res.offline ? "No signal. Not saved yet." : res.error) : "Saved.");
        await refresh();
      });
    });
    // A clock dial: Now records this minute, the way the page's Now does.
    document.querySelectorAll("[data-dialnow]").forEach((el) =>
      el.addEventListener("click", async () => {
        const k = el.dataset.dialnow;
        el.disabled = true;
        const res = await call("app_stamp", { p_code: state.code, p_person: state.meId,
          p_metric: STD[k].key, p_tz: deviceTZ() });
        if (res.error) { el.disabled = false; dialSay(k, res.offline ? "No signal. Not saved yet." : res.error); return; }
        armUndo({ key: STD[k].key, date: res.date, words: `${STD[k].label} ${clockWords(res.value)} saved` });
        const m = me(); if (m) m[k] = res.value;
        await refresh();
      }));
    // The play button starts, pauses and continues without leaving home.
    // It stops the tap there, so the dial underneath does not also open
    // the Work page.
    on("homeWorkGo", "click", (e) => {
      e.stopPropagation();
      if (!state.work) loadWorkLocal();
      const r = state.work.run;
      if (!r) workGo(); else if (r.pausedAt) workResume(); else workHold();
      render();
    });
    clearInterval(homeTick); homeTick = null;
    const run = state.work && state.work.run;
    if (run && !run.pausedAt) homeTick = setInterval(async () => {
      const r = state.work && state.work.run;
      const el = document.getElementById("homeWorkClock");
      if (state.view !== "board" || !r || r.pausedAt || !el) { clearInterval(homeTick); homeTick = null; return; }
      el.textContent = mmssMs(workLeft(r));
      const ring = document.getElementById("homeWorkRing");
      if (ring) ring.setAttribute("stroke-dashoffset", (DIAL_C * (1 - workLeft(r) / (r.len * 60000))).toFixed(2));
      if (workLeft(r) <= 0) { clearInterval(homeTick); homeTick = null; if (await checkWork()) render(); }
    }, 1000);
  }

  // V3.5. The tab bar is deleted. Every page is reached from the links
  // on the home screen (and the dials), and every page has its way back.
  function wireGo() {
    document.querySelectorAll("[data-go]").forEach((el) => {
      el.addEventListener("click", () => openExercise(el.dataset.go));
      if (el.getAttribute("role") === "button") el.addEventListener("keydown", (e) => {
        if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); el.click(); } });
    });
  }

  /* ---------- Exercise: one pillar, three numbers ---------------------
     This screen absorbed both logger homes. A single segment picks which
     number you are looking at AND which log sits underneath it, so
     starting a workout is still three taps and there is no tab bar to
     outgrow when the other four pillars arrive.
     ------------------------------------------------------------------ */


  /* ---------- one page per metric --------------------------------------
     V1.7. Steps, Train and Cardio are three pages built from one template,
     each one tap from home. The V1.6 overview screen that used to sit in
     front of them is deleted: it held a number you can see on the tile, a
     score that moved to the category header, and two pills the tiles
     replaced.

     Top to bottom, every page is the same shape, so learning one teaches
     all three: today's number, the week as seven tappable bars, the thing
     that records it, then the family behind a fold.
     ------------------------------------------------------------------ */

  const PAGE = {
    steps:  { sub:"The keystone. One number a day.", verb:"steps" },
    train:  { sub:"Lifting and yoga.",               verb:"minutes" },
    cardio: { sub:"Walking, running, swimming, the machines.", verb:"minutes" },
    rest:   { sub:"What time you actually went to bed.",       verb:"time" },
    rise:   { sub:"What time you actually got up.",            verb:"time" },
    sleep:  { sub:"Twelve things that decide how well you sleep.", verb:"%" },
    work:   { sub:"Deep work, one focused session at a time.", verb:"minutes" },
  };

  /* ---------- the log box ---------------------------------------------
     V1.7b splits recording from reviewing. This box records: it carries
     its own date, its own number and nothing else. The graph below it is
     for looking at, and the two no longer share a card and confuse which
     of them you are touching.

     All three metrics are typed now. Train and Cardio still have the
     logger, and a workout still writes the minutes — but a number you
     type outranks it, permanently, for that day. One sentence, no marks
     to decode: what you typed is what the day says.
     ------------------------------------------------------------------ */
  function logCard(k) {
    const met = M[k];
    const m   = me() || {};
    const iso = entryDay();
    const rec = dayRecord(k);
    const isToday = iso === todayISO();
    const goal = target(m, k);
    if (met.time) return timeCard(k, iso, isToday, m, rec, goal);
    const shown = isToday ? val(m, k) : rec.value;
    const has = isToday ? (k === "steps" ? !!m.steps_logged : shown > 0) : rec.logged;

    // V2.1. The number IS the input. Tap it and the keyboard comes up with
    // the digits selected; leave it and it saves. There is no second box
    // to find and no button to press, which on an iPhone numeric keypad —
    // it has no return key — was always one more thing to hunt for.
    return `
      <section class="card">
        ${dayNav({ label: isToday ? "Today" : esc(fullDate(iso)), atToday: isToday, unit: "day" })}

        <div class="domino" style="padding-top:10px">
          <input class="bigedit" id="steps" type="text" inputmode="numeric"
                 pattern="[0-9]*" autocomplete="off" enterkeyhint="done"
                 style="color:${met.color}"
                 value="${has ? num(Math.round(shown)) : ""}" placeholder="0"
                 data-raw="${has ? Math.round(shown) : ""}"
                 aria-label="${esc(met.label)} on ${isToday ? "today" : esc(fullDate(iso))}, tap to edit">
          <button type="button" class="of" data-edit="goal" data-metric="${k}">${goal
            ? `of <b>${num(Math.round(goal))}</b> ${met.unit}`
            : `set a ${esc(met.label.toLowerCase())} target`}</button>
        </div>

        <p class="hint dshint ${state.msgKind || ""}" id="hint"
           style="text-align:center">${state.msg ? esc(state.msg)
          : has ? "Tap the number to change it."
                : `Tap the number to log ${isToday ? "today" : "this day"}.`}</p>
      </section>`;
  }

  /* ---------- a time, not an amount -----------------------------------
     Rest and Rise are clock readings. The big figure is still the input:
     a native time wheel sits invisibly over it, so one tap edits it the
     same way one tap edits the step count. The button under it stamps
     right now, for the mornings and nights when you are holding the phone
     anyway and do not want to spin a wheel.
     ------------------------------------------------------------------ */
  // "10:42" with a small "pm": the reading, large; the half of the day, quiet.
  function tParts(min) {
    const b = ((Math.round(min) % 1440) + 1440) % 1440, h = Math.floor(b / 60);
    return `${h % 12 || 12}:${pad(b % 60)}<small>${h < 12 ? "am" : "pm"}</small>`;
  }
  function timeCard(k, iso, isToday, m, rec, goal) {
    const met = M[k];
    const local = state.tLocal && state.tLocal.k === k && state.tLocal.iso === iso ? state.tLocal.v : null;
    const v = local !== null ? local : isToday ? rawVal(m, k) : (rec.logged ? rec.value : null);
    const has = v !== null && v !== undefined;
    return `
      <section class="card">
        ${dayNav({ label: isToday ? (met.night ? "Tonight" : "Today") : esc(fullDate(iso)), atToday: isToday, unit: "day", todayWord: met.night ? "tonight" : "today" })}

        ${(() => {
          // V3.5. No wheel. One big time, Now for the usual case, and four
          // nudges for the rest: nothing to scroll means nothing to stick.
          // Unset, it shows your target faintly, so a nudge starts there.
          const base = has ? v : (hasTarget(m, k) ? goal : (met.night ? 22 * 60 : 7 * 60));
          return `
        <div class="domino tclock" style="padding-top:8px">
          <b class="tbig${has ? "" : " unset"}" id="tBig" style="color:${met.color}">${tParts(base)}</b>
          <button type="button" class="of" data-edit="goal" data-metric="${k}">${
            hasTarget(m, k) ? `standard <b>${clockWords(goal)}</b>`
                            : `set a ${esc(met.label.toLowerCase())} target`}</button>
          <div class="tnudge" role="group" aria-label="Adjust">
            ${[-15, -5, 5, 15].map((d) => `<button type="button" data-nudge="${d}"
              aria-label="${Math.abs(d)} minutes ${d < 0 ? "earlier" : "later"}">${d < 0 ? "\u2212" : "+"}${Math.abs(d)}</button>`).join("")}
          </div>
        </div>`; })()}

        <button class="btn" id="stampNow"
                style="width:100%;margin-top:14px;background:${met.color}">Now</button>
        ${has ? `
          <button type="button" class="linkbtn" id="clearDay"
            style="display:block;margin:10px auto 0;font-size:12px;color:var(--muted)">
            Clear this ${met.night ? "night" : "day"}</button>` : ""}

        <p class="hint dshint ${state.msgKind || ""}" id="hint"
           style="text-align:center">${state.msg ? esc(state.msg)
          : has ? "Saved. Nudge to adjust."
                : "Tap Now, or nudge from your target."}</p>
      </section>`;
  }

  // What the week adds up to — which is not a sum for every metric. Adding
  // up seven percentages gives 700, and adding up seven bedtimes gives a
  // number of minutes nobody has a use for. Those average instead.
  // How far off, in words. "22 min late" is the sentence; "10:52p" is the
  // arithmetic problem it saves you.
  function offWords(mins) {
    const m = Math.round(Math.abs(mins));
    if (m === 0) return "on target";
    const h = Math.floor(m / 60), r = m % 60;
    const span = h ? (r ? `${h}h ${r}m` : `${h}h`) : `${m} min`;
    return `${span} ${mins > 0 ? "late" : "early"}`;
  }

  function weekWords2(k) {
    const met = M[k] || {};
    const pts = points(k).filter((p) => met.time || met.bits ? p.logged : true);
    if (!pts.length) return "nothing logged this week";
    const sum = pts.reduce((t, p) => t + p.value, 0);
    if (met.bits) return `${Math.round(sum / pts.length)}% average this week`;
    if (met.time) {
      const avg = Math.round(sum / pts.length);
      const goal = target(me() || {}, k);
      // With a target, the average miss says more than the average time.
      // The clock reading is still there, in brackets, for anyone who
      // wants it.
      if (goal || goal === 0) {
        const d = avg - goal;
        return Math.abs(d) < 1
          ? `on target on average \u00b7 ${clockWords(avg)}`
          : `${offWords(d)} on average \u00b7 ${clockWords(avg)}`;
      }
      return `${clockWords(avg)} average this week`;
    }
    return `${num(Math.round(sum))} ${met.unit} this week`;
  }

  const trendOpen = () => { try { return localStorage.getItem("fhd.trend") === "open"; } catch { return false; } };
  function graphCard(k) {
    const met = M[k];
