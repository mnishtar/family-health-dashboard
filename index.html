      el.addEventListener("click", () => startCycle(el.dataset.gexample, true)));
    const askNew = () => {
      const mon = mondayOf(G.today), next = shiftISO(mon, 7);
      openModal({
        title: "Start a new 12 weeks?",
        body: "This plan is kept. Someday and 3 years carry over; the goals start fresh.",
        buttons: [
          { label: `Start this week · ${shortDay(mon)}`, kind: "go", run: () => startCycle(mon) },
          { label: `Start next Monday · ${shortDay(next)}`, kind: "quiet", run: () => startCycle(next) },
          { label: "Cancel", kind: "quiet" },
        ],
      });
    };
    on("gNew", "click", askNew);
    on("gNew2", "click", askNew);
    if (!doc) return;
    const open = lastOpen(), cur = curWeek();
    const findT = (id) => { for (const g of doc.goals) { const t = g.tactics.find((x) => x.id === id);
                                                        if (t) return { g, t }; } return {}; };

    // ---- the week ----
    on("gPrev", "click", () => { G.sel = Math.max(1, G.sel - 1); render(); });
    on("gNext", "click", () => { G.sel = Math.min(open, G.sel + 1); render(); });
    on("gToday", "click", () => { G.sel = open; render(); });
    document.querySelectorAll("[data-gday]").forEach((el) =>
      el.addEventListener("click", () => {
        const [id, d] = el.dataset.gday.split(":");
        const { t } = findT(id);
        if (!t || G.sel > open || cur < 1) return;
        toggleMark(t, G.sel, Number(d));
        render(); saveGoals();
      }));

    // ---- goal setting to the now ----
    const wk = Math.min(12, Math.max(1, cur));
    const focusKey = (k) => k === "fw" ? "w" + wk : `w${wk}d${dowOf(G.today)}`;
    document.querySelectorAll("[data-cedit]").forEach((el) =>
      el.addEventListener("click", () => {
        G.edit = "c:" + el.dataset.cedit; render();
        const f = document.querySelector(`[data-cf="${el.dataset.cedit}"]`);
        if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
      }));
    document.querySelectorAll("[data-cf]").forEach((el) => {
      const k = el.dataset.cf;
      el.addEventListener("input", () => {
        if (k === "vision" || k === "three_year") doc[k] = el.value.slice(0, k === "vision" ? 2000 : 1000);
        else {
          const v = el.value.slice(0, 200);
          doc.focus = doc.focus || {};
          if (v.trim()) doc.focus[focusKey(k)] = v; else delete doc.focus[focusKey(k)];
        }
        saveGoals();
      });
      const done = () => { if (G.edit === "c:" + k) { G.edit = null; render(); } };
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && (el.tagName === "INPUT" || !e.shiftKey)) { e.preventDefault(); done(); }
        if (e.key === "Escape") done();
      });
      el.addEventListener("blur", () => setTimeout(() => { if (el.isConnected) done(); }, 0));
    });
    // Today's ONE Thing: always a line to type in, and ▶ to start on it.
    // It is filed under today, so tomorrow opens blank without a sweep.
    on("gOneIn", "input", (e) => {
      const v = e.target.value.slice(0, 200), k = focusKey("fd");
      doc.focus = doc.focus || {};
      if (v.trim()) doc.focus[k] = v; else delete doc.focus[k];
      saveGoals();
    });
    on("gOneIn", "keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
    on("gOneGo", "click", async () => {
      const f = document.getElementById("gOneIn");
      const text = ((f && f.value) || "").trim();
      if (!text) { if (f) f.focus(); return; }
      doc.focus = doc.focus || {};
      doc.focus[focusKey("fd")] = text.slice(0, 200);
      saveGoals(); await flushGoals();
      loadWorkLocal();
      state.work.focus = { label: text.slice(0, 120), task_id: null };
      saveWorkLocal();
      if (!state.work.run) workGo();
      state.goals = null;
      openExercise("work");
    });

    // ---- KPI, week by week ----
    const rs = document.querySelector(".card:not(.ro) .rs-wrap");
    if (rs) {
      const c = rs.querySelector("th.cur");
      if (c) rs.scrollLeft = Math.max(0, c.offsetLeft - rs.clientWidth / 2);
    }
    document.querySelectorAll("[data-kw]").forEach((el) =>
      el.addEventListener("click", () => {
        G.kedit = el.dataset.kw; render();
        const f = document.querySelector(`[data-kin="${G.kedit}"]`);
        if (f) { f.focus(); f.select(); }
      }));
    document.querySelectorAll("[data-kin]").forEach((el) => {
      const [gid, w] = el.dataset.kin.split(":");
      const commit = () => {
        if (G.kedit !== el.dataset.kin) return;
        G.kedit = null;
        const g = doc.goals.find((x) => x.id === gid);
        if (g) {
          g.kpi_log = g.kpi_log || {};
          const v = numOrNull(el.value);
          if (v === null) delete g.kpi_log[w]; else g.kpi_log[w] = v;
          saveGoals();
        }
        render();
      };
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); commit(); }
        if (e.key === "Escape") { G.kedit = null; render(); }
      });
      el.addEventListener("blur", () => setTimeout(() => { if (el.isConnected) commit(); }, 0));
    });

    // ---- the plan ----
    document.querySelectorAll("[data-gedit]").forEach((el) =>
      el.addEventListener("click", () => { G.edit = "g:" + el.dataset.gedit; render(); }));
    document.querySelectorAll("[data-gdone]").forEach((el) =>
      el.addEventListener("click", () => { G.edit = null; render(); }));
    document.querySelectorAll("[data-gf]").forEach((el) =>
      el.addEventListener("input", () => {
        const g = doc.goals.find((x) => x.id === el.dataset.g);
        if (!g) return;
        const f = el.dataset.gf;
        g[f] = f === "kpi_now" || f === "kpi_target" ? numOrNull(el.value) : el.value;
        saveGoals();
      }));
    document.querySelectorAll("[data-gstar]").forEach((el) =>
      el.addEventListener("click", () => {
        doc.one_goal = doc.one_goal === el.dataset.gstar ? null : el.dataset.gstar;
        render(); saveGoals();
      }));
    document.querySelectorAll("[data-gtweek]").forEach((el) =>
      el.addEventListener("change", () => {
        const { t } = findT(el.dataset.gtweek);
        if (!t) return;
        setFreq(t, el.value);
        saveGoals();
      }));
    document.querySelectorAll("[data-gtdel]").forEach((el) =>
      el.addEventListener("click", () => {
        const { g } = findT(el.dataset.gtdel);
        if (!g) return;
        g.tactics = g.tactics.filter((x) => x.id !== el.dataset.gtdel);
        render(); saveGoals();
      }));
    document.querySelectorAll("[data-gtadd]").forEach((form) =>
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const g = doc.goals.find((x) => x.id === form.dataset.gtadd);
        const inp = form.querySelector("input"), sel = form.querySelector("select");
        const title = (inp.value || "").trim();
        if (!g || !title) return;
        if (g.tactics.length >= 30) { G.err = "Thirty tactics per goal at most."; render(); return; }
        const t = { id: uuid(), title: title.slice(0, 200), week: null, times: 7, daily: true, marks: [] };
        setFreq(t, sel.value);
        g.tactics.push(t);
        render(); saveGoals();
        document.querySelector(`[data-gtadd="${g.id}"] input`)?.focus();
      }));
    document.querySelectorAll("[data-gdel]").forEach((el) =>
      el.addEventListener("click", () => openModal({
        title: "Remove this goal?",
        body: "Its tactics, ticks and KPI log go with it.",
        buttons: [
          { label: "Remove goal", kind: "bad", run: () => {
              doc.goals = doc.goals.filter((x) => x.id !== el.dataset.gdel);
              if (doc.one_goal === el.dataset.gdel) doc.one_goal = null;
              G.edit = null; render(); saveGoals();
            } },
          { label: "Keep it", kind: "quiet" },
        ],
      })));
    on("gAdd", "click", () => {
      if (doc.goals.length >= 3) return;
      const g = newGoal(); doc.goals.push(g);
      if (doc.goals.length === 1) doc.one_goal = g.id;
      G.edit = "g:" + g.id; render(); saveGoals();
      document.querySelector(`[data-g="${g.id}"][data-gf="title"]`)?.focus();
    });
  }

  /* ---------- one popup, used everywhere a choice has to be made -------
     V2.8. Built on the page, not with confirm(): a browser dialog cannot be
     styled, cannot offer three answers, and inside some app views is not
     shown at all. It sits outside the rendered page so a re-render behind
     it cannot close it. Stacked, full-width buttons in the order of how
     often each is the right answer — the Strong pattern, because it works.
     ------------------------------------------------------------------ */
  function openModal({ title, body, mark, buttons, row }) {
    closeModal();
    const wrap = document.createElement("div");
    wrap.className = "modal";
    wrap.id = "modal";
    wrap.setAttribute("role", "dialog");
    wrap.setAttribute("aria-modal", "true");
    wrap.innerHTML = `
      <div class="mcard">
        ${mark ? `<div class="mmark" aria-hidden="true">${mark}</div>` : ""}
        <h3>${esc(title)}</h3>
        ${body ? `<p>${esc(body)}</p>` : ""}
        <div class="mbtns${row ? " row" : ""}">${buttons.map((b, i) => `
          <button type="button" class="mbtn ${b.kind || "quiet"}" data-mb="${i}">
            ${esc(b.label)}${b.sub ? `<small>${esc(b.sub)}</small>` : ""}</button>`).join("")}
        </div>
      </div>`;
    document.body.appendChild(wrap);
    wrap.querySelectorAll("[data-mb]").forEach((el) =>
      el.addEventListener("click", async () => {
        const b = buttons[Number(el.dataset.mb)];
        closeModal();
        if (b && b.run) await b.run();
      }));
    wrap.querySelector("[data-mb]")?.focus();
  }
  function closeModal() { document.getElementById("modal")?.remove(); }
  // alert() has the same problem confirm() had: some app views never show it.
  const say = (msg) => openModal({ title: msg, buttons: [{ label: "OK", kind: "quiet" }] });

  /* ---------- Work: a focus timer that logs itself --------------------
     V2.8. One circle, one button. Idle, the ring shows how far today is
     toward your standard and the centre shows the session length, so the
     screen answers "how much is left today" before you touch anything.
     Running, the ring drains with the session.

     The timer is WALL-CLOCK, not a counter. A phone suspends a page it is
     not looking at, so a counter would stop the moment you lock the
     screen. The start time is kept on the phone instead, and "how long is
     left" is worked out from the clock every time the page looks — so a
     session finishes on time whether or not you were watching, and is
     logged the next time the app wakes.
     ------------------------------------------------------------------ */
  // V3.1. Any length from 5 to 180 minutes, in steps of 5; 20 to start.
  const WORK_MIN = 5, WORK_MAX = 180, WORK_STEP = 5, WORK_DEFAULT = 20;
  const workKey = () => "fhd.work." + (state.meId || "anon");
  function loadWorkLocal() {
    try {
      const w = JSON.parse(localStorage.getItem(workKey()) || "{}");
      const len = Number(w.len);
      state.work = { len: len >= WORK_MIN && len <= WORK_MAX ? len : WORK_DEFAULT, run: w.run || null,
                     focus: w.focus && w.focus.label ? w.focus : null,
                     adjust: state.work ? state.work.adjust : false, pick: false,
                     pending: Array.isArray(w.pending) ? w.pending : [],
                     sessions: state.work && state.work.sessions || null };
    } catch { state.work = { len: WORK_DEFAULT, run: null, focus: null, pending: [], sessions: null }; }
  }
  function saveWorkLocal() {
    try { localStorage.setItem(workKey(),
      JSON.stringify({ len: state.work.len, run: state.work.run, focus: state.work.focus || null,
                       pending: state.work.pending || [] })); } catch {}
  }
  const workElapsed = (r) => !r ? 0
    : (r.pausedAt || Date.now()) - r.startedAt - (r.pausedMs || 0);
  const workLeft = (r) => !r ? 0 : Math.max(0, r.len * 60000 - workElapsed(r));
  const hm = (min) => {
    const m = Math.round(Number(min) || 0), h = Math.floor(m / 60), r = m % 60;
    return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`;
  };
  const mmssMs = (ms) => {
    const t = Math.ceil(ms / 1000), m = Math.floor(t / 60), sec = t % 60;
    return `${m}:${pad(sec)}`;
  };

  // "9:38 PM – 10:18 PM": when this session started (or would start) and
  // when it will end, so changing the length shows what it costs.
  function workRange() {
    const w = state.work, r = w.run;
    const t = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const start = r ? r.startedAt : Date.now();
    const end = r ? Date.now() + workLeft(r) : Date.now() + w.len * 60000;
    return `${t(start)} – ${t(end)}`;
  }

  /* What the session is for. Recent labels first, then open tasks in box
     order, then this twelve weeks' tactics. Typing names a new one. */
  const recentKey = () => "fhd.focusRecent." + (state.meId || "anon");
  const getRecent = () => { try { return JSON.parse(localStorage.getItem(recentKey()) || "[]"); } catch { return []; } };
  function pushRecent(f) {
    if (!f || !f.label) return;
    const list = [f].concat(getRecent().filter((x) => x.label !== f.label)).slice(0, 5);
    try { localStorage.setItem(recentKey(), JSON.stringify(list)); } catch {}
  }
  function focusItems() {
    const w = state.work, d = w.pickData || {}, q = (w.pickQ || "").trim().toLowerCase();
    const hit = (x) => !q || x.label.toLowerCase().includes(q);
    const item = (x) => `<button type="button" class="fitem${w.focus && w.focus.label === x.label ? " on" : ""}"
      data-flabel="${esc(x.label)}" data-ftask="${x.task_id || ""}">${esc(x.label)}${x.tag ? `<small>${esc(x.tag)}</small>` : ""}</button>`;
    const sec = (name, xs) => xs.length ? `<p class="eyebrow">${name}</p>${xs.map(item).join("")}` : "";
    const recent = getRecent().filter(hit);
    const tasks = (d.tasks || []).filter(hit);
    const tactics = (d.tactics || []).filter(hit);
    const typed = (w.pickQ || "").trim();
    return (typed && ![...recent, ...tasks, ...tactics].some((x) => x.label.toLowerCase() === typed.toLowerCase())
        ? `<button type="button" class="fitem fnew" data-flabel="${esc(typed.slice(0, 120))}" data-ftask="">Focus on “${esc(typed.slice(0, 120))}”</button>` : "")
      + sec("Recent", recent) + sec("Tasks", tasks) + sec("Goals", tactics)
      + (!recent.length && !tasks.length && !tactics.length && !typed
          ? `<p class="hint">Add tasks or goal tactics, or type what this session is for.</p>` : "");
  }
  function focusPicker() {
    const w = state.work;
    return `
      <div class="fpick">
        <input class="field" id="fSearch" maxlength="120" autocomplete="off" enterkeyhint="done"
          placeholder="Search, or type what this is for" value="${esc(w.pickQ || "")}" aria-label="Focus">
        <div class="flist" id="fList">${w.pickData ? focusItems() : `<p class="loading">Loading…</p>`}</div>
        <div class="fbtm">
          ${w.focus ? `<button type="button" class="linkbtn" id="fNone">No focus</button>` : "<span></span>"}
          <button type="button" class="linkbtn" id="fClose">Close</button>
        </div>
      </div>`;
  }
  async function loadFocusData() {
    const w = state.work;
    const [a, b] = await Promise.all([
      call("app_tasks", { p_code: state.code, p_person: state.meId }),
      call("app_cycle", { p_code: state.code, p_person: state.meId }),
    ]);
    // Do first, then Decide, then Delegate; Not-to-do is not work to focus on.
    const tasks = ((a && a.tasks) || []).filter((x) => !x.parent_id && !x.done && (x.quadrant || 1) !== 4)
      .sort((x, y) => ((x.quadrant || 1) - (y.quadrant || 1)) || (x.position - y.position))
      .map((x) => ({ label: x.title, task_id: x.id, tag: ["", "Do", "Decide", "Delegate"][x.quadrant || 1] }));
    const cy = b && b.cycle;
    const tactics = cy ? cy.goals.flatMap((g) => g.tactics.map((t) => ({ label: t.title, tag: g.title }))) : [];
    // V3.4. Today's ONE Thing comes first: it is what the time is for.
    if (cy && b.today) {
      const wk = weekOf(cy, b.today), one = wk >= 1 && wk <= 12 && (cy.focus || {})[`w${wk}d${dowOf(b.today)}`];
      if (one) tactics.unshift({ label: String(one).slice(0, 120), tag: "Today's ONE Thing" });
    }
    w.pickData = { tasks, tactics };
  }

  // V3.2. The day's total is itself the input, as the step count is: tap
  // it, type minutes, done. A typed total outranks the timer for that day
  // (the server's rule for every metric); "Use timed" hands it back.
  function workTotalLine(done, goal, typed, big) {
    const w = state.work;
    const timed = (w.sessions || []).reduce((a, x) => a + Number(x.minutes || 0), 0);
    return `
      <div class="wtotal${big ? " big" : ""}">
        ${w.editTotal
          ? `<input class="wtotin" id="workTotalIn" inputmode="numeric" enterkeyhint="done" autocomplete="off"
               value="${done || ""}" placeholder="0" aria-label="Minutes of deep work"><span class="wunit">min</span>`
          : `<button type="button" class="wtot" id="workTotal" aria-label="Total ${hm(done)}, tap to type it">${hm(done)}</button>`}
        <span class="wof">of <button type="button" class="linkbtn" data-edit="goal" data-metric="work">${hm(goal)}</button></span>
      </div>
      ${typed && !w.editTotal ? `<p class="wtyped">Typed · <button type="button" class="linkbtn" id="workUntype">use timed${
        timed ? ` (${hm(timed)})` : ""}</button></p>` : ""}`;
  }
  // "80", "1:20", "1h 20m", "1h" and "90m" all mean what they say.
  function parseMinutes(v) {
    const t = String(v || "").trim().toLowerCase();
    if (!t) return null;
    let m = t.match(/^(\d+):(\d{1,2})$/);
    if (m) return Number(m[1]) * 60 + Number(m[2]);
    m = t.match(/^(?:(\d+(?:\.\d+)?)\s*h)?\s*(?:(\d+)\s*m?)?$/);
    if (m && (m[1] || m[2])) return Math.round(Number(m[1] || 0) * 60 + Number(m[2] || 0));
    return null;
  }

  // One set of verbs for the timer, used by the Work page and by the
  // play button on the home dial, so the two can never disagree.
  function workGo() {
    if (!state.work) loadWorkLocal();
    const w = state.work;
    primeAudio();
    w.adjust = false;
    w.run = { id: uuid(), startedAt: Date.now(), pausedAt: null, pausedMs: 0,
              len: w.len, date: todayISO(),
              label: w.focus ? w.focus.label : null, task: w.focus ? w.focus.task_id : null };
    if (w.focus) pushRecent(w.focus);
    saveWorkLocal();
  }
  function workHold() { const r = state.work.run; if (r && !r.pausedAt) { r.pausedAt = Date.now(); saveWorkLocal(); } }
  function workResume() {
    const r = state.work.run;
    if (!r || !r.pausedAt) return;
    primeAudio();
    r.pausedMs += Date.now() - r.pausedAt; r.pausedAt = null;
    saveWorkLocal();
  }

  function workCard() {
    if (!state.work) loadWorkLocal();
    const w = state.work, r = w.run;
    const m = me() || {};
    const today = entryDay() === todayISO();
    const done = Number(today ? m.work_min : dayRecord("work").value) || 0;
    const pomos = today ? Number(m.work_pomos) || 0 : null;
    const goal = Number(m.work_target) || 180;
    const running = !!r && !r.pausedAt;

    // The ring: while a session runs it is the session; otherwise it is
    // the day against the standard. Circumference of r=46 is 289.03.
    const C = 289.03;
    const frac = r ? 1 - workLeft(r) / (r.len * 60000) : Math.min(1, done / goal);
    const centre = r ? mmssMs(workLeft(r)) : `${w.len}:00`;
    const f = w.focus;

    return `
      <section class="card workcard">
        ${dayNav({ label: today ? "Today" : esc(fullDate(entryDay())), atToday: today, unit: "day" })}

        ${today ? `
        <button type="button" class="focusbtn" id="workFocus" aria-expanded="${!!w.pick}">
          Focus${f ? ` · <span>${esc(f.label)}</span>` : ""} <i aria-hidden="true">&rsaquo;</i></button>

        ${w.pick ? focusPicker() : `
        <div class="ring${running ? " run" : ""}${r && r.pausedAt ? " paused" : ""}">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="46" class="rtrack"></circle>
            <circle cx="50" cy="50" r="46" class="rfill"
              stroke-dasharray="${C}" stroke-dashoffset="${(C * (1 - frac)).toFixed(2)}"></circle>
          </svg>
          <div class="rin">
            <div class="radj">
              ${w.adjust ? `<button type="button" class="rpm" id="workMinus" aria-label="${WORK_STEP} minutes less">&minus;</button>` : ""}
              <button type="button" class="rclock" id="workClockBtn"
                aria-label="${w.adjust ? "Done changing the length" : "Change the length"}"><b id="workClock">${centre}</b></button>
              ${w.adjust ? `<button type="button" class="rpm" id="workPlus" aria-label="${WORK_STEP} minutes more">+</button>` : ""}
            </div>
            <span class="rsub" id="workRange">${w.adjust ? workRange() : r ? (r.pausedAt ? "Paused" : "") : "tap to change"}</span>
          </div>
        </div>

        <div class="workbtns">
          ${!r ? `<button class="btn workgo" id="workStart">Start</button>`
          : running ? `<button class="btn-quiet workline" id="workPause">Pause</button>`
          : `<button class="btn workgo" id="workContinue">Continue</button>
             <button class="btn-quiet workline" id="workEnd">End</button>`}
        </div>`}

        ${workTotalLine(done, goal, m.work_typed)}
        ${state.msg ? `<p class="hint dshint ${state.msgKind || ""}" style="text-align:center;margin-top:4px">${esc(state.msg)}</p>` : ""}
        ${(w.sessions || []).length ? `
          <button type="button" class="wfold" id="workFold" aria-expanded="${!!w.sessOpen}">
            ${w.sessions.length === 1 ? "1 session" : `${w.sessions.length} sessions`}
            <i aria-hidden="true">${w.sessOpen ? "\u25b4" : "\u25be"}</i></button>
          ${w.sessOpen ? `<ul class="sesslist">${w.sessions.map((x) => `
            <li><span>${hm(x.minutes)}</span>
              <em>${x.label ? `<b>${esc(x.label)}</b> · ` : ""}${x.started_at ? new Date(x.started_at).toLocaleTimeString([],
                { hour:"numeric", minute:"2-digit" }) : ""}</em>
              <button type="button" data-wdel="${x.id}" aria-label="Remove this session">&times;</button>
            </li>`).join("")}</ul>` : ""}` : ""}
        ` : `
        <div class="wpast">${workTotalLine(done, goal, false, true)}</div>`}
      </section>`;
  }

  // Finish (or check for a finished) session. Called on a tick, on load,
  // and on every resume, so a session that ran out while the phone was in
  // a pocket is still logged the moment the app is opened again.
  let workTick = null;
  async function checkWork() {
    if (!state.work) loadWorkLocal();
    await flushWork();
    const r = state.work.run;
    if (!r || r.pausedAt || workLeft(r) > 0) return false;
    state.work.run = null; saveWorkLocal();
    const res = await logWork(r.id, r.len, r.startedAt, r.date, r.label, r.task);
    chime();
    state.msg = res.error ? "Session saved on this phone. It will upload by itself."
                          : `Session logged · ${hm(r.len)}.`;
    state.msgKind = "ok";
    return true;
  }
  // A session is never lost to a dead signal. If the log call fails it is
  // kept on the phone and sent again on the next look; the server treats
  // a repeated id as the same session, so a retry can never count twice.
  const workArgs = (x) => ({ p_code: state.code, p_person: state.meId,
    p_id: x.id, p_minutes: Math.max(1, Math.round(x.minutes)),
    p_date: x.date || null, p_tz: deviceTZ(),
    p_started: x.startedAt ? new Date(x.startedAt).toISOString() : null,
    p_label: x.label || null, p_task: x.task || null });
  async function flushWork() {
    const q = (state.work && state.work.pending) || [];
    if (!q.length || !navigator.onLine) return;
    const left = [];
    for (const x of q) {
      const res = await call("app_work_log", workArgs(x));
      if (res.error && OFFLINE_RX.test(res.error)) left.push(x);
    }
    state.work.pending = left; saveWorkLocal();
    // Something landed: the board and the day's list owe you minutes.
    if (left.length < q.length) {
      await loadWorkSessions();
      setTimeout(() => refresh().then(() => render()), 0);
    }
  }
  async function logWork(id, minutes, startedAt, date, label, task) {
    const x = { id, minutes, startedAt, date, label: label || null, task: task || null };
    const res = await call("app_work_log", workArgs(x));
    if (res.error && OFFLINE_RX.test(res.error)) {
      state.work.pending = (state.work.pending || []).filter((y) => y.id !== id).concat([x]);
      saveWorkLocal();
      return res;
    }
    await loadWorkSessions();
    await loadHistory();
    await refresh();
    return res;
  }
  async function loadWorkSessions() {
    if (!state.work) loadWorkLocal();
    const res = await call("app_work_day", { p_code: state.code, p_person: state.meId });
    state.work.sessions = (res && res.sessions) || [];
  }
  function startWorkTick() {
    stopWorkTick();
    workTick = setInterval(async () => {
      const r = state.work && state.work.run;
      const el = document.getElementById("workClock");
      if (!r || !el || state.seg !== "work") return stopWorkTick();
      el.textContent = mmssMs(workLeft(r));
      if (state.work.adjust) { const rg = document.getElementById("workRange"); if (rg) rg.textContent = workRange(); }
      const fill = document.querySelector(".ring .rfill");
      if (fill) fill.setAttribute("stroke-dashoffset",
        (289.03 * (workLeft(r) / (r.len * 60000))).toFixed(2));
      if (workLeft(r) <= 0) { stopWorkTick(); if (await checkWork()) render(); }
    }, 1000);
  }
  function stopWorkTick() { if (workTick) { clearInterval(workTick); workTick = null; } }

  // A short two-note chime. The audio context is made on the Start tap,
  // because a phone only lets a page make sound after a touch.
  let audioCtx = null;
  function primeAudio() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); }
    catch { audioCtx = null; }
  }
  function chime() {
    try {
      if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
      if (!audioCtx) return;
      [880, 1318].forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
        const t = audioCtx.currentTime + i * 0.18;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.start(t); o.stop(t + 0.55);
      });
    } catch {}
  }

  function wireWork() {
    if (state.seg !== "work") return;
    if (!state.work) loadWorkLocal();
    const w = state.work;
    if (w.run && !w.run.pausedAt) startWorkTick();

    // Tap the time to change it; tap again to put it away. − and + step
    // by five minutes. Mid-session they move the end, never before now.
    on("workClockBtn", "click", () => { w.adjust = !w.adjust; render(); });
    const step = (d) => {
      if (w.run) {
        const floor = Math.ceil(workElapsed(w.run) / 60000) + 1;
        w.run.len = Math.max(floor, Math.min(WORK_MAX, w.run.len + d));
      } else w.len = Math.max(WORK_MIN, Math.min(WORK_MAX, w.len + d));
      saveWorkLocal(); render();
    };
    on("workMinus", "click", () => step(-WORK_STEP));
    on("workPlus", "click", () => step(WORK_STEP));

    on("workFocus", "click", async () => {
      w.pick = !w.pick; w.pickQ = ""; w.pickData = null; render();
      if (!w.pick) return;
      await loadFocusData();
      if (w.pick) { const l = document.getElementById("fList"); if (l) { l.innerHTML = focusItems(); wirePick(); } }
    });
    const choose = (f) => { w.focus = f; w.pick = false; saveWorkLocal(); render(); };
    function wirePick() {
      document.querySelectorAll("[data-flabel]").forEach((el) =>
        el.addEventListener("click", () => choose({ label: el.dataset.flabel, task_id: el.dataset.ftask || null })));
    }
    wirePick();
    on("fSearch", "input", (e) => {
      w.pickQ = e.target.value;
      const l = document.getElementById("fList");
      if (l && w.pickData) { l.innerHTML = focusItems(); wirePick(); }
    });
    on("fSearch", "keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const first = document.querySelector("#fList [data-flabel]");
      const typed = (w.pickQ || "").trim();
      if (first) first.click(); else if (typed) choose({ label: typed.slice(0, 120), task_id: null });
    });
    on("fNone", "click", () => choose(null));
    on("fClose", "click", () => { w.pick = false; render(); });

    on("workStart", "click", () => { workGo(); render(); });
    on("workPause", "click", () => { workHold(); stopWorkTick(); render(); });
    on("workContinue", "click", () => { workResume(); render(); });
    on("workEnd", "click", () => {
      const r = w.run;
      const mins = Math.floor(workElapsed(r) / 60000);
      if (!r.pausedAt) { r.pausedAt = Date.now(); saveWorkLocal(); stopWorkTick(); }
      // Stopping early is a real decision — half a session is still work —
      // so it asks rather than guessing either way.
      openModal({
        title: "End this session?",
        body: mins >= 1
          ? `You focused for ${hm(mins)} of ${hm(r.len)}.`
          : "Less than a minute in — nothing to log yet.",
        buttons: [
          ...(mins >= 1 ? [{ label: `Log ${hm(mins)}`, kind: "go", run: async () => {
              w.run = null; saveWorkLocal();
              const res = await logWork(r.id, mins, r.startedAt, r.date, r.label, r.task);
              state.msg = res.error ? "Session saved on this phone. It will upload by itself."
                                    : `Session logged · ${hm(mins)}.`;
              state.msgKind = "ok"; render();
            } }] : []),
          { label: "Discard", kind: "bad", run: () => { w.run = null; saveWorkLocal(); render(); } },
          { label: "Keep going", kind: "quiet", run: () => {
              r.pausedMs += Date.now() - r.pausedAt; r.pausedAt = null; saveWorkLocal(); render();
            } },
        ],
      });
    });
    on("workFold", "click", () => { w.sessOpen = !w.sessOpen; render(); });
    on("workTotal", "click", () => {
      w.editTotal = true; render();
      const f = document.getElementById("workTotalIn");
      if (f) { f.focus(); f.select(); }
    });
    const commitTotal = async (el) => {
      if (!w.editTotal) return;
      w.editTotal = false;
      const v = parseMinutes(el.value);
      if (v === null) { render(); return; }
      const today = entryDay() === todayISO();
      const res = await call("app_log", { p_code: state.code, p_person: state.meId,
        p_value: v, p_metric: "work_min", p_date: today ? null : entryDay(), p_tz: deviceTZ() });
      state.msg = res.error ? res.error : null;
      state.msgKind = res.error ? "bad" : null;
      await loadHistory();
      await refresh();
    };
    on("workTotalIn", "keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commitTotal(e.target); }
      if (e.key === "Escape") { w.editTotal = false; render(); }
    });
    on("workTotalIn", "blur", (e) => { const el = e.target;
      setTimeout(() => { if (el.isConnected) commitTotal(el); }, 0); });
    on("workUntype", "click", async () => {
      await call("app_unlog", { p_code: state.code, p_person: state.meId,
        p_metric: "work_min", p_date: todayISO() });
      await loadHistory(); await refresh();
    });
    document.querySelectorAll("[data-wdel]").forEach((el) =>
      el.addEventListener("click", async () => {
        await call("app_work_delete", { p_code: state.code, p_person: state.meId,
          p_id: el.dataset.wdel });
        await loadWorkSessions(); await loadHistory(); await refresh();
      }));
  }

  function metricView() {
    const k = state.seg;
    const met = M[k];

    const unitRow = k === "steps" ? "" : `
      <div class="unitrow">
        <span>Show ${k === "cardio" ? "distance" : "weight"} in</span>
        <div class="range" role="group" aria-label="${
          k === "cardio" ? "Distance unit" : "Weight unit"}">${
          (k === "cardio" ? ["mi","km","m"] : ["lb","kg"]).map((u) =>
            `<button type="button" data-${k === "cardio" ? "d" : "w"}unit="${u}"
              aria-pressed="${(k === "cardio" ? units.d : units.w) === u}">${u}</button>`
          ).join("")}</div>
      </div>`;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <h1>${esc(met.label)}</h1>
        <p class="sub">${esc(PAGE[k].sub)}</p>
      </header>

      ${resumeBanner()}
      ${(k === "train" || k === "cardio") && state.lift.msg && !state.lift.active
        ? `<p class="flash" role="status">${esc(state.lift.msg)}</p>` : ""}
      ${(k === "train" || k === "cardio") ? firstCard(k) : ""}
      ${k === "work" ? workCard() : logCard(k)}
      ${editRowHTML()}
      <!-- V2.6. The graph lives in a slot of its own so a wheel save can
           repaint it WITHOUT rebuilding the card above it. Re-rendering
           the whole page under a finger that is still scrolling is what
           made the time wheel feel stuck. -->
      <div id="graphSlot">${graphCard(k)}</div>

      ${!(k === "train" || k === "cardio") ? "" : `
        <button class="${isFirst() ? "btn-quiet firstempty" : "btn"}" id="startEmpty"
                style="width:100%;margin-top:${isFirst() ? 10 : 22}px;${isFirst() ? "" : `background:${met.color}`}">
          ${k === "cardio" ? "Start an Empty Activity" : "Start an Empty Workout"}</button>
        ${liftTiles()}
        ${unitRow}
        ${liftHistory()}`}

      ${famBlock()}

      <p class="ver">v${APP_VERSION}</p>`;
  }

  function notConfigured() {
    return `
      <header class="masthead">
        <p class="eyebrow">Setup incomplete</p>
        <h1>Two settings missing</h1>
      </header>
      <div class="banner">
        This page has not been given its database address yet. Open
        <code>index.html</code>, and near the top replace
        <code>__SUPABASE_URL__</code> and <code>__SUPABASE_ANON_KEY__</code> with the
        Project URL and the <b>anon</b> key from Supabase &rarr; Project Settings &rarr; API.
      </div>`;
  }

  /* ---------- render + events -------------------------------------- */
  function render() {
    if (!configured) { app.innerHTML = notConfigured(); return; }
    if (state.fatal) {
      // Keep the join code on the retry link. Losing it was how a blip
      // turned into "set the whole thing up again".
      app.innerHTML = `<div class="banner">${esc(state.fatal)}</div>
        <p style="margin-top:16px"><a href="${location.pathname}?g=${
          encodeURIComponent(state.code || "")}">Try again</a>
        &nbsp;&middot;&nbsp;
        <a href="${location.pathname}" style="color:var(--muted)">Start over</a></p>`;
      return;
    }
    if (!(state.code && state.group)) { app.innerHTML = landing(); wire(); return; }
    // Two strips that can appear on any screen, so they live here rather
    // than in whichever view happened to need them first.
    const netBar = (state.net === "offline"
      ? `<div class="netbar" role="status">Offline \u00b7 showing the last numbers loaded
           <button type="button" id="netRetry">Retry</button></div>` : "")
      + (state.undo
      ? `<div class="undobar" role="status"><span>${esc(state.undo.words)}</span>
           <button type="button" id="undoStamp">Undo</button></div>` : "");

    // V3.4 BUG FIX. A re-render used to throw away whatever was being
    // typed. The server answering a save, or coming back from the Health
    // app to copy a step count, repaints the page; the standard you were
    // typing reverted to the old one, the keyboard dropped, and Save then
    // saved the old number. Whatever input had focus keeps its text, its
    // cursor and its focus across the repaint.
    const ae = document.activeElement;
    const keep = ae && ae.id && app.contains(ae) && /^(INPUT|TEXTAREA)$/.test(ae.tagName)
      && ae.type !== "time"
      ? { id: ae.id, v: ae.value, dirty: ae.value !== ae.defaultValue,
          s: ae.selectionStart, e: ae.selectionEnd } : null;

    const bar = "";
    const v = state.view;
    if (v === "sleep")         { app.innerHTML = netBar + sleepView() + bar;  wireExercise(); wireGo(); }
    else if (v === "tasks")    { app.innerHTML = netBar + tasksView() + bar;  wireTasks();    wireGo(); }
    else if (v === "goals")    { app.innerHTML = netBar + goalsView() + bar;  wireGoals();    wireGo(); }
    else if (v === "exercise") { app.innerHTML = netBar + metricView() + bar; wireExercise(); wireGo(); }
    else if (v === "session")  { app.innerHTML = netBar + sessionView();  wireLift(); }
    else if (v === "detail")   { app.innerHTML = netBar + detailView();   wireLift(); }
    else {
      app.innerHTML = netBar + boardView() + bar;
      wire();
      wireHome(); wireGo();
    }
    wireNet();
    // One sheet for every standard and one for the home dials, on any page.
    if (v !== "session" && v !== "detail") {
      app.insertAdjacentHTML("beforeend", stdSheet() + dialSheet());
      wireStd();
    }

    if (keep) {
      const el = document.getElementById(keep.id);
      if (el && el !== document.activeElement && /^(INPUT|TEXTAREA)$/.test(el.tagName)) {
        restoring = true;
        try {
          el.focus({ preventScroll: true });
          if (keep.dirty) el.value = keep.v;
          try { el.setSelectionRange(keep.s, keep.e); } catch {}
        } finally { restoring = false; }
      }
    }
  }
  // True only while render() puts focus back where it was, so focus
  // handlers that select-all or reload a value leave the typing alone.
  let restoring = false;


  /* ---------- everything inside the graph slot -------------------------
     V2.6. Pulled out of the one big wiring pass so the slot can be
     repainted on its own. A time wheel save needs the graph to catch up
     without the card above it being rebuilt, and rebuilding the card was
     what made the wheel stick.
     ------------------------------------------------------------------ */
  // Stepping weeks moves the selection with it. Otherwise the sheet under
  // the chart would still say "Today" while you are looking at a week that
  // does not contain today, and you would log into a bar you cannot see.
  const stepWeek = async (n) => {
    state.weekAnchor = shiftISO(weekBounds().start, n * 7);
    if (state.weekAnchor === thisMonday()) state.weekAnchor = null;
    state.entryDate = state.weekAnchor ? shiftISO(state.weekAnchor, 6) : null;
    state.msg = null;
    await loadHistory();
    render();
  };
  on("wPrev", "click", () => stepWeek(-1));
  on("wNext", "click", () => stepWeek(1));

  // A month at a time. The selection moves with it, like the week does,
  // so the log box never points at a day the grid isn't showing.
  const stepMonth = async (n) => {
    const d = new Date(monthBounds().first + "T00:00:00Z");
    const first = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1))
      .toISOString().slice(0, 10);
    if (first > monthOf(todayISO())) return;
    state.monthAnchor = first === monthOf(todayISO()) ? null : first;
    const b = monthBounds();
    state.entryDate = state.monthAnchor ? b.last : null;
    state.msg = null;
    render();
    await loadMonth();
    render();
  };
  on("mPrev", "click", () => stepMonth(-1));
  on("mNext", "click", () => stepMonth(1));

  function wireGraph() {
    on("trendFold", "click", async () => {
      const open = !trendOpen();
      try { localStorage.setItem("fhd.trend", open ? "open" : "shut"); } catch {}
      render();
      if (open && state.range === "month" && !monthData(state.seg)) { await loadMonth(); render(); }
    });
    if (state.range === "week") wireChart(state.seg);

    // Week or month. The month is fetched once per metric, on first ask.
    document.querySelectorAll("[data-range]").forEach((el) =>
      el.addEventListener("click", async () => {
        const v = el.dataset.range;
        if (v === state.range) return;
        state.range = v;
        try { localStorage.setItem("fhd.range", v); } catch {}
        render();
        if (v === "month" && !monthData(state.seg)) { await loadMonth(); render(); }
      }));

    // Every cell is a day, and tapping one does exactly what tapping the
    // bar for that day does — including opening the workout behind it on
    // Train and Cardio, which the month grid never used to.
    document.querySelectorAll(".gcell[data-day]").forEach((el) =>
      el.addEventListener("click", () => pickDay(state.seg, el.dataset.day)));

    on("wPrev", "click", () => stepWeek(-1));
    on("wNext", "click", () => stepWeek(1));
    on("mPrev", "click", () => stepMonth(-1));
    on("mNext", "click", () => stepMonth(1));
  }

  /* ---------- what tapping a day means --------------------------------
     V2.7. Two bugs lived here, both from one line: `k !== "steps"` meant
     "open the workout". That was written when Steps, Train and Cardio
     were the only charts. Sleep Score, Rest and Rise arrived later and
     fell into the workout branch, so tapping Tuesday on the Rest chart
     opened Tuesday's WORKOUT. Meanwhile the month grid never opened
     anything, on any metric.

     Now the rule is named rather than inferred: only Train and Cardio
     have a workout behind a day. Everything else selects the day on the
     page you are already on, which is what you asked the chart.
     ------------------------------------------------------------------ */
  const HAS_SESSION = { train: true, cardio: true };

  async function pickDay(k, iso) {
    // Selecting the day comes first either way, so coming back from a
    // session the log box is already pointed at the right day.
    state.entryDate = iso === todayISO() ? null : iso;
    state.msg = null;

    if (!HAS_SESSION[k]) {
      render();
      document.getElementById("steps")?.focus();
      return;
    }

    const got = await call("app_lift_detail", {
      p_code: state.code, p_person: state.meId, p_date: iso,
      p_mode: k === "cardio" ? "cardio" : "lift" });
    const sess = got && got.session;
    if (sess) {
      state.lift.detail = sess;
      state.lift.from = "exercise";
      state.view = "detail";
      render();
      return;
    }
    // V1.7. An empty bar is not a dead end any more. It is how you record
    // a workout you did but did not log — the same gesture that backlogs
    // a step count one page over.
    state.mode = k === "cardio" ? "cardio" : "lift";
    await startSession("", iso);
  }

  function wireChart(k) {
    const host = document.getElementById("chart-" + k);
    const svg = host && host.querySelector("svg");
    if (!svg) return;
    const n = points(k).length;

    // Two bars, two verbs. Tapping a Steps bar backlogs that day, which
    // is what you can still type. Tapping a Train bar opens the workout
    // behind it, because nobody types train minutes any more — and if
    // there is no workout, it offers to log one for that day.
    svg.addEventListener("click", async (e) => {
      const iso = e.target && e.target.dataset ? e.target.dataset.day : null;
      if (!iso) return;
      await pickDay(k, iso);
    });

  }

  function openEditor(kind, personId) {
    state.editing = kind;
    state.editDraft = null;
    state.editPerson = personId || state.meId;
    state.adding = false;
    render();
    const f = document.getElementById(kind === "goal" ? "stdVal" : "editVal");
    if (f) { f.focus(); if (f.type !== "time") f.select(); }
  }

  /* ---------- V3.4: the standard sheet ---------------------------------
     One card for every activity's standard, opened from any "of …" on any
     page or dial. It floats near the top so the keyboard never covers it.
     What you type lives in state, so nothing the page does behind it can
     put the old number back.
     ------------------------------------------------------------------ */
  function stdSheet() {
    if (state.editing !== "goal" || !STD[state.editMetric]) return "";
    const k = state.editMetric, S = STD[k], m = me() || {};
    const cur = k === "rise" || k === "rest"
      ? (hasTarget(m, k) ? target(m, k) : S.def) : stdOf(m, k);
    const seed = state.editDraft !== null && state.editDraft !== undefined ? state.editDraft
      : S.kind === "time" ? clockInput(cur) : S.kind === "min" ? hm(cur).replace(/ /g, " ") : String(Math.round(cur));
    const hint = { count: k === "tasks" ? "Tasks to finish each day." : "Steps each day.",
                   min: "Minutes each day. 45, 1:30 or 1h 30m all work.",
                   pct: k === "goals" ? "The share of the week's tactics that wins the week."
                                      : "The share of the sleep pyramid to hold each night.",
                   time: k === "rest" ? "In bed by this time." : "Up by this time." }[S.kind];
    return `
      <div class="sheetbg" id="stdBg"></div>
      <div class="stdsheet" role="dialog" aria-label="${esc(S.label)} standard">
        <p class="eyebrow">Your daily standard</p>
        <h3>${esc(S.label)}</h3>
        <div class="stdrow">
          <input id="stdVal" class="stdin" autocomplete="off" enterkeyhint="done"
            ${S.kind === "time" ? 'type="time"' : S.kind === "min" ? 'type="text" inputmode="text"'
              : 'type="text" inputmode="numeric" pattern="[0-9]*"'}
            value="${esc(seed)}" aria-label="${esc(S.label)} standard">
          ${S.kind === "pct" ? `<span class="stdu">%</span>` : S.kind === "count" ? `<span class="stdu">${esc(S.unit || "")}</span>` : ""}
        </div>
        <p class="hint" id="stdHint">${esc(hint)}</p>
        <div class="stdbtns">
          <button type="button" class="btn-quiet" id="stdCancel">Cancel</button>
          <button type="button" class="btn" id="stdSave">Save</button>
        </div>
      </div>`;
  }
  function parseStd(k, raw) {
    const S = STD[k], t = String(raw || "").trim();
    if (S.kind === "time") {
      const [hh, mm] = t.split(":").map(Number);
      if (!t || Number.isNaN(hh)) return { err: "Pick a time." };
      let v = hh * 60 + (mm || 0);
      // A bedtime before 5am belongs to the evening, so it goes past 1440
      // exactly as a stamped Rest does.
      if (k === "rest" && hh < 5) v += 1440;
      return { v };
    }
    if (S.kind === "min") {
      const v = parseMinutes(t);
      return v && v > 0 && v <= 1440 ? { v } : { err: "Type minutes, like 45 or 1h 30m." };
    }
    const v = Number(t.replace(/[^0-9]/g, ""));
    if (!v) return { err: "Enter a number above zero." };
    if (S.kind === "pct" && v > 100) return { err: "A percent is 100 at most." };
    return { v };
  }
  async function saveStd() {
    const k = state.editMetric, f = document.getElementById("stdVal");
    const hint = document.getElementById("stdHint"), btn = document.getElementById("stdSave");
    const r = parseStd(k, f ? f.value : state.editDraft);
    if (r.err) { if (hint) { hint.textContent = r.err; hint.className = "hint bad"; } return; }
    if (btn) btn.disabled = true;
    const res = await call("app_set_goal", { p_code: state.code, p_person: state.meId,
      p_target: r.v, p_metric: STD[k].key });
    if (res.error) {
      const h = document.getElementById("stdHint");
      if (h) { h.textContent = res.offline ? "No signal. Try again in a moment." : res.error; h.className = "hint bad"; }
      const b = document.getElementById("stdSave"); if (b) b.disabled = false;
      return;
    }
    // Show it at once; the refresh confirms it.
    const m = me(); if (m) m[STD_FIELD[k]] = r.v;
    state.editing = null; state.editDraft = null;
    render();
    await refresh();
  }

  /* ---------- V3.4: choosing the three home dials ---------------------- */
  const DIAL_KEYS = Object.keys(STD);
  const okDials = (d) => Array.isArray(d) && d.length === 3 && new Set(d).size === 3 &&
    d.every((k) => STD[k]);
  function myDials() {
    const m = me();
    if (m && okDials(m.dials)) return m.dials.slice();
    try {
      const d = JSON.parse(localStorage.getItem("fhd.dials." + state.meId) || "null");
      if (okDials(d)) return d;
    } catch {}
    return DIAL_DEFAULT.slice();
  }
  function dialSheet() {
    const pick = state.dialPick;
    if (!pick) return "";
    const left = 3 - pick.length;
    return `
      <div class="sheetbg" id="dialBg"></div>
      <div class="stdsheet dpick" role="dialog" aria-label="Choose your three dials">
        <p class="eyebrow">Home screen</p>
        <h3>Your three dials</h3>
        <p class="hint" style="margin-top:4px">Tap three, in the order you want them.</p>
        ${STD_GROUPS.map(([g, ks]) => `
          <p class="dpg">${esc(g)}</p>
          <div class="dpgrid">${ks.map((k) => {
            const at = pick.indexOf(k);
            return `<button type="button" class="dpk${at >= 0 ? " on" : ""}" data-dpk="${k}" aria-pressed="${at >= 0}">
              <i>${at >= 0 ? at + 1 : ""}</i><span>${esc(STD[k].label)}</span></button>`;
          }).join("")}</div>`).join("")}
        <div class="stdbtns">
          <button type="button" class="btn-quiet" id="dialCancel">Cancel</button>
          <button type="button" class="btn" id="dialSave" ${left ? "disabled" : ""}>${
            left ? `Pick ${left} more` : "Save"}</button>
        </div>
      </div>`;
  }
  async function saveDials(d) {
    const m = me();
    if (m) m.dials = d.slice();
    try { localStorage.setItem("fhd.dials." + state.meId, JSON.stringify(d)); } catch {}
    state.dialPick = null; state.dialIdx = 0;
    render();
    await call("app_set_dials", { p_code: state.code, p_person: state.meId, p_dials: d });
  }

  // Every "of …" and every standard line, on every page, opens the sheet.
  function wireStd() {
    document.querySelectorAll('[data-edit="goal"]').forEach((el) =>
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const k = el.dataset.metric || "steps";
        if (!STD[k]) return;
        state.editMetric = k;
        openEditor("goal");
      }));
    on("stdCancel", "click", () => { state.editing = null; state.editDraft = null; render(); });
    on("stdBg", "click", () => { state.editing = null; state.editDraft = null; render(); });
    on("stdSave", "click", saveStd);
    on("stdVal", "input", (e) => { state.editDraft = e.target.value; });
    on("stdVal", "keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); saveStd(); }
      if (e.key === "Escape") { state.editing = null; state.editDraft = null; render(); }
    });

    on("dialEdit", "click", () => { state.dialPick = myDials(); render(); });
    on("dialCancel", "click", () => { state.dialPick = null; render(); });
    on("dialBg", "click", () => { state.dialPick = null; render(); });
    document.querySelectorAll("[data-dpk]").forEach((el) =>
      el.addEventListener("click", () => {
        const k = el.dataset.dpk, p = state.dialPick;
        const at = p.indexOf(k);
        if (at >= 0) p.splice(at, 1);
        else if (p.length < 3) p.push(k);
        else { p.pop(); p.push(k); }        // a fourth tap swaps out the last pick
        render();
      }));
    on("dialSave", "click", () => { if (okDials(state.dialPick)) saveDials(state.dialPick); });
  }

  function wireNet() {
    on("netRetry", "click", () => { retryIn = 0; setNet("ok"); render(); refresh(); });
    on("undoStamp", "click", async () => {
      const u = state.undo;
      if (!u) return;
      disarmUndo();
      await call("app_unlog", { p_code: state.code, p_person: state.meId,
                                p_metric: u.key, p_date: u.date });
      await loadHistory();
      await refresh();
    });
  }

  function on(id, ev, fn) {
    const el = document.getElementById(id);
    if (el) el.addEventListener(ev, fn);
  }

  function wire() {
    /* landing */
    on("open", "click", () => {
      const c = (document.getElementById("code").value || "").trim().toUpperCase();
      if (!c) { state.msg = "Enter the code your family sent you."; render(); return; }
      location.search = "?g=" + encodeURIComponent(c);
    });
    on("code", "keydown", (e) => { if (e.key === "Enter") document.getElementById("open").click(); });

    on("create", "click", async (e) => {
      const name = (document.getElementById("gname").value || "").trim();
      const tz = document.getElementById("gtz").value;
      if (!name) { state.msg = "Give the group a name."; render(); return; }
      e.target.disabled = true;
      const res = await call("app_create_group", { p_name: name, p_timezone: tz });
      if (res.error) { state.msg = res.error; e.target.disabled = false; render(); return; }
      location.search = "?g=" + res.code;
    });

    /* group */
    on("who", "change", async (e) => {
      saveMe(e.target.value);
      state.msg = null;
      await loadHistory();
      render();
    });

    on("addBtn", "click", () => { state.adding = !state.adding; state.editing = null; render();
      const el = document.getElementById("addName"); if (el) el.focus(); });

    on("addSave", "click", async (e) => {
      const name = (document.getElementById("addName").value || "").trim();
      const hint = document.getElementById("addHint");
      if (!name) { hint.textContent = "Type a name first."; return; }
      e.target.disabled = true;
      const res = await call("app_add_person", { p_code: state.code, p_name: name });
      if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      saveMe(res.id);
      state.adding = false;
      await refresh();
    });
    on("addName", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("addSave").click();
      if (e.key === "Escape") { state.adding = false; render(); }
    });



    // Walking the roster back a day. Today needs no call — app_state
    // already carries it — so only a past day costs a round trip.
    const stepBoard = async (n) => {
      const next = shiftISO(famDayISO(), n);
      if (next > familyISO()) return;
      if (next === familyISO()) {
        state.boardDay = null; state.boardCards = null; render(); return;
      }
      state.boardDay = next; state.boardBusy = true; render();
      const res = await call("app_board", { p_code: state.code, p_day: next });
      state.boardBusy = false;
      if (res.error || !res.people) {
        state.boardDay = null; state.boardCards = null;
        if (res.error) { state.msg = res.error; state.msgKind = "bad"; }
        render(); return;
      }
      state.boardCards = Object.fromEntries(res.people.map((r) => [r.id, r.board || {}]));
      render();
    };
    on("bPrev", "click", () => stepBoard(-1));
    on("bNext", "click", () => stepBoard(1));
    on("bToday", "click", () => { state.boardDay = null; state.boardCards = null; render(); });

    on("foldBoard", "click", () => {
      try { localStorage.setItem("fhd.board", boardOpen() ? "shut" : "open"); } catch {}
      render();
    });


    on("installNo", "click", () => {
      try { localStorage.setItem("fhd.install", "no"); } catch {}
      const el = document.getElementById("installHint");
      if (el) el.remove();
    });




    document.querySelectorAll('[data-edit="name"]').forEach((el) => {
      el.addEventListener("click", () => openEditor("name", el.dataset.person));
    });

    wireEditor();
    wireBoardActions();
  }

  function wireEditor() {
    on("editCancel", "click", () => { state.editing = null; state.editDraft = null; render(); });

    on("editSave", "click", async (e) => {
      const kind = state.editing;
      const raw = (document.getElementById("editVal").value || "").trim();
      const hint = document.getElementById("editHint");

      {
        if (!raw) { hint.textContent = "A name cannot be blank."; return; }
        e.target.disabled = true;
        const res = await call("app_rename_person", {
          p_code: state.code, p_person: state.editPerson || state.meId, p_name: raw,
        });
        if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      }
      state.editing = null; state.editDraft = null;
      await refresh();
    });
    on("editVal", "input", (e) => { state.editDraft = e.target.value; });

    on("editVal", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("editSave").click();
      if (e.key === "Escape") { state.editing = null; render(); }
    });
  }

  // Board-only: the pillar marks, the tap-through chips, the one button.
  function wireBoardActions() {
    // The chips ARE the navigation: one tap from a pillar row to the page
    // that records it. No tab bar, and no Log screen to outgrow.
    document.querySelectorAll("[data-tile]").forEach((el) =>
      el.addEventListener("click", () => openExercise(el.dataset.tile)));

    // Tap someone's volume chip to read the session behind it. The board
    // stays a scoreboard; the detail is one tap away for whoever wants it.
    document.querySelectorAll("[data-see]").forEach((el) => {
      el.addEventListener("click", async () => {
        const m = el.dataset.m;
        const res = await call("app_lift_detail", {
          p_code: state.code, p_person: el.dataset.see, p_mode: m });
        if (res.error || !res.session) return;
        state.mode = m;
        state.lift.detail = res.session;
        state.lift.from = "board";
        state.view = "detail";
        render();
      });
    });

    on("waShare", "click", () => {
      // WhatsApp's official click-to-chat link. No API, no cost, no bot:
      // it opens WhatsApp with the message written, and you pick the group.
      window.open("https://wa.me/?text=" + encodeURIComponent(dailyMessage()), "_blank");
    });
  }

  /* ---------- boot -------------------------------------------------- */
  (async () => {
    if (!configured) { render(); return; }
    if (!sb) {
      state.fatal = "Could not load the database library. Check your connection and reload.";
      render(); return;
    }
    if (state.code) {
      state.meId = loadMe();
      state.fam.open = famOpen();
      try {
        state.range = localStorage.getItem("fhd.range") === "month" ? "month" : "week";
        state.histOpen = localStorage.getItem("fhd.hist") === "open";
      } catch {}
      await refresh();
      watchClock();
      // A workout finished with no signal uploads itself the moment there
      // is one — on this load, and again whenever the phone reconnects.
      loadLocal();
      flushPending().then(() => { if (state.view === "board") render(); });
      window.addEventListener("online", () => {
        retryIn = 0;
        flushPending().then(() => { if (state.net === "offline") refresh();
                                    else if (state.view !== "session") render(); });
      });
    } else {
      render();
    }
  })();
})();
</script>
</body>
</html>
