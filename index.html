  /* ---------- the board: a glance, not a dashboard -------------------
     V1.5 moved the entry box, the charts, the stats and the week arrows
     into Exercise. What is left is who you are, what the five pillars say
     about your day, the family, and one button. Everything else is one
     tap in, which is the only shape that still reads when there are five
     pillars instead of one.
     ------------------------------------------------------------------ */

  // Did this person record ANYTHING today? Deliberately not `done`.
  //
  // `done` is the bar: the step goal met, or a workout, or cardio. It still
  // drives the roster's "moved" mark and the execution percentage, because
  // a rate that counts 400 steps as a win measures nothing.
  //
  // The green circle is the other question — did you show up — and it is
  // the one the board should answer, because logging is the habit being
  // built and punishing a 4,000-step day with a grey dot teaches people to
  // stop opening the app.
  const anyLog = (p) => val(p,"steps") > 0 || val(p,"train") > 0 || val(p,"cardio") > 0;

  // Undo lives for six seconds after a stamp: long enough to notice a
  // mis-tap, short enough not to sit on the screen as clutter.
  let undoTimer = null;
  function armUndo(u) {
    state.undo = u;
    if (undoTimer) clearTimeout(undoTimer);
    undoTimer = setTimeout(() => { state.undo = null; if (state.view === "board") render(); }, 6000);
  }
  function disarmUndo() {
    state.undo = null;
    if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
  }


  /* ---------- the pillars, as rows ------------------------------------
     V2.1. Each live pillar is ONE ROW: a status circle, its name, and its
     chips on the same line. A row is the unit that scales — Sleep arrived
     as a second row without touching the first, and Meditate, Diet and
     Great Work will each arrive the same way. Until then they share one
     quiet line, so the five-pillar shape stays on screen without three
     rows of nothing.

     A chip is value on top, tiny label below. Outline when empty, filled
     when logged. Small enough for three beside a name on a phone, large
     enough (44px) to hit with a thumb.
     ------------------------------------------------------------------ */
  const shortNum = (v) => v >= 10000 ? (v / 1000).toFixed(1).replace(/\.0$/, "") + "k"
                        : v >= 1000  ? (v / 1000).toFixed(1).replace(/\.0$/, "") + "k"
                        : String(Math.round(v));

  // Minutes after midnight -> "10:40p". Values past 1440 are after-midnight
  // bedtimes stored on the evening's date, so they wrap.
  function clockWords(min) {
    if (min === null || min === undefined || min === "") return "";
    const m = ((Math.round(Number(min)) % 1440) + 1440) % 1440;
    const h = Math.floor(m / 60), mm = m % 60;
    const h12 = ((h + 11) % 12) + 1;
    return `${h12}:${pad(mm)}${h < 12 ? "a" : "p"}`;
  }
  const clockInput = (min) => {
    const m = ((Math.round(Number(min)) % 1440) + 1440) % 1440;
    return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  };


  // Which date a sleep entry belongs to. Rest and the habits are filed
  // against the NIGHT, which the server works out under the 5am rule and
  // hands back as rest_day; Rise is filed against the clock date.
  function nightDay(k) {
    if (state.entryDate) return state.entryDate;
    const m = me() || {};
    return (M[k] && M[k].night) ? (m.rest_day || todayISO()) : (m.their_date || todayISO());
  }

  const sleepAny = (p) => ["sleep","rise","rest"].some((k) => hasVal(p, k));

  function markRow(p, clickable) {
    const exOn = anyLog(p);
    const slOn = sleepAny(p);

    // V2.1b. Steps reads as a SCORE here: what you walked against what
    // you set out to walk. The count itself is one tap away, on the page
    // where you type it — a percentage is the comparable number, a raw
    // count is the editable one, and the two screens want different things.
    const sGoal = target(p, "steps");
    const exChips = [
      { k:"steps",  label:"Step Score",  v: val(p,"steps"),
        w: (v) => sGoal ? Math.round(v / sGoal * 100) + "%" : shortNum(v) },
      { k:"train",  label:"Train",  v: val(p,"train"),  w: (v) => Math.round(v) + "m" },
      { k:"cardio", label:"Cardio", v: val(p,"cardio"), w: (v) => Math.round(v) + "m" },
    ].map((c) => {
      const inner = `<b>${c.v > 0 ? c.w(c.v) : "–"}</b><span>${c.label}</span>`;
      return clickable
        ? `<button type="button" class="chip${c.v > 0 ? " on" : ""}" data-tile="${c.k}"
             aria-label="${c.label}: ${c.v > 0 ? c.w(c.v) : "nothing yet"}">${inner}</button>`
        : `<span class="chip${c.v > 0 ? " on" : ""}">${inner}</span>`;
    }).join("");

    // V2.1b. Sleep Score, Rise, Rest — each a door to its own page, the
    // same as the Exercise three. Last Meal is no longer a chip of its
    // own; it is the first of the twelve habits behind Sleep Score.
    const slChips = [
      { k:"sleep", label:"Sleep Score" }, { k:"rise", label:"Rise" }, { k:"rest", label:"Rest" },
    ].map((c) => {
      const on = hasVal(p, c.k);
      const words = !on ? "\u2013"
        : c.k === "sleep" ? scorePct(p.items) + "%" : clockWords(rawVal(p, c.k));
      const inner = `<b>${words}</b><span>${c.label}</span>`;
      return clickable
        ? `<button type="button" class="chip${on ? " on" : ""}" data-tile="${c.k}"
             aria-label="${c.label}: ${on ? words : "nothing yet"}">${inner}</button>`
        : `<span class="chip${on ? " on" : ""}">${inner}</span>`;
    }).join("");

    const quiet = PILLARS.filter((pl) => !pl.live && pl.key !== "sleep").map((pl) => pl.label);

    return `
      <div class="prow${exOn ? " done" : ""}">
        <span class="pdot" aria-hidden="true">✓</span>
        <span class="pname">Exercise</span>
        <div class="chips">${exChips}</div>
      </div>
      <div class="prow${slOn ? " done" : ""}">
        <span class="pdot" aria-hidden="true">✓</span>
        <span class="pname">Sleep</span>
        <div class="chips">${slChips}</div>
      </div>
      <p class="soon">${quiet.map(esc).join(" · ")}<em>soon</em></p>`;
  }

  // One editor, two screens: names are edited on the board, goals on
  // Exercise. Rendering it in only one place is how tapping a goal used to
  // open nothing at all.
  function editRowHTML() {
    if (!state.editing) return "";
    return `
      <div class="addrow" id="editRow">
        <input class="field" id="editVal" maxlength="40" autocomplete="off"
               ${state.editing === "name" ? ""
                 : M[state.editMetric] && M[state.editMetric].time ? 'type="time"'
                 : 'type="number" inputmode="numeric"'}
               value="${editSeed()}"
               aria-label="${state.editing === "name" ? "Name" : "Daily goal"}">
        <button class="btn" id="editSave">Save</button>
        <button class="btn-quiet" id="editCancel">Cancel</button>
        <p class="hint" id="editHint" style="flex-basis:100%;margin-top:0">${editHintText()}</p>
      </div>`;
  }

  function boardView() {
    const m = me();
    // The family's day, not anyone's own: see board() above.
    const logged = state.people.filter(banyLog).length;
    const moved  = state.people.filter(bdone).length;

    const whoOptions = state.people.length === 0
      ? `<option value="">nobody yet</option>`
      : (!state.meId ? `<option value="">choose your name</option>` : "") +
        state.people.map((p) =>
          `<option value="${p.id}"${p.id === state.meId ? " selected" : ""}>${esc(p.name)}</option>`).join("");

    const mine = m ? `
      <section class="card mine">
        <div class="section-head">
          <h2>${esc(m.name)}</h2>
          <span class="eyebrow">${m.streak > 0 ? m.streak + "-day streak" : "today"}</span>
        </div>
        ${markRow(m, true)}
      </section>` : `
      <div class="dashed"><p class="note">Pick your name above, or add it,
        and your day appears here.</p></div>`;

    const roster = state.people.length === 0
      ? `<div class="dashed"><p class="note">Nobody has been added yet.
           Add the first name above.</p></div>`
      : `<div class="roster">${state.people.map((p) => {
          const v = bval(p, "steps"), t = target(p, "steps");
          const bd = board(p);
          // V2.3. This used to read "10:30p–5:30a", which looked like a
          // night's sleep and was not one. Both numbers belong to the same
          // CALENDAR day: the 5:30a is the morning that ended the night
          // before, the 10:30p is the start of the night to come. Writing
          // them as a range claims a duration nobody measured.
          // Two facts, labelled, in the order they happened.
          const has = (k) => bd[k] !== null && bd[k] !== undefined;
          const sleepLine = [
            has("rise") ? `rise ${clockWords(bd.rise)}` : "",
            has("rest") ? `rest ${clockWords(bd.rest)}` : "",
            has("meal") ? `meal ${clockWords(bd.meal)}` : "",
          ].filter(Boolean).join(" \u00b7 ");
          const initials = p.name.trim().split(/\s+/).slice(0,2)
            .map((w) => (w[0] || "").toUpperCase()).join("");
          const isMe = p.id === state.meId;
          return `<div class="person${bdone(p) ? " did" : ""}">
            <span class="dot" aria-hidden="true"
              style="background:color-mix(in oklab, hsl(${p.hue} 62% 48%) 16%, var(--surface));
                     color:color-mix(in oklab, hsl(${p.hue} 62% 48%) 78%, var(--ink))"
              >${esc(initials)}</span>
            <div class="who">
              <div class="name">
                <button class="tapedit" data-edit="name" data-person="${p.id}"
                  >${esc(p.name)}</button>
                ${isMe ? "<em>you</em>" : ""}
                ${p.streak > 1 ? `<em>${p.streak}d</em>` : ""}
              </div>
              <div class="sub2">${[
                  bval(p,"train") > 0 ? `<button class="liftchip" data-see="${p.id}" data-m="lift"
                     aria-label="See ${esc(p.name)}'s workout">${bval(p,"train")}m train</button>` : "",
                  Number(bd.cardio_distance) > 0 || bval(p,"cardio") > 0
                    ? `<button class="liftchip cardio" data-see="${p.id}" data-m="cardio"
                     aria-label="See ${esc(p.name)}'s cardio">${bval(p,"cardio")}m${
                       Number(bd.cardio_distance) > 0 ? " \u00b7 " + esc(distWords(bd.cardio_distance)) : ""
                     }</button>` : "",
                ].filter(Boolean).join(" ") || "&nbsp;"}</div>
              ${sleepLine ? `<div class="sleepline">${esc(sleepLine)}</div>` : ""}
            </div>
            <div class="num"><b>${v > 0 ? num(v) : "&mdash;"}</b>
              <span class="${bdone(p) ? "met" : ""}">${
                bdone(p) ? "\u2713 moved" : v > 0 ? "of " + num(t) : "nothing yet"}</span></div>
          </div>`;
        }).join("")}</div>`;

    return `
      <header class="masthead">
        <h1>${esc(state.group.name)}</h1>
        <p class="sub">${esc(new Date(familyISO() + "T00:00:00Z").toLocaleDateString(undefined,
          { timeZone:"UTC", weekday:"long", month:"long", day:"numeric" }))}</p>
      </header>

      <div class="whoami">
        <span class="label">I am</span>
        <select id="who" aria-label="Which family member are you"
          ${state.people.length === 0 ? "disabled" : ""}>${whoOptions}</select>
        <button class="linkbtn" id="addBtn">${state.adding ? "Never mind" : "Add someone"}</button>
      </div>

      ${editRowHTML()}

      <div class="addrow" id="addRow" ${state.adding ? "" : "hidden"}>
        <input class="field" id="addName" placeholder="Their name" maxlength="40"
               autocomplete="off" aria-label="Name of the person to add">
        <button class="btn" id="addSave">Add</button>
        <p class="hint" id="addHint" style="flex-basis:100%;margin-top:0"></p>
      </div>

      ${installHint()}
      ${mine}

      <section>
        <div class="section-head">
          <button class="foldbtn" id="foldBoard" aria-expanded="${boardOpen()}">
            <span class="caret">${boardOpen() ? "\u25be" : "\u25b8"}</span>
            <h2>The family today</h2></button>
          <span class="eyebrow">${state.people.length
            ? `${logged}/${state.people.length} logged \u00b7 ${moved} moved` : ""}</span>
        </div>
        ${boardOpen() ? roster : ""}
      </section>

      <button class="btn" id="waShare" style="width:100%">Post today to WhatsApp</button>

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- Exercise: one pillar, three numbers ---------------------
     This screen absorbed both logger homes. A single segment picks which
     number you are looking at AND which log sits underneath it, so
     starting a workout is still three taps and there is no tab bar to
     outgrow when the other four pillars arrive.
     ------------------------------------------------------------------ */


  /* ---------- one page per metric --------------------------------------
     V1.7. Steps, Train and Cardio are three pages built from one template,
     each one tap from home. The V1.6 overview screen that used to sit in
     front of them is deleted: it held a number you can see on the tile, a
     score that moved to the category header, and two pills the tiles
     replaced.

     Top to bottom, every page is the same shape, so learning one teaches
     all three: today's number, the week as seven tappable bars, the thing
     that records it, then the family behind a fold.
     ------------------------------------------------------------------ */

  const PAGE = {
    steps:  { sub:"The keystone. One number a day.", verb:"steps" },
    train:  { sub:"Lifting and yoga.",               verb:"minutes" },
    cardio: { sub:"Walking, running, swimming, the machines.", verb:"minutes" },
    rest:   { sub:"What time you actually went to bed.",       verb:"time" },
    rise:   { sub:"What time you actually got up.",            verb:"time" },
    sleep:  { sub:"Twelve things that decide how well you sleep.", verb:"%" },
  };

  /* ---------- the log box ---------------------------------------------
     V1.7b splits recording from reviewing. This box records: it carries
     its own date, its own number and nothing else. The graph below it is
     for looking at, and the two no longer share a card and confuse which
     of them you are touching.

     All three metrics are typed now. Train and Cardio still have the
     logger, and a workout still writes the minutes — but a number you
     type outranks it, permanently, for that day. One sentence, no marks
     to decode: what you typed is what the day says.
     ------------------------------------------------------------------ */
  function logCard(k) {
    const met = M[k];
    const m   = me() || {};
    const iso = entryDay();
    const rec = dayRecord(k);
    const isToday = iso === todayISO();
    const goal = target(m, k);
    if (met.time) return timeCard(k, iso, isToday, m, rec, goal);
    const shown = isToday ? val(m, k) : rec.value;
    const has = isToday ? (k === "steps" ? !!m.steps_logged : shown > 0) : rec.logged;

    // V2.1. The number IS the input. Tap it and the keyboard comes up with
    // the digits selected; leave it and it saves. There is no second box
    // to find and no button to press, which on an iPhone numeric keypad —
    // it has no return key — was always one more thing to hunt for.
    return `
      <section class="card">
        <div class="daynav">
          <button type="button" id="dPrev" aria-label="Previous day">&lsaquo;</button>
          <span>${isToday ? "Today" : esc(fullDate(iso))}</span>
          <button type="button" id="dNext" aria-label="Next day"
            ${isToday ? "disabled" : ""}>&rsaquo;</button>
        </div>

        <div class="domino" style="padding-top:10px">
          <input class="bigedit" id="steps" type="text" inputmode="numeric"
                 pattern="[0-9]*" autocomplete="off" enterkeyhint="done"
                 style="color:${met.color}"
                 value="${has ? num(Math.round(shown)) : ""}" placeholder="0"
                 data-raw="${has ? Math.round(shown) : ""}"
                 aria-label="${esc(met.label)} on ${isToday ? "today" : esc(fullDate(iso))}, tap to edit">
          <button type="button" class="of" data-edit="goal" data-metric="${k}">${goal
            ? `of <b>${num(Math.round(goal))}</b> ${met.unit}`
            : `set a ${esc(met.label.toLowerCase())} target`}</button>
        </div>

        <p class="hint dshint ${state.msgKind || ""}" id="hint"
           style="text-align:center">${state.msg ? esc(state.msg)
          : has ? "Tap the number to change it."
                : `Tap the number to log ${isToday ? "today" : "this day"}.`}</p>
      </section>`;
  }

  /* ---------- a time, not an amount -----------------------------------
     Rest and Rise are clock readings. The big figure is still the input:
     a native time wheel sits invisibly over it, so one tap edits it the
     same way one tap edits the step count. The button under it stamps
     right now, for the mornings and nights when you are holding the phone
     anyway and do not want to spin a wheel.
     ------------------------------------------------------------------ */
  function timeCard(k, iso, isToday, m, rec, goal) {
    const met = M[k];
    const v = isToday ? rawVal(m, k) : (rec.logged ? rec.value : null);
    const has = v !== null && v !== undefined;
    return `
      <section class="card">
        <div class="daynav">
          <button type="button" id="dPrev" aria-label="Previous day">&lsaquo;</button>
          <span>${isToday ? (met.night ? "Tonight" : "Today") : esc(fullDate(iso))}</span>
          <button type="button" id="dNext" aria-label="Next day"
            ${isToday ? "disabled" : ""}>&rsaquo;</button>
        </div>

        ${(() => {
          // V2.5. Three columns you scroll, snapping to the value in the
          // middle band. Built here rather than handed to the OS: the
          // native wheel is the thing that was finicky, and a page of our
          // own behaves the same on every phone. The minute column is
          // every minute, not every five, so a stamped 10:42p is never
          // quietly rounded away the first time the card is opened.
          const base = has ? v : (hasTarget(m, k) ? goal : (met.night ? 22 * 60 : 7 * 60));
          const b = ((Math.round(base) % 1440) + 1440) % 1440;
          const h24 = Math.floor(b / 60);
          const sel = { h: ((h24 + 11) % 12), m: b % 60, ap: h24 >= 12 ? 1 : 0 };
          const col = (name, items, at, label) => `
            <div class="wcol" data-wheel="${name}" role="listbox"
                 aria-label="${label}" tabindex="0" data-at="${at}">
              <div class="wpad"></div>
              ${items.map((t, i) => `<div class="witem" data-i="${i}"
                 role="option" aria-selected="${i === at}">${t}</div>`).join("")}
              <div class="wpad"></div>
            </div>`;
          return `
        <div class="domino" style="padding-top:6px">
          <div class="wheel${has ? "" : " unset"}" style="color:${met.color}">
            ${col("h", Array.from({length:12}, (_, i) => i + 1), sel.h, "Hour")}
            <span class="wsep">:</span>
            ${col("m", Array.from({length:60}, (_, i) => pad(i)), sel.m, "Minute")}
            ${col("ap", ["AM","PM"], sel.ap, "Morning or evening")}
            <div class="wband" aria-hidden="true"></div>
          </div>
          <button type="button" class="of" data-edit="goal" data-metric="${k}">${
            hasTarget(m, k) ? `target <b>${clockWords(goal)}</b>`
                            : `set a ${esc(met.label.toLowerCase())} target`}</button>
        </div>`; })()}

        <button class="btn" id="stampNow"
                style="width:100%;margin-top:12px;background:${met.color}">${
          has ? "Set to now" : `${esc(met.label)} \u2014 now`}</button>

        <p class="hint dshint ${state.msgKind || ""}" id="hint"
           style="text-align:center">${state.msg ? esc(state.msg)
          : has ? "Scroll to change it."
                : "Nothing recorded yet \u2014 scroll to set it, or use the button."}</p>
      </section>`;
  }

  // What the week adds up to — which is not a sum for every metric. Adding
  // up seven percentages gives 700, and adding up seven bedtimes gives a
  // number of minutes nobody has a use for. Those average instead.
  function weekWords2(k) {
    const met = M[k] || {};
    const pts = points(k).filter((p) => met.time || met.bits ? p.logged : true);
    if (!pts.length) return "nothing logged this week";
    const sum = pts.reduce((t, p) => t + p.value, 0);
    if (met.bits) return `${Math.round(sum / pts.length)}% average this week`;
    if (met.time) return `${clockWords(Math.round(sum / pts.length))} average this week`;
    return `${num(Math.round(sum))} ${met.unit} this week`;
  }

  function graphCard(k) {
    const met = M[k];
    const month = state.range === "month";
    const mb = monthBounds();

    // V2.1. The period control sits at the TOP of the graph, mirroring the
    // day control at the top of the log box: two cards, the same shape,
    // each saying first which slice of time it is showing.
    return `
      <section>
        <div class="section-head">
          <h2>Trend</h2>
          <div class="rangetog" role="group" aria-label="How much to show">
            ${[["week","Week"],["month","Month"]].map(([v, l]) =>
              `<button type="button" data-range="${v}"
                aria-pressed="${state.range === v}">${l}</button>`).join("")}
          </div>
        </div>
        <div class="card">
          ${month ? `
            <div class="daynav">
              <button type="button" id="mPrev" aria-label="Previous month">&lsaquo;</button>
              <span class="wlab">${esc(monthWords(mb.first))}</span>
              <button type="button" id="mNext" aria-label="Next month"
                ${mb.first === monthOf(todayISO()) ? "disabled" : ""}>&rsaquo;</button>
            </div>
            ${monthGrid(k)}` : `
            <div class="daynav">
              <button type="button" id="wPrev" aria-label="Previous week">&lsaquo;</button>
              <span class="wlab">${esc(weekWords())}</span>
              <button type="button" id="wNext" aria-label="Next week"
                ${weekBounds().start === thisMonday() ? "disabled" : ""}>&rsaquo;</button>
            </div>
            ${miniChart(k)}
            <p class="hint dshint" style="text-align:center">${esc(weekWords2(k))}</p>`}
        </div>
      </section>`;
  }

  /* ---------- the twelve habits ---------------------------------------
     One integer a night. The score is how many are on, which is the only
     weighting I would trust myself to defend: every item here is something
     a sleep clinic would tell you to do, and inventing a ranking between
     them would be inventing precision.
     ------------------------------------------------------------------ */
  function sleepView() {
    const m = me() || {};
    const iso = entryDay();
    const isToday = iso === todayISO();
    const mask = Number(isToday ? (m.items || 0) : (dayRecord("sleep").value || 0)) || 0;
    const pct = scorePct(mask);
    // Cut the flat list into the pyramid's rows: one, then two, then
    // three, then four. Anything the list grows past that falls into a
    // final row of its own rather than silently disappearing.
    // V2.5. HABITS is the permanent bit order and never moves; `order`
    // is the family's ranking and decides who sits where. Keeping those
    // apart is what lets the pyramid be rearranged without rewriting a
    // single stored night.
    const ranked = order().map((bit) => ({ ...HABITS[bit], i: bit }));
    const rows = []; let at = 0;
    for (const n of ROWS) { if (at >= ranked.length) break;
      rows.push(ranked.slice(at, at + n)); at += n; }
    if (at < ranked.length) rows.push(ranked.slice(at));

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <h1>Sleep Score</h1>
        <p class="sub">Ten things that decide how well you sleep, stacked
          with the heaviest first.</p>
      </header>

      <section class="card">
        <div class="daynav">
          <button type="button" id="dPrev" aria-label="Previous night">&lsaquo;</button>
          <span>${isToday ? "Tonight" : esc(fullDate(iso))}</span>
          <button type="button" id="dNext" aria-label="Next night"
            ${isToday ? "disabled" : ""}>&rsaquo;</button>
        </div>
        <div class="domino" style="padding-top:10px">
          <b class="big" style="color:var(--sleep)">${pct}%</b>
          <span class="of" style="text-decoration:none">${scorePts(mask)} of
            ${scoreMax()} points \u00b7 ${bitsOn(mask)}/${HABITS.length} held</span>
        </div>
      </section>

      <section class="pyramid">
        ${rows.map((row, ri) => `
          <div class="prow" style="--n:${row.length}">${row.map((h) => {
            const on = !!((mask >> h.i) & 1);
            return `<button type="button" class="ptile${on ? " on" : ""}"
                      data-habit="${h.i}" aria-pressed="${on}"
                      title="${esc(h.full)}"
                      aria-label="${esc(h.full)} \u2014 worth ${weights()[h.i]} of ${scoreMax()}">
              <b>${esc(h.t)}</b>
              <span class="pts">${weights()[h.i]}</span>
            </button>`; }).join("")}</div>`).join("")}
        <p class="hint" style="text-align:center;margin-top:10px">Top of the
          pyramid is worth the most. Tap a tile to hold it,
          <button type="button" class="linkbtn" id="rankOpen">or rearrange it</button>.</p>
      </section>
      ${rankSheet()}

      ${graphCard("sleep")}
      ${famBlock()}

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- rearranging the pyramid ---------------------------------
     One ranking for the whole family, because a board that compares
     scores has to have worked them out the same way. Up and down arrows
     rather than drag: it is the control the workout template editor
     already uses, it cannot be triggered by a scroll, and it is the only
     one that works with a thumb on a phone in the dark.
     ------------------------------------------------------------------ */
  function rankSheet() {
    const r = state.rank;
    if (!r) return "";
    const lad = LADDER;
    return `
      <section class="card" id="rankCard">
        <div class="section-head"><h2>Rank these</h2>
          <span class="eyebrow">the whole family\u2019s order</span></div>
        <p class="hint" style="margin:0 0 8px">Whatever you put first is worth
          ${lad[0]} points a night. Nothing already logged changes.</p>
        ${r.order.map((bit, pos) => `
          <div class="rankrow">
            <span class="rnum">${pos + 1}</span>
            <span class="rname">${esc(HABITS[bit].t)}</span>
            <span class="rpts">${lad[pos]}</span>
            <button type="button" data-rup="${pos}" ${pos === 0 ? "disabled" : ""}
              aria-label="Move ${esc(HABITS[bit].t)} up">\u2191</button>
            <button type="button" data-rdown="${pos}"
              ${pos === r.order.length - 1 ? "disabled" : ""}
              aria-label="Move ${esc(HABITS[bit].t)} down">\u2193</button>
          </div>`).join("")}
        <div class="addrow" style="margin-top:12px">
          <button class="btn" id="rankSave" style="background:var(--sleep)">Save</button>
          <button class="btn-quiet" id="rankCancel">Cancel</button>
        </div>
        <button type="button" class="linkbtn" id="rankReset"
          style="margin-top:9px;font-size:12px;color:var(--muted)">Back to the
          best-evidence order</button>
      </section>`;
  }

  function wireRank() {
    on("rankOpen", "click", () => {
      state.rank = { order: order().slice() };
      render();
      document.getElementById("rankCard")?.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    const r = state.rank;
    if (!r) return;
    const swap = (i, j) => {
      if (j < 0 || j >= r.order.length) return;
      [r.order[i], r.order[j]] = [r.order[j], r.order[i]];
      render();
    };
    document.querySelectorAll("[data-rup]").forEach((el) =>
      el.addEventListener("click", () => swap(+el.dataset.rup, +el.dataset.rup - 1)));
    document.querySelectorAll("[data-rdown]").forEach((el) =>
      el.addEventListener("click", () => swap(+el.dataset.rdown, +el.dataset.rdown + 1)));
    on("rankCancel", "click", () => { state.rank = null; render(); });
    on("rankReset", "click", () => { state.rank = { order: IDENT.slice() }; render(); });
    on("rankSave", "click", async () => {
      const res = await call("app_set_sleep_order",
        { p_code: state.code, p_order: r.order });
      if (res.error) { state.msg = res.error; state.msgKind = "bad"; render(); return; }
      state.rank = null;
      await refresh();
    });
  }

  function metricView() {
    const k = state.seg;
    const met = M[k];

    const unitRow = k === "steps" ? "" : `
      <div class="unitrow">
        <span>Show ${k === "cardio" ? "distance" : "weight"} in</span>
        <div class="range" role="group" aria-label="${
          k === "cardio" ? "Distance unit" : "Weight unit"}">${
          (k === "cardio" ? ["mi","km","m"] : ["lb","kg"]).map((u) =>
            `<button type="button" data-${k === "cardio" ? "d" : "w"}unit="${u}"
              aria-pressed="${(k === "cardio" ? units.d : units.w) === u}">${u}</button>`
          ).join("")}</div>
      </div>`;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <h1>${esc(met.label)}</h1>
        <p class="sub">${esc(PAGE[k].sub)}</p>
      </header>

      ${resumeBanner()}
      ${logCard(k)}
      ${editRowHTML()}
      ${graphCard(k)}

      ${k === "steps" || M[k].time ? "" : `
        <button class="btn" id="startEmpty"
                style="width:100%;margin-top:22px;background:${met.color}">
          ${k === "cardio" ? "Start an Empty Activity" : "Start an Empty Workout"}</button>
        ${liftTiles()}
        ${unitRow}
        ${liftHistory()}`}

      ${famBlock()}

      <p class="ver">v${APP_VERSION}</p>`;
  }

  function notConfigured() {
    return `
      <header class="masthead">
        <p class="eyebrow">Setup incomplete</p>
        <h1>Two settings missing</h1>
      </header>
      <div class="banner">
        This page has not been given its database address yet. Open
        <code>index.html</code>, and near the top replace
        <code>__SUPABASE_URL__</code> and <code>__SUPABASE_ANON_KEY__</code> with the
        Project URL and the <b>anon</b> key from Supabase &rarr; Project Settings &rarr; API.
      </div>`;
  }

  /* ---------- render + events -------------------------------------- */
  function render() {
    if (!configured) { app.innerHTML = notConfigured(); return; }
    if (state.fatal) {
      // Keep the join code on the retry link. Losing it was how a blip
      // turned into "set the whole thing up again".
      app.innerHTML = `<div class="banner">${esc(state.fatal)}</div>
        <p style="margin-top:16px"><a href="${location.pathname}?g=${
          encodeURIComponent(state.code || "")}">Try again</a>
        &nbsp;&middot;&nbsp;
        <a href="${location.pathname}" style="color:var(--muted)">Start over</a></p>`;
      return;
    }
    if (!(state.code && state.group)) { app.innerHTML = landing(); wire(); return; }
    // Two strips that can appear on any screen, so they live here rather
    // than in whichever view happened to need them first.
    const netBar = (state.net === "offline"
      ? `<div class="netbar" role="status">Offline \u00b7 showing the last numbers loaded
           <button type="button" id="netRetry">Retry</button></div>` : "")
      + (state.undo
      ? `<div class="undobar" role="status"><span>${esc(state.undo.words)}</span>
           <button type="button" id="undoStamp">Undo</button></div>` : "");

    if (state.view === "sleep")    { app.innerHTML = netBar + sleepView();  wireExercise(); wireNet(); return; }
    if (state.view === "exercise") { app.innerHTML = netBar + metricView(); wireExercise(); wireNet(); return; }
    if (state.view === "session")  { app.innerHTML = netBar + sessionView();  wireLift(); wireNet(); return; }
    if (state.view === "detail")   { app.innerHTML = netBar + detailView();   wireLift(); wireNet(); return; }

    app.innerHTML = netBar + boardView();
    wire();
    wireNet(); wireNet();
  }


  function wireChart(k) {
    const host = document.getElementById("chart-" + k);
    const svg = host && host.querySelector("svg");
    if (!svg) return;
    const n = points(k).length;

    // Two bars, two verbs. Tapping a Steps bar backlogs that day, which
    // is what you can still type. Tapping a Train bar opens the workout
    // behind it, because nobody types train minutes any more — and if
    // there is no workout, it offers to log one for that day.
    svg.addEventListener("click", async (e) => {
      const iso = e.target && e.target.dataset ? e.target.dataset.day : null;
      if (!iso) return;

      if (k !== "steps") {
        // Select the day as well as opening it: coming back from the
        // session, the log box is already pointed at the right day.
        state.entryDate = iso === todayISO() ? null : iso;
        const got = await call("app_lift_detail", {
          p_code: state.code, p_person: state.meId, p_date: iso,
          p_mode: k === "cardio" ? "cardio" : "lift" });
        const sess = got && got.session;
        if (sess) {
          state.lift.detail = sess;
          state.lift.from = "exercise";
          state.view = "detail";
          render();
        } else {
          // V1.7. An empty bar is not a dead end any more. It is how you
          // record a workout you did but did not log — the same gesture
          // that backlogs a step count one page over.
          state.msg = null;
          state.mode = k === "cardio" ? "cardio" : "lift";
          await startSession("", iso);
        }
        return;
      }

      // A Steps bar is the only way left to log a past day, now that the
      // date picker is gone. The week is already loaded, so there is
      // nothing to fetch.
      state.entryDate = iso === todayISO() ? null : iso;
      state.msg = null;
      render();
      document.getElementById("steps")?.focus();
    });

  }

  function openEditor(kind, personId) {
    state.editing = kind;
    state.editPerson = personId || state.meId;
    state.adding = false;
    render();
    const f = document.getElementById("editVal");
    if (f) { f.focus(); f.select(); }
  }

  function wireNet() {
    on("netRetry", "click", () => { retryIn = 0; setNet("ok"); render(); refresh(); });
    on("undoStamp", "click", async () => {
      const u = state.undo;
      if (!u) return;
      disarmUndo();
      await call("app_unlog", { p_code: state.code, p_person: state.meId,
                                p_metric: u.key, p_date: u.date });
      await loadHistory();
      await refresh();
    });
  }

  function on(id, ev, fn) {
    const el = document.getElementById(id);
    if (el) el.addEventListener(ev, fn);
  }

  function wire() {
    /* landing */
    on("open", "click", () => {
      const c = (document.getElementById("code").value || "").trim().toUpperCase();
      if (!c) { state.msg = "Enter the code your family sent you."; render(); return; }
      location.search = "?g=" + encodeURIComponent(c);
    });
    on("code", "keydown", (e) => { if (e.key === "Enter") document.getElementById("open").click(); });

    on("create", "click", async (e) => {
      const name = (document.getElementById("gname").value || "").trim();
      const tz = document.getElementById("gtz").value;
      if (!name) { state.msg = "Give the group a name."; render(); return; }
      e.target.disabled = true;
      const res = await call("app_create_group", { p_name: name, p_timezone: tz });
      if (res.error) { state.msg = res.error; e.target.disabled = false; render(); return; }
      location.search = "?g=" + res.code;
    });

    /* group */
    on("who", "change", async (e) => {
      saveMe(e.target.value);
      state.msg = null;
      await loadHistory();
      render();
    });

    on("addBtn", "click", () => { state.adding = !state.adding; state.editing = null; render();
      const el = document.getElementById("addName"); if (el) el.focus(); });

    on("addSave", "click", async (e) => {
      const name = (document.getElementById("addName").value || "").trim();
      const hint = document.getElementById("addHint");
      if (!name) { hint.textContent = "Type a name first."; return; }
      e.target.disabled = true;
      const res = await call("app_add_person", { p_code: state.code, p_name: name });
      if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      saveMe(res.id);
      state.adding = false;
      await refresh();
    });
    on("addName", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("addSave").click();
      if (e.key === "Escape") { state.adding = false; render(); }
    });



    on("foldBoard", "click", () => {
      try { localStorage.setItem("fhd.board", boardOpen() ? "shut" : "open"); } catch {}
      render();
    });


    on("installNo", "click", () => {
      try { localStorage.setItem("fhd.install", "no"); } catch {}
      const el = document.getElementById("installHint");
      if (el) el.remove();
    });




    document.querySelectorAll('[data-edit="name"]').forEach((el) => {
      el.addEventListener("click", () => openEditor("name", el.dataset.person));
    });

    wireEditor();
    wireBoardActions();
  }

  function wireEditor() {
    on("editCancel", "click", () => { state.editing = null; render(); });

    on("editSave", "click", async (e) => {
      const kind = state.editing;
      const raw = (document.getElementById("editVal").value || "").trim();
      const hint = document.getElementById("editHint");

      if (kind === "goal") {
        const met = M[state.editMetric] || {};
        let t;
        if (met.time) {
          // A target time comes back as HH:MM and is stored as minutes.
          // A bedtime before 5am belongs to the evening, so it goes past
          // 1440 exactly as a stamped Rest does.
          const [hh, mm] = raw.split(":").map(Number);
          if (Number.isNaN(hh)) { hint.textContent = "Pick a time."; return; }
          t = hh * 60 + (mm || 0);
          if (state.editMetric === "rest" && hh < 5) t += 1440;
        } else {
          t = Number(raw.replace(/[^0-9]/g, ""));
          if (!t) { hint.textContent = "Enter a target above zero."; return; }
        }
        e.target.disabled = true;
        const res = await call("app_set_goal", {
          p_code: state.code, p_person: state.meId, p_target: t,
          p_metric: M[state.editMetric].key,
        });
        if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      } else {
        if (!raw) { hint.textContent = "A name cannot be blank."; return; }
        e.target.disabled = true;
        const res = await call("app_rename_person", {
          p_code: state.code, p_person: state.editPerson || state.meId, p_name: raw,
        });
        if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      }
      state.editing = null;
      await refresh();
    });

    on("editVal", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("editSave").click();
      if (e.key === "Escape") { state.editing = null; render(); }
    });
  }

  // Board-only: the pillar marks, the tap-through chips, the one button.
  function wireBoardActions() {
    // The chips ARE the navigation: one tap from a pillar row to the page
    // that records it. No tab bar, and no Log screen to outgrow.
    document.querySelectorAll("[data-tile]").forEach((el) =>
      el.addEventListener("click", () => openExercise(el.dataset.tile)));

    // Tap someone's volume chip to read the session behind it. The board
    // stays a scoreboard; the detail is one tap away for whoever wants it.
    document.querySelectorAll("[data-see]").forEach((el) => {
      el.addEventListener("click", async () => {
        const m = el.dataset.m;
        const res = await call("app_lift_detail", {
          p_code: state.code, p_person: el.dataset.see, p_mode: m });
        if (res.error || !res.session) return;
        state.mode = m;
        state.lift.detail = res.session;
        state.lift.from = "board";
        state.view = "detail";
        render();
      });
    });

    on("waShare", "click", () => {
      // WhatsApp's official click-to-chat link. No API, no cost, no bot:
      // it opens WhatsApp with the message written, and you pick the group.
      window.open("https://wa.me/?text=" + encodeURIComponent(dailyMessage()), "_blank");
    });
  }

  /* ---------- boot -------------------------------------------------- */
  (async () => {
    if (!configured) { render(); return; }
    if (!sb) {
      state.fatal = "Could not load the database library. Check your connection and reload.";
      render(); return;
    }
    if (state.code) {
      state.meId = loadMe();
      state.fam.open = famOpen();
      try {
        state.range = localStorage.getItem("fhd.range") === "month" ? "month" : "week";
        state.histOpen = localStorage.getItem("fhd.hist") === "open";
      } catch {}
      await refresh();
      watchClock();
      // A workout finished with no signal uploads itself the moment there
      // is one — on this load, and again whenever the phone reconnects.
      loadLocal();
      flushPending().then(() => { if (state.view === "board") render(); });
      window.addEventListener("online", () => {
        retryIn = 0;
        flushPending().then(() => { if (state.net === "offline") refresh();
                                    else if (state.view !== "session") render(); });
      });
    } else {
      render();
    }
  })();
})();
</script>
</body>
</html>
