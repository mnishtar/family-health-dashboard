      };
      const settle = () => {
        if (n < 2) return;
        let pos = Math.round(box.scrollLeft / W());
        if (pos === 0) { pos = n; jump(n); }
        if (pos === n + 1) { pos = 1; jump(1); }
        mark(pos - 1);
      };
      let t = null;
      box.addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(settle, 120); }, { passive: true });
      document.querySelectorAll("[data-dot]").forEach((d) =>
        d.addEventListener("click", () => {
          mark(Number(d.dataset.dot));
          box.scrollTo({ left: (state.dialIdx + off) * W(), behavior: "smooth" });
        }));
    }
    // A typed dial: tap the number, type, leave. Steps take a count; Train,
    // Cardio and Work take minutes, as 45, 1:30 or 1h 30m.
    document.querySelectorAll("[data-dial]").forEach((f) => {
      const k = f.dataset.dial, S = STD[k];
      f.addEventListener("focus", () => {
        if (restoring) return;
        f.value = f.dataset.raw || ""; requestAnimationFrame(() => f.select()); });
      f.addEventListener("keydown", (e) => { if (e.key === "Enter") f.blur(); });
      f.addEventListener("blur", async () => {
        const txt = (f.value || "").trim();
        const digits = txt.replace(/[^0-9]/g, "");
        const v = S.kind === "min" ? parseMinutes(txt)
          : S.kind === "weight" ? (Number.isFinite(parseFloat(txt.replace(",", "."))) ? Math.round(parseFloat(txt.replace(",", ".")) * 10) / 10 : null)
          : digits === "" ? null : Number(digits);
        if (v === null || String(v) === (f.dataset.raw || "")) { f.value = f.dataset.show || ""; return; }
        if (S.kind === "min" && v > 1440) { f.value = f.dataset.show || ""; dialSay(k, "A day has 1,440 minutes."); return; }
        // V4.4. Weight is typed in your unit and kept in pounds.
        const val = S.kind === "weight" ? wToLb(v) : v;
        f.value = stdWords(k, val);
        f.dataset.raw = String(v);
        const res = S.custom
          ? await call("app_habit_log", { p_code: state.code, p_person: state.meId, p_id: k.slice(2), p_date: null, p_value: val })
          : await call("app_log", { p_code: state.code, p_person: state.meId,
          p_value: val, p_metric: S.key, p_date: null, p_tz: deviceTZ() });
        dialSay(k, res.error ? (res.offline ? "No signal. Not saved yet." : res.error) : "Saved.");
        await refresh();
      });
    });
    // V6.1. Your own done-habit: one tap marks today, another undoes it.
    document.querySelectorAll("[data-hdone]").forEach((el) => el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const k = el.dataset.hdone, on = el.getAttribute("aria-pressed") === "true";
      if (state.habits) state.habits.today[k.slice(2)] = on ? null : 1;
      render();
      const res = await call("app_habit_log", { p_code: state.code, p_person: state.meId, p_id: k.slice(2), p_date: null, p_value: on ? null : 1 });
      if (res.error) dialSay(k, res.offline ? "No signal. Not saved yet." : res.error);
      await refresh();
    }));
    // Recovery: one tap copies last night, with Undo.
    document.querySelectorAll("[data-dialsame]").forEach((el) =>
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        el.disabled = true;
        const m = me() || {};
        const r = await copyLastNight(m.rest_day || todayISO());
        if (r.err) { el.disabled = false; dialSay("sleep", r.err); return; }
        if (me()) me().items = r.mask;
        await refresh();
      }));
    // Longevity: one tap copies the last logged day, with Undo.
    document.querySelectorAll("[data-ddsame]").forEach((el) =>
      el.addEventListener("click", async (e) => {
        e.stopPropagation();
        el.disabled = true;
        const r = await copyLastDozen(todayISO());
        if (r.err) { el.disabled = false; dialSay("dd", r.err); return; }
        if (me()) me().dd_items = r.mask;
        await refresh();
      }));
    // A logged clock dial: tap the time, turn the wheel.
    wireTimePicks((k) => { const m = me() || {};
      return M[k].night ? (m.rest_day || todayISO()) : (m.their_date || todayISO()); }, () => refresh());
    // A clock dial: Now records this minute, the way the page's Now does.
    document.querySelectorAll("[data-dialnow]").forEach((el) =>
      el.addEventListener("click", async () => {
        const k = el.dataset.dialnow;
        el.disabled = true;
        const res = await call("app_stamp", { p_code: state.code, p_person: state.meId,
          p_metric: STD[k].key, p_tz: deviceTZ() });
        if (res.error) { el.disabled = false; dialSay(k, res.offline ? "No signal. Not saved yet." : res.error); return; }
        armUndo({ key: STD[k].key, date: res.date, words: `${STD[k].label} ${clockWords(res.value)} saved` });
        const m = me(); if (m) m[k] = res.value;
        await refresh();
      }));
    // The play button starts, pauses and continues without leaving home.
    // It stops the tap there, so the dial underneath does not also open
    // the Work page.
    // V3.6: idle, it first asks what the session is for (your goals, or
    // what you type), and picking one starts it.
    document.querySelectorAll("[data-dwork]").forEach((el) =>
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!state.work) loadWorkLocal();
        const w = state.work, d = Number(el.dataset.dwork);
        if (w.run) {
          const floor = Math.ceil(workElapsed(w.run) / 60000) + 1;
          w.run.len = Math.max(floor, Math.min(WORK_MAX, w.run.len + d));
        } else w.len = Math.max(WORK_MIN, Math.min(WORK_MAX, w.len + d));
        saveWorkLocal(); render();
      }));
    on("homeSilGo", "click", async () => { if (!silRun()) silStartNow(); await openMed("silence"); });
    on("homeWorkGo", "click", async (e) => {
      e.stopPropagation();
      if (!state.work) loadWorkLocal();
      const r = state.work.run;
      if (!r) {
        state.homeSheet = "focus"; state.work.pickQ = ""; render();
        return;
      }
      if (r.pausedAt) workResume(); else workHold();
      render();
    });
    // Tasks: type straight into the dial. V5.4: it always lands in Decide,
    // to be sorted on the Tasks page; the line stays ready for the next one.
    // V6.2. A task typed into the dial is saved however you finish it:
    // Return, the ✓ beside it, or the phone's ✓ above the keyboard. Undo
    // takes it back for a few seconds.
    document.querySelectorAll("[data-dtask]").forEach((f) => {
      let busy = false;
      const submit = async () => {
        const title = (f.value || "").trim().slice(0, 200);
        if (!title || busy) return;
        busy = true; f.value = "";
        // The list as the server has it, so a phone that never opened Tasks
        // still knows how full Do is; the copy on the phone if offline.
        let list = [];
        try { list = JSON.parse(localStorage.getItem(taskCacheKey()) || "[]"); } catch {}
        const fresh = await call("app_tasks", { p_code: state.code, p_person: state.meId });
        if (!fresh.error && Array.isArray(fresh.tasks)) list = fresh.tasks;
        if (!Array.isArray(list)) list = [];
        const q = 2;
        const pos = Math.max(-1, ...list.filter((x) => !x.parent_id && !x.done && (x.quadrant || 1) === q)
          .map((x) => Number(x.position) || 0)) + 1;
        const x = { id: uuid(), parent_id: null, quadrant: q, title, done: false, position: pos,
                    sched_date: null, sched_start: null, sched_min: null };
        const res = await call("app_task_save", { p_code: state.code, p_person: state.meId, p_task: taskPayload(x) });
        busy = false;
        if (res.error) { f.value = title; dialSay("tasks", res.offline ? "No signal. Not saved yet." : res.error); return; }
        list.push(x);
        try { localStorage.setItem(taskCacheKey(), JSON.stringify(list)); } catch {}
        dialSay("tasks", "Added to Decide.");
        const m = document.getElementById("dmsg-tasks");
        if (m) {
          m.innerHTML = `Added \u201c${esc(title.length > 28 ? title.slice(0, 27) + "\u2026" : title)}\u201d to Decide \u00b7 <button type="button" class="linkbtn" id="dialTaskUndo">Undo</button>`;
          clearTimeout(dialSay.t);
          dialSay.t = setTimeout(() => { state.homeMsg = null; const e2 = document.getElementById("dmsg-tasks"); if (e2) e2.innerHTML = "&nbsp;"; }, 6000);
          document.getElementById("dialTaskUndo")?.addEventListener("click", async () => {
            const r2 = await call("app_task_delete", { p_code: state.code, p_person: state.meId, p_id: x.id });
            try { localStorage.setItem(taskCacheKey(), JSON.stringify(list.filter((y) => y.id !== x.id))); } catch {}
            dialSay("tasks", r2.error ? (r2.offline ? "No signal. Not undone yet." : r2.error) : "Taken back.");
          });
        }
      };
      f.addEventListener("keydown", (e) => { if (e.key !== "Enter") return; e.preventDefault(); submit(); });
      f.addEventListener("blur", () => { if ((f.value || "").trim()) submit(); });
    });
    clearInterval(homeTick); homeTick = null;
    const run = state.work && state.work.run;
    if (run && !run.pausedAt) homeTick = setInterval(async () => {
      const r = state.work && state.work.run;
      const el = document.getElementById("homeWorkClock");
      if (state.view !== "board" || !r || r.pausedAt || !el) { clearInterval(homeTick); homeTick = null; return; }
      el.textContent = workClk(r);
      const ring = document.getElementById("homeWorkRing");
      if (ring) ring.setAttribute("stroke-dashoffset", (DIAL_C * (1 - workLeft(r) / (r.len * 60000))).toFixed(2));
      workOverCheck(r); if (await checkWork()) { clearInterval(homeTick); homeTick = null; render(); }
    }, 1000);
  }

  // One wiring for every tap-to-change time, on the page and on the dial.
  // Some phones fire `change` as the wheel turns, so a save waits for the
  // wheel to rest; the last value wins.
  function wireTimePicks(dayFor, after) {
    document.querySelectorAll("[data-tpick]").forEach((f) => {
      if (f.dataset.w) return; f.dataset.w = "1";
      const k = f.dataset.tpick, met = M[k];
      f.addEventListener("click", () => {
        const cur = Number(f.dataset.v) % 1440;
        timeWheel(met.label, cur, async (v) => {
          // The 5am rule: a bedtime after midnight belongs to the evening.
          if (k === "rest" && v < 5 * 60) v += 1440;
          const shown = f.querySelector(".tpkv");
          if (shown) shown.innerHTML = tParts(v);
          f.classList.remove("unset"); f.dataset.v = v;
          const iso = dayFor(k);
          state.tLocal = { k, iso, v };
          const res = await call("app_log", { p_code: state.code, p_person: state.meId,
            p_value: v, p_metric: met.key, p_date: iso, p_tz: deviceTZ() });
          state.tLocal = null;
          if (res.error) { state.msg = res.offline ? "No signal. Not saved yet." : res.error; state.msgKind = "bad"; }
          else {
            const m = me();
            if (m && iso === dayFor(k) && (state.view === "board" || entryDay() === todayISO())) m[k] = v;
            if (state.view === "board") dialSay(k, `${met.label} ${clockWords(v)} saved.`);
          }
          await after();
        });
      });
    });
  }

  // V5.3. A sheet of scroll wheels. Each column scrolls natively and snaps
  // (finger, mouse wheel or trackpad); arrow keys and a click on an item
  // move it too. Lives on <body>, so a redraw of the page can't close it.
  const WROW = 40;
  function wheelSheet({ title, cols, onDone }) {
    document.getElementById("wsheet")?.remove();
    const box = document.createElement("div");
    box.id = "wsheet";
    box.innerHTML = `<div class="sheetbg" data-wx="1"></div>
      <div class="stdsheet silsheet wsheet" role="dialog" aria-label="${esc(title)}">
        <p class="eyebrow" style="text-align:center">${esc(title)}</p>
        <div class="wheels"><div class="wsel" aria-hidden="true"></div>
          ${cols.map((c, ci) => `<div class="wheel" data-col="${ci}" tabindex="0" role="listbox" aria-label="${esc(c.label)}" style="width:${c.w || 64}px">
            <div class="wpad"></div>${c.items.map((t, i) => `<div class="witem" data-i="${i}" role="option">${esc(t)}</div>`).join("")}<div class="wpad"></div></div>
            ${c.unit ? `<span class="wlab">${esc(c.unit)}</span>` : ""}`).join("")}</div>
        <div class="stdbtns"><button type="button" class="btn-quiet" data-wx="1">Cancel</button>
          <button type="button" class="btn" data-wdone="1">Done</button></div>
      </div>`;
    document.body.appendChild(box);
    const wheels = [...box.querySelectorAll(".wheel")];
    const idx = (w) => Math.max(0, Math.min(cols[+w.dataset.col].items.length - 1, Math.round(w.scrollTop / WROW)));
    const mark = (w) => { const i = idx(w); w.querySelectorAll(".witem").forEach((x) => x.classList.toggle("on", +x.dataset.i === i)); };
    wheels.forEach((w) => {
      w.scrollTop = cols[+w.dataset.col].i * WROW; mark(w);
      w.addEventListener("scroll", () => mark(w), { passive: true });
      w.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault();
          w.scrollTo({ top: (idx(w) + (e.key === "ArrowDown" ? 1 : -1)) * WROW, behavior: "smooth" }); }
        if (e.key === "Enter") { e.preventDefault(); done(); }
        if (e.key === "Escape") { e.preventDefault(); close(); }
      });
      w.addEventListener("click", (e) => { const it = e.target.closest(".witem"); if (it) w.scrollTo({ top: +it.dataset.i * WROW, behavior: "smooth" }); });
    });
    const close = () => box.remove();
    const done = () => { const v = wheels.map(idx); close(); onDone(v); };
    box.querySelectorAll("[data-wx]").forEach((x) => x.addEventListener("click", close));
    box.querySelector("[data-wdone]").addEventListener("click", done);
    setTimeout(() => wheels[0] && wheels[0].focus({ preventScroll: true }), 50);
  }
  function timeWheel(title, min, onSave) {
    min = ((Math.round(min) % 1440) + 1440) % 1440;
    const h24 = Math.floor(min / 60), mm = min % 60, pm = h24 >= 12, h12 = h24 % 12 || 12;
    wheelSheet({ title, cols: [
        { label: "Hour", items: Array.from({ length: 12 }, (_, i) => String(i + 1)), i: h12 - 1 },
        { label: "Minute", items: Array.from({ length: 60 }, (_, i) => pad(i)), i: mm },
        { label: "AM or PM", items: ["AM", "PM"], i: pm ? 1 : 0, w: 56 } ],
      onDone: ([hi, mi, ai]) => { const h = (hi + 1) % 12 + (ai ? 12 : 0); onSave(h * 60 + mi); } });
  }

  // V3.5. The tab bar is deleted. Every page is reached from the links
  // on the home screen (and the dials), and every page has its way back.
  function wireGo() {
    document.querySelectorAll("[data-go]").forEach((el) => {
      el.addEventListener("click", () => { state.homeSheet = null; openExercise(el.dataset.go); });
      if (el.getAttribute("role") === "button") el.addEventListener("keydown", (e) => {
        if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); el.click(); } });
    });
  }

  /* ---------- V3.6: the home sheets ----------------------------------
     Two short sheets that float over the dials, so the common thing is
     done without leaving home: what a focus session is for, and a cardio
     activity with its distance and time.
     ------------------------------------------------------------------ */
  // V3.7. Swim, Hike, Run, then any you added with +, in a fixed order so
  // the thumb learns where each one is. The last one used is picked.
  const CARDIO_BASE = ["Swim", "Hike", "Run"];
  const cardioKey = () => "fhd.cardioOwn." + (state.meId || "anon");
  const cardioLastKey = () => "fhd.cardioLast." + (state.meId || "anon");
  function cardioOwn() {
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem(cardioKey()) || "[]"); } catch {}
    return (Array.isArray(saved) ? saved : []).filter((a) => typeof a === "string" && a.trim()).slice(0, 5);
  }
  // V5.5. A tile you remove stays removed (on this phone); + adds one back.
  const cqHideKey = () => "fhd.cardioHide." + (state.meId || "anon");
  const cqHidden = () => { try { return JSON.parse(localStorage.getItem(cqHideKey()) || "[]") || []; } catch { return []; } };
  function cardioActs() {
    const hide = cqHidden().map((x) => x.toLowerCase());
    return cardioActsAll().filter((a) => !hide.includes(a.toLowerCase()));
  }
  function cardioActsAll() {
    const out = CARDIO_BASE.slice();
    for (const a of cardioOwn()) if (!out.some((b) => b.toLowerCase() === a.toLowerCase())) out.push(a);
    // V5.2. Routines are activities too.
    for (const t of ((state.ext && state.ext.targets) || [])) if (!out.some((b) => b.toLowerCase() === t.n.toLowerCase())) out.push(t.n);
    return out;
  }
  function rememberCardio(name) {
    try { localStorage.setItem(cardioLastKey(), name); } catch {}
    if (CARDIO_BASE.some((b) => b.toLowerCase() === name.toLowerCase())) return;
    const own = cardioOwn().filter((a) => a.toLowerCase() !== name.toLowerCase());
    try { localStorage.setItem(cardioKey(), JSON.stringify(own.concat([name]).slice(-5))); } catch {}
  }
  function openCardio(pick) {
    let last = typeof pick === "string" ? pick : null;
    if (!last) try { last = localStorage.getItem(cardioLastKey()); } catch {}
    state.homeSheet = "cardio";
    state.cq = { act: last && cardioActs().includes(last) ? last : CARDIO_BASE[0], other: "", plus: false, dist: "", min: "", reps: "", err: "",
                 picked: typeof pick === "string" };
    render();
    document.getElementById("cqMin")?.focus();
    // From home the routines may not be loaded yet; they join the chips when they are.
    if (!state.ext) loadExTargets().then(() => { if (state.homeSheet === "cardio") { state.cq.act = last && cardioActs().includes(last) ? last : state.cq.act; render(); } });
  }
  const cqChips = () => {
    const q = state.cq || {};
    return `<div class="cqchips" id="cqChips" role="group" aria-label="Activity">${cardioActs().map((a) => `
      <button type="button" class="cqc${!q.plus && q.act === a ? " on" : ""}" data-cqa="${esc(a)}"
        aria-pressed="${!q.plus && q.act === a}">${esc(a)}</button>`).join("")}
      <button type="button" class="cqc cqplus${q.plus ? " on" : ""}" id="cqPlus" aria-pressed="${!!q.plus}"
        aria-label="Add your own activity">+</button></div>`;
  };
  const sheetHere = () => state.view === "board" || (state.view === "exercise" && (state.seg === "cardio" || state.seg === "work"));
  function homeSheet() {
    if (!sheetHere() || !state.homeSheet) return "";
    if (state.homeSheet === "focus") {
      if (!state.work) loadWorkLocal();
      const w = state.work;
      return `
        <div class="sheetbg" id="hsBg"></div>
        <div class="stdsheet hsheet" role="dialog" aria-label="Start a focus session">
          <p class="eyebrow">Focus · ${w.len} min</p>
          <h3>What are you focusing on?</h3>
          ${(() => { const list = getRecent().filter((x) => x && x.label).map((x) => x.label)
              .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
            return list.length ? `<div class="fchips hfchips">${list.map((l) =>
              `<span class="fchip"><button type="button" data-hfchip="${esc(l)}">${esc(l)}</button></span>`).join("")}</div>
              <p class="hint" style="text-align:center;margin:2px 0 8px">Tap one to start.</p>` : ""; })()}
          <form class="fnewf" id="hfForm"><input class="field" id="hfIn" maxlength="120" autocomplete="off" enterkeyhint="go"
            placeholder="Something new" value="${esc(w.pickQ || "")}" aria-label="Something new to focus on">
            <button type="submit" class="btn">Start</button></form>
          <div class="stdbtns"><button type="button" class="btn-quiet" id="hsCancel">Cancel</button></div>
        </div>`;
    }
    const q = state.cq || {};
    // V6.4. One place to add an activity, with an optional daily number;
    // hold a tile to change that number or remove the activity.
    const tgtRow = (kind, val) => `<p class="cqtl">Daily target <small>(optional)</small></p>
        <div class="cqtgt"><input class="field" id="cqTgtVal" inputmode="text" autocomplete="off" placeholder="${kind === "time" ? "3:00" : "100"}" value="${esc(val || "")}" aria-label="Daily target">
          <select class="field" id="cqTgtKind" aria-label="Count in"><option value="reps"${kind !== "time" ? " selected" : ""}>reps</option><option value="time"${kind === "time" ? " selected" : ""}>time</option></select></div>
        <p class="hint">Like 100 jumping jacks or a 3-minute plank. Time as 3, 1:30 or 90s.</p>`;
    if (q.adding) return `
      <div class="sheetbg" id="hsBg"></div>
      <div class="stdsheet hsheet" role="dialog" aria-label="Add an activity">
        <p class="eyebrow">New activity</p>
        <input class="field" id="cqNewName" maxlength="40" autocomplete="off" enterkeyhint="done" placeholder="e.g. Row, Plank, Jumping jacks" value="${esc(q.newName || "")}" aria-label="Activity name">
        ${tgtRow(q.kind, q.tval)}
        ${q.err ? `<p class="hint bad">${esc(q.err)}</p>` : ""}
        <div class="stdbtns"><button type="button" class="btn-quiet" id="hsCancel">Cancel</button>
          <button type="button" class="btn" id="cqNewSave" style="background:var(--swim)">Add</button></div>
      </div>`;
    if (q.editing) { const t0 = routineOf(q.editing);
      return `
      <div class="sheetbg" id="hsBg"></div>
      <div class="stdsheet hsheet" role="dialog" aria-label="Change ${esc(q.editing)}">
        <p class="eyebrow">Activity</p>
        <h3>${esc(q.editing)}</h3>
        ${tgtRow(t0 ? t0.kind : "reps", t0 && t0.t > 0 ? (t0.kind === "time" ? secWords(t0.t) : String(t0.t)) : "")}
        ${q.err ? `<p class="hint bad">${esc(q.err)}</p>` : ""}
        <div class="stdbtns"><button type="button" class="btn-quiet bad" id="cqEdDel">Remove</button>
          <button type="button" class="btn-quiet" id="hsCancel">Cancel</button>
          <button type="button" class="btn" id="cqEdSave" style="background:var(--swim)">Save</button></div>
      </div>`; }
    return `
      <div class="sheetbg" id="hsBg"></div>
      <div class="stdsheet hsheet cqsheet" role="dialog" aria-label="Log cardio">
        <p class="eyebrow">Cardio · ${state.view === "exercise" && entryDay() !== todayISO() ? esc(shortDay(entryDay())) : "today"}</p>
        ${q.picked ? `<h3 class="cqname">${esc(q.act)}</h3>` : cqChips()}
        ${q.plus ? `<input class="field cqother" id="cqOther" maxlength="40" autocomplete="off" enterkeyhint="next"
          placeholder="Your activity, e.g. Row" value="${esc(q.other || "")}" aria-label="Your own activity">` : ""}
        ${(() => { const rt = !q.plus && routineOf(q.act);
          if (!rt || !(rt.t > 0)) return "";
          const v = Number((rt.days || {})[(state.ext || {}).today] || 0);
          return `<p class="cqtg">Today ${rFmt(rt, v)} of ${rFmt(rt, rt.t)}${rt.kind === "time" ? "" : " reps"}</p>`; })()}
        <div class="cqrow">
          <label class="cqf"><span>Minutes</span>
            <span class="cqin"><input id="cqMin" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0"
              value="${esc(q.min || "")}" aria-label="Minutes"><em>min</em></span></label>
          ${(() => { const rt = !q.plus && routineOf(q.act);
            if (rt && rt.kind === "reps") return `<label class="cqf"><span>Reps</span>
              <span class="cqin"><input id="cqReps" inputmode="numeric" autocomplete="off" placeholder="100"
                value="${esc(q.reps || "")}" aria-label="Reps"></span></label>`;
            if (rt || q.plus) return "";
            return `<label class="cqf"><span>Distance <small>optional</small></span>
            <span class="cqin"><input id="cqDist" inputmode="decimal" autocomplete="off" placeholder="0"
              value="${esc(q.dist || "")}" aria-label="Distance in ${esc(units.d)}">
            <button type="button" class="unitchip" id="cqUnit" aria-label="Distance unit, now ${esc(units.d)}">${esc(units.d)}</button></span></label>`; })()}
        </div>
        ${q.err ? `<p class="hint bad" id="cqHint">${esc(q.err)}</p>` : ""}
        <div class="stdbtns">
          <button type="button" class="btn-quiet" id="hsCancel">Cancel</button>
          <button type="button" class="btn" id="cqSave" style="background:var(--swim)">Save</button>
        </div>
      </div>`;
  }
  function wireHomeSheet() {
    // Cardio: one tap, on the dial or the page, opens the card.
    document.querySelectorAll("[data-cardioq]").forEach((el) => {
      if (el.dataset.w) return; el.dataset.w = "1";
      el.addEventListener("click", () => openCardio());
    });
    const close = () => { state.homeSheet = null; render(); };
    const bg = document.getElementById("hsBg");
    if (bg && !bg.dataset.w) { bg.dataset.w = "1"; bg.addEventListener("click", close); }
    const cancel = document.getElementById("hsCancel");
    if (cancel && !cancel.dataset.w) { cancel.dataset.w = "1"; cancel.addEventListener("click", close); }
    if (state.homeSheet === "focus") {
      const w = state.work;
      const start = (label) => {
        w.focus = label ? { label: label.slice(0, 120), task_id: null } : null;
        saveWorkLocal();
        state.homeSheet = null;
        workGo();
        state.workFull = true;   // V5.4. Play fills the screen.
        render();
      };
      // V4.7. One tap on a recent activity starts it.
      document.querySelectorAll("[data-hfchip]").forEach((el) => {
        if (el.dataset.w) return; el.dataset.w = "1";
        el.addEventListener("click", () => start(el.dataset.hfchip));
      });
      const ff = document.getElementById("hfForm");
      if (ff && !ff.dataset.w) {
        ff.dataset.w = "1";
        ff.addEventListener("submit", (e) => {
          e.preventDefault();
          const typed = (document.getElementById("hfIn").value || "").trim();
          if (typed) { pushRecent({ label: typed.slice(0, 120), task_id: null }); start(typed); }
          else document.getElementById("hfIn").focus();
        });
      }
      const hp = document.getElementById("hfPlain");
      if (hp && !hp.dataset.w) { hp.dataset.w = "1"; hp.addEventListener("click", () => start(null)); }
      return;
    }
    if (state.homeSheet !== "cardio") return;
    const q = state.cq;
    const grab = () => {
      q.other = (document.getElementById("cqOther") || {}).value || "";
      q.dist = (document.getElementById("cqDist") || {}).value || "";
      q.min = (document.getElementById("cqMin") || {}).value || "";
      q.reps = (document.getElementById("cqReps") || {}).value || "";
    };
    document.querySelectorAll("[data-cqa]").forEach((el) => {
      if (el.dataset.w) return; el.dataset.w = "1";
      el.addEventListener("click", () => { grab(); q.act = el.dataset.cqa; q.other = ""; q.plus = false; q.err = ""; render();
        document.getElementById("cqMin")?.focus(); });
    });
    const plus = document.getElementById("cqPlus");
    if (plus && !plus.dataset.w) {
      plus.dataset.w = "1";
      plus.addEventListener("click", () => { grab(); q.plus = true; render(); document.getElementById("cqOther")?.focus(); });
    }
    const unit = document.getElementById("cqUnit");
    if (unit && !unit.dataset.w) {
      unit.dataset.w = "1";
      unit.addEventListener("click", () => {
        grab(); units.d = units.d === "mi" ? "km" : units.d === "km" ? "m" : "mi"; render(); });
    }
    // V5.4. Enter saves: activity, minutes, done.
    const cqm = document.getElementById("cqMin");
    if (cqm && !cqm.dataset.w) { cqm.dataset.w = "1"; cqm.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("cqSave")?.click(); } }); }
    // New activity.
    const nsv = document.getElementById("cqNewSave");
    // A typed daily target, or null for none, or false when it can't be read.
    const readTgt = () => { const raw = (document.getElementById("cqTgtVal")?.value || "").trim();
      const kind = document.getElementById("cqTgtKind")?.value === "time" ? "time" : "reps";
      if (!raw) return null;
      const t = kind === "time" ? parseSecs(raw) : Number(raw.replace(/[^0-9]/g, ""));
      return t && t >= 1 ? { kind, t } : false; };
    const putTgt = async (n, tg) => {
      const T = ((state.ext && state.ext.targets) || []).filter((x) => x.n.toLowerCase() !== n.toLowerCase());
      if (tg) T.push({ n, kind: tg.kind, t: tg.t, days: {} });
      if (T.length > 8) return "Up to eight daily targets.";
      if (state.ext) state.ext.targets = T;
      const res = await call("app_set_ex_targets", { p_code: state.code, p_person: state.meId, p_targets: T.map((x) => ({ n: x.n, kind: x.kind, t: x.t })) });
      if (res.error) return res.offline ? "No signal. Not saved yet." : res.error;
      await loadExTargets(); return null; };
    const eds = document.getElementById("cqEdSave");
    if (eds && !eds.dataset.w) {
      eds.dataset.w = "1";
      eds.addEventListener("click", async () => {
        const tg = readTgt(); if (tg === false) { q.err = "Type a number, or a time like 3, 1:30 or 90s."; render(); return; }
        const err = await putTgt(q.editing, tg); if (err) { q.err = err; render(); return; }
        state.homeSheet = null; state.cq = null; render(); });
      document.getElementById("cqEdDel").addEventListener("click", async () => {
        const n = q.editing;
        const hide = cqHidden().filter((x) => x.toLowerCase() !== n.toLowerCase()).concat([n]);
        try { localStorage.setItem(cqHideKey(), JSON.stringify(hide)); } catch {}
        if (routineOf(n)) await putTgt(n, null);
        state.homeSheet = null; state.cq = null; render(); });
    }
    if (nsv && !nsv.dataset.w) {
      nsv.dataset.w = "1";
      const add = async () => { const n = (document.getElementById("cqNewName")?.value || "").trim().slice(0, 40);
        q.newName = n;
        if (!n) { q.err = "Name the activity."; render(); return; }
        const tg = readTgt(); if (tg === false) { q.err = "Type a number, or a time like 3, 1:30 or 90s."; render(); return; }
        if (tg) { const err = await putTgt(n, tg); if (err) { q.err = err; render(); return; } }
        rememberCardio(n); try { localStorage.setItem(cardioLastKey(), n); localStorage.setItem(cqHideKey(), JSON.stringify(cqHidden().filter((x) => x.toLowerCase() !== n.toLowerCase()))); } catch {}
        state.cq = { act: n, other: "", plus: false, dist: "", min: "", reps: "", err: "", picked: true }; render();
        document.getElementById("cqMin")?.focus(); };
      nsv.addEventListener("click", add);
      document.getElementById("cqNewName")?.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } });
    }
    const saveBtn = document.getElementById("cqSave");
    if (saveBtn && !saveBtn.dataset.w) {
      saveBtn.dataset.w = "1";
      saveBtn.addEventListener("click", async () => {
        grab();
        const name = ((q.plus ? q.other.trim() : "") || (q.plus ? "" : q.act) || "").slice(0, 40);
        const min = parseMinutes(q.min);
        const dv = parseFloat(String(q.dist).replace(",", "."));
        const dist = dv > 0 ? Math.round(dIn(dv)) : 0;
        if (!name) { q.err = q.plus ? "Type your activity." : "Pick an activity."; render(); return; }
        if (!min || min <= 0 || min > 600) { q.err = min > 600 ? "Ten hours at most." : "Type the time, like 30 or 1h 15m."; render(); return; }
        const rt = !q.plus && routineOf(name);
        const reps = rt && rt.kind === "reps" ? Math.min(1000, Math.max(0, Math.round(Number(String(q.reps).replace(/[^0-9]/g, "")) || 0))) : 0;
        saveBtn.disabled = true;
        const m = me() || {};
        const onPage = state.view === "exercise";
        const day = onPage ? entryDay() : (m.their_date || todayISO());
        const res = await call("app_lift_save", {
          p_code: state.code, p_person: state.meId, p_session: uuid(), p_label: name, p_note: null,
          p_date: day, p_duration: min,
          p_sets: [{ position: 0, set_index: 0, exercise: name, kind: !rt && dist ? "distance_time" : "duration",
                     weight: 0, reps, distance: rt ? 0 : dist, seconds: min * 60 }],
          p_finished: true, p_mode: "cardio", p_tz: deviceTZ(), p_claim: true });
        if (res.error) { q.err = res.offline ? "No signal. Try again in a moment." : res.error; render(); return; }
        rememberCardio(name);
        try { localStorage.setItem(cqLastKey(), JSON.stringify({ act: name, min, reps, dist: rt ? 0 : dist })); } catch {}
        state.homeSheet = null;
        const said = `${name}${reps ? " · " + num(reps) + " reps" : !rt && dist ? " · " + distWords(dist) : ""} · ${hm(min)} logged.`;
        if (rt) loadExTargets().then(() => render());
        if (onPage) {
          state.lift.msg = said;
          render();
          await loadLift(); await loadHistory(); await refresh();
        } else {
          render();
          dialSay("cardio", said);
          await refresh();
        }
      });
    }
  }

  /* ---------- Exercise: one pillar, three numbers ---------------------
     This screen absorbed both logger homes. A single segment picks which
     number you are looking at AND which log sits underneath it, so
     starting a workout is still three taps and there is no tab bar to
     outgrow when the other four pillars arrive.
     ------------------------------------------------------------------ */


  /* ---------- one page per metric --------------------------------------
     V1.7. Steps, Train and Cardio are three pages built from one template,
     each one tap from home. The V1.6 overview screen that used to sit in
     front of them is deleted: it held a number you can see on the tile, a
     score that moved to the category header, and two pills the tiles
     replaced.

     Top to bottom, every page is the same shape, so learning one teaches
     all three: today's number, the week as seven tappable bars, the thing
     that records it, then the family behind a fold.
     ------------------------------------------------------------------ */

  const PAGE = {
    // V4.7. One line each.
    steps:  { sub:"The keystone habit.", verb:"steps" },
    train:  { sub:"Strength and mobility, minutes a day.", verb:"minutes" },
    cardio: { sub:"Heart and lungs, minutes a day.", verb:"minutes" },
    rest:   { sub:"In bed on time.",       verb:"time" },
    rise:   { sub:"Up on time.",            verb:"time" },
    sleep:  { sub:"The habits behind deep, restoring sleep.", verb:"%" },
    work:   { sub:"Deep work, one session at a time.", verb:"minutes" },
  };

  /* ---------- the log box ---------------------------------------------
     V1.7b splits recording from reviewing. This box records: it carries
     its own date, its own number and nothing else. The graph below it is
     for looking at, and the two no longer share a card and confuse which
     of them you are touching.

     All three metrics are typed now. Train and Cardio still have the
     logger, and a workout still writes the minutes — but a number you
     type outranks it, permanently, for that day. One sentence, no marks
     to decode: what you typed is what the day says.
     ------------------------------------------------------------------ */
  // V3.7. Cardio is logged the way the dial logs it: one button, one card
  // (activity, distance, time), Save. The gym-style session logger is gone
  // from this page; past sessions are still listed under the graph.
  // V5.4. Cardio from first principles: the day's total, then your
  // activities as tiles. Tap one, type the minutes, Save: two taps and the
  // digits. The last entry repeats in one tap. A target is a thin bar
  // under its activity. Today's entries sit underneath, each with an ×.
  const cqLastKey = () => "fhd.cqlast." + (state.meId || "anon");
  const cqLast = () => { try { return JSON.parse(localStorage.getItem(cqLastKey()) || "null"); } catch { return null; } };
  const CQ_DIST = (name) => !routineOf(name);   // distance only where it means something
  function cardioCard() {
    const k = "cardio", met = M[k], m = me() || {};
    const iso = entryDay(), isToday = iso === todayISO(), rec = dayRecord(k);
    const shown = isToday ? val(m, k) : rec.value, has = shown > 0;
    const goal = target(m, k);
    const acts = (state.lift.sessions || []).filter((x) => x.entry_date === iso && (x.mode || "cardio") === "cardio");
    const sum = acts.reduce((a, x) => a + Number(x.duration_min || 0), 0);
    const extra = state.lift.loaded && shown > sum ? shown - sum : 0;
    const by = (n) => acts.filter((x) => (x.label || "").toLowerCase() === n.toLowerCase()).reduce((a, x) => a + Number(x.duration_min || 0), 0);
    const today = (state.ext && state.ext.today) || todayISO();
    const tile = (n) => {
      const t = routineOf(n), mins = by(n);
      const prog = t && t.t > 0 ? Math.min(100, Math.round(Number((t.days || {})[today] || 0) / t.t * 100)) : null;
      return `<button type="button" class="ctile${mins ? " on" : ""}" data-cqgo="${esc(n)}" aria-label="${esc(n)}${mins ? ", " + hm(mins) + " today" : ""}. Log">
          <b>${esc(n)}</b><span>${mins ? hm(mins) : t && t.t > 0 ? `${rFmt(t, Number((t.days || {})[today] || 0))} / ${rFmt(t, t.t)}${t.kind === "time" ? "" : ""}` : "–"}</span>
          ${prog !== null ? `<i class="cbar"><i style="width:${prog}%"></i></i>` : ""}</button>`;
    };
    const L = cqLast();
    return `
      <section class="card ccard">
        ${dayNav({ label: isToday ? "Today" : esc(fullDate(iso)), atToday: isToday, unit: "day" })}
        <div class="ctot"><b style="color:${has ? met.color : "var(--muted)"}">${has ? hm(shown) : "0m"}</b>
          <button type="button" class="of" data-edit="goal" data-metric="${k}">${goal ? `of <b>${hm(goal)}</b>` : "set a cardio target"}</button></div>
        ${L && L.act && L.min ? `<button type="button" class="crep" id="cqRepeat" aria-label="Log ${esc(L.act)} ${hm(L.min)} again">↻ ${esc(L.act)} ${hm(L.min)}${L.reps ? ` · ${num(L.reps)} reps` : ""}</button>` : ""}
        <div class="ctiles">${cardioActs().map(tile).join("")}
          <button type="button" class="ctile cnew" id="cqNew" aria-label="Add an activity">+</button></div>
        ${acts.length || extra ? `<ul class="sesslist cacts">${acts.map((x) => `
          <li><span>${hm(x.duration_min)}</span>
            <em><b>${esc(x.label || "Cardio")}</b>${Number(x.distance) > 0 ? ` · ${esc(distWords(x.distance))}` : ""}${(() => {
              const r = Number(((x.exercises || [])[0] || {}).top_reps) || 0; return r ? ` · ${num(r)} reps` : ""; })()}</em>
            <button type="button" data-cdel="${x.id}" aria-label="Delete ${esc(x.label || "this activity")}">&times;</button></li>`).join("")}${extra ? `
          <li><span>${hm(extra)}</span><em>From an earlier version</em>
            <button type="button" id="cardioUntyped" aria-label="Delete those minutes">&times;</button></li>` : ""}</ul>` : ""}
        <p class="hint chold">Tap to log · hold to change or remove</p>
      </section>`;
  }

  function logCard(k) {
    const met = M[k];
    const m   = me() || {};
    const iso = entryDay();
    const rec = dayRecord(k);
    const isToday = iso === todayISO();
    const goal = target(m, k);
    if (met.time) return timeCard(k, iso, isToday, m, rec, goal);
    const shown = isToday ? val(m, k) : rec.value;
    const has = isToday ? (k === "steps" ? !!m.steps_logged : shown > 0) : rec.logged;
    // V5.4. Train's minutes are the sum of its workouts: shown, never typed.
    if (k === "train") return `
      <section class="card">
        ${dayNav({ label: isToday ? "Today" : esc(fullDate(iso)), atToday: isToday, unit: "day" })}
        <div class="domino" style="padding-top:10px">
          <b class="big" style="color:${has ? met.color : "var(--muted)"}">${has ? hm(shown) : "0m"}</b>
          <button type="button" class="of" data-edit="goal" data-metric="${k}">${goal ? `of <b>${hm(goal)}</b>` : "set a train target"}</button>
        </div>
        <p class="hint dshint" style="text-align:center">The sum of ${isToday ? "today's" : "this day's"} workouts.</p>
      </section>`;

    // V2.1. The number IS the input. Tap it and the keyboard comes up with
    // the digits selected; leave it and it saves. There is no second box
    // to find and no button to press, which on an iPhone numeric keypad —
    // it has no return key — was always one more thing to hunt for.
    return `
      <section class="card">
        ${dayNav({ label: isToday ? "Today" : esc(fullDate(iso)), atToday: isToday, unit: "day" })}

        <div class="domino" style="padding-top:10px">
          <input class="bigedit" id="steps" type="text" inputmode="numeric"
                 pattern="[0-9]*" autocomplete="off" enterkeyhint="done"
                 style="color:${met.color}"
                 value="${has ? num(Math.round(shown)) : ""}" placeholder="0"
                 data-raw="${has ? Math.round(shown) : ""}"
                 aria-label="${esc(met.label)} on ${isToday ? "today" : esc(fullDate(iso))}, tap to edit">
          <button type="button" class="of" data-edit="goal" data-metric="${k}">${goal
            ? `of <b>${num(Math.round(goal))}</b> ${met.unit}`
            : `set a ${esc(met.label.toLowerCase())} target`}</button>
        </div>

        <p class="hint dshint ${state.msgKind || ""}" id="hint"
           style="text-align:center">${state.msg ? esc(state.msg)
          : has ? "Tap the number to change it."
                : `Tap the number to log ${isToday ? "today" : "this day"}.`}</p>
      </section>`;
  }

  /* ---------- a time, not an amount -----------------------------------
     Rest and Rise are clock readings. The big figure is still the input:
     a native time wheel sits invisibly over it, so one tap edits it the
     same way one tap edits the step count. The button under it stamps
     right now, for the mornings and nights when you are holding the phone
     anyway and do not want to spin a wheel.
     ------------------------------------------------------------------ */
  // "10:42" with a small "pm": the reading, large; the half of the day, quiet.
  function tParts(min) {
    const b = ((Math.round(min) % 1440) + 1440) % 1440, h = Math.floor(b / 60);
    return `${h % 12 || 12}:${pad(b % 60)}<small>${h < 12 ? "am" : "pm"}</small>`;
  }
  // V3.6. A time you tap to change: the reading drawn large, with the
  // phone's own time input laid invisibly over it. On a phone that input
  // opens the system wheel; on a computer showPicker() opens its clock.
  const hhmmOf = (min) => { const b = ((Math.round(min) % 1440) + 1440) % 1440;
    return `${pad(Math.floor(b / 60))}:${pad(b % 60)}`; };
  // V5.3. The time is a button that opens one wheel (hour, minute,
  // AM/PM), the same on iPhone, Android and a laptop. Android's own time
  // field broke logging; ours can't.
  function timePick(k, min, { id = "", cls = "", color = "", label = "", inert = false } = {}) {
    return inert
      ? `<span class="tpk ${cls}" ${color ? `style="color:${color}"` : ""}><span class="tpkv">${tParts(min)}</span></span>`
      : `<button type="button" class="tpk ${cls}" ${id ? `id="${id}"` : ""} ${color ? `style="color:${color}"` : ""}
          data-tpick="${k}" data-v="${Math.round(min)}" aria-label="${esc(label)}"><span class="tpkv">${tParts(min)}</span></button>`;
  }
  function timeCard(k, iso, isToday, m, rec, goal) {
    const met = M[k];
    const local = state.tLocal && state.tLocal.k === k && state.tLocal.iso === iso ? state.tLocal.v : null;
    const v = local !== null ? local : isToday ? rawVal(m, k) : (rec.logged ? rec.value : null);
    const has = v !== null && v !== undefined;
    return `
      <section class="card">
        ${dayNav({ label: isToday ? (met.night ? "Tonight" : "Today") : esc(fullDate(iso)), atToday: isToday, unit: "day", todayWord: met.night ? "tonight" : "today" })}

        ${(() => {
          // V3.6. The big time IS the picker: tap it and the phone's own
          // time wheel opens, the one the Clock app uses. Now covers the
          // usual case in one tap. Unset, it shows your standard faintly,
          // so the wheel opens there.
          const base = has ? v : (hasTarget(m, k) ? goal : (met.night ? 22 * 60 : 7 * 60));
          return `
        <div class="domino tclock" style="padding-top:8px">
          ${timePick(k, base, { id: "tBig", cls: "tbig" + (has ? "" : " unset"), color: met.color,
                                label: `${met.label}${has ? " " + clockWords(v) : ""}. Tap to set the time` })}
          <button type="button" class="of" data-edit="goal" data-metric="${k}">${
            hasTarget(m, k) ? `standard <b>${clockWords(goal)}</b>`
                            : `set a ${esc(met.label.toLowerCase())} target`}</button>
        </div>`; })()}

        <button class="btn" id="stampNow"
                style="width:100%;margin-top:14px;background:${met.color}">Now</button>
        ${has ? `
          <button type="button" class="linkbtn" id="clearDay"
            style="display:block;margin:10px auto 0;font-size:12px;color:var(--muted)">
            Clear this ${met.night ? "night" : "day"}</button>` : ""}

        <p class="hint dshint ${state.msgKind || ""}" id="hint"
           style="text-align:center">${state.msg ? esc(state.msg)
          : has ? "Saved. Tap the time to change it."
                : "Tap Now, or tap the time to pick it."}</p>
      </section>`;
  }

  // What the week adds up to — which is not a sum for every metric. Adding
  // up seven percentages gives 700, and adding up seven bedtimes gives a
  // number of minutes nobody has a use for. Those average instead.
  // How far off, in words. "22 min late" is the sentence; "10:52p" is the
  // arithmetic problem it saves you.
  function offWords(mins) {
    const m = Math.round(Math.abs(mins));
    if (m === 0) return "on target";
    const h = Math.floor(m / 60), r = m % 60;
    const span = h ? (r ? `${h}h ${r}m` : `${h}h`) : `${m} min`;
    return `${span} ${mins > 0 ? "late" : "early"}`;
  }

  function weekWords2(k) {
    const met = M[k] || {};
    const pts = points(k).filter((p) => met.time || met.bits ? p.logged : true);
    if (!pts.length) return "nothing logged this week";
    const sum = pts.reduce((t, p) => t + p.value, 0);
    if (met.bits) return `${Math.round(sum / pts.length)}% average this week`;
    if (met.time) {
      const avg = Math.round(sum / pts.length);
      const goal = target(me() || {}, k);
      // With a target, the average miss says more than the average time.
      // The clock reading is still there, in brackets, for anyone who
      // wants it.
      if (goal || goal === 0) {
        const d = avg - goal;
        return Math.abs(d) < 1
          ? `on target on average \u00b7 ${clockWords(avg)}`
          : `${offWords(d)} on average \u00b7 ${clockWords(avg)}`;
      }
      return `${clockWords(avg)} average this week`;
    }
    // V4.4. Minutes read as hours: 15h 30m, not 930 minutes.
    if (met.unit === "minutes" || met.unit === "min") return `${hm(Math.round(sum))} this week`;
    return `${num(Math.round(sum))} ${met.unit} this week`;
  }

  const trendOpen = () => { try { return localStorage.getItem("fhd.trend") === "open"; } catch { return false; } };
  function graphCard(k) {
    const met = M[k];
    const month = state.range === "month";
    const mb = monthBounds();

    // V2.1. The period control sits at the TOP of the graph, mirroring the
    // day control at the top of the log box: two cards, the same shape,
    // each saying first which slice of time it is showing.
    // V3.3. Folded by default, so the page opens on the thing you came to
    // log. Once opened it stays open, until you fold it again.
    if (!trendOpen()) return `
      <section>
        <div class="section-head">
          <button class="foldbtn" id="trendFold" aria-expanded="false">
            <span class="caret">\u25b8</span><h2>Trend</h2></button>
        </div>
      </section>`;
    return `
      <section>
        <div class="section-head">
          <button class="foldbtn" id="trendFold" aria-expanded="true">
            <span class="caret">\u25be</span><h2>Trend</h2></button>
          <div class="rangetog" role="group" aria-label="How much to show">
            ${[["week","Week"],["month","Month"]].map(([v, l]) =>
              `<button type="button" data-range="${v}"
                aria-pressed="${state.range === v}">${l}</button>`).join("")}
          </div>
        </div>
        <div class="card">
          ${month ? `
            <div class="daynav">
              <button type="button" id="mPrev" aria-label="Previous month">&lsaquo;</button>
              <span class="wlab">${esc(monthWords(mb.first))}</span>
              <button type="button" id="mNext" aria-label="Next month"
                ${mb.first === monthOf(todayISO()) ? "disabled" : ""}>&rsaquo;</button>
            </div>
            ${monthGrid(k)}` : `
            <div class="daynav">
              <button type="button" id="wPrev" aria-label="Previous week">&lsaquo;</button>
              <span class="wlab">${esc(weekWords())}</span>
              <button type="button" id="wNext" aria-label="Next week"
                ${weekBounds().start === thisMonday() ? "disabled" : ""}>&rsaquo;</button>
            </div>
            ${miniChart(k)}
            <p class="hint dshint" style="text-align:center">${esc(weekWords2(k))}</p>`}
        </div>
      </section>`;
  }

  /* ---------- the twelve habits ---------------------------------------
     One integer a night. The score is how many are on, which is the only
     weighting I would trust myself to defend: every item here is something
     a sleep clinic would tell you to do, and inventing a ranking between
     them would be inventing precision.
     ------------------------------------------------------------------ */
  // V3.7. Most nights look like the night before. One tap copies the last
  // logged night onto this one (with Undo); then tap the tiles that differ.
  // It is offered only on a night with nothing logged, so it never
  // overwrites a night you already filled in.
  async function lastNightMask(iso) {
    const res = await call("app_history", { p_code: state.code, p_person: state.meId,
      p_days: 14, p_metric: "sleep_items", p_today: shiftISO(iso, -1) });
    if (res.error) return { err: res.offline ? "No signal. Try again in a moment." : res.error };
    const hit = (res.days || []).filter((d) => d.date < iso && d.logged && Number(d.value) > 0)
      .sort((a, b) => (a.date < b.date ? 1 : -1))[0];
    return hit ? { mask: Number(hit.value), date: hit.date } : { err: "No earlier night to copy yet." };
  }
  async function copyLastNight(iso) {
    const got = await lastNightMask(iso);
    if (got.err) return got;
    const res = await call("app_log", { p_code: state.code, p_person: state.meId,
      p_value: got.mask, p_metric: "sleep_items", p_date: iso, p_tz: deviceTZ() });
    if (res.error) return { err: res.offline ? "No signal. Not saved yet." : res.error };
    armUndo({ key: "sleep_items", date: iso, words: `Recovery: ${shortDay(got.date).replace(/,.*$/, "")} copied` });
    return { ok: true, mask: got.mask };
  }

  /* ---------- V4.2: Diet, three habits --------------------------------
     Longevity is Dr. Michael Greger's Daily Dozen, true to his list: 23
     food servings and his Exercise, plus one box for your supplements.
     25 boxes, one integer a day (bits 0-22 foods, 23 supplements, 24
     exercise). Macros is protein first, calories under it. Weight is a
     weigh-in with body fat: the result the other two answer to. Body
     numbers for the calculators stay on this phone.
     ------------------------------------------------------------------ */
  const DD = [
    { t:"Beans",                  n:3, sub:"½ cup cooked, or ¼ cup hummus",     c:"#7a3b2a" },
    { t:"Berries",                n:1, sub:"½ cup fresh or frozen",             c:"#3b62b0" },
    { t:"Other fruits",           n:3, sub:"1 medium fruit, or ¼ cup dried",    c:"#d0473f" },
    { t:"Cruciferous vegetables", n:1, sub:"½ cup chopped",                     c:"#6aa84f" },
    { t:"Greens",                 n:2, sub:"1 cup raw, or ½ cup cooked",        c:"#2f6b3a" },
    { t:"Other vegetables",       n:2, sub:"½ cup",                             c:"#e07b39" },
    { t:"Flaxseeds",              n:1, sub:"1 tablespoon ground",               c:"#8a5a2b" },
    { t:"Nuts and seeds",         n:1, sub:"¼ cup, or 2 tbsp nut butter",       c:"#a0673a" },
    { t:"Herbs and spices",       n:1, sub:"¼ teaspoon turmeric",               c:"#e0a030" },
    { t:"Whole grains",           n:3, sub:"½ cup cooked, or 1 slice of bread", c:"#d9a520" },
    { t:"Beverages",              n:5, sub:"1 glass (12 oz)",                   c:"#3a9a9e" },
  ];
  (() => { let at = 0; for (const f of DD) { f.at = at; at += f.n; } })();
  // V4.5. Up to five examples per box, from the Daily Dozen's own lists.
  const DD_EX = {
    "Beans": ["Black beans", "Chickpeas or hummus", "Lentils", "Edamame", "Tofu or tempeh"],
    "Berries": ["Blueberries", "Strawberries", "Raspberries", "Blackberries", "Cherries"],
    "Other fruits": ["Apples", "Bananas", "Oranges", "Mangoes", "Kiwis"],
    "Cruciferous vegetables": ["Broccoli", "Brussels sprouts", "Cauliflower", "Cabbage", "Kale"],
    "Greens": ["Spinach", "Arugula", "Romaine", "Swiss chard", "Collard greens"],
    "Other vegetables": ["Carrots", "Beets", "Bell peppers", "Mushrooms", "Sweet potatoes"],
    "Flaxseeds": ["Stirred into oatmeal", "Blended into a smoothie", "On a salad", "In soup", "Baked into muffins"],
    "Nuts and seeds": ["Walnuts", "Almonds", "Chia seeds", "Pumpkin seeds", "Almond butter"],
    "Herbs and spices": ["Turmeric, with black pepper", "Cinnamon", "Ginger", "Garlic", "Cumin"],
    "Whole grains": ["Oats", "Brown rice", "Quinoa", "Whole-wheat pasta", "Barley"],
    "Beverages": ["Water", "Green tea", "Hibiscus tea", "Coffee", "Herbal tea"],
    "Exercise": ["Brisk walking", "Cycling", "Swimming", "Dancing", "Jogging"],
    "Supplements": ["Vitamin B12", "Vitamin D", "Algae omega-3", "Iodine, if you don't use iodized salt"],
  };
  const DD_EXERCISE = { t:"Exercise", n:1, at:24, sub:"90 min moderate, or 40 min vigorous", c:"#4b5563" };
  const DD_SUPPS = 23;
  const DD_MAX = 25;
  const bitOn = (mask, b) => Math.floor(Number(mask || 0) / 2 ** b) % 2 === 1;
  const flipBit = (mask, b) => Number(mask || 0) + (bitOn(mask, b) ? -1 : 1) * 2 ** b;
  // V4.7. Longevity reads as a percent of the 25 boxes, like Recovery.
  const ddPct = (n) => Math.round(Number(n || 0) / DD_MAX * 100);
  function ddCount(mask) {
    let n = 0;
    for (let b = 0; b < DD_MAX; b++) if (bitOn(mask, b)) n++;
    return n;
  }

  /* Supplements worth knowing about. General information from the NIH
     Office of Dietary Supplements and the ISSN, not advice: the page says
     so, and says to check with a clinician. */
  const SUPP_INFO = {
    "Vitamin B12": { why: "Found almost only in animal foods, and needed for nerves and blood. Advised for vegans and for adults over 50.",
      dose: "RDA 2.4 mcg a day. Tablets are absorbed poorly at high doses (about 2% of 500 mcg), so doses far above the RDA are normal. No upper limit is set.",
      src: "NIH Office of Dietary Supplements", url: "https://ods.od.nih.gov/factsheets/VitaminB12-HealthProfessional/" },
    "Vitamin D3": { why: "Bone and muscle health. Few foods have much, and many people get little sun.",
      dose: "RDA 600 IU (15 mcg) to age 70, 800 IU (20 mcg) after. Upper limit 4,000 IU (100 mcg) a day unless a clinician advises more.",
      src: "NIH Office of Dietary Supplements", url: "https://ods.od.nih.gov/factsheets/VitaminD-HealthProfessional/" },
    "Magnesium": { why: "Muscle, nerve and heart function. Many diets fall short.",
      dose: "RDA 310–320 mg (women) and 400–420 mg (men), from all sources. From supplements, 350 mg a day at most; more often causes diarrhea.",
      src: "NIH Office of Dietary Supplements", url: "https://ods.od.nih.gov/factsheets/Magnesium-HealthProfessional/" },
    "Omega-3 (algae or fish oil)": { why: "EPA and DHA, the long-chain fats in oily fish. Algal oil is the plant source.",
      dose: "No recommended amount is set for EPA and DHA. The FDA advises no more than 5 g a day of EPA and DHA combined from supplements.",
      src: "NIH Office of Dietary Supplements", url: "https://ods.od.nih.gov/factsheets/Omega3FattyAcids-HealthProfessional/" },
    "Multivitamin": { why: "A backstop for gaps in the diet, not a substitute for it.",
      dose: "One a day, as labelled. Add up what your other supplements already give (vitamin D, vitamin A, iron) so the total stays sensible.",
      src: "NIH Office of Dietary Supplements", url: "https://ods.od.nih.gov/" },
    "Creatine": { why: "Strength and muscle with training; the most studied sports supplement.",
      dose: "3–5 g a day. Safe in healthy adults in studies up to 5 years; expect 1–2 kg of water weight in the first week.",
      src: "ISSN position stand, 2007", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2048496/" },
  };
  const suppInfo = (name) => SUPP_INFO[Object.keys(SUPP_INFO).find((k) => k.toLowerCase() === String(name || "").trim().toLowerCase())];
  const mySupps = () => { const m = me() || {}; return Array.isArray(m.supps) ? m.supps : []; };

  // The day's values: today's from the state already loaded, any other
  // day's fetched when that day is opened.
  function dietVals() {
    const D = state.diet || {}, m = me() || {};
    if ((D.day || todayISO()) === todayISO())
      return { dd: m.dd_items ?? null, protein: m.protein_g ?? null, kcal: m.kcal ?? null };
    return D.vals || { dd: null, protein: null, kcal: null };
  }
  async function loadDietDay() {
    const D = state.diet;
    if (!D || D.day === todayISO()) return;
    const day = D.day;
    const get = (metric) => call("app_history", { p_code: state.code, p_person: state.meId,
      p_days: 1, p_metric: metric, p_today: day });
    const [a, b, c] = await Promise.all([get("dd_items"), get("protein_g"), get("kcal")]);
    if (state.diet !== D || D.day !== day) return;
    const v = (r) => { const x = r && !r.error && (r.days || [])[0]; return x && x.logged ? Number(x.value) : null; };
    D.vals = { dd: v(a), protein: v(b), kcal: v(c) };
    D.err = a.error || b.error || c.error ? "Could not load that day." : null;
  }
  async function loadWeightHist() {
    const D = state.diet;
    const [w, f] = await Promise.all(["weight_lb", "bodyfat_pct"].map((metric) => call("app_history",
      { p_code: state.code, p_person: state.meId, p_days: 84, p_metric: metric, p_today: todayISO() })));
    if (state.diet !== D) return;
    const pts = (r) => (r && !r.error ? r.days || [] : []).filter((x) => x.logged).map((x) => ({ date: x.date, v: Number(x.value) }));
    D.wh = pts(w); D.fh = pts(f);
  }
  // Write one value for the day on screen, shown at once.
  async function saveDiet(metric, value) {
    const D = state.diet, day = D.day, isToday = day === todayISO();
    const field = { dd_items: "dd", protein_g: "protein", kcal: "kcal" }[metric];
    const m = me();
    if (isToday && m) m[metric] = value; else { D.vals = D.vals || {}; D.vals[field] = value; }
    render();
    const res = await call("app_log", { p_code: state.code, p_person: state.meId,
      p_value: value, p_metric: metric, p_date: day, p_tz: deviceTZ() });
    if (res.error) { D.msg = res.offline ? "No signal. Not saved yet." : res.error; D.msgFor = field; }
    else if (D.msgFor === field) D.msg = null;
    await refresh();
    if (!isToday) await loadDietDay();
    if (state.view === "diet") render();
  }
  async function saveWeigh(metric, value) {
    const D = state.diet, m = me();
    const field = metric === "weight_lb" ? "weight" : "bodyfat";
    if (m) { m[field] = value; if (field === "weight") m.weight_date = todayISO(); }
    render();
    const res = await call("app_log", { p_code: state.code, p_person: state.meId,
      p_value: value, p_metric: metric, p_date: todayISO(), p_tz: deviceTZ() });
    if (res.error) { D.msg = res.offline ? "No signal. Not saved yet." : res.error; D.msgFor = field; }
    else if (D.msgFor === field) D.msg = null;
    await refresh(); await loadWeightHist();
    if (state.view === "diet") render();
  }
  // Most days look like the one before. One tap copies the last logged
  // Daily Dozen onto this day (with Undo); offered only on an empty day.
  async function copyLastDozen(iso) {
    const res = await call("app_history", { p_code: state.code, p_person: state.meId,
      p_days: 14, p_metric: "dd_items", p_today: shiftISO(iso, -1) });
    if (res.error) return { err: res.offline ? "No signal. Try again in a moment." : res.error };
    const hit = (res.days || []).filter((d) => d.date < iso && d.logged && Number(d.value) > 0)
      .sort((a, b) => (a.date < b.date ? 1 : -1))[0];
    if (!hit) return { err: "No earlier day to copy yet." };
    const w = await call("app_log", { p_code: state.code, p_person: state.meId,
      p_value: Number(hit.value), p_metric: "dd_items", p_date: iso, p_tz: deviceTZ() });
    if (w.error) return { err: w.offline ? "No signal. Not saved yet." : w.error };
    armUndo({ key: "dd_items", date: iso, words: `Longevity: ${shortDay(hit.date).replace(/,.*$/, "")} copied` });
    return { ok: true, mask: Number(hit.value) };
  }

  /* The calculators. Mifflin-St Jeor (1990) for resting energy, times a
     standard activity factor, for maintenance; then −500 kcal a day to
     lose fat, +250 to build muscle. Protein: 0.8 g per kg (the RDA) for
     general health, 1.6 g per kg to build muscle, where Morton et al.'s
     2018 meta-analysis found gains level off. Pounds and feet in, kg and
     cm inside. Your last weigh-in fills the weight if none was typed. */
  const ACTIVITY = [
    { f:1.2,   t:"Mostly sitting" },
    { f:1.375, t:"Light: exercise 1–3 days a week" },
    { f:1.55,  t:"Moderate: 3–5 days a week" },
    { f:1.725, t:"Very active: 6–7 days a week" },
    { f:1.9,   t:"Extra: hard training or a physical job" },
  ];
  const LB_KG = 0.45359237;
  const bodyKey = () => "fhd.body." + (state.meId || "anon");
  function getBody() {
    let b = {};
    try { b = JSON.parse(localStorage.getItem(bodyKey()) || "{}") || {}; } catch {}
    b = Object.assign({ sex: "", age: "", ft: "", inch: "", lb: "", act: 2 }, b);
    const m = me() || {};
    if (!b.lb && Number(m.weight) > 0) b.lb = String(Math.round(Number(m.weight)));
    return b;
  }
  function putBody(b) { try { localStorage.setItem(bodyKey(), JSON.stringify(b)); } catch {} }
  const round5 = (x) => Math.round(x / 5) * 5;
  const round50 = (x) => Math.round(x / 50) * 50;
  function proteinOptions(b) {
    const lb = Number(b.lb);
    if (!(lb >= 50 && lb <= 700)) return null;
    const kg = lb * LB_KG;
    return [
      { v: round5(kg * 0.8), t: "General health", d: "0.36 g per lb (0.8 g/kg)" },
      { v: round5(kg * 1.6), t: "Build muscle",   d: "0.73 g per lb (1.6 g/kg)" },
    ];
  }
  function kcalOptions(b) {
    const lb = Number(b.lb), age = Number(b.age), inch = Number(b.ft) * 12 + Number(b.inch || 0);
    if (!(b.sex === "m" || b.sex === "f") || !(lb >= 50 && lb <= 700) || !(age >= 13 && age <= 110)
        || !(inch >= 48 && inch <= 96)) return null;
    const kg = lb * LB_KG, cm = inch * 2.54;
    const bmr = 10 * kg + 6.25 * cm - 5 * age + (b.sex === "m" ? 5 : -161);
    const tdee = bmr * (ACTIVITY[b.act] || ACTIVITY[2]).f;
    const floor = b.sex === "m" ? 1500 : 1200;
    return { bmr: Math.round(bmr), floor, list: [
      { v: round50(tdee - 500), t: "Lose fat",     d: "500 under, about 1 lb a week" },
      { v: round50(tdee),       t: "Maintain",     d: "what your day burns" },
      { v: round50(tdee + 250), t: "Build muscle", d: "250 over, a lean gain" },
    ] };
  }
  const calcStd = (which) => (which === "protein" ? "macros" : "kcal");
  function calcPanel(which) {
    const b = getBody(), m = me() || {};
    const cur = stdOf(m, calcStd(which));
    const field = (id, val, ph, label, w) => `<label class="cbf"${w ? ` style="flex:${w}"` : ""}><span>${label}</span>
      <input class="field" id="${id}" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${esc(val)}" placeholder="${ph}"></label>`;
    const opts = which === "protein" ? proteinOptions(b) : (kcalOptions(b) || {}).list;
    const k = which === "protein" ? null : kcalOptions(b);
    return `
      <div class="calc" id="calc">
        ${which === "kcal" ? `<div class="cbrow"><div class="cbf cbsex"><span>Body</span><div class="range" role="group" aria-label="Body">
            <button type="button" data-csex="m" aria-pressed="${b.sex === "m"}">Male</button>
            <button type="button" data-csex="f" aria-pressed="${b.sex === "f"}">Female</button></div></div></div>
          <div class="cbrow">${field("cAge", b.age, "35", "Age", 1)}${field("cFt", b.ft, "5", "Feet", 1)}${field("cIn", b.inch, "10", "Inches", 1)}${field("cLb", b.lb, "170", "Pounds", 1.2)}</div>
          <div class="cbrow"><label class="cbf"><span>Activity</span>
            <select class="field" id="cAct">${ACTIVITY.map((a, i) =>
              `<option value="${i}"${Number(b.act) === i ? " selected" : ""}>${esc(a.t)}</option>`).join("")}</select></label></div>`
          : `<div class="cbrow">${field("cLb", b.lb, "170", "Your weight, pounds", 1)}</div>`}
        <div class="copts" id="cOpts">${opts ? opts.map((o) => `
          <button type="button" class="copt${Math.round(cur) === o.v ? " on" : ""}" data-cset="${o.v}" data-cfor="${which}">
            <span><b>${esc(o.t)}</b><small>${esc(o.d)}</small></span>
            <em>${num(o.v)}<small>${which === "protein" ? "g" : "kcal"}</small></em></button>`).join("")
          : `<p class="hint">${which === "protein" ? "Type your weight to see your target."
              : "Fill in all five to see your three targets."}</p>`}</div>
        ${k && k.list[0].v < k.floor ? `<p class="hint bad">Lose fat comes out under ${num(k.floor)} kcal. Below that, ask a clinician first.</p>` : ""}
        <p class="cnote">${which === "protein"
          ? "Protein: 0.8 g/kg is the RDA; 1.6 g/kg is where muscle gains level off (Morton 2018)."
          : `Mifflin-St Jeor × your activity. Resting: ${k ? num(k.bmr) + " kcal" : "–"}. An estimate: adjust by what Weight does over 2–3 weeks.`}
          Your body numbers stay on this phone.</p>
      </div>`;
  }

  const DIET_PAGE = { dd: "Longevity", macros: "Macros", weight: "Biomarkers" };   // V5.6
  function dietView() {
    const D = state.diet || (state.diet = { day: todayISO(), page: "dd" });
    const head = `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
      </div>
      <header class="masthead">
        <h1>${DIET_PAGE[D.page] || "Longevity"}</h1>
        <p class="sub">${D.page === "macros" ? "The building block of muscle."
          : D.page === "weight" ? "Weight, and any body number you track."
          : "Dr. Greger&rsquo;s Daily Dozen, every day."}</p>
      </header>`;
    return head + (D.page === "macros" ? macrosBody(D) : D.page === "weight" ? weightBody(D) : longevityBody(D))
      + `<p class="ver">v${APP_VERSION}</p>`;
  }
  const dietMsg = (D, f) => D.msg && D.msgFor === f ? `<p class="hint bad dmsgx" role="status">${esc(D.msg)}</p>` : "";
  // V4.6. The day's back and forward sit inside the card with the day's
  // number, as on every other habit, not in a card of their own.
  const dietDayNav = (D) => {
    const iso = D.day || todayISO(), isToday = iso === todayISO();
    return `${dayNav({ ids: ["ddPrev", "ddNext", "ddToday"], label: isToday ? "Today" : esc(fullDate(iso)), atToday: isToday })}
        ${D.err ? `<p class="hint bad" style="text-align:center">${esc(D.err)}</p>` : ""}`;
  };

  function longevityBody(D) {
    const m = me() || {}, V = dietVals();
    const mask = Number(V.dd || 0), count = V.dd === null ? null : ddCount(mask), std = stdOf(m, "dd");
    const box = (b, label) => `<button type="button" class="ddb${bitOn(mask, b) ? " on" : ""}" data-ddb="${b}"
        aria-pressed="${bitOn(mask, b)}" aria-label="${esc(label)}"></button>`;
    const exI = (t) => `<button type="button" class="spi ddi${D.ddi === t ? " on" : ""}" data-ddi="${esc(t)}" aria-expanded="${D.ddi === t}" aria-label="Examples of ${esc(t)}">i</button>`;
    const exBox = (t) => D.ddi === t ? `<p class="ddex" role="note">${DD_EX[t].map(esc).join(" \u00b7 ")}</p>` : "";
    const row = (f) => `
      <div class="ddrow">
        <span class="ddsw" style="background:${f.c}" aria-hidden="true"></span>
        <span class="ddt"><b>${esc(f.t)}${exI(f.t)}</b><small>${esc(f.sub)}</small></span>
        <span class="ddbx">${Array.from({ length: f.n }, (_, j) => box(f.at + j, `${f.t}, ${f.n > 1 ? `serving ${j + 1} of ${f.n}` : "done"}`)).join("")}</span>
      </div>${exBox(f.t)}`;
    const S = mySupps(), info = D.info;
    const suppLine = (x, i) => {
      const inf = suppInfo(x.n);
      return `<li class="spl">
          <span class="spn">${esc(x.n)}${x.d ? `<small>${esc(x.d)}</small>` : ""}</span>
          ${inf ? `<button type="button" class="spi${info === x.n ? " on" : ""}" data-sinfo="${esc(x.n)}" aria-expanded="${info === x.n}" aria-label="About ${esc(x.n)}">i</button>` : ""}
          ${D.sedit ? `<button type="button" class="tx" data-sdel="${i}" aria-label="Remove ${esc(x.n)}">&times;</button>` : ""}
        </li>${info === x.n && inf ? suppCard(x.n, inf) : ""}`;
    };
    const suggest = Object.keys(SUPP_INFO).filter((n) => !S.some((x) => x.n.toLowerCase() === n.toLowerCase()));
    return `
      <section class="card dsec" id="diet-dd" style="--dc:var(--diet)">
        ${dietDayNav(D)}

  async function loadExtras() {

  /* V4.4. Body fat, pictured. The five ranges are the American Council on

  const BF = {

    m: [["Essential", 2, 5], ["Athletes", 6, 13], ["Fitness", 14, 17], ["Average", 18, 24], ["Obese", 25, null]],

  function bfFigure(sex, f) {

    const hp = (W ? [10.5, 11.8, 13.4, 15.6, 18.5] : [9.6, 10.4, 11.6, 13.4, 16.2])[f];
    const arm = 3.6 + f * 1.3, leg = 5.6 + f * 1.8, c = 30;
    const P = (x, y) => `${x.toFixed(1)} ${y.toFixed(1)}`;

      <circle cx="30" cy="11" r="${7.2 + f * 0.25}"/>
      <line x1="${c - sh + 2}" y1="27" x2="${c - sh - 2 - f}" y2="64" stroke-width="${arm}"/>
      <line x1="${c + sh - 2}" y1="27" x2="${c + sh + 2 + f}" y2="64" stroke-width="${arm}"/>

  function bodyFatGuide(bf) {

          <figcaption><b>${name}</b><span>${hi === null ? `${lo}%+` : `${lo}–${hi}%`}</span></figcaption></figure>`).join("")}</div>`;
    };
    return `<div class="bfg" id="bfGuide">
      ${row("w", "Women")}${row("m", "Men")}
      <p class="cnote">Ranges from the American Council on Exercise. A guide, not a diagnosis: the same percent looks different on different frames, and home scales can read several points off.${bf !== null ? " Yours is highlighted." : ""}</p>

  }

  function sleepView() {
    const m = me() || {};
    const iso = entryDay();
    const isToday = iso === todayISO();
    const mask = Number(isToday ? (m.items || 0) : (dayRecord("sleep").value || 0)) || 0;
    const pct = scorePct(mask);
    // Cut the flat list into the pyramid's rows: one, then two, then
    // three, then four. Anything the list grows past that falls into a
    // final row of its own rather than silently disappearing.
    // V2.5. HABITS is the permanent bit order and never moves; `order`
    // is the family's ranking and decides who sits where. Keeping those
    // apart is what lets the pyramid be rearranged without rewriting a
    // single stored night.
    const ranked = order().map((bit) => ({ ...BYBIT[bit], i: bit }));
    const rows = []; let at = 0;
    for (const n of ROWS) { if (at >= ranked.length) break;
      rows.push(ranked.slice(at, at + n)); at += n; }
    if (at < ranked.length) rows.push(ranked.slice(at));

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <h1>Recovery</h1>
        <p class="sub">The habits behind deep, restoring sleep.</p>

        <div class="domino" style="padding-top:10px">
          <b class="big" style="color:var(--sleep)">${pct}%</b>
          <span class="of" style="text-decoration:none">${scorePts(mask)} of
            ${scoreMax()} points \u00b7 ${bitsOn(mask)} of ${HABITS.length} done</span>
          <button type="button" class="of" data-edit="goal" data-metric="sleep"
            style="display:block;margin:4px auto 0">standard <b>${stdOf(m, "sleep")}%</b></button>
        </div>
        ${mask ? "" : `<button type="button" class="btn" id="sameNight"
          style="width:100%;margin-top:14px;background:var(--sleep)">Same as last night</button>
          <p class="hint dshint ${state.msgKind || ""}" style="text-align:center">${state.msg ? esc(state.msg)
            : "One tap copies last night. Then tap any tile that changed."}</p>`}
      </section>

      <section class="pyramid" id="pyr">
        ${rows.map((row) => `
          <div class="pyrow" style="--n:${row.length}">${row.map((h) => {
            const on = !!((mask >> h.i) & 1);
            const w  = weights()[h.i];
            return `<div class="pcell">
              <button type="button" class="ptile${on ? " on" : ""}"
                      data-habit="${h.i}" aria-pressed="${on}"

              </button>
              <button type="button" class="pinfo" data-flip="${h.i}"
                aria-label="What ${esc(h.t)} means"><span>i</span></button>
            </div>`; }).join("")}</div>`).join("")}

        <!-- The back of a tile. At 85px square a description is unreadable,
             so flipping brings the card forward over the whole pyramid
             instead of turning in place. Same gesture, legible result. -->
        ${state.flip !== null && state.flip !== undefined && BYBIT[state.flip] ? `
          <div class="pscrim" data-shut="1" aria-hidden="true"></div>
          <div class="pback" id="pback" role="dialog" aria-modal="false"
               aria-label="${esc(BYBIT[state.flip].long || BYBIT[state.flip].t)}">
            <span class="pts">${weights()[state.flip]} ${
              weights()[state.flip] === 1 ? "point" : "points"}</span>
            <b>${esc(BYBIT[state.flip].long || BYBIT[state.flip].t)}</b>
            <p>${esc(BYBIT[state.flip].full)}</p>
            <div class="pbackrow">
              <button type="button" class="btn" id="flipHold"
                style="background:var(--sleep)">${
                ((mask >> state.flip) & 1) ? "Done tonight \u2713" : "Mark done tonight"}</button>
              <button type="button" class="btn-quiet" id="flipShut">Close</button>
            </div>
          </div>` : ""}

        <p class="hint" style="text-align:center;margin-top:12px">Tap a habit you did tonight. Tap its corner to read why it matters.</p>
      </section>
