<style>
:root {
  --ground:#f4f6f5; --surface:#ffffff; --surface-2:#eef2f0;
  --ink:#16191b; --ink-2:#454d4a; --muted:#6b7370;
  --line:#e2e6e3; --line-strong:#cfd6d2;
  --accent:#075c48; --series:#0e8a6b; --soft:#d3ece4;
  --train:#c2600f; --train-soft:#f6e3d2;
  --warn:#8a4a12; --warn-soft:#f6ecdf;
  --shadow:0 1px 2px rgba(9,26,21,.05), 0 8px 24px -16px rgba(9,26,21,.25);
  --display:"Newsreader",Georgia,serif;
  --body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground:#101312; --surface:#191d1c; --surface-2:#212725;
    --ink:#f2f4f3; --ink-2:#c8d0cc; --muted:#97a19d;
    --line:#2a302e; --line-strong:#3a423f;
    --accent:#28a583; --series:#28a583; --soft:#1e3b34;
    --train:#cf7a33; --train-soft:#3a2a1a;
    --warn:#e0a86a; --warn-soft:#2a2318;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}

* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; }
img { max-width:100%; }
[hidden] { display:none !important; }

.wrap { max-width:640px; margin:0 auto; padding:28px 18px 72px;
  display:flex; flex-direction:column; gap:26px; }
h1,h2 { margin:0; font-family:var(--display); font-weight:500;
  letter-spacing:-0.01em; text-wrap:balance; }
h1 { font-size:28px; line-height:1.15; }
h2 { font-size:18px; }
p { margin:0; }
a { color:var(--accent); text-underline-offset:3px; }

.eyebrow { font-size:11px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); }
.masthead { display:flex; flex-direction:column; gap:6px; }
.masthead .sub { color:var(--muted); font-size:14px; }

.card { background:var(--surface); border:1px solid var(--line);
  border-radius:14px; padding:18px; box-shadow:var(--shadow); }
.dashed { border:1px dashed var(--line-strong); border-radius:14px; padding:18px; }
.section-head { display:flex; align-items:baseline; justify-content:space-between;
  gap:12px; margin-bottom:10px; }

select, input, button { font-family:inherit; font-size:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

.field { width:100%; border:1px solid var(--line-strong); background:var(--surface);
  border-radius:11px; padding:13px 15px; font-size:16px; }
.btn { border:none; border-radius:11px; background:var(--accent); color:#fff;
  font-weight:600; padding:13px 20px; cursor:pointer; white-space:nowrap; font-size:15px; }
@media (prefers-color-scheme: dark) { .btn { color:#08120f; } }
.btn:disabled { opacity:.4; cursor:default; }
.btn-quiet { background:none; border:1px solid var(--line-strong); color:var(--ink);
  font-weight:500; padding:9px 15px; border-radius:999px; cursor:pointer; font-size:13px; }
.linkbtn { background:none; border:none; padding:0; color:var(--accent);
  font-size:13px; font-weight:500; text-decoration:underline;

/* two boxes, Train left, Steps right */

  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  font-size:18px; line-height:1; padding:2px 5px; }

.setgrid input.on { border-color:transparent; background:var(--train-soft); }
.tick { border:1px solid var(--line-strong); background:none; border-radius:9px;
  height:39px; cursor:pointer; color:var(--muted); font-size:15px; }

@media (prefers-color-scheme: dark) { .tick[aria-pressed="true"] { color:#08120f; } }

.labelin { flex:1; min-width:0; background:none; border:none; padding:0 0 3px;
  font-family:var(--display); font-size:28px; font-weight:500; line-height:1.15;
  letter-spacing:-0.01em; color:var(--train);
  border-bottom:1px dotted var(--line-strong); }

.liftchip { background:none; border:1px solid var(--line); border-radius:999px;
  padding:1px 8px; font-family:var(--mono); font-size:10.5px; color:var(--train);
  cursor:pointer; white-space:nowrap; }

@media (prefers-reduced-motion: no-preference) { .bar > i { transition:width .35s ease; } }

<body>

<div class="wrap" id="app">
  <div class="center"><p class="spinner">Loading&hellip;</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
(() => {
  "use strict";

  // Bump this when the file changes, so you can tell at a glance which
  // version a phone is actually running after a deploy.
  const APP_VERSION = "1.3";

  /* ---------- tiny helpers ---------------------------------------- */
  const app = document.getElementById("app");
  const pad = (n) => String(n).padStart(2, "0");
  const num = (n) => Number(n).toLocaleString();
  const esc = (s) => String(s).replace(/[&<>"']/g,
    (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  const todayISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  };
  const shiftISO = (iso, n) => {
    const d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  const dayLabel = (iso) => String(Number(iso.slice(8)));
  const longLabel = (iso) => new Date(iso + "T00:00:00Z")
    .toLocaleDateString(undefined, { timeZone:"UTC", month:"short", day:"numeric" });

  /* ---------- client ---------------------------------------------- */
  let sb = null;
  const configured =
    SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.length > 20;

  if (configured && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  async function call(fn, args) {
    const { data, error } = await sb.rpc(fn, args);
    if (error) return { error: error.message };
    return data || {};
  }

  // Two metrics. Steps is the family shared score; Train is personal data
  // with an optional target of its own. A third means adding a row here and
  // enabling it in the database, not restructuring anything.
  const M = {
    steps: { key: "steps",     label: "Steps", unit: "steps",   color: "var(--series)", soft: "var(--soft)" },
    train: { key: "train_min", label: "Train", unit: "minutes", color: "var(--train)",  soft: "var(--train-soft)" },
  };

  const mondayOf = (iso) => {
    const d = new Date(iso + "T00:00:00Z");
    return shiftISO(iso, -((d.getUTCDay() + 6) % 7));
  };

  /* ---------- state ------------------------------------------------ */
  const state = {
    code: new URLSearchParams(location.search).get("g"),
    group: null,
    metric: { key:"steps", unit:"steps", default_target:8000 },
    people: [],
    meId: null,
    range: "week",        // "week" (Mon-Sun) | "12w"
    history: { steps: [], train: [] },
    hover: null,
    adding: false,
    bulk: false,
    editing: null,        // null | 'name' | 'goal' | 'traingoal'
    editPerson: null,
    trainGoal: 0,
    entryDate: null,      // null means today
    pickDate: false,
    byDate: new Map(),    // metric + date -> {value, logged}
    msg: null,

    // V1.3. The board is still the whole app for nine people out of ten;
    // Lift is a place you go, not a thing on the board.
    view: "board",        // board | lift | session | detail
    lift: {
      loaded: false,
      labels: [], sessions: [], exercises: [],
      detail: null,       // a session being read
      from: "lift",       // where the reader came from, so Back goes back
      active: null,       // the session being lifted right now
      sync: "idle",       // idle | saving | saved | offline
      msg: null,
    },
  };

  if (state.code) state.code = state.code.toUpperCase();

  const meKey = () => `fhd.me.${state.code}`;
  const loadMe = () => { try { return localStorage.getItem(meKey()); } catch { return null; } };
  const saveMe = (id) => {
    state.meId = id;
    try { localStorage.setItem(meKey(), id); } catch {}
  };
  const me = () => state.people.find((p) => p.id === state.meId) || null;

  /* ---------- data ------------------------------------------------- */
  async function refresh() {
    const res = await call("app_state", {
      p_code: state.code, p_today: todayISO(), p_alt: M.train.key });
    if (res.error) { state.fatal = res.error; render(); return; }
    state.group = res.group;
    state.metric = res.metric || state.metric;
    // Alphabetical in the picker and in the roster, so the two agree and a
    // name is findable without reading the whole list.
    state.people = (res.people || []).slice().sort((a, b) =>
      a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
    if (!state.people.some((p) => p.id === state.meId)) state.meId = loadMe();
    if (!state.people.some((p) => p.id === state.meId)) state.meId = null;
    const mine = me();
    if (mine && mine.alt_target != null) state.trainGoal = Number(mine.alt_target) || 0;
    await loadHistory();
    render();
  }

  // One window, both metrics. The week view is a real Monday-to-Sunday
  // calendar week, so everyone is looking at the same seven columns.
  function weekBounds() {
    const start = mondayOf(entryDay());
    return { start, end: shiftISO(start, 6) };
  }

  async function loadHistory() {
    if (!state.meId) { state.history = { steps: [], train: [] }; return; }
    const week = state.range === "week";
    const anchor = week ? weekBounds().end : todayISO();
    const days = week ? 7 : 84;

    const [a, b] = await Promise.all([
      call("app_history", { p_code:state.code, p_person:state.meId,
        p_days:days, p_metric:M.steps.key, p_today:anchor }),
      call("app_history", { p_code:state.code, p_person:state.meId,
        p_days:days, p_metric:M.train.key, p_today:anchor }),
    ]);
    state.history = {
      steps: a.error ? [] : (a.days || []),
      train: b.error ? [] : (b.days || []),
    };
    for (const k of ["steps","train"])
      for (const d of state.history[k]) state.byDate.set(k + "|" + d.date, d);
  }

  /* ---------- which day is being logged ----------------------------- */
  const entryDay = () => state.entryDate || todayISO();

  // Days outside the loaded window are read one at a time, per metric.
  async function ensureDay(iso) {
    if (!state.meId) return;
    const want = ["steps","train"].filter((k) => !state.byDate.has(k + "|" + iso));
    if (!want.length) return;
    const got = await Promise.all(want.map((k) => call("app_value", {
      p_code: state.code, p_person: state.meId, p_date: iso, p_metric: M[k].key,
    })));
    want.forEach((k, i) => {
      const r = got[i];
      if (!r.error) state.byDate.set(k + "|" + iso,
        { date: iso, value: Number(r.value), logged: !!r.logged });
    });
  }

  // What is already recorded for the day on screen, for one metric.
  function dayRecord(k) {
    const iso = entryDay();
    if (iso === todayISO()) {
      const m = me();
      if (!m) return { value: 0, logged: false };
      return k === "train"
        ? { value: Number(m.alt_value || 0), logged: !!m.alt_logged }
        : { value: Number(m.value || 0),     logged: !!m.logged };
    }
    const d = state.byDate.get(k + "|" + iso);
    return { value: d ? Number(d.value) : 0, logged: d ? d.logged : false };
  }

  /* ---------- chart ------------------------------------------------ */
  const DOW = ["M","T","W","T","F","S","S"];

  function points(k) {
    const rows = state.history[k] || [];
    if (state.range === "week") {
      return rows.map((d, i) => ({
        key:d.date, label:DOW[i] || dayLabel(d.date), value:Number(d.value),
        logged:d.logged, full:longLabel(d.date),
      }));
    }
    const weeks = new Map();
    for (const d of rows) {
      const start = mondayOf(d.date);
      const b = weeks.get(start) || { total:0, logged:0 };
      b.total += Number(d.value);
      if (d.logged) b.logged++;
      weeks.set(start, b);
    }
    return [...weeks.entries()].map(([wk, b]) => ({
      key:wk, label:wk.slice(5).replace("-", "/"), value:Math.round(b.total),
      logged:b.logged > 0, full:"week of " + longLabel(wk),
    }));
  }

  // One mini chart per metric, stacked, sharing the same columns. Steps and
  // minutes cannot honestly share a y-axis, so they each keep their own.
  function miniChart(k) {
    const met = M[k];
    const pts = points(k);
    if (!pts.length) return "";

    const goal = k === "steps"
      ? (state.range === "week" ? Number(me()?.target || 0) : 0)
      : (state.range === "week" ? Number(state.trainGoal || 0) : 0);

    const H = 96, PT = 10, PB = 4, plot = H - PT - PB;
    const peak = Math.max(...pts.map((p) => p.value), goal || 0, 1);
    const max = peak * 1.15;
    const y = (v) => PT + plot - (v / max) * plot;
    const n = pts.length, slot = 100 / n, bw = slot * (state.range === "week" ? 0.52 : 0.6);

    let bars = "";
    pts.forEach((p, i) => {
      const x = i * slot + (slot - bw) / 2;
      const hot = state.hover && state.hover.k === k && state.hover.i === i;
      const dim = state.hover && state.hover.k === k && !hot ? ' opacity="0.4"' : "";
      if (p.value <= 0) {
        bars += `<rect x="${x}" y="${PT}" width="${bw}" height="${plot}" fill="transparent"
                  data-day="${p.key}" data-metric="${k}"></rect>` +
                `<rect x="${x}" y="${y(0)-2}" width="${bw}" height="2" fill="${met.soft}"
                  pointer-events="none"></rect>`;
        return;
      }
      bars += `<rect x="${x}" y="${y(p.value)}" width="${bw}" height="${Math.max(y(0)-y(p.value),2)}"
                rx="${Math.min(bw/2,1.4)}" fill="${met.color}" data-day="${p.key}"
                data-metric="${k}"${dim}></rect>`;
    });

    const goalLine = goal && goal <= max
      ? `<line x1="0" x2="100" y1="${y(goal)}" y2="${y(goal)}" stroke="${met.color}"
           stroke-width="1" stroke-dasharray="3 3" opacity="0.8" vector-effect="non-scaling-stroke"></line>` : "";

    const every = n <= 14 ? 1 : Math.ceil(n / 8);
    const axis = pts.map((p, i) =>
      `<span style="width:${slot}%">${i % every === 0 ? p.label : ""}</span>`).join("");

    let tip = "";
    if (state.hover && state.hover.k === k && pts[state.hover.i]) {
      const p = pts[state.hover.i];
      const left = Math.min(86, Math.max(14, state.hover.i * slot + slot / 2));
      tip = `<div class="tip" style="left:${left}%">${esc(p.full)}<br>
        <b>${p.logged ? num(p.value) + " " + esc(met.unit) : "not recorded"}</b></div>`;
    }

    const total = pts.reduce((t, p) => t + p.value, 0);
    const totalWords = state.range === "week"
      ? `${num(Math.round(total))} this week` : `${num(Math.round(total))} in 12 weeks`;

    // The goal is edited by tapping the line it controls.
    const goalTap = k === "steps"
      ? `<button class="tapedit small" data-edit="goal">goal ${num(Number(me()?.target || 0))}</button>`
      : `<button class="tapedit small" data-edit="traingoal">${
           state.trainGoal ? "goal " + num(state.trainGoal) + " min" : "set a goal"}</button>`;

    return `
      <div class="mini">
        <div class="mini-head">
          <span class="mini-name" style="color:${met.color}">${met.label}</span>
          <span class="mini-total">${totalWords}</span>
        </div>
        <div class="chart" id="chart-${k}" data-chart="${k}">
          <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" role="img"
               aria-label="${met.label} for the period shown">
            <line x1="0" x2="100" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-strong)"
                  stroke-width="1" vector-effect="non-scaling-stroke"></line>
            ${bars}${goalLine}
          </svg>
          <div class="axis">${axis}</div>
          ${tip}
        </div>
        ${state.range === "week" ? `<div class="mini-foot">${goalTap}</div>` : ""}
      </div>`;
  }

  function editTarget() {
    return state.people.find((x) => x.id === (state.editPerson || state.meId)) || null;
  }
  function editSeed() {
    if (state.editing === "name")      return esc(editTarget() ? editTarget().name : "");
    if (state.editing === "traingoal") return state.trainGoal || M.train.default || 40;
    return Math.round(Number(me() ? me().target : 0));
  }
  function editHintText() {
    if (state.editing === "name") {
      const t = editTarget();
      return t && t.id !== state.meId
        ? `Renaming ${esc(t.name)}. Everyone sees the change.`
        : "Changes how you appear to everyone.";
    }
    if (state.editing === "traingoal") return "Your own daily target, in minutes.";
    return "Your own daily target, in steps.";
  }

  function chartsHTML() {
    return miniChart("steps") + miniChart("train");
  }

  function statsHTML() {
    const pts = points("steps");
    const logged = pts.filter((p) => p.logged);
    const avg = logged.length
      ? Math.round(logged.reduce((s, p) => s + p.value, 0) / logged.length) : 0;
    const best = pts.reduce((m, p) => Math.max(m, p.value), 0);
    const goal = Number(me()?.target || 0);
    const hit = (state.range !== "week" || !pts.length || !goal)
      ? null : Math.round((pts.filter((p) => p.value >= goal).length / pts.length) * 100);
    const cells = [
      [num(avg), state.range === "week" ? "Daily average" : "Weekly average"],
      [num(best), state.range === "week" ? "Best day" : "Best week"],
      hit === null ? [String(me()?.streak || 0), "Day streak"] : [hit + "%", "Goal hit"],
    ];
    return `<div class="stats">${cells.map(([v, l]) =>
      `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("")}</div>`;
  }

  /* ---------- home-screen hint --------------------------------------- */
  // Tomorrow's logging should be one tap on an icon, not a hunt through
  // WhatsApp for the link. Shown once per person, then never again.
  function standalone() {
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
  }
  function hintDismissed() {
    try { return localStorage.getItem("fhd.install") === "no"; } catch { return false; }
  }
  function installHint() {
    if (standalone() || hintDismissed() || !me()) return "";
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const how = ios
      ? "tap Share, then <b>Add to Home Screen</b>"
      : "open the browser menu, then <b>Add to Home screen</b>";
    return `<div class="install" id="installHint">
      <p>Make tomorrow one tap: ${how}. The icon opens straight here.</p>
      <button id="installNo" aria-label="Dismiss">&times;</button>
    </div>`;
  }

  /* ---------- the daily WhatsApp message ---------------------------- */
  // Written to be read in a chat, not on a dashboard: the standings first,
  // who is missing second, the link last. Asterisks are WhatsApp bold.
  function dailyMessage() {
    const done = state.people.filter((p) => p.logged || p.alt_logged);
    const missing = state.people.filter((p) => !p.logged && !p.alt_logged);
    const hit = state.people.filter((p) => Number(p.value) >= Number(p.target));
    const day = new Date().toLocaleDateString(undefined,
      { weekday:"short", month:"short", day:"numeric" });

    const lines = [
      `*${state.group.name}* \u00b7 ${day}`,
      `${done.length}/${state.people.length} logged \u00b7 ${hit.length} hit their goal`,
      "",
    ];

    // Ranked here, unlike the app: a chat message is skimmed once and the
    // order is what makes it worth reading. Train is appended only for the
    // people who did some, so ten relatives is not a wall of text.
    const sorted = [...done].sort((a, b) => Number(b.value) - Number(a.value));
    for (const p of sorted) {
      const met = Number(p.value) >= Number(p.target);
      const bits = [];
      if (p.logged)     bits.push(num(p.value));
      if (p.alt_logged) bits.push(num(p.alt_value) + "m train");
      if (Number(p.lift_volume) > 0) bits.push(num(p.lift_volume) + " lb");
      const streak = p.streak > 1 ? `  (${p.streak}-day streak)` : "";
      const pr = Number(p.lift_prs) > 0 ? "  \ud83c\udfc6" : "";
      lines.push(`${met ? "\u2705" : "\u25ab\ufe0f"} ${p.name} \u2014 ${bits.join(" \u00b7 ")}${streak}${pr}`);
    }

    if (missing.length) {
      lines.push("", `Still to log: ${missing.map((p) => p.name).join(", ")}`);
    }
    lines.push("", `${location.origin}${location.pathname}?g=${state.code}`);
    return lines.join("\n");
  }



  /* =================================================================
     V1.3 — LIFT

     The session being lifted lives in localStorage, not in the database.
     A gym is a concrete box with no signal, and a set that fails to save
     is the thing that sends someone back to the app that never loses one.
     So: every tap writes locally and synchronously, and the network is a
     background reconciliation that is allowed to fail. `app_lift_save`
     takes the whole session and is idempotent, so a retry is free.
     ================================================================= */

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
    : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
        const r = Math.random() * 16 | 0;
        return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16); }));

  const liftKey = () => `fhd.lift.${state.code}.${state.meId}`;
  const exKey   = () => `fhd.ex.${state.code}.${state.meId}`;

  function saveLocal() {
    try {
      if (state.lift.active) localStorage.setItem(liftKey(), JSON.stringify(state.lift.active));
      else localStorage.removeItem(liftKey());
    } catch {}
  }
  function loadLocal() {
    try {
      const raw = localStorage.getItem(liftKey());
      state.lift.active = raw ? JSON.parse(raw) : null;
    } catch { state.lift.active = null; }
  }
  function cacheExercises(list) {
    state.lift.exercises = list || [];
    try { localStorage.setItem(exKey(), JSON.stringify(state.lift.exercises)); } catch {}
  }
  function cachedExercises() {
    try { return JSON.parse(localStorage.getItem(exKey()) || "[]"); } catch { return []; }
  }

  const A = () => state.lift.active;

  function elapsedMs(a) { return Math.max(0, (a.endedAt || Date.now()) - a.startedAt); }
  function clock(ms) {
    const s = Math.floor(ms / 1000);
    return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  }
  const durationMin = (a) => Math.max(1, Math.round(elapsedMs(a) / 60000));

  function volumeOf(a) {
    let v = 0;
    for (const x of a.ex) for (const s of x.sets)
      if (s.on) v += (Number(s.w) || 0) * (Number(s.r) || 0);
    return v;
  }
  function doneSets(a) {
    let n = 0;
    for (const x of a.ex) for (const s of x.sets) if (s.on) n++;
    return n;
  }

  // Only confirmed sets cross the wire. A half-filled row you never ticked
  // is a thought, not a lift, and it should not end up in anyone's volume.
  function setsPayload(a) {
    const out = [];
    a.ex.forEach((x, pos) => x.sets.forEach((s, i) => {
      if (!s.on || !String(x.name || "").trim()) return;
      out.push({ position: pos, set_index: i, exercise: x.name.trim(),
                 weight: Number(s.w) || 0, reps: Number(s.r) || 0 });
    }));
    return out;
  }

  let syncTimer = null;
  function queueSync() {
    saveLocal();
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncLift(false), 2500);
  }

  async function syncLift(finish) {
    const a = A();
    if (!a || !state.meId) return {};
    if (finish) { a.endedAt = a.endedAt || Date.now(); a.pendingFinish = true; }
    saveLocal();

    if (!navigator.onLine) { setSync("offline"); return { offline: true }; }
    setSync("saving");

    const res = await call("app_lift_save", {
      p_code: state.code, p_person: state.meId, p_session: a.id,
      p_label: a.label || "", p_date: a.date,
      p_duration: durationMin(a), p_sets: setsPayload(a),
      p_finished: !!(finish || a.pendingFinish),
    });

    if (res.error) { setSync("offline"); return res; }
    setSync("saved");
    return res;
  }

  function setSync(s) {
    state.lift.sync = s;
    const el = document.getElementById("syncChip");
    if (el) { el.className = "sync " + s; el.textContent = syncWords(s); }
  }
  function syncWords(s) {
    return s === "saving" ? "Saving" : s === "saved" ? "Saved"
         : s === "offline" ? "Offline · will sync" : "";
  }

  // A finish that happened with no signal is still a finished workout. It
  // sits in localStorage until the phone is back, then goes up by itself.
  async function flushPending() {
    loadLocal();
    const a = A();
    if (!a || !a.pendingFinish || !navigator.onLine || !state.meId) return;
    const res = await syncLift(true);
    if (!res.error && !res.offline) {
      state.lift.active = null;
      saveLocal();
      state.lift.loaded = false;
    }
  }

  async function loadLift() {
    if (!state.meId) return;
    state.lift.exercises = cachedExercises();
    const res = await call("app_lift_home", {
      p_code: state.code, p_person: state.meId, p_limit: 20 });
    if (res.error) { state.lift.msg = res.error; return; }
    state.lift.labels   = res.labels   || [];
    state.lift.sessions = res.sessions || [];
    if ((res.exercises || []).length) cacheExercises(res.exercises);
    state.lift.loaded = true;
  }

  // Starting a labelled day pulls the last one and lays it out ready to
  // tick off, weights and all. That is the whole reason there is no
  // template table: the last session already is the template.
  async function startSession(label) {
    const a = { id: uuid(), label: label || "", date: todayISO(),
                startedAt: Date.now(), endedAt: null, ex: [], pendingFinish: false };

    if (label && navigator.onLine) {
      const res = await call("app_lift_detail", {
        p_code: state.code, p_person: state.meId, p_label: label });
      const prev = res && res.session;
      if (prev && prev.sets && prev.sets.length) {
        const byPos = new Map();
        for (const s of prev.sets) {
          if (!byPos.has(s.position)) byPos.set(s.position, { name: s.exercise, sets: [] });
          byPos.get(s.position).sets.push({ w: Number(s.weight) || 0, r: Number(s.reps) || 0, on: false });
        }
        a.ex = [...byPos.entries()].sort((x, y) => x[0] - y[0]).map(([, v]) => v);
      }
    }

    state.lift.active = a;
    saveLocal();
    state.view = "session";
    render();
  }

  function addExercise(name) {
    const a = A(); if (!a) return;
    const nm = String(name || "").trim();
    if (!nm) return;
    // Last time you did this movement, whatever day it was on.
    const prev = lastSetsFor(nm);
    a.ex.push({ name: nm, sets: prev.length ? prev : [{ w: 0, r: 0, on: false }] });
    queueSync();
  }

  function lastSetsFor(name) {
    const key = name.toLowerCase();
    for (const s of state.lift.sessions) {
      const hit = (s.exercises || []).find((e) => String(e.exercise).toLowerCase() === key);
      if (hit) {
        return Array.from({ length: Math.max(1, hit.sets) },
          () => ({ w: Number(hit.top_weight) || 0, r: Number(hit.top_reps) || 0, on: false }));
      }
    }
    return [];
  }

  /* ---------- lift views ------------------------------------------- */

  function agoWords(iso) {
    const d = Math.round((new Date(todayISO() + "T00:00:00Z") -
                          new Date(iso + "T00:00:00Z")) / 86400000);
    if (d <= 0) return "today";
    if (d === 1) return "yesterday";
    if (d < 7)  return d + " days ago";
    if (d < 14) return "last week";
    return Math.floor(d / 7) + " weeks ago";
  }
  const fullDate = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString(undefined,
    { timeZone: "UTC", weekday: "long", month: "short", day: "numeric" });

  function sessionCard(s, clickable) {
    const rows = (s.exercises || []).map((e) => `
      <tr><td class="nm">${e.sets} &times; ${esc(e.exercise)}</td>
          <td>${num(e.top_weight)} lb &times; ${e.top_reps}</td></tr>`).join("");
    return `
      <${clickable ? "button" : "div"} class="hcard" ${clickable ? `data-open="${s.id}"` : ""}>
        <h3>${esc(s.label || "Workout")}</h3>
        <p class="when">${esc(fullDate(s.entry_date))}</p>
        <div class="hmeta">
          <span><b>${s.duration_min}m</b></span>
          <span><b>${num(s.volume)}</b> lb</span>
          <span${s.pr_count > 0 ? ' style="color:var(--train)"' : ""}><b>${s.pr_count}</b> PR${
            s.pr_count === 1 ? "" : "s"}</span>
        </div>
        ${rows ? `<table class="htab"><thead><tr><th>Exercise</th><th>Best set</th></tr></thead>
                  <tbody>${rows}</tbody></table>` : ""}
      </${clickable ? "button" : "div"}>`;
  }

  function liftHome() {
    const a = A();
    const resume = a && !a.pendingFinish ? `
      <div class="install" style="background:var(--train-soft)">
        <p><b style="color:var(--train)">${esc(a.label || "Workout")} in progress</b> &mdash;
           ${doneSets(a)} set${doneSets(a) === 1 ? "" : "s"} logged.</p>
        <button class="btn-quiet" id="resume" style="flex:none">Resume</button>
      </div>` : "";

    const tiles = state.lift.labels.length ? `
      <section>
        <div class="section-head"><h2>Your workouts</h2>
          <span class="eyebrow">tap to start</span></div>
        <div class="tiles">${state.lift.labels.map((l) => `
          <button class="tile" data-start="${esc(l.label)}">
            <b>${esc(l.label)}</b>
            <span class="ex">${esc(l.preview || "")}</span>
            <span class="ago">${esc(agoWords(l.last_date))}</span>
          </button>`).join("")}</div>
      </section>` : "";

    const history = state.lift.sessions.length
      ? `<section>
           <div class="section-head"><h2>History</h2>
             <span class="eyebrow">${state.lift.sessions.length} logged</span></div>
           ${state.lift.sessions.map((s) => sessionCard(s, true)).join("")}
         </section>`
      : `<div class="dashed"><p class="empty">Nothing logged yet.<br>
           Start a workout and it appears here, with your best set for every
           exercise.</p></div>`;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; ${esc(state.group.name)}</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <h1 style="color:var(--train)">Lift</h1>
        <p class="sub">Your log. The family sees the totals, not every set.</p>
      </header>

      ${resume}

      <button class="btn" id="startEmpty" style="width:100%;background:var(--train)">
        Start an empty workout</button>

      ${tiles}
      ${history}

      <p class="ver">v${APP_VERSION}</p>`;
  }

  function sessionView() {
    const a = A();
    if (!a) { state.view = "lift"; return liftHome(); }

    const blocks = a.ex.map((x, i) => exBlock(x, i)).join("") ||
      `<div class="dashed"><p class="empty">No exercises yet.<br>
         Add the first one below.</p></div>`;

    const datalist = `<datalist id="exlist">${
      state.lift.exercises.map((e) => `<option value="${esc(e)}"></option>`).join("")}</datalist>`;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; Lift</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <div style="display:flex;align-items:center;gap:10px">
          <h1 style="flex:1;min-width:0">
            <input id="labelIn" class="labelin" value="${esc(a.label)}" maxlength="24"
                   placeholder="Name this day" autocomplete="off"
                   aria-label="What to call this workout"></h1>
          <button class="btn" id="finish" style="padding:10px 18px">Finish</button>
        </div>
        <div class="timer">
          <b id="elapsed">${clock(elapsedMs(a))}</b>
          <span id="sessTotals">${num(volumeOf(a))} lb &middot; ${doneSets(a)} sets</span>
        </div>
      </header>

      <div id="blocks">${blocks}</div>

      <div class="exadd">
        <input class="field" id="exName" list="exlist" placeholder="Add an exercise"
               autocomplete="off" maxlength="60" aria-label="Exercise name">
        <button class="btn" id="exAdd" style="background:var(--train)">Add</button>
      </div>
      ${datalist}

      <p class="hint" id="liftHint">${esc(state.lift.msg || "")}</p>

      <button class="linkbtn" id="scrap" style="color:var(--muted);text-align:left;
        align-self:flex-start;font-size:12px">Discard this workout</button>

      <p class="ver">v${APP_VERSION}</p>`;
  }

  function exBlock(x, i) {
    const rows = x.sets.map((s, j) => `
      <span class="ix">${j + 1}</span>
      <input type="number" inputmode="decimal" data-ex="${i}" data-set="${j}" data-f="w"
             class="${s.on ? "on" : ""}" value="${s.w || ""}" placeholder="0"
             aria-label="Set ${j + 1} weight">
      <input type="number" inputmode="numeric" data-ex="${i}" data-set="${j}" data-f="r"
             class="${s.on ? "on" : ""}" value="${s.r || ""}" placeholder="0"
             aria-label="Set ${j + 1} reps">
      <button class="tick" data-tick="${i}:${j}" aria-pressed="${!!s.on}"
              aria-label="Mark set ${j + 1} done">&#10003;</button>`).join("");

    return `
      <div class="exblock" id="ex-${i}">
        <div class="exhead">
          <b>${esc(x.name)}</b>
          <button class="xbtn" data-delex="${i}" aria-label="Remove ${esc(x.name)}">&times;</button>
        </div>
        <div class="setgrid">
          <span class="hd">#</span><span class="hd">lb</span>
          <span class="hd">reps</span><span class="hd"></span>
          ${rows}
        </div>
        <button class="addset" data-addset="${i}">+ Add set</button>
      </div>`;
  }

  function detailView() {
    const s = state.lift.detail;
    if (!s) { state.view = "lift"; return liftHome(); }
    const byPos = new Map();
    for (const r of (s.sets || [])) {
      if (!byPos.has(r.position)) byPos.set(r.position, { name: r.exercise, sets: [] });
      byPos.get(r.position).sets.push(r);
    }
    const blocks = [...byPos.entries()].sort((a, b) => a[0] - b[0]).map(([, x]) => `
      <div class="exblock">
        <div class="exhead"><b>${esc(x.name)}</b></div>
        <table class="htab"><tbody>${x.sets.map((r, i) => `
          <tr><td class="nm">Set ${i + 1}</td>
              <td>${num(r.weight)} lb &times; ${r.reps}</td></tr>`).join("")}</tbody></table>
      </div>`).join("");

    const mine = s.person_id === state.meId;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; Back</button>
      </div>

      <header class="masthead">
        <h1 style="color:var(--train)">${esc(s.label || "Workout")}</h1>
        <p class="sub">${esc(s.person)} &middot; ${esc(fullDate(s.entry_date))}</p>
        <div class="timer" style="margin-top:8px">
          <span><b>${s.duration_min}m</b></span>
          <span><b>${num(s.volume)}</b> lb</span>
          <span${s.pr_count > 0 ? ' style="color:var(--train)"' : ""}>
            <b>${s.pr_count}</b> PR${s.pr_count === 1 ? "" : "s"}</span>
        </div>
      </header>

      ${blocks}

      ${mine ? `<button class="linkbtn" id="delSession" style="color:var(--warn)">
        Delete this workout</button>` : ""}

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- lift painting ----------------------------------------
     Repaint the smallest thing that changed. V1.2 taught this the hard
     way: a full re-render while someone is typing throws the number away.
     ------------------------------------------------------------------ */

  let tick = null;
  function startTicking() {
    stopTicking();
    tick = setInterval(() => {
      const a = A(); const el = document.getElementById("elapsed");
      if (!a || !el) return stopTicking();
      el.textContent = clock(elapsedMs(a));
    }, 1000);
  }
  function stopTicking() { if (tick) { clearInterval(tick); tick = null; } }

  function paintTotals() {
    const a = A(); const el = document.getElementById("sessTotals");
    if (a && el) el.innerHTML = `${num(volumeOf(a))} lb &middot; ${doneSets(a)} sets`;
  }

  function paintEx(i) {
    const a = A(); if (!a) return;
    const host = document.getElementById("ex-" + i);
    if (!host) return;
    const frag = document.createElement("div");
    frag.innerHTML = exBlock(a.ex[i], i);
    host.replaceWith(frag.firstElementChild);
    wireExBlock(i);
    paintTotals();
  }

  function wireExBlock(i) {
    const host = document.getElementById("ex-" + i);
    if (!host) return;
    const a = A();

    host.querySelectorAll("input[data-ex]").forEach((el) => {
      el.addEventListener("input", () => {
        const s = a.ex[+el.dataset.ex].sets[+el.dataset.set];
        s[el.dataset.f] = el.value === "" ? 0 : Number(el.value);
        paintTotals();
        queueSync();
      });
    });

    host.querySelectorAll("[data-tick]").forEach((el) => {
      el.addEventListener("click", () => {
        const [xi, si] = el.dataset.tick.split(":").map(Number);
        const s = a.ex[xi].sets[si];
        s.on = !s.on;
        el.setAttribute("aria-pressed", String(s.on));
        host.querySelectorAll(`input[data-ex="${xi}"][data-set="${si}"]`)
            .forEach((f) => f.classList.toggle("on", s.on));
        paintTotals();
        queueSync();
      });
    });

    const add = host.querySelector("[data-addset]");
    if (add) add.addEventListener("click", () => {
      const sets = a.ex[i].sets;
      const last = sets[sets.length - 1];
      sets.push({ w: last ? last.w : 0, r: last ? last.r : 0, on: false });
      queueSync();
      paintEx(i);
      const rows = document.querySelectorAll(`#ex-${i} input[data-f="w"]`);
      const f = rows[rows.length - 1];
      if (f) { f.focus(); f.select(); }
    });

    const del = host.querySelector("[data-delex]");
    if (del) del.addEventListener("click", () => {
      a.ex.splice(i, 1);
      queueSync();
      render();
    });
  }

  function wireLift() {
    on("back", "click", () => {
      stopTicking();
      // A session opened from the board belongs to the board. Sending
      // someone who tapped a relative's volume chip into their own Lift
      // history is a small thing that feels like being lost.
      if (state.view === "detail") {
        state.lift.detail = null;
        state.view = state.lift.from === "board" ? "board" : "lift";
      }
      else if (state.view === "session") state.view = "lift";
      else state.view = "board";
      render();
    });

    if (state.view === "lift") {
      on("startEmpty", "click", () => startSession(""));
      on("resume", "click", () => { state.view = "session"; render(); });
      document.querySelectorAll("[data-start]").forEach((el) =>
        el.addEventListener("click", () => startSession(el.dataset.start)));
      document.querySelectorAll("[data-open]").forEach((el) =>
        el.addEventListener("click", () => openSession(el.dataset.open)));
    }

    if (state.view === "session") {
      const a = A();
      a.ex.forEach((_, i) => wireExBlock(i));
      startTicking();

      on("exAdd", "click", () => {
        const f = document.getElementById("exName");
        const nm = (f.value || "").trim();
        if (!nm) { f.focus(); return; }
        addExercise(nm);
        f.value = "";
        render();
      });
      on("exName", "keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); document.getElementById("exAdd").click(); }
      });

      // The name is just a field. No prompt, no modal, no editor state —
      // a label you can only set at the start is a label you get wrong.
      on("labelIn", "input", (e) => { a.label = e.target.value.slice(0, 24); queueSync(); });

      on("finish", "click", async (e) => {
        if (doneSets(a) === 0) {
          state.lift.msg = "Tick at least one set before finishing.";
          const h = document.getElementById("liftHint");
          if (h) h.textContent = state.lift.msg;
          return;
        }
        e.target.disabled = true;
        stopTicking();
        const res = await syncLift(true);

        // A finish never fails. If the network is down, or the call errors
        // for any other reason, the workout is already on the phone and
        // marked finished — it goes up on the next load or reconnect. The
        // one thing that must never happen is a finished session held
        // hostage on a screen someone is trying to leave.
        if (res.offline || res.error) {
          state.lift.msg = "Saved on this phone. It will upload by itself.";
          state.view = "lift";
          state.lift.loaded = false;
          render();
          return;
        }
        const prs = Number(res.pr_count) || 0;
        state.lift.active = null;
        saveLocal();
        state.lift.msg = prs ? `Logged. ${prs} personal record${prs === 1 ? "" : "s"}.` : null;
        state.view = "lift";
        await loadLift();
        render();
        refresh();                       // the board now owes you Train minutes
      });

      on("scrap", "click", () => {
        if (!confirm("Throw this workout away? It is not saved anywhere else.")) return;
        stopTicking();
        state.lift.active = null;
        saveLocal();
        state.view = "lift";
        render();
      });
    }

    if (state.view === "detail") {
      on("delSession", "click", async () => {
        const s = state.lift.detail;
        if (!confirm("Delete this workout? Your Train minutes for that day go back down.")) return;
        const res = await call("app_lift_delete", {
          p_code: state.code, p_person: state.meId, p_session: s.id });
        if (res.error) { alert(res.error); return; }
        state.lift.detail = null;
        state.view = "lift";
        await loadLift();
        render();
        refresh();
      });
    }
  }

  async function openSession(id) {
    const res = await call("app_lift_detail", { p_code: state.code, p_session: id });
    if (res.error || !res.session) return;
    state.lift.detail = res.session;
    state.lift.from = "lift";
    state.view = "detail";
    render();

  async function openLift() {
    if (!state.meId) return;
    stopTicking();
    loadLocal();
    state.view = "lift";
    render();                 // paint immediately; the list can arrive after
    await loadLift();
    render();
  }

  /* ---------- render + events -------------------------------------- */
  function render() {
    if (!configured) { app.innerHTML = notConfigured(); return; }
    if (state.fatal) {
      app.innerHTML = `<div class="banner">${esc(state.fatal)}</div>
        <p style="margin-top:16px"><a href="${location.pathname}">Start over</a></p>`;
      return;
    }
    if (!(state.code && state.group)) { app.innerHTML = landing(); wire(); return; }

    if (state.view === "lift")    { app.innerHTML = liftHome();    wireLift(); return; }
    if (state.view === "session") { app.innerHTML = sessionView(); wireLift(); return; }
    if (state.view === "detail")  { app.innerHTML = detailView();  wireLift(); return; }

    app.innerHTML = groupView();
    wire();

  // Only the chart redraws when the pointer moves across it. Nothing else
  // on the page is touched, so a half-typed number survives.
  // Each mini chart repaints only itself. Nothing else on the page is
  // touched, so a half-typed number survives a finger crossing the chart.
  function paintChart(k) {
    const host = document.getElementById("chart-" + k);
    if (!host) return;
    const holder = host.parentElement;
    const frag = document.createElement("div");
    frag.innerHTML = miniChart(k);
    holder.replaceWith(frag.firstElementChild);
    wireChart(k);
  }

  function wireCharts() { wireChart("steps"); wireChart("train"); }

  function wireChart(k) {
    const host = document.getElementById("chart-" + k);
    const svg = host && host.querySelector("svg");
    if (!svg) return;
    const n = points(k).length;

    svg.addEventListener("pointermove", (e) => {
      const r = svg.getBoundingClientRect();
      const i = Math.min(n - 1, Math.max(0,
        Math.floor(((e.clientX - r.left) / r.width) * n)));
      if (!state.hover || state.hover.k !== k || state.hover.i !== i) {
        const prev = state.hover;
        state.hover = { k, i };
        if (prev && prev.k !== k) paintChart(prev.k);
        paintChart(k);
      }
    });
    svg.addEventListener("pointerleave", () => {
      if (!state.hover || state.hover.k !== k) return;
      state.hover = null; paintChart(k);
    });

    // Tap a bar to log or correct that day.
    svg.addEventListener("click", async (e) => {
      const iso = e.target && e.target.dataset ? e.target.dataset.day : null;
      if (!iso || state.range !== "week") return;
      state.entryDate = iso === todayISO() ? null : iso;
      state.msg = null;
      await ensureDay(iso);
      render();
      document.getElementById("steps")?.focus();
    });

    const g = host.parentElement.querySelector("[data-edit]");
    if (g) g.addEventListener("click", () => openEditor(g.dataset.edit));
  }

  function openEditor(kind, personId) {
    state.editing = kind;
    state.editPerson = personId || state.meId;

    if (f) { f.focus(); f.select(); }

  function on(id, ev, fn) {
    const el = document.getElementById(id);
    if (el) el.addEventListener(ev, fn);

  function wire() {
    /* landing */
    on("open", "click", () => {
      const c = (document.getElementById("code").value || "").trim().toUpperCase();
      if (!c) { state.msg = "Enter the code your family sent you."; render(); return; }
      location.search = "?g=" + encodeURIComponent(c);
    });
    on("code", "keydown", (e) => { if (e.key === "Enter") document.getElementById("open").click(); });

    on("create", "click", async (e) => {
      const name = (document.getElementById("gname").value || "").trim();
      const tz = document.getElementById("gtz").value;
      if (!name) { state.msg = "Give the group a name."; render(); return; }
      e.target.disabled = true;
      const res = await call("app_create_group", { p_name: name, p_timezone: tz });
      if (res.error) { state.msg = res.error; e.target.disabled = false; render(); return; }
      location.search = "?g=" + res.code;
    });

    /* group */
    on("who", "change", async (e) => {
      saveMe(e.target.value);
      state.hover = null; state.msg = null;
      await loadHistory();
      render();
    });

    on("addBtn", "click", () => { state.adding = !state.adding; state.editing = null; render();
      const el = document.getElementById("addName"); if (el) el.focus(); });

    on("addSave", "click", async (e) => {
      const name = (document.getElementById("addName").value || "").trim();
      const hint = document.getElementById("addHint");
      if (!name) { hint.textContent = "Type a name first."; return; }
      e.target.disabled = true;
      const res = await call("app_add_person", { p_code: state.code, p_name: name });
      if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      saveMe(res.id);
      state.adding = false;
      await refresh();
    });
    on("addName", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("addSave").click();
      if (e.key === "Escape") { state.adding = false; render(); }
    });

    on("save", "click", async (e) => {
      const rawS = (document.getElementById("steps").value || "").replace(/[^0-9]/g, "");
      const rawT = (document.getElementById("train").value || "").replace(/[^0-9]/g, "");
      if (rawS === "" && rawT === "") {
        state.msg = "Enter a number in either box."; state.msgKind = "bad"; render(); return;
      }
      e.target.disabled = true;
      const jobs = [];
      if (rawS !== "") jobs.push(call("app_log", { p_code:state.code, p_person:state.meId,
        p_value:Number(rawS), p_metric:M.steps.key, p_date:entryDay() }));
      if (rawT !== "") jobs.push(call("app_log", { p_code:state.code, p_person:state.meId,
        p_value:Number(rawT), p_metric:M.train.key, p_date:entryDay() }));
      const out = await Promise.all(jobs);
      const bad = out.find((r) => r.error);
      state.msg = bad ? bad.error : "Saved. Your family can see it.";
      state.msgKind = bad ? "bad" : "ok";
      state.byDate.delete("steps|" + entryDay());
      state.byDate.delete("train|" + entryDay());
      if (!bad) state.entryDate = null;
      await refresh();
      setTimeout(() => { state.msg = null; state.msgKind = null; }, 100);
    });

    for (const id of ["steps","train"])
      on(id, "keydown", (e) => { if (e.key === "Enter") document.getElementById("save").click(); });

    document.querySelectorAll(".range button").forEach((b) => {
      b.addEventListener("click", async () => {
        state.range = b.dataset.range;
        state.hover = null;
        await loadHistory();
        render();
      });
    });

    wireCharts();

    on("installNo", "click", () => {
      try { localStorage.setItem("fhd.install", "no"); } catch {}
      const el = document.getElementById("installHint");
      if (el) el.remove();
    });

    // Land with the cursor already in the number box on an unlogged day.
    // iOS will not raise the keyboard without a tap, but the box is focused
    // and scrolled to, so the tap target is unmissable.
    const box = document.getElementById("steps");
    if (box && me() && !me().logged && state.hover === null) {
      try { box.focus({ preventScroll: false }); } catch {}
    }

    on("renameSave", "click", async (e) => {
      const name = (document.getElementById("renameName").value || "").trim();
      const hint = document.getElementById("renameHint");
      if (!name) { hint.textContent = "A name cannot be blank."; return; }
      e.target.disabled = true;
      const res = await call("app_rename_person", {
        p_code: state.code, p_person: state.meId, p_name: name,
      });
      if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      state.renaming = false;
      await refresh();
    });
    on("renameName", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("renameSave").click();
      if (e.key === "Escape") { state.renaming = false; render(); }
    });

    on("dayBtn", "click", () => { state.pickDate = !state.pickDate; state.msg = null; render(); });

    // Tap your own name or your own target in the roster.
    document.querySelectorAll('[data-edit]:not(.legend [data-edit])').forEach((el) => {
      el.addEventListener("click", () => openEditor(el.dataset.edit, el.dataset.person));
    });

    on("editCancel", "click", () => { state.editing = null; render(); });

    on("editSave", "click", async (e) => {
      const kind = state.editing;
      const raw = (document.getElementById("editVal").value || "").trim();
      const hint = document.getElementById("editHint");

      if (kind === "traingoal") {
        const t = Number(raw.replace(/[^0-9]/g, ""));
        if (!t) { hint.textContent = "Enter a number of minutes."; return; }
        e.target.disabled = true;
        const res = await call("app_set_goal", {
          p_code: state.code, p_person: state.meId, p_target: t, p_metric: M.train.key,
        });
        if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
        state.trainGoal = t;
      } else if (kind === "goal") {
        const t = Number(raw.replace(/[^0-9]/g, ""));
        if (!t) { hint.textContent = "Enter a target above zero."; return; }
        e.target.disabled = true;
        const res = await call("app_set_goal", {
          p_code: state.code, p_person: state.meId, p_target: t,
        });
        if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      } else {
        if (!raw) { hint.textContent = "A name cannot be blank."; return; }
        e.target.disabled = true;
        const res = await call("app_rename_person", {
          p_code: state.code, p_person: state.editPerson || state.meId, p_name: raw,
        });
        if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      }
      state.editing = null;
      await refresh();
    });

    on("editVal", "keydown", (e) => {
      if (e.key === "Enter") document.getElementById("editSave").click();
      if (e.key === "Escape") { state.editing = null; render(); }
    });

    on("dateBtn", "click", () => { state.pickDate = !state.pickDate; state.msg = null; render(); });

    on("dateInput", "change", async (e) => {
      const iso = e.target.value;
      if (!iso) return;
      state.entryDate = iso === todayISO() ? null : iso;
      state.pickDate = false;
      state.msg = null;
      await ensureDay(iso);
      if (state.range === "week") await loadHistory();   // jump the chart to that week
      render();
    });

    on("bulkBtn", "click", () => { state.bulk = !state.bulk; render(); });

    on("bulkSave", "click", async (e) => {
      const rows = [...document.querySelectorAll("[data-bulk]")]
        .map((el) => ({ id: el.dataset.bulk, value: el.value.replace(/[^0-9]/g, "") }))
        .filter((r) => r.value !== "");
      const hint = document.getElementById("bulkHint");
      if (!rows.length) { hint.textContent = "Nothing filled in yet."; return; }
      e.target.disabled = true;
      const res = await call("app_log_many", {
        p_code: state.code, p_entries: rows, p_date: todayISO() });
      if (res.error) { hint.textContent = res.error; e.target.disabled = false; return; }
      state.bulk = false;
      await refresh();
    });

    on("liftOpen", "click", (e) => { e.preventDefault(); openLift(); });

    // Tap someone's volume chip to read the session behind it. The board
    // stays a scoreboard; the detail is one tap away for whoever wants it.
    document.querySelectorAll("[data-lifter]").forEach((el) => {
      el.addEventListener("click", async () => {
        const res = await call("app_lift_detail", {
          p_code: state.code, p_person: el.dataset.lifter });
        if (res.error || !res.session) return;
        state.lift.detail = res.session;
        state.lift.from = "board";
        state.view = "detail";
        render();
      });
    });

    on("waShare", "click", () => {
      // WhatsApp's official click-to-chat link. No API, no cost, no bot:
      // it opens WhatsApp with the message written, and you pick the group.
      window.open("https://wa.me/?text=" + encodeURIComponent(dailyMessage()), "_blank");
    });

}

  /* ---------- boot -------------------------------------------------- */
  (async () => {
    if (!configured) { render(); return; }
    if (!sb) {
      state.fatal = "Could not load the database library. Check your connection and reload.";
      render(); return;
    }
    if (state.code) {
      state.meId = loadMe();
      await refresh();
      // A workout finished with no signal uploads itself the moment there
      // is one — on this load, and again whenever the phone reconnects.
      loadLocal();
      flushPending().then(() => { if (state.view === "board") render(); });
      window.addEventListener("online", () => {
        flushPending().then(() => { if (state.view !== "session") render(); });
      });
    } else {
      render();
    }
  })();
})();
</script>
</body>
</html>
