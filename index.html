<style>
:root {
  --ground:#f4f6f5; --surface:#ffffff; --surface-2:#eef2f0;
  --ink:#16191b; --ink-2:#454d4a; --muted:#6b7370;
  --line:#e2e6e3; --line-strong:#cfd6d2;
  --accent:#075c48; --series:#0e8a6b; --soft:#d3ece4;
  --train:#c2600f; --train-soft:#f6e3d2;
  --swim:#1f6f9b;  --swim-soft:#d9e9f3;
  --warn:#8a4a12; --warn-soft:#f6ecdf;
  --shadow:0 1px 2px rgba(9,26,21,.05), 0 8px 24px -16px rgba(9,26,21,.25);
  --display:"Newsreader",Georgia,serif;
  --body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground:#101312; --surface:#191d1c; --surface-2:#212725;
    --ink:#f2f4f3; --ink-2:#c8d0cc; --muted:#97a19d;
    --line:#2a302e; --line-strong:#3a423f;
    --accent:#28a583; --series:#28a583; --soft:#1e3b34;
    --train:#cf7a33; --train-soft:#3a2a1a;
    --swim:#59a6cf;  --swim-soft:#16303e;
    --warn:#e0a86a; --warn-soft:#2a2318;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}

* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; }
img { max-width:100%; }
[hidden] { display:none !important; }

.wrap { max-width:640px; margin:0 auto; padding:28px 18px 72px;
  display:flex; flex-direction:column; gap:26px; }
h1,h2 { margin:0; font-family:var(--display); font-weight:500;
  letter-spacing:-0.01em; text-wrap:balance; }
h1 { font-size:28px; line-height:1.15; }
h2 { font-size:18px; }
p { margin:0; }
a { color:var(--accent); text-underline-offset:3px; }

.eyebrow { font-size:11px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); }
.masthead { display:flex; flex-direction:column; gap:6px; }
.masthead .sub { color:var(--muted); font-size:14px; }

.card { background:var(--surface); border:1px solid var(--line);
  border-radius:14px; padding:18px; box-shadow:var(--shadow); }
.dashed { border:1px dashed var(--line-strong); border-radius:14px; padding:18px; }
.section-head { display:flex; align-items:baseline; justify-content:space-between;
  gap:12px; margin-bottom:10px; }

select, input, button { font-family:inherit; font-size:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

.field { width:100%; border:1px solid var(--line-strong); background:var(--surface);
  border-radius:11px; padding:13px 15px; font-size:16px; }
.btn { border:none; border-radius:11px; background:var(--accent); color:#fff;
  font-weight:600; padding:13px 20px; cursor:pointer; white-space:nowrap; font-size:15px; }
@media (prefers-color-scheme: dark) { .btn { color:#08120f; } }
.btn:disabled { opacity:.4; cursor:default; }
.btn-quiet { background:none; border:1px solid var(--line-strong); color:var(--ink);
  font-weight:500; padding:9px 15px; border-radius:999px; cursor:pointer; font-size:13px; }
.linkbtn { background:none; border:none; padding:0; color:var(--accent);
  font-size:13px; font-weight:500; text-decoration:underline;
  text-underline-offset:3px; cursor:pointer; }

.whoami { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 14px; border:1px solid var(--line); border-radius:999px;
  background:var(--surface); }
.whoami .label { font-size:14px; color:var(--muted); }
.whoami select { border:1px solid var(--line-strong); background:var(--surface);
  border-radius:999px; padding:6px 12px; font-weight:500; font-size:14px; }

.addrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  padding:16px; border:1px solid var(--line); border-radius:14px;
  background:var(--surface); box-shadow:var(--shadow); margin-top:-16px; }
.addrow input { flex:1; min-width:150px; }

input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
input[type=number] { -moz-appearance:textfield; }
.hint { margin-top:9px; font-size:13px; color:var(--muted); min-height:19px; }
.hint.ok { color:var(--accent); }
.hint.bad { color:var(--warn); }

.range { display:flex; gap:6px; }
.range button { border:1px solid var(--line); background:none; border-radius:999px;
  padding:5px 12px; font-size:12px; font-weight:500; color:var(--muted); cursor:pointer; }
.range button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent);
  background:var(--soft); }

.chart { position:relative; }
.chart svg { display:block; width:100%; height:96px; touch-action:none; }
.axis { display:flex; font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:4px; }
.axis span { text-align:center; overflow:hidden; }

.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
.stat { border-top:1px solid var(--line); padding-top:9px; }
.stat b { display:block; font-family:var(--mono); font-size:19px; font-weight:500;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.stat span { font-size:11px; color:var(--muted); }

.roster { border:1px solid var(--line); border-radius:14px; overflow:hidden;
  background:var(--surface); box-shadow:var(--shadow); }
.person { display:flex; align-items:center; gap:12px; padding:12px 14px;
  border-top:1px solid var(--line); }
.person:first-child { border-top:none; }
.dot { width:34px; height:34px; flex:none; border-radius:50%; display:grid;
  place-items:center; font-size:11px; font-weight:600; }
.person .who { flex:1; min-width:0; }
.person .name { display:flex; align-items:baseline; gap:7px; }
.person .name strong { font-weight:600; font-size:14px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.person .name em { font-style:normal; font-size:11px; color:var(--muted); }
.person .sub2 { display:flex; gap:6px; margin-top:4px; min-height:17px;
  overflow:hidden; }
.person.did .dot { box-shadow:0 0 0 2px var(--soft); }
.person .num { text-align:right; flex:none; }
.person .num b { display:block; font-family:var(--mono); font-weight:500;
  font-size:15px; font-variant-numeric:tabular-nums; }
.person .num span { font-size:11px; color:var(--muted); white-space:nowrap; }
.person .num span.met { color:var(--accent); font-weight:500; }


.note { font-size:13px; color:var(--muted); }
/* V1.6 — the lead domino. Steps is the ONE thing, so it is the only
   number on the screen rendered at a size you can read across a room. */
.domino { text-align:center; padding:4px 0 2px; }
.domino .big { font-family:var(--mono); font-size:56px; line-height:1;
  font-weight:500; letter-spacing:-.04em; color:var(--ink); display:block; }
.domino .of { display:inline-block; margin-top:7px; font-size:12px; color:var(--muted);
  letter-spacing:.02em; background:none; border:none; font-family:inherit;
  padding:2px 4px; cursor:pointer; text-decoration:underline dotted;
  text-underline-offset:3px; text-decoration-color:var(--line-strong); }
.domino .of b { color:var(--series); font-weight:600; }

/* The seven days shrink to a strip. Still the form, just no longer the
   loudest thing on the screen. */
.strip { margin-top:14px; }
.strip .chart svg { height:46px; }
.sessdate { margin-top:9px; border:1px solid var(--line); border-radius:999px;
  background:var(--surface); font-family:inherit; font-size:12.5px; color:var(--ink-2);
  padding:5px 12px; cursor:pointer; }
.sessdate span { margin-left:7px; font-size:10px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); }
.weekrow { display:flex; align-items:center; justify-content:center; gap:14px;
  margin-top:8px; font-size:12px; color:var(--muted); }
.weekrow button { border:none; background:none; font-family:inherit; font-size:17px;
  line-height:1; color:var(--ink-2); padding:2px 8px; cursor:pointer; border-radius:8px; }
.weekrow button:disabled { color:var(--line-strong); cursor:default; }

/* V1.7b — the log box is its own card, and carries its own date. */
.daynav { display:flex; align-items:center; justify-content:center; gap:6px; }
.daynav button { border:none; background:none; font-family:inherit; font-size:19px;
  line-height:1; color:var(--ink-2); padding:4px 12px; cursor:pointer; border-radius:9px; }
.daynav button:disabled { color:var(--line-strong); cursor:default; }
.daynav > span { min-width:132px; text-align:center; font-size:12.5px; font-weight:500;
  color:var(--ink-2); }
.logrow { display:flex; align-items:center; gap:9px; margin-top:14px; }
.logrow input { flex:1; min-width:0; border:1px solid var(--line-strong); background:var(--surface);
  border-radius:11px; padding:11px 14px; text-align:right;
  font-family:var(--mono); font-size:20px; font-weight:500; color:var(--ink); }
.logrow input:focus { outline:none; border-color:var(--series); }
.logrow > em { font-style:normal; font-size:11px; color:var(--muted); flex:none; }

/* the graph, restored to a size you can actually read */
.bigchart .chart svg { height:118px; }
.bigchart .axis { margin-top:6px; font-size:11px; }
.rangetog { display:flex; border:1px solid var(--line); border-radius:999px; padding:2px;
  background:var(--surface); }
.rangetog button { border:none; background:none; font-family:inherit; font-size:11px;
  font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  padding:4px 11px; border-radius:999px; cursor:pointer; }
.rangetog button[aria-pressed="true"] { background:var(--soft); color:var(--accent); }

/* thirty-five days as dots: the execution score, drawn */
.grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:9px;
  margin:6px auto 0; max-width:266px; }
.gcell { aspect-ratio:1; border-radius:50%; border:1.5px solid var(--line); background:none;
  padding:0; cursor:pointer; }
.grid + .dshint, .gdow + .grid + .dshint { text-align:center; }
.gcell.part { border-color:currentColor; }
.gcell.full { border-color:currentColor; background:currentColor; }
.gcell.none  { border-style:dashed; }
.gcell.sel  { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink-2); }
.gcell:disabled { opacity:.25; cursor:default; }
.gdow { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:9px;
  margin:4px auto 0; max-width:266px;
  font-size:9.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  color:var(--muted); text-align:center; }

/* editing what a workout is made of */
.tmpl { margin-top:12px; padding:13px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface-2); }
.tmpl h3 { margin:0 0 9px; font-family:var(--display); font-weight:500; font-size:15px; }
.tmplrow { display:flex; align-items:center; gap:8px; padding:7px 0;
  border-bottom:1px solid var(--line); }
.tmplrow:last-of-type { border-bottom:none; }
.tmplrow .nm { flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; }
.tmplrow .sx { font-size:11px; color:var(--muted); font-family:var(--mono); }
.tmplrow button { border:none; background:none; font-family:inherit; font-size:15px;
  color:var(--muted); padding:3px 7px; cursor:pointer; border-radius:7px; }
.tmplrow button:disabled { opacity:.25; cursor:default; }
.unitrow { display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-top:18px; }
.unitrow > span { font-size:11px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); }
.strip .axis { display:flex; margin-top:5px; font-size:9.5px; color:var(--muted); }
.strip .axis span { text-align:center; }

/* Two engines. Wide, flat, and they go somewhere. */
.engines { display:grid; gap:8px; margin-top:16px; }
.engine { display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px;
  border:1px solid var(--line); border-radius:13px; background:var(--surface);
  font-family:inherit; font-size:15px; color:var(--ink); text-align:left;
  cursor:pointer; }
.engine .tick { flex:none; width:8px; height:8px; border-radius:99px;
  background:var(--line-strong); }
.engine.on .tick { background:var(--train); }
.engine.on.cardio .tick { background:var(--swim); }
.engine b { font-weight:500; flex:none; }
.engine .said { flex:1; min-width:0; font-size:13px; color:var(--muted);
  text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.engine .go { flex:none; color:var(--muted); font-size:15px; }

/* The execution score. One number, top corner, never a chart. */
.score { display:flex; flex-direction:column; align-items:flex-end; gap:1px;
  font-family:var(--mono); font-size:15px; font-weight:500; color:var(--series);
  background:none; border:none; padding:2px 0 2px 8px; cursor:pointer; }
.score span { font-size:9px; font-family:var(--body); font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  white-space:nowrap; }

/* The family command centre: one compact row each, with a trend line. */
.cmd { margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }
.cmd .section-head { margin-bottom:4px; }
.crow { display:flex; align-items:center; gap:11px; padding:9px 0;
  border-bottom:1px solid var(--line); }
.crow:last-child { border-bottom:none; }
.crow .dot { flex:none; width:26px; height:26px; border-radius:99px; display:grid;
  place-items:center; font-size:10px; font-weight:600; }
.crow .cname { flex:1; min-width:0; font-size:14px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.crow .trend { flex:none; width:64px; height:20px; }
.crow .cpct { flex:none; width:38px; text-align:right; font-family:var(--mono);
  font-size:13px; color:var(--muted); }
.crow.did .cpct { color:var(--series); }

/* V1.6 — the chart IS the form. One line, under the bar you tapped. */
.daysheet { display:flex; align-items:center; gap:9px; margin-top:12px;
  padding:10px 12px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface); }
.daysheet > span { font-size:13px; color:var(--ink); font-weight:500; flex:none;
  min-width:62px; }
.daysheet input { flex:1; min-width:0; border:none; background:none; text-align:right;
  font-family:var(--mono); font-size:22px; font-weight:500; color:var(--ink);
  padding:0; }
.daysheet input:focus { outline:none; }
.daysheet > em { font-style:normal; font-size:11px; color:var(--muted); flex:none; }
.dshint { margin-top:8px; }

/* V1.6. The Exercise pillar stopped being a dot you had to guess was a
   button. It is a row with a border, a check circle, a verb and a chevron
   — an obvious control. The other four stay as small dim marks under it,
   so the roadmap survives without competing for the tap. */
.golog { display:flex; align-items:center; gap:13px; width:100%; margin-top:14px;
  padding:14px 15px; border:1.5px solid var(--series); border-radius:14px;
  background:var(--surface); font-family:inherit; color:inherit; text-align:left;
  cursor:pointer; }
.golog.done { border-color:var(--series); background:var(--soft); }
.golog .box { flex:none; width:26px; height:26px; border-radius:50%;
  border:1.5px solid var(--line-strong); background:var(--surface); display:grid;
  place-items:center; color:transparent; font-size:14px; line-height:1; }
.golog.done .box { background:var(--series); border-color:var(--series); color:#fff; }
:root[data-theme="dark"] .golog.done .box { color:#08120f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .golog.done .box { color:#08120f; }
}
.golog .gl { flex:1; min-width:0; }
.golog .gl b { display:block; font-size:15px; font-weight:500; }
.golog .gl span { display:block; margin-top:1px; font-size:12.5px; color:var(--muted);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.golog .go { flex:none; color:var(--muted); font-size:17px; }

/* V1.7. Exercise is a master category, not a destination. The header
   labels it and carries its state; the three tiles under it are the
   things you tap. When Sleep arrives it becomes a second header with its
   own tiles and nothing here has to be redesigned. */
.cat { display:flex; align-items:center; gap:11px; margin-top:16px; }
.cat .box { flex:none; width:22px; height:22px; border-radius:50%;
  border:1.5px solid var(--line-strong); background:var(--surface); display:grid;
  place-items:center; color:transparent; font-size:12px; line-height:1; }
.cat.done .box { background:var(--series); border-color:var(--series); color:#fff; }
:root[data-theme="dark"] .cat.done .box { color:#08120f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .cat.done .box { color:#08120f; }
}
.cat h2 { flex:1; min-width:0; font-size:17px; }

.cattiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
.tile3 { display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  padding:13px 12px 12px; border:1px solid var(--line); border-radius:13px;
  background:var(--surface); font-family:inherit; color:inherit; text-align:left;
  cursor:pointer; min-width:0; }
.tile3.on { border-color:var(--series); background:var(--soft); }
.tile3 .t3l { font-size:10px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); }
.tile3.on .t3l { color:var(--accent); }
.tile3 .t3v { font-family:var(--mono); font-size:19px; font-weight:500;
  letter-spacing:-.02em; line-height:1.15; width:100%; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.tile3 .t3u { font-size:10.5px; color:var(--muted); }

/* the family block on a metric page: folded by default */
.fam .frow { display:flex; align-items:center; gap:11px; padding:9px 0;
  border-bottom:1px solid var(--line); }
.fam .frow:last-child { border-bottom:none; }
.fam .dot { flex:none; width:26px; height:26px; border-radius:99px; display:grid;
  place-items:center; font-size:10px; font-weight:600; }
.fam .fname { flex:1; min-width:0; font-size:14px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.fam .trend { flex:none; width:66px; height:20px; }
.fam .fval { flex:none; min-width:52px; text-align:right; font-family:var(--mono);
  font-size:13px; color:var(--muted); }
.fam .frow.did .fval { color:var(--series); }
.fam .loading { padding:12px 0; font-size:13px; color:var(--muted); }

/* the four that are not measured yet */
.marks { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:14px; }
.mark { display:flex; flex-direction:column; align-items:center; gap:7px;
  background:none; border:none; padding:6px 2px; font-family:inherit; color:inherit; }
button.mark { cursor:pointer; }
.pip { width:13px; height:13px; border-radius:50%; border:1.5px solid var(--line-strong);
  background:none; }
.pip.on { background:var(--series); border-color:var(--series); }
.pip.off { border:none; width:13px; height:1.5px; border-radius:2px;
  background:var(--line-strong); margin:5.75px 0; }
.mlabel { font-size:9.5px; font-weight:600; letter-spacing:.04em; line-height:1.25;
  text-transform:uppercase; color:var(--muted); text-align:center;
  /* two lines reserved for every pillar, so "Great Work" wrapping does not
     leave the row looking like a mistake */
  min-height:2.5em; }
button.mark .mlabel { color:var(--ink-2); }
.mcap { margin-top:10px; text-align:center; font-size:11.5px; }

/* the segment that drives both the chart and the log under it */
.segrow { display:flex; align-items:center; gap:10px; }
.seg { display:flex; flex:1; border:1px solid var(--line); border-radius:999px;
  padding:3px; background:var(--surface); }
.seg button { flex:1; border:none; background:none; border-radius:999px;
  padding:7px 4px; font-family:inherit; font-size:13px; font-weight:500;
  color:var(--muted); cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--surface-2); color:var(--ink);
  font-weight:600; }

/* the date under the group name is a control */

/* stacked mini charts */
.mini + .mini { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
.mini-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.mini-name { font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
.mini-total { font-family:var(--mono); font-size:11px; color:var(--muted); }
.mini .chart svg { height:96px; }
.mini-foot { margin-top:4px; }

.ver { text-align:center; font-family:var(--mono); font-size:11px;
  color:var(--line-strong); letter-spacing:.06em; }
/* Tap the thing you want to change. Underlined so it reads as editable
   without adding a button or an icon anywhere. */
.tapedit { background:none; border:none; padding:0; cursor:pointer;
  font-family:inherit; font-weight:600; font-size:14px; color:var(--ink);
  text-decoration:underline; text-decoration-style:dotted;
  text-decoration-color:var(--line-strong); text-underline-offset:3px; }
.tapedit.small { font-size:11px; font-weight:400; color:var(--muted); }
.tapedit.small.met { color:var(--accent); font-weight:500; }
.chart svg rect[data-day] { cursor:pointer; }
.install { display:flex; align-items:flex-start; gap:10px; padding:12px 14px;
  border:1px solid var(--line); border-radius:12px; background:var(--soft);
  font-size:13px; color:var(--ink-2); }
.install p { flex:1; }
.install b { color:var(--accent); }
.install button { background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:18px; line-height:1; padding:0 2px; flex:none; }
.banner { border:1px solid var(--line-strong); background:var(--warn-soft);
  border-radius:12px; padding:13px 15px; font-size:13.5px; color:var(--ink-2); }
.center { display:grid; place-items:center; min-height:60vh; }
.spinner { font-size:13px; color:var(--muted); }

/* ---------------------------------------------------------------- */
/* V1.3 — Lift. Orange throughout, matching the Train series on the  */
/* chart, so "Train" and "Lift" read as one thing and not two.       */
/* ---------------------------------------------------------------- */
.topbar { display:flex; align-items:center; gap:8px; }
.backlink { background:none; border:none; padding:6px 10px 6px 0; cursor:pointer;
  color:var(--muted); font-size:14px; font-family:inherit; }
.sync { margin-left:auto; font-size:10.5px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); }
.sync.saving  { color:var(--train); }
.sync.saved   { color:var(--accent); }
.sync.offline { color:var(--warn); }

.tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile { text-align:left; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:13px; cursor:pointer; font-family:inherit; color:inherit;
  display:flex; flex-direction:column; gap:5px; min-height:100px; }
.tile b { font-size:15px; font-weight:600; }
.tile .ex { font-size:12px; color:var(--muted); line-height:1.35; display:-webkit-box;
  -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.tile .ago { margin-top:auto; font-size:11px; color:var(--muted); font-style:italic; }

.hcard { background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:15px; box-shadow:var(--shadow); cursor:pointer; width:100%; text-align:left;
  font-family:inherit; color:inherit; display:block; }
.hcard + .hcard { margin-top:10px; }
.hcard h3 { margin:0; font-size:16px; font-family:var(--display); font-weight:500; }
.hcard .when { font-size:13px; color:var(--muted); margin-top:1px; }
.hmeta { display:flex; gap:16px; margin:10px 0 2px; font-size:13px; color:var(--ink-2); }
.hmeta b { font-family:var(--mono); font-weight:500; }
.htab { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
.htab th { text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); padding:6px 0 3px; }
.htab td { padding:3px 0; }
.htab td:last-child, .htab th:last-child { text-align:right; font-family:var(--mono); }
.htab td.nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:0; width:60%; }

.timer { display:flex; align-items:baseline; gap:14px; font-family:var(--mono);
  font-size:12.5px; color:var(--muted); margin-top:2px; }
.timer b { font-size:26px; color:var(--ink); font-weight:500; letter-spacing:-.02em; }
.exblock { background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:14px; box-shadow:var(--shadow); }
.exblock + .exblock { margin-top:10px; }
.exhead { display:flex; align-items:center; gap:8px; }
.exhead b { flex:1; font-size:15px; font-weight:600; color:var(--train);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.xbtn { background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:18px; line-height:1; padding:2px 5px; }
.setgrid { display:grid; grid-template-columns:24px 1fr 1fr 44px; gap:8px;
  align-items:center; margin-top:9px; }
.setgrid .hd { font-size:10px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); text-align:center; }
.setgrid .hd.l { text-align:left; }
.setgrid .ix { font-family:var(--mono); font-size:13px; color:var(--muted); text-align:center; }
.setgrid input { width:100%; border:1px solid var(--line-strong); background:var(--surface);
  border-radius:9px; padding:9px 6px; font-family:var(--mono); font-size:17px;
  font-weight:500; text-align:center; }
.setgrid input:focus { border-color:var(--train); }
.setgrid input.on { border-color:transparent; background:var(--train-soft); }
.tick { border:1px solid var(--line-strong); background:none; border-radius:9px;
  height:39px; cursor:pointer; color:var(--muted); font-size:15px; }
.tick[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
@media (prefers-color-scheme: dark) { .tick[aria-pressed="true"] { color:#08120f; } }
.addset { width:100%; margin-top:9px; border:1px dashed var(--line-strong); background:none;
  border-radius:9px; padding:9px; color:var(--muted); font-family:inherit; font-size:13px;
  cursor:pointer; }
.exadd { display:flex; gap:8px; margin-top:12px; }
.exadd input { flex:1; min-width:0; }

.labelin { flex:1; min-width:0; background:none; border:none; padding:0 0 3px;
  font-family:var(--display); font-size:28px; font-weight:500; line-height:1.15;
  letter-spacing:-0.01em; color:var(--train);
  border-bottom:1px dotted var(--line-strong); }
.labelin::placeholder { color:var(--line-strong); }

.liftchip { background:none; border:1px solid var(--line); border-radius:999px;
  padding:1px 8px; font-family:var(--mono); font-size:10.5px; color:var(--train);
  cursor:pointer; white-space:nowrap; }
.liftchip.cardio { color:var(--series); }

/* V1.4 */
.weeknav { display:flex; gap:6px; }
.weeknav button { border:1px solid var(--line); background:none; border-radius:999px;
  width:30px; height:26px; font-size:15px; line-height:1; color:var(--ink);
  cursor:pointer; padding:0; }
.weeknav button:disabled { opacity:.3; cursor:default; }

.foldbtn { display:flex; align-items:center; gap:6px; background:none; border:none;
  padding:0; cursor:pointer; font-family:inherit; color:inherit; }
.foldbtn .caret { font-size:11px; color:var(--muted); width:11px; }

.tilewrap { position:relative; }
.tilewrap .tile { width:100%; }
.tilemenu { position:absolute; top:6px; right:6px; background:none; border:none;
  color:var(--muted); font-size:17px; line-height:1; padding:2px 7px; cursor:pointer; }
.sheet { position:absolute; top:30px; right:6px; z-index:5; background:var(--surface);
  border:1px solid var(--line-strong); border-radius:11px; box-shadow:var(--shadow);
  overflow:hidden; min-width:132px; }
.sheet button { display:block; width:100%; text-align:left; background:none;
  border:none; border-top:1px solid var(--line); padding:10px 13px; font-size:13.5px;
  font-family:inherit; color:var(--ink); cursor:pointer; }
.sheet button:first-child { border-top:none; }

.setgrid.one { grid-template-columns:24px 1fr 44px; }
.kindpick { display:flex; align-items:center; gap:6px; margin-top:9px;
  font-size:11px; color:var(--muted); }
.kindpick button { border:1px solid var(--line); background:none; border-radius:999px;
  padding:4px 11px; font-size:11.5px; font-weight:500; color:var(--muted);
  cursor:pointer; font-family:inherit; }
.kindpick button[aria-pressed="true"] { border-color:var(--train); color:var(--train);
  background:var(--train-soft); }
.hd.unit { border:none; background:none; padding:0; cursor:pointer; font:inherit;
  font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--train); text-decoration:underline; text-decoration-style:dotted;
  text-underline-offset:3px; }
.empty { text-align:center; padding:26px 16px; color:var(--muted); font-size:14px; }

</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="center"><p class="spinner">Loading&hellip;</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
(() => {
  "use strict";

  // Bump this when the file changes, so you can tell at a glance which
  // version a phone is actually running after a deploy.
  const APP_VERSION = "1.7";

  /* ---------- tiny helpers ---------------------------------------- */
  const app = document.getElementById("app");
  const pad = (n) => String(n).padStart(2, "0");
  const num = (n) => Number(n).toLocaleString();
  const esc = (s) => String(s).replace(/[&<>"']/g,
    (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  // The date on THIS phone, right now. Read fresh every time: a phone that
  // has been asleep in a pocket since yesterday must not keep answering
  // yesterday.
  const deviceISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  };

  // The zone this phone is in, e.g. "Europe/London". Sent with every log so
  // the server can compute this person's midnight without being told a date.
  const deviceTZ = () => {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || null; }
    catch { return null; }
  };

  // V1.6. "Today" is no longer whatever this device believes. The server
  // computes it per person from their own stored zone and hands it back on
  // the board, so Karachi and Connecticut each see their own day even when
  // they are looking at the same screen at the same instant. The device
  // date is only the fallback before the first load answers.
  const todayISO = () => {
    const m = me();
    return (m && m.their_date) || deviceISO();
  };
  const shiftISO = (iso, n) => {
    const d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  const dayLabel = (iso) => String(Number(iso.slice(8)));
  const longLabel = (iso) => new Date(iso + "T00:00:00Z")
    .toLocaleDateString(undefined, { timeZone:"UTC", month:"short", day:"numeric" });

  /* ---------- client ---------------------------------------------- */
  let sb = null;
  const configured =
    SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.length > 20;

  if (configured && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  async function call(fn, args) {
    const { data, error } = await sb.rpc(fn, args);
    if (error) return { error: error.message };
    return data || {};
  }

  // Exercise is ONE pillar with three numbers in it. Train is lifting and
  // yoga; Cardio is walking, running, swimming, the machines. V1.4 summed
  // them and that was wrong — they are different things, and keeping them
  // apart is what lets each have its own target and its own chart.
  const M = {
    steps:  { key:"steps",      label:"Steps",  unit:"steps",   color:"var(--series)", soft:"var(--soft)" },
    train:  { key:"train_min",  label:"Train",  unit:"minutes", color:"var(--train)",  soft:"var(--train-soft)" },
    cardio: { key:"cardio_min", label:"Cardio", unit:"minutes", color:"var(--swim)",   soft:"var(--swim-soft)" },
  };

  // The five pillars, in the order they will always appear. Four are dark
  // and unclickable until they are measured; showing them anyway is the
  // honest version of a roadmap, and it stops the board from being
  // redesigned when each one arrives.
  const PILLARS = [
    { key:"exercise",   label:"Exercise",   live:true  },
    { key:"sleep",      label:"Sleep",      live:false },
    { key:"meditation", label:"Meditate",   live:false },
    { key:"diet",       label:"Diet",       live:false },
    { key:"focus",      label:"Great Work", live:false },
  ];

  const mondayOf = (iso) => {
    const d = new Date(iso + "T00:00:00Z");
    return shiftISO(iso, -((d.getUTCDay() + 6) % 7));
  };

  /* ---------- state ------------------------------------------------ */
  const state = {
    code: new URLSearchParams(location.search).get("g"),
    group: null,
    metric: { key:"steps", unit:"steps", default_target:8000 },
    people: [],
    meId: null,
    history: { steps: [], train: [], cardio: [] },
    adding: false,
    editing: null,        // null | 'name' | 'goal'
    editPerson: null,
    editMetric: "steps",
    entryDate: null,      // null means today
    msg: null,

    // V1.3. The board is still the whole app for nine people out of ten;
    // Lift is a place you go, not a thing on the board.
    view: "board",        // board | exercise | session | detail
    seg:  "steps",        // steps | train | cardio — which metric page is open
    mode: "lift",         // lift | cardio — which log the segment is showing
    weekAnchor: null,     // Monday of the week on the charts; null means this week
    // The family block, per metric, fetched on first open and kept.
    fam: { open: false, data: {} },
    kpi:  "week",         // week | cycle — which horizon the headline shows
    range: "week",        // week | month — which graph the page is showing
    month: {},            // 35 days per metric, fetched when Month is opened
    histOpen: false,      // the workout history fold
    tmpl: null,           // { label, mode, items:[...] } while being edited

    lift: {
      loaded: false,
      labels: [], sessions: [], exercises: [],
      detail: null,       // a session being read
      from: "lift",       // where the reader came from, so Back goes back
      active: null,       // the session being logged right now
      sync: "idle",       // idle | saving | saved | offline
      msg: null,
      menu: null,         // a tile's ... menu, by label
      rename: null,       // a tile being renamed
    },
  };

  if (state.code) state.code = state.code.toUpperCase();

  const meKey = () => `fhd.me.${state.code}`;
  const loadMe = () => { try { return localStorage.getItem(meKey()); } catch { return null; } };
  const saveMe = (id) => {
    state.meId = id;
    try { localStorage.setItem(meKey(), id); } catch {}
  };
  const me = () => state.people.find((p) => p.id === state.meId) || null;

  // The family board folds. Default open, because it is the reason the app
  // exists; remembered per phone, because on your own phone you may already
  // know what everyone did.
  function boardOpen() {
    try { return localStorage.getItem("fhd.board") !== "shut"; } catch { return true; }
  }

  /* ---------- data ------------------------------------------------- */
  async function refresh() {
    // p_me + p_tz teach the server where this phone is, on every load. A
    // family member who only ever reads the board would otherwise keep the
    // group's zone for ever and see somebody else's day.
    const res = await call("app_state", { p_code: state.code,
      p_me: state.meId || null, p_tz: deviceTZ() });
    if (res.error) { state.fatal = res.error; render(); return; }
    state.group = res.group;
    // Alphabetical, so a name is findable without reading the whole list.
    state.people = (res.people || []).slice().sort((a, b) =>
      a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
    if (!state.people.some((p) => p.id === state.meId)) state.meId = loadMe();
    if (!state.people.some((p) => p.id === state.meId)) state.meId = null;
    await loadHistory();
    // If the family block is open on the page you are looking at, it is
    // showing numbers that just changed. Refetch it here rather than in
    // each caller, so no path can leave it stale.
    if (state.fam.open && state.view === "exercise") {
      state.fam.data[state.seg] = null;
      await loadFamily();
    }
    render();
  }

  /* ---------- the clock ---------------------------------------------
     V1.6. `refresh()` used to run exactly once, at boot. Added to the Home
     Screen, this app is resumed rather than reloaded, so "today" froze at
     whatever moment iOS last cold-started it — which is precisely the
     "it resets in the middle of the day" that started this release.

     Two cheap triggers fix it, and nothing polls the network on a timer:
       * coming back to the screen re-asks the server for the day;
       * a one-minute local tick notices the device date has rolled over
         and only then re-asks.
     ------------------------------------------------------------------ */
  let clockDay = null, clockTimer = null;

  function watchClock() {
    clockDay = deviceISO();

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      refresh();
    });

    if (clockTimer) clearInterval(clockTimer);
    clockTimer = setInterval(() => {
      const d = deviceISO();
      if (d === clockDay) return;
      clockDay = d;
      // A new day: the week the charts are anchored to is last week now.
      if (state.weekAnchor === null) state.entryDate = null;
      if (!document.hidden) refresh();
    }, 60000);
  }

  // Today's numbers for one person, by short metric name.
  const val = (p, k) => Number(
    k === "steps" ? p.steps : k === "train" ? p.train_min : p.cardio_min) || 0;
  const target = (p, k) => k === "steps" ? Number(p.steps_target) || 0
                         : k === "train" ? Number(p.train_target) || 0 : 0;

  // One window, both metrics. The week view is a real Monday-to-Sunday
  // calendar week, so everyone is looking at the same seven columns.
  function weekBounds() {
    const start = state.weekAnchor || mondayOf(entryDay());
    return { start, end: shiftISO(start, 6) };
  }
  const thisMonday = () => mondayOf(todayISO());
  function weekWords() {
    const { start, end } = weekBounds();
    if (start === thisMonday()) return "This week";
    if (start === shiftISO(thisMonday(), -7)) return "Last week";
    return longLabel(start) + " \u2013 " + longLabel(end);
  }

  async function loadHistory() {
    if (!state.meId) { state.history = { steps: [], train: [], cardio: [] }; return; }
    const anchor = weekBounds().end;
    const keys = ["steps","train","cardio"];
    const got = await Promise.all(keys.map((k) => call("app_history", {
      p_code:state.code, p_person:state.meId,
      p_days:7, p_metric:M[k].key, p_today:anchor })));
    keys.forEach((k, i) => { state.history[k] = got[i].error ? [] : (got[i].days || []); });
  }

  /* ---------- which day is being logged ----------------------------- */
  const entryDay = () => state.entryDate || todayISO();


  // What is already recorded for the day on screen. The week is already
  // loaded for the chart, so there is nothing to fetch — which is what let
  // `app_value`, `ensureDay` and the whole byDate cache be deleted.
  function dayRecord(k) {
    const iso = entryDay();
    const m = me();
    if (iso === todayISO() && m)
      return { value: val(m, k), logged: k === "steps" ? !!m.steps_logged : val(m, k) > 0 };
    // fall through to the loaded week/month below
    const d = (state.history[k] || []).find((x) => x.date === iso)
           || (state.month[k]   || []).find((x) => x.date === iso);
    return { value: d ? Number(d.value) : 0, logged: d ? d.logged : false };
  }

  /* ---------- chart ------------------------------------------------ */
  const DOW = ["M","T","W","T","F","S","S"];

  function points(k) {
    return (state.history[k] || []).map((d, i) => ({
      key:d.date, label:DOW[i] || dayLabel(d.date), value:Number(d.value),
      logged:d.logged, full:longLabel(d.date),
    }));
  }

  // One mini chart per metric, stacked, sharing the same columns. Steps and
  // minutes cannot honestly share a y-axis, so they each keep their own.
  function miniChart(k, strip) {
    const met = M[k];
    const pts = points(k);
    if (!pts.length) return "";

    const goal = target(me() || {}, k);

    // The strip is the same chart at a third of the height, with its head
    // and its totals removed. It is still the form: every bar is a tap
    // target, and the selected column is still drawn behind the bar.
    const H = strip ? 46 : 96, PT = strip ? 5 : 10, PB = 4, plot = H - PT - PB;
    const peak = Math.max(...pts.map((p) => p.value), goal || 0, 1);
    const max = peak * 1.15;
    const y = (v) => PT + plot - (v / max) * plot;
    const n = pts.length, slot = 100 / n, bw = slot * 0.52;

    let bars = "";
    const sel = k === "steps" ? entryDay() : null;
    pts.forEach((p, i) => {
      const x = i * slot + (slot - bw) / 2;
      // V1.6. The selected column is the form's title bar. Nothing else on
      // the screen says which day you are typing into, so this has to.
      if (p.key === sel) {
        bars += `<rect x="${x - bw*0.3}" y="${PT-6}" width="${bw*1.6}" height="${plot+8}"
                  rx="2" fill="${met.soft}" opacity="0.55" pointer-events="none"></rect>`;
      }
      if (p.value <= 0) {
        bars += `<rect x="${x}" y="${PT}" width="${bw}" height="${plot}" fill="transparent"
                  data-day="${p.key}" data-metric="${k}"></rect>` +
                `<rect x="${x}" y="${y(0)-2}" width="${bw}" height="2" fill="${met.soft}"
                  pointer-events="none"></rect>`;
        return;
      }
      bars += `<rect x="${x}" y="${y(p.value)}" width="${bw}" height="${Math.max(y(0)-y(p.value),2)}"
                rx="${Math.min(bw/2,1.4)}" fill="${met.color}" data-day="${p.key}"
                data-metric="${k}"></rect>`;
    });

    const goalLine = goal && goal <= max
      ? `<line x1="0" x2="100" y1="${y(goal)}" y2="${y(goal)}" stroke="${met.color}"
           stroke-width="1" stroke-dasharray="3 3" opacity="0.8" vector-effect="non-scaling-stroke"></line>` : "";

    const every = n <= 14 ? 1 : Math.ceil(n / 8);
    const axis = pts.map((p, i) =>
      `<span style="width:${slot}%">${i % every === 0 ? p.label : ""}</span>`).join("");

    const total = pts.reduce((t, p) => t + p.value, 0);
    const totalWords = k === "steps"
      ? `${num(Math.round(total))} steps` : `${num(Math.round(total))} minutes`;

    // The goal is edited by tapping the line it controls.
    const goalTap = k === "cardio" ? ""
      : `<button class="tapedit small" data-edit="goal" data-metric="${k}">${
           goal ? "goal " + num(goal) + (k === "steps" ? "" : " min") : "set a goal"}</button>`;

    const svg = `
        <div class="chart" id="chart-${k}" data-chart="${k}">
          <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" role="img"
               aria-label="${met.label} for the period shown">
            <line x1="0" x2="100" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-strong)"
                  stroke-width="1" vector-effect="non-scaling-stroke"></line>
            ${bars}${goalLine}
          </svg>
          <div class="axis">${axis}</div>
        </div>`;

    if (strip) return `<div class="strip">${svg}</div>`;
    return `<div class="bigchart">${svg}</div>`;
  }

  /* ---------- thirty-five days, as dots ------------------------------
     A month cannot be bars on a phone. Seven bars get a 47px slot; thirty
     get 11px, which is 6px of bar — too thin to read and far too thin to
     tap, and tapping a day is how you log it.

     So the month view changes the MARK rather than the range. Five rows of
     seven: filled when the day cleared the target, ringed when something
     was logged but fell short, dashed when nothing was. Magnitude is gone,
     which is the point — at a month's distance the only question worth
     asking is whether this is a habit yet, and that is a shape, not a
     number. It is also the execution score drawn out: every filled dot is
     a day that counted.
     ------------------------------------------------------------------ */
  const DOWS = ["M","T","W","T","F","S","S"];

  function monthGrid(k) {
    const met = M[k];
    const days = state.month[k] || [];
    if (!days.length) return `<p class="loading">Loading\u2026</p>`;
    const goal = target(me() || {}, k);
    const today = todayISO();
    const sel = entryDay();
    const hit = days.filter((d) => goal ? Number(d.value) >= goal : Number(d.value) > 0).length;

    return `
      <div class="gdow">${DOWS.map((d) => `<span>${d}</span>`).join("")}</div>
      <div class="grid" style="color:${met.color}">
        ${days.map((d) => {
          const v = Number(d.value) || 0;
          const cls = v <= 0 ? "none" : (goal ? (v >= goal ? "full" : "part") : "full");
          return `<button type="button" class="gcell ${cls}${d.date === sel ? " sel" : ""}"
            data-day="${d.date}" ${d.date > today ? "disabled" : ""}
            aria-label="${esc(longLabel(d.date))}: ${v > 0 ? num(Math.round(v)) : "nothing"}"
            title="${esc(longLabel(d.date))} \u00b7 ${v > 0 ? num(Math.round(v)) : "\u2014"}"></button>`;
        }).join("")}
      </div>
      <p class="hint dshint">${hit} of ${days.filter((d) => d.date <= today).length} days
        ${goal ? "cleared your target" : "logged"}.</p>`;
  }

  // The month is its own fetch, and only on the page you are looking at.
  async function loadMonth() {
    const k = state.seg;
    if (!state.meId) { state.month[k] = []; return; }
    // 35 days ending on the Sunday of the current week, so the grid always
    // starts on a Monday and the columns mean what the header says.
    const end = weekBounds().end;
    const res = await call("app_history", {
      p_code:state.code, p_person:state.meId,
      p_days:35, p_metric:M[k].key, p_today:end });
    state.month[k] = res.error ? [] : (res.days || []);
  }

  // Seven points, each a day's steps as a fraction of that person's own
  // goal. A fraction rather than a raw count is what lets two people with
  // different targets sit in the same column and mean the same thing.
  function sparkline(spark, hue, goalLine) {
    const pts = (spark || []).map(Number).filter((n) => !Number.isNaN(n));
    if (pts.length < 2) return `<svg class="trend" viewBox="0 0 64 20"></svg>`;
    const max = Math.max(1, ...pts);
    const x = (i) => (i / (pts.length - 1)) * 62 + 1;
    const y = (v) => 18 - (v / max) * 16;
    const d = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
    const col = `hsl(${hue} 55% 42%)`;
    const last = pts[pts.length - 1];
    return `<svg class="trend" viewBox="0 0 64 20" role="img" aria-hidden="true">
      ${goalLine === false ? "" : `<line x1="0" x2="64" y1="${y(1)}" y2="${y(1)}"
            stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="2 3"
            vector-effect="non-scaling-stroke"></line>`}
      <path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"
            vector-effect="non-scaling-stroke"></path>
      <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="1.8"
              fill="${col}"></circle>
    </svg>`;
  }

  function editTarget() {
    return state.people.find((x) => x.id === (state.editPerson || state.meId)) || null;
  }
  function editSeed() {
    if (state.editing === "name") return esc(editTarget() ? editTarget().name : "");
    return Math.round(target(me() || {}, state.editMetric)) ||
           (state.editMetric === "steps" ? 8000 : 40);
  }
  function editHintText() {
    if (state.editing === "name") {
      const t = editTarget();
      return t && t.id !== state.meId
        ? `Renaming ${esc(t.name)}. Everyone sees the change.`
        : "Changes how you appear to everyone.";
    }
    return state.editMetric === "steps"
      ? "Your own daily target, in steps."
      : "Your own daily target, in minutes.";
  }

  // Train first. It is the one he acts on, and the first thing on a screen
  // is the thing the screen is about.
  // One chart. Which one is the segment's business, not the chart's.
  // DELETED in V1.6: statsHTML (daily average, best day, goal hit) and the
  // chartsHTML wrapper. Averages and best days are outcomes. The execution
  // rate is the thing you actually control, so one number replaces three.
  //
  // The score is computed server-side over the person's own 12-week cycle,
  // because the denominator is days ELAPSED — which only the server knows,
  // and which a phone left shut for a week would get wrong in exactly the
  // flattering direction.
  const execOf = (p) => (p && p.exec) ||
    { pct: 0, hit: 0, day: 0, of: 84, week_hit: 0, week_of: 0 };

  // V1.7b. A bare 88% floats: no denominator, and over 84 days a single
  // day moves it by roughly one point, so by mid-cycle nothing you do
  // today changes what you see. The headline is the rolling week — it
  // moves every morning and one missed day is visibly one seventh. The
  // cycle figure is one tap away, because the 12-week horizon is the
  // point of the framework; it just stops being the thing that shouts.
  function kpiWords(e) {
    if (state.kpi === "cycle")
      return `${e.hit} of ${e.day}<span>this cycle \u00b7 ${e.pct}%</span>`;
    return `${e.week_hit}/${e.week_of}<span>this week</span>`;
  }

  // DELETED in V1.7: scoreChip (the rate now lives on the category header,
  // which is where a pillar-level number belongs), engines (the three home
  // tiles replaced them) and commandCentre (steps-only, always rendered;
  // replaced by famBlock, which is per metric and behind a fold).

  // The family block on a metric page. Folded by default and fetched only
  // when it is opened, so the common case — land, type a number, leave —
  // costs one round trip rather than four.
  function famOpen() {
    try { return localStorage.getItem("fhd.fam") === "open"; } catch { return false; }
  }

  function famBlock() {
    const k = state.seg;
    const open = state.fam.open;
    const rows = state.fam.data[k];
    const mine = state.meId;

    let body = "";
    if (!open) body = "";
    else if (!rows) body = `<p class="loading">Loading\u2026</p>`;
    else {
      const others = rows.filter((r) => r.id !== mine);
      body = others.length
        ? others.map((r) => {
            const days = (r.days || []).map(Number);
            // V1.7b: Cardio has a minimum standard now, like the other two.
            const goal = Number(r.goal) || 0;
            const base = goal || Math.max(1, ...days);
            const initials = r.name.trim().split(/\s+/).slice(0,2)
              .map((w) => (w[0] || "").toUpperCase()).join("");
            const today = Number(r.today) || 0;
            return `<div class="frow${today > 0 ? " did" : ""}">
              <span class="dot" aria-hidden="true"
                style="background:color-mix(in oklab, hsl(${r.hue} 62% 48%) 16%, var(--surface));
                       color:color-mix(in oklab, hsl(${r.hue} 62% 48%) 78%, var(--ink))"
                >${esc(initials)}</span>
              <span class="fname">${esc(r.name)}</span>
              ${sparkline(days.map((v) => v / base), r.hue, !!goal)}
              <span class="fval">${today > 0 ? num(Math.round(today)) : "\u2013"}</span>
            </div>`;
          }).join("")
        : `<p class="loading">Nobody else has been added yet.</p>`;
    }

    const logged = rows ? rows.filter((r) => Number(r.today) > 0).length : null;
    return `
      <section class="fam">
        <div class="section-head">
          <button class="foldbtn" id="foldFam" aria-expanded="${open}">
            <span class="caret">${open ? "\u25be" : "\u25b8"}</span>
            <h2>The family</h2></button>
          <span class="eyebrow">${logged === null ? "7-day trend"
            : `${logged}/${rows.length} logged`}</span>
        </div>
        ${body}
      </section>`;
  }

  async function loadFamily(force) {
    const k = state.seg;
    if (state.fam.data[k] && !force) return;
    const res = await call("app_family", {
      p_code: state.code, p_metric: M[k].key, p_days: 7 });
    state.fam.data[k] = res.error ? [] : (res.people || []);
  }

  /* ---------- home-screen hint --------------------------------------- */
  // Tomorrow's logging should be one tap on an icon, not a hunt through
  // WhatsApp for the link. Shown once per person, then never again.
  function standalone() {
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
  }
  function hintDismissed() {
    try { return localStorage.getItem("fhd.install") === "no"; } catch { return false; }
  }
  function installHint() {
    if (standalone() || hintDismissed() || !me()) return "";
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const how = ios
      ? "tap Share, then <b>Add to Home Screen</b>"
      : "open the browser menu, then <b>Add to Home screen</b>";
    return `<div class="install" id="installHint">
      <p>Make tomorrow one tap: ${how}. The icon opens straight here.</p>
      <button id="installNo" aria-label="Dismiss">&times;</button>
    </div>`;
  }

  /* ---------- the daily WhatsApp message ---------------------------- */
  // Written to be read in a chat, not on a dashboard: the standings first,
  // who is missing second, the link last. Asterisks are WhatsApp bold.
  function dailyMessage() {
    const done = state.people.filter(anyLog);
    const missing = state.people.filter((p) => !anyLog(p));
    const hit = state.people.filter((p) => p.done);
    const day = new Date(todayISO() + "T00:00:00Z").toLocaleDateString(undefined,
      { timeZone:"UTC", weekday:"short", month:"short", day:"numeric" });

    const lines = [
      `*${state.group.name}* \u00b7 ${day}`,
      `${done.length}/${state.people.length} logged \u00b7 ${hit.length} moved`,
      "",
    ];

    // Ranked here, unlike the app: a chat message is skimmed once and the
    // order is what makes it worth reading. Train is appended only for the
    // people who did some, so ten relatives is not a wall of text.
    const sorted = [...done].sort((a, b) => val(b,"steps") - val(a,"steps"));
    for (const p of sorted) {
      const met = !!p.done;
      // Steps and minutes only \u2014 no pounds, no kilometres, nothing a
      // relative has to convert in their head before the line means
      // something. Train and Cardio are named because they are different
      // things and the family should see which one you did.
      const bits = [];
      if (val(p, "steps") > 0)  bits.push(num(val(p, "steps")));
      if (val(p, "train") > 0)  bits.push(num(val(p, "train")) + "m train");
      if (val(p, "cardio") > 0) bits.push(num(val(p, "cardio")) + "m cardio");
      const streak = p.streak > 1 ? `  (${p.streak}-day streak)` : "";
      lines.push(`${met ? "\u2705" : "\u25ab\ufe0f"} ${p.name} \u2014 ${bits.join(" \u00b7 ")}${streak}`);
    }

    if (missing.length) {
      lines.push("", `Still to log: ${missing.map((p) => p.name).join(", ")}`);
    }
    lines.push("", `${location.origin}${location.pathname}?g=${state.code}`);
    return lines.join("\n");
  }



  /* =================================================================
     V1.3 — LIFT

     The session being lifted lives in localStorage, not in the database.
     A gym is a concrete box with no signal, and a set that fails to save
     is the thing that sends someone back to the app that never loses one.
     So: every tap writes locally and synchronously, and the network is a
     background reconciliation that is allowed to fail. `app_lift_save`
     takes the whole session and is idempotent, so a retry is free.
     ================================================================= */

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
    : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
        const r = Math.random() * 16 | 0;
        return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16); }));

  /* ---------- units -------------------------------------------------
     The database stores pounds and metres, always. What a phone shows is
     a setting on that phone, so someone in Karachi enters kilos and metres
     while you enter pounds and miles, and the stored numbers stay
     comparable. Convert at the edges, never in the middle.
     ------------------------------------------------------------------ */
  const LB_PER_KG = 2.2046226218;
  const M_PER_MI  = 1609.344;

  const units = {
    get w() { try { return localStorage.getItem("fhd.unit.w") || "lb"; } catch { return "lb"; } },
    get d() { try { return localStorage.getItem("fhd.unit.d") || "mi"; } catch { return "mi"; } },
    set w(v) { try { localStorage.setItem("fhd.unit.w", v); } catch {} },
    set d(v) { try { localStorage.setItem("fhd.unit.d", v); } catch {} },
  };

  // stored (lb) -> shown ;  shown -> stored
  const wOut = (lb) => units.w === "kg" ? Number(lb) / LB_PER_KG : Number(lb);
  const wIn  = (v)  => units.w === "kg" ? Number(v) * LB_PER_KG  : Number(v);
  const dOut = (m) => units.d === "km" ? Number(m) / 1000
                    : units.d === "m"  ? Number(m)
                    : Number(m) / M_PER_MI;
  const dIn  = (v) => units.d === "km" ? Number(v) * 1000
                    : units.d === "m"  ? Number(v)
                    : Number(v) * M_PER_MI;

  const wShow = (lb) => { const v = wOut(lb);
    return units.w === "kg" ? (Math.round(v * 10) / 10) : Math.round(v); };
  const dShow = (m) => { const v = dOut(m); return Math.round(v * 100) / 100; };

  // Metres read better than 0.31 mi for a pool. Under 1000 m stays metric
  // whatever the setting, because that is how swimmers actually talk.
  function distWords(m) {
    m = Number(m) || 0;
    if (m <= 0) return "";
    if (m < 1000) return Math.round(m) + " m";
    return dShow(m) + " " + units.d;
  }
  const mmss = (sec) => {
    sec = Math.max(0, Math.round(Number(sec) || 0));
    const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, x = sec % 60;
    return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`;
  };
  const parseClock = (t) => {
    const parts = String(t || "").split(":").map((n) => Number(n) || 0);
    if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
    if (parts.length === 2) return parts[0]*60 + parts[1];
    return parts[0] * 60;                       // a bare number means minutes
  };

  // Lift and Cardio each keep their own in-progress draft, so starting a
  // swim does not throw away a half-logged leg day.
  const liftKey = () => `fhd.lift.${state.code}.${state.meId}.${state.mode}`;
  const exKey   = () => `fhd.ex.${state.code}.${state.meId}.${state.mode}`;
  const MODE = () => (state.mode === "cardio"
    ? { key:"cardio", title:"Cardio", verb:"activity", start:"Start an activity" }
    : { key:"lift",   title:"Lift",   verb:"exercise", start:"Start an empty workout" });

  function saveLocal() {
    try {
      if (state.lift.active) localStorage.setItem(liftKey(), JSON.stringify(state.lift.active));
      else localStorage.removeItem(liftKey());
    } catch {}
  }
  function loadLocal() {
    try {
      const raw = localStorage.getItem(liftKey());
      state.lift.active = raw ? JSON.parse(raw) : null;
    } catch { state.lift.active = null; }
  }
  function cacheExercises(list) {
    state.lift.exercises = list || [];
    try { localStorage.setItem(exKey(), JSON.stringify(state.lift.exercises)); } catch {}
  }
  function cachedExercises() {
    try { return JSON.parse(localStorage.getItem(exKey()) || "[]"); } catch { return []; }
  }

  const A = () => state.lift.active;

  function elapsedMs(a) { return Math.max(0, (a.endedAt || Date.now()) - a.startedAt); }
  function clock(ms) {
    const s = Math.floor(ms / 1000);
    return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  }
  const durationMin = (a) => Math.max(1, Math.round(elapsedMs(a) / 60000));

  // V1.4 deleted volume. What a session is worth is what you did in it,
  // not a number that rewards doing light things many times.
  function distanceOf(a) {
    let m = 0;
    for (const x of a.ex) for (const s of x.sets) if (s.on) m += Number(s.d) || 0;
    return m;
  }
  function totalsWords(a) {
    const n = doneSets(a);
    const d = distanceOf(a);
    const bits = [];
    if (d > 0) bits.push(distWords(d));
    bits.push(n + (state.mode === "cardio" ? (n === 1 ? " entry" : " entries")
                                           : (n === 1 ? " set"   : " sets")));
    return bits.join(" \u00b7 ");
  }
  function doneSets(a) {
    let n = 0;
    for (const x of a.ex) for (const s of x.sets) if (s.on) n++;
    return n;
  }

  // Only confirmed sets cross the wire. A half-filled row you never ticked
  // is a thought, not a lift, and it should not end up in anyone's volume.
  function setsPayload(a) {
    const out = [];
    a.ex.forEach((x, pos) => x.sets.forEach((s, i) => {
      if (!s.on || !String(x.name || "").trim()) return;
      out.push({ position: pos, set_index: i, exercise: x.name.trim(),
                 kind: x.kind || "weight_reps",
                 weight: Number(s.w) || 0, reps: Number(s.r) || 0,
                 distance: Number(s.d) || 0, seconds: Number(s.t) || 0 });
    }));
    return out;
  }

  let syncTimer = null;
  function queueSync() {
    saveLocal();
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncLift(false), 2500);
  }

  async function syncLift(finish) {
    const a = A();
    if (!a || !state.meId) return {};
    if (finish) { a.endedAt = a.endedAt || Date.now(); a.pendingFinish = true; }
    saveLocal();

    if (!navigator.onLine) { setSync("offline"); return { offline: true }; }
    setSync("saving");

    const res = await call("app_lift_save", {
      p_code: state.code, p_person: state.meId, p_session: a.id,
      p_label: a.label || "", p_date: a.date,
      p_duration: durationMin(a), p_sets: setsPayload(a),
      p_finished: !!(finish || a.pendingFinish), p_mode: state.mode,
      p_tz: deviceTZ(),
    });

    if (res.error) { setSync("offline"); return res; }
    setSync("saved");
    return res;
  }

  function setSync(s) {
    state.lift.sync = s;
    const el = document.getElementById("syncChip");
    if (el) { el.className = "sync " + s; el.textContent = syncWords(s); }
  }
  function syncWords(s) {
    return s === "saving" ? "Saving" : s === "saved" ? "Saved"
         : s === "offline" ? "Offline · will sync" : "";
  }

  // A finish that happened with no signal is still a finished workout. It
  // sits in localStorage until the phone is back, then goes up by itself.
  async function flushPending() {
    loadLocal();
    const a = A();
    if (!a || !a.pendingFinish || !navigator.onLine || !state.meId) return;
    const res = await syncLift(true);
    if (!res.error && !res.offline) {
      state.lift.active = null;
      saveLocal();
      state.lift.loaded = false;
    }
  }

  async function loadLift() {
    if (!state.meId) return;
    state.lift.exercises = cachedExercises();
    const res = await call("app_lift_home", {
      p_code: state.code, p_person: state.meId, p_limit: 20, p_mode: state.mode });
    if (res.error) { state.lift.msg = res.error; return; }
    state.lift.labels   = res.labels   || [];
    state.lift.sessions = res.sessions || [];
    if ((res.exercises || []).length) cacheExercises(res.exercises);
    state.lift.loaded = true;
  }

  // Starting a labelled day pulls the last one and lays it out ready to
  // tick off, weights and all. That is the whole reason there is no
  // template table: the last session already is the template.
  // V1.7. `iso` is which day the session belongs to. Until now it was
  // always today with no way to say otherwise, which meant a Cardio
  // session missed on Tuesday could never be recorded at all.
  async function startSession(label, iso) {
    const a = { id: uuid(), label: label || "", date: iso || todayISO(),
                startedAt: Date.now(), endedAt: null, ex: [], pendingFinish: false };

    // V1.7b. One call answers "what is this workout made of, and what did
    // I last lift for each part of it" — the explicit template if there is
    // one, the last session under that label if not. The LIST can now be
    // edited without doing the workout; the NUMBERS still come from what
    // was actually lifted, so they can never go stale.
    if (label && navigator.onLine) {
      const res = await call("app_template", {
        p_code: state.code, p_person: state.meId, p_label: label, p_mode: state.mode });
      const items = (res && res.items) || [];
      if (items.length) {
        a.ex = items.map((it) => {
          const last = Array.isArray(it.last) ? it.last : [];
          const n = Math.max(1, Number(it.sets) || last.length || 1);
          const sets = [];
          for (let i = 0; i < n; i++) {
            const src = last[i] || last[last.length - 1] || {};
            sets.push({ w: Number(src.w) || 0, r: Number(src.r) || 0,
                        d: Number(src.d) || 0, t: Number(src.t) || 0, on: false });
          }
          return { name: it.exercise, kind: it.kind || "weight_reps", sets };
        });
      }
    }

    state.lift.active = a;
    saveLocal();
    state.view = "session";
    render();
  }

  // A movement remembers what it is. "Pool Swim" comes back as metres and
  // a clock, "Yoga" as a clock, "Leg Press" as weight and reps — because
  // that is how you logged it last time, not because anything was set up.
  function kindFor(name, fallback) {
    const key = String(name).toLowerCase();
    const known = (state.lift.exercises || []).find(
      (e) => String(e.name || e).toLowerCase() === key);
    if (known && known.kind) return known.kind;
    for (const s of state.lift.sessions) {
      const hit = (s.exercises || []).find((e) => String(e.exercise).toLowerCase() === key);
      if (hit && hit.kind) return hit.kind;
    }
    // An explicit null means "only tell me if you already know", so a
    // brand-new name can take whatever the toggle says instead of
    // silently defaulting to weights.
    if (fallback === null) return null;
    return fallback || (state.mode === "cardio" ? "distance_time" : "weight_reps");
  }

  function addExercise(name, kind) {
    const a = A(); if (!a) return;
    const nm = String(name || "").trim();
    if (!nm) return;
    const k = kind || kindFor(nm);
    const prev = lastSetsFor(nm, k);
    a.ex.push({ name: nm, kind: k,
                sets: prev.length ? prev : [{ w:0, r:0, d:0, t:0, on:false }] });
    queueSync();
  }

  function lastSetsFor(name, kind) {
    const key = name.toLowerCase();
    for (const s of state.lift.sessions) {
      const hit = (s.exercises || []).find((e) => String(e.exercise).toLowerCase() === key);
      if (hit) {
        const n = Math.max(1, kind === "weight_reps" ? hit.sets : 1);
        return Array.from({ length: n }, () => ({
          w: Number(hit.top_weight) || 0, r: Number(hit.top_reps) || 0,
          d: Number(hit.distance) || 0,
          t: Math.round((Number(hit.seconds) || 0) / Math.max(1, hit.sets)),
          on: false }));
      }
    }
    return [];
  }

  /* ---------- lift views ------------------------------------------- */

  function agoWords(iso) {
    const d = Math.round((new Date(todayISO() + "T00:00:00Z") -
                          new Date(iso + "T00:00:00Z")) / 86400000);
    if (d <= 0) return "today";
    if (d === 1) return "yesterday";
    if (d < 7)  return d + " days ago";
    if (d < 14) return "last week";
    return Math.floor(d / 7) + " weeks ago";
  }
  const fullDate = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString(undefined,
    { timeZone: "UTC", weekday: "long", month: "short", day: "numeric" });

  function bestSetWords(e) {
    if (e.kind === "duration")      return mmss(e.seconds);
    if (e.kind === "distance_time") return `${distWords(e.distance)} \u00b7 ${mmss(e.seconds)}`;
    return `${wShow(e.top_weight)} ${units.w} \u00d7 ${e.top_reps}`;
  }

  function sessionCard(s, clickable) {
    const rows = (s.exercises || []).map((e) => `
      <tr><td class="nm">${e.kind === "weight_reps" ? e.sets + " &times; " : ""}${
            esc(e.exercise)}</td>
          <td>${bestSetWords(e)}</td></tr>`).join("");
    const meta = [`<span><b>${s.duration_min}m</b></span>`];
    if (Number(s.distance) > 0) meta.push(`<span><b>${distWords(s.distance)}</b></span>`);
    if (s.pr_count > 0)
      meta.push(`<span style="color:var(--train)"><b>${s.pr_count}</b> PR${
        s.pr_count === 1 ? "" : "s"}</span>`);
    return `
      <${clickable ? "button" : "div"} class="hcard" ${clickable ? `data-open="${s.id}"` : ""}>
        <h3>${esc(s.label || "Workout")}</h3>
        <p class="when">${esc(fullDate(s.entry_date))}</p>
        <div class="hmeta">${meta.join("")}</div>
        ${rows ? `<table class="htab"><thead><tr><th>${
                    state.mode === "cardio" ? "Activity" : "Exercise"}</th>
                  <th>${state.mode === "cardio" ? "Result" : "Best set"}</th></tr></thead>
                  <tbody>${rows}</tbody></table>` : ""}
      </${clickable ? "button" : "div"}>`;
  }

  function resumeBanner() {
    const a = A();
    if (!a || a.pendingFinish) return "";
    return `
      <div class="install" style="background:var(--train-soft)">
        <p><b style="color:var(--train)">${esc(a.label || "Workout")} in progress</b> &mdash;
           ${totalsWords(a)} logged.</p>
        <button class="btn-quiet" id="resume" style="flex:none">Resume</button>
      </div>`;
  }

  function liftTiles() {
    if (!state.lift.labels.length) return "";
    return `
      <section>
        <div class="section-head"><h2>${state.mode === "cardio"
            ? "Your activities" : "Your workouts"}</h2>
          <span class="eyebrow">tap to start</span></div>
        <div class="tiles">${state.lift.labels.map((l) => `
          <div class="tilewrap">
            <button class="tile" data-start="${esc(l.label)}">
              <b>${esc(l.label)}</b>
              <span class="ex">${esc(l.preview || "")}</span>
              <span class="ago">${esc(agoWords(l.last_date))}</span>
            </button>
            <button class="tilemenu" data-menu="${esc(l.label)}"
              aria-label="Options for ${esc(l.label)}">&hellip;</button>
            ${state.lift.menu === l.label ? `
              <div class="sheet">
                <button data-tmpl="${esc(l.label)}">Edit exercises</button>
                <button data-rename="${esc(l.label)}">Rename</button>
                <button data-drop="${esc(l.label)}">Remove tile</button>
              </div>` : ""}
          </div>`).join("")}</div>
        ${state.lift.rename !== null ? `
          <div class="addrow" style="margin-top:12px">
            <input class="field" id="renameVal" maxlength="24" autocomplete="off"
                   value="${esc(state.lift.rename)}" aria-label="New name">
            <button class="btn" id="renameGo" style="background:var(--train)">Save</button>
            <button class="btn-quiet" id="renameNo">Cancel</button>
            <p class="hint" style="flex-basis:100%;margin-top:0">Renames it on every
              session you logged under that name. The workouts themselves are untouched.</p>
          </div>` : ""}
        ${templateEditor()}
      </section>`;
  }

  /* ---------- editing what a workout is made of -----------------------
     V1.3 deliberately shipped without templates: the last session under a
     label WAS the template, so it could never drift from reality and
     there was nothing to maintain. That rule has one hole, and it is the
     one being closed here — you could not change a workout without doing
     it. Dropping an exercise from your Push day meant doing Push once
     without it.

     So the rule is layered rather than replaced. Save a list and it wins;
     clear the list and that label goes back to following your last
     session. Weights and reps are not stored: the list is yours, the
     numbers come from what you actually last lifted.
     ------------------------------------------------------------------ */
  function templateEditor() {
    const t = state.tmpl;
    if (!t) return "";
    return `
      <div class="tmpl" id="tmplBox">
        <h3>${esc(t.label)}</h3>
        ${t.items.length
          ? t.items.map((it, i) => `
            <div class="tmplrow">
              <span class="nm">${esc(it.exercise)}</span>
              <span class="sx">${it.sets} \u00d7</span>
              <button type="button" data-tup="${i}" ${i === 0 ? "disabled" : ""}
                aria-label="Move up">\u2191</button>
              <button type="button" data-tdown="${i}"
                ${i === t.items.length - 1 ? "disabled" : ""}
                aria-label="Move down">\u2193</button>
              <button type="button" data-tdel="${i}" aria-label="Remove">\u00d7</button>
            </div>`).join("")
          : `<p class="hint" style="margin:0 0 4px">Empty. Saving now puts this
              workout back to following whatever you last did under it.</p>`}
        <div class="exadd" style="margin-top:11px">
          <input class="field" id="tmplName" list="exlist" placeholder="Add ${
            state.mode === "cardio" ? "an activity" : "an exercise"}"
            autocomplete="off" maxlength="60" aria-label="Exercise to add">
          <button class="btn" id="tmplAdd" style="background:var(--train)">Add</button>
        </div>
        <datalist id="exlist">${state.lift.exercises.map((e) =>
          `<option value="${esc(e.name || e)}"></option>`).join("")}</datalist>
        <div class="addrow" style="margin-top:11px">
          <button class="btn" id="tmplSave">Save</button>
          <button class="btn-quiet" id="tmplCancel">Cancel</button>
        </div>
      </div>`;
  }

  async function openTemplate(label) {
    state.lift.menu = null;
    state.tmpl = { label, mode: state.mode, items: [], loading: true };
    render();
    const res = await call("app_template", {
      p_code: state.code, p_person: state.meId, p_label: label, p_mode: state.mode });
    state.tmpl = { label, mode: state.mode,
      items: (res.items || []).map((i) => ({
        exercise: i.exercise, kind: i.kind || "weight_reps", sets: Number(i.sets) || 1 })) };
    render();
  }

  function wireTemplate() {
    document.querySelectorAll("[data-tmpl]").forEach((el) =>
      el.addEventListener("click", () => openTemplate(el.dataset.tmpl)));

    const t = state.tmpl;
    if (!t) return;
    const swap = (i, j) => {
      [t.items[i], t.items[j]] = [t.items[j], t.items[i]];
      render();
    };
    document.querySelectorAll("[data-tup]").forEach((el) =>
      el.addEventListener("click", () => swap(+el.dataset.tup, +el.dataset.tup - 1)));
    document.querySelectorAll("[data-tdown]").forEach((el) =>
      el.addEventListener("click", () => swap(+el.dataset.tdown, +el.dataset.tdown + 1)));
    document.querySelectorAll("[data-tdel]").forEach((el) =>
      el.addEventListener("click", () => { t.items.splice(+el.dataset.tdel, 1); render(); }));

    const add = () => {
      const f = document.getElementById("tmplName");
      const name = (f.value || "").trim();
      if (!name) return;
      t.items.push({ exercise: name, kind: kindFor(name, "weight_reps"), sets: 1 });
      render();
      document.getElementById("tmplName")?.focus();
    };
    on("tmplAdd", "click", add);
    on("tmplName", "keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } });

    on("tmplCancel", "click", () => { state.tmpl = null; render(); });
    on("tmplSave", "click", async () => {
      const res = await call("app_template_save", {
        p_code: state.code, p_person: state.meId,
        p_label: t.label, p_mode: t.mode, p_items: t.items });
      if (res.error) { alert(res.error); return; }
      state.tmpl = null;
      await loadLift();
      render();
    });
  }

  function liftHistory() {
    if (!state.lift.sessions.length)
      return `<div class="dashed"><p class="empty">Nothing logged yet.<br>
        ${state.mode === "cardio"
          ? "Log a swim, row or ride and it appears here."
          : "Start a workout and it appears here, with your best set for every exercise."}
        </p></div>`;
    return `<section>
        <div class="section-head">
          <button class="foldbtn" id="foldHist" aria-expanded="${state.histOpen}">
            <span class="caret">${state.histOpen ? "\u25be" : "\u25b8"}</span>
            <h2>History</h2></button>
          <span class="eyebrow">${state.lift.sessions.length} logged</span></div>
        ${state.histOpen
          ? state.lift.sessions.map((s) => sessionCard(s, true)).join("") : ""}
      </section>`;
  }

  function sessionView() {
    const a = A();
    if (!a) { state.view = "exercise"; return metricView(); }

    const blocks = a.ex.map((x, i) => exBlock(x, i)).join("") ||
      `<div class="dashed"><p class="empty">No exercises yet.<br>
         Add the first one below.</p></div>`;

    const datalist = `<datalist id="exlist">${
      state.lift.exercises.map((e) =>
        `<option value="${esc(e.name || e)}"></option>`).join("")}</datalist>`;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; Exercise</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <div style="display:flex;align-items:center;gap:10px">
          <h1 style="flex:1;min-width:0">
            <input id="labelIn" class="labelin" value="${esc(a.label)}" maxlength="24"
                   placeholder="Name this day" autocomplete="off"
                   aria-label="What to call this workout"></h1>
          <button class="btn" id="finish" style="padding:10px 18px">Finish</button>
        </div>
        <div class="timer">
          <b id="elapsed">${clock(elapsedMs(a))}</b>
          <span id="sessTotals">${totalsWords(a)}</span>
        </div>
        <!-- V1.7. The escape hatch. The bar you tapped chose the day; this
             corrects it — for a midnight session filed under tomorrow, or
             a mistapped bar. Without it the only fix is delete and redo. -->
        <button type="button" class="sessdate" id="sessDate">
          ${a.date === todayISO() ? "Today" : esc(fullDate(a.date))}
          <span>change</span></button>
      </header>

      <div id="blocks">${blocks}</div>

      <div class="exadd">
        <input class="field" id="exName" list="exlist" placeholder="Add ${
          state.mode === "cardio" ? "an activity" : "an exercise"}"
               autocomplete="off" maxlength="60" aria-label="${
          state.mode === "cardio" ? "Activity" : "Exercise"} name">
        <button class="btn" id="exAdd" style="background:var(--train)">Add</button>
      </div>
      ${state.mode === "cardio" ? "" : `
      <div class="kindpick" role="group" aria-label="What this exercise records">
        ${[["weight_reps","weights"],["duration","time"]].map(([k, lbl]) =>
          `<button type="button" data-kind="${k}" aria-pressed="${
            (state.newKind || "weight_reps") === k}">${lbl}</button>`).join("")}
        <span>&mdash; remembered next time</span>
      </div>`}
      ${datalist}
