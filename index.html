  function cachedExercises() {
    try { return JSON.parse(localStorage.getItem(exKey()) || "[]"); } catch { return []; }
  }

  const A = () => state.lift.active;

  function elapsedMs(a) { return Math.max(0, (a.endedAt || Date.now()) - a.startedAt); }
  function clock(ms) {
    const s = Math.floor(ms / 1000);
    return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  }
  const setSeconds = (a) => (a.ex || []).reduce((t, x) =>
    t + x.sets.reduce((u, s) => u + (Number(s.t) || 0), 0), 0);

  // V2.1b. Three sources, in order of how much they know.
  //   * a number you typed always wins;
  //   * Cardio adds up the times you logged per activity — it has no
  //     running clock, because the clock was measuring the same thing
  //     twice and the logged times are the honest version;
  //   * Train keeps the stopwatch, which is genuinely useful between sets.
  function durationMin(a) {
    if (a.durOverride !== null && a.durOverride !== undefined)
      return Math.max(0, Math.round(Number(a.durOverride) || 0));
    if ((a.mode || state.mode) === "cardio")
      return Math.max(1, Math.ceil(setSeconds(a) / 60));
    return Math.max(1, Math.round(elapsedMs(a) / 60000));
  }

  // V1.4 deleted volume. What a session is worth is what you did in it,
  // not a number that rewards doing light things many times.
  function distanceOf(a) {
    let m = 0;
    for (const x of a.ex) for (const s of x.sets) if (s.on) m += Number(s.d) || 0;
    return m;
  }
  function totalsWords(a) {
    const n = doneSets(a);
    const d = distanceOf(a);
    const bits = [];
    if (d > 0) bits.push(distWords(d));
    bits.push(n + (state.mode === "cardio" ? (n === 1 ? " entry" : " entries")
                                           : (n === 1 ? " set"   : " sets")));
    return bits.join(" \u00b7 ");
  }
  function doneSets(a) {
    let n = 0;
    for (const x of a.ex) for (const s of x.sets) if (s.on) n++;
    return n;
  }

  // Only confirmed sets cross the wire. A half-filled row you never ticked
  // is a thought, not a lift, and it should not end up in anyone's volume.
  function setsPayload(a) {
    const out = [];
    a.ex.forEach((x, pos) => x.sets.forEach((s, i) => {
      if (!s.on || !String(x.name || "").trim()) return;
      out.push({ position: pos, set_index: i, exercise: x.name.trim(),
                 kind: x.kind || "weight_reps",
                 weight: Number(s.w) || 0, reps: Number(s.r) || 0,
                 distance: Number(s.d) || 0, seconds: Number(s.t) || 0 });
    }));
    return out;
  }

  let syncTimer = null;
  function queueSync() {
    saveLocal();
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncLift(false), 2500);
  }

  async function syncLift(finish) {
    const a = A();
    if (!a || !state.meId) return {};
    if (finish) { a.endedAt = a.endedAt || Date.now(); a.pendingFinish = true; }
    saveLocal();

    if (!navigator.onLine) { setSync("offline"); return { offline: true }; }
    setSync("saving");

    const res = await call("app_lift_save", {
      p_code: state.code, p_person: state.meId, p_session: a.id,
      p_label: a.label || "", p_note: a.note || null, p_date: a.date,
      p_duration: durationMin(a), p_sets: setsPayload(a),
      p_finished: !!(finish || a.pendingFinish), p_mode: a.mode || state.mode,
      p_tz: deviceTZ(),
      // Somebody typed this duration, or edited the session from History.
      // Either way it is a deliberate statement about that day.
      p_claim: a.durOverride !== null && a.durOverride !== undefined,
    });

    if (res.error) { setSync("offline"); return res; }
    setSync("saved");
    return res;
  }

  function setSync(s) {
    state.lift.sync = s;
    const el = document.getElementById("syncChip");
    if (el) { el.className = "sync " + s; el.textContent = syncWords(s); }
  }
  function syncWords(s) {
    return s === "saving" ? "Saving" : s === "saved" ? "Saved"
         : s === "offline" ? "Offline · will sync" : "";
  }

  // A finish that happened with no signal is still a finished workout. It
  // sits in localStorage until the phone is back, then goes up by itself.
  async function flushPending() {
    loadLocal();
    const a = A();
    if (!a || !a.pendingFinish || !navigator.onLine || !state.meId) return;
    const res = await syncLift(true);
    if (!res.error && !res.offline) {
      state.lift.active = null;
      saveLocal();
      state.lift.loaded = false;
    }
  }

  async function loadLift() {
    if (!state.meId) return;
    state.lift.exercises = cachedExercises();
    const res = await call("app_lift_home", {
      p_code: state.code, p_person: state.meId, p_limit: 20, p_mode: state.mode });
    if (res.error) { state.lift.msg = res.error; return; }
    state.lift.labels   = res.labels   || [];
    state.lift.sessions = res.sessions || [];
    if ((res.exercises || []).length) cacheExercises(res.exercises);
    state.lift.loaded = true;
  }

  // Starting a labelled day pulls the last one and lays it out ready to
  // tick off, weights and all. That is the whole reason there is no
  // template table: the last session already is the template.
  // V1.7. `iso` is which day the session belongs to. Until now it was
  // always today with no way to say otherwise, which meant a Cardio
  // session missed on Tuesday could never be recorded at all.
  async function startSession(label, iso) {
    const a = { id: uuid(), label: label || "", date: iso || todayISO(),
                startedAt: Date.now(), endedAt: null, ex: [], pendingFinish: false,
                mode: state.mode, durOverride: null, note: "",
                // Started from a tile, so the name is settled.
                fromTile: !!label };

    // V1.7b. One call answers "what is this workout made of, and what did
    // I last lift for each part of it" — the explicit template if there is
    // one, the last session under that label if not. The LIST can now be
    // edited without doing the workout; the NUMBERS still come from what
    // was actually lifted, so they can never go stale.
    if (label && navigator.onLine) {
      const res = await call("app_template", {
        p_code: state.code, p_person: state.meId, p_label: label, p_mode: state.mode });
      const items = (res && res.items) || [];
      if (items.length) {
        a.ex = items.map((it) => {
          const last = Array.isArray(it.last) ? it.last : [];
          const n = Math.max(1, Number(it.sets) || last.length || 1);
          const sets = [];
          for (let i = 0; i < n; i++) {
            const src = last[i] || last[last.length - 1] || {};
            const w = Number(src.w) || 0, r = Number(src.r) || 0;
            const d = Number(src.d) || 0, t = Number(src.t) || 0;
            // Prefilled AND remembered: pw/pr/pd/pt are last time's, and
            // they stay put while you type over w/r/d/t.
            sets.push({ w, r, d, t, on: false, pw: w, pr: r, pd: d, pt: t });
          }
          return { name: it.exercise, kind: it.kind || "weight_reps", sets };
        });
      }
    }

    state.lift.active = a;
    saveLocal();
    state.view = "session";
    render();
  }

  // A movement remembers what it is. "Pool Swim" comes back as metres and
  // a clock, "Yoga" as a clock, "Leg Press" as weight and reps — because
  // that is how you logged it last time, not because anything was set up.
  function kindFor(name, fallback) {
    const key = String(name).toLowerCase();
    const known = (state.lift.exercises || []).find(
      (e) => String(e.name || e).toLowerCase() === key);
    if (known && known.kind) return known.kind;
    for (const s of state.lift.sessions) {
      const hit = (s.exercises || []).find((e) => String(e.exercise).toLowerCase() === key);
      if (hit && hit.kind) return hit.kind;
    }
    // An explicit null means "only tell me if you already know", so a
    // brand-new name can take whatever the toggle says instead of
    // silently defaulting to weights.
    if (fallback === null) return null;
    return fallback || (state.mode === "cardio" ? "distance_time" : "weight_reps");
  }

  function addExercise(name, kind) {
    const a = A(); if (!a) return;
    const nm = String(name || "").trim();
    if (!nm) return;
    const k = kind || kindFor(nm);
    const prev = lastSetsFor(nm, k);
    a.ex.push({ name: nm, kind: k,
                sets: prev.length ? prev : [{ w:0, r:0, d:0, t:0, on:false }] });
    queueSync();
  }

  function lastSetsFor(name, kind) {
    const key = name.toLowerCase();
    for (const s of state.lift.sessions) {
      const hit = (s.exercises || []).find((e) => String(e.exercise).toLowerCase() === key);
      if (hit) {
        const n = Math.max(1, kind === "weight_reps" ? hit.sets : 1);
        const w = Number(hit.top_weight) || 0, r = Number(hit.top_reps) || 0;
        const d = Number(hit.distance) || 0;
        const t = Math.round((Number(hit.seconds) || 0) / Math.max(1, hit.sets));
        return Array.from({ length: n }, () => ({
          w, r, d, t, on: false, pw: w, pr: r, pd: d, pt: t }));
      }
    }
    return [];
  }

  /* ---------- lift views ------------------------------------------- */

  function agoWords(iso) {
    const d = Math.round((new Date(todayISO() + "T00:00:00Z") -
                          new Date(iso + "T00:00:00Z")) / 86400000);
    if (d <= 0) return "today";
    if (d === 1) return "yesterday";
    if (d < 7)  return d + " days ago";
    if (d < 14) return "last week";
    return Math.floor(d / 7) + " weeks ago";
  }
  const fullDate = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString(undefined,
    { timeZone: "UTC", weekday: "long", month: "short", day: "numeric" });

  function bestSetWords(e) {
    if (e.kind === "duration")      return mmss(e.seconds);
    if (e.kind === "distance_time") return `${distWords(e.distance)} \u00b7 ${mmss(e.seconds)}`;
    return `${wShow(e.top_weight)} ${units.w} \u00d7 ${e.top_reps}`;
  }

  function sessionCard(s, clickable) {
    const rows = (s.exercises || []).map((e) => `
      <tr><td class="nm">${e.kind === "weight_reps" ? e.sets + " &times; " : ""}${
            esc(e.exercise)}</td>
          <td>${bestSetWords(e)}</td></tr>`).join("");
    const meta = [`<span><b>${s.duration_min}m</b></span>`];
    if (Number(s.distance) > 0) meta.push(`<span><b>${distWords(s.distance)}</b></span>`);
    if (s.pr_count > 0)
      meta.push(`<span style="color:var(--train)"><b>${s.pr_count}</b> PR${
        s.pr_count === 1 ? "" : "s"}</span>`);
    return `
      <${clickable ? "button" : "div"} class="hcard" ${clickable ? `data-open="${s.id}"` : ""}>
        <h3>${esc(s.label || "Workout")}${s.note
          ? `<span class="hnote">${esc(s.note)}</span>` : ""}</h3>
        <p class="when">${esc(fullDate(s.entry_date))}</p>
        <div class="hmeta">${meta.join("")}</div>
        ${rows ? `<table class="htab"><thead><tr><th>${
                    state.mode === "cardio" ? "Activity" : "Exercise"}</th>
                  <th>${state.mode === "cardio" ? "Result" : "Best set"}</th></tr></thead>
                  <tbody>${rows}</tbody></table>` : ""}
      </${clickable ? "button" : "div"}>`;
  }

  function resumeBanner() {
    const a = A();
    if (!a || a.pendingFinish) return "";
    return `
      <div class="install" style="background:var(--train-soft)">
        <p><b style="color:var(--train)">${esc(a.label || "Workout")} in progress</b> &mdash;
           ${totalsWords(a)} logged.</p>
        <button class="btn-quiet" id="resume" style="flex:none">Resume</button>
      </div>`;
  }

  function liftTiles() {
    if (!state.lift.labels.length) return "";
    return `
      <section>
        <div class="section-head"><h2>My Templates</h2>
          <span class="eyebrow">tap to start</span></div>
        <div class="tiles">${state.lift.labels.map((l) => `
          <div class="tilewrap">
            <button class="tile" data-start="${esc(l.label)}">
              <b>${esc(l.label)}</b>
              <span class="ex">${esc(l.preview || "")}</span>
              <span class="ago">${esc(agoWords(l.last_date))}</span>
            </button>
            <button class="tilemenu" data-menu="${esc(l.label)}"
              aria-label="Options for ${esc(l.label)}">&hellip;</button>
            ${state.lift.menu === l.label ? `
              <div class="sheet">
                <button data-tmpl="${esc(l.label)}">Edit exercises</button>
                <button data-rename="${esc(l.label)}">Rename</button>
                <button data-drop="${esc(l.label)}">Remove tile</button>
              </div>` : ""}
          </div>`).join("")}</div>
        ${state.lift.rename !== null ? `
          <div class="addrow" style="margin-top:12px">
            <input class="field" id="renameVal" maxlength="24" autocomplete="off"
                   value="${esc(state.lift.rename)}" aria-label="New name">
            <button class="btn" id="renameGo" style="background:var(--train)">Save</button>
            <button class="btn-quiet" id="renameNo">Cancel</button>
            <p class="hint" style="flex-basis:100%;margin-top:0">Renames it on every
              session you logged under that name. The workouts themselves are untouched.</p>
          </div>` : ""}
        ${templateEditor()}
      </section>`;
  }

  /* ---------- editing what a workout is made of -----------------------
     V1.3 deliberately shipped without templates: the last session under a
     label WAS the template, so it could never drift from reality and
     there was nothing to maintain. That rule has one hole, and it is the
     one being closed here — you could not change a workout without doing
     it. Dropping an exercise from your Push day meant doing Push once
     without it.

     So the rule is layered rather than replaced. Save a list and it wins;
     clear the list and that label goes back to following your last
     session. Weights and reps are not stored: the list is yours, the
     numbers come from what you actually last lifted.
     ------------------------------------------------------------------ */
  function templateEditor() {
    const t = state.tmpl;
    if (!t) return "";
    return `
      <div class="tmpl" id="tmplBox">
        <h3>${esc(t.label)}</h3>
        ${t.items.length
          ? t.items.map((it, i) => `
            <div class="tmplrow">
              <span class="nm">${esc(it.exercise)}</span>
              <span class="sx">${it.sets} \u00d7</span>
              <button type="button" data-tup="${i}" ${i === 0 ? "disabled" : ""}
                aria-label="Move up">\u2191</button>
              <button type="button" data-tdown="${i}"
                ${i === t.items.length - 1 ? "disabled" : ""}
                aria-label="Move down">\u2193</button>
              <button type="button" data-tdel="${i}" aria-label="Remove">\u00d7</button>
            </div>`).join("")
          : `<p class="hint" style="margin:0 0 4px">Empty. Saving now puts this
              workout back to following whatever you last did under it.</p>`}
        <div class="exadd" style="margin-top:11px">
          <input class="field" id="tmplName" list="exlist" placeholder="Add ${
            state.mode === "cardio" ? "an activity" : "an exercise"}"
            autocomplete="off" maxlength="60" aria-label="Exercise to add">
          <button class="btn" id="tmplAdd" style="background:var(--train)">Add</button>
        </div>
        <datalist id="exlist">${state.lift.exercises.map((e) =>
          `<option value="${esc(e.name || e)}"></option>`).join("")}</datalist>
        <div class="addrow" style="margin-top:11px">
          <button class="btn" id="tmplSave">Save</button>
          <button class="btn-quiet" id="tmplCancel">Cancel</button>
        </div>
      </div>`;
  }

  async function openTemplate(label) {
    state.lift.menu = null;
    state.tmpl = { label, mode: state.mode, items: [], loading: true };
    render();
    const res = await call("app_template", {
      p_code: state.code, p_person: state.meId, p_label: label, p_mode: state.mode });
    state.tmpl = { label, mode: state.mode,
      items: (res.items || []).map((i) => ({
        exercise: i.exercise, kind: i.kind || "weight_reps", sets: Number(i.sets) || 1 })) };
    render();
  }

  function wireTemplate() {
    document.querySelectorAll("[data-tmpl]").forEach((el) =>
      el.addEventListener("click", () => openTemplate(el.dataset.tmpl)));

    const t = state.tmpl;
    if (!t) return;
    const swap = (i, j) => {
      [t.items[i], t.items[j]] = [t.items[j], t.items[i]];
      render();
    };
    document.querySelectorAll("[data-tup]").forEach((el) =>
      el.addEventListener("click", () => swap(+el.dataset.tup, +el.dataset.tup - 1)));
    document.querySelectorAll("[data-tdown]").forEach((el) =>
      el.addEventListener("click", () => swap(+el.dataset.tdown, +el.dataset.tdown + 1)));
    document.querySelectorAll("[data-tdel]").forEach((el) =>
      el.addEventListener("click", () => { t.items.splice(+el.dataset.tdel, 1); render(); }));

    const add = () => {
      const f = document.getElementById("tmplName");
      const name = (f.value || "").trim();
      if (!name) return;
      t.items.push({ exercise: name, kind: kindFor(name, "weight_reps"), sets: 1 });
      render();
      document.getElementById("tmplName")?.focus();
    };
    on("tmplAdd", "click", add);
    on("tmplName", "keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } });

    on("tmplCancel", "click", () => { state.tmpl = null; render(); });
    on("tmplSave", "click", async () => {
      const res = await call("app_template_save", {
        p_code: state.code, p_person: state.meId,
        p_label: t.label, p_mode: t.mode, p_items: t.items });
      if (res.error) { alert(res.error); return; }
      state.tmpl = null;
      await loadLift();
      render();
    });
  }

  function liftHistory() {
    if (!state.lift.sessions.length)
      return `<div class="dashed"><p class="empty">Nothing logged yet.<br>
        ${state.mode === "cardio"
          ? "Log a swim, row or ride and it appears here."
          : "Start a workout and it appears here, with your best set for every exercise."}
        </p></div>`;
    return `<section>
        <div class="section-head">
          <button class="foldbtn" id="foldHist" aria-expanded="${state.histOpen}">
            <span class="caret">${state.histOpen ? "\u25be" : "\u25b8"}</span>
            <h2>History</h2></button>
          <span class="eyebrow">${state.lift.sessions.length} logged</span></div>
        ${state.histOpen
          ? state.lift.sessions.map((s) => sessionCard(s, true)).join("") : ""}
      </section>`;
  }

  function sessionView() {
    const a = A();
    if (!a) { state.view = "exercise"; return metricView(); }

    const blocks = a.ex.map((x, i) => exBlock(x, i)).join("") ||
      `<div class="dashed"><p class="empty">No exercises yet.<br>
         Add the first one below.</p></div>`;

    const datalist = `<datalist id="exlist">${
      state.lift.exercises.map((e) =>
        `<option value="${esc(e.name || e)}"></option>`).join("")}</datalist>`;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; Exercise</button>
        <span class="sync ${state.lift.sync}" id="syncChip">${syncWords(state.lift.sync)}</span>
      </div>

      <header class="masthead">
        <div style="display:flex;align-items:center;gap:10px">
          <h1 style="flex:1;min-width:0">${a.fromTile
            // V2.4. You already said which workout this is, by tapping its
            // tile. Leaving the name editable here meant a stray keystroke
            // minted a second tile that looked like a duplicate of the
            // first \u2014 and there was no way to tell "today is C2" apart
            // from "C is now called C2". So a workout started from a tile
            // carries that tile's name as a heading. Renaming lives on the
            // tile, where it means one thing.
            ? `<span class="labelfix">${esc(a.label)}</span>`
            : `<input id="labelIn" class="labelin" value="${esc(a.label)}" maxlength="24"
                   placeholder="Name this day" autocomplete="off"
                   aria-label="What to call this workout">`}</h1>
          <button class="btn" id="finish" style="padding:10px 18px">Finish</button>
        </div>
        ${a.fromTile ? `
          <!-- V2.5. Which workout this is, and what today's was, are two
               different facts. The tile above is the first; this is the
               second. It goes in History and never makes a tile, which
               is what the old editable title could not promise. -->
          <input id="noteIn" class="notein" value="${esc(a.note || "")}" maxlength="40"
                 placeholder="+ name today \u2014 C2, heavy singles…"
                 autocomplete="off" aria-label="A note for today's workout">` : ""}
        <div class="timer">
          ${(a.mode || state.mode) === "cardio" || a.durOverride !== null
            ? `<span class="durwrap"><input id="durIn" class="durin" type="number"
                 inputmode="numeric" min="0" max="600" value="${durationMin(a)}"
                 aria-label="Minutes"><em>min</em></span>`
            : `<b id="elapsed">${clock(elapsedMs(a))}</b>
               <button type="button" class="linkbtn" id="durEdit"
                 style="font-size:11px;color:var(--muted)">edit</button>`}
          <span id="sessTotals">${totalsWords(a)}</span>
        </div>
        <!-- V1.7. The escape hatch. The bar you tapped chose the day; this
             corrects it — for a midnight session filed under tomorrow, or
             a mistapped bar. Without it the only fix is delete and redo. -->
        <button type="button" class="sessdate" id="sessDate">
          ${a.date === todayISO() ? "Today" : esc(fullDate(a.date))}
          <span>change</span></button>
      </header>

      <div id="blocks">${blocks}</div>

      <div class="exadd">
        <input class="field" id="exName" list="exlist" placeholder="Add ${
          state.mode === "cardio" ? "an activity" : "an exercise"}"
               autocomplete="off" maxlength="60" aria-label="${
          state.mode === "cardio" ? "Activity" : "Exercise"} name">
        <button class="btn" id="exAdd" style="background:var(--train)">Add</button>
      </div>
      ${datalist}

      <p class="hint" id="liftHint">${esc(state.lift.msg || "")}</p>

      <button class="linkbtn" id="scrap" style="color:var(--muted);text-align:left;
        align-self:flex-start;font-size:12px">Discard this ${
        state.mode === "cardio" ? "activity" : "workout"}</button>

      <p class="ver">v${APP_VERSION}</p>`;
  }

  // One row shape per kind. This is the whole reason Cardio needed no
  // second app: the exercise decides the columns, exactly as Strong does.
  const COLS = {
    weight_reps:   () => [units.w, "reps"],
    duration:      () => ["time"],
    distance_time: () => [units.d, "time"],
  };

  // V2.3. What you lifted last time, beside the box you are about to type
  // in. The numbers were already being PREFILLED from the last session,
  // which sounds like the same thing and is not: once you overwrite the
  // box, the thing you were trying to beat is gone off the screen.
  function prevWords(s, kind) {
    if (!s) return "";
    if (kind === "duration")      return s.pt ? mmss(s.pt) : "";
    if (kind === "distance_time") return (s.pd || s.pt)
      ? `${s.pd ? dShow(s.pd) : "0"}\u00b7${mmss(s.pt || 0)}` : "";
    return s.pw ? `${wShow(s.pw)}\u00d7${s.pr || 0}` : "";
  }

  function exBlock(x, i) {
    const kind = x.kind || "weight_reps";
    const cols = COLS[kind]();
    const cls  = kind === "weight_reps" ? "" : cols.length === 1 ? " one" : "";
    // The unit choice used to be one row at the FOOT of the workout, two
    // buttons reading "weights time", which is a sentence nobody wrote and
    // applied to whatever you typed next. It belongs to the exercise, so
    // it lives on the exercise — and only until the exercise has a history
    // or a ticked set, after which it is settled and the control is noise.
    const settled = (x.sets || []).some((t) => t.on) || kindFor(x.name, null) !== null;
    const picker = (state.mode === "cardio" || settled) ? "" : `
      <div class="kindmini" role="group" aria-label="What ${esc(x.name)} records">
        ${[["weight_reps","weights"],["duration","time"]].map(([kk, lbl]) =>
          `<button type="button" data-exkind="${i}:${kk}"
            aria-pressed="${kind === kk}">${lbl}</button>`).join("")}
      </div>`;

    const field = (s, j, f, ph, label) => {
      const val = f === "w" ? (s.w ? wShow(s.w) : "")
                : f === "r" ? (s.r || "")
                : f === "d" ? (s.d ? dShow(s.d) : "")
                : (s.t ? mmss(s.t) : "");
      const numeric = f === "r";
      return `<input type="${f === "t" ? "text" : "number"}"
             inputmode="${f === "t" ? "numeric" : numeric ? "numeric" : "decimal"}"
             data-ex="${i}" data-set="${j}" data-f="${f}"
             class="${s.on ? "on" : ""}" value="${val}" placeholder="${ph}"
             aria-label="Set ${j + 1} ${label}">`;
    };

    const rows = x.sets.map((s, j) => {
      const cells =
        kind === "weight_reps"   ? field(s,j,"w","0",units.w) + field(s,j,"r","0","reps")
      : kind === "duration"      ? field(s,j,"t","0:00","time")
      :                            field(s,j,"d","0",units.d) + field(s,j,"t","0:00","time");
      const pw = prevWords(s, kind);
      return `<span class="ix">${j + 1}</span>
      <span class="prev">${pw || "\u2013"}</span>${cells}
      <button class="tick" data-tick="${i}:${j}" aria-pressed="${!!s.on}"
              aria-label="Mark ${j + 1} done">&#10003;</button>
      <button class="xset" data-delset="${i}:${j}"
              aria-label="Delete set ${j + 1}">&times;</button>`;
    }).join("");

    return `
      <div class="exblock" id="ex-${i}">
        <div class="exhead">
          <input class="exname" data-exname="${i}" value="${esc(x.name)}" maxlength="60"
                 aria-label="Exercise name">
          ${picker}
          <button class="xbtn" data-delex="${i}" aria-label="Remove ${esc(x.name)}">&times;</button>
        </div>
        <div class="setgrid${cls}">
          <span class="hd">#</span><span class="hd">Prev</span>${cols.map((c) =>
            (c === units.w || c === units.d)
              ? `<button class="hd unit" data-cycle="${c === units.w ? "w" : "d"}"
                   aria-label="Change unit">${esc(c)}</button>`
              : `<span class="hd">${esc(c)}</span>`).join("")}
          <span class="hd"></span><span class="hd"></span>
          ${rows}
        </div>
        <button class="addset" data-addset="${i}">+ Add ${
          kind === "weight_reps" ? "set" : "entry"}</button>
      </div>`;
  }

  function detailView() {
    const s = state.lift.detail;
    if (!s) { state.view = "exercise"; return metricView(); }
    const byPos = new Map();
    for (const r of (s.sets || [])) {
      if (!byPos.has(r.position)) byPos.set(r.position, { name: r.exercise, sets: [] });
      byPos.get(r.position).sets.push(r);
    }
    const cell = (r) =>
        r.kind === "duration"      ? mmss(r.seconds)
      : r.kind === "distance_time" ? `${distWords(r.distance)} \u00b7 ${mmss(r.seconds)}`
      :                              `${wShow(r.weight)} ${units.w} \u00d7 ${r.reps}`;
    const blocks = [...byPos.entries()].sort((a, b) => a[0] - b[0]).map(([, x]) => `
      <div class="exblock">
        <div class="exhead"><b>${esc(x.name)}</b></div>
        <table class="htab"><tbody>${x.sets.map((r, i) => `
          <tr><td class="nm">${x.sets.length > 1 ? "Set " + (i + 1) : "\u2014"}</td>
              <td>${cell(r)}</td></tr>`).join("")}</tbody></table>
      </div>`).join("");

    const mine = s.person_id === state.meId;

    return `
      <div class="topbar">
        <button class="backlink" id="back">&larr; Back</button>
      </div>

      <header class="masthead">
        <h1 style="color:var(--train)">${esc(s.label || "Workout")}${s.note
          ? `<span class="hnote">${esc(s.note)}</span>` : ""}</h1>
        <p class="sub">${esc(s.person)} &middot; ${esc(fullDate(s.entry_date))}</p>
        <div class="timer" style="margin-top:8px">
          <span><b>${s.duration_min}m</b></span>
          ${Number(s.distance) > 0 ? `<span><b>${distWords(s.distance)}</b></span>` : ""}
          ${s.pr_count > 0 ? `<span style="color:var(--train)">
            <b>${s.pr_count}</b> PR${s.pr_count === 1 ? "" : "s"}</span>` : ""}
        </div>
      </header>

      ${blocks}

      ${mine ? `<div class="addrow" style="margin-top:6px">
        <button class="btn" id="editSession">Edit</button>
        <button class="linkbtn" id="delSession" style="color:var(--warn)">
          Delete this workout</button>
      </div>` : ""}

      <p class="ver">v${APP_VERSION}</p>`;
  }

  /* ---------- lift painting ----------------------------------------
     Repaint the smallest thing that changed. V1.2 taught this the hard
     way: a full re-render while someone is typing throws the number away.
     ------------------------------------------------------------------ */

  let tick = null;
  function startTicking() {
    stopTicking();
    tick = setInterval(() => {
      const a = A(); const el = document.getElementById("elapsed");
      if (!a || !el) return stopTicking();
      el.textContent = clock(elapsedMs(a));
    }, 1000);
  }
  function stopTicking() { if (tick) { clearInterval(tick); tick = null; } }

  function paintTotals() {
    const a = A(); const el = document.getElementById("sessTotals");
    if (a && el) el.innerHTML = totalsWords(a);
  }

  function paintEx(i) {
    const a = A(); if (!a) return;
    const host = document.getElementById("ex-" + i);
    if (!host) return;
    const frag = document.createElement("div");
    frag.innerHTML = exBlock(a.ex[i], i);
    host.replaceWith(frag.firstElementChild);
    wireExBlock(i);
    paintTotals();
  }

  function wireExBlock(i) {
    const host = document.getElementById("ex-" + i);
    if (!host) return;
    const a = A();

    host.querySelectorAll("input[data-ex]").forEach((el) => {
      el.addEventListener("input", () => {
        const s = a.ex[+el.dataset.ex].sets[+el.dataset.set];
        const f = el.dataset.f, v = el.value;
        // Typed in whatever unit the phone is showing; stored in pounds
        // and metres. The conversion lives here and nowhere else.
        if (f === "t")      s.t = parseClock(v);
        else if (f === "d") s.d = v === "" ? 0 : dIn(Number(v));
        else if (f === "w") s.w = v === "" ? 0 : wIn(Number(v));
        else                s.r = v === "" ? 0 : Number(v);
        paintTotals();
        queueSync();
      });
    });

    host.querySelectorAll("[data-tick]").forEach((el) => {
      el.addEventListener("click", () => {
        const [xi, si] = el.dataset.tick.split(":").map(Number);
        const s = a.ex[xi].sets[si];
        s.on = !s.on;
        el.setAttribute("aria-pressed", String(s.on));
        host.querySelectorAll(`input[data-ex="${xi}"][data-set="${si}"]`)
            .forEach((f) => f.classList.toggle("on", s.on));
        paintTotals();
        queueSync();
      });
    });

    const add = host.querySelector("[data-addset]");
    if (add) add.addEventListener("click", () => {
      const sets = a.ex[i].sets;
      const last = sets[sets.length - 1] || {};
      sets.push({ w: last.w || 0, r: last.r || 0, d: last.d || 0, t: last.t || 0, on: false,
                  pw: last.pw || 0, pr: last.pr || 0, pd: last.pd || 0, pt: last.pt || 0 });
      queueSync();
      paintEx(i);
      const rows = document.querySelectorAll(`#ex-${i} .setgrid input`);
      const kindCols = (a.ex[i].kind === "weight_reps") ? 2 : (a.ex[i].kind === "duration" ? 1 : 2);
      const f = rows[rows.length - kindCols];
      if (f) { f.focus(); f.select(); }
    });

    // The weights/time switch, now on the exercise it describes. Changing
    // it keeps the rows and clears the columns that no longer apply, so a
    // plank typed as 3 reps does not silently become 3 seconds.
    host.querySelectorAll("[data-exkind]").forEach((el) =>
      el.addEventListener("click", () => {
        const [xi, kk] = el.dataset.exkind.split(":");
        const x = a.ex[+xi];
        if (!x || x.kind === kk) return;
        x.kind = kk;
        for (const t of x.sets) {
          if (kk === "duration") { t.w = 0; t.r = 0; }
          else { t.t = 0; t.d = 0; }
        }
        queueSync();
        paintEx(+xi);
      }));

    const del = host.querySelector("[data-delex]");
    if (del) del.addEventListener("click", () => {
      a.ex.splice(i, 1);
      queueSync();
      render();
    });

    // V2.1b. Rename an exercise in place, and delete one set rather than
    // the whole exercise. Removing the last set removes the exercise,
    // because an exercise with no sets is not a thing that happened.
    const nm = host.querySelector("[data-exname]");
    if (nm) nm.addEventListener("change", () => {
      const v = (nm.value || "").trim();
      if (!v) { nm.value = a.ex[i].name; return; }
      a.ex[i].name = v;
      a.ex[i].kind = kindFor(v, a.ex[i].kind);
      queueSync();
      render();
    });

    host.querySelectorAll("[data-delset]").forEach((el) =>
      el.addEventListener("click", () => {
        const j = Number(el.dataset.delset.split(":")[1]);
        a.ex[i].sets.splice(j, 1);
        if (!a.ex[i].sets.length) a.ex.splice(i, 1);
        queueSync();
        render();
      }));
  }

  function wireLift() {
    on("back", "click", () => {
      stopTicking();
      // A session opened from the board belongs to the board. Sending
      // someone who tapped a relative's volume chip into their own Lift
      // history is a small thing that feels like being lost.
      if (state.view === "detail") {
        state.lift.detail = null;
        state.view = state.lift.from === "board" ? "board" : "exercise";
      }
      else if (state.view === "session") state.view = "exercise";
      else state.view = "board";
      if (state.view === "board") { state.seg = "steps"; state.entryDate = null; }
      render();
    });

    if (state.view === "exercise") {
      on("startEmpty", "click", () => startSession(""));
      on("resume", "click", () => { state.view = "session"; render(); });
      document.querySelectorAll("[data-start]").forEach((el) =>
        el.addEventListener("click", () => startSession(el.dataset.start)));
      document.querySelectorAll("[data-open]").forEach((el) =>
        el.addEventListener("click", () => openSession(el.dataset.open)));

      document.querySelectorAll("[data-wunit]").forEach((el) =>
        el.addEventListener("click", () => { units.w = el.dataset.wunit; render(); }));
      document.querySelectorAll("[data-dunit]").forEach((el) =>
        el.addEventListener("click", () => { units.d = el.dataset.dunit; render(); }));

      document.querySelectorAll("[data-menu]").forEach((el) =>
        el.addEventListener("click", () => {
          state.lift.menu = state.lift.menu === el.dataset.menu ? null : el.dataset.menu;
          state.lift.rename = null;
          render();
        }));
      document.querySelectorAll("[data-rename]").forEach((el) =>
        el.addEventListener("click", () => {
          state.lift.rename = el.dataset.rename;
          state.lift.renameFrom = el.dataset.rename;
          state.lift.menu = null;
          render();
          const f = document.getElementById("renameVal");
          if (f) { f.focus(); f.select(); }
        }));
      on("renameNo", "click", () => { state.lift.rename = null; render(); });
      on("renameGo", "click", () => saveLabel(
        (document.getElementById("renameVal").value || "").trim()));
      on("renameVal", "keydown", (e) => {
        if (e.key === "Enter") document.getElementById("renameGo").click();
        if (e.key === "Escape") { state.lift.rename = null; render(); }
      });
      document.querySelectorAll("[data-drop]").forEach((el) =>
        el.addEventListener("click", async () => {
          if (!confirm(`Remove the "${el.dataset.drop}" tile? The workouts you logged
under it stay in your history, they just stop being a tile.`)) return;
          state.lift.renameFrom = el.dataset.drop;
          await saveLabel("");
        }));
    }

    if (state.view === "session") {
      const a = A();
      a.ex.forEach((_, i) => wireExBlock(i));
      if ((a.mode || state.mode) !== "cardio" &&
          (a.durOverride === null || a.durOverride === undefined)) startTicking();

      // Typing a duration takes the day: the chart moves to match.
      on("durEdit", "click", () => {
        A().durOverride = durationMin(A());
        stopTicking();
        render();
        const f = document.getElementById("durIn");
        if (f) { f.focus(); f.select(); }
      });
      on("durIn", "change", () => {
        const f = document.getElementById("durIn");
        const v = Math.max(0, Math.min(600, Math.round(Number(f.value) || 0)));
        A().durOverride = v;
        saveLocal();
        queueSync();
        paintTotals();
      });

      // One tap steps the session back a day; it wraps round to today
      // after a fortnight, because anything older than that is a bar on
      // the chart, not a button you should press fourteen times.
      on("sessDate", "click", () => {
        const back = Math.round((new Date(todayISO() + "T00:00:00Z") -
                                 new Date(a.date + "T00:00:00Z")) / 86400000);
        a.date = back >= 13 ? todayISO() : shiftISO(a.date, -1);
        saveLocal();
        queueSync();
        render();
      });

      // Tapping the unit in a column header cycles it. Putting the switch
      // on the header means you can go metric mid-swim without leaving
      // the session to find a setting.
      document.querySelectorAll("[data-cycle]").forEach((el) =>
        el.addEventListener("click", () => {
          if (el.dataset.cycle === "w") units.w = units.w === "lb" ? "kg" : "lb";
          else units.d = units.d === "mi" ? "km" : units.d === "km" ? "m" : "mi";
          render();
        }));

      on("exAdd", "click", () => {
        const f = document.getElementById("exName");
        const nm = (f.value || "").trim();
        if (!nm) { f.focus(); return; }
        // A name you have used before keeps its own kind. A new one comes
        // in as weights (a swim as distance) and carries its own little
        // weights/time switch until you tick a set, which is where V2.3
        // moved that choice from the foot of the page.
        const known = kindFor(nm, null);
        addExercise(nm, known ||
          (state.mode === "cardio" ? "distance_time" : "weight_reps"));
        f.value = "";
        render();
      });
      on("exName", "keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); document.getElementById("exAdd").click(); }
      });

      // The name is just a field. No prompt, no modal, no editor state —
      // a label you can only set at the start is a label you get wrong.
      on("labelIn", "input", (e) => { a.label = e.target.value.slice(0, 24); queueSync(); });
      on("noteIn", "input", (e) => { a.note = e.target.value.slice(0, 40); queueSync(); });

      on("finish", "click", async (e) => {
        if (doneSets(a) === 0) {
          state.lift.msg = "Tick at least one set before finishing.";
          const h = document.getElementById("liftHint");
          if (h) h.textContent = state.lift.msg;
          return;
        }
        e.target.disabled = true;
        stopTicking();
        const res = await syncLift(true);

        // A finish never fails. If the network is down, or the call errors
        // for any other reason, the workout is already on the phone and
        // marked finished — it goes up on the next load or reconnect. The
        // one thing that must never happen is a finished session held
        // hostage on a screen someone is trying to leave.
        if (res.offline || res.error) {
          state.lift.msg = "Saved on this phone. It will upload by itself.";
          state.view = "lift";
          state.lift.loaded = false;
          render();
          return;
        }
        const prs = Number(res.pr_count) || 0;
        state.lift.active = null;
        saveLocal();
        state.lift.msg = prs ? `Logged. ${prs} personal record${prs === 1 ? "" : "s"}.` : null;
        state.view = "lift";
        await loadLift();
        render();
        refresh();                       // the board now owes you Train minutes
      });

      on("scrap", "click", () => {
        if (!confirm(`Throw this ${state.mode === "cardio" ? "activity" : "workout"
          } away? It is not saved anywhere else.`)) return;
        stopTicking();
        state.lift.active = null;
        saveLocal();
        state.view = "lift";
        render();
      });
    }

    if (state.view === "detail") {
      // V2.1b. Editing a past workout reopens it in the same editor that
      // recorded it, rather than a second read-only one that would drift.
      on("editSession", "click", () => {
        const d = state.lift.detail;
        const byPos = new Map();
        for (const r of (d.sets || [])) {
          if (!byPos.has(r.position))
            byPos.set(r.position, { name: r.exercise, kind: r.kind || "weight_reps", sets: [] });
          byPos.get(r.position).sets.push({
            w: Number(r.weight) || 0, r: Number(r.reps) || 0,
            d: Number(r.distance) || 0, t: Number(r.seconds) || 0, on: false });
        }
        state.mode = d.mode === "cardio" ? "cardio" : "lift";
        state.seg  = state.mode === "cardio" ? "cardio" : "train";
        state.lift.active = {
          id: d.id, label: d.label || "", date: d.entry_date,
          startedAt: Date.now(), endedAt: Date.now(), pendingFinish: false,
          mode: state.mode, durOverride: Number(d.duration_min) || 0,
          ex: [...byPos.entries()].sort((x, y) => x[0] - y[0]).map(([, v]) => v),
        };
        state.lift.detail = null;
        saveLocal();
        state.view = "session";
        render();
      });

      on("delSession", "click", async () => {
        const s = state.lift.detail;
        if (!confirm("Delete this workout? Your Train minutes for that day go back down.")) return;
        const res = await call("app_lift_delete", {
          p_code: state.code, p_person: state.meId, p_session: s.id });
        if (res.error) { alert(res.error); return; }
        state.lift.detail = null;
        state.view = "lift";
        await loadLift();
        render();
        refresh();
      });
    }
  }

  // Exercise carries both halves: the steps entry and week charts that used
  // to be on the board, and the log that used to be its own screen.
  function wireExercise() {
    wireLift();
    if (state.range === "week") wireChart(state.seg);

    // A day at a time, from the log box itself. The graph can still jump
    // you to any day; this is for "yesterday", which is most of them.
    const stepDay = async (n) => {
      // V2.1b BUG FIX. The week was compared AFTER entryDate had already
      // moved, and weekBounds() falls back to mondayOf(entryDay()) — so the
      // test was always false, loadHistory never re-ran, and the chart kept
      // last week's bars under this week's label. Compare the two days
      // against each other, before anything is mutated.
      const from = entryDay();
      const next = shiftISO(from, n);
      if (next > todayISO()) return;
      state.entryDate = next === todayISO() ? null : next;
      state.msg = null;
      if (mondayOf(next) !== mondayOf(from)) {
        state.weekAnchor = mondayOf(next) === thisMonday() ? null : mondayOf(next);
        await loadHistory();
      }
      // Walking the day off the edge of the month on show moves the month.
      if (state.range === "month" && monthOf(next) !== monthOf(from)) {
        state.monthAnchor = monthOf(next) === monthOf(todayISO()) ? null : monthOf(next);
        await loadMonth();
      }
      render();
    };
    on("dPrev", "click", () => stepDay(-1));
    on("dNext", "click", () => stepDay(1));

    // Week or month. The month is fetched once per metric, on first ask.
    document.querySelectorAll("[data-range]").forEach((el) =>
      el.addEventListener("click", async () => {
        const v = el.dataset.range;
        if (v === state.range) return;
        state.range = v;
        try { localStorage.setItem("fhd.range", v); } catch {}
        render();
        if (v === "month" && !monthData(state.seg)) { await loadMonth(); render(); }
      }));

    // Every dot is a day, and tapping one selects it exactly as a bar does.
    document.querySelectorAll(".gcell[data-day]").forEach((el) =>
      el.addEventListener("click", () => {
        const iso = el.dataset.day;
        state.entryDate = iso === todayISO() ? null : iso;
        state.msg = null;
        render();
        document.getElementById("steps")?.focus();
      }));

    // The workout history folds. It is the longest thing on the page and
    // the least often wanted.
    on("foldHist", "click", () => {
      state.histOpen = !state.histOpen;
      try { localStorage.setItem("fhd.hist", state.histOpen ? "open" : "shut"); } catch {}
      render();
    });

    wireTemplate();
    wireRank();

    // V2.5. Rest and Rise: three scroll columns, the middle row wins.
    {
      const cols = [...document.querySelectorAll("[data-wheel]")];
      if (cols.length) {
        const ITEM = () => {
          const el = document.querySelector(".witem");
          return el ? el.getBoundingClientRect().height : 40;
        };
        // Setting scrollTop fires scroll events. Without this guard the
        // act of positioning the wheel on load reads back as the user
        // having chosen something, and saves it.
        let placing = true;
        let timer = null;

        const indexOf = (c) => Math.round(c.scrollTop / ITEM());
        const paint = (c) => {
          const at = indexOf(c);
          [...c.querySelectorAll(".witem")].forEach((el, i) =>
            el.setAttribute("aria-selected", String(i === at)));
        };
        const place = (c) => { c.scrollTop = Number(c.dataset.at || 0) * ITEM(); paint(c); };

        const save = async () => {
          const get = (n) => indexOf(cols.find((c) => c.dataset.wheel === n));
          const k = state.seg;
          const h12 = get("h") + 1, mi = get("m"), pm = get("ap") === 1;
          let v = ((pm ? (h12 === 12 ? 12 : h12 + 12) : (h12 === 12 ? 0 : h12)) * 60) + mi;
          // The 5am rule, unchanged: a bedtime after midnight belongs to
          // the evening it started, and is stored past 1440.
          if (k === "rest" && v < 5 * 60) v += 1440;
          await call("app_log", { p_code: state.code, p_person: state.meId,
            p_value: v, p_metric: M[k].key, p_date: nightDay(k), p_tz: deviceTZ() });
          await loadHistory();
          await refresh();
        };

        cols.forEach((c) => {
          place(c);
          c.addEventListener("scroll", () => {
            paint(c);
            if (placing) return;
            clearTimeout(timer);
            // Long enough that momentum has stopped and snap has landed.
            timer = setTimeout(save, 260);
          }, { passive: true });
          // Tapping a row is quicker than scrolling to it.
          c.querySelectorAll(".witem").forEach((el) =>
            el.addEventListener("click", () => {
              c.scrollTo({ top: Number(el.dataset.i) * ITEM(), behavior: "smooth" });
            }));
          // Arrow keys, for anyone on a laptop.
          c.addEventListener("keydown", (e) => {
            const d = e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0;
            if (!d) return;
            e.preventDefault();
            c.scrollTo({ top: Math.max(0, (indexOf(c) + d)) * ITEM(), behavior: "smooth" });
          });
        });
        requestAnimationFrame(() => requestAnimationFrame(() => { placing = false; }));
      }
    }

    on("stampNow", "click", async (e) => {
      e.target.disabled = true;
      const k = state.seg;
      const res = await call("app_stamp", {
        p_code: state.code, p_person: state.meId, p_metric: M[k].key, p_tz: deviceTZ() });
      if (res.error) { e.target.disabled = false; state.msg = res.error;
                       state.msgKind = "bad"; render(); return; }
      armUndo({ key: M[k].key, date: res.date,
                words: `${M[k].label} ${clockWords(res.value)} saved` });
      await loadHistory();
      await refresh();
    });

    // The twelve habits: one integer, one bit each, written on every tap.
    document.querySelectorAll("[data-habit]").forEach((el) =>
      el.addEventListener("click", async () => {
        const i = Number(el.dataset.habit);
        const m = me() || {};
        const cur = Number(entryDay() === todayISO()
          ? (m.items || 0) : (dayRecord("sleep").value || 0)) || 0;
        const next = cur ^ (1 << i);
        // Paint immediately: a checklist that waits for the network before
        // ticking feels broken even when it is working.
        el.classList.toggle("on");
        el.setAttribute("aria-pressed", String(!!((next >> i) & 1)));
        await call("app_log", { p_code: state.code, p_person: state.meId,
          p_value: next, p_metric: "sleep_items", p_date: nightDay("sleep"),
          p_tz: deviceTZ() });
        await loadHistory();
        await refresh();
      }));

    // The family block is fetched the first time it is opened, then kept.
    on("foldFam", "click", async () => {
      state.fam.open = !state.fam.open;
      try { localStorage.setItem("fhd.fam", state.fam.open ? "open" : "shut"); } catch {}
      render();
      if (state.fam.open) { await loadFamily(); render(); }
    });


    // Stepping weeks moves the selection with it. Otherwise the sheet under
    // the chart would still say "Today" while you are looking at a week that
    // does not contain today, and you would log into a bar you cannot see.
    const stepWeek = async (n) => {
      state.weekAnchor = shiftISO(weekBounds().start, n * 7);
      if (state.weekAnchor === thisMonday()) state.weekAnchor = null;
      state.entryDate = state.weekAnchor ? shiftISO(state.weekAnchor, 6) : null;
      state.msg = null;
      await loadHistory();
      render();
    };
    on("wPrev", "click", () => stepWeek(-1));
    on("wNext", "click", () => stepWeek(1));

    // A month at a time. The selection moves with it, like the week does,
    // so the log box never points at a day the grid isn't showing.
    const stepMonth = async (n) => {
      const d = new Date(monthBounds().first + "T00:00:00Z");
      const first = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1))
        .toISOString().slice(0, 10);
      if (first > monthOf(todayISO())) return;
      state.monthAnchor = first === monthOf(todayISO()) ? null : first;
      const b = monthBounds();
      state.entryDate = state.monthAnchor ? b.last : null;
      state.msg = null;
      render();
      await loadMonth();
      render();
    };
    on("mPrev", "click", () => stepMonth(-1));
    on("mNext", "click", () => stepMonth(1));

    // V2.1. The big number is the input. Show it formatted; edit it raw.
    const big = document.getElementById("steps");
    if (big && big.classList.contains("bigedit")) {
      big.addEventListener("focus", () => {
        big.value = big.dataset.raw || "";
        requestAnimationFrame(() => big.select());
      });
      big.addEventListener("keydown", (e) => { if (e.key === "Enter") big.blur(); });
      big.addEventListener("blur", async () => {
        const raw = (big.value || "").replace(/[^0-9]/g, "");
        if (raw === "" || raw === (big.dataset.raw || "")) {
          // Nothing changed: put the formatted number back and do nothing.
          big.value = big.dataset.raw ? num(Number(big.dataset.raw)) : "";
          return;
        }
        big.value = num(Number(raw));
        await saveNumber(raw);
      });
    }



    document.querySelectorAll('[data-edit="goal"]').forEach((el) =>
      el.addEventListener("click", () => {
        state.editMetric = el.dataset.metric || "steps";
        openEditor("goal");
      }));

    wireEditor();
  }

  // V1.7b. One save for all three metrics. Minutes used to be writable
  // only by the logger; now they can be typed, and a typed number wins.
  async function saveNumber(raw) {
    const k = state.seg;
    if (raw === "" || raw === undefined) return;
    // p_date is null for today on purpose. The server decides what "today"
    // means for this person; the phone only says which zone it is in. A page
    // that has been open since yesterday therefore cannot write yesterday.
    const res = await call("app_log", { p_code:state.code, p_person:state.meId,
      p_value:Number(raw), p_metric:M[k].key,
      p_date:state.entryDate || null, p_tz:deviceTZ() });
    state.msg = res.error ? res.error : "Saved. Your family can see it.";
    state.msgKind = res.error ? "bad" : "ok";
    if (!res.error) state.entryDate = null;
    if (state.range === "month") await loadMonth(true);
    await refresh();
    setTimeout(() => { state.msg = null; state.msgKind = null; }, 100);
  }

  async function saveLabel(next) {
    const from = state.lift.renameFrom;
    if (!from) return;
    const res = await call("app_lift_label", {
      p_code: state.code, p_person: state.meId,
      p_old: from, p_new: next, p_mode: state.mode });
    if (res.error) { alert(res.error); return; }
    state.lift.rename = null; state.lift.menu = null; state.lift.renameFrom = null;
    await loadLift();
    render();
  }

  async function openSession(id) {
    const res = await call("app_lift_detail", { p_code: state.code, p_session: id });
    if (res.error || !res.session) return;
    state.lift.detail = res.session;
    state.lift.from = "exercise";
    state.view = "detail";
    render();
  }

  async function openExercise(seg) {
    if (!state.meId) return;
    stopTicking();
    state.seg  = seg || "steps";
    state.mode = state.seg === "cardio" ? "cardio" : "lift";
    state.entryDate = null;
    state.lift.loaded = false;
    state.lift.labels = []; state.lift.sessions = [];
    state.lift.menu = null; state.lift.rename = null;
    loadLocal();
    state.view = state.seg === "sleep" ? "sleep" : "exercise";
    render();                 // paint immediately; the list can arrive after
    await loadHistory(); render();
    if (state.seg === "train" || state.seg === "cardio") { await loadLift(); render(); }
    if (state.range === "month") { await loadMonth(); render(); }
    if (state.fam.open) { await loadFamily(); render(); }
  }

  /* ---------- views ------------------------------------------------ */
  function landing() {
    return `
      <header class="masthead">

          <option value="America/New_York">Eastern (US)</option>
          <option value="America/Chicago">Central (US)</option>
          <option value="America/Denver">Mountain (US)</option>
          <option value="America/Los_Angeles">Pacific (US)</option>
          <option value="Europe/London">London</option>
          <option value="Asia/Karachi">Karachi</option>
          <option value="Asia/Dubai">Dubai</option>
          <option value="Asia/Kolkata">India</option>
        </select>
        <button class="btn-quiet" id="create" style="width:100%;margin-top:10px;padding:13px">
          Create the group</button>
      </section>
